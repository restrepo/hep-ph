<script>
const RAW = {"n":[{"id":"3226582","arxiv":"2611.12148","title":"SuperWIMPs in the Kination Era: Imprints on $N_{\\rm eff}$ and CMB Spectral Distortions","first":"Bélanger","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 13 network papers: [[3221883]], [[3205155]], [[1982681]], [[2962467]], [[2940359]], [[1692611]]…. Closest of your papers: [[1455793]] (coupling 0.03, 9 shared references). Closest network paper: [[2962467]] (coupling 0.16, 25 shared references). Shared topics: scotogenic model, inert doublet, relic density, dark matter candidate.","score":54.1,"rank":1,"section":"new","parts":[1.0,0.1,0.47,0.0,0.91],"abstract":"We investigate how the late-time decays of unstable particles into dark matter and neutrinos can leave measurable imprints on both cosmological observables and collider experiments. We study this mechanism within the scotogenic model, where the lightest singlet fermion $N_1$ serves as the dark matter candidate and is produced via the late decay of the lightest inert doublet scalar via the superWIMP mechanism. By incorporating a kination-dominated era in the early Universe, the altered expansion rate allows to match the observed $N_1$ relic density in parameter regions that would be underabundant in standard cosmology. The energy exchange between the injected neutrinos and photons resulting from the late-time decay can produce CMB spectral $μ$-distortions, detectable shifts in the effective number of relativistic species $N_{\\rm eff}$, or both simultaneously. Concentrating on the lightest component of inert doublet scalars with masses between $200$ and $500~\\text{GeV}$, we find that these cosmological signals are accompanied by complementary signatures accessible at the LHC. Although our analysis is derived within the scotogenic framework, our findings apply more broadly to scenarios in which the unstable particle undergoes late-time out-of-equilibrium decay to produce dark matter and non-thermal neutrinos, offering how future CMB measurements and collider searches can jointly probe dark matter production and the early Universe's thermal history.","authors":"Geneviève Bélanger, Abhishek Roy","nlinked":118,"nref":121,"src":"INSPIRE","html":true},{"id":"3226471","arxiv":"2611.10465","title":"NuSTEC Review: Current Experimental and Theoretical Challenges of Neutrino-Nucleus Scattering","first":"Furmanski","nauth":33,"year":2026,"cites":0,"role":"today","note":"Cites 4 network papers: [[2917228]], [[2102705]], [[2824738]], [[2626424]]. Closest of your papers: [[1854224]] (coupling 0.01, 3 shared references). Closest network paper: [[2102705]] (coupling 0.19, 154 shared references).","score":40.4,"rank":2,"section":"cross","parts":[0.91,0.02,0.53,0.0,0.0],"abstract":"The precise measurement of neutrino properties is among the highest priorities in fundamental particle physics, involving many experimental and theoretical efforts worldwide. Since the experiments rely on the interactions of neutrinos in the nuclear environment, the planned advances in the scope and precision of these experiments require a commensurate effort in understanding and modeling the hadronic and nuclear physics of these interactions, as incorporated in neutrino event generators. This modeling is essential to every phase of the experimental analyses, and the theoretical uncertainties play an important role in interpreting experimental results. In this Review of current challenges, we summarize the open questions in neutrino-nucleus interactions at GeV-scale energies, and discuss in detail the potential impacts of these unknowns on the measurement of neutrino properties, using the determination of oscillation parameters as a central example. After an Executive Summary and a concise Overview of the issues, we address how the neutrino event generators treat these challenges, how electron-nucleus interactions can help understanding these challenges and the important unanswered questions for each underlying physics process---from quasi-elastic to deep-inelastic scattering. Across every topic, we find that current challenges can be met only through active support and collaboration among specialists in strong interactions and electroweak physics, including theorists and experimentalists from both the nuclear and high-energy physics communities.","authors":"A. P. Furmanski, J. G. Morfín, L. Alvarez-Ruso, A. M. Ankowski, A. Ashkenazi, M. Sajjad Athar, S. Dolan, S. Dytman, S. Gardiner, R. González-Jiménez, R. J. Hill, M. Hostert, J. Isaacson, N. Jachowicz, M. Kabirnezhad, T. Katori, S. R. Klein, F. Kling, M. Martini, G. D. Megias, B. A. Messerly, K. Niewczas, A. Nikolakopoulos, J. Nowak, J. M. Paley, V. Pandey, A. Papadopoulou, L. Pickering, N. Rocco, J. T. Sobczyk, J. E. Sobczyk, C. Thorpe, C. Wret","nlinked":810,"nref":955,"src":"INSPIRE","html":true},{"id":"3226588","arxiv":"2611.12234","title":"Constraints on the Real Singlet Scalar Dark Matter Model from Higgs Self-Couplings","first":"Luo","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[3193100]], [[1724453]]. Closest of your papers: [[1365306]] (coupling 0.03, 3 shared references). Closest network paper: [[2628447]] (coupling 0.07, 6 shared references). Shared topics: relic density, singlet scalar, indirect detection, direct detection, dark matter model.","score":37.6,"rank":3,"section":"new","parts":[0.7,0.08,0.2,0.0,0.78],"abstract":"Taking the real singlet scalar dark matter model as a representative test case, we examine the constraints imposed on the model's parameter space by Higgs trilinear coupling measurements and perturbative unitarity requirements. For the low dark matter mass regime, the constraining strength delivered by the current highest-precision $κ_3$ measurement is notably inferior to the exclusion limit derived from perturbative unitarity requirements, while the perturbative unitarity bound itself remains considerably less restrictive than the constraints extracted from the extant experimental upper limit on the Higgs invisible decay branching ratio $\\mathrm{BR}_{\\mathrm{inv}} \\leq 0.107$. Both the coupling modifiers $κ_3$ and $κ_4$ exhibit a well-defined decoupling behavior, with their respective magnitudes monotonically decreasing as the dark matter mass $m_S$ increases. As a direct consequence, the corrections to both couplings asymptotically approach zero for dark matter masses in excess of 60 TeV, when the parameter $a_2$ remains within its perturbative validity domain. Neither existing collider measurements of the Higgs trilinear coupling nor measurements targeted for planned future collider facilities possess the requisite sensitivity to impose more stringent constraints on the model's viable parameter space than the well-established bounds derived from experimental probes of dark matter relic density, invisible Higgs decay signatures, dark matter direct detection, and dark matter indirect detection. Nevertheless, under the scenario that the experimental measurement uncertainty of $κ_3$ reaches the $\\mathcal{O}(0.1\\%)$ scale or lower, non-negligible constraints acting on a subset of the large mass parameter space associated with the WIMP dark matter scenario can be expected.","authors":"Hao-Yu Luo, Kun-Peng Chen, Han Hu, Yun Wei, Ming Zhong","nlinked":66,"nref":69,"src":"INSPIRE","html":true},{"id":"3214429","arxiv":"2610.16968","title":"Self-Interacting Dark Matter: From Particle Physics Theories to Structure Formation Simulations","first":"Rosenlyst","nauth":10,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[3070028]], [[3128103]]. Also cites widely used network papers: [[1518747]], [[2817040]]. Closest of your papers: [[1679809]] (coupling 0.04, 6 shared references). Closest network paper: [[2051195]] (coupling 0.12, 140 shared references).","score":35.0,"rank":4,"section":"replacement","parts":[0.73,0.11,0.34,0.0,0.07],"abstract":"We establish a unified theory-to-simulation framework for self-interacting dark matter (SIDM) that integrates three components: (i) a comprehensive, self-contained treatment of its particle-physics foundations and a broad range of model classes; (ii) a systematic, quantitative mapping from microscopic dark-sector physics to structure-formation simulation inputs through explicit expressions and numerical prescriptions; and (iii) the development, implementation, and validation of a broad suite of SIDM algorithms and a dedicated DM decay module in the moving-mesh code AREPO-2. Under (i), we detail the particle content, symmetries, interactions, production mechanisms, and constraints of a broad landscape of elementary and composite SIDM models, and present representative viable benchmark models. Under (ii), the mapping specifies cosmological initial conditions, internal-state masses and populations, reaction networks, velocity- and angle-dependent cross sections, dissipative energy loss, and decay rates and recoil kinematics. We then apply this mapping to a broad range of SIDM model classes. Under (iii), we implement and validate SIDM algorithms with constant and velocity-dependent cross sections, covering isotropic and anisotropic scattering, multi-state elastic and inelastic reactions, and dissipative processes, alongside a dedicated DM decay module in AREPO-2. We validate the implementations through beam-lattice deflection, thermalization and decay tests, isolated-halo gravothermal core-collapse simulations, and cosmological box and zoom-in simulations. The results recover analytical predictions and published benchmarks and demonstrate agreement across numerical schemes. Our theory-to-simulation framework serves as a cross-disciplinary reference and a practical bridge between SIDM particle physics and simulations of nonlinear structure formation.","authors":"Martin Rosenlyst, Vinh Tran, Oliver Zier, Xuejian Shen, Mark Vogelsberger, Thejs Brinckmann, Mads T. Frandsen, Jesús Zavala, Frederik Holt Dihver Christensen, Mikkel Theiss Kristensen","nlinked":600,"nref":661,"src":"INSPIRE","html":true},{"id":"3148045","arxiv":"2604.20340","title":"Exact baryon-meson relation for $b \\to s ν\\barν$","first":"Kitahara","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[2593330]], [[3193100]]. Closest of your papers: [[1671831]] (coupling 0.01, 1 shared references). Closest network paper: [[2813804]] (coupling 0.22, 20 shared references).","score":34.6,"rank":5,"section":"replacement","parts":[0.7,0.02,0.64,0.0,0.0],"abstract":"We derive an exact relation among the normalized branching fractions of $Λ_b \\to Λν\\barν$ and $B \\to K^{(\\ast)} ν\\barν$, within the lepton-number-conserving effective Hamiltonian in which only active neutrinos contribute to the invisible final state. Although the effective Hamiltonian contains 18 independent Wilson coefficients, the three normalized rates depend on only two independent combinations of them, leading to an exact algebraic relation. Remarkably, the central values of the coefficients of this baryon-meson relation are close to $1/4$ and $3/4$, which appear in the heavy-to-heavy $b\\to c$ semileptonic sum rule among the branching fractions of $Λ_b \\to Λ_c τ\\barν$ and $B \\to D^{(\\ast)}τ\\barν$. Once the decay rate of $B \\to K^{\\ast} ν\\barν$ is measured, the decay rate of $Λ_b \\to Λν\\barν$ can be determined in a model-independent manner for new-physics scenarios involving only active neutrino interactions, thereby providing a clean target prediction for future experiments. This clearly demonstrates that observables in baryonic and mesonic $b \\to s ν\\barν$ transitions will serve as a compact consistency test and a powerful probe for discriminating among new-physics scenarios.","authors":"Teppei Kitahara, Manas Kumar Mohapatra, Kota Sasaki","nlinked":78,"nref":79,"src":"INSPIRE","html":true},{"id":"3200925","arxiv":"2609.06734","title":"Inverse-seesaw and inflationary scale relations in a supersymmetric 331 model from an SU(6) GUT model","first":"Khan","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[707996]], [[1290535]]. Closest of your papers: [[611590]] (coupling 0.07, 8 shared references). Closest network paper: [[2875244]] (coupling 0.08, 10 shared references).","score":33.9,"rank":6,"section":"replacement","parts":[0.7,0.2,0.24,0.0,0.0],"abstract":"We propose a $N=1$ supersymmetric $SU(6)$ theory with an intermediate $(SU(3)_C\\times SU(3)_L\\times U(1)_X)$ phase, in which common fields and operators relate the neutrinos, gauge mediation, unification, and symmetry-breaking sectors. The antisymmetric Dirac matrix of the inverse-seesaw sector has rank two, yielding one vanishing light-neutrino mass at leading order. A higher-dimensional symmetry-breaking correction lifts this zero mode through its projection onto the left and right null vectors of the Dirac matrix, leading to a quartic suppression in the ratio of the intermediate and ultraviolet scales. Complete unified messenger multiplets preserve the relative one-loop gauge coupling evolution while modifying the unified coupling. When the same supersymmetry-breaking spurion generates the singlet lepton-number-violating parameter, an analytical relation emerges between the messenger scale, the lepton-number mediator scale, and the unified coupling. The two-loop gauge evolution remains perturbative for the assumed heavy-threshold spectrum. In the inflationary sector, the scalar-amplitude normalization determines the coupling governing both the inflationary potential and the radial scalar mass in the broken vacuum. The physical scalar directions transverse to the inflaton are stable within the neutral supergravity subspace, while the combined inflationary and gauge-mediated conditions imply a significant sensitivity of the symmetry-breaking vacuum. An examination of the allowed operators shows that additional ultraviolet conditions are required to obtain the observed active-neutrino mixing, suppress competing lepton-number-violating terms, and complete the heavy-field spectrum. Our analysis establishes the analytical scale relations among the neutrino, messenger, unification, and inflationary sectors and identifies the conditions necessary for their simultaneous realization.","authors":"Imtiaz Khan, Tianjun Li","nlinked":84,"nref":84,"src":"INSPIRE","html":true},{"id":"3158523","arxiv":"2605.21908","title":"Semileptonic sum rules in heavy-to-light charm decays","first":"Endo","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[1710056]], [[2593330]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.00, 1 shared references). Closest network paper: [[2790921]] (coupling 0.09, 6 shared references).","score":29.5,"rank":7,"section":"replacement","parts":[0.72,0.01,0.27,0.0,0.0],"abstract":"We investigate semileptonic sum rules in heavy-to-light charm decays, motivated by analogous relations in $b \\to c$ and $b \\to u$ transitions. Focusing on the $c \\to d\\overline{\\ell}ν$ decays, $D \\to π\\overline{\\ell}ν$, $D \\to ρ\\overline{\\ell}ν$, and $Λ_c \\to n\\overline{\\ell}ν$, we examine a relation among their lepton-flavor universality ratios $R_H^{μe}$. Although the charm sum rule is less precise than the relations in bottom-hadron decays, current low-energy and high-$p_T$ constraints on new physics restrict the actual deviation from the relation to below the percent level. The relation can therefore provide a useful consistency check of charm semileptonic measurements. As an application, we derive a prediction for the yet-unmeasured ratio $R_n^{μe}\\,$ in $Λ_c \\to n\\overline{\\ell}ν$.","authors":"Motoi Endo, Syuhei Iguro, Satoshi Mishima, Takeru Uchiyama, Ryoutaro Watanabe","nlinked":57,"nref":61,"src":"INSPIRE","html":true},{"id":"3226389","arxiv":"2611.10218","title":"$B\\to$ invisible decays as probes of light new physics","first":"Novoa-Brunet","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2813804]]. Closest of your papers: [[1116165]] (coupling 0.03, 1 shared references). Closest network paper: [[2813804]] (coupling 0.22, 11 shared references).","score":28.7,"rank":8,"section":"new","parts":[0.45,0.08,0.62,0.0,0.13],"abstract":"Rare $B$ decays with missing energy probe heavy particles contributing to $b\\to sν\\barν$ and new light states produced on shell. We discuss both possibilities in light of the Belle II excess in $B^+\\to K^+\\Emiss$. Fits to the missing-mass distribution favour a two-body contribution near $2.1\\,\\GeV$, while scalar and fermion pairs of masses around $0.4$-$0.6\\,\\GeV$ remain viable alternatives. Extracting their couplings would profit from additional measurements, including the $B\\to K^*\\Emiss$ rate and longitudinal $K^*$ polarization, together with invisible $B_s$ decays which constrain scalar-pair interactions. We discuss how an aligned Higgsed $U(1)'$ model can realize the single-vector explanation through a vector-like top partner. Loop-induced electroweak mixing makes visible $Z'$ decays unavoidable, requiring an additional invisible channel to evade dimuon searches. We show that a light dark fermion can provide this channel and also account for the observed dark matter abundance through resonant thermal annihilation.","authors":"Martín Novoa-Brunet","nlinked":28,"nref":28,"src":"INSPIRE","html":true},{"id":"3226515","arxiv":"2611.11694","title":"Nanohertz gravitational waves and asymmetric dark matter from a supercooled dark sector phase transition","first":"Cho","nauth":2,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Choi. Cites 1 network paper: [[3193100]]. Closest of your papers: [[1854224]] (coupling 0.01, 1 shared references). Closest network paper: [[2862278]] (coupling 0.08, 19 shared references). Shared topics: relic abundance.","score":28.2,"rank":9,"section":"new","parts":[0.45,0.04,0.22,0.5,0.29],"abstract":"We study the connection between asymmetric dark matter and nanohertz gravitational waves from a supercooled first-order phase transition in a classically conformal dark sector. The dark sector contains a real scalar, a complex scalar and a Dirac fermion, whose mass arises from radiative symmetry breaking. An additional Affleck--Dine condensate generates a fermion asymmetry and heats the dark bath before nucleation. The conserved dark charge fixes the asymmetry between fermions and antifermions, while entropy production during delayed visible-sector reheating dilutes the relic and determines the redshift of the gravitational-wave spectrum. We calculate the thermal nucleation rate in a three-dimensional effective theory with finite-density corrections, next-to-leading-order contributions and fluctuation determinants (NLOdet). We follow the coupled thermal evolution of the dark and visible sectors. For a benchmark chosen to match the observed dark-matter abundance, the transition completes at MeV-scale temperatures and produces a nanohertz signal under the adopted dynamical and thermal assumptions. We compare the predicted collision-dominated gravitational-wave spectra with free-spectrum posteriors from pulsar timing arrays. For a benchmark point and variations of the dark-sector parameters, the gravitational-wave spectra and dark matter relic abundances are compared, and compatibility with Big Bang nucleosynthesis is assessed.","authors":"Wonsub Cho, Ki-Young Choi","nlinked":104,"nref":104,"src":"INSPIRE","html":true},{"id":"3172549","arxiv":"2606.25027","title":"Fermion mass relations in one-parameter modular models","first":"Chuliá","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2762216]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1249404]] (coupling 0.02, 1 shared references). Closest network paper: [[3154793]] (coupling 0.14, 9 shared references). Shared topics: mass matrix, fermion mass.","score":26.6,"rank":10,"section":"replacement","parts":[0.48,0.04,0.39,0.0,0.25],"abstract":"Modular flavour symmetries provide a possible organizing principle for the Standard Model Yukawa sector, by replacing generic couplings with a potentially small number of modular forms controlled by a single complex modulus. We study the extreme limit of this idea: One-Parameter Models, in which each charged-fermion mass matrix is fixed by a single modular invariant contraction. We develop a systematic method to construct such models, showing that the One-Parameter Model requirement is already highly constraining at the level of possible fermion hierarchies. In a concrete realization, the charged-lepton and down-quark sectors are controlled by the common modulus, leading to exact mass relations at the flavour scale, $m_s^5 = 2\\sqrt{2}\\,m_d^3m_b^2, \\qquad m_μ^3 = \\sqrt{2}\\,m_e m_τ^2, \\qquad m_s^2m_τ= \\sqrt{2}\\,m_e m_b^2$. We show that, once renormalization-group evolution and selective supersymmetric threshold effects are included, these high-scale relations can be made compatible with low-energy charged-fermion data. Our results provide a working proof of principle for One-Parameter Models and point towards a possible route to the flavour puzzle through highly constrained constructions.","authors":"Salvador Centelles Chuliá, Xueqi Li, Xiang-Gan Liu, Omar Medina, J. T. Penedo","nlinked":28,"nref":29,"src":"INSPIRE","html":true},{"id":"3187937","arxiv":"2608.05096","title":"High energy probes of Higgs self-coupling via $W$ boson fusion at future lepton colliders","first":"Subba","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[468209]] (coupling 0.05, 3 shared references). Closest network paper: [[2183252]] (coupling 0.09, 9 shared references).","score":23.8,"rank":11,"section":"replacement","parts":[0.45,0.14,0.25,0.0,0.0],"abstract":"We investigate the sensitivity to the Higgs self-coupling through $W$ boson fusion di-Higgs production at CLIC with a center-of-mass energy of $\\sqrt{s}=3$~TeV. We study the interplay between the Higgs self-coupling modifier ($κ_λ$) and Higgs-gauge boson coupling modifiers ($κ_{V}$ and $κ_{2V}$) within the $κ$ framework. To enhance the separation between signal and background, we develop a graph neural network (GNN) based classifier that achieves a signal significance of $\\mathscr{Z}\\approx 20~σ$ at $5~\\mathrm{ab}^{-1}$, substantially exceeding projected HL-LHC sensitivity. Our results demonstrate that high-energy lepton colliders, combined with graph-based machine learning, provide excellent sensitivity to the Higgs self-coupling and offer a powerful probe of new physics in the electroweak sector, potentially disentangling underlying SMEFT-like and HEFT-like structures.","authors":"Amir Subba, Hrishikesh Deka, Subhaditya Bhattacharya, Abhik Sarkar","nlinked":41,"nref":47,"src":"INSPIRE","html":true},{"id":"3226573","arxiv":"2611.11983","title":"Axion-Photon Conversion in Variable-Domain Magnetic Fields and the Highest-Energy Photons from GRB 221009A","first":"Garai","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1607572]] (coupling 0.05, 4 shared references). Closest network paper: [[2703113]] (coupling 0.07, 10 shared references).","score":22.9,"rank":12,"section":"new","parts":[0.45,0.14,0.2,0.0,0.0],"abstract":"We investigate photon-ALP conversion as a simultaneous explanation of the ultra-high-energy photons observed from GRB 221009A by LHAASO and of the $\\sim300$ TeV photon reported by Carpet-3. We model the magnetic field of the host galaxy as a set of domains with randomly oriented field directions and variable domain lengths, and propagate the photon-ALP system through the host galaxy, the intergalactic medium and the Milky Way. Fitting the combined LHAASO and Carpet-3 spectra, we find that a broad distribution of domain lengths raises the photon survival probability at the highest energies and accommodates the Carpet-3 point with photon-ALP conversion alone. The best fit, $m_a=3.85\\times10^{-7}$~eV and $g_{aγ}=3.07\\times10^{-11}\\,\\mathrm{GeV}^{-1}$, lies below the CAST bound, and parts of the $1σ$ and $2σ$ regions are also compatible with it.","authors":"Rick Sundar Garai, Tanmoy Kumar, Sourov Roy","nlinked":65,"nref":76,"src":"INSPIRE","html":true},{"id":"3226719","arxiv":"2611.12793","title":"Electroweak Parton Distribution Functions for Future Lepton Colliders","first":"Han","nauth":6,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1866947]]. Closest network paper: [[1866947]] (coupling 0.14, 22 shared references).","score":21.7,"rank":13,"section":"new","parts":[0.45,0.0,0.4,0.0,0.0],"abstract":"At future high-energy colliders, such as a multi-TeV muon collider or the high-energy stages of an $e^+e^-$ linear collider, collinear radiation of electroweak gauge bosons becomes a dominant phenomenon. In this regime, many key processes are primarily initiated by photons and gauge bosons originating from lepton splittings. Electroweak Parton Distribution Functions (EW PDFs) provide an appropriate framework to describe these interactions by resumming large collinear logarithms arising from all possible Standard Model splittings, thereby enabling a partonic interpretation of the hard scattering. The formalism is particularly suitable for studying new physics beyond the Standard Model in the electroweak sector at higher scales. In this paper, we present the implementation of the EW PDF formalism within the Monte Carlo event generator \\texttt{Whizard}. We demonstrate several applications of this framework and analyze its interplay with full fixed-order calculations as well as the purely kinematic Effective Weak Boson Approximation. We highlight scenarios where the EW PDF approach is especially useful for phenomenology and physics-potential studies for future lepton colliders. The EW PDF formalism is a vital step towards the ``electroweak jet regime'' where electroweak particles behave similarly to QCD jets.","authors":"Tao Han, Wolfgang Kilian, Yang Ma, Krzysztof Mękała, Jürgen Reuter, Keping Xie","nlinked":68,"nref":73,"src":"INSPIRE","html":true},{"id":"3226646","arxiv":"2611.12749","title":"A possible signature of neutrino spin precession in the J-PARC muon $g-2$ experiment","first":"Carneiro","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1287034]]. Closest of your papers: [[1708009]] (coupling 0.02, 1 shared references). Closest network paper: [[2873857]] (coupling 0.09, 4 shared references).","score":21.2,"rank":14,"section":"new","parts":[0.45,0.05,0.26,0.0,0.0],"abstract":"We examine a possible signature of the neutrino angular-momentum contribution to the muon magnetic anomaly measurement in the J-PARC E34 experiment. In previous papers we argued that the angular momentum carried by the unobserved neutrino pair may leave an uncertainty in the anomaly inferred from the time modulation of detected positrons. At Fermilab the highly relativistic muons make the forward-emission approximation suitable for this estimate. The lower muon momentum at J-PARC requires the decay kinematics to be treated explicitly. We integrate the longitudinal momentum of the neutrino pair using the positron energy distribution and asymmetry derived from the theoretical weak-decay spectrum, and the same event-counting weight $N(E)A(E)$ is employed for both experiments. For positron energies between $1.5$ and $2.9$ GeV at Fermilab and between $200$ and $275$ MeV at J-PARC, the proposed correction is smaller at J-PARC by $0.415\\pm0.176$ ppm, when the most optimistic E34 precision is assumed. The expected difference amounts to $2.36$ standard deviations if the future measurement is centred on this value. The calculation thus identifies an experimental comparison which may test the proposed effect independently of the hadronic contribution to the Standard Model prediction. We also examine the possibility of testing the effect by comparing measurements at two different muon momenta. With a fixed positron energy threshold of 200 MeV, the maximum sensitivity is obtained at a muon beam energy of 245 MeV. The predicted difference relative to the nominal J-PARC configuration has significance of $4.88σ$ for the most optimistic experimental sensitivity.","authors":"S. Carneiro, F. C. Sobrinho","nlinked":16,"nref":21,"src":"INSPIRE","html":true},{"id":"3226343","arxiv":"2611.10075","title":"Phenomenological explorations of a quasi-degenerate $Z'$ boson","first":"Kim","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1755250]] (coupling 0.02, 2 shared references). Closest network paper: [[2799066]] (coupling 0.05, 4 shared references).","score":19.8,"rank":15,"section":"new","parts":[0.45,0.06,0.16,0.0,0.0],"abstract":"We do a general model-independent phenomenological analysis of the curious case of a $Z'$ boson with mass close to that of the Standard Model (SM) $Z$ boson. From tree-level calculation alone we show that presence of such a quasi-degenerate or `practically' degenerate $Z'$ boson affects both the cross-section and forward-backward asymmetry of the process $e^+ e^- \\to f \\bar{f}$ where $f$ (with $f\\neq e^-$) can be a lepton or quark. Most importantly the effect on forward-backward asymmetry is found to be more prominent away from the $Z$-pole. We provide constraints on such a $Z'$ from the measurement of $N_ν$, the number of light neutrino species.","authors":"C. S. Kim, Donghun Lee, Gyeonghyun Min, Sechul Oh, Dibyakrupa Sahoo","nlinked":47,"nref":48,"src":"INSPIRE","html":true},{"id":"3226664","arxiv":"2611.12630","title":"Angular analysis of the purely baryonic decays $Λ_b^0\\to n p\\bar p$ and $Λ_b^0\\toΛp\\bar p$","first":"Geng","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[1862925]] (coupling 0.03, 2 shared references).","score":18.8,"rank":16,"section":"new","parts":[0.48,0.02,0.09,0.0,0.0],"abstract":"An angular analysis of the purely baryonic decays $Λ_b^0\\to np\\bar p$ and $Λ_b^0\\toΛp\\bar p$ is presented within a phenomenological generalized-factorization model. Within this model, two current contributions leading to the same final state are combined coherently. Pair-angle distributions, forward-backward hemisphere asymmetries, and Legendre moments are calculated in both channels, together with the polarization of the produced $Λ$ for an unpolarized parent. For the neutron channel, the full-region forward-backward asymmetries are $4.46\\times10^{-4}$ in the $n\\bar p$ frame and $0.856$ in the $p\\bar p$ frame at $N_c^{\\mathrm{eff}}=3$ and zero additional relative phase. From mass-bin integration, the small first asymmetry is found to arise from compensation between signed contributions from different regions. In the $Λ$ channel, the angular distributions are modified by the selection $m(p\\bar p)<2.85\\,\\mathrm{GeV}$, and the rate-weighted longitudinal polarization along the $Λ$ flight direction is shifted from $-0.803$ to $-0.954$. These results show how angular and spin observables depend on the relative current contributions and the selected phase-space region. The model-dependent analysis is intended as a first step toward understanding the dynamics of these decays and as a basis for further theoretical studies and comparisons with measurements.","authors":"Chao-Qiang Geng, Chao Han","nlinked":29,"nref":30,"src":"INSPIRE","html":true},{"id":"3127633","arxiv":"2603.06934","title":"Lepton Mixing from a Lattice Flavon Model: A Two-Branch Octant-delta Prediction","first":"Barger","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[509514]] (coupling 0.07, 3 shared references). Closest network paper: [[2762216]] (coupling 0.12, 24 shared references). Shared topics: neutrino mass, neutrino mixing angle, mass matrix.","score":18.8,"rank":17,"section":"replacement","parts":[0.06,0.21,0.35,0.0,0.53],"abstract":"We extend the single-flavon $B$-lattice Froggatt-Nielsen (FN) framework, previously applied to quark masses and CKM mixing, to the lepton sector. The same $B$-lattice power structure ($ε\\equiv 1/B\\simeq 0.19$) generates charged-lepton mass hierarchies and a normal-ordered neutrino spectrum; large neutrino mixing angles require an additional mu-tau reflection symmetry of the neutrino mass matrix, which fixes the atmospheric angle to $45^\\circ$ and the neutrino-sector Dirac phase to $δ_ν=270^\\circ$ exactly while leaving the reactor angle, generated at $\\mathcal{O}(ε)$, free. The Pontecorvo-Maki-Nakagawa-Sakata (PMNS) matrix factorizes as $U_{\\rm PMNS}=U_e^\\dagger U_ν$, with near-tribimaximal $U_ν$ corrected by small charged-lepton rotations whose $12$ and $23$ phases are aligned. A single interference relation expresses the observed Dirac phase $δ$ as the maximal neutrino phase shifted by a calculable charged-lepton correction, and correlates the sign of that shift with the atmospheric octant; this produces a two-branch prediction in the $(θ_{23},δ)$ plane: a lower-octant branch with $θ_{23}\\approx 44^\\circ$, $δ\\approx 260^\\circ$, and an upper-octant branch with $θ_{23}\\approx 46^\\circ$, $δ\\approx 275^\\circ$. The lower octant contains the strict single-source point of the flavon phase. Both branches place $δ$ within about $15^\\circ$ of $270^\\circ$, i.e., near-maximal leptonic CP violation, favored by T2K; a Dirac phase in the first or second quadrant, or more than about $40^\\circ$ from maximal, would exclude the framework. The Jarlskog invariant $J_{\\rm CP}\\simeq -0.033$ is nearly branch-independent; only precision measurements of the atmospheric octant and Dirac phase at DUNE, Hyper-Kamiokande, IceCube, and JUNO can distinguish the two branches.","authors":"Vernon Barger","nlinked":40,"nref":43,"src":"INSPIRE","html":true},{"id":"3226580","arxiv":"2611.12253","title":"NLO QCD corrections to $W^{+}$-boson decays into doubly heavy baryons","first":"Ma","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[2855387]] (coupling 0.01, 2 shared references). Closest network paper: [[1710056]] (coupling 0.03, 11 shared references).","score":18.3,"rank":18,"section":"new","parts":[0.45,0.04,0.09,0.0,0.0],"abstract":"The next-to-leading-order (NLO) QCD corrections have been investigated for the production of doubly heavy baryons via the inclusive $W^{+}$-boson decays $W^{+}\\toΞ_{cc}+\\bar{c}+\\bar{s}+X$ and $W^{+}\\toΞ_{bc}+\\bar{b}+\\bar{s}+X$ within the nonrelativistic QCD framework. The decay widths, the kinematic distributions, and the uncertainties induced by the heavy-quark masses and the renormalization scale have been analyzed for both the color-antitriplet ($\\bar{\\mathbf{3}}$) and the color-sextet ($\\mathbf{6}$) $S$-wave states. With the central input parameters $m_{c}=1.8~\\mathrm{GeV}$ and $m_{b}=5.1~\\mathrm{GeV}$, the $K$ factors are $2.27$ for $Ξ_{cc}$ and $2.95$ for $Ξ_{bc}$, i.e., the NLO corrections increase the corresponding LO widths by about $127\\%$ and $195\\%$, which shows that the NLO corrections are indispensable for quantitative predictions. The individual-channel $K$ factors range from $1.94$ to $5.53$, with the largest one occurring for $Ξ_{bc}$ in the $[{}^{3}S_{1}]_{\\mathbf{6}}$ channel. The distributions show that the NLO corrections enhance the low invariant-mass region and shift the baryon energy spectrum toward smaller energy fractions. With $Γ_{W}=2.085~\\mathrm{GeV}$, the inclusive branching ratios are $8.86\\times10^{-5}$ and $3.63\\times10^{-6}$ for $Ξ_{cc}$ and $Ξ_{bc}$, respectively, which provide an NLO benchmark for future experimental searches.","authors":"Hong-Hao Ma, Xu-Chang Zheng, Juan-Juan Niu, Xing-Gang Wu","nlinked":75,"nref":77,"src":"INSPIRE","html":true},{"id":"3226466","arxiv":"2611.11246","title":"Direct Light-Cone Reconstruction of the $B$-Meson Shape Function in HQET","first":"Xiong","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1708009]] (coupling 0.02, 1 shared references). Closest network paper: [[3214449]] (coupling 0.02, 1 shared references).","score":18.0,"rank":19,"section":"new","parts":[0.45,0.05,0.04,0.0,0.0],"abstract":"The $B$-meson shape function encodes the nonperturbative residual-momentum dynamics of the heavy quark within heavy quark effective theory (HQET). From a Wilsonian perspective, HQET provides a natural framework for lattice calculations when the heavy quark mass is comparable to or exceeds the inverse lattice spacing. Motivated by this observation, we introduce a $B$-meson quasi-shape function directly in HQET and calculate its one-loop matching to the light-cone shape function, avoiding an intermediate matching step involving a full-QCD light-cone distribution. We determine the one-loop renormalization kernels and matching coefficients in both the $\\overline{\\mathrm{MS}}$ and regularization-independent momentum-subtraction (RI/MOM) schemes for the quasi-shape function, while keeping the light-cone shape function in the $\\overline{\\mathrm{MS}}$ scheme. The matching coefficients are obtained at leading power in the large-$v^z$ expansion and are independent of the infrared regulator. Our results provide the perturbative ingredients for a direct lattice HQET determination of the $B$-meson shape function.","authors":"Ao-Sheng Xiong, Shu-Man Hu, Ji Xu, Fu-Sheng Yu, Shuai Zhao","nlinked":47,"nref":47,"src":"INSPIRE","html":true},{"id":"3226331","arxiv":"2611.10204","title":"Real Intermediate States in Dark Matter Freeze-In from First Principles: Single Mediator","first":"Brirup","nauth":4,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Klasen. Also cites widely used network papers: [[1518747]]. Closest of your papers: [[2859009]] (coupling 0.05, 7 shared references). Closest network paper: [[3121930]] (coupling 0.07, 14 shared references). Shared topics: relic density.","score":17.8,"rank":20,"section":"new","parts":[0.06,0.13,0.2,0.5,0.38],"abstract":"We investigate the treatment of real intermediate states (RIS) in freeze-in production of $s$-channel Dark Matter (DM) with unstable mediators, as such models feature a double-counting issue when decay and annihilation collision terms are simply added within the semi-classical Boltzmann approach and a finite width is used for the regularization of the resonance. While several ad-hoc RIS-subtraction schemes are available to mitigate this problem, a first-principles treatment in this context is so far missing. We therefore start from the Closed-Time-Path (CTP) formulation of non-equilibrium Quantum Field Theory and present a CTP-based description of $s$-channel freeze-in pair production of a single scalar, fermion or vector DM species. In addition to being intrinsically free of non-unitary overcounting, the CTP ansatz also has the advantage of systematically capturing thermal corrections known to be important for DM freeze-in. Separate evolution equations assuming a single scalar or vector mediator in thermal equilibrium with the surrounding bath are presented. The exact propagators of the unstable mediators are approximated by resumming one particle irreducible (1PI) self-energy diagrams generated by bath particles and are evaluated with their full mass and momentum dependence in contrast to the commonly adopted Hard Thermal Loop limit. The CTP relic densities are compared numerically with those obtained using the most common RIS-subtraction schemes for two example $s$-channel freeze-in models, demonstrating the phenomenological relevance of a consistent RIS treatment.","authors":"Jannis Brirup, Adrian Finke, Michael Klasen, Luca Paolo Wiggering","nlinked":123,"nref":124,"src":"INSPIRE","html":true},{"id":"3226457","arxiv":"2611.11241","title":"An $SU(5)$ GUT with non-holomorphic modular $S'_4$ symmetry: fermion masses, mixing and leptogenesis","first":"Zhang","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[922002]] (coupling 0.03, 3 shared references). Closest network paper: [[3121627]] (coupling 0.21, 21 shared references). Shared topics: neutrino mass, majorana mass, fermion mass.","score":17.3,"rank":21,"section":"new","parts":[0.0,0.07,0.59,0.0,0.63],"abstract":"A non-supersymmetric $SU(5)$ grand unified model is constructed based on the non-holomorphic modular $S'_4$ flavor symmetry, supplemented by a global Peccei--Quinn $U(1)_{PQ}$ symmetry that constrains the Yukawa couplings. Constructed from polyharmonic Maaß forms, these couplings allow the model to reproduce the observed charged-fermion masses and mixing as well as the neutrino oscillation parameters for both normal ordering (NO) and inverted ordering (IO), with all Pull values satisfying $|\\mathcal{P}| < 0.8$. The model further yields specific predictions for yet-unmeasured parameters, including the absolute neutrino masses, the Dirac CP phase, the Majorana phases, and the effective Majorana mass $m_{ββ}$. We then study thermal leptogenesis by solving the density matrix equations. For a given benchmark point, the final baryon asymmetry depends solely on the single free parameter $b$ that sets the right-handed neutrino mass scale, and an appropriate choice of this parameter reproduces the observed value $η_B \\simeq 6.12 \\times 10^{-10}$. Finally, the correlation between this scale parameter and specific low-energy observables provides a potential bridge between the fermion flavor structure and early-Universe cosmology.","authors":"Xianshuo Zhang, Yakefu Reyimuaji","nlinked":91,"nref":100,"src":"INSPIRE","html":true},{"id":"3226486","arxiv":"2611.11472","title":"Short-range dynamics of $X(3872)$ and $T_{cc}(3875)^+$ in a coupled-channel framework","first":"Peng","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3193100]] (coupling 0.04, 44 shared references).","score":17.3,"rank":22,"section":"new","parts":[0.45,0.0,0.1,0.0,0.0],"abstract":"We study the short-range dynamics in the coupled-channel description of the $S$-wave $D \\bar{D}^*$ and $DD^*$ systems for $X(3872)$ and $T_{cc}(3875)^+$, respectively. Contact interactions are related through scalar- and vector-meson exchange saturation, while pion exchange is included explicitly with its local term subtracted. The coupled Lippmann-Schwinger equations incorporate the self-energy of the unstable $D^*$ mesons, thereby accounting for the three-body $D \\bar{D} π$ ($D Dπ$) dynamics. Fixing the contact interaction from the $T_{cc}(3875)^+$ pole, we trace the predicted $X(3872)$ pole as the local magnetic dipole term from vector-meson exchange is varied. Retaining this term in full produces the shallowest poles, which remain approximately $5$--$12~\\mathrm{MeV}$ below the observed $X(3872)$ mass. It is found that the pion exchange has a moderate effect on the binding energy and a stronger effect on the isospin violation for the $X(3872)$ state. The residual tension between the pure-molecular bound descriptions of $X(3872)$ and $T_{cc}(3875)^+$ is analyzed with the Feshbach projection. This analysis indicates a $DD^*$ interaction weaker than that implied by the purely molecular fits, and shows that the $T_{cc}(3875)^+$ state instead arises from the mixing of the $DD^{*}$ channel with a compact $cc\\bar{u}\\bar{d}$ state. We further examine the spatial structure using Born--Oppenheimer effective field theory. For separation radii of $0.5$--$1.5~\\mathrm{fm}$, the combined charmonium and short-distance tetraquark weight in $X(3872)$ is $3.0$--$9.7\\%$, while the short-distance weight in $T_{cc}(3875)^+$ is $1.3$--$14.4\\%$. These results favor retaining the local vector-exchange contribution within the saturation framework and motivate a joint treatment of molecular and compact dynamics for the $T_{cc}(3875)^+$.","authors":"Fang-Zheng Peng, Li-Sheng Geng, Ju-Jun Xie","nlinked":124,"nref":126,"src":"INSPIRE","html":true},{"id":"2890845","arxiv":"2502.12461","title":"Phenomenological revisit of the $B$ ${\\to}$ $ππ$ decays by incorporating soft color-octet contributions","first":"Yang","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[1127719]] (coupling 0.02, 9 shared references).","score":16.8,"rank":23,"section":"replacement","parts":[0.45,0.0,0.07,0.0,0.0],"abstract":"Motivated by the long-standing ``$ππ$ puzzle'' in nonleptonic $B$ decays, we revisit the $B$ ${\\to}$ $ππ$ decays within the QCD factorization (QCDF) framework, now incorporating the soft color-octet matrix element (COME) contributions, an ingredient that has been largely overlooked in earlier QCDF studies. A comprehensive phenomenological analysis is performed under three distinct scenarios, with the free parameters determined via fits to the available experimental data using the $χ^{2}$ method. The goodness-of-fit is very poor for Scenario S1, which corresponds to the traditional QCDF case without the soft COME contributions, and for Scenario S2, which includes the soft COME contributions but omits the weak annihilation (WA) contributions. Scenario S3, in which both the COME and WA contributions are included simultaneously, achieves an excellent overall fit. In Scenario S3, the QCDF approach can accommodate almost all $B$ ${\\to}$ $ππ$ observables in a consistent and satisfactory manner, and the fitted parameters $ρ_{A}$ $<$ $1$ (WA) and $ρ_{c}$ ${\\sim}$ $0.3$ (soft COME) are in good agreement with the QCDF power counting scheme and the factorization hypothesis.","authors":"Yueling Yang, Bingbing Yang, Junfeng Sun","nlinked":117,"nref":121,"src":"INSPIRE","html":true},{"id":"3226402","arxiv":"2611.10259","title":"Evidence for quark+quark pairing in proton formation","first":"Xing","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[2698004]] (coupling 0.02, 5 shared references).","score":16.6,"rank":24,"section":"new","parts":[0.45,0.0,0.05,0.0,0.0],"abstract":"The question of pairing between quarks inside baryons is addressed by calculating the fragmentation functions that describe production of nucleons (protons and neutrons) in high-energy collisions and comparing attendant predictions with phenomenological global fits to available data and directly with data on hadron multiplicities. The fragmentation functions are obtained from nucleon parton distribution functions using the Drell-Levy-Yan relation and subsequently solving a coupled set of pion, kaon, and nucleon jet cascade equations. Strong empirical evidence is found for the presence of diquark correlations. In comparison with global fits, $d$ (down) quark to proton fragmentation ($d\\to p$) exhibits the clearest signals. The strongest evidence is found in comparisons with the momentum-dependent proton multiplicity distribution: FFs built from a proton wave function that contains diquark correlations deliver a $z$-profile that is fully consistent with available data, whereas that obtained from a no-pairing wave function is disfavoured by data at the $9σ$ level.","authors":"Hui-Yu Xing, Dan-Dan Cheng, Craig D. Roberts, Jose Rodriguez-Quintero","nlinked":78,"nref":83,"src":"INSPIRE","html":true},{"id":"3226659","arxiv":"2611.12673","title":"Amplitudes separation and strong-electromagnetic phases determination in the $\\boldsymbol{J/ψ}$ decays into baryon-antibaryon pairs","first":"Alice","nauth":31,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3214449]] (coupling 0.02, 1 shared references).","score":16.6,"rank":25,"section":"new","parts":[0.45,0.0,0.06,0.0,0.0],"abstract":"We extract the relative phase between strong and electromagnetic amplitudes of the decays of a vector charmonium into spin-$1/2$ baryon-antibaryon pairs. Starting from a flavour-SU(3) effective Lagrangian with vector and tensor currents, we construct a parametrization in terms of partial waves coefficients. The electric and magnetic phases, the phase of the integrated complex overlap and the effective rate angle are derived from the same source amplitudes. We retain two possible solutions and both of them describe the scalar $Σ^+\\barΣ^-$ scan phase within its uncertainty, while presenting tension with several electric-magnetic production phases.","authors":"Chiara Alice, Antonio Amoroso, Matteo Barbagiovanni, Monica Bertani, Diego Bettoni, Fabrizio Bianchi, Alberto Bortone, Damiano Cabiati, Alessandro Calcaterra, Gianluigi Cibinetto, Fabio Cossio, Marco Destefanis, Francesca De Mori, Emma Di Fiore, Luciano Fava, Sara Garbolino, Isabella Garzia, Michela Greco, Marco Maggiora, Simonetta Marcello, Federico Matias Melendi, Giulio Mezzadri, Piero Patteri, Simone Pacetti, Angelo Rivetti, Manuel Dionisio Da Rocha Rolo, Francesco Rosini, Marco Scodeggio, Stefano Sosio, Stefano Spataro, Umberto Zarantonello","nlinked":28,"nref":28,"src":"INSPIRE","html":true},{"id":"3226436","arxiv":"2611.10816","title":"Flavor decomposition of the nucleon axial and tensor charges from lattice QCD","first":"Alexandrou","nauth":7,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[2815911]] (coupling 0.02, 2 shared references).","score":16.6,"rank":26,"section":"cross","parts":[0.45,0.0,0.05,0.0,0.0],"abstract":"We determine the nucleon axial and tensor charges using four ensembles of twisted-mass clover-improved fermions with approximately equal physical volumes of about 5.5~fm and four lattice spacings, $ a=0.05$~fm, 0.06~fm, 0.07~fm, and 0.08~fm. The mass of the degenerate up and down, strange and charm quarks are tuned to approximately their physical values. We compute both connected and disconnected contributions to determine the isovector and isoscalar charges and their flavour decomposition. For the nucleon isovector axial charge we find $g_A^{u-d}=1.263(34)(26)$, in agreement with the experimental value. For the isoscalar axial charge we find $g_A^{u+d}=0.458(16)(1)$, while for the corresponding tensor charges we find $g_T^{u-d}=0.951(21)(5)$ and $g_T^{u+d}=0.556(16)(5)$.","authors":"C. Alexandrou, S. Bacchio, M. Di Carlo, A. Evangelista, C. Iona, F. Pittler, G. Spanoudes","nlinked":57,"nref":59,"src":"INSPIRE","html":true},{"id":"3211572","arxiv":"2610.05209","title":"The decay $η_c\\to p\\bar pη$ with meson--baryon final-state interactions","first":"Song","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3214449]] (coupling 0.02, 1 shared references).","score":16.6,"rank":27,"section":"replacement","parts":[0.45,0.0,0.06,0.0,0.0],"abstract":"We study the decay \\(η_c\\to p\\bar{p}η\\) by combining the SU(3) flavor structure of the primary production with final-state interactions in the \\(pη\\) and \\(\\bar{p}η\\) subsystems, using the chiral unitary approach. The low-energy \\(S_{11}\\) dynamics, including the dynamically generated \\(N^*(1535)\\), is incorporated into the complete coupled-channel amplitude, and a phenomenological \\(N^*(1895)\\) contribution is included coherently. The \\(pη\\) and \\(\\bar{p}η\\) invariant-mass distributions are well described, and the \\(p\\bar{p}\\) distribution is predicted as a kinematic reflection of the \\(ηN\\) dynamics. The results support the dynamical interpretation of the \\(N^*(1535)\\) and suggest possible additional \\(S_{11}\\) strength near \\(1.9\\)~GeV.","authors":"Jing Song, Yu-Shan Ren, Eulogio Oset","nlinked":29,"nref":33,"src":"INSPIRE","html":true},{"id":"3226562","arxiv":"2611.12105","title":"Theoretical constraints on beyond Standard Model extensions of the Higgs potential","first":"Pena-Vico","nauth":3,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[902365]]. Closest of your papers: [[713693]] (coupling 0.06, 3 shared references). Closest network paper: [[902365]] (coupling 0.06, 13 shared references). Shared topics: standard model extension.","score":13.1,"rank":28,"section":"new","parts":[0.06,0.19,0.19,0.0,0.25],"abstract":"A fundamental requirement for the consistency of quantum field theories is that their Higgs potential is lower-bounded, such that no direction in the $Φ$ field space leads to $V(Φ)\\to \\, -\\infty$. This work presents a comprehensive analysis of the various theoretical constraints on potentials in extended Higgs sectors, highlighting their relative impact and restrictiveness. We illustrate our study on the potential parameters with two particular Higgs sector extensions: the Real Singlet Extension (RSE) and the Two-Higgs-Doublet Model (2HDM), separating $\\mathbb{Z}_{2}$-conserving and $\\mathbb{Z}_{2}$-violating cases. In order to do this, we derive and compare these conditions to other studies found in the literature. Additionally, we developed a publicly available code capable of testing positivity conditions in complex potentials, including particularly challenging cases such as the general $\\mathbb{Z}_2$-violating 2HDM. Finally, we apply those restrictions to the physical parameters and deduce an upper and a lower bound on the masses of new heavy scalars.","authors":"Javier E. Pena-Vico, Carlos Quezada-Calonge, Juan J. Sanz-Cillero","nlinked":47,"nref":49,"src":"INSPIRE","html":true},{"id":"3143488","arxiv":"2604.08700","title":"Axion Quality in Warped Extra-Dimension","first":"Choi","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Co-authors of yours: Choi. Closest of your papers: [[1607572]] (coupling 0.06, 6 shared references). Closest network paper: [[1304242]] (coupling 0.06, 20 shared references).","score":12.4,"rank":29,"section":"replacement","parts":[0.0,0.16,0.17,0.5,0.0],"abstract":"We investigate the axion quality problem in warped extra-dimensional models in which the QCD axion arises as the Wilson-line mode of a five-dimensional $U(1)$ gauge field compactified on an $S^1/\\mathbb{Z}_2$ orbifold. Higher-dimensional gauge invariance severely constrains possible sources of Peccei--Quinn symmetry breaking, implying that non-QCD contributions to the axion potential are predominantly generated by nonlocal effects mediated by $U(1)$-charged fields propagating along the compact dimension. We systematically compute these contributions and examine how both the warped geometry and the orbifold fixed points (branes) affect the resulting axion quality. Finally, we classify the parametric suppression of the induced axion potential, thereby identifying the conditions under which warped extra-dimensional axions can achieve sufficiently high quality.","authors":"Kiwoon Choi, Chang Hyeon Lee, Chang Sub Shin","nlinked":82,"nref":82,"src":"INSPIRE","html":true},{"id":"3227077","arxiv":"2611.10753","title":"Search sensitivity for type-III seesaw heavy leptons in simulated \\texorpdfstring{$pp$}{pp} collisions at \\texorpdfstring{$\\sqrt{s}=13.6$}{sqrt(s)=13.6} TeV at the LHC","first":"Elsayed","nauth":2,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1249404]] (coupling 0.06, 9 shared references). Closest network paper: [[2903404]] (coupling 0.08, 7 shared references).","score":11.2,"rank":30,"section":"new","parts":[0.06,0.18,0.24,0.0,0.0],"abstract":"A search for the pair production of TeV-scale heavy leptons as predicted by the type-III seesaw mechanism is presented. The analysis is based on a simulated signal and Standard Model background data corresponding to an integrated luminosity of $500~\\mathrm{fb}^{-1}$ of proton-proton collisions at $\\sqrt{s}=13.6$ TeV. The ATLAS detector response is modeled with Delphes. Events are categorized based on the number of final state leptons and large-$R$ jets into nine mutually exclusive search channels. Multivariate analysis techniques are employed to separate the signal from the Standard Model backgrounds. Under the flavor-democratic mixing scenario ($\\mathcal{B}_e=\\mathcal{B}_μ=\\mathcal{B}_τ=1/3$), the expected 95\\% confidence level upper exclusion limit on the heavy lepton mass is approximately $1.6$ TeV.","authors":"A. M. M. Elsayed, Yusheng Wu","nlinked":52,"nref":70,"src":"INSPIRE","html":true},{"id":"3225702","arxiv":"2611.09106","title":"Probing Dark Matter via the Migdal Effect in LUX-ZEPLIN Data","first":"Yu","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1741056]] (coupling 0.07, 5 shared references). Closest network paper: [[2703113]] (coupling 0.09, 8 shared references).","score":11.1,"rank":31,"section":"cross","parts":[0.0,0.22,0.26,0.0,0.07],"abstract":"Sub-GeV dark matter (DM) particles deposit little energy in conventional direct-detection experiments and are therefore difficult to probe, but the Migdal effect provides an electronic signal from atomic ionization accompanying the recoil. Using the new results of the LUX-ZEPLIN experiment with a 4.2 tonne-year exposure, we evaluate the sensitivity of the Migdal effect to the spin-independent DM--nucleon scattering cross section. For masses between $350~\\mathrm{MeV}$ and $10~\\mathrm{GeV}$, the projected 90\\% upper limits range from $6.5\\times10^{-37}$ to $9.6\\times10^{-42}~\\mathrm{cm^2}$. These limits are then used to constrain the minimal scalar- and vector-mediator DM models. For the light-mediator DM model, the constraint on the coupling reaches $α\\simeq 10^{-12}$, which is stronger than or comparable to the constraints from kaon decays, stellar cooling, and SN1987A.","authors":"Yang Yu, Lei Feng","nlinked":43,"nref":44,"src":"INSPIRE","html":true},{"id":"2896713","arxiv":"2503.02635","title":"WIMP-FIMP option and neutri
