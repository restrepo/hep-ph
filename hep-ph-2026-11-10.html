,"k"],[79,74,"c"],[46,104,"c"],[82,73,"c"],[16,66,"k"],[30,67,"k"],[126,81,"c"],[55,89,"c"],[1,76,"c"],[127,52,"c"],[86,106,"c"],[128,75,"c"],[127,117,"c"],[50,106,"c"],[17,32,"c"],[3,96,"c"],[101,98,"c"],[123,35,"c"],[108,52,"c"],[101,106,"c"],[84,113,"c"],[3,102,"k"],[5,104,"c"],[19,105,"k"],[101,35,"c"],[3,107,"k"],[1,108,"c"],[92,111,"c"],[92,83,"c"],[0,111,"c"],[6,112,"c"],[3,35,"c"],[47,83,"c"],[12,118,"c"],[94,58,"c"],[74,60,"c"],[0,119,"c"],[46,111,"c"],[67,96,"c"],[119,46,"c"],[46,83,"c"],[21,112,"k"],[45,89,"c"],[126,35,"c"],[4,49,"k"],[74,51,"c"],[57,83,"c"],[54,102,"c"],[9,77,"c"],[85,53,"c"],[116,96,"c"],[98,73,"c"],[48,111,"c"]],"next":[{"arxiv":"2611.12765","id":"3226684","title":"Quality time in extra dimensions: axion quality and radion cosmology","authors":"Falguni Biswas, Yeshan Juberi, Ahmed Rakin Kamal","score":8.4,"section":"new","rank":32,"parts":[0.0,0.13,0.17,0.0,0.19],"note":"Closest of your papers: [[1607572]] (coupling 0.05, 5 shared references). Closest network paper: [[1944631]] (coupling 0.06, 12 shared references). Shared topics: abelian gauge.","abstract":"Higher-form symmetries can protect extra-dimensional axions, but additional symmetry breaking can still spoil the solution to the strong CP problem. We focus on electrically charged matter and magnetic gauging in a five-dimensional circle compactification where the axion arises from an Abelian gauge field and the radius is dynamical. We discuss two mechanisms for stabilising the radius/radion using Casimir energy from fields neutral under the Abelian gauge field, with and without an additional periodic scalar winding around the compact circle. Both admit Minkowski and de Sitter minima. At the Minkowski minima (with radion masses of $100$--$170\\,\\mathrm{TeV}$), electrically charged matter induces a residual strong CP angle of order $10^{-17}$ and shifts the radius negligibly. Magnetic gauging remains compatible after including its additional degree of freedom in the Casimir spectrum, provided its coupling is sufficiently small. We observe that increasing the radius suppresses charged-matter breaking relative to QCD but increases magnetic breaking contribution. We also determine the radion decay channels, including the graviphoton, and study reheating from a possible radion-dominated era without scalar winding or magnetic gauging. For a non-minimal Higgs-curvature coupling $ξ=7$, the visible-sector reheating temperature is about $85\\,\\mathrm{MeV}$ with a dark-radiation contribution of $ΔN_{\\rm eff}\\approx0.02$. The entropy released during radion decay dilutes the axion abundance, allowing axions with $f_a=10^{14}\\,\\mathrm{GeV}$ and an initial misalignment angle $\\vartheta_i\\approx0.43$ to account for the entire observed dark matter abundance. For the same decay constant, reproducing this abundance in radiation domination requires $\\vartheta_i\\approx0.065$."},{"arxiv":"2611.10036","id":"3226339","title":"Magnetohydrodynamic spectra and line invariants in the presence of axions","authors":"P. M. Akhmetiev, M. S. Dvornikov, A. Yu. Smirnov","score":8.4,"section":"cross","rank":33,"parts":[0.0,0.18,0.2,0.0,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.07, 4 shared references). Closest network paper: [[1955022]] (coupling 0.07, 6 shared references).","abstract":"A new form of the mean-field equations for magnetic fields, which accounts for the interaction with axions, is studied. It is shown that the asymptotic ergodic invariants of magnetic field lines play a key role in the evolution of magnetic fields, which determine the type of the magnetohydrodynamic spectrum of the solutions."},{"arxiv":"2611.10273","id":"3226319","title":"Constraints on quirks from a Geant4-based reinterpretation of the CMS search for heavy stable charged particles","authors":"Tamas Almos Vami","score":8.3,"section":"new","rank":34,"parts":[0.0,0.11,0.33,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.04, 3 shared references). Closest network paper: [[2799066]] (coupling 0.12, 8 shared references).","abstract":"Quirks are new heavy fermions with electroweak charges that are also bound by a confining force whose scale $Λ$ is far below their mass. A produced pair therefore stays connected by a macroscopic string. We reinterpret the CMS search for heavy stable charged particles in 101 fb$^{-1}$ of 13 TeV proton-proton collisions for Drell-Yan produced quirks. The quirk dynamics is simulated with Geant4 in a parametric CMS-like detector, and the event selection is emulated and combined with the public likelihoods. The emulation reproduces the published limits on a heavy charged lepton within 11%. For an $SU(2)$-doublet quirk with one (two) infracolors, masses up to 870 (970) GeV are excluded for $Λ\\lesssim70$ eV, where the quirks behave as independent heavy stable charged particles. For $Λ\\gtrsim10$ keV, where the pair moves as one doubly ionizing object, the limit is 280 (320) GeV. In between, the quirks turn around inside the detector and the search has no sensitivity. For the $SU(2)$-singlet benchmark of the FASER search, with two infracolors, the limits reach 990 GeV below 100 eV, where FASER has no sensitivity, and 300 GeV above 10 keV, beyond the FASER exclusion of 175 GeV."},{"arxiv":"2605.07972","id":"3153711","title":"It Just Takes Two: Scaling Amortized Inference to Large Sets","authors":"Antoine Wehenkel, Michael Kagan, Lukas Heinrich, Chris Pollard","score":8.3,"section":"replacement","rank":35,"parts":[0.0,0.1,0.35,0.0,0.0],"note":"Closest of your papers: [[1615477]] (coupling 0.03, 2 shared references). Closest network paper: [[3187354]] (coupling 0.12, 2 shared references).","abstract":"Neural posterior estimation has emerged as a powerful tool for amortized inference, with growing adoption across scientific and applied domains. In many of these applications, the conditioning variable is a set of observations whose elements depend not only on the target but also on unknown factors shared across the set. Optimal inference therefore requires treating the set jointly, which in turn requires training the estimator at the deployment set size -- a regime where memory and compute quickly become prohibitive. We introduce a simple, theoretically grounded strategy that decouples representation learning from posterior modeling. Our method trains a mean-pool Deep Set on sets of size at most two, producing an encoder that generalizes to arbitrary set sizes. The inference head is then finetuned on pre-aggregated embeddings, making training cost essentially independent of the deployment set size N. Across scalar, image, multi-view 3D, molecular, and high-dimensional conditional generation benchmarks with N in the thousands, our approach matches or outperforms standard baselines at a fraction of the compute."},{"arxiv":"2611.12625","id":"3226667","title":"A singlet framework for the mu problem and type-II seesaw in a generalized NMSSM","authors":"Xiaokang Du, Yusi Pan, Fei Wang","score":8.2,"section":"new","rank":36,"parts":[0.0,0.08,0.19,0.0,0.29],"note":"Closest of your papers: [[2855387]] (coupling 0.03, 6 shared references). Closest network paper: [[2094416]] (coupling 0.07, 9 shared references). Shared topics: relic abundance.","abstract":"We study a generalized NMSSM in which a gauge singlet links the Higgs bilinear to the type-II seesaw scale. The singlet vacuum expectation value contributes to $μ_{\\rm eff}$ and generates the supersymmetric mass of a vectorlike triplet pair. Integrating out the triplets gives the Weinberg operator, and their gauge charges admit a possible messenger interpretation. Large cancellation between the bare $μ_0$ term and the singlet VEV generated bilinear Higgs term that keeps $μ_{\\rm eff}$ near the soft scale is still natural in the supersymmetric limit (by the supersymmetric non-renormalization theorem), although the concrete value of $μ_{\\rm eff}$ also depends slightly on the soft SUSY breaking parameters and finite threshold matching. The studied bino-like and singlino-like neutralino solutions accommodate triplet input scales approaching $10^{15}$ GeV together with electroweak-to-TeV dark matter. Representative spectra consistent with heavy-Higgs funnels or coannihilation with gluinos or winos yield allowed relic abundances while satisfying direct-detection constraints."},{"arxiv":"2604.02958","id":"3139158","title":"Applying self-organizing maps to nonresonant searches","authors":"Vaidehi Tikhe, N. Kirutheeka, Sourabh Dube","score":8.1,"section":"replacement","rank":37,"parts":[0.06,0.1,0.21,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1455793]] (coupling 0.03, 2 shared references). Closest network paper: [[2710594]] (coupling 0.08, 4 shared references).","abstract":"An excess of events seen in a nonresonant search at a collider can be difficult to ascribe to a specific hypothesis from amongst several competing ones. We explore a novel approach of applying self-organizing maps to such an excess to uniquely identify a hypothesis. We use a search for vector-like leptons in a trilepton final state to outline the method. We define an approach combining the inherent clustering of these maps and elements of supervised learning. We compare the performance of this approach with a multiclassifying neural network. We find that the method using self-organizing maps competes well (despite not using any standard model processes in the training), and provides additional tools that would help characterize any observed excesses in searches."},{"arxiv":"2601.07269","id":"3103110","title":"Atmospheric Mass-Squared Splitting at Sub-Percent Precision as a $CPT$ Symmetry Probe","authors":"T. V. Ngoc, S. Cao, P. T. Quyen","score":8.0,"section":"replacement","rank":38,"parts":[0.06,0.12,0.15,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1854224]] (coupling 0.04, 3 shared references). Closest network paper: [[1861353]] (coupling 0.05, 3 shared references).","abstract":"In this paper, we present an one of the most sensitive test of $CPT$ symmetry in the leptonic sector by probing the atmospheric neutrino mass-squared splittings, $Δm^2_{31}$ and $Δ\\overline{m}^2_{31}$, using simulated data from on-going reactor-based JUNO and future accelerator-based DUNE and Hyper-Kamiokande experiments. Our study focuses on the potential neutrino-antineutrino mass asymmetry $δ_{ν\\overlineν}(Δm^2_{31}) = Δm^2_{31} - Δ\\overline{m}^2_{31}$, achieving unprecedented precision by exploiting the high statistics and reduced systematic uncertainties of these facilities. The combined analysis yields a projected sensitivity to $CPT$ violation at the level of $\\sim 1.7\\times 10^{-5}~\\text{eV}^2$ at $3σ$ confidence level. These results highlight the crucial role of multi-experiment synergies in testing fundamental symmetries of nature. The work also investigates impact of potential bias on the (anti-)neutrino mass-splitting measurement due to the neutrino interactions with accelerator-based neutrino experiments, and conclude that it must be improved by at least $39\\%$ compared to T2K simulated-benchmark to achieve a sub-percent precision probe of $CPT$ violation."},{"arxiv":"2611.11458","id":"3226560","title":"After the Higgs: Looking for the Universe Behind the Particle","authors":"Veronica Sanz","score":7.9,"section":"new","rank":39,"parts":[0.0,0.12,0.29,0.0,0.0],"note":"Closest of your papers: [[468209]] (coupling 0.04, 2 shared references). Closest network paper: [[3094526]] (coupling 0.10, 10 shared references).","abstract":"Fourteen years after its discovery, the Higgs boson has changed roles. It was once the object of the search, but today it is an instrument with which we interrogate Nature's vacuum, test quantum field theory and look for new principles. This shift comes at a time when, unlike before the Higgs discovery, we have no theoretical argument guaranteeing new physics within experimental reach. At the same time, securing long-term support for fundamental science is becoming increasingly challenging. I revisit the path from a theoretically motivated discovery to a precision programme, explain why the Higgs is such an unusual quantum field, and argue that this same peculiarity makes it a gateway to cosmology and other sectors. I then turn to a less technical question: how should a field plan for exploration when no theorem guarantees the next discovery? My answer is to pursue precision without pretending to know in advance which measurement will matter, sustain a diverse experimental portfolio, protect theoretical risk-taking, and make the public case for fundamental exploration on its own terms."},{"arxiv":"2512.11486","id":"3092472","title":"CANTON-$μ$ Proposal: A Next-Generation Muon $g-2$ Measurement at Sub-0.1 ppm Precision","authors":"Ce Zhang, Yu Xu, On Kim, Bingzhi Li, Zejia Lu, Saskia Charity, Guodong Shen, Liangwen Chen, Fedor Ignatov, Liang Li, Qiang Li, Xueheng Zhang, Zhiyu Sun","score":7.6,"section":"replacement","rank":40,"parts":[0.0,0.08,0.35,0.0,0.0],"note":"Closest of your papers: [[2690106]] (coupling 0.03, 5 shared references). Closest network paper: [[2706495]] (coupling 0.12, 19 shared references).","abstract":"We propose a next-generation precision measurement of the muon anomalous magnetic moment (muon g-2) at the High Intensity Heavy-Ion Accelerator Facility (HIAF) in Huizhou, China. We refer to this proposed experimental programme as CANTON-$μ$ (Coherent Anomalous magNetic momenT ObservatioN with muon). HIAF's intense, pulsed GeV-scale muon beams, particularly for negative muons, provide a promising basis for this programme. Building on two previously proposed storage-ring concepts, this work develops HIAF-specific experimental schemes that relax the conventional magic-momentum constraint and allow greater flexibility in the choice of beam momentum. We assess the expected muon intensity at HIAF and the corresponding statistical sensitivity. For each scheme, we identify its distinctive systematic effects, examine feasible control strategies, and propose quantitative systematic-uncertainty targets. Together, the statistical projections and systematic-uncertainty targets indicate prospective total precisions of 0.1 ppm in Phase-I, comparable to the current Fermilab precision, with the potential to reach the 0.05 ppm level in Phase-II following the planned HIAF upgrade. At the ultimate projected precision, the measurement would provide a stringent test of the Standard Model and probe new physics at multi-TeV scales. A focus on negative-muon measurements would enable direct comparison with existing high-precision positive-muon results and strengthen tests of CPT symmetry in the muon sector within the Standard-Model Extension, with a projected sensitivity at the $10^{-24}$ GeV level, an order of magnitude beyond current limits."},{"arxiv":"2611.11211","id":"3226463","title":"The first-order phase transitions and gravitational waves from an effective theory inspired by four-stack intersecting D6-brane models","authors":"Haotian Huangfu, Tianjun Li, Qi Sun, Rui Sun, Wenxing Zhang","score":7.4,"section":"new","rank":41,"parts":[0.0,0.05,0.26,0.0,0.18],"note":"Closest of your papers: [[530816]] (coupling 0.02, 1 shared references). Closest network paper: [[3219721]] (coupling 0.09, 10 shared references). Shared topics: gauge symmetry.","abstract":"First-order phase transitions in the early Universe can generate stochastic gravitational-wave backgrounds in frequency bands targeted by proposed deci-Hz observatories. We study the gravitational-wave consequences of the right-handed gauge symmetry breaking $SU(2)_{R_1}\\times SU(2)_{R_2}\\to SU(2)_R$ in a Pati-Salam effective theory inspired by four-stack intersecting D6-brane models. The ultraviolet construction fixes the gauge structure and particle multiplicities, while the scalar masses and quartic couplings are treated as renormalized inputs below the supersymmetry-breaking scale. Using a one-loop finite-temperature potential with ring resummation, we follow a strongly supercooled transition at the few-TeV scale through nucleation, percolation, completion, and reheating. The leading-order friction diagnostic does not support a runaway wall, so sound waves dominate the gravitational-wave signal, with turbulence as a sub-leading contribution; the finite acoustic lifetime suppresses the peak. For the fast-wall reference case, the spectrum peaks at $f_{\\rm peak}=0.611$ Hz with $h^2Ω_{\\rm GW,peak}=1.232\\times10^{-11}$, in the deci-Hz band targeted by DECIGO and BBO. We present its dependence on the wall speed, renormalization scale, and thermal screening, together with a noise-only comparison for several proposed detector configurations."},{"arxiv":"2606.07106","id":"3165826","title":"Joint probes of dark matter annihilation from neutrino detectors and CMB targets","authors":"Ruifeng Leng, Shao-Ping Li","score":7.2,"section":"replacement","rank":42,"parts":[0.0,0.09,0.26,0.0,0.07],"note":"Closest of your papers: [[1755250]] (coupling 0.03, 4 shared references). Closest network paper: [[3081701]] (coupling 0.09, 9 shared references).","abstract":"Dark matter (DM) annihilation into neutrinos provides a promising observational channel targeted by current and forthcoming neutrino detectors. However, the detection of such neutrino fluxes alone cannot uniquely determine their astrophysical or cosmological origin, such as the recent observations from Super-Kamiokande that hint at a small excess of electron antineutrino events. We propose that the effective number of neutrino species and the spectral distortion of the cosmic microwave background (CMB) can serve as complementary observables to probe neutrino signatures from DM annihilation. Using a simple model-independent analysis, we determine the detection windows of these cosmic observables that overlap with the experimental sensitivities from the Super-Kamiokande, Jiangmen Underground Neutrino Observatory, Hyper-Kamiokande, and the Deep Underground Neutrino Experiment, showing that joint probes of large DM annihilation to neutrinos with MeV-GeV masses can be achieved by neutrino detectors and CMB experiments."},{"arxiv":"2611.10114","id":"3226324","title":"Collider-observable curvaton","authors":"David Cyncynates, Takuya Okawa","score":6.2,"section":"new","rank":43,"parts":[0.06,0.04,0.19,0.0,0.0],"note":"Also cites widely used network papers: [[1362180]]. Closest of your papers: [[2855387]] (coupling 0.02, 3 shared references). Closest network paper: [[2923681]] (coupling 0.07, 18 shared references).","abstract":"We study a technically natural realization of the curvaton mechanism, in which decay is mediated through the superrenormalizable interaction with the Higgs. We compute the quantum and thermal corrections to the curvaton potential and show that they remain under control throughout its cosmological evolution. For high inflationary scales, the curvaton dissipates through off-shell processes in the Standard Model plasma. The viable parameter space is broad, and the region in which the curvaton mass and dimensionful Higgs-portal coupling are closest in scale lies within the discovery reach of proposed searches for light Higgs-mixed scalars."},{"arxiv":"2611.12373","id":"3226590","title":"Magnetic moments of the $Σ_c$ and $Σ_b$ baryons from external-field QCD sum rules","authors":"Halil Mutuk","score":6.0,"section":"new","rank":44,"parts":[0.06,0.07,0.13,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2855387]] (coupling 0.03, 3 shared references). Closest network paper: [[2940264]] (coupling 0.05, 4 shared references).","abstract":"We compute the magnetic moments of the $Σ_c$ and $Σ_b$ isotriplets with external-field QCD sum rules. The heavy-quark propagator is kept with its full mass dependence and with its couplings to the photon, to soft gluons and to both simultaneously, and the magnetic sum rule is normalized by the mass sum rule of the same interpolating field, which removes the residue and gives the baryon masses within a few percent. The quark-condensate magnetic susceptibility $χ$, which otherwise dominates the uncertainty, is fixed by the proton magnetic moment computed with the same interpolating field; the neutron moment then follows to about $5\\%$. Uncertainties from the QCD inputs are evaluated with a Monte Carlo analysis, and those from the interpolating field, the Borel window, the scale of the heavy-quark mass, the calibration and the normalization are added. With $\\overline{\\rm MS}$ heavy-quark masses we obtain $μ_{Σ_c^{++}}=2.37\\pm0.65$, $μ_{Σ_c^{+}}=0.50\\pm0.15$, $μ_{Σ_c^{0}}=-1.39\\pm0.37$, $μ_{Σ_b^{+}}=2.16\\pm0.65$, $μ_{Σ_b^{0}}=0.55\\pm0.16$ and $μ_{Σ_b^{-}}=-1.06\\pm0.32$ in nuclear magnetons; at this order the results depend sizably on the heavy-quark mass scheme. The moments are carried by the light diquark; the heavy-quark contribution, whose separation depends on the interpolating field, is $-0.13\\pm0.02\\,μ_N$ for $Σ_c$ and $+0.013\\pm0.003\\,μ_N$ for $Σ_b$."},{"arxiv":"2610.40354","id":"3220608","title":"Two-peak gravitational wave spectra from supercooled two-field phase transitions","authors":"Daniel Araújo, João Gonçalves, Danny Marfatia","score":5.7,"section":"replacement","rank":45,"parts":[0.0,0.07,0.23,0.0,0.0],"note":"Closest of your papers: [[1854224]] (coupling 0.03, 1 shared references). Closest network paper: [[3085923]] (coupling 0.08, 5 shared references).","abstract":"We study the gravitational wave (GW) spectrum generated by supercooled first-order phase transitions in two-field conformal models. We construct three representative toy models that capture the essential features of these models, derive analytical criteria for the existence of two-step transitions, and show how the two-field dynamics generate a genuine two-peak GW spectrum. We identify regions of parameter space in which two-peak GW spectra are observable at LISA and the Einstein Telescope. By way of illustration, we apply our analysis to a realistic conformal dark SU(3) model."},{"arxiv":"2611.12363","id":"3226592","title":"Naturalness in the Past from a Time-Dependent Supersymmetry Scale","authors":"Tony Gherghetta, Kunio Kaneta, Wenqi Ke","score":5.6,"section":"new","rank":46,"parts":[0.0,0.06,0.05,0.0,0.3],"note":"Closest of your papers: [[505185]] (coupling 0.02, 1 shared references). Closest network paper: [[2932612]] (coupling 0.02, 4 shared references). Shared topics: relic abundance.","abstract":"We consider the possibility that electroweak naturalness may be epoch dependent. In no-scale supergravity, a rolling quintessence modulus can control the supersymmetry-breaking scale, allowing superpartners to be much lighter in the early universe while remaining heavy today. Fifth-force and varying-constant effects can be suppressed via correlated modular weights in the visible-sector Kähler metric and modulus-dependent superpotential Yukawa couplings, while radiative stability of the quintessence potential requires additional tuning of the field-dependent vacuum energy. The resulting effective theory has distinctive implications for early-universe phase transitions, relic abundances, and gravitational waves."},{"arxiv":"2608.01496","id":"3186414","title":"Search for active-sterile neutrino transitions using Pierre Auger Observatory data","authors":" The Pierre Auger Collaboration, A. Abdul Halim, P. Abreu, M. Aglietta, M. Ahmed, I. Allekotte, K. Almeida Cheminant, R. Aloisio, J. Alvarez-Muñiz, A. Ambrosone, J. Ammerman Yebra, L. Anchordoqui, B. Andrada, L. Andrade Dourado, L. Apollonio, C. Aramo, J. C. Arteaga Velázquez, P. Assis, G. Avila, E. Avocone, A. Bakalova, Y. Balibrea, A. Baluta, F. Barbato, A. Bartz Mocellin, O. Batalla Cruz, J. P. Behler, C. Berat, M. E. Bertaina, M. Bianciotto, P. L. Biermann, V. Binet, K. Bismark, T. Bister, J. Biteau, J. Blaz  shared references). Closest network paper: [[3127309]] (coupling 0.05, 8 shared references).","abstract":"We compute the electromagnetic form factors of the pion and the kaon in a symmetry-preserving contact interaction whose effective coupling depends on the number of active light flavors Nf , so that dynamical chiral symmetry breaking is screened as Nf grows toward the chiral transition. The calculation uses the rainbow-ladder truncation of the Schwinger-Dyson and Bethe-Salpeter equations with proper-time regularization, and it includes the dressed quark-photon vertex obtained from its own inhomogeneous Bethe-Salpeter equation in the same truncation. At Nf = 2 the model reproduces the established contact interaction values of the meson masses, decay constants and condensates, and the charge radii rpi = 0.447 fm and rK = 0.417 fm, which undershoot experiment by about one third, as is known for this class of interactions. We therefore restrict every comparison to Q2 less then or equal to 0.6 GeV2, confront it with the NA7 data and with one-loop chiral perturbation theory, and focus on the response to Nf . Both radii grow monotonically with Nf , and the growth survives every variation of the screening function and of the infrared confinement scale that we test. The growth is carried by the quark core rather than by the vector-meson dressing: between Nf = 2 and 6 the bare-vertex contribution to <r2pi> rises from 0.097 to 0.226 fm2, while the dressing contribution moves from 0.102 to 0.127 fm2 even though the rho pole drops from 0.93 to 0.70 GeV. The finite strange mass slows the kaon response only moderately."},{"arxiv":"2602.07991","id":"3117660","title":"Information-Theoretic Gaps in Solar and Reactor Neutrino Oscillation Measurements","authors":"Neetu Raj Singh Chundawat, Yu-Feng Li","score":5.3,"section":"replacement","rank":49,"parts":[0.0,0.07,0.1,0.0,0.16],"note":"Closest of your papers: [[1220579]] (coupling 0.03, 2 shared references). Closest network paper: [[3069207]] (coupling 0.03, 3 shared references).","abstract":"Quantum estimation theory provides a fundamental framework for analyzing how precisely physical parameters can be estimated from measurements. Neutrino oscillations are characterized by a set of parameters inferred from experiments conducted in different production and detection environments. The two solar oscillation parameters, $Δm^2_{21}$ and $θ_{12}$, can be estimated using both solar neutrino experiments and reactor neutrino experiments. In this letter, we use Quantum Fisher Information (QFI) to quantify and compare the information content accessible in these two experimental setups. For reactor neutrinos, flavor measurements saturate the QFI for both parameters over relevant energy ranges, demonstrating that ideal measurements could achieve ultimate quantum precision bound. In contrast, for solar neutrinos the phase-based QFI vanishes, originating from the quantum coherence, rendering the estimation of $Δm_{21}^2$ purely population-based and effectively classical, while the QFI for $θ_{12}$ remains sizable and nearly saturated by flavor measurements at high energies. Consequently, solar experiments are intrinsically more sensitive to $θ_{12}$ than to $Δm_{21}^2$, reflecting a fundamental difference in the information encoded in the two systems."},{"arxiv":"2611.11254","id":"3226467","title":"Probing the Supersymmetric Grand Unified Theories with Anomaly Mediation at the Future Proton-Proton Colliders and Hyper-Kamiokande Experiment","authors":"Waqas Ahmed, Tianjun Li, Shabbar Raza","score":5.1,"section":"new","rank":50,"parts":[0.0,0.07,0.2,0.0,0.0],"note":"Closest of your papers: [[770422]] (coupling 0.02, 2 shared references). Closest network paper: [[2744388]] (coupling 0.07, 16 shared references).","abstract":"With the grand desert hypothesis, we investigate the Supersymmetric (SUSY) Grand Unified Theories (GUTs) with the minimal anomaly mediated supersymmetry breaking (AMSB) as a continuation const NEWS=N.filter(isNew).sort((a,b)=>a.rank-b.rank);
document.getElementById('eyebrow').innerHTML=`arXiv ${esc(M.cat)} · <a href="${esc(M.url)}" target="_blank" rel="noopener">${esc(M.date)}</a>`;
document.getElementById('dek').textContent=`${M.nrel} of the ${M.nlist} papers in this listing (${M.counts.new} new, ${M.counts.cross} cross-lists, ${M.counts.replacement} replacements) score ${M.threshold} or more for belonging to the reference and citation network of your ${M.nown} papers and the ${M.next} papers by other authors around them. Highest score first.`;
const T=!!M.topics;   // network file with shared phrases: 35/30/15/10 + 10% shared topics
document.getElementById('foot').innerHTML=`<p><b>Score (0–100).</b> ${T?35:40}% direct citations of network papers (each of your papers counts 1, each other network paper 0.6, network papers with over 1,000 citations 0.06; saturating as 1 − e<sup>−x</sup>); ${T?30:35}% bibliographic coupling with your own papers (idf-weighted cosine of INSPIRE-linked reference sets, best match and mean of the top three, 0.30 = full marks); 15% best coupling with the other network papers (0.35 = full marks); 10% authorship (you, or your co-authors)${T?`; 10% shared topics: technical phrases of two or more words in the title and abstract that your papers and the network use much more often than hep-ph as a whole (each weighted by how much more${M.halfLife?`, with recent papers counting more: a paper's weight halves every ${M.halfLife} years`:''}; saturating as 1 − e<sup>−x/3</sup>)${(M.watch||[]).length?`, plus your watch topics (${M.watch.map(esc).join(', ')})`:''}`:''}.</p>
<p><b>Data.</b> Network: INSPIRE records supplied with the project. Listing papers: INSPIRE records where already harvested (${M.onInspire} of ${M.nlist}); for the rest the reference list was read from the arXiv source and matched to INSPIRE by arXiv number, DOI and texkey. Only links between papers on this page are drawn. Built ${esc(M.built)}.</p>`;
const P=['Direct citations','Coupling to your papers','Coupling to network','Authorship','Shared topics'];
const PS=['Citations','Your papers','Network','Authors','Topics'];   // short labels for phones
function list(){const box=document.getElementById('list');
  if(!NEWS.length){box.innerHTML=`<div class="empty">No paper in this listing reaches a score of ${M.threshold}.</div>`;document.getElementById('mainnet').hidden=true;return}
  NEWS.forEach(n=>{const d=document.createElement('article');d.className='paper';d.id='p'+n.i;
    d.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <h2>${esc(n.title)}</h2>
    <div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    <p class="abs">${esc(n.abstract)}</p><button class="linkbtn absmore" type="button" hidden>More</button>
    <p class="why">${why(n.note)}</p>
    <div class="row"><div class="bars">${n.parts.map((v,j)=>`<span><span class="pl">${P[j]}</span><span class="ps">${PS[j]}</span> <span class="mb"><i style="width:${Math.round(v*100)}%"></i></span></span>`).join('')}</div><span>${n.nlinked} of ${n.nref} references linked to INSPIRE · refs from ${esc(n.src)}</span></div>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a>${n.html?`<a href="https://arxiv.org/html/${esc(n.arxiv)}" target="_blank" rel="noopener" title="arXiv's experimental HTML version">HTML</a>`:''}<button class="linkbtn graphbtn" type="button">Show in network</button></div>`;
    d.querySelector('.graphbtn').addEventListener('click',()=>pick(n,true));
    d.querySelector('.absmore').addEventListener('click',e=>{const o=d.classList.toggle('open');e.target.textContent=o?'Less':'More'});
    box.appendChild(d)});
  toc();tex(box)}
// Phones: long author lists show the first 3 and "et al." (tap to expand); abstracts fold to 3 lines with More.
function authors(s){const a=String(s||'').split(', ');if(a.length<=3)return esc(s);
  return `<span class="au-short">${esc(a.slice(0,3).join(', '))} <button class="aubtn" type="button" aria-label="Show all ${a.length} authors">et al. (+${a.length-3})</button></span><span class="au-full">${esc(s)}</span>`}
document.addEventListener('click',e=>{const b=e.target.closest('.aubtn');if(b)b.closest('.authors').classList.add('open')});
function fold(){document.querySelectorAll('.paper').forEach(d=>{const p=d.querySelector('.abs'),b=d.querySelector('.absmore');
  if(!p||!b||d.classList.contains('open'))return;b.hidden=!(p.scrollHeight>p.clientHeight+2)})}
function toc(){const t=document.getElementById('toc');if(!NEWS.length)return;t.hidden=false;
  const X=RAW.next||[];
  t.innerHTML=`<h3>In this listing</h3><ol>${NEWS.map(n=>`<li><a href="#p${n.i}"><span class="sc${n.role==='repl'?' repl':''}">${n.score.toFixed(0)}</span><span class="tt">${esc(n.title)}</span></a></li>`).join('')}${X.length?`<li class="more-link"><a href="#more"><span class="sc">+${X.length}</span><span class="tt">The next ${X.length} papers by score (folded)</span></a></li>`:''}</ol>`;
  const m=t.querySelector('.more-link a');if(m)m.addEventListener('click',()=>{document.getElementById('more').open=true});tex(t)}
let sel=NEWS[0]||null, hover=null, query='', G;
const svg=d3.select('#svg'), tip=document.getElementById('tip');
function draw(){
  if(!NEWS.length)return;
  const RNG=d3.randomLcg(11);
  const W=Math.max(300,document.getElementById('chart').clientWidth), H=W<600?500:480, m={l:16,r:16,t:20,b:34};
  svg.attr('viewBox',`0 0 ${W} ${H}`); svg.selectAll('*').remove();
  const yrs=d3.extent(N,n=>n.year);
  const x=d3.scaleLinear().domain([yrs[0]-.5,yrs[1]+1.2]).range([m.l+8,W-m.r-8]);
  const ticks=x.ticks(W<600?6:12).filter(t=>Number.isInteger(t)&&t<=yrs[1]);
  svg.append('g').attr('class','grid').selectAll('line').data(ticks).join('line').attr('x1',d=>x(d)).attr('x2',d=>x(d)).attr('y1',m.t).attr('y2',H-m.b);
  svg.append('g').attr('class','axis').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x).tickValues(ticks).tickFormat(d3.format('d')).tickSizeOuter(0));
  const cy=(m.t+H-m.b)/2, xf=n=>isNew(n)?x(yrs[1]+.75):x(n.year);
  const sim=N.map(n=>({n,x:xf(n)+(RNG()-.5)*4,y:cy+(RNG()-.5)*H*.5}));
  const links=E.map(e=>({source:sim[e.s],target:sim[e.t],s:e.s,t:e.t,k:e.k}));
  d3.forceSimulation(sim).force('x',d3.forceX(s=>xf(s.n)).strength(1)).force('y',d3.forceY(cy).strength(.04))
    .force('link',d3.forceLink(links).strength(.03)).force('charge',d3.forceManyBody().strength(-40))
    .force('col',d3.forceCollide(s=>r(s.n)+2)).stop().tick(320);
  sim.forEach(s=>{s.y=Math.max(m.t+8,Math.min(H-m.b-8,s.y));s.x=Math.max(m.l+4,Math.min(W-m.r-4,s.x))});
  G=svg.append('g');
  G.append('g').selectAll('path').data(links).join('path').attr('class',l=>'edge '+l.k)
    .attr('d',l=>{const a=l.source,b=l.target;return `M${a.x},${a.y}Q${(a.x+b.x)/2},${(a.y+b.y)/2-Math.abs(a.x-b.x)*.12} ${b.x},${b.y}`});
  G.append('g').selectAll('circle').data([...sim].sort((a,b)=>RANK[b.n.role]-RANK[a.n.role])).join('circle')
    .attr('class','node').attr('cx',s=>s.x).attr('cy',s=>s.y).attr('r',s=>r(s.n)).attr('fill',s=>col(s.n))
    .on('pointerenter',(ev,s)=>{hover=s.n;showTip(ev,s.n);paint()}).on('pointermove',(ev,s)=>showTip(ev,s.n))
    .on('pointerleave',()=>{hover=null;tip.hidden=true;paint()}).on('click',(ev,s)=>pick(s.n,false));
  const lab=sim.filter(s=>isNew(s.n)||s.n.role==='seed'||s.n.deg>=3);
  const L=lab.map(s=>{const right=s.x>W*.8,t=isNew(s.n)?`#${s.n.rank} ${s.n.first}`:`${s.n.first} ${s.n.year}`,w=t.length*6.2;return{s,t,right,x0:right?s.x-r(s.n)-4-w:s.x+r(s.n)+4,w,y:s.y+4}}).sort((a,b)=>a.y-b.y);
  const placed=[];L.forEach(l=>{let k=0;while(k<40&&placed.some(p=>l.x0<p.x0+p.w&&p.x0<l.x0+l.w&&Math.abs(l.y-p.y)<13)){l.y+=13*(k%2?-1:1)*(1+Math.floor(k/2));k++;l.y=Math.max(m.t+10,Math.min(H-m.b-4,l.y))}placed.push(l)});
  G.append('g').selectAll('text').data(L).join('text').attr('class','nlabel').attr('x',l=>l.right?l.s.x-r(l.s.n)-4:l.s.x+r(l.s.n)+4).attr('y',l=>l.y)
    .attr('text-anchor',l=>l.right?'end':'start').text(l=>l.t);
  paint();
}
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  const nmin=M.nextMin;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}${nmin!=null?`: every paper scoring ${nmin} or more, and at least ${M.nextCount} when available`:''}; not drawn in the network`;
  const cut=nmin!=null?X.findIndex(n=>n.score<nmin):-1;
  box.innerHTML=X.map((n,i)=>(i===cut?`<li class="divider">Below ${nmin}: weaker relation (most of these share no specific reference, coupling or topic with your work)</li>`:'')+`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
// the rest of the day's papers by score: only the title, linked to the arXiv record
function restList(){const X=RAW.rest||[];if(!X.length)return;const d=document.getElementById('rest'),box=document.getElementById('restlist');
  d.hidden=false;d.querySelector('summary').firstChild.textContent=`All other ${X.length} papers in this listing `;
  document.getElementById('restsub').textContent='by score, title only';
  box.innerHTML=X.map(n=>`<li><span class="sc">#${n.rank} · ${n.score.toFixed(1)}</span><a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">${esc(n.title)}</a></li>`).join('');
  d.addEventListener('toggle',()=>{if(d.open)tex(box)})}
list();nextList();restList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
