<script>
const RAW = {"n":[{"id":"3230114","arxiv":"2611.21278","title":"Mono-Z Signatures of Vector Dark Matter Detection at Future Electron-Positron Colliders: FCC-ee and ILC","first":"Ayazi","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 3 network papers: [[3224074]], [[2843521]], [[2684223]]. Closest of your papers: [[1746620]] (coupling 0.02, 3 shared references). Closest network paper: [[3133857]] (coupling 0.14, 11 shared references). Shared topics: gauge symmetry.","score":39.7,"rank":1,"section":"new","parts":[0.83,0.06,0.41,0.0,0.24],"abstract":"We investigate the mono-$Z$ signature of a vector dark matter (VDM) model at future electron-positron colliders. In this model, a stable vector boson, arising from an extended $U(1)$ gauge symmetry, serves as a viable DM candidate that interacts with the Standard Model (SM) through a Higgs portal. We perform a detailed cut-based analysis for the mono-$Z$ channel at the FCC-ee (with $\\sqrt{s}=240$ and $365$ GeV) and the ILC (with $\\sqrt{s}=1$ TeV), considering both leptonic and hadronic decays of the $Z$ boson. Signal significances are evaluated for benchmark points using fast event simulation with MadGraph5, PYTHIA8, and Delphes3. Our results demonstrate that future $e^+e^-$ colliders provide excellent sensitivity to Higgs-portal VDM, with the ILC's beam polarization offering an additional handle to suppress SM backgrounds. This study highlights the potential of lepton colliders in probing DM interactions.","authors":"Seyed Yaser Ayazi, Saeid Paktinat Mehdiabadi, Rouzbeh Rouzbehi","nlinked":77,"nref":79,"src":"INSPIRE","html":true},{"id":"3155167","arxiv":"2605.12946","title":"Minimal Majoron Dark Matter","first":"Akita","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[2940283]], [[851494]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[452755]] (coupling 0.04, 3 shared references). Closest network paper: [[2654052]] (coupling 0.13, 20 shared references).","score":36.1,"rank":2,"section":"replacement","parts":[0.72,0.14,0.37,0.0,0.13],"abstract":"We study Majoron dark matter (DM) in its minimal realization, based on the Type-I seesaw framework extended by a SM-singlet complex scalar. Remaining agnostic about the origin and value of the Majoron mass, we evaluate the DM abundance from both the freeze-in and misalignment mechanisms, and identify the viable parameter space consistent with observational constraints. Without fine-tuning of the initial misalignment angle, we find that the Majoron mass is bounded by $m_J \\lesssim \\mathcal{O}(10)~\\mathrm{MeV}$. We also discuss compatibility with thermal leptogenesis. Successful leptogenesis with two right-handed neutrinos favors misalignment-dominated production with the Majoron mass $m_J \\lesssim \\mathcal{O}(100)~\\mathrm{eV}$, while freeze-in dominated production is compatible with leptogenesis only with a mild fine-tuning of the initial misalignment angle, $θ_i \\lesssim \\mathcal{O}(0.01)$.","authors":"Kensuke Akita, Koichi Hamaguchi, Haruto Kitagawa, Tatsuya Yokoyama","nlinked":65,"nref":65,"src":"INSPIRE","html":true},{"id":"3200309","arxiv":"2609.05291","title":"Inelastic from the Other Side: Xenon Excitation Signals in Light of the LZ High-Recoil Event","first":"Gu","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[913031]]. Closest of your papers: [[2859009]] (coupling 0.04, 5 shared references). Closest network paper: [[3201080]] (coupling 0.28, 18 shared references).","score":31.6,"rank":3,"section":"replacement","parts":[0.45,0.11,0.79,0.0,0.07],"abstract":"The LUX-ZEPLIN (LZ) experiment recently reported a single event consistent with a nuclear recoil of $E_{\\rm NR}\\sim248$~keV in an extended-energy search. We study the accompanying inelastic-xenon channel, $χ+Xe\\toχ+Xe^{*}$, as a complementary test of dark matter (DM) interpretations of such high-recoil events. Using the non-relativistic effective-field-theory (NREFT) framework, we compute the inelastic-xenon rates for representative scenarios including accelerated DM populations and inelastic dark matter. Their signal patterns in the S1--S2 plane are reconstructed. The nuclear de-excitation shifts these signals toward the electronic-recoil band, where they may overlap with clustered isotope backgrounds. We then propose a schematic, physics-motivated background model to estimate their detectability. For many benchmarks, the inelastic-xenon rates are $\\mathcal{O}(0.1)$ of the elastic rates or below, and the projected sensitivity remains weak even at $200~{\\rm tonne\\,yr}$ for the scenarios investigated. Our results provide additional inelastic-xenon signal predictions for various DM scenarios and motivate improved high-energy background modeling and detector calibration for future searches.","authors":"Guanhua Gu, Lingfeng Li, Shao-Song Tang, Yongheng Xu","nlinked":72,"nref":74,"src":"INSPIRE","html":true},{"id":"3168985","arxiv":"2606.17044","title":"Fermi-eROSITA cross-correlations suggest annihilation lines of $\\sim70$ GeV WIMPs","first":"Keshet","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1304242]]. Also cites widely used network papers: [[1518747]], [[2817040]]. Closest of your papers: [[2855387]] (coupling 0.05, 9 shared references). Closest network paper: [[2936837]] (coupling 0.06, 12 shared references).","score":25.7,"rank":4,"section":"replacement","parts":[0.51,0.15,0.17,0.0,0.07],"abstract":"The deep potential wells of galaxy clusters provide some of the strongest constraints on the velocity-dependent ($p$-wave) annihilation of weakly interacting massive particle (WIMP) dark matter. Cross-correlating high-latitude Fermi-LAT 16.3-year data with the western Galactic hemisphere eROSITA map facilitates high-sensitivity tests. A blind composite matched-filter scan of the cross-correlated spectrum for the $χχ\\toγγ$, $γZ$, and $γh$ annihilation-line triad of a single WIMP $χ$ finds $m_χc^2\\simeq71.9$ and $67.5$ GeV (observer-frame) triads, each with a local $Z$-score $\\sim3$ and a (henceforth global) $1.7$-$2.1σ$ (trial-corrected), insensitive to details of detrending, sky masks, and filters. The leading nonad (equidistant three triads) corresponds to $66.4$ and $71.9$ GeV cross-annihilating WIMPs ($2.5σ$). The leading $\\sim72$ GeV triad coincides with the mass implied by interpreting the reported $\\sim43.2$ GeV $γ$-ray line in three nearby clusters as its $γZ$ channel. At this externally fixed mass, the triad reaches $3.0σ$ alone, and $5.1σ$ when combined with the reported line ($3.8σ$ under alternative assumptions; similar values for the nonad). This triad, absent from the ambient (X-ray-uncorrelated) spectrum, presents in different Galactic sectors, strengthens under cosmological (positive) but not negative redshift broadening $Δz$, and peaks at $Δz\\simeq 0.05$, consistent with galaxy clusters; its two non-$43$ GeV channels reach $2.4σ$ by themselves. Measured (not loss-corrected) intrinsic cross sections are a few $10^{-19}$ cm$^3$ s$^{-1}$ for WIMPs tracing the X-ray gas.","authors":"Uri Keshet","nlinked":118,"nref":136,"src":"INSPIRE","html":true},{"id":"3230059","arxiv":"2611.21252","title":"Phenomenology of neutrino mass ordering synergies in reactor, accelerator, and atmospheric neutrino experiments, and the role of the detector response","first":"Cerrone","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1708009]] (coupling 0.01, 1 shared references). Closest network paper: [[2721859]] (coupling 0.04, 4 shared references). Shared topics: neutrino mass, neutrino physics.","score":23.8,"rank":5,"section":"new","parts":[0.45,0.04,0.12,0.0,0.52],"abstract":"The neutrino mass ordering is one of the main open questions of neutrino physics, addressed by reactor, accelerator, and atmospheric experiments and by their combination. When the data are fitted under the wrong ordering, each experiment returns its own value of $Δm^2_{31}$, its wrong-ordering solution. We show that this solution is a weighted average of the values preferred by the individual bins of the measured event spectra, in reconstructed energy and, for atmospheric neutrinos, also zenith angle, with weights set by their statistical precision. Both the values and the weights depend on the detector response. In the plane of $Δm^2_{31}$ fitted under the two orderings, the solutions lie on lines of slope close to $-1$, so that each experiment is described by one intercept. The weighted bin average extends the mass ordering sum rule to any oscillation experiment, including atmospheric neutrinos in Earth matter. It recovers the known closed forms for short-baseline reactors and for accelerators in vacuum, and for JUNO it equals a closed form evaluated at one effective energy, which depends on the energy resolution. Above the MSW resonance the frequency of atmospheric $ν_μ$ disappearance becomes nearly independent of $δ_{CP}$, and the $ν_μ$ disappearance solution moves mainly with $θ_{23}$. The atmospheric intercept depends on the energy and direction resolutions, the energy window, and the event classes, and differs between detectors. The synergy of two experiments is determined by the separation of their intercepts relative to their precisions on $|Δm^2_{31}|$. With JUNO, this separation depends strongly on $δ_{CP}$ for an accelerator and is nearly independent of $δ_{CP}$ and $θ_{23}$ for IceCube DeepCore using all channels.","authors":"Vanessa Cerrone, Marco Grassi","nlinked":96,"nref":111,"src":"INSPIRE","html":true},{"id":"3229936","arxiv":"2611.19831","title":"Exploring X17 Couplings through Meson Dalitz Decays","first":"Wang","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1708009]] (coupling 0.04, 1 shared references). Closest network paper: [[3214448]] (coupling 0.06, 4 shared references).","score":21.2,"rank":6,"section":"new","parts":[0.45,0.09,0.18,0.0,0.0],"abstract":"The ATOMKI collaboration has reported anomalous $e^+e^-$ pair production in a series of nuclear transitions, which has been interpreted as a possible signature of a new light boson, X17. Meson Dalitz decays provide a complementary probe of the X17 interaction structure. However, the widely studied vector coupling scenario is in tension with the combined constraints from existing $D^{*0}\\to D^0e^+e^-$, $D_s^{*+}\\to D_s^+e^+e^-$ measurements and nuclear transition analyses. In this work, we investigate the X17 contributions to meson Dalitz decays within a framework incorporating both vector and axial-vector couplings, employing the Bethe--Salpeter approach to calculate the hadronic transition matrix elements. With $u$ and $d$ quark couplings taken from previous analyses, we identify allowed regions for the charm and strange quark couplings, which require the axial-vector coupling strength $|g_{c,s}^A|\\sim10^{-3}$. We obtain four degenerate best-fit solutions, one of which is $(g_c^V,g_c^A,g_s^V,g_s^A)=(8.32,1.09,-2.62,1.36)\\times10^{-3}$, and estimate the decay ratio $R^{\\mathrm{th}}(D^{*+}\\to D^+e^+e^-)$, which significantly exceeds the Standard Model prediction.","authors":"Xuan Wang, Tianhong Wang, SiQi Zhang, Guo-Li Wang","nlinked":32,"nref":32,"src":"INSPIRE","html":true},{"id":"3229406","arxiv":"2611.18830","title":"Determination of $V_{ud}$ from superallowed $β$ decays using effective field theory","first":"Novario","nauth":8,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[2690106]] (coupling 0.02, 2 shared references). Closest network paper: [[1847652]] (coupling 0.08, 9 shared references).","score":21.2,"rank":7,"section":"cross","parts":[0.45,0.06,0.24,0.0,0.0],"abstract":"A precision determination of $V_{ud}$ from superallowed $β$ decays requires exquisite control over radiative corrections, including nuclear-structure-dependent effects whose evaluation has traditionally relied on nuclear models. To assess the uncertainties inherent in the nuclear matrix elements, an alternative strategy based on effective field theory (EFT) has been established in recent years. Here, we present material progress in this program, in terms of a first EFT calculation of the crucial correction $\\barδ_\\text{NS}$ for 12 superallowed transitions ranging from $^{10}$C $\\rightarrow$ $^{10}$B to $^{54}$Co $\\rightarrow$ $^{54}$Fe. These main results rely on nuclear ab initio calculations using the coupled cluster method, benchmarked against Quantum Monte Carlo evaluations for light nuclei. The global fit to superallowed decay rates reveals that the precision in $V_{ud}$ is currently limited by short-distance contributions that in the EFT are parameterized as two-nucleon contact interactions, leading to an uncertainty $δV_{ud}\\simeq 6\\times 10^{-4}$. We discuss the consequences for the status of the first-row unitarity test of the CKM matrix as well as a roadmap how to reduce the uncertainty in $V_{ud}$ in the future.","authors":"Samuel Novario, Graham Chambers-Wall, Vincenzo Cirigliano, Wouter Dekens, Jordy de Vries, Stefano Gandolfi, Martin Hoferichter, Emanuele Mereghetti","nlinked":104,"nref":112,"src":"INSPIRE","html":true},{"id":"3229388","arxiv":"2611.18843","title":"Ab initio calculations of ${\\barδ_\\text{NS}}$ and extraction of ${V_{ud}}$ using effective field theory","first":"Novario","nauth":8,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[2690106]] (coupling 0.02, 2 shared references). Closest network paper: [[1847652]] (coupling 0.07, 9 shared references).","score":20.2,"rank":8,"section":"cross","parts":[0.45,0.05,0.2,0.0,0.0],"abstract":"Radiative corrections limit the precision of $V_{ud}$ extractions from superallowed $β$ decays. In particular, the model dependence in the nuclear matrix elements (NMEs) is difficult to assess without a clear organizing principle, which is provided by effective field theory (EFT). We report substantial progress in this program based on ab initio nuclear calculations using the coupled cluster method. Benchmarking results against Quantum Monte Carlo calculations for light nuclei, we evaluate all two-body NMEs that enter the correction $\\barδ_\\text{NS}$ across 12 superallowed transitions relevant for $V_{ud}$, including an estimate of truncation and Hamiltonian uncertainties. We find that certain three-body NMEs at ${\\mathcal O}(α^2)$ play an important role, due to a combination of large numerical prefactors and coherent scaling with $Z^2$. We develop a formalism to estimate such NMEs based on nuclear densities to complete the EFT evaluation of $\\barδ_\\text{NS}$, validating the corresponding two-body NMEs against ab initio calculations. We further identify the corrections in the traditional phase-space factor that are captured by the EFT and remove them consistently, which renders the individual transitions mutually consistent. Profiting from a recent calculation of ${\\mathcal O}(α^2 Z)$ ultrasoft photons, we find that the scale uncertainty in the EFT is now negligible, while the remaining uncertainty is dominated by contact terms required to renormalize the magnetic Gamow-Teller NMEs. One combination of low-energy constants can be determined from a global fit to the superallowed data, but the second one proves strongly correlated with $V_{ud}$, necessitating additional input to resolve the nuclear-structure effects. We argue that such short-distance contributions currently imply an uncertainty in $V_{ud}$ at the level of $δV_{ud}\\simeq 6\\times 10^{-4}$.","authors":"Samuel Novario, Graham Chambers-Wall, Vincenzo Cirigliano, Wouter Dekens, Jordy de Vries, Stefano Gandolfi, Martin Hoferichter, Emanuele Mereghetti","nlinked":148,"nref":162,"src":"INSPIRE","html":true},{"id":"3219126","arxiv":"2610.35818","title":"Holographic Approaches to Hadron Structure","first":"Cappiello","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1397629]] (coupling 0.01, 1 shared references). Closest network paper: [[813721]] (coupling 0.03, 14 shared references).","score":18.6,"rank":9,"section":"replacement","parts":[0.48,0.02,0.08,0.0,0.0],"abstract":"We give an introduction to and an overview of holographic approaches to QCD and hadron structure. After an introduction to the string-theoretic foundations of holographic QCD, we review the predictions of top-down and bottom-up models for the phenomenology of mesons, baryons, and glueballs. We focus on the top-down model following from probe flavor branes in the Witten model of low-energy Yang-Mills theory and, in the more phenomenological approach of bottom-up models, mostly on minimal models based on five-dimensional anti-de Sitter space, which also implement global symmetries and their anomalies consistently, but allow the high-energy behavior to better match real QCD.","authors":"Luigi Cappiello, Anton Rebhan, Shigeki Sugimoto","nlinked":382,"nref":615,"src":"INSPIRE","html":false},{"id":"3180735","arxiv":"2607.13142","title":"Connecting $B\\to K^{(\\ast)}νν$ and $K\\to πνν$ decays with neutrino physics","first":"Abada","nauth":6,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1686334]] (coupling 0.01, 2 shared references). Closest network paper: [[2813804]] (coupling 0.21, 23 shared references). Shared topics: neutrino mass, neutrino physics, lepton number.","score":18.2,"rank":10,"section":"replacement","parts":[0.06,0.03,0.61,0.0,0.61],"abstract":"We investigate the contributions of Lepton Number Violating (LNV) effective operators to the rare decays $B\\to K^{(\\ast)}νν$ and $K\\to πνν$. Such operators can modify the kinematic distributions of these processes, providing distinctive probes of physics beyond the Standard Model. Through a renormalization-group analysis, we show that the Standard Model Effective Field Theory (SMEFT) operators responsible for these effects are subject to stringent indirect constraints from neutrino physics. In particular, we find that the mild excess reported by Belle-II in the $B^+\\to K^+νν$ channel cannot be explained by LNV SMEFT operators without introducing significant fine-tuning in neutrino masses. We then show that these constraints can be evaded in the SMEFT minimally extended by a light right-handed neutrino, allowing for sizable effects in rare meson decays. Finally, we explore the implications of this viable scenario for low-energy processes, including neutrinoless double-beta decays.","authors":"Asmaa Abada, Claire Chevallier, Luighi P. S. Leal, Anna Llauradó, Olcyr Sumensari, Renata Zukanovich Funchal","nlinked":106,"nref":106,"src":"INSPIRE","html":true},{"id":"3230020","arxiv":"2611.20588","title":"Doubly strange tetraquark as a $KK^*$ virtual state: quark-model study with harmonic traps","first":"Zhang","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3227657]] (coupling 0.04, 1 shared references).","score":17.6,"rank":11,"section":"new","parts":[0.45,0.0,0.12,0.0,0.0],"abstract":"We extract hadron--hadron scattering information from quark-level interactions using an artificial harmonic trap and a four-quark basis that includes both meson--meson and compact diquark--antidiquark configurations. Combining the Busch--Englert--Rzażewski--Wilkens formula with the effective range expansion (ERE), we determine phase shifts, scattering lengths, effective ranges, and pole positions from the trapped spectrum. We control uncertainties from basis truncation, finite trap frequencies, truncation of ERE, and quark-model parameters. The extracted $DD^*$ and $BB^*$ binding energies agree with direct calculations, providing benchmarks. For the doubly strange $T_{ss}$ with $I(J^P)=0(1^+)$, we predict a $KK^*$ virtual-state pole about 30--35~MeV below threshold in the stable-$K^*$ approximation. Both the AL1 model and its modified version that better reproduces the measured $T_{cc}^+$ binding energy yield this result. This finding differs from earlier predictions of a bound state and motivates searches for the $T_{ss}$ at facilities such as the High Intensity heavy Ion Accelerator Facility (HIAF). This framework could be extended to other hadron-hadron channels to extract scattering observables and pole positions.","authors":"Kai-Kai Zhang, Zi-Yang Lin, Yan-Ke Chen, Lu Meng","nlinked":7,"nref":7,"src":"INSPIRE","html":true},{"id":"3228114","arxiv":"2611.16576","title":"Low-lying doubly charmed strange baryons via QCD sum rules","first":"Yang","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[1710056]] (coupling 0.04, 11 shared references).","score":17.4,"rank":12,"section":"replacement","parts":[0.45,0.0,0.11,0.0,0.0],"abstract":"We systematically investigate the masses of the low-lying doubly heavy baryons and their $B^*(3/2^+)\\to B(1/2^+)γ$ radiative transitions within QCD sum rules and light-cone sum rules (LCSR). By constructing mixed interpolating currents, we obtain $M_{Ξ_{cc}}=3.62^{+0.14}_{-0.15}$ GeV, $M_{Ξ_{cc}^*}=3.72^{+0.14}_{-0.13}$ GeV, $M_{Ω_{cc}}=3.72^{+0.13}_{-0.15}$ GeV, and $M_{Ω_{cc}^*}=3.82^{+0.13}_{-0.15}$ GeV, together with their doubly bottom partners around $10.27$--$10.34$ GeV. The extracted masses are compatible with the observed $Ξ_{cc}$ and $Ω_{cc}$ states and predict hyperfine splittings of about $101^{+27}_{-11}$ MeV and $99^{+11}_{-12}$ MeV for the $Ξ_{cc}$ and $Ω_{cc}$ systems, respectively. Using these inputs, we derive the LCSR for the electromagnetic form factors and obtain radiative widths $Γ(Ξ_{cc}^{*++}\\toΞ_{cc}^{++}γ)=5.25^{+8.57}_{-3.62}$ keV, $Γ(Ξ_{cc}^{*+}\\toΞ_{cc}^{+}γ)=0.31^{+0.84}_{-0.25}$ keV, and $Γ(Ω_{cc}^{*+}\\toΩ_{cc}^{+}γ)=0.41^{+0.67}_{-0.30}$ keV, while the corresponding doubly bottom widths are at the $0.002$--$0.01$ keV level. We find that the magnetic-dipole contribution dominates, whereas the electric-quadrupole form factor is numerically small. The light- and heavy-quark photon-emission terms can interfere or enhance significantly, and the heavy-quark contribution cannot be neglected in radiative transitions. These results provide useful theoretical guidance for future searches for spin-$3/2$ doubly heavy baryons through radiative decay modes at LHCb, Belle II, and other experimental facilities.","authors":"Hui-Min Yang, Hua-Xing Chen, Xuan Luo","nlinked":53,"nref":55,"src":"INSPIRE","html":false},{"id":"3230054","arxiv":"2611.21380","title":"Heavy double-gluon quarkonium and $\\overline{b}ggc$ mesons","first":"Esmer","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3193100]] (coupling 0.03, 19 shared references).","score":17.0,"rank":13,"section":"new","parts":[0.45,0.0,0.08,0.0,0.0],"abstract":"We investigate heavy double-gluon hybrid mesons, built from a heavy quark-antiquark pair and two valence gluons, using the two-point QCD sum rule method. The charmonium-like $\\bar{c}GGc$ and bottomonium-like $\\bar{b}GGb$ states are considered with $J^{PC}=0^{\\pm\\pm}$ and $1^{\\pm\\pm}$, whereas the open-flavor $\\bar{b}GGc$ states are classified by $J^{P}=0^{\\pm}$ and $1^{\\pm}$. The currents with $J^{PC}=0^{+-}, 0^{--}, 1^{++}$, and $1^{-+}$ vanish identically, so sum rules are derived for the remaining four channels. The operator product expansion is carried out up to dimension twelve, and the Borel parameter and continuum threshold are fixed so that the pole contribution dominates and the OPE converges. The resulting masses lie in the ranges $M\\simeq 6.2$--$6.7$~GeV for $\\bar{c}GGc$, $M\\simeq 12.0$--$12.2$~GeV for $\\bar{b}GGb$, and $M\\simeq 9.2$--$9.6$~GeV for $\\bar{b}GGc$, and the current couplings are obtained for all channels. These predictions provide a basis for analyzing the strong decays of double-gluon hybrids and for interpreting future experimental data in the heavy-quark sector.","authors":"G. Daylan Esmer, B. Barsbay, K. Azizi, H. Sundu, S. Türkmen","nlinked":35,"nref":38,"src":"INSPIRE","html":true},{"id":"3227703","arxiv":"2611.15158","title":"Novel method for measuring the isovector partner of X(3872)","first":"Tan","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3193100]] (coupling 0.03, 21 shared references).","score":17.0,"rank":14,"section":"replacement","parts":[0.45,0.0,0.08,0.0,0.0],"abstract":"The predicted isovector partner of the $X(3872)$, denoted as $W_{c1}$, is expected to produce only a relatively weak structure near the charged $D \\bar{D}^*$ threshold, making its experimental identification challenging. In this work, we explore the triangle singularity (TS) mechanism as a means of enhancing the sensitivity to the $W_{c1}$ in the decays $B^0 \\to πK \\bar{D}^0 D^{*0}$. We investigate the $D_{s1}(2536) \\bar{D}^*$ triangle rescattering mechanism, incorporating the coupled-channel $D \\bar{D}^*$ scattering amplitudes obtained from the Lippmann-Schwinger equation. The interplay between the TS and the coupled-channel dynamics produces characteristic structures in the $K \\bar{D}^0 D^{*0}$ invariant mass distributions associated with the $X(3872)$ and its isovector partner $W_{c1}$. In particular, the charged-channel contribution exhibits a distinct structure sensitive to the nearby $W_{c1}$ pole. Our results demonstrate that the TS mechanism provides a promising way to probe the otherwise weak manifestation of the $W_{c1}$, offering a complementary experimental strategy for searching for this predicted state at Belle II and LHCb.","authors":"Qiu-Lin Tan, Mao-Jun Yan, Chun-Sheng An, Cheng-Rong Deng, Xiao-Hai Liu","nlinked":42,"nref":43,"src":"INSPIRE","html":true},{"id":"3184783","arxiv":"2607.27603","title":"Unbiased Data-Driven Determination of the Nuclear Dipole Amplitude in the Color Glass Condensate","first":"Dai","nauth":7,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[2824738]] (coupling 0.02, 3 shared references).","score":16.6,"rank":15,"section":"replacement","parts":[0.45,0.0,0.05,0.0,0.0],"abstract":"Gluon saturation limits the growth of parton densities at small Bjorken-$x$ and is expected to be most pronounced in heavy nuclei. Yet quantitative extractions of the nuclear gluon dipole amplitude have long relied on parametrized initial conditions, introducing uncontrolled model dependence that obscures genuine nuclear effects. We introduce a physics-informed neural-network framework that embeds the collinearly improved Balitsky-Kovchegov evolution equation directly into the training objective, allowing the impact-parameter-averaged dipole amplitude to be determined from data without assuming a functional form for its initial condition. Applying this framework to forward-hadron nuclear-modification-factor and coherent $J/ψ$ photoproduction data, we extract the $^{208}$Pb dipole amplitude at $x_0=0.01$ with QCD evolution and momentum-space positivity enforced throughout training. The evolved amplitude reproduces the measured cross sections across the available kinematic range and yields a saturation-scale ratio $Q_{s0,\\mathrm{Pb}}^2/Q_{s0,p}^2 = 3.17^{+0.17}_{-0.10}$, consistent with simple geometric scaling. The extracted Pb initial condition is well described by a McLerran-Venugopalan-type form, in contrast to the proton, reflecting the higher color-charge density of a large nucleus. Using the same amplitude, we predict the rapidity dependence of the transverse-momentum ratio in $pp$, $p$Pb, and Pb$p$ collisions, finding agreement with recent LHCb measurements at low multiplicity without any system-dependent parameters. This work provides the first unbiased, data-driven determination of nuclear structure in the saturation regime and establishes a general strategy for embedding nonlinear evolution equations into machine-learning extractions of dynamically constrained observables.","authors":"Si-Wei Dai, Haowu Duan, Long-Gang Pang, Guang-You Qin, Shu-Yi Wei, Han-Zhong Zhang, Wenbin Zhao","nlinked":94,"nref":105,"src":"INSPIRE","html":false},{"id":"3230045","arxiv":"2611.21112","title":"Global analysis of the $ρ$ resonance in lattice QCD","first":"Jevsenak","nauth":6,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3193100]] (coupling 0.02, 14 shared references).","score":16.5,"rank":16,"section":"cross","parts":[0.45,0.0,0.05,0.0,0.0],"abstract":"We present a lattice-QCD study of the $ρ$ resonance in which we address the quark-mass and lattice-spacing dependence in a novel way using a global analysis of four $N_f=2+1$ ensembles. We parametrize discretization effects in the lattice energy levels and not in the scattering amplitude, which is defined in the continuum. We describe the amplitude using a $K$-matrix parameterization, which contains the light- and strange-quark mass dependence. By varying the parameterizations of quark-mass and lattice-spacing dependence, we examine the sensitivity of the physical-limit $ρ$ pole position to these choices and obtain the result $\\sqrt{s}_ρ= 744(11)(7) - i\\,69(7)(3)~\\text{MeV}$ from a model average.","authors":"Luka Jevsenak, Luka Leskovec, Stefan Meinel, John Negele, Srijit Paul, Andrew Pochinsky","nlinked":47,"nref":49,"src":"INSPIRE","html":true},{"id":"3230000","arxiv":"2611.20747","title":"Dimension-seven spectator effects in charm-hadron lifetimes at NLO","first":"Liu","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3227657]] (coupling 0.01, 1 shared references).","score":16.4,"rank":17,"section":"new","parts":[0.45,0.0,0.04,0.0,0.0],"abstract":"We compute the next-to-leading-order (NLO) QCD corrections to the connected current-current part of the dimension-seven spectator coefficients in the heavy-quark expansion of charm-hadron widths. The finite terms are fixed in NDR-$\\overline{\\rm MS}$, with the evanescent operators defined by the standard Greek projection and averaged over Hermitian-conjugate pairs, and with a finite subtraction that sets the finite mixing of the dimension-seven operators into the dimension-six ones to zero. In several channels the one-loop term is comparable to the LO coefficient, and two operator families absent at LO are generated. Since the NLO matrix elements of the dimension-seven operators are not known, we estimate the effect of the coefficients on the widths with tree-level matrix elements from vacuum insertion for $D$ mesons and from the bag model for charmed baryons. The $1/m_c$ corrections to the matrix elements of the dimension-six QCD operators are treated by a naive expansion. Without their $O(α_s)$ part the semileptonic width of the $D_s^+$ would be negative. The NLO dimension-seven correction raises the $D^+$ width by 0.78 ps$^{-1}$, so that its central value, slightly negative as published, becomes positive. At central inputs, it is about 1% of the $D^0$ width, 10% of the $D_s^+$ width and at most 2% of the widths of the singly charmed baryons. Added to the published pole-scheme width, the $D^+$ correction gives $τ(D^+)=1.41^{+\\infty}_{-0.76}$ ps. The NLO term reduces the scale dependence of the nonleptonic dimension-seven contribution severalfold for the singly charmed baryons, whose matrix elements are evolved, but not uniformly for the $D$ mesons.","authors":"Chia-Wei Liu","nlinked":54,"nref":58,"src":"INSPIRE","html":true},{"id":"3230136","arxiv":"2611.21537","title":"The Skyrme-Dilaton and Nucleon Observables","first":"Fischbacher","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3227657]] (coupling 0.01, 1 shared references).","score":16.3,"rank":18,"section":"new","parts":[0.45,0.0,0.04,0.0,0.0],"abstract":"We extend the Skyrme model by incorporating the $σ/f_0(500)$-meson as a dilaton. The motivation is twofold: the $σ$-meson is the lightest scalar resonance in QCD and is therefore the natural extensions to the pions of the classical Skyrme model, while its interpretation as a pseudo-Goldstone boson of spontaneously broken scale symmetry is supported by recent studies of gravitational form factors and related developments. Although the $σ$-meson is a broad resonance, for static observables it can be treated as real particle since its line-shape is not expected to be essential. A combined fit to static nucleon observables yields $χ^2/\\mathrm{dof} $ close to unity, with substantial improvement over the original Skyrme model, while simultaneously reproducing the physical value of $F_π$, the overall scale of the model.","authors":"Thomas Fischbacher, Roman Zwicky","nlinked":65,"nref":76,"src":"INSPIRE","html":true},{"id":"3174532","arxiv":"2606.29380","title":"$λ$, $ρ$, and $σ$ Regge trajectories for the hexaquark ${(\\bar{u}(cc))(b(\\bar{b}\\bar{b}))}$ in the triquark-antitriquark picture","first":"Liu","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3227657]] (coupling 0.01, 1 shared references).","score":16.2,"rank":19,"section":"replacement","parts":[0.45,0.0,0.03,0.0,0.0],"abstract":"We propose Regge trajectory relations for the hexaquark ${(\\bar{u}(cc))(b(\\bar{b}\\bar{b}))}$ by using the Regge trajectory relations for diquarks and triquarks. With these newly derived relations, we investigate five series of hexaquark Regge trajectories: the $λ$-, $ρ_1$-, $ρ_2$-, $σ_1$-, and $σ_2$-trajectories. We demonstrate that, apart from the simplest $λ_1$-trajectories, the $ρ_1$-, $ρ_2$-, $σ_1$-, and $σ_2$-trajectories cannot be constructed by merely mimicking the meson Regge trajectories, since mesons possess no internal substructures. To derive these trajectories, one must account for the structure and internal substructure of the hexaquark. Without this structural information, the $ρ_1$-, $ρ_2$-, $σ_1$-, and $σ_2$-trajectories could only be obtained through direct fits to available theoretical predictions or future experimental data. We demonstrate that the $ρ_1$-, $ρ_2$-, $σ_1$-, and $σ_2$-trajectories for the hexaquark do not correspond respectively to the Regge trajectories for the triquark, antitriquark, diquark, and antidiquark. Nevertheless, their behaviors match those of the Regge trajectories for the triquark $(\\bar{u}(cc))$, the antitriquark $(b(\\bar{b}\\bar{b}))$, the diquark $(cc)$, and the antidiquark $(\\bar{b}\\bar{b})$, in that respective order. Furthermore, we present rough mass estimates for the excited states corresponding to the $λ$-, $ρ_1$-, $ρ_2$-, $σ_1$-, and $σ_2$-trajectories.","authors":"Xin-Ru Liu, Qi Liu, Jiao-Kai Chen","nlinked":113,"nref":116,"src":"INSPIRE","html":true},{"id":"3161874","arxiv":"2605.27513","title":"Constraints on a Light Leptophilic Scalar from Dark-Sector Couplings","first":"Graziani","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[813721]]. Closest of your papers: [[2859009]] (coupling 0.05, 6 shared references). Closest network paper: [[1989085]] (coupling 0.09, 11 shared references). Shared topics: fermion dark matter, relic abundance.","score":15.7,"rank":20,"section":"replacement","parts":[0.06,0.13,0.25,0.0,0.61],"abstract":"We study a minimal framework where a Majorana fermion dark matter particle interacts with a light scalar mediator coupled mainly to electrons. We examine both freeze-out and freeze-in production to determine the regions of parameter space that yield the correct relic abundance with particular emphasis on a detailed comparison with results in the recent literature. The analysis includes cosmological and astrophysical constraints as well as laboratory bounds from electron-recoil experiments, fixed target searches, and precision measurements. The combined results identify a narrow but viable parameter region, favoring sub-GeV dark matter, and define clear targets for future experimental tests. This highlights the strong complementarity between direct-detection experiments and collider searches. We additionally investigate the mediator-mass region around 17 MeV, motivated by the hints reported by the ATOMKI experiment and the PADME collaboration, including couplings between the mediator and light quarks. Direct searches already constrain a large region of the parameter space, even when dark matter is produced via freeze-in, pointing again to sub-GeV dark matter.","authors":"Marco Graziani, Giacomo Landini, Federico Mescia, Claudio Toni, Ludovico Vittorio","nlinked":125,"nref":131,"src":"INSPIRE","html":true},{"id":"3228059","arxiv":"2611.16191","title":"Connecting Electroweak Fine-Tuning, Tens-of-GeV Dark Matter, and Exotic Higgs Decays in the GNMSSM","first":"Heng","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[1518747]]. Closest of your papers: [[505185]] (coupling 0.02, 4 shared references). Closest network paper: [[1724453]] (coupling 0.06, 16 shared references). Shared topics: dark matter candidate, direct detection.","score":11.3,"rank":21,"section":"replacement","parts":[0.06,0.07,0.17,0.0,0.46],"abstract":"In the general next-to-minimal supersymmetric standard model (GNMSSM), we connect electroweak fine-tuning, a singlino dark matter candidate with mass around tens of GeV, and Exotic Higgs Decays, identifying a natural region characterized by the mass hierarchy $m_{\\tilde{S}}<m_{\\tilde{B}}<m_{\\tilde{H}}$ and $μ_{\\rm tot}\\in [200, 500]$ GeV. For fine-tuning measure $Δ\\leq 40$, the branching ratio $\\mathrm{Br}(h\\to a_sa_s)$ falls in the range 7\\%$-$25\\%, with the pseudoscalar mass $m_{a_s}$ lying mostly between 10 and 20 GeV. This region splits into two viable scenarios consistent with LZ 2024 direct detection: one where the lightest CP-even Higgs $h_1$ is SM-like ($h_1$ case), and another where the second-lightest $h_2$ is SM-like ($h_2$ case). LHC searches for $h\\to a_sa_s \\to b\\bar{b}τ^+τ^-$ exclude 12\\% (10\\%) of samples with 12 GeV $\\leq m_{a_s} \\leq$ 15.5 GeV in the $h_1$ ($h_2$) case, while a substantial fraction remains accessible at the HL-LHC in the $h_2$ case. Our analysis unifies naturalness, dark matter, and observable exotic Higgs decays, yielding concrete targets for future experiments.","authors":"Zhaoxia Heng, Fei Li, Haijing Zhou","nlinked":67,"nref":67,"src":"INSPIRE","html":true},{"id":"3193100","arxiv":"","title":"Review of Particle Physics","first":"Takahashi","nauth":259,"year":2026,"cites":493,"role":"other","note":"","score":null},{"id":"1847652","arxiv":"2102.09898","title":"The Singly-Charged Scalar Singlet as the Origin of Neutrino Masses","first":"Felkl","nauth":3,"year":2021,"cites":25,"role":"other","note":"","score":null},{"id":"2169464","arxiv":"","title":"Perspectives in Flavour Physics: Neutrino Masses and Experimental Anomalies","first":"Felkl","nauth":1,"year":2022,"cites":0,"role":"other","note":"","score":null},{"id":"452755","arxiv":"hep-ph/9712487","title":"Neutrino mass and missing momentum Higgs boson signals","first":"Diaz","nauth":4,"year":1997,"cites":9,"role":"seed","note":"","score":null},{"id":"3206672","arxiv":"2609.26876","title":"Precise QCD Predictions for the Scotogenic Model at Colliders","first":"Boukidi","nauth":3,"year":2026,"cites":0,"role":"other","note":"","score":null},{"id":"3214449","arxiv":"2610.17210","title":"Dark Matter Stability from residual flavour symmetries","first":"Landini","nauth":3,"year":2026,"cites":0,"role":"other","note":"","score":null},{"id":"1518747","arxiv":"1703.07364","title":"The waning of the WIMP? A review of models, searches, and constraints","first":"Arcadi","nauth":8,"year":2017,"cites [39,48,"c"],[55,24,"c"],[28,40,"c"],[3,64,"k"],[61,48,"c"],[40,63,"c"],[30,27,"c"],[10,26,"k"],[29,55,"c"],[1,29,"k"],[35,62,"c"],[49,27,"c"],[0,32,"c"],[9,33,"k"],[32,34,"c"],[6,21,"c"],[0,43,"k"],[40,37,"c"],[0,44,"k"],[2,51,"c"],[3,48,"c"],[21,48,"c"],[7,22,"k"],[5,59,"k"],[37,63,"c"],[7,21,"c"],[8,21,"c"],[10,21,"c"],[26,21,"c"],[53,62,"c"],[12,21,"c"],[25,21,"c"],[2,28,"k"],[3,31,"k"],[15,21,"c"],[3,27,"c"],[64,27,"c"],[49,34,"c"],[19,45,"k"],[29,27,"c"],[39,29,"c"],[9,46,"k"],[6,23,"k"],[42,35,"c"],[25,42,"c"],[1,48,"c"],[1,50,"k"],[38,21,"c"],[41,27,"c"],[5,54,"k"],[11,56,"k"],[41,32,"c"],[3,63,"k"],[2,43,"k"],[25,28,"c"],[7,23,"k"],[1,24,"k"],[14,21,"c"],[10,25,"k"],[21,57,"c"],[39,55,"c"],[27,63,"c"],[4,21,"c"],[2,30,"k"],[19,37,"k"],[52,42,"c"],[52,48,"c"],[2,40,"k"],[0,41,"k"],[60,49,"c"],[45,63,"c"],[11,21,"c"],[5,21,"c"],[1,53,"k"],[9,38,"k"],[1,55,"k"],[8,48,"c"],[21,42,"c"],[19,59,"k"],[43,48,"c"],[4,61,"k"],[45,37,"c"],[9,48,"c"],[33,48,"c"],[57,48,"c"]],"next":[{"arxiv":"2606.30094","id":"3174583","title":"Dynamical criterion for biased domain-wall formation","authors":"Wen-Yuan Ai","score":9.9,"section":"replacement","rank":22,"parts":[0.0,0.17,0.32,0.0,0.0],"note":"Closest of your papers: [[2690106]] (coupling 0.07, 5 shared references). Closest network paper: [[2860403]] (coupling 0.11, 13 shared references).","abstract":"In the presence of a bias term, the conventional condition for forming a domain-wall network is $p_{\\rm fv}>p_c\\simeq 0.31$, with $p_{\\rm fv}/(1-p_{\\rm fv})=\\exp(-ΔV(0)/V_b(0))$, where $p_{\\rm fv}$ is the false-vacuum fraction immediately after the phase transition, $ΔV(0)$ is the zero-temperature energy splitting between the false and true vacua and $V_b(0)$ is the zero-temperature barrier height measured from the true vacuum. This criterion, however, cannot be generally valid, since it is insensitive to the dynamics of the phase transition. In this work, we derive a dynamical criterion for domain wall formation in the presence of a bias term. We evaluate $p_{\\rm fv}$ at the freeze-out temperature of the false-vacuum correlation volumes $T_{\\rm fo}$, obtaining a substantially stricter criterion. The same dynamical picture also yields a necessary consistency condition for applying scaling-regime gravitational-wave estimates, $T_{\\rm fo}>T_{\\rm ann}$, where $T_{\\rm ann}$ is the annihilation temperature inferred from the scaling-regime dynamics."},{"arxiv":"2611.20386","id":"3230014","title":"Lean-Verified No-Go Theorems for $R$-Symmetries and Modular Symmetries in 4D GUTs","authors":"Mu-Chun Chen, Xiang-Gan Liu, Michael Ratz, Alexander Stewart","score":9.6,"section":"new","rank":23,"parts":[0.0,0.15,0.18,0.0,0.24],"note":"Closest of your papers: [[509514]] (coupling 0.05, 3 shared references). Closest network paper: [[3154793]] (coupling 0.06, 5 shared references). Shared topics: supersymmetric model.","abstract":"$R$-symmetries are instrumental in supersymmetric model building. However, a no-go theorem restricts us from using them in a large class of four-dimensional (4D) grand unified theories (GUTs). Specifically, it has been shown that a supersymmetric 4D GUT based on SU(5), with finitely many chiral multiplets, cannot be broken spontaneously to the exact minimal supersymmetric standard model (MSSM) while preserving a discrete $\\mathbb{Z}_M^R$, with $M \\geq 3$, or continuous U(1) $R$-symmetry. We use Lean 4 to formalize this proof. In the process, we identify and close a gap in the general case of the published argument. Further, we discuss the implications for GUT models with modular symmetries. We point out that modular symmetries are inevitably $R$-symmetries in a supersymmetric framework that also describes gravity. At certain critical points in moduli space, discrete $R$-symmetries are linearly realized. In the context of 4D GUTs, the no-go theorem then implies that exotic states become massless at these points, provided the GUT-breaking vacuum preserves these symmetries. In the vicinity of these critical points, these exotics are parametrically light, which may spoil gauge coupling unification."},{"arxiv":"2608.01100","id":"3186474","title":"Thermal Evolution and Hydrodynamic Filtering of Pseudoscalar Dark Matter","authors":"Xiu-Fei Li, Hongxin Wang, Lei Wang","score":9.4,"section":"replacement","rank":24,"parts":[0.0,0.15,0.29,0.0,0.07],"note":"Closest of your papers: [[2080612]] (coupling 0.05, 3 shared references). Closest network paper: [[2862278]] (coupling 0.10, 19 shared references).","abstract":"Filtered dark matter provides a mechanism for producing massive dark matter particles during a first order phase transition. The resulting abundance can be modified by plasma hydrodynamics. We investigate this effect in a complex singlet extension of the Standard Model, focusing on the deflagration regime. The entropy normalized dark matter abundance $Y_χ$ is calculated using both analytic and numerical methods. As the dark matter mass increases, we identify three patterns of abundance evolution before nucleation, ranging from thermal equilibrium to thermal suppression and freeze-out. For $ξ_w=0.01$, the numerical results show that hydrodynamic effects increase the final $Y_χ$ by factors of approximately $4.1$, $5.7$, and $31.6$ for $m_χ=1.78$, $2.30$, and $5.03~\\mathrm{TeV}$, respectively. For the two lighter masses, the numerical and analytic results agree within $5\\%$, and the difference is reduced to about $1\\%$ or less when hydrodynamic effects are included. The heaviest case requires a numerical treatment because dark matter freeze-out before nucleation. Our results show that hydrodynamic reheating can enhance $Y_χ$ even when dark matter has already frozen out before the phase transition. In this regime, $Y_χ$ is determined by the dark matter abundance established before nucleation and hydrodynamic filtering at the bubble wall."},{"arxiv":"2611.20143","id":"3230087","title":"HVP contributions to the muon anomalous magnetic moment in spacelike and timelike domains","authors":"A. V. Nesterenko","score":7.9,"section":"new","rank":25,"parts":[0.06,0.04,0.31,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.02, 3 shared references). Closest network paper: [[1938335]] (coupling 0.11, 17 shared references).","abstract":"The hadronic vacuum polarization contributions to the muon anomalous magnetic moment $a^{\\text{HVP}}_μ$ in spacelike and timelike domains are recapped. The values of $a^{\\text{HVP}}_μ$ assessed within dispersively-improved perturbation theory are reported. The obtained results can be employed in the evaluations of $a^{\\text{HVP}}_μ$ in the framework of such methods as lattice studies, MUonE project, and others."},{"arxiv":"2610.40749","id":"3220958","title":"Combinatorial Residual Network: a decay-chain-aware classifier without explicit jet assignment","authors":"John Alison, Patrick Bryant, Alejandro Gomez Espinosa, Christian Guinto-Brody, Aniket Khanal, Chuyuan Liu, Sindhu Murthy, Guanglei Zhao","score":7.8,"section":"replacement","rank":26,"parts":[0.0,0.12,0.28,0.0,0.0],"note":"Closest of your papers: [[1627633]] (coupling 0.04, 4 shared references). Closest network paper: [[2646004]] (coupling 0.10, 7 shared references).","abstract":"Final states with several jets from the decays of heavy particles pose a combinatorial problem: the jets must be assigned, at least implicitly, to their parent particles. The Combinatorial Residual Network (CoReNet) is a classifier that encodes the assumed decay chain in its architecture, building the event representation level by level along the decay hierarchy and combining all jet assignment hypotheses, evaluated with shared weights, with learned weights. The exchange symmetries of the decay are built in, the network size does not depend on the number of hypotheses, and no generator-level jet assignments are used in training. Developed for the $b\\bar{b}b\\bar{b}$ final state and used in several CMS searches, CoReNet with 1508 parameters performs well above kinematic baselines on fast-simulated Higgs boson pair production against QCD multijet events and trains in minutes on a single GPU, and its hypothesis weights select the truth-matched jet pairing in most signal events in which it is defined. Since only the encoded decay chain is specific to the final state, we test the construction on $HH \\to b\\bar{b}W^+W^-$ against semileptonic $t\\bar{t}$, where encoding the decay chain of the background as well improves the classification at a cost of about $10^{3}$ parameters. In both final states, CoReNet performs comparably to a state-of-the-art transformer-based network more than two orders of magnitude larger. The implementation is publicly available at https://github.com/cms-cmu/CoReNet."},{"arxiv":"2611.19416","id":"3229502","title":"Constraining neutrino masses with localized fast radio bursts: Current bounds and future prospects","authors":"Yin-Long Cao, Ji-Guo Zhang, Guo-Hong Du, Tian-Nuo Li, Jing-Fei Zhang, Xin Zhang","score":7.5,"section":"cross","rank":27,"parts":[0.06,0.04,0.06,0.0,0.33],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1220579]] (coupling 0.01, 3 shared references). Closest network paper: [[2514147]] (coupling 0.02, 4 shared references). Shared topics: neutrino mass.","abstract":"The dispersion-measure (DM)--redshift relation of fast radio bursts (FRBs) provides independent low-redshift cosmological information for neutrino-mass inference. In this work, we perform joint analyses with cosmic microwave background (CMB) data, using 120 localized FRBs with reliable host-galaxy redshifts and larger mock samples, to investigate the effects of sample size and the dark-energy model on constraints on the sum of neutrino masses, $\\sum m_ν$. In the $Λ$CDM+$\\sum m_ν$ model, CMB+FRB gives $\\sum m_ν<0.21\\,\\mathrm{eV}$, substantially relaxed relative to the current CMB+DESI result. With 1000 simulated events, CMB+FRB1(mock) gives an upper limit of $0.12\\,\\mathrm{eV}$, which decreases to $0.035\\,\\mathrm{eV}$ for CMB+FRB2(mock) with 10000 events. The latter is more stringent than the CMB+DESI limit, demonstrating the potential of large localized FRB samples to constrain neutrino mass. When the model is extended to $w_0w_a$CDM+$\\sum m_ν$, both the observed and mock samples yield upper limits of approximately $0.3$--$0.4\\,\\mathrm{eV}$, indicating that the assumed dark-energy model remains a dominant factor in these constraints. As localized FRB samples grow and the modeling of the individual DM contributions becomes more accurate, FRBs may provide further independent low-redshift information for constraining neutrino mass."},{"arxiv":"2505.14332","id":"2867379","title":"Left-Chiral Neutrino Secret Interactions Probed by High-Energy Neutrinos Surviving the Cosmic Neutrino Background","authors":"Maria Petropavlova","score":7.3,"section":"replacement","rank":28,"parts":[0.0,0.0,0.09,0.0,0.6],"note":"Closest network paper: [[2736974]] (coupling 0.03, 3 shared references). Shared topics: neutrino mass, majorana neutrino. Your watch topics: neutrino background.","abstract":"This work explores the potential of astrophysical neutrinos to probe neutrino secret interactions ($ν$SI) through their propagation in the Cosmic Neutrino Background (C$ν$B). Using representative energies and distances for SN 1987A, NGC 1068, TXS 0506+056 and PKS 0735+178, together with distance hypotheses for KM3-230213A, we derive single-event survival benchmarks for the mediator mass and coupling. We focus on scenarios that do not populate right-handed neutrino states in the early Universe and therefore avoid the strongest cosmological constraints: a massive spin-one mediator with a left-chiral coupling to Dirac neutrinos and a scalar mediator coupled to Majorana neutrinos. We also consider scalar exchange with Dirac neutrinos, a common benchmark in propagation studies, and demonstrate that on the standard relic background its resonance is helicity suppressed, with a strength controlled by the relic-neutrino mass. The analysis covers a broad range of mediator masses, including the light-mediator, resonant and heavy-mediator regions, and accounts for the effects of the relic-neutrino masses and of cosmological evolution along the propagation path. We illustrate the main features of each scenario in a common-mass approximation, with analytic expressions for the non-relativistic and ultra-relativistic relic background, and then extend the analysis to realistic non-degenerate neutrino mass spectra. Owing to its energy, the KM3-230213A event shifts the resonant sensitivity to heavier mediators, while distant-source hypotheses increase the propagation sensitivity in this mass range."},{"arxiv":"2503.06249","id":"2898371","title":"Higgs production from anomalous gluon dynamics","authors":"Ulrich Haisch","score":7.0,"section":"replacement","rank":29,"parts":[0.06,0.03,0.27,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2855387]] (coupling 0.01, 2 shared references). Closest network paper: [[2850123]] (coupling 0.09, 16 shared references).","abstract":"We present a two-loop analysis of the contributions to Higgs production via gluon-gluon fusion arising from the triple-gluon operator in the Standard Model effective field theory (SMEFT). Our discussion covers all aspects of renormalization group (RG) improved perturbation theory, including matching and running within the SMEFT. This study can therefore be seen as a blueprint of the intricacies and subtleties that arise in RG improved SMEFT calculations for collider processes beyond the leading order."},{"arxiv":"2611.20762","id":"3230033","title":"Muon and Tau Anomalies and $Δα_{had}^{(5)} (M_Z^2)$ in the Standard Model","authors":"Stephan Narison","score":6.7,"section":"new","rank":30,"parts":[0.06,0.04,0.23,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 2 shared references). Closest network paper: [[2873857]] (coupling 0.08, 6 shared references).","abstract":"I review the present status of the Standard Model (SM) determination of the muon anomaly by emphasizing the estimate of the lowest hadronic vacuum polarization contributions using recent $e^+e^-$ data on $2π$ and $3π$ and the inclusive ratio $R^{ee}$ of total cross-sections compiled by PDG to which we add the QCD continuum including HO PT QCD up to $α_s^5$, quark mass $m_q^2$ up to $α_s^3$, $m_s^4$ up to $α_s^2$ and QCD condensates. Adding the $e^+e^-\\to π^0γ+ ηγ$ contributions to the CMD3 data, one obtains\\,: $a_μ\\vert^{hvp}_{lo}=(7094\\pm 37)\\times 10^{-11}$. Combining this LO result with the HO estimate of the hadronic, QED and EW contributions, one obtains\\,: $Δa_μ^{sm} \\equiv (a_μ^{exp}-a_μ^{sm})= (86\\pm 38_{th}\\pm 14.5_{exp})\\times 10^{-11} $. The average of the recent estimates quoted in Table\\,3 [$\\oplus$ attempt to fit all $\\,e^+e^-$ data] gives\\,: $Δa_μ^{sm} = (84.9[90.0]\\pm 21.3_{th}\\pm 14.5_{exp})\\times 10^{-11}$\\,. These results agree with the precise BMW20 lattice one and still suggest a window for new physics beyond the SM of $(2.1\\sim 3.5)\\,σ$. Besides some future projects for improving the $e^+e^-$ data, the MUonE for extracting directly $a_μ^{tot}\\vert^{hvp}_{lo}$ and J-PARC (E34) for an independent measurement of $a_μ$, it is important to improve the Lattice results shown in Fig.\\,9 which (at first sight) disagree each others despite the large errors and may question the reliability of the {\\it averages of different averages} used in the White Paper (WP25) Our analysis is completed by updating the estimate of the hadronic contribution to the tau anomaly\\,: $a_τ\\vert^{hvp}_{lo}=(3516\\pm 25)\\times 10^{-9}$ and to $α(M_Z)\\,: \\,Δα_{had}^{(5)} (M_Z^2)= (2770.7\\pm 4.5)\\times 10^{-5}. $"},{"arxiv":"2609.10382","id":"3201617","title":"Searching for New Physics with Reinforcement Learning","authors":"Jacky Kumar, Marianne Bouchard, David London","score":6.6,"section":"replacement","rank":31,"parts":[0.06,0.08,0.15,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2030200]] (coupling 0.03, 1 shared references). Closest network paper: [[2180456]] (coupling 0.05, 2 shared references).","abstract":"Finding new physics (NP) is the fundamental problem in particle physics today. Studying anomalies, i.e., measurements of low-energy observables whose values disagree with the predictions of the Standard Model (SM), is a powerful search strategy. The SM Effective Field Theory (SMEFT) provides a general model-independent framework for parametrizing NP; given some anomalies, it is natural to try to find the SMEFT operator(s) that can explain them. This is a challenging task because (i) the number of SMEFT operators is enormous, and (ii) at loop level there are very complicated correlations among the operators. Analyses by humans typically rely on phenomenological intuition to decide which operators are relevant. This is often biased and does not explore the complete SMEFT operator space. Interestingly, reinforcement learning (RL) techniques excel at tasks that require decision making to achieve their goals. In this paper, we introduce an RL method that can be used to find the SMEFT operators that explain any anomalies. Using some explicit examples, we demonstrate that our RL method can be used to efficiently search for NP at the level of SMEFT. The RL training can be performed efficiently using standard CPU resources, without requiring specialized computing hardware."},{"arxiv":"2611.18730","id":"3229380","title":"On Quantised Magnetic Monopoles in the Nonlocal Electromagnetic Field","authors":"E. J. Thompson, Arvin Kouroshnia, J. W. Moffat","score":6.0,"section":"cross","rank":32,"parts":[0.0,0.0,0.4,0.0,0.0],"note":"Closest network paper: [[2942451]] (coupling 0.14, 9 shared references).","abstract":"We consider Maxwell electrodynamics in the presence of both electric and magnetic charges when the fields are made nonlocal by the prescription of the Moffat-Thompson nonlocal quantum field theory. The symmetry between the electric and magnetic equations is preserved, while a point magnetic charge is a finite distribution and its field energy becomes finite. When Dirac's quantisation condition $eg=2πn$ is imposed, the magnetic self-energy is found to be much greater than the corresponding electric one. We conclude that magnetic monopoles may be permitted by the theory and yet require a very large energy for their production, thus making their abundance and detection a difficult feat."},{"arxiv":"2611.20938","id":"3230016","title":"A consistent (3D) EFT expansion of the bubble nucleation rate. Part I: scalar theories","authors":"Luis Gil, Javier López Miras","score":5.4,"section":"new","rank":33,"parts":[0.0,0.06,0.23,0.0,0.0],"note":"Closest of your papers: [[2080612]] (coupling 0.03, 2 shared references). Closest network paper: [[2862278]] (coupling 0.08, 17 shared references).","abstract":"Precise predictions of bubble nucleation are essential for connecting cosmological phase transitions to their potential observational signatures. In this first paper of a two-part series, we develop a general, fully perturbative framework for incorporating higher-dimensional operators (HDOs) into nucleation calculations in scalar high-temperature effective field theories. Our approach consistently includes their effects on the bounce and the fluctuations around it, including interactions with higher derivatives. We prove that the resulting statistical rate is invariant under field redefinitions, and establish sufficient conditions for the existence of the perturbative bounce solution in the presence of HDOs. We illustrate the framework by applying it to a model containing a scalar and a fermion, where we find modest HDO corrections in its regime of moderately strong transitions. We thus extend the systematic study of HDO effects beyond critical thermodynamics and provide a controlled method for determining their impact on bubble nucleation."},{"arxiv":"2606.30768","id":"3175004","title":"Toponium effects on quantum steering and Bell nonlocality of top quarks","authors":"J. A. Aguilar-Saavedra, S. Rodríguez-Benítez","score":5.2,"section":"replacement","rank":34,"parts":[0.0,0.09,0.16,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.03, 4 shared references). Closest network paper: [[2716079]] (coupling 0.06, 5 shared references).","abstract":"We investigate quantum steering and Bell nonlocality in top-quark pair production at the LHC near threshold. The toponium contribution strengthens the spin-singlet component and substantially enhances the entanglement between the two quark spins. With current LHC data, quantum steering appears to be observable at the $5σ$ level provided systematic uncertainties are at 5\\% or below. For Bell nonlocality, the statistical significance can also be high close to threshold, but systematics are expected to limit a possible measurement to around $2σ$ sensitivity."},{"arxiv":"2607.22358","id":"3183123","title":"First Lattice Calculation of Structure-Dependent Radiative Corrections to Lepton-Flavor-Universality Ratios in Leptonic Decays","authors":"Peter Boyle, Norman H. Christ, Xu Feng, Taku Izubuchi, Luchang Jin, Christopher T. Sachrajda, Xin-Yu Tuo","score":5.1,"section":"replacement","rank":35,"parts":[0.06,0.02,0.17,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[3154544]] (coupling 0.06, 7 shared references).","abstract":"The ratio of electronic to muonic leptonic decay widths, $R_{e/μ}$, for the light mesons $π$ and $K$, provides a clean test of lepton flavor universality (LFU) and a sensitive probe of physics beyond the Standard Model. Its Standard-Model prediction is exceptionally precise, with the leading uncertainty associated with the structure-dependent (SD) radiative correction of $O(0.1\\%)$. As experiments such as PIONEER and NA62 aim for unprecedented precision, this SD correction has become an essential ingredient in precision experiment--theory comparisons. We present the first lattice QCD$+$QED calculation of this SD correction at the physical pion mass and in the continuum limit. We employ the infinite-volume reconstruction (IVR) method with Coulomb-gauge photons, significantly reducing both statistical errors and finite-volume effects. We obtain the Standard-Model predictions, $R_{e/μ}=1.23516(10)\\times10^{-4}$ for $π$ and $R_{e/μ}=2.47661(31)\\times10^{-5}$ for $K$. Our results reduce the hadronic uncertainty in $R_{e/μ}$, provide the most precise Standard-Model predictions to date, and establish first-principles benchmarks for future high-precision tests of LFU."},{"arxiv":"2611.21271","id":"3230080","title":"Soft momentum expansion about the Stokes topological limit of Bogoliubov coefficients","authors":"Daniel J. H. Chung, Nidhi Sudhir, Junqi Zhang","score":4.5,"section":"cross","rank":36,"parts":[0.0,0.0,0.08,0.0,0.33],"note":"Closest network paper: [[2743646]] (coupling 0.03, 1 shared references). Shared topics: discrete symmetry.","abstract":"It is known that particle production in time-dependent cosmological backgrounds can be computed using the Stokes phenomena occurring in Bogoliubov transformations with an analytically continued time coordinate. We analytically compute the soft momentum expansion of the particle production amplitude about the Stokes topological limit that was recently discovered in this context. The computational technique relies on an exponentially improved asymptotic expansion that involves automorphisms in the space of functions defined partly by the angular step function intrinsic to the Stokes topological sectors. We combine this with special discrete symmetries tied to the time dependence of the dispersion relation $ω_k^2(z) = C(k) + A z^n$ for even $n$ to explicitly compute the leading momentum dependence of the amplitude which is nonperturbative in $A$. We also use this result to give a semi-analytic estimate of the number density of particles in this class of scenarios."},{"arxiv":"2611.20887","id":"3230101","title":"Inferring the neutral-current neutrino--nucleon cross section from IceCube data","authors":"Reinaldo Francener, Victor P. Goncalves","score":4.2,"section":"new","rank":37,"parts":[0.0,0.05,0.18,0.0,0.0],"note":"Closest of your papers: [[1708009]] (coupling 0.02, 1 shared references). Closest network paper: [[2824738]] (coupling 0.06, 8 shared references).","abstract":"Neutrinos interact only via the weak force, through the exchange of $W^{\\pm}$ and $Z^{0}$ bosons in charged-current and neutral-current interactions, respectively. Recent experiments have measured the charged-current cross section at high energies, whereas neutral-current interactions remain largely unexplored experimentally. In this work, we investigate the sensitivity of the IceCube Neutrino Observatory to the neutral-current neutrino--nucleon cross section using 12 years of data. We consider two strategies to constrain this quantity: $(i)$ leveraging neutrino absorption and regeneration as neutrinos traverse the Earth; and $(ii)$ using the track-to-cascade event ratio. We find that current IceCube data can set only an upper limit on the neutral-current neutrino--nucleon cross section. We further show that IceCube-Gen2 should be able to constrain the neutral-current cross section with both methods considered here."},{"arxiv":"2606.06478","id":"3165459","title":"Short Gravitational-Wave Transients as Probes of Cosmic Domain Walls","authors":"Tore Boybeyi, Doga Veske, David Maibach","score":3.7,"section":"replacement","rank":38,"parts":[0.0,0.04,0.13,0.0,0.07],"note":"Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[2828434]] (coupling 0.04, 4 shared references).","abstract":"GW190521 and GW231123 have been reported as short-duration gravitational-wave transients consistent with very massive binary black hole (BBH) coalescences whose inferred parameters, i.e., exceptionally high total masses and spin magnitudes, challenge standard isolated binary stellar evolution. We test a topological dark matter (TDM) interpretation invoking cosmic domain walls by fitting a physically motivated domain wall template to the LIGO Hanford and Livingston strain data. The BBH hypothesis is individually favored, with $\\log_{10}\\mathcal{B}_{\\rm BBH/TDM}=12.2$ and $11.3$ for GW231123 and GW190521, respectively. However, these values are lower than those typically recovered from matched maximum a posteriori BBH waveforms injected into nearby noise segments. We further perform, for the first time, a joint fit in which domain wall signals from a single underlying scalar field are constrained simultaneously by both events. Although not favored over BBH signals, we find the two events are consistent with a common scalar field, with shared TDM parameters agreeing across independent noise realizations and sky locations. We further find that injected TDM transients are systematically recovered under the BBH hypothesis with large spin parameters, revealing a morphological degeneracy that could mask genuine domain wall signals. This analysis demonstrates that multi-event parameter consistency tests provide a new discriminant for domain wall dark matter searches in upcoming observing runs."},{"arxiv":"2611.18794","id":"3229395","title":"Nonperturbative lattice simulation of the nucleation rate in thermal first-order phase transitions","authors":"Jing Zhou, Ligong Bian","score":3.6,"section":"cross","rank":39,"parts":[0.0,0.03,0.18,0.0,0.0],"note":"Closest of your papers: [[2080612]] (coupling 0.01, 1 shared references). Closest network paper: [[2862278]] (coupling 0.06, 14 shared references).","abstract":"We present a nonperturbative lattice study of vacuum decay through bubble nucleation in a three-dimensional real scalar field theory at finite temperature. The vacuum decay rate is computed by combining an expanded-ensemble multicanonical hybrid Monte Carlo approach, which samples the critical bubble configurations, with real-time Langevin dynamics, which follows the subsequent bubble evolution. We extrapolate the nucleation rate to the continuum limit and compare it with the corresponding one-loop perturbative prediction, finding a discrepancy of about \\(8\\%\\)."},{"arxiv":"2611.19519","id":"3229519","title":"Confinement--Higgs Complementarity Viewed through Relative Quantum Reference Frames","authors":"Kei-Ichi Kondo","score":3.6,"section":"cross","rank":40,"parts":[0.0,0.05,0.14,0.0,0.0],"note":"Closest of your papers: [[468209]] (coupling 0.02, 2 shared references). Closest network paper: [[1224299]] (coupling 0.05, 5 shared references).","abstract":"We formulate confinement--Higgs complementarity in terms of the relative orientation between two independently constructed quantum reference frames (QRFs): one derived from the gauge field and the other from the scalar field. Exact continuum and lattice identities give a relational interpretation of the scalar--color observables used in recent gauge-fixing-free $SU(2)$ simulations. In particular, we provide a QRF interpretation of the additional gauge-invariant nonlocal separation line obtained from the Cho--Duan--Ge (CDG) reduction reported in lattice simulations of the radially fixed fundamental $SU(2)$ gauge--scalar model. We explain why such a candidate nonlocal boundary is compatible with Fradkin--Shenker continuity and Osterwalder--Seiler analyticity for the appropriate class of local gauge-invariant observables. Separately, we show that a Wilson-rooted control observable admits an exact results at zero plaquette coupling and that it does not cause such a nonlocal separation line."},{"arxiv":"2502.06003","id":"2878365","title":"$T_{cc}$ and Hidden Charm Tetraquarks $1^+$ and $0^+$in QCD sum rules and Heavy-Quark Spin Symmetry","authors":"Semra Sari Ferah, Altug Ozpineci","score":3.4,"section":"replacement","rank":41,"parts":[0.06,0.02,0.04,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[2593330]] (coupling 0.02, 1 shared references).","abstract":"In this work, $T_{cc}$ double charm tetraquark and $1^{+}$ and $0^{+}$ hidden charm tetraquarks are studied within the QCD sum rules framework. In the heavy-quark limit, the $1^+$ and $0^+$ tetraquarks are degenerate and the difference in their masses is an $1/m_c$ effect. It is shown that, although the uncertainty in the mass predictions of each of these hadrons is ${\\cal O}(100\\;\\mathrm{MeV})$, when the mass differences are studied, the uncertainty is reduced to less than ${\\cal O}(10\\;\\mathrm{MeV})$. Hence, it is concluded that if one of the exotic hadrons is observed and its mass is used as input, the masses of the other hadrons can be determined with a precision of ${\\cal O}(10\\;\\mathrm{MeV})$ using the QCD sum rules method."}],"rest":[{"arxiv":"2611.20919","title":"Cosmological Collider Signals from Fermion Bubble Loops with a Chemical Potential","score":3.3,"section":"new","rank":42},{"arxiv":"2606.26245","title":"Axial-Vector Lattice Benchmarks Reveal a Common Medium Response of Meson Screening in Hot QCD","score":3.1,"section":"replacement","rank":43},{"arxiv":"2611.20778","title":"Longitudinal Parton Correlations in MRW-Type Unintegrated Double Parton Distributions","score":3.0,"section":"new","rank":44},{"arxiv":"2605.03002","title":"Calculating extremely high energy bremsstrahlung in matter","score":3.0,"section":"replacement","rank":45},{"arxiv":"2605.17322","title":"Investigating the mass spectra of $1F$-wave singly heavy $Σ_{Q}$, $Ξ^{\\prime}_{Q}$
