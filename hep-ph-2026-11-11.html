<script>
const RAW = {"n":[{"id":"3226997","arxiv":"2611.13617","title":"Self-interacting dark matter and neutrino masses from MeV-scale lepton-number breaking","first":"Dutta","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[1992028]], [[1989085]]. Closest of your papers: [[1741056]] (coupling 0.02, 3 shared references). Closest network paper: [[1989085]] (coupling 0.33, 30 shared references). Shared topics: dark matter and neutrino mass, neutrino mass, relic abundance, direct detection, lepton number.","score":49.1,"rank":1,"section":"new","parts":[0.7,0.06,0.94,0.0,0.88],"abstract":"We show that a scalar whose vacuum expectation value (vev) breaks lepton number at the MeV scale, generating the light-neutrino masses through the inverse seesaw, can also serve as the light mediator of self-interacting dark matter. Dark matter is a pseudo-Dirac fermion whose mass splitting arises from the same vev and is predicted to be proportional to the self-interaction coupling times the vev. A strong central interaction between the dark states requires this splitting to be sizable. The CP-even mediator decays into neutrinos at a rate fixed by the neutrino masses, independent of its mixing with the Higgs boson. Fixing the coupling by the relic abundance and evaluating exact partial-wave cross sections, the model reproduces the velocity dependence of the self-interaction cross section inferred from dwarf galaxies to clusters along a narrow band, $m_s\\simeq1.9~{\\rm MeV}\\times(m_χ/{\\rm GeV})$, extending up to $m_χ\\simeq12$~GeV with a best fit at $m_χ\\simeq7.6$~GeV and $m_s\\simeq15$~MeV, and on a sequence of resonant islands of comparable fit quality at higher masses. The cluster data bound the dark matter mass from above, so that the allowed masses extend from about $3$ to $70$~GeV ($95\\%$ confidence level), with correlated mediator masses of $6$-$28$~MeV. Combining constraints from the effective number of neutrino species, SN~1987A and direct detection, we find the lepton-number-breaking scale confined to a window of a few hundred MeV and a strong preference for normal neutrino mass ordering. The allowed parameter space is testable by future measurements of $N_{\\rm eff}$, low-threshold direct detection and the neutrino mass ordering.","authors":"Manoranjan Dutta","nlinked":107,"nref":114,"src":"INSPIRE","html":true},{"id":"3227005","arxiv":"2611.13842","title":"Ultra-Heavy Dark Matter Through Exponential Production Mechanism","first":"Bhatia","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 3 network papers: [[3162378]], [[2793703]], [[1655576]]. Closest of your papers: [[1846554]] (coupling 0.08, 7 shared references). Closest network paper: [[3221883]] (coupling 0.12, 10 shared references). Shared topics: seesaw model, dark matter model.","score":46.2,"rank":2,"section":"new","parts":[0.83,0.25,0.33,0.0,0.44],"abstract":"Exponential production of dark matter has been introduced recently as one of the alternatives to the widely studied thermal production of dark matter scenarios. This non-thermal production mechanism leads to the exponential growth in the abundance of the dark matter ($χ$) through its scatterings with the bath particle ($ξ$), viz. $χ+ ξ\\to χ+ χ$. In our framework, we consider a scalar dark matter $χ$ charged under $Z_3$ symmetry and bath particle $ξ$ to be standard model singlet and determine the maximum mass of the dark matter using the criteria of perturbativity. We find that dark matter has an upper mass around the ballpark of $\\mathcal{O}(10^{15})$ GeV for the cases when the bath particle mass is similar to the dark matter mass. The computations are largely performed with minimal model dependence and will hold in any scenario where the renormalizable couplings driving the exponential growth effectively reduce to $χ^3ξ$ interactions. Thus, in exponential production of dark matter, we have a possibility of an ultra-heavy dark matter with large couplings, making the scenario phenomenologically interesting. Later, we extend the simplified dark matter model to a UV-complete Dirac Type-I seesaw model where the $Z_3$ symmetry is obtained as a residual unbroken subgroup of a global $U(1)_{B-L}$ symmetry, providing a natural connection with the neutrino sector.","authors":"Disha Bhatia, Ranjeet Kumar, Rahul Srivastava","nlinked":43,"nref":48,"src":"INSPIRE","html":true},{"id":"3204242","arxiv":"2502.13002","title":"Fermionic Dark Matter and Neutrino Masses in a Minimal $U(1)_{\\rm PQ}$ Inverse Seesaw Framework","first":"Thongyoi","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[2668911]], [[1724453]]. Also cites widely used network papers: [[1362180]], [[779828]], [[1518747]], [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.04, 9 shared references). Closest network paper: [[3148101]] (coupling 0.08, 11 shared references). Shared topics: dark matter and neutrino mass, relic density, neutrino mass, seesaw mechanism, majorana mass.","score":43.4,"rank":3,"section":"replacement","parts":[0.76,0.14,0.22,0.0,0.92],"abstract":"We propose a minimal extension of the Standard Model (SM) where a single global $U(1)_{PQ}$ symmetry simultaneously generates the scales for the inverse seesaw mechanism and stabilizes a fermionic dark matter (DM) candidate. In this framework, the spontaneous breaking of the symmetry naturally yields a pseudo-Nambu-Goldstone boson--an axion-like particle (ALP)--which serves as the inevitable mediator between the dark and visible sectors. This setup generates light neutrino masses at the TeV scale without requiring inaccessible energy scales, while predicting a strong correlation between the effective Majorana mass and the CP-violating phase, enhancing its testability in future experiments. We demonstrate that the model satisfies stringent constraints from neutrino oscillations, DM relic density, and the recent muon $g-2$ measurements, with the relic density governed primarily by DM annihilation into SM fermions via the ALP portal. This work offers a unified, structurally consistent framework that addresses the neutrino mass and dark matter puzzles, providing distinct signatures for particle physics and cosmology.","authors":"Nakorn Thongyoi, Patipan Uttayarat, Chakrit Pongkitivanichkul","nlinked":87,"nref":99,"src":"INSPIRE","html":true},{"id":"3204104","arxiv":"2609.17412","title":"Cosmological Constrained Axion-Portal Inelastic Dark Matter for the LZ Event","first":"An","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[3202840]], [[3201080]]. Closest network paper: [[3202840]] (coupling 0.75, 57 shared references). Shared topics: direct detection.","score":42.1,"rank":4,"section":"replacement","parts":[0.7,0.0,1,0.0,0.26],"abstract":"The recent high-recoil candidate event reported by LUX-ZEPLIN (LZ) motivates dark-matter scenarios with nonstandard kinematics and momentum-dependent interactions. We study a two-state inelastic dark-matter model in which $χ_1$ and $χ_2$ couple off-diagonally to an axion-like particle (ALP) that also couples to gluons and photons. Unlike treatments that assume only one dark-matter state is present today, we track the cosmological evolution of both states. The excited state $χ_2$ is sufficiently long-lived to survive to the present, with its relic fraction determined by the dark-sector conversion process $χ_2χ_2\\leftrightarrowχ_1χ_1$. We find that this fraction depends strongly on the Lorentz structure of the DM--ALP interaction. Scalar transition couplings lead to nonperturbative conversion rates with a pronounced resonant structure, yielding a final excited-state fraction that varies nonmonotonically with the mediator mass, from $f_2\\sim10^{-4}$ to approximately $1/2$ over the parameter range studied. The relative importance of endothermic and exothermic scattering is therefore parameter dependent. By contrast, pseudoscalar transition couplings preserve $f_2\\simeq1/2$, yielding recoil spectra dominated by exothermic $χ_2 N\\toχ_1 N$ down-scattering for the benchmarks considered. Benchmark spectra in all four scenarios can peak near the observed recoil energy of $250\\,\\mathrm{keV}$. Our results demonstrate that the dominant direction of inelastic scattering in direct detection can be dynamically selected by the early-Universe evolution of the dark sector. With additional data, annual modulation measurements could distinguish these scenarios. We further show that the ALP portal can be directly probed at colliders.","authors":"Haipeng An, Fei Gao, Jia Liu, Minghao Liu, Changlong Xu","nlinked":83,"nref":84,"src":"INSPIRE","html":true},{"id":"3209712","arxiv":"2609.38316","title":"Constraints on Complex Electroweak WIMPs from Solar Capture","first":"Luengas","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[3202840]], [[3201080]]. Closest of your papers: [[1607572]] (coupling 0.02, 3 shared references). Closest network paper: [[3202840]] (coupling 0.60, 57 shared references).","score":42.0,"rank":5,"section":"replacement","parts":[0.7,0.06,1,0.0,0.07],"abstract":"One of the most convincing realizations of particle dark matter is provided by models based on electroweak multiplets. The lightest neutral state of such a multiplet can be a stable Majorana fermion or a real scalar, and its phenomenology is governed by two parameters: the dark matter mass and the mass splitting $\\{m_χ,δ\\}$. The sub-MeV range for $δ$ is particularly important as it allows for a large inelastic scattering cross section. In this paper, we analyze solar capture, energy loss, and annihilation of scalar and fermionic electroweak multiplet dark matter, generalizing earlier results for the Higgsino to other representations. We find that, while the case of a doublet is somewhat special, higher representations behave in a self-similar way. For the higher multiplets, IceCube results constrain the splitting to $δ\\gtrsim 350$ keV for all dark matter masses up to $100$ TeV. Assuming thermal freeze-out and a Standard Halo Model velocity distribution, this rules out most models of electroweak dark matter as a possible origin of the single high-recoil event reported by the LZ collaboration. We also show that a high-velocity tail in the dark matter distribution, such as that induced by the Large Magellanic Cloud, raises the splitting preferred by the LZ event above the solar bounds for many of the multiplets.","authors":"Juan P. Luengas, Maxim Pospelov, Harikrishnan Ramani","nlinked":123,"nref":123,"src":"INSPIRE","html":true},{"id":"3216300","arxiv":"2610.25423","title":"Exothermic Dark Matter with a Dark Higgs: The LZ 248 keV Event and the Galactic Center Excess","first":"Kim","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[3202840]], [[3201080]]. Closest of your papers: [[1421624]] (coupling 0.02, 3 shared references). Closest network paper: [[3202840]] (coupling 0.45, 43 shared references).","score":41.6,"rank":6,"section":"replacement","parts":[0.7,0.05,1,0.0,0.07],"abstract":"LUX-ZEPLIN (LZ) reported a $248~\\mathrm{keV}$ nuclear-recoil candidate. Exothermic dark matter can explain it in a dark $U(1)$ model whose dark Higgs generates the dark photon mass and the mass splitting. Since the dark photon mass sets both the excited-state fraction and the scattering rate, two dark photon masses explain the event, near $1$ and $25~\\mathrm{GeV}$ for kinetic mixing $ε=10^{-4}$. Cosmic microwave background limits exclude most of the lighter branch. On the heavier branch, the southern-sky Galactic Center $γ$-ray excess complements the LZ event by selecting a dark matter mass of $40$-$44~\\mathrm{GeV}$, and its fit favors a dark Higgs boson near the dark photon mass.","authors":"Jinheung Kim, Jongkuk Kim, Pyungwon Ko","nlinked":119,"nref":121,"src":"INSPIRE","html":true},{"id":"3171583","arxiv":"2606.23787","title":"Multi-peaked high-frequency gravitational waves from PBH-assisted leptogenesis","first":"Borah","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[2860403]], [[2828434]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.02, 6 shared references). Closest network paper: [[2693756]] (coupling 0.12, 18 shared references). Shared topics: neutrino mass.","score":35.6,"rank":7,"section":"replacement","parts":[0.72,0.07,0.33,0.0,0.36],"abstract":"We study the possibility of probing non-thermal leptogenesis with multi-peaked high-frequency gravitational waves (GW) by considering heavy right-handed neutrino (RHN) produced from primordial black hole (PBH) evaporation to be responsible for generating the required lepton asymmetry. The decay of RHN also produces a GW spectrum due to graviton bremsstrahlung with the corresponding amplitude being enhanced for heavier RHN. The presence of an ultra-light PBH dominated epoch not only ensures sufficient production of RHNs, but also keeps the leptogenesis scenario free from strong washout problem of thermal leptogenesis at very high scale. In addition, the PBH dominated epoch also helps in generating a gravitational bremsstrahlung spectrum distinct from the stochastic GW background from the thermal bath. Finally, PBH evaporation also brings two separate sources of GW via density perturbation and graviton emission via Hawking evaporation. For the most optimistic scenario with very high scale seesaw consistent with neutrino mass and leptogenesis, this leads to a multi-peaked GW spectrum with peak frequencies lying in the MHz-EHz range.","authors":"Debasish Borah, Nayan Das","nlinked":127,"nref":127,"src":"INSPIRE","html":true},{"id":"3165814","arxiv":"2606.06645","title":"micrOMEGAs 7: Beyond standard cosmology","first":"Belanger","nauth":7,"year":2026,"cites":0,"role":"repl","note":"Co-authors of yours: Bernal. Cites 1 network paper: [[1907141]]. Closest of your papers: [[2859009]] (coupling 0.03, 5 shared references). Closest network paper: [[2962467]] (coupling 0.13, 12 shared references). Shared topics: relic density, indirect detection, direct detection.","score":35.3,"rank":8,"section":"replacement","parts":[0.45,0.1,0.36,0.5,0.62],"abstract":"We present micrOMEGAs7, a major upgrade of the micrOMEGAs package for the computation of dark matter observables in generic models. This release introduces a generalized treatment of the Boltzmann equations, allowing for user-defined modifications of the Hubble expansion rate, entropy evolution, and non-thermal dark matter production from late-decaying cosmological components, thereby extending the framework beyond the standard radiation-dominated cosmology. The relic density can now be computed in scenarios such as low-temperature reheating, early matter domination, and kination. The new version also improves the treatment of sub-GeV dark matter, in particular annihilation into light mesons through scalar mediators, and provides updated spectra for indirect detection. Several experimental and observational constraints have been implemented or revised, including CMB bounds from Planck on energy injection during recombination and Fermi-LAT limits from dwarf spheroidal galaxies. For direct detection, a recast of recent LZ results has been included, and the code now takes into account effective electromagnetic couplings of spin-$1/2$ and spin-1 dark matter. Collider observables have also been extended through the implementation of CMS dilepton resonance constraints on $Z'$ mediators. Additional improvements include a more flexible treatment of effective relativistic degrees of freedom and an updated LHAPDF interface.","authors":"G. Belanger, A. Belyaev, N. Bernal, F. Boudjema, S. Chakraborti, A. Goudelis, A. Pukhov","nlinked":85,"nref":88,"src":"INSPIRE","html":true},{"id":"3145833","arxiv":"2604.14282","title":"Probing Neutrino Compositeness with Invisible and Displaced Signals","first":"Borrello","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2824738]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1708009]] (coupling 0.01, 1 shared references). Closest network paper: [[3073459]] (coupling 0.09, 23 shared references). Shared topics: displaced vertex.","score":25.5,"rank":9,"section":"replacement","parts":[0.48,0.04,0.26,0.0,0.37],"abstract":"We explore the possibility that neutrinos couple to an interacting sterile sector, providing a novel portal that generalizes the heavy neutral lepton portal to a composite setting. For a low confinement scale, high-energy neutrino beams can disintegrate into collimated sprays of hidden states, referred to as dark jets. This dynamics gives rise to two characteristic signatures in high energy neutrino beams. First, long-lived dark resonances can enhance the neutral-current to charged-current ratio. Second, shorter-lived dark states produced in neutrino neutral currents can produce single or multiple displaced vertices and even emerging jets, depending on the kinematics. These signals probe regions of parameter space beyond existing constraints from meson, electroweak, and Higgs decays, as well as from searches for displaced decays at beam dump experiments. We study these phenomena within broad classes of ultraviolet completions and identify scenarios in which high-energy neutrino beams provide leading sensitivity to neutrino compositeness. Such scenarios generically induce higher-dimensional contact interactions, which we classify and study alongside their complementary experimental signatures. Finally, we outline an experimental program spanning both the intensity and energy frontiers. Near-term neutrino facilities (DUNE, FPF) and running flavor experiments (LHCb, Belle II) can probe neutrino compositeness through neutrino disintegration into dark jets and displaced B-meson decays. Future colliders, particularly the Future Circular Collider (FCC-ee), will ultimately provide the strongest sensitivity to the compositeness scale via displaced Z decays.","authors":"Matteo Borrello, Marco Costa, Diego Redigolo, Michele Tammaro","nlinked":145,"nref":146,"src":"INSPIRE","html":true},{"id":"","arxiv":"2611.14370","title":"The Higgs boson, naturalness, and the Universe","first":"Shaposhnikov","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[823307]]. Also cites widely used network papers: [[1362180]], [[2817040]]. Closest of your papers: [[793723]] (coupling 0.03, 9 shared references). Closest network paper: [[1863157]] (coupling 0.09, 17 shared references).","score":24.9,"rank":10,"section":"new","parts":[0.51,0.1,0.26,0.0,0.0],"abstract":"The Higgs boson -- the only known fundamental scalar particle -- may have profound implications for both particle physics and cosmology. This review examines how the Higgs field may have influenced the Universe from its earliest moments to its present state. We first discuss particle-physics puzzles, including the naturalness and hierarchy problems, as well as the possible metastability of the electroweak vacuum. We then turn to cosmological scenarios where the Higgs boson could be a driving force, including Higgs inflation, reheating and the onset of the hot Big Bang, the electroweak phase transition, and baryogenesis via electroweak processes.","authors":"Mikhail Shaposhnikov","nlinked":230,"nref":235,"src":"arXiv source","html":true},{"id":"3227002","arxiv":"2611.13629","title":"Where does the neutrino Mass Ordering preference come from?","first":"Machado","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1854224]] (coupling 0.02, 3 shared references). Closest network paper: [[3201794]] (coupling 0.07, 7 shared references). Shared topics: neutrino mass.","score":23.7,"rank":11,"section":"new","parts":[0.45,0.06,0.19,0.0,0.33],"abstract":"After the recent JUNO result, the comparison of the effective mass splittings measured in $\\barν_e$ disappearance at reactors and in $ν_μ$ disappearance has become one of the leading handles on the neutrino mass ordering. In this paper, we study which data sets drive the present preference for the ordering, combining JUNO and Daya Bay with $ν_μ$ disappearance data from NOvA, T2K, MINOS, and IceCube/DeepCore. While the combination disfavors the inverted ordering at $1.9σ$, this preference comes from a balance between several small preferences. In particular, the combinations of reactor data with T2K or with NOvA point to opposite orderings. The values of the mass splitting preferred by these two experiments differ by about $3.5\\%$, comparable to the difference expected between the two orderings, and thus a shift of this size in a single experiment is enough to reverse the preference. Moreover, in the context of this combination of reactor and $ν_μ$ disappearance data, further JUNO data would not bring the rejection of the inverted ordering beyond about $3σ$, as the comparison is then limited by the precision of the $ν_μ$ disappearance experiment. Improving the $ν_μ$ disappearance measurements requires control of the neutrino energy reconstruction, and thus the modeling of neutrino-nucleus interaction physics, at the percent level.","authors":"Pedro A. N. Machado, João Paulo Pinheiro","nlinked":49,"nref":51,"src":"INSPIRE","html":true},{"id":"","arxiv":"2611.14103","title":"Nucleon sigma terms in lattice QCD at physical pion mass and in the continuum","first":"Alexandrou","nauth":6,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[2859009]] (coupling 0.02, 2 shared references). Closest network paper: [[3221793]] (coupling 0.03, 3 shared references).","score":18.6,"rank":12,"section":"cross","parts":[0.45,0.05,0.08,0.0,0.0],"abstract":"We determine the light, strange and charm $σ$-terms of the nucleon in lattice QCD using four $N_f=2+1+1$ twisted-mass gauge ensembles simulated at physical pion masses and with approximately the same spatial volumes. The four lattice spacings ranging from $0.080$ fm to $0.049$ fm, with an action that has O(a) improvement, enable extrapolating the results to the continuum limit. Both valence and sea quark contributions are analysed accounting for excited-state contamination from low-lying multihadron states. We perform global fits to all ensembles, that yield $σ_{πN}=53.0(7.4)(1.6)$ MeV, $σ_s=58.2(17.0)(2.1)$ MeV and $σ_c=112(28)(25)$ MeV, with statistical and systematic uncertainties, respectively.","authors":"Constantia Alexandrou, Christos Iona, Giannis Koutsou, Yan Li, Srijit Paul, Ferenc Pittler","nlinked":50,"nref":52,"src":"arXiv source","html":true},{"id":"","arxiv":"2611.14473","title":"Running out of Field Range: Nonlinear Sourcing of Light Scalars","first":"Banerjee","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1397629]] (coupling 0.01, 1 shared references). Closest network paper: [[3193100]] (coupling 0.02, 27 shared references).","score":17.4,"rank":13,"section":"new","parts":[0.45,0.02,0.07,0.0,0.0],"abstract":"Light scalar fields coupled linearly to the Standard Model are constrained by equivalence-principle tests, fifth-force searches, clock comparison tests, and stellar cooling. These bounds assume that the coupling to ordinary matter can be expanded to linear order for all field values reached. For a pseudo-Nambu-Goldstone boson with decay constant $f$ this fails as soon as the field value reaches $O(f)$. The field around a source then stops growing with the coupling, and in addition the linear coupling of a probe is suppressed depending on its location. We reanalyze all of these bounds for the couplings to photons, electrons and nucleons. Space-based tests are weakened by several orders of magnitude, whereas the terrestrial tests are suppressed far more strongly and lose their sensitivity at low masses. As a result, for each coupling, $f$-dependent windows in the parameter space open up. For a coupling to nucleons a window persists at large couplings even for $f\\sim 100 \\,\\rm{GeV}$. In particular, no current experiment constrains couplings between the naive limit and the stellar-cooling bound in a window of masses above $\\text{few}\\times 10^{-12}\\,$eV, a range of more than ten orders of magnitude in coupling. This presents a unique opportunity for a ground-space clock comparison test to probe uncharted territory.","authors":"Abhishek Banerjee, Shourya Mukherjee, Stefan Stelzl","nlinked":99,"nref":106,"src":"arXiv source","html":true},{"id":"3227015","arxiv":"2611.13602","title":"Nuclear medium and final state interaction effects in $η$ production induced by $ν_μ(\\barν_μ)$ at SBN and DUNE energies","first":"Fatima","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2102705]]. Closest network paper: [[2102705]] (coupling 0.03, 4 shared references).","score":17.2,"rank":14,"section":"cross","parts":[0.45,0.0,0.09,0.0,0.0],"abstract":"We investigate nuclear-medium modification and final-state interaction in charged- and neutral-current $ν_μ(\\barν_μ)$-induced $η$-meson production on $^{12}\\mathrm{C}$ and $^{40}\\mathrm{Ar}$. The nuclear medium is described within a local density approximation, incorporating in-medium modifications of the $N^*(1535)$ resonance, which is known to play the dominant role in $η$ production through its $N η$ decay channel. The subsequent propagation and absorption of the $η$ meson in the nucleus are simulated using a Monte Carlo approach. We find that nuclear-medium modifications and final state interaction lead to substantial suppression of the production cross section, highlighting the importance of nuclear effects in interpreting $η$ production data. Our results provide valuable theoretical input for the analysis of $η$-production at the ongoing SBND and MicroBooNE experiments and the forthcoming DUNE experiment.","authors":"A. Fatima, S. K. Noor Alam, M. Sajjad Athar, S. K. Singh","nlinked":19,"nref":22,"src":"INSPIRE","html":true},{"id":"","arxiv":"2611.14251","title":"The $χ_{c1}(3872)$ Multiplet in the Diabatic Dynamical Diquark Model","first":"Lebed","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[1710056]] (coupling 0.03, 6 shared references).","score":16.9,"rank":15,"section":"new","parts":[0.45,0.0,0.07,0.0,0.0],"abstract":"We apply a minimal form of the diabatic dynamical diquark model, which uses only dimeson thresholds augmented by constraints obtained from heavy-quark spin symmetry, to the hidden-charm tetraquark spectrum. We find that this model is insufficient to simultaneously reproduce the experimentally established states \\(χ_{c1}(3872)\\), \\(T_{c\\bar c1}(3900)\\), and \\(T_{c\\bar c1}(4020)\\). We therefore extend the model to its complete form, by restoring the spin- and isospin-dependent diquark-antidiquark interactions from the original adiabatic dynamical diquark model into the full diabatic potential. Aligning the resulting framework to these three states allows the remaining members of the \\(Σ_g^+(1S)\\) multiplet to be predicted through coupled-channel scattering simulations. The resulting resonance or bound state locations lie within approximately \\(10~\\mathrm{MeV}\\) of the corresponding pure adiabatic mass eigenvalue predictions in all cases, indicating that the adiabatic fine-structure pattern survives the inclusion of explicit dimeson channels. We also discuss possible experimental counterparts for the unconfirmed multiplet members.","authors":"Richard F. Lebed, Ethan H. Pham","nlinked":28,"nref":30,"src":"arXiv source","html":true},{"id":"3226916","arxiv":"2611.13023","title":"Multi-TeV vector dark matter in the $U(1)_X$ Higgs portal model","first":"Chen","nauth":5,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1741056]] (coupling 0.06, 6 shared references). Closest network paper: [[2892286]] (coupling 0.10, 6 shared references). Shared topics: relic density, indirect detection, direct detection. Your watch topics: thermal dark matter.","score":16.5,"rank":16,"section":"new","parts":[0.0,0.18,0.28,0.0,0.68],"abstract":"We investigate heavy-mass vector dark matter within the framework of the $U(1)_X$ gauge Higgs portal vector model, by jointly integrating experimental constraints from relic density measurements, direct detection searches, and indirect detection observations alongside the perturbative criterion to derive bounds on the model parameter space. Within the weakly interacting massive particle scenario, we assess the relative contributions of $s$-channel and $t/u$-channel processes to thermal dark matter annihilation. For parameter configurations lying in the $s$-channel resonance region, each fixed value of the scalar mixing angle $\\sinα$ corresponds to a well-defined upper limit on the heavy dark scalar mass $m_{h_2}$. This upper limit decreases monotonically with increasing $\\sinα$, with a critical threshold of $\\sinα\\lesssim 0.05$ beyond which perturbative constraints entirely exclude the full resonance corridor. By contrast, the non-resonant parameter regime dominated by $t/u$-channel annihilation processes is found to be excluded for $m_V \\simeq 1$ TeV and above under the combined joint constraints from relic density requirements and perturbative consistency. Our results indicate that the perturbative consistency of the scalar sector, enforced via the two-loop renormalisation group equations, imposes bounds on the parameter space in the heavy mass regime that are comparable to, and in some benchmark regions more restrictive than, current experimental limits. Nevertheless, even under the application of these stringent perturbativity constraints, the model still admits a viable set of parameter points spanning a broad multi-TeV mass range.","authors":"Kun-Peng Chen, Han Hu, Hao-Yu Luo, Yun Wei, Ming Zhong","nlinked":40,"nref":43,"src":"INSPIRE","html":true},{"id":"3190444","arxiv":"2608.12182","title":"$D^*D^*π$ and $B^*B^*π$ couplings from light-cone sum rules","first":"Wang","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[2790921]] (coupling 0.02, 1 shared references).","score":16.5,"rank":17,"section":"replacement","parts":[0.45,0.0,0.05,0.0,0.0],"abstract":"We revisit the calculation of the strong couplings $D^{*}D^{*}π$ and $B^{*}B^{*}π$ from the light-cone sum rules (LCSR) using the pion light-cone distribution amplitudes. The accuracy of the underlying correlation function is upgraded by establishing the hard-collinear factorization formula at the leading power up to the next-to-leading order in $α_s$. Furthermore, the next-to-leading power contributions are incorporated at the leading order by including the two-particle and three-particle higher-twist pion distribution amplitudes up to twist-4 accuracy. We perform a comprehensive numerical analysis with a systematic evaluation of theoretical uncertainties, predicting $g_{D^{*}D^{*}π} = 5.71_{-0.89}^{+0.70} \\text{ GeV}^{-1}$ and $g_{B^{*}B^{*}π} = 4.90_{-0.67}^{+0.59} \\text{ GeV}^{-1}$. Finally, by parametrizing the $1/m_H$ (with $H=D,\\,B$) power corrections to extract the universal static coupling $\\hat{g} = 0.30 \\pm 0.04$, we compare our results with previous theoretical determinations and experimental data, and discuss the current limitations in disentangling the heavy quark spin symmetry breaking effects.","authors":"Chao Wang","nlinked":57,"nref":61,"src":"INSPIRE","html":true},{"id":"3226994","arxiv":"2611.13679","title":"Construction of the $f_4$ meson family","first":"Huang","nauth":6,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3214449]] (coupling 0.01, 1 shared references).","score":16.4,"rank":18,"section":"new","parts":[0.45,0.0,0.04,0.0,0.0],"abstract":"Motivated by the experimental observations of $f_4(2050)$ and $f_4(2300)$ and the establishment of $a_4$ family, we investigate the $f_4$ family by combining the mass spectrum under the modified Godfrey--Isgur model with two-body strong-decay calculations in the quark-pair-creation model. The common pair-creation strength is fixed by the measured total width of $f_4(2050)$. The mass spectrum analysis and decay information both favor the nonstrange $2\\,{}^3F_4$ assignment for $f_4(2300)$. The largely strange $2F$ partner is predicted at $2453$ MeV with a total width of $216$ MeV, decaying mainly into $K^*\\bar K^*(1410)$ and $K^*\\bar K^*$. Predictions are also given for the $3F$, $4F$, $1H$, and $2H$ flavor pairs. At the adopted mixing angles, the $H$-wave states are more than twice as broad as nearby $F$-wave states of the same flavor. The results of this work may serve as useful guidance for future experimental studies.","authors":"Zhe-Qi Huang, Lei Huang, Yu-Qiang Li, Xin-Lei Ge, Hao Chen, Cheng-Qun Pang","nlinked":60,"nref":60,"src":"INSPIRE","html":true},{"id":"3131008","arxiv":"2603.17350","title":"Lepton-flavor-violating trilepton tau decays induced by $S_1$ and $R_2$ scalar leptoquarks","first":"Hernández-Tomé","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1854224]] (coupling 0.04, 4 shared references). Closest network paper: [[3178456]] (coupling 0.13, 10 shared references). Shared topics: lepton flavor violation.","score":14.6,"rank":19,"section":"replacement","parts":[0.06,0.12,0.36,0.0,0.37],"abstract":"Charged lepton flavor violation provides a clear experimental signature in the search for physics beyond the Standard Model. In this work, we study the flavor-violating three-body tau decays $τ^- \\to \\ell_i^- \\ell_i^- \\ell_j^+$ ($\\ell_i \\neq \\ell_j$) induced by the scalar leptoquarks $R_2$ and $S_1$, focusing on flavor structures dominated by top- or charm-quark contributions. We compute the one-loop contributions to these processes and derive analytical expressions for the corresponding branching ratios. The phenomenological implications are analyzed for leptoquark masses at the TeV scale, taking into account current constraints from the anomalous magnetic moment of the muon, radiative lepton-flavor-violating decays, and the process $μ^-\\to e^-e^-e^+$. Within the allowed parameter space, the predicted branching ratios for $τ^- \\to \\ell_i^- \\ell_i^- \\ell_j^+$ can approach the sensitivities expected in near-future experiments. These results highlight the potential of three-body $τ$ decays as probes of lepton-flavor violation and as complementary tests of scalar leptoquark scenarios.","authors":"G. Hernández-Tomé, J. P. Hoyos-Daza, O. G. Miranda, R. Sánchez-Vélez","nlinked":44,"nref":64,"src":"INSPIRE","html":true},{"id":"3189132","arxiv":"2608.08551","title":"High Precision Fundamental Physics Experiments at JLab with Spin-transparent Storage Rings of Low-energy Polarized Electron Beams","first":"Khachatryan","nauth":32,"year":2026,"cites":0,"role":"repl","note":"Co-authors of yours: Reig. Closest of your papers: [[1607572]] (coupling 0.05, 5 shared references). Closest network paper: [[1861353]] (coupling 0.07, 9 shared references).","score":12.5,"rank":20,"section":"replacement","parts":[0.0,0.15,0.21,0.5,0.0],"abstract":"A breakthrough in fundamental physics experiments measuring particle spin precession may happen if spin-transparent storage rings become adopted tools for such experiments. We present a new design of highly specialized table-sized storage rings, which use low-energy polarized electron beams and Mott polarimetry. Based on the spin transparency ansatz, the spin precession stemming from the magnetic dipole moment is canceled at any beam energy after an electron's turn along the periodic orbit in the ring. Meanwhile, a spin precession induced by the fundamental physics of interest, e.g., the electron's permanent electric dipole moment (EDM) and/or ultralight-dark-matter-mediated forces such as axions, will accumulate. However, capitalizing on such types of rings is not only desirable for measurements of EDMs and axion searches relevant to $CP$ violation and matter-antimatter asymmetry in the Universe, but may also find very promising applications in quantum computing.","authors":"Vladimir Khachatryan, Riad Suleiman, Alberto Accardi, Kurt Aulenbacher, Carlos Ayerbe Gayoso, Marco Battaglieri, Devesh Bhattarai, Silviu Covrig Dusa, Yaroslav Derbenev, Forrest Friesen, Eric Fuchey, Joseph Grames, Paul Guèye, Tyler J. Hague, Ching Him Leung,  Wenliang,  Li, Magno V. T. Machado, Preet Mann, Vasiliy Morozov, Son Nguyen, Michael Nycz, Howard Oh, Udit Raha, Mario Reig, Marco Schreck, Nathaniel Sherrill, Ye Tian, Zakia Tithi, Alexandre Vieira, Erik Wrightson, Zichen Yin","nlinked":69,"nref":79,"src":"INSPIRE","html":true},{"id":"3226907","arxiv":"2611.13139","title":"Theory overview on LLP searches at the LHC","first":"Beltrán","nauth":1,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1686334]] (coupling 0.01, 1 shared references). Closest network paper: [[3073459]] (coupling 0.26, 28 shared references).","score":12.3,"rank":21,"section":"new","parts":[0.0,0.04,0.73,0.0,0.0],"abstract":"In these proceedings, we discuss heavy neutral leptons (HNLs) as well-motivated long-lived particle (LLP) candidates to illustrate the rich phenomenology that LLP searches can probe at the LHC. We briefly discuss the minimal HNL scenario, in which the phenomenology is governed by active-sterile neutrino mixing, and its characteristic displaced signatures. We then consider more general BSM scenarios with additional HNL interactions, showing how these can modify the main production and decay mechanisms, opening up new signatures beyond those of the minimal benchmark.","authors":"Rebeca Beltrán","nlinked":39,"nref":39,"src":"INSPIRE","html":true},{"id":"3189255","arxiv":"2608.08602","title":"Small-instanton effects in an atlas of Kim-Shifman-Vainshtein-Zakharov axion models","first":"Chen","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1607572]] (coupling 0.05, 5 shared references). Closest network paper: [[1861353]] (coupling 0.09, 11 shared references).","score":10.2,"rank":22,"section":"replacement","parts":[0.06,0.14,0.26,0.0,0.0],"abstract":"We investigate small-instanton contributions to the axion potential across a range of KSVZ models containing vector-like quarks~(VQs), using naive dimensional analysis. We consider scenarios containing a single VQ, multiple identical copies, and sets of distinct VQs, requiring in each case that the gauge couplings remain perturbative up to the Planck scale under the two-loop gauge running. The associated fermion zero-mode content varies between these cases, requiring different combinations of mass insertions and scalar--Yukawa contractions for its saturation. Increasing the copies of VQs can render the instanton-size integral dominated by instantons of the smallest size, corresponding to the scale near the ultraviolet~(UV) cut-off. The resulting contribution then becomes sensitive to the UV completion and the induced potential can compete with, or dominate over, the ordinary QCD contribution. Assuming that the QCD and small-instanton potentials are aligned, we determine the resulting axion-mass shift and its consequences for the axion--photon coupling. When the small-instanton induced susceptibility becomes comparable to or larger than the QCD susceptibility, the physical axion mass of $m_a$ is enhanced at fixed decay constant~$f_a$, while the axion-photon of $g_{aγγ}$ coupling remains controlled by $f_a$ and the anomaly ratio of $E/N$. The standard QCD relation among $m_a$, $f_a$ and $g_{aγγ}$ is consequently modified, opening new regions of the $(m_a,g_{aγγ})$ plane for axion searches.","authors":"Ning Chen, Saurabh K. Shukla","nlinked":80,"nref":82,"  their impact on $τ$-neutrino scattering","authors":"T. Ježo, M. Klasen, P. Risse, I. Schienbein, E. Spezzano","score":8.9,"section":"new","rank":23,"parts":[0.06,0.03,0.06,0.5,0.0],"note":"Co-authors of yours: Klasen. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[3095799]] (coupling 0.02, 1 shared references).","abstract":"We present next-to-leading-order calculations of heavy-quark contributions to the deep-inelastic scattering structure functions $F_4$ and $F_5$ within the Aivazis-Collins-Olness-Tung scheme, implemented in the open-source library APFEL++ and evaluated using CT18NLO parton distribution functions. These structure functions are suppressed by lepton mass effects in light-lepton processes, but become important in $τ$-lepton and neutrino scattering at facilities such as SHiP, IceCube, and DUNE. We furthermore quantify the direct impact of $F_4$ and $F_5$ on the charged-current $τ$-neutrino cross section, for the first time presented here, showing they can suppress it by up to $-40\\%$ near the kinematic boundary at low $Q^2$ and large $x$."},{"arxiv":"2611.13537","id":"3226990","title":"Helicity Decay to Baryons: The Cosmological Evolution of $L_μ-L_τ$ Gauge Fields and Baryogenesis","authors":"Kohei Kamada, Fumio Uchida, Di Wu","score":8.6,"section":"new","rank":24,"parts":[0.11,0.06,0.18,0.0,0.0],"note":"Also cites widely used network papers: [[779828]], [[2817040]]. Closest of your papers: [[922002]] (coupling 0.02, 2 shared references). Closest network paper: [[2051195]] (coupling 0.06, 24 shared references).","abstract":"We study baryogenesis from the post-inflationary decay of helical U(1)$_{L_μ-L_τ}$ gauge fields generated during axion inflation. Assuming that Schwinger pair production is suppressed during inflation, a large helicity-to-entropy ratio $η_H$ can be generated while keeping the initial lepton asymmetry just after inflation negligible. After reheating, the dissipation of magnetic helicity sources a lepton asymmetry through the chiral anomaly, which is partially converted into a baryon asymmetry by electroweak sphaleron processes. We find that there are parameter spaces where the observed baryon asymmetry can be generated in both the turbulent and dissipation-dominated regimes of the U(1)$_{L_μ-L_τ}$ magnetic field evolution. The baryon asymmetry generation in the turbulent regime is, however, dominated by the pre-turbulent nearly frozen regime. We further find that the requirement of successful baryogenesis imposes stronger constraints on the inflationary Hubble parameter and the helicity density generated during axion inflation than the requirement for the gauge-field energy not to backreact on the inflaton dynamics."},{"arxiv":"2611.13429","id":"3226929","title":"Composite spectroscopy of a chiral $SU(4)$ model","authors":"G. Cacciapaglia, A. Deandrea, A. M. Iyer, S. Kulkarni, A. K. Singh","score":8.0,"section":"new","rank":25,"parts":[0.0,0.09,0.36,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.03, 6 shared references). Closest network paper: [[2903351]] (coupling 0.13, 11 shared references).","abstract":"We consider a QCD-inspired chiral $SU(4)$ model, with a new fundamental sector ($q_{\\rm HC}$) charged under the confining hypercolor gauge group $SU(3)_{\\rm HC}$ as a template for electroweak dynamics and compositeness. The $(\\mathrm{SU}(4)_L\\times\\mathrm{SU}(4)_R)/\\mathrm{SU}(4)_V$ breaking leads to a rich structure of spin-0 and spin-1 resonances which can be produced by the hadronization of $q_{\\rm HC}$ in Drell-Yan processes at FCC-hh. Working in the true vacuum at a general misalignment angle $θ$, the fermion currents are derived for the fifteen techni-rho ($ρ_{\\rm HC}$) resonances, the techni-omega ($ω_{\\rm HC}$), and the techni-eta-prime ($η^{\\prime}_{\\rm HC}$) using the Hidden Local Symmetry formalism. The estimated branching fractions pave the way for studying the model spectroscopy. The analysis of the production by hadronization of $ρ_{\\rm HC}$, $ω_{\\rm HC}$ and $η^{\\prime}_{\\rm HC}$ states is presented for a 100 TeV future hadronic collider, FCC-hh. The projected discovery of $ρ_{\\rm HC}$ and $η^{\\prime}_{\\rm HC}$ is complementary to the direct production by Drell-Yan or Vector Boson Fusion, providing a smoking gun signature for Higgs compositeness."},{"arxiv":"2611.14170","id":"","title":"Projected sensitivity of the ANUBUIS detector to tau-coupled Heavy Neutral Leptons","authors":"Camilia Ben Messaouda, Theo Reymermier, Paul Swallow, Oleg Brandt for the ANUBIS Collaboration","score":7.8,"section":"cross","rank":26,"parts":[0.0,0.11,0.3,0.0,0.0],"note":"Closest of your papers: [[1615477]] (coupling 0.04, 2 shared references). Closest network paper: [[3171459]] (coupling 0.10, 12 shared references).","abstract":"Heavy Neutral Leptons (HNLs) provide a minimal and well-motivated extension of the Standard Model neutrino sector, and are naturally long-lived for small mixing angles between SM neutrinos and HNLs. A previous ANUBIS study determined the projected sensitivity to a single Majorana HNL coupled exclusively to the electron or to the muon, corresponding to the BC6 and BC7 benchmark scenarios of the Physics Beyond Colliders initiative. The present article extends that work to the complementary BC8 scenario, in which the HNL couples exclusively to the tau lepton. As the tau lepton is itself unstable and because charged-current HNL decay modes become available only above the kinematic tau lepton production threshold, the production, decay and event-selection characteristics of this scenario cannot be obtained by rescaling the electron- or muon-coupled results in flavour. The analysis is carried out end to end, from signal-sample generation through acceptance evaluation to sensitivity extraction, with the released SET-ANUBIS~v1.0.0 framework."},{"arxiv":"2611.13073","id":"3226941","title":"Long(itudinal) live the helioscope: novel bounds on solar dark photons from conversion on reflecting surfaces","authors":"Jonas Frerick","score":6.5,"section":"new","rank":27,"parts":[0.06,0.07,0.15,0.0,0.0],"note":"Also cites widely used network papers: [[1518747]]. Closest of your papers: [[2855387]] (coupling 0.03, 3 shared references). Closest network paper: [[2697223]] (coupling 0.05, 6 shared references).","abstract":"Conventional helioscope searches are insensitive to the longitudinal component of the solar dark photon (DP) flux, which dominates the solar emission for DP masses $m\\lesssim 1\\,$eV. In this paper, we demonstrate that this limitation can be overcome: using the interface conditions that follow from Maxwell's equations in the presence of a dark photon, we show that a relativistic longitudinal DP flux impinging on a telescope mirror produces an outgoing photon flux. We apply this principle to X-ray helioscopes which employ grazing incidence mirrors. As our main result, we find that BabyIAXO would be competitive with the current world-leading constraints from XENON1T if it can keep sensitivity down to energies of $10\\,$eV. Both IAXO and a proposed upgraded version would be able to reach a factor of $\\sim 2.5$ and $\\sim 13$ deeper than BabyIAXO, respectively, and thus probe a large fraction of unexplored parameter space for $10^{-5}\\,\\text{eV}\\lesssim m\\lesssim 0.75\\,$eV."},{"arxiv":"2611.13405","id":"3227011","title":"Thermal $CP$ dynamics in a four-fermion model: mean-field and functional renormalization group analyses","authors":"Arthur F. Vieira, Rudnei O. Ramos","score":5.5,"section":"new","rank":28,"parts":[0.0,0.08,0.13,0.0,0.12],"note":"Closest of your papers: [[1607572]] (coupling 0.03, 3 shared references). Closest network paper: [[2158000]] (coupling 0.05, 6 shared references). Shared topics: fermion mass.","abstract":"We investigate a one-flavor four-fermion model with scalar, pseudoscalar, and mixed scalar-pseudoscalar interactions at finite temperature and vanishing chemical potential. Our analysis combines the mean-field approximation, which determines the equilibrium condensates, with the functional renormalization group (FRG), which describes the scale dependence of the interactions and the fermion mass phase. Within the mean-field approach, we find that, in the absence of explicit symmetry-breaking sources, the dominant interaction determines the direction of condensation. In particular, a pseudoscalar condensate spontaneously breaks the ordinary $P/CP$ symmetry and disappears through a continuous thermal phase transition. For regular high-temperature FRG trajectories, the dimensionless mixed coupling tends to zero in the infrared, while its dimensionful counterpart remains finite. Increasing temperature also suppresses the scale evolution of the fermion mass phase. Together, these results clarify the distinct roles of thermal fluctuations in suppressing spontaneous symmetry breaking and fermionic instabilities, without necessarily eliminating explicit symmetry breaking effects."},{"arxiv":"2611.13733","id":"3227047","title":"Scalar-Induced Gravitational Waves Probing Phase Transitions in the Standard Model and Beyond","authors":"Peizhi Du, Xiang-Xi Zeng, Jiahang Zhong","score":5.3,"section":"cross","rank":29,"parts":[0.0,0.04,0.28,0.0,0.0],"note":"Closest of your papers: [[1679809]] (coupling 0.01, 1 shared references). Closest network paper: [[2693756]] (coupling 0.10, 15 shared references).","abstract":"Scalar-induced gravitational waves (SIGWs) are unique messengers of physics in the early Universe and possible sources for the observed data from pulsar timing arrays (PTAs). It has been demonstrated that SIGWs have the potential to probe cosmological phase transitions via measurement of the equation of state and sound speed of the cosmic thermal bath, which have non-trivial time dependence during phase transitions. In this work, we improve on existing studies of SIGWs in a time-dependent background with time-dependent initial conditions and an entropy-conserving thermal history of the Standard Model (SM). We provide possible physical explanations for features of the gravitational wave spectrum from phase transitions, the most prominent of which for a scale-invariant curvature spectrum is a step due to entropy dilution. We show that current and future gravitational wave observations across a wide range of frequencies can probe phase transitions in the SM and physics beyond the Standard Model (BSM). Signals from the QCD crossover appear around 10 nHz, inside the observable window of PTAs. We perform data analyses using NANOGrav 15-year data, showing a mild preference for the QCD crossover over standard radiation domination for two choices of curvature spectra. BSM phase transitions in the TeV range lead to signals around mHz, which are accessible in future space-based experiments such as LISA, Taiji and TianQin."},{"arxiv":"2603.02652","id":"3125294","title":"Weinberg Angle, Neutron Abundance in BBN, and Lifetime","authors":"Cheng Tao Yang, Johann Rafelski","score":5.1,"section":"replacement","rank":30,"parts":[0.06,0.05,0.11,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1755250]] (coupling 0.02, 1 shared references). Closest network paper: [[3190827]] (coupling 0.04, 5 shared references).","abstract":"We present state of the art kinetic theory determination of the neutron abundance available for the Big-Bang nucleosynthesis (BBN). Our work is motivated by the study of the neutron lifespan measured in the laboratory and the unknown strength of weak interactions coupling constant $G_\\mathrm{F}$ at finite temperature in the primordial Universe. We draw attention to the relevant dependence of $G_\\mathrm{F}$ on the symmetry breaking Weinberg angle $s^2_\\mathrm{W}$, a free parameter in the standard model of particle physics. We establish how the value of $s^2_\\mathrm{W}$ by way of $G_\\mathrm{F}$ modification influences neutron abundance available for BBN and neutron lifetime."},{"arxiv":"2309.00132","id":"2692821","title":"A possible constraint to the uncertainty associated with the elements in the quark mixing matrix","authors":"Jae Jun Kim","score":4.8,"section":"replacement","rank":31,"parts":[0.06,0.04,0.1,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[2660557]] (coupling 0.04, 1 shared references).","abstract":"We present an extra condition by which the size of the uncertainty associated with the diagonal elements in the quark mixing matrix can be further constrained when the matrix is parameterized by a combination of three mixing angles and a Dirac phase. We discuss how the correlations among the uncertainties of the diagonal elements can be used when we address issues such as the tension in the first row of the matrix and discuss its implications."},{"arxiv":"2606.17132","id":"3169184","title":"Are neutrinos Majorana? Fixed-target and high-energy astrophysical searches decide","authors":"Gabriela Barenboim, Mauricio Bustamante, Qinrui Liu","score":4.8,"section":"replacement","rank":32,"parts":[0.06,0.03,0.12,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1854224]] (coupling 0.01, 3 shared references). Closest network paper: [[2941092]] (coupling 0.04, 10 shared references).","abstract":"The original version of this paper proposed a new approach to determining whether neutrinos are Dirac or Majorana fermions, a fundamental open question in particle physics. Conventional searches rely on neutrinoless double beta decay, but this electron-only channel suffers from blind spots. We propose a new, complementary probe to overcome this limitation. A heavy neutral lepton (HNL) triggers a high-energy shift in how the active neutrino flavors ($ν_e$, $ν_μ$, $ν_τ$) mix---but only if the neutrinos are Majorana. For GeV-scale HNLs, the upcoming beam-dump experiment SHiP can discover the HNL and measure how it mixes with the active flavors. However, the proposed signature of the Majorana nature of neutrinos does not exist. The reasons are explained here. The analysis has been superseded by Ref.~\\cite{Barenboim:2026udr}. The original version is retained as v1 for the record."},{"arxiv":"2611.14318","id":"","title":"Resolved $Q_1^q$-$Q_{7γ}$ interference in $\\bar{B}\\to X_sγ$ at NLO: Hard matching and radiative charm-loop jet function for $m_c \\to 0$","authors":"Riccardo Bartocci, Philipp Böer, Kevin Brune, Tobias Hurth","score":4.6,"section":"new","rank":33,"parts":[0.0,0.07,0.16,0.0,0.0],"note":"Closest of your papers: [[2855387]] (coupling 0.03, 3 shared references). Closest network paper: [[2677060]] (coupling 0.06, 6 shared references).","abstract":"We study next-to-leading-order (NLO) QCD corrections to the subleading-power resolved-photon contribution to $\\bar{B}\\to X_sγ$ arising from the interference of the current-current operator $Q_1^q$ and the electromagnetic dipole operator $Q_{7γ}$. This contribution is among the main sources of theoretical uncertainty in Standard Model predictions for the decay rate. Using a factorisation theorem in soft-collinear effective theory for the kinematic endpoint region, $m_b-2E_γ=\\mathcal{O}(Λ_{\\rm QCD})$, we determine all previously unknown perturbative ingredients at NLO in the limit of a vanishing charm-quark mass, $m_c\\to0$. Specifically, we compute the $m_c$-independent one-loop hard-matching coefficients, derive their renormalisation-group equations, and obtain accurate analytic approximations to their solutions by retaining the first two terms in a $1/N_c$ expansion. Our second main result is the two-loop correction to the radiative charm-loop jet function, including its full dependence on the collinear momentum fraction. Combining these results with the known $\\mathcal{O}(α_s)$ correction to the quark jet function and the one-loop renormalisation of the subleading shape function $g_{17}$, previously computed by some of us, we provide the first complete NLO description of this resolved contribution in the massless-charm limit. This leaves the $m_c$ dependence of the radiative charm-loop jet function as the remaining ingredient for a phenomenological analysis within renormalisation-group-improved perturbation theory."},{"arxiv":"2611.13954","id":"3227058","title":"Neutron stars nearly close the window for muon-induced baryon-number violation","authors":"Bharat Kumar","score":4.4,"section":"cross","rank":34,"parts":[0.0,0.05,0.19,0.0,0.0],"note":"Closest of your papers: [[1854224]] (coupling 0.02, 2 shared references). Closest network paper: [[2063283]] (coupling 0.07, 5 shared references).","abstract":"Baryon-number violation that needs a muon in the initial state can evade proton-decay searches and be observed in muon capture at Mu2e and COMET. Neutron stars contain muons, so the same interaction converts their protons into dark baryons, but the rate of this conversion in dense matter and its consequences have not been computed. In this paper we compute the conversion rate, the heat it deposits, and the evolution of a star under fast conversion. The coldest known neutron stars exclude conversion rates far below laboratory reach for every dark-fermion mass that capture in aluminium can produce, and faster conversion burns stars down or, unless conserved dark baryons repel each other strongly enough, collapses them. The repulsion they need follows a scaling law in the baryonic mass headroom of the nucleonic equation of state, which applies to any process that puts dark baryons in equilibrium with neutrons."},{"arxiv":"2606.25078","id":"3172795","title":"Neutron-Skin Sensitivity and Calibration Requirements in Coherent Quarkonium Diffraction","authors":"Lei Wang","score":3.6,"section":"replacement","rank":35,"parts":[0.0,0.0,0.24,0.0,0.0],"note":"Closest network paper: [[2771314]] (coupling 0.08, 10 shared references).","abstract":"Coherent quarkonium spectra probe the spatial gluon distribution and, under specified assumptions, the neutron skin of $^{208}\\mathrm{Pb}$. For three accessible channels at the Electron--Ion Collider, a joint spectral fit with specified selected-event totals and auxiliary constraints gives a coherent-only local uncertainty of 0.02458 fm, increasing to 0.03120 fm with a residual incoherent yield equal to 5\\% of the coherent yield. To interpret the spectra in terms of a neutron radius, we examine separately the finite-dipole response and the relation between gluon and nucleon distributions. We test response changes and calibration offsets in the presence of background using direct nonlinear Poisson fits. The full spectrum distinguishes a specified density-dependent gluon deformation, whereas a constructed displacement of the gluon edge is exactly degenerate with the neutron skin. An independent 0.03 fm calibration uncertainty in this direction raises the background-inclusive local width to 0.04328 fm; the construction does not predict the physical size of such a displacement. The results show how the conditional sensitivity depends on an external calibration of the spatial gluon distribution."},{"arxiv":"2611.13090","id":"3226928","title":"First constraints on axion-like particles with SPHEREx data","authors":"Connor Hainje, Elena Pinetti, David W. Hogg","score":3.5,"section":"new","rank":36,"parts":[0.0,0.05,0.09,0.0,0.07],"note":"Closest of your papers: [[2859009]] (coupling 0.02, 1 shared references). Closest network paper: [[1873642]] (coupling 0.03, 3 shared references).","abstract":"We present the first search for axion-like particle dark matter using SPHEREx data. We perform a conservative analysis on the first 16.5 months of SPHEREx data and derive new limits on the mass range $0.496 < m_a < 3.32\\,\\mathrm{eV}$ that are competitive with the literature. Our tightest limit on the coupling relative to those previously published is $g_{aγγ} < 2.10 \\times 10^{-11}\\,\\mathrm{GeV}^{-1}$ at $m_a = 0.606\\,\\mathrm{eV}$, with a median limit of $g_{aγγ} < 4.16 \\times 10^{-11}\\,\\mathrm{GeV}^{-1}$. Cast as model-independent limits on the lifetime of the dark matter particle, the median limit is $τ> 6.5 \\times 10^{25}\\,\\mathrm{s}$. We are also able to detect several expected emission features at high significance, such as atmospheric He I and the 3.3 $μ$m PAH feature. We calculate the Cramér-Rao bound and compare to sensitivity forecasts, finding that our limits could be improved by more than an order of magnitude with solely methodological improvements."},{"arxiv":"2404.09159","id":"2777271","title":"Heavy Particle Towers and Nonlocal QFT","authors":"Stathes Paganis","score":3.5,"section":"replacement","rank":37,"parts":[0.06,0.02,0.06,0.0,0.0],"note":"Also cites widely used network papers: [[902365]]. Closest of your papers: [[1402978]] (coupling 0.01, 1 shared references). Closest network paper: [[1860536]] (coupling 0.02, 1 shared references).","abstract":"A number of gravitation-motivated theories, as well as theories with new coloured fermions predict heavy particle towers with spectral densities $ρ(m^2)$ growing faster than $e^{m}$, a characteristic of nonlocalizable theories. It is shown that if a light scalar, like the Higgs boson, interacts strongly with a heavy scalar particle tower with exponentially rising degeneracy, then the local low-energy theory is equivalent to an effective nonlocal scalar QFT. For energies approaching the nonlocality scale $p^2\\simeqΛ_{NL}^2$, the scalar propagator and scattering amplitudes are modified by nonlocal factors of the form $e^{p^2/Λ^2_{NL}}$. The double-Higgs production measurement at the LHC is proposed as a highly sensitive probe of nonlocality at the electroweak scale."},{"arxiv":"2608.13206","id":"3190952","title":"Long-term 3+1 simulations of primordial black hole formation during radiation domination","authors":"Zhuan Ning, Rong-Gen Cai, Shao-Jiang Wang, Chul-Moon Yoo","score":3.5,"section":"replacement","rank":38,"parts":[0.0,0.05,0.14,0.0,0.0],"note":"Closest of your papers: [[2855387]] (coupling 0.02, 2 shared references). Closest network paper: [[2936837]] (coupling 0.05, 8 shared references).","abstract":"We develop an efficient three-dimensional numerical-relativity framework for primordial black-hole (PBH) formation from superhorizon curvature perturbations in a radiation-dominated Universe. We implement flux-conservative relativistic hydrodynamics in the adaptive-mesh-refinement code GRChombo and introduce a cosmologically scaled Gamma-driver that allows the cosmic-time step to grow in proportion to the scale factor. For a representative long-term simulation, the scaled driver preserves the apparent-horizon mass evolution and constraint behavior while reducing the number of coarse-level advances by a factor of approximately $94$ relative to the standard driver. We also construct a conformal-time version of the moving-puncture gauge as a consistency check. Applying the framework to a spherical Gaussian curvature profile, we find a collapse threshold $μ_c \\simeq 0.7958$ and approximate critical mass scaling, consistent with previous spherically symmetric results. We further fit the late-time PBH mass growth to the Zel'dovich--Novikov accretion law, demonstrating that the code can follow both near-critical collapse and long-term post-formation evolution in three dimensions. The framework provides a foundation for future studies of PBH formation beyond spherical symmetry."},{"arxiv":"2611.13805","id":"3227068","title":"Three Dimensional Structure of Pion with One Dynamical Gluon in the Light-Cone Quark Model","authors":"Satyajit Puhan, Shubham Sharma, Narinder Kumar","score":3.2,"section":"new","rank":39,"parts":[0.06,0.01,0.06,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.00, 1 shared references). Closest network paper: [[2698004]] (coupling 0.02, 9 shared references).","abstract":"We study the three-dimensional structure of the pion beyond the leading Fock state by including a dynamical gluon, $|π\\rangle=|q\\bar q\\rangle+|q\\bar q g\\rangle$. Within the light-cone quark model, we calculate the pion GPDs, TMDs, and PDFs from light-front wave function overlaps, using a modified Brodsky--Huang--Lepage wave function with the Melosh--Wigner rotation for the valence sector and the light-front quark--gluon vertex for the $q\\bar q g$ sector. The quark-number and momentum sum rules are satisfied without additional constraints. We further obtain the electromagnetic form factor and the mass decomposition. After NLO evolution, we compare the PDFs with pion-induced Drell--Yan, $J/ψ$, $Υ$, and HERA leading-neutron $F_2^π$ data. The $q\\bar q g$ sector contributes little to Drell--Yan but becomes important for gluon-sensitive observables such as $J/ψ$ production and the pion structure function at small $x$."},{"arxiv":"2611.13915","id":"3227048","title":"Strong decays of $ψ(3770)$, $ψ(4040)$ and $ψ(4160)$ in four relativistic wave-function representations","authors":"Wen-Yuan Ke, Wan-Li Ju, Tianhong Wang, Qiang Li, Guo-Li Wang","score":2.9,"section":"new","rank":40,"parts":[0.06,0.01,0.03,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.00, 1 shared references). Closest network paper: [[1710056]] (coupling 0.01, 3 shared references).","abstract":"Strong decays provide a direct test of the relativistic structure of heavy quarkonium wave functions. We study the OZI-allowed hadronic decays of the vector charmonia $ψ(3770)$, $ψ(4040)$ and $ψ(4160)$ within the Salpeter equation, using four relativistic wave-function representations $\\varphi_1$--$\\varphi_4$ that differ in the $S$-, $P$- and $D$-wave components they retain independently, and the revised ${}^3P_0$ model. The quark-pair creation strength is fixed once, by reproducing the measured $ψ(3770)\\to D\\bar D$ width, and is not readjusted afterwards, so that the results for the two higher states are parameter-free predictions. The representation $\\varphi_2$ predicts $94^{+34}_{-23}$~MeV for $ψ(4040)$ and $100^{+23}_{-20}$~MeV for $ψ(4160)$, in agreement with the measured $84.5\\pm12.3$ and $69\\pm10$~MeV, and it is the only one whose predicted width ratios are compatible with the data. By contrast, $\\varphi_1$ overshoots $ψ(4040)$ by $2.5σ$, $\\varphi_3$ gives the largest widths and is disfavoured at the $5σ$ level, and $\\varphi_4$, which has no independent $S$-wave component, underestimates $ψ(3770)$ by about $2σ$ and cannot be applied to final states containing vector mesons. These results show that a successful representation must contain independent $S$, $P$ and $D$ components, the $P$-wave terms providing the dominant relativistic correction, while the nodal structure of the wave functions accounts for the large uncertainties of the predictions. The mixing angles extracted from $\\varphi_2$, $7.92^{\\circ}$, $25.8^{\\circ}$ and $26.3^{\\circ}$, agree with the values obtained in coupled-channel models."},{"arxiv":"2611.13080","id":"3226932","title":"Thermal damping of spectator scalar dark matter: Relaxing the overclosure and isocurvature bounds","authors":"Erwin H. Tanin, Sarunas Verner","score":2.5,"section":"new","rank":41,"parts":[0.0,0.0,0.12,0.0,0.07],"note":"Closest network paper: [[2736974]] (coupling 0.04, 10 shared references).","abstract":"A light scalar present during inflation generically acquires a misalignment and can later constitute the dark matter. Since it fluctuates independently of the inflaton, however, it carries isocurvature perturbations. Isocurvature and overclosure bounds together rule out the simplest version of this scenario at high inflationary scales. We show that a weak coupling to the primordial plasma can relax both bounds simultaneously. The plasma depletes the scalar abundance through thermal damping, a dissipative effect arising from the plasma's finite equilibration time, thereby relaxing the overclosure bound. If the damping grows with the oscillation amplitude, it can also drive different initial amplitudes onto a common attractor that depends only on the local radiation temperature. This synchronizes the scalar with the adiabatic clock, thus suppressing its isocurvature. The resulting isocurvature bound on the inflationary scale relaxes by exactly the factor by which damping reduces the abundance, in addition to the relaxation from the larger initial misalignment now allowed. This result holds for any damping rate quadratic in the amplitude, regardless of its temperature dependence."},{"arxiv":"2607.14300","id":"3180977","title":"Production Effects and Final-state Interactions in $π_1 \\to 3π$","authors":"D. Winney, S. Gonzàlez-Solís, M. Mikhasenko, Ł. Bibrzycki, C. Fernández-Ramírez, V. Mathieu, G. Montaña, A. Pilloni, L. Qiu, A. Rodas, A. P. Szczepaniak","score":2.5,"section":"replacement","rank":42,"parts":[0.0,0.02,0.12,0.0,0.0],"note":"Closest of your papers: [[1365306]] (coupling 0.01, 1 shared references). Closest network paper: [[3193100]] (coupling 0.04, 50 shared references).","abstract":"We investigate the $π_1(1600)$ signal channel of $3π$ in the $J^{PC} = 1^{-+} \\,[ππ]_{1^{--}}π~P$-wave. This channel has recently been analyzed by the COMPASS collaboration using the ``freed-isobar\" technique which provides direct experimental access to the lineshape modifications of the $P$-wave $ππ$ sub-channel arising from both final state interactions and production processes such as the Deck mechanism. We motivate a unified formalism combining production effects and final state interactions using the Khuri-Treiman formalism, which is consistent with low-energy unitarity, analyticity, and crossing symmetry, seeded by an initial production amplitude. We demonstrate that the precise lineshape of the $ππ$ mass spectrum can be used to determine the relative strength and complex phase of different production mechanisms contributing to the $3π$ final state. We conduct a global fit of the $π_1$ freed-isobar data set, yielding a multi-dimensional parameterization of the $π_1\\to3π$ decay amplitude at COMPASS as a function of both decay and production variables. We identify the contributions from short-range production and the Deck mechanism and extract the total $3π$ invariant mass dependence which will be important for a future extraction of the $π_1$ pole position in the $ρπ$ channel."}],"rest":[{"arxiv":"2611.13222","title":"AlphaHits: Full-Event Tracking and Reconstruction Towards a Hit-Level Foundation Model","score":2.1,"section":"cross","rank":43},{"arxiv":"2611.13418","title":"A dual-moment framework toward unification of the four fundamental interactions","score":1.8,"section":"new","rank":44},{"arxiv":"2611.13105","title":"Galaxy clusters as cosmic lenses for high frequency gravitational-waves","score":1.7,"section":"new","rank":45},{"arxiv":"2611.14028","title":"Constraints on Lorentz Invariance Violation from PeV Gamma Rays of Cygnus X-3 Observed by LHAASO","score":1.7,"section":"cross","rank":46},{"arxiv":"2611.04910","title":"Next-to-leading order QCD corrections to fully charm tetraquark radiative decays","score":1.7,"section":"replacement","rank":47},{"arxiv":"2611.13833","title":"Cross-experiment tests of the atmospheric-muon excess","score":1.6,"section":"cross","rank":48},{"arxiv":"2611.13096","title":"Off-shell continuation from on-shell recursion","score":1.5,"section":"new","rank":49},{"arxiv":"2611.13184","title":"The KLN theorem meets collinear factorisation: Local Unitarity for hadronic cross-sections","score":1.5,"section":"new","rank":50},{"arxiv":"2611.13152","title":"Nuclear geometry under external magnetic field in the Skyrme-Maxwell model","score":1.5,"section":"cross","rank":51},{"arxiv":"2611.14086","title":"Cosmic String Networks with Time-Varying Tension: Field-T document.getElementById('dek').textContent=`${M.nrel} of the ${M.nlist} papers in this listing (${M.counts.new} new, ${M.counts.cross} cross-lists, ${M.counts.replacement} replacements) score ${M.threshold} or more for belonging to the reference and citation network of your ${M.nown} papers and the ${M.next} papers by other authors around them. Highest score first.`;
