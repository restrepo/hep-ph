<script>
const RAW = {"n":[{"id":"3232180","arxiv":"2611.28224","title":"TeV-Scale Leptogenesis in the Linear Seesaw Framework","first":"Hernández","nauth":4,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Valle. Cites 6 network papers: [[3183927]], [[1846923]], [[3193100]], [[2779468]], [[2134261]], [[1929060]]. Also cites widely used network papers: [[779828]]. Closest of your papers: [[922002]] (coupling 0.03, 2 shared references). Closest network paper: [[2779468]] (coupling 0.15, 12 shared references). Shared topics: neutrino mass, seesaw mechanism.","score":53.6,"rank":1,"section":"new","parts":[0.97,0.1,0.44,0.5,0.5],"abstract":"The linear seesaw mechanism relates the smallness of neutrino masses to the mass splitting within a quasi-Dirac pair of heavy neutrinos, thereby providing a natural framework for realising resonant leptogenesis at low energies. We investigate this possibility within its simplest effective realisation, in which neutrino masses are mediated by a quasi-Dirac pair at the TeV scale. We estimate the generation of the baryon asymmetry in the purely flavoured and strong-washout regimes, identifying phenomenologically viable parameter regions and benchmark scenarios in which the heavy-neutrino decays are dominated either by the SM Higgs doublet or by a second, leptophilic scalar doublet responsible for neutrino mass generation. We find viable leptogenesis solutions both near and away from the resonant maximum and discuss complementary phenomenological probes of the framework.","authors":"A. E. Cárcamo Hernández, J. Echeverria-Puentes, Stephen F. King, José W. F. Valle","nlinked":54,"nref":55,"src":"INSPIRE","html":true},{"id":"3232220","arxiv":"2611.28223","title":"Scotogenic dark matter from gauged $L_μ+L_τ$","first":"Echeverria-Puentes","nauth":6,"year":2026,"cites":0,"role":"today","note":"Cites 8 network papers: [[2815042]], [[3193100]], [[2623114]], [[2697223]], [[1835430]], [[1790924]]…. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1708009]] (coupling 0.04, 3 shared references). Closest network paper: [[2963992]] (coupling 0.14, 21 shared references). Shared topics: scotogenic model, dark matter candidate, relic abundance.","score":52.7,"rank":2,"section":"new","parts":[0.99,0.13,0.4,0.0,0.81],"abstract":"In this work, we introduce the first scotogenic model based on a gauged $L_μ + L_τ$ symmetry whose spontaneous breaking by two units leaves a remnant matter parity $M_P$. The resulting light active neutrinos are of Majorana nature and the lightest electrically neutral state mediating the scotogenic loop is stabilized by $M_P$ and can be identified as a weakly interacting massive particle dark matter candidate. We analyze the phenomenology of a predominantly singlet-like CP-even scalar dark matter candidate and the representative regions of parameter space compatible with the observed thermal relic abundance. The $Z'$ boson is compatible with a broad range of parameters relevant for dark matter. In particular, electroweak precision constraints do not lead to significant tensions for kinetic mixing values up to $ε\\sim 10^{-2}$. We discuss the implications of existing searches for leptophilic gauge bosons and the conditions under which visible and invisible collider signatures become relevant.","authors":"J. Echeverria-Puentes, Sergey Kovalenko, Pablo San Martin Sartori, Carlos A. Vaquera-Araujo, Yoxara Villamizar, Jilberto Zamora Saa","nlinked":61,"nref":63,"src":"INSPIRE","html":true},{"id":"3232197","arxiv":"2611.28217","title":"WIMPs as FIMPs: the Inert Doublet Model and low-temperature reheating","first":"Bélanger","nauth":5,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Bernal. Cites 3 network papers: [[2962467]], [[875754]], [[1501489]]. Also cites widely used network papers: [[1518747]], [[2817040]]. Closest of your papers: [[2859009]] (coupling 0.05, 7 shared references). Closest network paper: [[2962467]] (coupling 0.16, 14 shared references). Shared topics: inert doublet, relic abundance.","score":52.4,"rank":3,"section":"new","parts":[0.85,0.15,0.46,0.5,0.61],"abstract":"Weakly Interacting Massive Particles (WIMPs) are conventionally assumed to acquire their dark matter relic abundance through thermal freeze-out. However, this association relies on assumptions concerning the thermal history of the early Universe. We revisit the Inert Doublet Model (IDM), a representative WIMP framework in which dark matter interacts with the Standard Model through electroweak gauge interactions, even when its Higgs-portal coupling vanishes. We demonstrate that sufficiently low reheating temperatures can prevent chemical equilibrium, allowing a genuine WIMP to acquire its relic abundance through freeze-in rather than freeze-out. Considering both instantaneous and finite-duration reheating, we identify different production histories, including freeze-out during radiation domination, freeze-out during reheating, and freeze-in with potentially significant annihilation backreactions. These scenarios open regions of the IDM parameter space that would otherwise be excluded by dark matter overabundance. Our results demonstrate that WIMPs can behave as FIMPs, depending on the thermal history of the Universe.","authors":"Geneviève Bélanger, Nicolás Bernal, Andreas Goudelis, Alexander Pukhov, Thomas Reggio","nlinked":78,"nref":78,"src":"INSPIRE","html":true},{"id":"3233342","arxiv":"2611.30799","title":"Fermionic dark linear seesaw with an anomalous Majoron","first":"Batra","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites your papers: [[1365306]]. Cites 22 network papers: [[3178456]], [[3092811]], [[3094526]], [[3152380]], [[2931725]], [[3193100]]…. Also cites widely used network papers: [[1362180]]. Closest of your papers: [[1741056]] (coupling 0.04, 10 shared references). Closest network paper: [[3088651]] (coupling 0.17, 82 shared references). Shared topics: neutrino mass, lepton number.","score":51.0,"rank":4,"section":"new","parts":[1.0,0.15,0.47,0.0,0.45],"abstract":"We propose a minimal fermionic realisation of the $\\textit{dark}$ linear seesaw with spontaneous breaking of lepton number. The small lepton-number-violating parameter responsible for linear-seesaw neutrino masses is generated radiatively by a $\\textit{dark}$ sector consisting of a singlet and a doublet fermion, together with scalar singlets. The global U(1)$_L$ symmetry is broken to a residual $\\mathcal{Z}_2$ under which the $\\textit{dark}$ sector is odd. This breaking yields a Majoron $J$ and makes the lightest $\\textit{dark}$ particle stable. The charged $\\textit{dark}$ fermion acquires its mass solely from U(1)$_L$ breaking and thus induces an anomalous Majoron coupling to photons. Current bounds on this coupling exclude a massless Majoron for TeV-scale U(1)$_L$ breaking. We add a linear term that breaks lepton number softly and gives the Majoron a GeV-scale mass. Such a Majoron decays into two photons and can be probed at beam-dump experiments. We study the dark matter phenomenology, focusing on the case where the stable particle is a fermionic weakly interacting massive particle. We analyse how the framework can be tested through charged-lepton flavour-violating decays such as $μ\\to eγ$, which receive contributions from both the $\\textit{dark}$ and the seesaw sectors. Moreover, both sectors enhance the Majoron couplings to charged leptons, so that the Majoron-emitting decays $τ\\to \\ell J$ ($\\ell = e,μ$) typically exceed $τ\\to \\ellγ$ by orders of magnitude and can probe parameter space beyond the reach of $μ\\to eγ$.","authors":"A. Batra, H. B. Câmara, F. R. Joaquim","nlinked":211,"nref":227,"src":"INSPIRE","html":true},{"id":"3233390","arxiv":"2611.31142","title":"A proposal for an LHC search for baryon number violation in complementarity with trilepton nucleon decay searches","first":"Bhoonah","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2053590]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1615477]] (coupling 0.03, 4 shared references). Closest network paper: [[3188391]] (coupling 0.31, 53 shared references). Shared topics: collider phenomenology.","score":36.5,"rank":5,"section":"new","parts":[0.48,0.1,0.9,0.0,0.31],"abstract":"We investigate the compatibility of existing limits on trilepton nucleon decay by the Super-Kamiokande (Super-K) experiment with Baryon Number Violation (BNV) at the TeV scale and motivate a dedicated search using existing data at the LHC. Working within an effective field theory framework, we derive model-independent constraints on higher-dimensional operators associated with $B - L/3$ conserving texture of BNV. We demonstrate that existing Super-K limits on loop-level trilepton nucleon decay provide significantly stronger constraints compared to tree-level charm-baryon decays induced by these operators. These constraints translate into bounds of $O(1-30)$ TeV on the BNV scale, leaving open the possibility of an LHC search for $B - L/3$ type BNV. Motivated by this complementarity, we investigate the collider phenomenology of a representative UV completion featuring an $s$-channel diquark resonance that decays into a leptoquark--dilepton pair, producing a distinctive final state containing an anti-top quark, two charged anti-leptons, and missing transverse energy. Our results indicate that, although same-sign dilepton searches by ATLAS and CMS already place indirect constraints on this model, a dedicated analysis based on the selection cuts we develop significantly extends the reach for our chosen benchmarks. In particular, using only Run 2 data, we demonstrate complementary reach to limits on trilepton nucleon decay searches set by the Super-K experiment and to the projected reach of Hyper-Kamiokande. The selection cuts are applicable beyond our representative model.","authors":"Amit Bhoonah, Francis M. Burk, Da Liu, Tong Ou, Deepak Sathyan","nlinked":76,"nref":78,"src":"INSPIRE","html":true},{"id":"3233321","arxiv":"2611.30638","title":"Towards a Global CE$ν$NS Picture","first":"Banerjee","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[2909343]], [[1287034]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1746620]] (coupling 0.01, 1 shared references). Closest network paper: [[2085162]] (coupling 0.23, 32 shared references).","score":36.3,"rank":6,"section":"new","parts":[0.72,0.04,0.67,0.0,0.0],"abstract":"We present a general framework for extracting and interpreting the Coherent Elastic Neutrino-Nucleus Scattering (CE$ν$NS) differential cross-section from experimental data. A generalized parametric basis, constructed from common kinematic terms recurring in generalized neutrino interaction models, is employed to numerically constrain the shape and normalization of the observed CE$ν$NS response. The framework was applied to the COHERENT CsI and liquid argon datasets using Bayesian inference, yielding normalization constraints comparable to those reported by the Collaboration while providing additional constraints on the correlated spectral shape. A combined analysis was also performed, exploiting the complementary sensitivities of the two datasets to constrain features of the differential cross-section that are less accessible to either dataset individually. The framework has been implemented in the open-source Julia package Newtrinos.jl, which supports modular forward modeling, parallel computation, and automatic differentiation.","authors":"Heerak Banerjee, Philipp Eller","nlinked":130,"nref":140,"src":"INSPIRE","html":true},{"id":"3232169","arxiv":"2611.28214","title":"Vector boson scattering in composite Higgs models","first":"Caliri","nauth":3,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Porod. Cites 1 network paper: [[1866947]]. Closest of your papers: [[1455793]] (coupling 0.03, 5 shared references). Closest network paper: [[2903351]] (coupling 0.27, 19 shared references).","score":34.7,"rank":7,"section":"new","parts":[0.45,0.08,0.76,0.5,0.0],"abstract":"Vector boson scattering is a powerful tool to test the mechanism of electroweak symmetry breaking. We focus on Composite Higgs models with an underlying fermionic description and assume that only one pseudo Nambu-Goldstone boson contributes to electroweak symmetry breaking, which we identify as the Higgs state of the Standard Model. In these scenarios, LHC data imply lower bounds on the predicted resonances below 2 TeV depending on the scenario. Using $WZjj$ production as a benchmark, we demonstrate that the tails of various distributions nevertheless show significant deviations from Standard Model predictions. This holds in particular for the case of longitudinally polarised vector bosons.","authors":"Rosy Caliri, Manuel Kunkel, Werner Porod","nlinked":78,"nref":82,"src":"INSPIRE","html":true},{"id":"3085047","arxiv":"2511.15793","title":"How Bright in Gravitational Waves are Millisecond Pulsars for the Galactic Center GeV Gamma-Ray Excess? A Systematic Study and Implications for Dark Matter","first":"Lei","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1327184]]. Closest of your papers: [[1421624]] (coupling 0.12, 21 shared references). Closest network paper: [[3130997]] (coupling 0.17, 19 shared references).","score":33.3,"rank":8,"section":"replacement","parts":[0.45,0.32,0.48,0.0,0.07],"abstract":"The existence of dark matter (DM) is supported by various macroscopic observations, but its microscopic nature remains elusive. The Galactic Center GeV gamma-ray excess (GCE) has been a leading candidate signal for particle DM annihilation. However, an unresolved population of millisecond pulsars (MSPs) in the bulge provides the alternative explanation for the excess. Identifying these MSPs in electromagnetic bands is difficult due to source confusion, pulse broadening, and extinction. Gravitational waves (GWs) provide a complementary probe: a steadily rotating, non-axisymmetric MSP emits a nearly monochromatic GW signal in the sensitive band of ground-based detectors, with amplitude set by its ellipticity. In this work, we systematically investigate the GW emission from the MSP population proposed to explain the GCE and its detectability with current and future detectors. We consider three major scenarios for the origin of ellipticity and model the population properties of these MSPs. We also consider both isolated MSPs and MSPs in binary systems, as well as Doppler effects in the detection. We find that while the signal is below the reach of current interferometers, next-generation detectors such as the Einstein Telescope (ET) and Cosmic Explorer (CE) may detect a fraction of those MSPs, offering a novel test of the MSP interpretation of the GCE. Future directed searches toward the Galactic Center may either uncover this long-sought MSP population or place stringent constraints on bulge MSP properties. Continued improvements in detector sensitivity will provide increasingly stringent tests of the MSP interpretation, with growing power to distinguish between the astrophysical and DM interpretations of the GCE.","authors":"Ming-Yu Lei, Bei Zhou, Xiaoyuan Huang","nlinked":148,"nref":160,"src":"INSPIRE","html":true},{"id":"3232193","arxiv":"2611.28230","title":"Higgs-portal dark matter beyond kinetic equilibrium","first":"Arcadi","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1724453]]. Also cites widely used network papers: [[1494411]]. Closest of your papers: [[2859009]] (coupling 0.06, 6 shared references). Closest network paper: [[2751074]] (coupling 0.09, 5 shared references). Shared topics: indirect detection, relic abundance, direct detection, dark matter model.","score":32.3,"rank":9,"section":"new","parts":[0.48,0.18,0.24,0.0,0.63],"abstract":"We revisit the scalar, vector, and fermion Higgs-portal dark matter models in the resonant regime without assuming kinetic equilibrium during the freeze-out. We compute the relic abundance by solving the full momentum-dependent Boltzmann equation and compare the results with the standard momentum-averaged treatment. We find that the standard treatment significantly underestimates the relic abundance below the resonance, apart from the fermionic case with a purely scalar portal coupling where the difference is negligible. The deviation from the standard treatment is largest for fermionic models with pseudoscalar interactions, corresponding to factor of 10 in terms of the coupling that reproduces the correct relic abundance. For the scalar and vector cases the corresponding difference is up to a factor of 2. We confront the resulting parameter space with the latest constraints from direct and indirect detection, as well as collider experiments. We find the full momentum-dependent results systematically strengthen the direct detection constraints.","authors":"Giorgio Arcadi, Michele Benaco, Mattia Di Mauro, Sami Nurmi, Kimmo Tuominen","nlinked":33,"nref":33,"src":"INSPIRE","html":true},{"id":"3142500","arxiv":"2604.07481","title":"Axionlike Particles and Lepton Flavor Violation in Muonic Atoms","first":"Kumar","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[582695]]. Closest of your papers: [[2690106]] (coupling 0.03, 5 shared references). Closest network paper: [[2872550]] (coupling 0.16, 21 shared references). Shared topics: lepton flavor violation.","score":29.2,"rank":10,"section":"replacement","parts":[0.45,0.09,0.46,0.0,0.37],"abstract":"We explore the potential of the Mu2e experiment to probe the lepton-flavor-violating process $μ^- e^- \\to e^- e^-$ in a muonic atom within a simplified axion-like particle (ALP) framework featuring flavor-violating $e$-$μ$ couplings and a flavor-diagonal pseudoscalar coupling to electrons, which also allows for possible invisible ALP decays into a dark sector. We compute the ALP-mediated contribution to the transition rate and show that, at fixed couplings, the branching ratio increases for lighter mediators and scales as $(Z-1)^3$, favoring heavier nuclei. We compare the model against constraints from $μ\\to eγ$, $μ\\to 3e$, $μ\\to eγγ$, $μ\\to e+\\mathrm{inv}$, and muonium-antimuonium conversion, as well as from the anomalous magnetic moments of the electron and muon. Additional astrophysical and beam-dump limits on the electron coupling are also discussed. A key result is that $Δa_e$ provides one of the most stringent probes of the parameter space and, in the global scan, excludes the largest fraction of sampled points. After applying the laboratory constraints used in the scan, the viable branching ratio for $μ^- e^- \\to e^- e^-$ in aluminum drops to at most $\\mathcal{O}(10^{-20})$, while the resonant region $2m_e<m_a<m_μ-m_e$ is much more heavily suppressed. The highest achievable values are closely tied to $\\mathcal{B}(μ\\to 3e)$ near its current limit, indicating that the upcoming Mu3e experiment will explore the most promising region relevant for this muonic-atom signal. Our analysis shows that, although a light ALP can parametrically enhance $μ^- e^- \\to e^- e^-$ at fixed couplings, existing bounds -- especially $Δa_e$, $μ\\to 3e$, $μ\\to eγ$, and muonium oscillations -- severely limit the observable rate.","authors":"Girish Kumar, Alexey A. Petrov","nlinked":87,"nref":95,"src":"INSPIRE","html":true},{"id":"3233338","arxiv":"2611.30780","title":"Light on GeV-scale seesaw","first":"Bertuzzo","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1249404]] (coupling 0.04, 7 shared references). Closest network paper: [[2671727]] (coupling 0.16, 19 shared references). Shared topics: seesaw mechanism.","score":28.8,"rank":11,"section":"new","parts":[0.45,0.12,0.45,0.0,0.25],"abstract":"The next generation of beam-dump and accelerator-neutrino experiments will probe GeV-scale sterile neutrinos with unprecedented sensitivity. However, the tiny active-sterile mixing predicted by the minimal seesaw mechanism is expected to remain out of reach. Oscillation data require at least two sterile neutrinos, $N_1$ and $N_2$, which may couple to the photon through a transition dipole. Such a coupling can radically change the picture, both by strongly enhancing sterile-neutrino production and by opening new decay channels. We identify charged-lepton pairs produced by an off-shell photon as the most promising experimental signature. We show that the seesaw band can be probed by the T2K near detector for sterile-neutrino masses $m_N\\lesssim 500$ MeV, and by SHiP for $m_N\\lesssim 5$ GeV. For a sufficiently large dipole, $d\\gtrsim (10~\\mathrm{TeV})^{-1}$, SHiP can selectively measure decay channels that require nonzero active-sterile mixing. This would give rise to a distinctive hierarchy of signatures, providing a direct test of the seesaw mechanism.","authors":"Enrico Bertuzzo, Michele Frigerio, Salvador Urrea","nlinked":49,"nref":51,"src":"INSPIRE","html":true},{"id":"3230948","arxiv":"2611.24241","title":"Search for Heavy Charged Higgs Bosons in Boosted Top and Bottom Quark Final States at a 1.4 TeV Future Lepton Collider","first":"Hashemi","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[822544]]. Also cites widely used network papers: [[902365]]. Closest of your papers: [[1116165]] (coupling 0.05, 2 shared references). Closest network paper: [[1224299]] (coupling 0.10, 10 shared references).","score":26.6,"rank":12,"section":"replacement","parts":[0.48,0.15,0.3,0.0,0.06],"abstract":"The discovery potential for heavy charged Higgs bosons $H^\\pm$ decaying into a top-bottom quark pair is investigated at a future $e^+e^-$ collider operating at $\\sqrt{s}=1.4~\\mathrm{TeV}$. The study considers charged Higgs masses between 200 and 600 GeV within all four Yukawa types of the two-Higgs-doublet model (2HDM). The boosted $tb$ final state is explored using complementary cut-based and machine-learning analyses based on boosted decision trees (BDT). The expected signal significance and sensitivity contours in the $(m_{H^\\pm},\\tanβ)$ plane are obtained for each Yukawa type. The resulting sensitivity extends to regions of the 2HDM parameter space beyond the projected reach of the High-Luminosity LHC (HL-LHC), demonstrating the complementary potential of a future high-energy lepton collider to probe heavy charged Higgs bosons.","authors":"Majid Hashemi","nlinked":51,"nref":54,"src":"INSPIRE","html":true},{"id":"3197882","arxiv":"2608.29259","title":"Fermion mass hierarchies in a three-generation Clifford model","first":"Zhou","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[902365]]. Closest of your papers: [[1116165]] (coupling 0.04, 2 shared references). Closest network paper: [[1255324]] (coupling 0.10, 8 shared references). Shared topics: fermion mass.","score":25.7,"rank":13,"section":"replacement","parts":[0.48,0.11,0.29,0.0,0.12],"abstract":"We examine whether an algebraic model of three fermion generations based on the complex Clifford algebra $\\mathbb C\\ell(10)$, in which an $S_3$ family symmetry relates the generations, can reproduce the observed mass hierarchies of the charged leptons and down quarks. Taking the internal Gram matrix as the fermion kinetic metric, we show that the original Yukawa interaction, with complex coefficients, gives precisely those ordered mass triples $0\\leq m_1\\leq m_2\\leq m_3$ for which $m_3\\leq m_1+2m_2$. This restriction excludes the observed hierarchies in both sectors and persists when the right-acting Higgs operator is allowed to range over the full Clifford algebra. This obstruction motivates a second Yukawa contraction in which a projector, constructed from the difference between an internal charge operator and its family average, acts from the left. The resulting interaction preserves the gauge and family symmetries and uses the same three Higgs doublets. With both contractions present, there is a fixed coupling ratio at which the two successive mass ratios in a single sector become arbitrarily large along a real vacuum path. Separately, a rational interval calculation establishes that one real Higgs vacuum, with different coupling ratios in the two sectors, reproduces the chosen running masses of the charged leptons and down quarks. A softly broken three-doublet potential realises this vacuum as a global minimum at tree level. The additional neutral scalars have flavour-changing couplings, and their exchange at a common mass of $2000\\,\\mathrm{TeV}$ satisfies the neutral-meson mixing criterion and the $μ\\to3e$ contact-interaction test considered here.","authors":"Ye Zhou, Niels Gresnigt","nlinked":49,"nref":60,"src":"INSPIRE","html":true},{"id":"3232191","arxiv":"2611.28211","title":"Revealing Dark Matter in the Dark-Electron Rate of Xenon Detectors","first":"Santos-Olmsted","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[913031]]. Closest of your papers: [[2859009]] (coupling 0.04, 4 shared references). Closest network paper: [[2942451]] (coupling 0.13, 17 shared references).","score":25.5,"rank":14,"section":"new","parts":[0.45,0.11,0.37,0.0,0.07],"abstract":"There is high interest in improving experimental sensitivity to sub-GeV dark matter (DM) that scatters with electrons, as compelling theoretical models seem within reach. At the lowest DM masses, most of the expected signal lies in the single-electron regime, but so do large backgrounds. Xenon experiments therefore either do not yet search there at all or, as in XENONnT, apply cuts so severe that only $\\sim$$10^{-4}$ of the exposure is retained, with sensitivity set by the criterion $S \\lesssim B$, where those are the signal and background counts. We advocate that xenon detectors instead utilize most of their dark-electron rate (i.e., the total raw electron hit rate) and perform an annual-modulation search, for which the sensitivity scales as $S \\lesssim \\sqrt{B}$. Modern DAQs already record this rate, continuously in triggerless systems such as the XENONnT and PandaX-4T DAQs, and within trigger windows in LZ, so no new hardware is required. Using measured dark-electron rates, we estimate the sensitivity of XENONnT, LZ, PandaX-4T, PandaX-xT, and XLZD. We find that dramatic gains in sensitivity are possible, motivating new analyses of present and future xenon data.","authors":"Lillian Santos-Olmsted, Rebecca K. Leane, Carlos Blanco, John F. Beacom","nlinked":87,"nref":98,"src":"INSPIRE","html":true},{"id":"3219528","arxiv":"2610.37318","title":"Precision measurement of coherent elastic neutrino-nucleus scattering at a nuclear reactor by CONUS+","first":"Ackermann","nauth":19,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2513697]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1708009]] (coupling 0.02, 1 shared references). Closest network paper: [[2890702]] (coupling 0.11, 20 shared references).","score":23.5,"rank":15,"section":"replacement","parts":[0.48,0.06,0.32,0.0,0.0],"abstract":"We report the most precise measurement to date of coherent elastic neutrino-nucleus scattering (CE$ν$NS) from reactor antineutrinos, using the CONUS+ germanium detectors at the Leibstadt nuclear power plant. With an exposure of 1296 kg$\\cdot$days reactor-on, a blind likelihood analysis yields a signal with high statistical significance, corresponding to $1565 \\pm 155$ CE$ν$NS events, in agreement with the Standard Model expectation of $1701 \\pm 198$ events within 0.5 $σ$. The flux-averaged cross section is $(0.57 \\pm 0.09)\\times10^{-40}$ cm$^{2}$, and the weak mixing angle at a momentum transfer of about 10 MeV is $\\sin^2θ_W = 0.226 \\pm 0.022$.","authors":"N. Ackermann, H. Bonet, C. Buck, J. Hakenmüller, G. Heusser, M. Lindner, W. Maneschg, M. Meier, S. Mertens, D. Piani, M. Rank, T. Rink, E. Sánchez García, Y. Shi, L. Schönfeld, I. Stalder, H. Strecker, J. Wendel, J. Woenckhaus","nlinked":44,"nref":47,"src":"INSPIRE","html":true},{"id":"3232185","arxiv":"2611.28199","title":"A Transformer-based Method for Neutrino Event Generator Reweighting","first":"Cudd","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2102705]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[2102705]] (coupling 0.07, 12 shared references). Shared topics: neutrino physics.","score":23.3,"rank":16,"section":"cross","parts":[0.48,0.02,0.2,0.0,0.28],"abstract":"The ability to test the effects of different neutrino event generators on simulation-based analyses is currently bottlenecked by the computational cost of propagating simulated events through expensive detector simulations. One way to circumvent this limitation is to reweight events produced with one generator to replicate the predictions of another. However, existing methods for doing this in neutrino physics tend to be limited to only a few observables at a time. We present a transformer-based architecture that can reweight between neutrino event generators based on nearly the entire particle stack, providing reweighted events that are valid over a greatly expanded phase space. We present results with events generated from multiple GENIE configurations and NuWro as examples, and we introduce an energy distance-based metric for evaluating the results in a multidimensional, unbinned manner. Our results show promising performance for realistic applications and provide a method for comparing the performance of different reweighting techniques.","authors":"Andrew Cudd, Roger G. Huang, Benjamin Nachman, Vinicius Mikuni, Callum Wilkinson","nlinked":34,"nref":44,"src":"INSPIRE","html":true},{"id":"3233341","arxiv":"2611.30764","title":"Fate of Vainshtein Screening for UV/IR Mixing with a $P(X)$ Higgs Classicalizer","first":"Berteaux","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[468209]] (coupling 0.02, 3 shared references). Closest network paper: [[1224299]] (coupling 0.04, 8 shared references).","score":19.7,"rank":17,"section":"new","parts":[0.45,0.07,0.13,0.0,0.0],"abstract":"Classicalization is a non-Wilsonian framework in which an effective field theory self-completes above its strong-coupling scale by generating semiclassical objects that decay into many soft quanta, thereby realizing ultraviolet-infrared mixing. A key requirement of this mechanism is that the force carrier be lighter than the strong-coupling scale. A natural application would be to embed classicalization in the electroweak Higgs sector to address the little hierarchy problem. In this work, we investigate whether Higgs classicalization can occur within the $P(X)$ class of gauged k-essence and k-chameleon models. For classicalization to occur, the theory must support Vainshtein screening around a sharply localized source. Our results show that it fails to do so, even when one attempts to engineer a symbiosis with chameleon screening through a gauge kinetic function, owing to a strong-coupling breakdown inside the screening region. These $P(X)$ theories therefore fail to provide a suitable framework for Higgs classicalization. Nevertheless, we emphasize that our results, obtained for a specific class of models, should not be interpreted as a no-go theorem for Higgs classicalization.","authors":"Eléana Berteaux, Florian Nortier","nlinked":116,"nref":116,"src":"INSPIRE","html":true},{"id":"3192747","arxiv":"2608.18949","title":"Three-body forces in the quark model","first":"Baek","nauth":7,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.00, 1 shared references). Closest network paper: [[1710056]] (coupling 0.03, 20 shared references).","score":18.1,"rank":18,"section":"replacement","parts":[0.48,0.0,0.07,0.0,0.0],"abstract":"We review the connection between constituent-quark Hamiltonians and QCD and investigate the long-standing difficulty of describing meson and baryon spectra with one common two-body interaction. A Hamiltonian calibrated to ground-state mesons leaves systematic baryon mass residuals, largest in the light-quark sector and decreasing toward heavier flavors. We show that a short-range, color-spin-dependent connected three-quark interaction substantially reduces this incompatibility. Mass-scaled finite-range profiles yield high-accuracy baryon spectra, whereas flavor-independent common-range profiles do not remove the residual flavor pattern. The result is tested on additional ground-state baryons outside the calibration set and through meson--baryon compatibility analyses across several alternative quark-model Hamiltonians. We also benchmark radial and orbital excitations to identify the regime in which a static compact valence Hamiltonian remains reliable, and provide explicit color-spin matrix elements for two- and three-body operators in baryons and multiquark configurations. Within the tested valence-space representations, the results indicate that a mass-dependent short-range connected three-quark interaction provides the missing contribution required for a consistent simultaneous description of meson and baryon ground-state spectra.","authors":"Jongheon Baek, Aaron Park, Emiko Hiyama, Sungsik Noh, Hyeongock Yun, Kyong Chol Han, Su Houng Lee","nlinked":351,"nref":395,"src":"INSPIRE","html":true},{"id":"3233360","arxiv":"2611.31130","title":"The Sensitivity of Gamma-Ray Searches for Dark Matter Annihilation in Milky Way Dwarf Galaxies: the LSST Era and Beyond","first":"Chavez","nauth":6,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1421624]] (coupling 0.10, 13 shared references). Closest network paper: [[2674992]] (coupling 0.17, 10 shared references). Shared topics: indirect detection.","score":17.9,"rank":19,"section":"cross","parts":[0.0,0.25,0.5,0.0,0.29],"abstract":"We forecast the sensitivity of gamma-ray searches to dark matter annihilation in Milky Way satellite dwarf galaxies using BabyBison, a Monte Carlo pipeline combining cosmological satellite simulations and observational selection functions with a joint likelihood analysis of gamma-ray data. Although LSST is expected to substantially expand the catalog of known satellite galaxies, we find that these discoveries are likely to produce only modest improvements in the resulting dark matter annihilation constraints, typically below 20\\%. Much more substantial gains are possible, however, in relatively rare realizations that contain yet-to-be-discovered satellites with large $J$-factors. These results reinforce the fact that indirect detection analyses using the population of dwarf galaxies are typically driven in large part by a small number of high-$J$-factor systems rather than by the total satellite count. We present projections for the sensitivity of Fermi-LAT and the proposed Advanced Particle-astrophysics Telescope (APT) to dark matter annihilation, finding that a complete census of the Milky Way dwarf sample could enable such instruments to probe dark matter with masses up to the TeV scale. We also investigate the dark matter discovery potential of these instruments and project their ability to measure the properties of an annihilating dark matter particle.","authors":"Ilumi Chavez, Aditya Ghosh, Chris Kelso, Dan Hooper, Alex Drlica-Wagner, Ethan O. Nadler","nlinked":60,"nref":83,"src":"INSPIRE","html":true},{"id":"3233334","arxiv":"2611.30877","title":"Unbinned Likelihoods for Probability Densities with Poles","first":"Reboud","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[2963992]] (coupling 0.03, 3 shared references).","score":17.3,"rank":20,"section":"cross","parts":[0.45,0.0,0.1,0.0,0.0],"abstract":"Unbinned likelihood fits to detector-level data become prohibitively expensive when narrow resonances interfere with a nonresonant amplitude. The convolution of the truth-level probability density with the detector resolution must then resolve the resonances, whose widths are much smaller than the resolution. We propose a simple approach that subtracts one simple-pole term per resonance from the probability density. This term captures the resonant contribution in closed form, and the smooth remainder is convolved numerically on a grid whose spacing is set by the resolution alone. The approach applies to multidimensional densities and to densities known only on the real axis. Using two benchmark problems, we quantify the accuracy, computational cost, and statistical impact of the approach. We emphasise that the subtraction is a general approach to the computational problems of unbinned likelihoods in the presence of poles in their probability density and that it is applicable to a wide variety of problems in experimental particle physics.","authors":"Méril Reboud, Danny van Dyk, Matteo Verzeletti","nlinked":30,"nref":42,"src":"INSPIRE","html":true},{"id":"3177552","arxiv":"2607.04679","title":"Possibility of the antibottom-strange molecular pentaquarks near $ BΣ$ and $ B^*Σ$ thresholds","first":"Zhao","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[2817040]] (coupling 0.03, 28 shared references).","score":17.0,"rank":21,"section":"replacement","parts":[0.45,0.0,0.08,0.0,0.0],"abstract":"The molecular states in coupled channel system of $B_s^0N- BΛ- B^*Λ- BΣ- B^*Σ$ are investigated within one-boson-exchange model that includes $S$-$D$ wave mixing and a tunable short-range $δ(r)$ term. Bound, resonant, and virtual states are searched by analytically continuing the $S$ matrix in the complex energy plane. In the single-channel analysis, the $ BΣ$ and $ B^*Σ$ systems with $J^P=1/2^-$ and $3/2^-$ are found to be attractive and form three bound states with reasonable cutoff region, corresponding to $1/2^-( BΣ)$, $1/2^-( B^*Σ)$, and $3/2^-( B^*Σ)$ . When coupled-channel dynamics is included, these states evolve into near-threshold poles that produce enhancements in the $B_s^0N$, $ BΛ$, and $ B^*Λ$ invariant mass spectra. The pole below the $ B^*Σ$ threshold in the $J^P=1/2^-$ system depends strongly on the treatment of the short-range $δ(r)$ term and becomes a virtual state when this contribution is removed, while the other two resonant poles and their line shapes are only moderately affected. The influences of $B^{(*)}Σ^*$ channels on these states are also investigated. For representative parameter region, the predicted masses of these states lie in the $6.44-6.70$ GeV region and have widths of a few to several MeV. The pole coupling and partial-width analyses indicate that the invariant mass spectrum of the $B_s^0N$ and $ B^{(*)}Λ$ channels are the best place to hunt the predicted states. These results support the existence of near-threshold molecular pentaquark $P_{ \\bar b s}$ and provide useful guidance in future experimental searches.","authors":"Jian-Kang Zhao, Nijiati Yalikun","nlinked":78,"nref":83,"src":"INSPIRE","html":true},{"id":"3232229","arxiv":"2611.29072","title":"A billion colour states: exact soft-gluon evolution beyond leading colour for many-jet QCD","first":"Chargeishvili","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1710078]]. Closest network paper: [[1866947]] (coupling 0.02, 5 shared references).","score":16.8,"rank":22,"section":"new","parts":[0.45,0.0,0.07,0.0,0.0],"abstract":"We present a new method, and its implementation, for constructing orthogonal colour bases and computing colour factors for any process with quarks, antiquarks and gluons, and use it to compute one-loop soft-gluon evolution exactly in full colour, keeping all colour interference. Each basis vector is labelled, independently of $N_c$, by the sequence of colour representations that appear when the partons are coupled one at a time. We derive a closed formula for the norms of the basis vectors, and colour operators act only on the part of a label between the partons involved, through small tables. Basis vectors can therefore be generated and used one at a time, without listing the complete basis: norms and matrix elements of single basis vectors are obtained for $10^4$ gluons in seconds. The same locality lets the soft anomalous dimension act on colour states without being stored. This allows optimised implementations on CPUs and GPUs, with which we evolve colour states exactly for up to fourteen gluons on a single GPU and for fifteen gluons, a colour space of $827\\,888\\,726$ dimensions, on a single compute node. We validate the basis and the evolution against independent codes and published results for processes with few partons, the only ones for which such results are available. We then measure the accuracy of leading colour as a function of the number of partons. For exclusive jet rates with a veto on soft radiation outside the jets, at a ratio of about 14 between the hard and the veto scale, leading colour overestimates the full-colour result by a median factor of 1.3 for eight partons, 1.8 for ten and 6.6 for fourteen. Pairs of hard jets are in a colour singlet with probabilities of several per cent, which vanish at leading colour. The formal $1/N_c^2$ suppression of subleading colour therefore does not make it small for many-jet final states.","authors":"Bakar Chargeishvili","nlinked":156,"nref":183,"src":"INSPIRE","html":true},{"id":"3232226","arxiv":"2611.28492","title":"Timelike electric dipole form factors of the baryon octet: short-distance kernels and baryonic rescattering","first":"Geng","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3178456]] (coupling 0.02, 1 shared references).","score":16.6,"rank":23,"section":"new","parts":[0.45,0.0,0.06,0.0,0.0],"abstract":"We calculate the leading-twist contribution of quark electric dipole moments (EDMs) to the timelike form factors of the baryon octet at the $J/ψ$ mass using lattice light-cone distribution amplitudes. For a strange-quark EDM $d_s$, the short-distance $Σ/Λ$ ratio is $-0.080^{+0.037}_{-0.098}$ over the lattice input ranges. This range lies above the nonrelativistic quark-model value $-1/3$. In the meson-exchange model, kaon exchange feeds the large $Ξ$ source into the $Σ$ channel and makes the $Σ$ and $Λ$ form factors comparable in magnitude. The short-distance $Λ$ form factor is about $5\\times10^{-4}d_s$. The BESIII measurement then gives $|d_s|<1.3\\times10^{-15}\\,e\\,\\mathrm{cm}$ at 95% confidence level. With rescattering at a $1\\,\\mathrm{GeV}$ cutoff, joint fits to projected $Λ$, $Σ^+$ and $Ξ$ sensitivities lower the $Λ$-only upper limits by more than 25% at BESIII and the Super Tau-Charm Facility. Renormalization-scale variation changes the projected limits by about a factor of two.","authors":"Chao-Qiang Geng, Xiang-Nan Jin, Chia-Wei Liu","nlinked":60,"nref":61,"src":"INSPIRE","html":true},{"id":"3232365","arxiv":"2611.29717","title":"Magic Production and the Fundamental Forces of Nature","first":"Chen","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3227657]] (coupling 0.02, 1 shared references).","score":16.6,"rank":24,"section":"new","parts":[0.45,0.0,0.05,0.0,0.0],"abstract":"Quantum magic is a resource for universal quantum computation and may also provide a probe of fundamental interactions. We study its production in forward scattering of two distinct Standard Model fermions in the chirality basis. In the single-mediator-exchange approximation, magic production vanishes for gluon, photon, W-boson, Higgs-boson, and graviton exchange. For Z-boson exchange in purely leptonic scattering, it also vanishes at $\\sin^2θ_W = 1/4$, close to the phenomenological value. By contrast, Z-boson exchange involving elementary quarks generally produces nonzero magic. These patterns raise the question of whether the construction of the fundamental forces encodes, at least in some channels, a tendency to suppress magic production.","authors":"Jiunn-Wei Chen, Yu-Hao Li","nlinked":29,"nref":30,"src":"INSPIRE","html":true},{"id":"3232291","arxiv":"2611.28691","title":"Study of the $N^*(1535)$ and $N^*(1650)$ resonances from $πN$ $S_{11}$ scattering data and lattice QCD spectra","first":"Li","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3227657]] (coupling 0.01, 1 shared references).","score":16.4,"rank":25,"section":"new","parts":[0.45,0.0,0.04,0.0,0.0],"abstract":"We investigate two of the lowest-lying odd-parity nucleon resonances, $N^*(1535)$ and $N^*(1650)$, within a nonperturbative Hamiltonian framework (NPHF). The coupled-channel model contains two three-quark bare states with total quark spins $1/2$ and $3/2$, together with four meson-baryon channels: $πN$, $ηN$, $KΛ$, and $KΣ$. Constraints from SU(3) flavor symmetry and the bare-state spin wave functions are imposed on the bare-state-channel vertices and the channel-channel Weinberg-Tomozawa interactions. This substantially reduces the number of free parameters. We combine fits to infinite-volume $πN$ $S_{11}$ scattering data with finite-volume lattice QCD spectra. We use Hamiltonian eigenvectors to analyze the model-basis compositions. A contamination function then compares the resulting operator-mixing pattern with lattice correlation-matrix eigenvectors. Within the scenarios considered, both bare states and coupled-channel interactions play important roles in describing the two resonances. From our combined infinite and finite volume analysis, in contrast to conventional quark-model expectations, the spin-$1/2$ bare state is heavier than the spin-$3/2$ bare state. The contamination analysis is consistent with the associated operator assignment and with a recent analysis of the relativistic wavefunctions associated with these states. The symmetry-constrained NPHF provides a unified description of the two $S_{11}$ resonances. The combined analysis also constrains their model interpretation.","authors":"Zhi-Xuan Li, Derek B. Leinweber, Anthony W. Thomas, Jia-Jun Wu","nlinked":51,"nref":52,"src":"INSPIRE","html":false},{"id":"3232073","arxiv":"2611.28194","title":"HEP-Ex-Bench: Evaluating Agentic Performance in High Energy Physics Experiment Data Analyses with Sealed Worlds","first":"Novák","nauth":10,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[1494411]]. Closest of your papers: [[1615477]] (coupling 0.04, 3 shared references). Closest network paper: [[2812533]] (coupling 0.15, 10 shared references).","score":12.4,"rank":26,"section":"cross","parts":[0.06,0.13,0.44,0.0,0.0],"abstract":"Agentic systems are increasingly being explored for automating experimental high-energy physics measurements, but the correctness of their results can today be reliably evaluated only via extensive expert review. To address this, we propose a method to perform detailed quantitative evaluations of agent-driven analyses through the use of blind analysis and injection tests, which are critical in a typical expert review. Agents develop a data analysis pipeline on a public dataset, while the evaluation is performed on programmatically generated sealed private datasets where signals are injected and simulation settings varied within realistic detector uncertainties. By requiring agents to provide a single workflow that is evaluated across these \"sealed worlds\", we are able to test the accuracy and robustness of the workflows. We demonstrate the approach on four tasks built from CMS open data and present it as a way to reliably benchmark scientific work in experimental high-energy physics. At the time of writing, the best-performing model, Gemini 4 Argon, reaches 60% of the score of the expert reference analyses on average, ahead of GPT 6 Astra at 38% and Claude Opus 5.5 at 31%. In individual sessions on one of the tasks, Gemini 4 Argon exceeds the reference. The benchmark is hosted at https://hep-ex-bench.github.io","authors":"Andrzej Novák, Yiyang Zhao, Dolores Garcia, Eric A. Moreno, Jeffrey Krupa, Víctor Bresó-Pla, Samuel Bright-Thonney, Lukas Heinrich, Michael Kagan, Philip Harris","nlinked":41,"nref":75,"src":"INSPIRE","html":true},{"id":"3174545","arxiv":"2606.28717","title":"Chirality Observables in Vector-Like Lepton Doublet Pair Production with Polarized Beams at a 3 TeV Lepton Collider","first":"Sagheer","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1455793]] (coupling 0.07, 5 shared references). Closest network paper: [[2710594]] (coupling 0.11, 6 shared references).","score":12.2,"rank":27,"section":"replacement","parts":[0.06,0.19,0.3,0.0,0.0],"abstract":"We study how pair production of a mass-degenerate weak-isodoublet vector-like lepton (VLL) depends on longitudinal beam polarization at the 3~TeV Compact Linear Collider (CLIC), for VLL masses of 1.1--1.4~TeV and mixing in the tau sector. The charged pair $e^+e^-\\toτ'\\barτ'$ proceeds through photon and $Z$ exchange, the neutral pair $e^+e^-\\toν'\\barν'$ through $Z$ exchange alone. For the baseline electron polarization $P_{e^-}=-0.8$, the tree-level rates at $\\mvll=1.2$~TeV are 15.77~fb (charged) and 4.75~fb (neutral). For an optional positron polarization $P_{e^+}=+0.3$, the left--right configuration $(-0.8,+0.3)$ raises the two rates by factors of 1.95 and 1.38 relative to unpolarized beams. The charged--neutral rate contrast reaches $D_σ=0.546$ there, compared with $0.08$ for the opposite configuration, and the observed left--right asymmetries are 0.57 (charged) and 0.12 (neutral). These normalized quantities are independent of the VLL mass at Born level because both channels share the same phase-space factor. Unpolarized rates at a 3~TeV muon collider coincide with the unpolarized CLIC rates to within 0.2\\%, as expected from lepton universality. A counting estimate gives a Gaussian separation of the two asymmetries of $Z_A\\simeq9$ for a visible fraction of $10^{-1}$ and $Z_A\\simeq2.7$--$2.9$ for $10^{-2}$ at $1~{\\rm ab}^{-1}$. All results are tree-level, fixed-energy, production-level quantities; initial-state radiation, beamstrahlung, detector effects and backgrounds are not included, and no exclusion or discovery reach is claimed.","authors":"Haroon Sagheer, Ijaz Ahmed, Jamil Muhammad","nlinked":27,"nref":28,"src":"INSPIRE","html":true},{"id":"3220170","arxiv":"2610.38531","title":"Inelastic Kinetic Decoupling in WIMP Leptogenesis: A Minimal $Z_4$ Model","first":"Liu","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[2859009]] (coupling 0.04, 4 shared references). Closest network paper: [[2628411]] (coupling 0.08, 8 shared references). Shared topics: indirect detection, relic abundance.","score":11.4,"rank":28,"section":"replacement","parts":[0.0,0.11,0.23,0.0,0.45],"abstract":"We study a minimal $Z_4$-symmetric extension of the Standard Model in which a singlet Dirac fermion $χ$ constitutes dark matter, whose annihilations generate a lepton asymmetry through WIMP leptogenesis. Kinetic equilibrium is maintained mainly by the inelastic conversion $χL\\leftrightarrow\\barχΨ$. Compared with the near elastic regime, a sizable mass gap suppresses the conversion rate more rapidly as the Universe cools. This naturally drives kinetic decoupling to earlier times, even away from resonance. Starting from the full inelastic collision operator, we derive an effective momentum transfer rate for kinetic decoupling. We then solve the coupled Boltzmann equations for the dark matter abundance, its temperature $T_χ$, and the $B-L$ asymmetry. Early kinetic decoupling can significantly modify the relic abundance, although near resonance this modification can be reduced by annihilation-induced heating. The $B-L$ asymmetry can be affected when asymmetry production overlaps with a substantial departure from kinetic equilibrium. In our scan, the largest deviations occur mainly for $x_{\\rm lep}\\gtrsim x_{\\rm cd}$. After imposing our constraints, asymmetry production typically ends before chemical decoupling, leaving the final asymmetry essentially unchanged. For indirect detection, we generate the photon spectrum with Pythia and evaluate the Fermi-LAT dwarf spheroidal likelihood.","authors":"An Liu, Hong-Hao Zhang","nlinked":57,"nref":62,"src":"INSPIRE","html":true},{"id":"2859009","arxiv":"2412.08700","title":"Effective field theory and scalar triplet dark matter","first":"Arbeláez","nauth":5,"year":2024,"cites":0,"role":"seed","note":"","score":null},{"id":"1615477","arxiv":"1708.03007","title":"Expanding the Reach of Heavy Neutrino Searches at the LHC","first":"Flórez","nauth":5,"year":2017,"cites":27,"role":"seed","note":"","score":null},{"id":"3162378","arxiv":"2605.29031","title":"Twilight of the WIMP: Comprehensive Phenomenology of Electroweak Triplet Dark Matter","first":"Gaurav","nauth":4,"year":2026,"cites":1,"role":"other","note":"","score":null},{"id":"1493855","arxiv":"1610.06587","title":"A Call for New Physics : The Muon Anomalous Magnetic Moment and Lepton Flavor Violation","first":"Lindner","nauth":3,"year":2016,"cites":574,"role":"other","note":"","score":null},{"id":"3088651","arxiv":"2512.02854","title":"From Dark Sectors to the Axion-Neutrino Connection","first":"Câmara","nauth":1,"year":2025,"cites":0,"role":"other","note":"","score":null},{"id":"2962467","arxiv":"2508.14726","title":"Scrutinizing fermionic Dark Matter in scotogenic model with low reheating temperature","first":"Roy","nauth"
