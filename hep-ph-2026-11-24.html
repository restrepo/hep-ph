+\\ell^-$ where $\\ell=e, μ$ and $H_{1,2}$ are hadrons. The soft and/or collinear divergences are regulated in a gauge-invariant manner and demonstrably cancel, leaving behind a finite residue that depends on the (infrared) momentum cutoff below which a photon is considered to be indistinguishable. On resumming, the said sensitivity reduces drastically, {\\em i.e.}, for the NLL result as compared to the NLO one. The overall correction is negative and its magnitude is larger for a lighter lepton. The corrections are presented for $B\\to K^{(*)}$ and, for the first time, for $Λ_b\\toΛ^{(*)}$ decays. Given that QED final-state radiation is routinely incorporated in experimental Monte Carlo simulations, for example through PHOTOS, our results provide an important theoretical framework for assessing the accuracy and limitations of these simulations and their impact on LFU observables such as $R_{K^{(*)}}$."},{"arxiv":"2611.29197","id":"3232234","title":"Quantifying the Impact of Galactic Dark Matter Halo Models on LZ Results","authors":"Jialiang Shao, Andrea Addazi, Xinran Wang, Guanwen Fang, Yi-Fu Cai","score":9.8,"section":"new","rank":30,"parts":[0.0,0.18,0.24,0.0,0.07],"note":"Closest of your papers: [[2080612]] (coupling 0.06, 6 shared references). Closest network paper: [[1851133]] (coupling 0.08, 7 shared references).","abstract":"Most dark matter direct-detection limits are reported under the assumption of an isotropic, Maxwellian Standard Halo Model. However, the Milky Way's stellar halo exhibits substantial radial anisotropy, while cosmological simulations predict scale-dependent anisotropy in the dark matter velocity distribution. We investigate how departures from isotropy affect the interpretation of LZ results in two complementary regimes: background-dominated elastic-scattering searches and the recently reported 248 keV nuclear-recoil candidate, which we study using a background-free single-event approximation. For elastic scattering, we use the self-consistent isotropic, Osipkov-Merritt, axisymmetric, and triaxial halo models of Belli et al. and translate the published limits through the ratio of predicted event counts, applying a common escape-speed truncation in the Galactic frame. At WIMP masses above approximately 40 GeV, the resulting limits lie within about $\\pm 30\\%$ of the isotropic reference. Below approximately 15 GeV, the model envelope broadens to as much as an order of magnitude, reflecting sensitivity to the high-velocity tail. For the 248 keV event, the accessible inelastic mass splitting is likewise controlled by this tail. Some anisotropic models extend the allowed kinematic region towards splittings at which solar-neutrino constraints on a Higgsino interpretation become ineffective, although kinematic accessibility alone does not establish viability at the fixed Higgsino cross section. These results show that halo-model dependence is modest at high WIMP masses but becomes essential near kinematic thresholds."},{"arxiv":"2611.28630","id":"3232233","title":"Strong First-Order Phase Transition in a Pseudo-Nambu-Goldstone Boson Model","authors":"Yuichiro Nakai, Masanori Tanaka, Yaoduo Wang","score":8.8,"section":"new","rank":31,"parts":[0.0,0.09,0.4,0.0,0.0],"note":"Closest of your papers: [[1854224]] (coupling 0.04, 2 shared references). Closest network paper: [[2969254]] (coupling 0.14, 12 shared references).","abstract":"We propose a novel, calculable model for realizing strong first-order phase transitions in the early Universe, in which the phase transition occurs along a pseudo-Nambu-Goldstone boson (pNGB) direction. The model involves two scalar fields whose interactions exhibit collective symmetry breaking, protecting the pNGB potential from quadratically divergent radiative corrections induced by these interactions. This structure allows strong first-order phase transitions to be realized without severe parameter tuning while maintaining perturbative control. We investigate the finite-temperature effective potential and bubble nucleation dynamics, identifying parameter regions where strong first-order phase transitions can successfully complete. The strength and characteristic time scale of the transitions are evaluated, and the resulting gravitational-wave (GW) spectra are computed. The predicted GW signals can fall within the sensitivity ranges of planned GW experiments."},{"arxiv":"2611.30098","id":"3232396","title":"Plasma-enabled magnet-free LSW search for eV-scale axions with laser-stimulated regeneration","authors":"Xiangyan An, Min Chen, Yipeng Wu, Boyuan Li, Wenchao Yan, Peng Yuan, Binbin Yan, Feng Liu, Zhengming Sheng, Jie Zhang","score":8.6,"section":"new","rank":32,"parts":[0.0,0.16,0.25,0.0,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.06, 4 shared references). Closest network paper: [[1944631]] (coupling 0.09, 13 shared references).","abstract":"In conventional light-shining-through-a-wall (LSW) experiments, strong magnetic fields mediate the conversion of photons into axions and their subsequent reconversion into photons. At eV-scale axion masses, however, photon--axion phase mismatch causes these conversions to lose coherence, substantially reducing the experimental sensitivity. We propose a magnet-free LSW scheme that addresses this limitation via plasma-based axion generation and laser-stimulated regeneration. At low laser intensity, a two-color dispersion-matched source generates axions in a narrow mass range set by the plasma dispersion. At relativistic laser intensity, a single-pulse plasma-broadened source generates axions over a broad mass range, as shown by particle-in-cell simulations. The Fourier spectrum of the source term $\\mathbf{E}\\cdot\\mathbf{B}$ broadens around the laser branch, consistent with mixing between the laser and low-frequency plasma waves. For axion detection behind the wall, a counter-propagating laser stimulates axion decay into a detectable signal photon and a second photon emitted into the laser mode, with the laser frequency chosen to satisfy phase matching. For representative parameters, the requirement of at least one regenerated photon yields projected upper limits on the axion-photon coupling on the order $10^{-7}\\,\\mathrm{GeV}^{-1}$ over $m_a=0.1$--$1\\,\\mathrm{eV}$."},{"arxiv":"2311.12158","id":"2724864","title":"The Chiral Lagrangian of CP-Violating Axion-Like Particles","authors":"Luca Di Luzio, Gabriele Levati, Paride Paradisi","score":8.6,"section":"replacement","rank":33,"parts":[0.0,0.14,0.3,0.0,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.05, 5 shared references). Closest network paper: [[2654052]] (coupling 0.10, 16 shared references).","abstract":"We discuss the construction of the most general CP-violating chiral Lagrangian for an axion-like particle (ALP). Starting with an effective Lagrangian containing light quarks and gluons, we provide its matching onto a chiral effective Lagrangian at $\\mathcal{O}(p^2)$ described in terms of mesons and baryons, identifying the correspondence between the Jarlskog invariants of the two theories. After deriving the ALP interactions with mesons and baryons, we analyse a few relevant phenomenological implications such as the permanent electric dipole moments of nucleons and the CP-violating ALP and kaon decays.This work provides the necessary tools for further phenomenological analyses connecting low-energy observables with the couplings of the underlying ultraviolet complete theory."},{"arxiv":"2611.28054","id":"3232175","title":"Early Evolution of Strange Quark Stars Admixed with Fermionic Dark Matter","authors":"Rajasmita Sahoo, Mrutunjaya Bhuyan","score":8.5,"section":"cross","rank":34,"parts":[0.06,0.11,0.14,0.0,0.09],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1746620]] (coupling 0.04, 6 shared references). Closest network paper: [[1844771]] (coupling 0.05, 5 shared references).","abstract":"We study strange quark stars admixed with fermionic dark matter (DM) in three quasistatic stages of their early evolution: the neutrino-trapped stage, the heated stage after deleptonization, and the cold stage. Quark matter is described by the MIT bag model at finite temperature with thermal gluons, a repulsive vector interaction, and, in the first stage, trapped neutrinos. The DM is modeled as a cold, asymmetric gas of fermions with masses $m_χ= 0.3$, $1$, and $3$ GeV, with and without a repulsive self-interaction, and interacts with the quark matter only through gravity. Using the two-fluid Tolman-Oppenheimer-Volkoff equations, we compute the structure, the maximum masses, and the tidal deformability of the stars in each stage for DM mass fractions $F_D$ up to $5\\%$, and we follow individual stars at fixed numbers of baryons and DM particles. The effect of DM is nearly the same in the three stages: for $m_χ= 1$ GeV and $F_D = 5\\%$, DM lowers the maximum mass by about $8\\%$ and the tidal deformability of a $1.4\\,M_\\odot$ star by about $26\\%$ in each stage, whereas the stage itself changes these quantities by only a few percent. Heavy DM forms a compact core; for $m_χ= 3$ GeV without self-interaction, the mass limit of this core can set the maximum mass of the star. Light DM can form an extended halo, which does not increase the maximum mass for the fractions considered. For $m_χ= 1$ GeV and $F_D = 5\\%$, DM lowers the largest baryon mass of a newborn star by about $0.23\\,M_\\odot$, but this limit increases from the neutrino-trapped to the cold stage in all cases considered, so that DM does not cause a delayed collapse to a black hole. In our model, pulsars of about $2\\,M_\\odot$ require a stiff quark equation of state and restrict the DM fraction to a few percent unless the DM is light."},{"arxiv":"2610.27346","id":"3216856","title":"Pretraining on boosted boson decays for polarization tagging of hadronic $W$ bosons","authors":"Saptaparna Bhattacharya","score":7.9,"section":"replacement","rank":35,"parts":[0.0,0.09,0.36,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.03, 4 shared references). Closest network paper: [[1866947]] (coupling 0.13, 15 shared references).","abstract":"Longitudinally polarized weak bosons probe the unitarization of vector-boson scattering. At large boosts, longitudinal and transverse $W$ bosons produce jets with the same mass and two-prong structure, distinguished only by the decay angle. Longitudinal bosons are rare in $W$+jet events at these large boosts. We ask where the polarization information of a boosted $W$ boson lies and how much a tagger can recover. Requiring both decay quarks within the jet truncates the decay-angle distribution at an edge set by $m/(p_T R)$, which, as we show, bounds any hadronic polarization tagger. Within this acceptance, the decay angle carries nearly all the polarization information of a jet in $W$+jet events. Whether pretraining retains the decay angle is not obvious, so we pretrain a point-edge transformer on $10^7$ unpolarized boosted-boson, top-quark and QCD jets and fine-tune it with $10^3$ to $5\\times10^4$ labeled jets per class. With the fewest labels, a boosted decision tree on substructure observables performs best; with the most labels, the strongest networks come within 0.003 in AUC of the ideal decay-angle tagger. Pretraining saves a factor of about two to three in labels, and our boson pretraining improves on a generic one by a few thousandths in AUC, more with frozen transformer blocks. Student networks with a few hundred times fewer parameters, distilled with unlabeled jets, match their teacher. More information lies outside the jet. The production angle, reconstructed with the recoiling jet, improves every tagger. In diboson production and vector-boson scattering at matrix-element level, the production kinematics carry more information than the decay angles of both bosons. Trading the generality of a jet tagger for an event-level tagger trained on the process thus brings large gains, which measurements of longitudinal vector-boson scattering could exploit."},{"arxiv":"2611.28742","id":"3232274","title":"Evolution and Prospects of Higgs Boson Searches Beyond the Standard Model","authors":"Andre Sopczak","score":7.7,"section":"new","rank":36,"parts":[0.06,0.1,0.18,0.0,0.0],"note":"Also cites widely used network papers: [[1494411]]. Closest of your papers: [[783258]] (coupling 0.03, 2 shared references). Closest network paper: [[2775441]] (coupling 0.06, 10 shared references).","abstract":"The search for Higgs bosons Beyond the Standard Model (BSM) began intensively at the Large Electron-Positron (LEP) collider (1989-2000), continued at the Tevatron (2001-2011), and entered a new era with the start of the Large Hadron Collider (LHC) in 2010. While the discovery of a Higgs boson in 2012 established the Standard Model mechanism of electroweak symmetry breaking, it also opened a wide landscape of open questions that motivate ongoing BSM Higgs searches. This review traces the evolution of these searches across experiments, highlighting both experimental techniques and underlying theoretical ideas in an accessible manner. Emphasis is placed on how different collider environments shaped search strategies and how seemingly subtle experimental effects, such as small excesses, non-standard decay topologies, or suppressed couplings, can provide insight into the possible structure of extended Higgs sectors. By connecting historical developments with current analyses and future prospects, this article aims not only to summarise results but also to provide students and newcomers with intuitive insight into how Higgs searches are designed, interpreted, and continuously refined. It illustrates how experimental challenges translate into physics opportunities, thereby inviting the next generation of researchers to contribute to one of the central questions in particle physics: whether the Higgs sector is minimal or part of a more complex structure."},{"arxiv":"2608.24791","id":"3195704","title":"Probing Dirac Dark Matter in Composite Higgs Models with Xenon and Argon targets","authors":"M. G. Belyakova, R. Nevzorov","score":7.6,"section":"replacement","rank":37,"parts":[0.0,0.04,0.14,0.0,0.43],"note":"Closest of your papers: [[2859009]] (coupling 0.02, 2 shared references). Closest network paper: [[3133857]] (coupling 0.05, 6 shared references). Shared topics: relic abundance, direct detection.","abstract":"Recent advancements in direct detection (DD) experiments stimulate the investigation of the interactions of dark matter (DM) with nucleons and nuclei. In the framework of Composite Higgs Models (CHMs) the lightest Dirac composite particle (LDCP) can be stable composing a significant fraction ξof the observed DM relic abundance. We consider the elastic scattering of the LDCP on nucleons as well as on xenon (Xe) and argon (Ar) nuclei within the CHMs in which the LDCP magnetic moment, its mass and its coupling to the Higgs doublet are suppressed by an approximate U(1) symmetry. The LDCP with non-zero magnetic dipole moment can result in a substantial enhancement of the differential event rate in the DD experiments at low recoil energies of nuclei. Assuming ξ\\ge 0.1, we identify the region of the parameter space where such enhancement may be potentially observable. In addition we specify some observables that can be useful in discriminating between the DM fermions with non-zero magnetic moment and other types of dark matter particles which don't have similar electromagnetic properties."},{"arxiv":"2005.13341","id":"1798033","title":"Precise predictions for double-Higgs production via vector-boson fusion","authors":"Frédéric A. Dreyer, Alexander Karlberg, Jean-Nicolas Lang, Mathieu Pellen","score":7.4,"section":"replacement","rank":38,"parts":[0.06,0.04,0.28,0.0,0.0],"note":"Also cites widely used network papers: [[1494411]]. Closest of your papers: [[1455793]] (coupling 0.01, 2 shared references). Closest network paper: [[1866947]] (coupling 0.10, 14 shared references).","abstract":"Theoretical predictions with next-to-next-to-leading order (NNLO) QCD accuracy combined with the next-to-leading order (NLO) electroweak (EW) corrections are presented for differential observables of the double-Higgs production process via vector-boson fusion. While the QCD corrections were previously known, the EW ones are computed here for the first time. The numerical results are obtained for a realistic experimental set-up at the LHC and are presented in the form of fiducial cross sections and differential distributions. Within this setup we find that the VBF approximation employed in the NNLO QCD correction is accurate at the sub-percent level. We find that the NLO EW corrections within the fiducial volume are $-4.8\\%$, making them of almost the same order as the NLO QCD corrections. In some kinematic regions they can grow as large as $-30\\%$ making them the dominant radiative corrections. When the EW corrections are combined with the NNLO QCD corrections we find a total correction of $-14.8\\%$. The results presented here thus comprise the state-of-the-art theoretical predicition for the double-Higgs production via vector-boson fusion, which will be of value to the high-luminosity programme at the LHC."},{"arxiv":"2511.22949","id":"3232885","title":"Solving the Domain Wall Problem: Primordial Magnetic Fields as a Dynamical Solution","authors":"Zizhuo Zhao, Yuefeng Di, Ligong Bian, Jing Shu","score":6.7,"section":"replacement","rank":39,"parts":[0.0,0.1,0.19,0.0,0.07],"note":"Closest of your papers: [[1607572]] (coupling 0.04, 4 shared references). Closest network paper: [[2860403]] (coupling 0.07, 10 shared references).","abstract":"To prevent overclosing the Universe, stable domain walls must decay-a problem typically addressed by breaking the Peccei-Quinn symmetry with a bias term. In this Letter, we present a novel mechanism in which a helical primordial magnetic field provides a spatially inhomogeneous Chern-Simons source that drives the axion field. We validate this mechanism through three-dimensional lattice simulations of the evolving domain-wall network, demonstrating its efficacy in inducing decay. Our quantitative analysis reveals that the correlation length of the primordial magnetic field is a crucial determinant of the decay rate of the network and the properties of the emitted axions and gravitational waves. In particular, the axion emitted from the decaying domain-wall network can contribute to the dark matter abundance, and the associated gravitational-wave signal lies in the frequency range probed by pulsar timing array experiments."},{"arxiv":"2606.16754","id":"3168717","title":"Modern Determination of Pion and Kaon Fragmentation Functions from SIA and High-Precision COMPASS SIDIS Multiplicities","authors":" HAPS Collaboration, Maryam Soleymaninia, Hamzeh Khanpour, Hubert Spiesberger, Majid Azizi, Michael Klasen, Hadi Hashamipour","score":6.6,"section":"replacement","rank":40,"parts":[0.0,0.0,0.11,0.5,0.0],"note":"Co-authors of yours: Klasen. Closest network paper: [[2817040]] (coupling 0.04, 36 shared references).","abstract":"We present two separate determinations of charged-pion and charged-kaon fragmentation functions (FFs), denoted HAPS-PiFF1.0 and HAPS-KaFF1.0, at next-to-leading order (NLO) and within a next-to-next-to-leading-order (NNLO) perturbative QCD setup. The analysis combines single-inclusive electron-positron annihilation (SIA) data with charge-separated semi-inclusive deep-inelastic-scattering (SIDIS) multiplicities from HERMES and COMPASS. A central goal of this work is to incorporate the modern COMPASS SIDIS input, namely the COMPASS 2025 proton-target multiplicities and the COMPASS 2026 revised isoscalar-target multiplicities, into a common charged-pion and charged-kaon FF analysis and to assess their role in the resulting flavor separation. The revised isoscalar data supersede the earlier COMPASS measurements used in previous global fits. The charge-separated pion multiplicities provide important constraints on favored and unfavored light-quark fragmentation, while the kaon measurements enhance the sensitivity to light-quark, unfavored, and strange-to-kaon fragmentation channels. In both analyses, the gluon FF remains indirectly constrained in the present SIA+SIDIS framework and should be interpreted with appropriate caution. The extractions are carried out using the publicly available MontBlanc framework, and the resulting HAPS-PiFF1.0 and HAPS-KaFF1.0 replica sets are provided in the standard LHAPDF format."},{"arxiv":"2611.31011","id":"3233213","title":"Lorentz symmetry in self-supervised representation learning","authors":"Andreas Hermansen, Tobias Golling, Slava Voloshynovskiy","score":5.8,"section":"new","rank":41,"parts":[0.0,0.09,0.2,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.03, 4 shared references). Closest network paper: [[2893828]] (coupling 0.07, 6 shared references).","abstract":"Self-supervised learning (SSL) and explicit physical inductive biases have driven major advances in jet tagging, yet they are typically pursued along separate tracks. In this work, we unify both paradigms by integrating the Lorentz-equivariant Geometric Algebra Transformer slim (L-GATr-slim) architecture with the LeJEPA framework for representation learning. Pre-training on 100 million jets from the JetClass dataset, we optimize towards a latent space, which is invariant across physics-motivated jet augmentations. We demonstrate that enforcing Lorentz symmetry in the latent space is critical for representation quality and that this can be achieved either architecturally or learned via kinematic augmentations. With a standard non-invariant Transformer backbone, LeJEPA outperforms established autoregressive, masked particle modelling, and self-distillation baselines in linear- and MLP-probe accuracy, with L-GATr-slim providing further complementary gains. Across downstream benchmarks, our pre-trained models consistently outperform baselines trained from scratch or through different pre-training objectives."},{"arxiv":"2611.29122","id":"3232258","title":"Measuring the Neutrino Mass with $^{241}$Pu","authors":"Mustafa Anaam, Nicolo de Groot, Inge van Rens","score":5.1,"section":"cross","rank":42,"parts":[0.0,0.0,0.12,0.0,0.33],"note":"Closest network paper: [[2775479]] (coupling 0.04, 1 shared references). Shared topics: neutrino mass.","abstract":"Tritium has long been the isotope of choice for measurements of the absolute neutrino mass. Its low nuclear mass leads to substantial recoil energy, limiting measurements with both molecular tritium ($T_2$) and atomic tritium bound to a substrate. With a beta-decay endpoint energy and half-life similar to those of tritium, but a much larger nuclear mass, $^{241}$Pu may offer an interesting alternative. Its principal challenge is background from the beta decay of $^{237}$U. We discuss strategies for suppressing this background and compare the projected neutrino-mass sensitivities of $^{241}$Pu and tritium as a function of the background suppression."},{"arxiv":"2609.34324","id":"3208833","title":"Relic Neutrinos Probing Small Scale Primordial Non-Gaussianity","authors":"Suraj Gavhale, Shin'ichi Nojiri, Sergei D. Odintsov, Oem Trivedi","score":5.0,"section":"replacement","rank":43,"parts":[0.0,0.08,0.18,0.0,0.0],"note":"Closest of your papers: [[1627633]] (coupling 0.03, 1 shared references). Closest network paper: [[2875244]] (coupling 0.06, 6 shared references).","abstract":"Relic neutrinos retain a record of electromagnetic entropy production after neutrino decoupling, probing primordial modes erased from the primary CMB. We derive the cubic photon number source from acoustic damping and its leading folded sensitive bispectrum window, with neutrino decoupling, thermalization, and acoustic coherence combined in a single response kernel. For excited initial states, this kernel filters the physical folded profile and yields a sharpness dependent transmission condition, directly connecting small scale primordial non-Gaussianity to relic neutrino capture rates."},{"arxiv":"2611.30434","id":"3232445","title":"Effect of dark matter and scalar-cut potential on the macroscopic properties of neutron stars: A chiral quark mean field approach","authors":"Hrishika P, Arvind Kumar","score":4.6,"section":"new","rank":44,"parts":[0.0,0.07,0.11,0.0,0.09],"note":"Closest of your papers: [[1741056]] (coupling 0.02, 4 shared references). Closest network paper: [[2063283]] (coupling 0.04, 5 shared references).","abstract":"We investigate the effects of fermionic dark matter (DM) and scalar-cut potential ($U_{\\text{cut}}(φ)$) on the equation of state (EOS) and macroscopic properties of neutron stars. The baryonic matter consists of neutrons, protons, electrons, and muons under the $β$-equilibrium and is described within the chiral SU(3) quark mean-field (CQMF) model. In this framework, quarks are confined within baryons, whose properties are modified through the exchange of scalar fields $σ$, $ζ$, and $δ$, and vector fields $ω$ and $ρ$. The DM is modelled as a self-interacting fermionic fluid with scalar $\\varphi_D$ and vector $V_D^μ$ mediators. The baryonic and DM fluids interact only through gravity and are treated within a two-fluid Tolman-Oppenheimer-Volkoff formalism. We examine the resulting mass-radius relation and tidal deformability, along with the gravitational redshift, to investigate the effects of DM on neutron star structure and observable properties. The inclusion of $U_{\\text{cut}}(φ)$ stiffens the EOS, whereas increasing the DM fraction generally softens the EOS and modifies the mass-radius relation, tidal deformability, and gravitational redshift. The magnitude and nature of these modifications depend on the DM particle mass and mediator interactions, which determine whether the resulting configurations exhibit compact DM cores or extended DM halos."},{"arxiv":"2611.29526","id":"3232323","title":"Package feyn.gle for drawing Feynman diagrams, version 1.2","authors":"Andrey Grozin","score":3.7,"section":"new","rank":45,"parts":[0.0,0.0,0.25,0.0,0.0],"note":"Closest network paper: [[1866376]] (coupling 0.09, 2 shared references).","abstract":"As compared to the previous version, there is one backward-incompatible change and many new kinds of lines and other objects."},{"arxiv":"1812.07006","id":"1709773","title":"Chiral QCD phase in equilibrium with Hadron Gas and the location of the critical point","authors":"N. G. Antoniou, F. K. Diakonos, A. S. Kapoyannis","score":3.6,"section":"replacement","rank":46,"parts":[0.06,0.02,0.06,0.0,0.0],"note":"Also cites widely used network papers: [[1688995]]. Closest of your papers: [[1708907]] (coupling 0.01, 1 shared references). Closest network paper: [[2802615]] (coupling 0.02, 2 shared references).","abstract":"We develop a description of the equation of state of QCD matter with restored chiral symmetry, which is in thermal and chemical equilibrium with the hadronic phase. The hadron gas is described with thermodynamically consistent volume corrections. The chiral phase is composed of a set of few quark condensates, each of which corresponds to a family of hadrons with specific quark content. On the boundary between the two phases we apply the requirement of conservation of particle numbers per family. We use lattice calculations for temperatures below the transition curve to determine hadronic volumes. We find that the pion system plays decisive role in the shift of the transition from higher order (crossover) to first order. For four volume models and five hadron sets we calculate the location of the critical point as function of critical temperature $T_c$ at vanishing baryon density. Among other acceptable solutions, if we additionally impose the equality between the densities of quarks contained in mesons and baryons, we find a critical point residing in the interval of baryon chemical potential $μ_B \\simeq$ 234-279 MeV and of temperature $T \\simeq$ 148-156 MeV. We propose as signal of approach to the critical point the determination of the chiral pion mass through experimentally measured pion multiplicities in heavy-ion collisions."},{"arxiv":"2611.18794","id":"3229395","title":"Nonperturbative lattice simulation of the nucleation rate in thermal first-order phase transitions","authors":"Jing Zhou, Ligong Bian","score":3.6,"section":"replacement","rank":47,"parts":[0.0,0.03,0.18,0.0,0.0],"note":"Closest of your papers: [[2080612]] (coupling 0.01, 1 shared references). Closest network paper: [[2862278]] (coupling 0.06, 14 shared references).","abstract":"We present a nonperturbative lattice study of vacuum decay through bubble nucleation in a three-dimensional real scalar field theory at finite temperature. The vacuum decay rate is computed by combining an expanded-ensemble multicanonical hybrid Monte Carlo approach, which samples the critical bubble configurations, with real-time Langevin dynamics, which follows the subsequent bubble evolution. We extrapolate the nucleation rate to the continuum limit and compare it with the corresponding one-loop perturbative prediction, finding a discrepancy of about 6.6%."},{"arxiv":"2609.02537","id":"3199074","title":"Analysis of the two-body strong decays of the hidden-charm pentaquark states in QCD sum rules","authors":"Zi-Hao Chen, Han-Xiong Huang, Jie Lu, Xiao-Song Yang, Zhi-Gang Wang, Guo-Liang Yu","score":3.5,"section":"replacement","rank":48,"parts":[0.06,0.01,0.08,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.00, 1 shared references). Closest network paper: [[2817040]] (coupling 0.03, 27 shared references).","abstract":"In the present work, we study the two-body strong decays of the hidden-charm pentaquark states with the quark content $uudc\\bar c$ and the quantum numbers $I(J^P)=\\frac{1}{2}(\\frac{1}{2}^-)$ in the framework of the three-point QCD sum rules. The initial pentaquark states are described by four local diquark-diquark-antiquark type interpolating currents with definite isospin. We construct the three-point correlation functions for the decay channels $P_c\\to η_c p$, $J/ψp$, $Λ_c\\bar D$, $Λ_c\\bar D^{*}$ and $Σ_c\\bar D$, and derive the corresponding QCD sum rules for the strong coupling constants. At the hadron side, the correlation functions are expressed in terms of the hadron masses, pole residues, decay constants and strong coupling constants. At the QCD side, they are calculated by carrying out the operator product expansion with the full quark propagators, where the vacuum condensates up to dimension 10 are taken into account. After matching the two representations and performing the double Borel transformations, we extract the strong coupling constants from the selected Lorentz structures. With the obtained coupling constants, we evaluate the partial decay widths and discuss the possible assignments of the corresponding pentaquark states. The numerical results indicate that two of the compact hidden-charm pentaquark states can be related to the $P_c(4312)$ and $P_c(4457)$, respectively, while the other two lower-mass states may be regarded as possible hidden-charm pentaquark candidates to be searched for in future experiments. The present results may be useful for identifying the hidden-charm pentaquark states in future experiments."}],"rest":[{"arxiv":"2605.06401","title":"A High-Precision Statistical Analysis of the SN1987A Neutrino Temporal Distribution","score":3.3,"section":"replacement","rank":49},{"arxiv":"2611.24372","title":"$X(2370)$ without exceptionalism from reanalyzing $J/ψ\\to γ+ 3P$ data","score":3.3,"section":"replacement","rank":50},{"arxiv":"2611.28037","title":"Photomeson-threshold origin of the TeV break in astrophysical neutrinos: Spectrum, flavor, resolved sources, and the ultrahigh-energy landscape","score":   const RNG=d3.randomLcg(11);
  const W=Math.max(300,document.getElementById('chart').clientWidth), H=W<600?500:480, m={l:16,r:16,t:20,b:34};
  svg.attr('viewBox',`0 0 ${W} ${H}`); svg.selectAll('*').remove();
  const yrs=d3.extent(N,n=>n.year);
  const x=d3.scaleLinear().domain([yrs[0]-.5,yrs[1]+1.2]).range([m.l+8,W-m.r-8]);
  const ticks=x.ticks(W<600?6:12).filter(t=>Number.isInteger(t)&&t<=yrs[1]);
  svg.append('g').attr('class','grid').selectAll('line').data(ticks).join('line').attr('x1',d=>x(d)).attr('x2',d=>x(d)).attr('y1',m.t).attr('y2',H-m.b);
  svg.append('g').attr('class','axis').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x).tickValues(ticks).tickFormat(d3.format('d')).tickSizeOuter(0));
  const cy=(m.t+H-m.b)/2, xf=n=>isNew(n)?x(yrs[1]+.75):x(n.year);
  const sim=N.map(n=>({n,x:xf(n)+(RNG()-.5)*4,y:cy+(RNG()-.5)*H*.5}));
  const links=E.map(e=>({source:sim[e.s],target:sim[e.t],s:e.s,t:e.t,k:e.k}));
  d3.forceSimulation(sim).force('x',d3.forceX(s=>xf(s.n)).strength(1)).force('y',d3.forceY(cy).strength(.04))
    .force('link',d3.forceLink(links).strength(.03)).force('charge',d3.forceManyBody().strength(-40))
    .force('col',d3.forceCollide(s=>r(s.n)+2)).stop().tick(320);
  sim.forEach(s=>{s.y=Math.max(m.t+8,Math.min(H-m.b-8,s.y));s.x=Math.max(m.l+4,Math.min(W-m.r-4,s.x))});
  G=svg.append('g');
  G.append('g').selectAll('path').data(links).join('path').attr('class',l=>'edge '+l.k)
    .attr('d',l=>{const a=l.source,b=l.target;return `M${a.x},${a.y}Q${(a.x+b.x)/2},${(a.y+b.y)/2-Math.abs(a.x-b.x)*.12} ${b.x},${b.y}`});
  G.append('g').selectAll('circle').data([...sim].sort((a,b)=>RANK[b.n.role]-RANK[a.n.role])).join('circle')
    .attr('class','node').attr('cx',s=>s.x).attr('cy',s=>s.y).attr('r',s=>r(s.n)).attr('fill',s=>col(s.n))
    .on('pointerenter',(ev,s)=>{hover=s.n;showTip(ev,s.n);paint()}).on('pointermove',(ev,s)=>showTip(ev,s.n))
    .on('pointerleave',()=>{hover=null;tip.hidden=true;paint()}).on('click',(ev,s)=>pick(s.n,false));
  const lab=sim.filter(s=>isNew(s.n)||s.n.role==='seed'||s.n.deg>=3);
  const L=lab.map(s=>{const right=s.x>W*.8,t=isNew(s.n)?`#${s.n.rank} ${s.n.first}`:`${s.n.first} ${s.n.year}`,w=t.length*6.2;return{s,t,right,x0:right?s.x-r(s.n)-4-w:s.x+r(s.n)+4,w,y:s.y+4}}).sort((a,b)=>a.y-b.y);
  const placed=[];L.forEach(l=>{let k=0;while(k<40&&placed.some(p=>l.x0<p.x0+p.w&&p.x0<l.x0+l.w&&Math.abs(l.y-p.y)<13)){l.y+=13*(k%2?-1:1)*(1+Math.floor(k/2));k++;l.y=Math.max(m.t+10,Math.min(H-m.b-4,l.y))}placed.push(l)});
  G.append('g').selectAll('text').data(L).join('text').attr('class','nlabel').attr('x',l=>l.right?l.s.x-r(l.s.n)-4:l.s.x+r(l.s.n)+4).attr('y',l=>l.y)
    .attr('text-anchor',l=>l.right?'end':'start').text(l=>l.t);
  paint();
}
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  const nmin=M.nextMin;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}${nmin!=null?`: every paper scoring ${nmin} or more, and at least ${M.nextCount} when available`:''}; not drawn in the network`;
  const cut=nmin!=null?X.findIndex(n=>n.score<nmin):-1;
  box.innerHTML=X.map((n,i)=>(i===cut?`<li class="divider">Below ${nmin}: weaker relation (most of these share no specific reference, coupling or topic with your work)</li>`:'')+`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
// the rest of the day's papers by score: only the title, linked to the arXiv record
function restList(){const X=RAW.rest||[];if(!X.length)return;const d=document.getElementById('rest'),box=document.getElementById('restlist');
  d.hidden=false;d.querySelector('summary').firstChild.textContent=`All other ${X.length} papers in this listing `;
  document.getElementById('restsub').textContent='by score, title only';
  box.innerHTML=X.map(n=>`<li><span class="sc">#${n.rank} · ${n.score.toFixed(1)}</span><a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">${esc(n.title)}</a></li>`).join('');
  d.addEventListener('toggle',()=>{if(d.open)tex(box)})}
list();nextList();restList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
