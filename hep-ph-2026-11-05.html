<script>
const RAW = {"n":[{"id":"3172594","arxiv":"2606.25936","title":"Complementary probes of bilinear R-parity violating SUSY models with a winolike LSP via neutrino oscillations and at the LHC","first":"Choudhury","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites your papers: [[1118587]]. Cites 14 network papers: [[2848018]], [[1397016]], [[2920257]], [[2755988]], [[2662299]], [[662457]]…. Also cites widely used network papers: [[651654]]. Closest of your papers: [[566634]] (coupling 0.07, 19 shared references). Closest network paper: [[3172594]] (coupling 1.00, 121 shared references). Shared topics: bilinear r-parity violation, r-parity violation, neutrino oscillation data, neutrino mass.","score":66.1,"rank":1,"section":"replacement","parts":[1.0,0.22,1,0.0,0.95],"abstract":"In this work, we explore the bilinear R-parity violating Supersymmetry model's parameter space by performing a Markov Chain Monte Carlo scan with neutrino oscillation data, Higgs mass and its coupling strengths, and flavor observables such as $B$-hadron decay branching ratios. From the allowed parameter space, we analyze the decay patterns of wino-like lighter charginos and lightest neutralinos and demonstrate how the branching ratios to different neutrino and charged lepton flavors depend on the neutrino mass hierarchy. Furthermore, we investigate the impact of current LHC bounds and projected future sensitivities from trilepton resonance searches on the allowed parameter space. We show that considering the branching ratio $\\mathrm{Br}(\\widetildeχ_1^{\\pm} \\to Zl^\\pm; l= e,μ,τ) \\sim$23\\%, obtained at the best-fit point, the wino-like mass degenerate $\\widetildeχ_1^{\\pm}/\\widetildeχ_1^0$ are excluded upto 565 GeV from LHC Run-II data. The projected exclusion reach with a similar branching ratio at High-Luminosity LHC (HL-LHC) is around 950 GeV. For a simplified scenario where $\\widetildeχ_1^{\\pm} / \\widetildeχ_1^0$ decays via a $Z$ boson with branching ratios of 1\\%, 50\\%, and 100\\%, wino masses can be excluded up to approximately $600~\\mathrm{GeV}$, $1185~\\mathrm{GeV}$, and $1350~\\mathrm{GeV}$ respectively. Our analysis shows that the HL-LHC can probe a significant portion of the 1$σ$ allowed parameter space by neutrino oscillation measurements and other experimental constraints.","authors":"Arghya Choudhury, Arpita Mondal","nlinked":121,"nref":129,"src":"INSPIRE","html":true},{"id":"2974395","arxiv":"2509.23508","title":"Type I + II Seesaw Model in light of the New Neutrino Oscillation Measurements","first":"Aguilar","nauth":6,"year":2026,"cites":0,"role":"repl","note":"Co-authors of yours: Queiroz, Suarez. Cites 2 network papers: [[2648207]], [[2047160]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[611590]] (coupling 0.06, 7 shared references). Closest network paper: [[3154758]] (coupling 0.25, 25 shared references). Shared topics: neutrino oscillation data, lepton flavor violation, neutrino mass, seesaw model, seesaw mechanism.","score":60.1,"rank":2,"section":"replacement","parts":[0.72,0.18,0.72,1,0.87],"abstract":"Global analysis of neutrino oscillation data slightly favors normal mass ordering. In this work, we investigate an extended scalar sector that naturally gives rise to a type I + II seesaw mechanism after spontaneous symmetry breaking and explore the interplay between collider physics and lepton flavor violation, adopting normal ordering. In particular, we focus on the rare muon decays $μ\\rightarrow e γ$ and $μ\\rightarrow 3e$ and the same-sign dilepton searches at LHC, a canonical signature of a doubly charged scalar. We conclude that neither the precise value of the sum of the neutrino masses, taken from DESI data that favors $\\sum m_ν=0.07$~eV, nor alternative cosmological fits which prefer a more relaxed limit $\\sum m_ν=0.1$~eV, significantly changes the theoretical prediction for these rare decays. However, we observe an interesting interplay between collider physics and lepton flavor violation. In particular, we find that $μ\\rightarrow 3e$ is more constraining than $μ\\rightarrow eγ$. The $μ\\rightarrow 3e$ decay can yield a lower mass limit of $3$~TeV on the doubly charged scalar, surpassing current LHC constraints in a dominant type II seesaw or in a mixed type I+II scenario. Nevertheless, LFV does not strongly constrain the dominant type I seesaw scenario.","authors":"Maria Aguilar, Juan Carlos Helo, Toshihiko Ota, Farinaldo S. Queiroz, David Suarez, Amanda Rodríguez","nlinked":84,"nref":86,"src":"INSPIRE","html":true},{"id":"3089396","arxiv":"2512.05031","title":"CNN on `Top': In Search of Scalable & Lightweight Image-based Jet Taggers","first":"Baruah","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[2829800]], [[2668336]]. Closest of your papers: [[1627633]] (coupling 0.02, 3 shared references). Closest network paper: [[2829800]] (coupling 0.22, 31 shared references).","score":35.9,"rank":3,"section":"replacement","parts":[0.7,0.06,0.64,0.0,0.0],"abstract":"While Transformer-based and standard Graph Neural Networks (GNNs) have proven to be the best performers in classifying different types of jets, they require substantial computational power. We explore the scope of using a lightweight and scalable version of EfficientNet architecture, along with global features of the jet. The end product is computationally inexpensive but is capable of competitive performance. We showcase the efficacy of our network in tagging top-quark jets in a sea of other light quark and gluon jets. The work also sheds light on the importance of global features for both the accuracy and the apparent redundancy of the network's complexity.","authors":"Rajneil Baruah, Subhadeep Mondal, Sunando Kumar Patra, Satyajit Roy","nlinked":75,"nref":100,"src":"INSPIRE","html":true},{"id":"3222926","arxiv":"2611.05475","title":"Complete set of bounded-from-below conditions for the $A_4$-symmetric three-Higgs-doublet model","first":"Lavoura","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[2626725]], [[2793703]]. Closest of your papers: [[1249404]] (coupling 0.05, 3 shared references). Closest network paper: [[2626725]] (coupling 0.13, 5 shared references).","score":34.0,"rank":4,"section":"new","parts":[0.7,0.13,0.36,0.0,0.0],"abstract":"We derive bounded-from-below necessary conditions for the scalar potential of an $A_4$-invariant three-Higgs-doublet model. The field Ansätze that we have used were devised with the help of Claude. Testing our set of conditions on $10^6$ random potentials, that in parallel we minimize by brute force using the Mathematica package StableWein, we find that the set seems to be necessary and sufficient for boundedness-from-below.","authors":"Luís Lavoura, André Milagre","nlinked":36,"nref":37,"src":"INSPIRE","html":true},{"id":"3202047","arxiv":"2609.10491","title":"Inelastic Dark Matter and High-Energy Recoil Signatures in LZ","first":"Fan","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3201080]]. Closest of your papers: [[2859009]] (coupling 0.01, 1 shared references). Closest network paper: [[3202840]] (coupling 0.73, 48 shared references).","score":32.1,"rank":5,"section":"replacement","parts":[0.45,0.02,1,0.0,0.07],"abstract":"We study the inelastic dark matter (iDM) that consists of two-component dark matter particles $(χ_1,χ_2)$ and serves as a minimal extension beyond the commonly used one-component DM models. A distinctive feature of such iDM scattering with the target nuclei is to favorably produce signals at high nuclear recoil (NR) energy region in both exothermic and endothermic processes. In particular, for the exothermic dark matter scenario, the signal does not rely on the tail of the Boltzmann velocity distribution. As a result, the required DM-nucleus scattering cross section is significantly reduced, which in turn helps to substantially relax the stringent constraints imposed by IceCube neutrino searches. Using the inelastic DM-nucleus scattering, we naturally explain the newly reported event excess at high recoil energy with the LUX-ZEPLIN (LZ) experiment.","authors":"Zi-Tong Fan, Hong-Jian He, Yu-Chen Wang, Yue Zhao","nlinked":62,"nref":62,"src":"INSPIRE","html":true},{"id":"3222915","arxiv":"2611.05464","title":"Flavour Chains at the TeV Edge","first":"Greljo","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[2051195]], [[3193100]]. Closest of your papers: [[2690106]] (coupling 0.02, 2 shared references). Closest network paper: [[2842150]] (coupling 0.06, 7 shared references). Shared topics: vector-like fermion.","score":31.6,"rank":6,"section":"new","parts":[0.7,0.06,0.17,0.0,0.28],"abstract":"We study chains of vector-like fermions that generate the Yukawa hierarchies as products of small mixings, with the Higgs coupled at a single link. Minimal Flavour Protection allows these flavour messengers to live at the TeV scale, while Higgs naturalness offers a reason to place them there: in cosmological solutions based on Higgs criticality, their large multiplicity lowers the critical point of the Higgs potential to the TeV scale. Crucially, the same Higgs interactions induce tree-level shifts in the $Z$ and $W$ couplings of light fermions. Existing LEP and SLD measurements already bound $M_F/|y_F|\\gtrsim 3$ TeV, while a future Tera-$Z$ factory such as FCC-ee could probe up to $100$ TeV. It would test the parameter space most relevant to Higgs naturalness, reaching scenarios with Higgs-mass tuning at the level of $10^{-4}$ or worse in minimal realisations. Longer chains partially alleviate this tuning but do not eliminate it, making a Tera-$Z$ factory a decisive test of the framework.","authors":"Admir Greljo, Xavier Ponce Díaz, Lia Schöneweiß","nlinked":137,"nref":141,"src":"INSPIRE","html":true},{"id":"3222920","arxiv":"2611.05685","title":"Probing CP Violation in the Complex 2HDMS with a 95 GeV Scalar at Future $e^+e^-$ Colliders","first":"Lahiri","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2666538]]. Closest of your papers: [[1746620]] (coupling 0.02, 4 shared references). Closest network paper: [[2666538]] (coupling 0.31, 24 shared references).","score":31.0,"rank":7,"section":"new","parts":[0.45,0.07,0.88,0.0,0.0],"abstract":"In this study, we investigate the prospects for probing CP violation in the complex singlet extension of the two-Higgs-doublet model (2HDM) at future electron-positron colliders. In extended scalar sectors, cancellations among different contributions to electric dipole moments (EDMs) can relax the stringent constraints on CP-violating phases, potentially bringing them in the current reach of collider experiments. We consider a scenario in which both the 125 GeV Higgs boson and the additional scalar associated with the reported 95 GeV excess are CP-mixed states. We probe the CP-violating phase of the 95 GeV scalar through its production via Higgsstrahlung and subsequent decay into a tau-lepton pair, using a CP-sensitive forward-backward asymmetry in hadronic and semileptonic tau-decay channels. We estimate the sensitivity at future lepton colliders, namely the ILC, FCC-ee, and CEPC, and investigate the impact of the Standard Model Drell-Yan background. We find that the hadronic channel offers greater sensitivity than the semileptonic channel. We also compare our results with existing constraints and future projections for CP violation in the 125 GeV Higgs sector and briefly discuss the implications for electroweak baryogenesis. Our results highlight the potential of future lepton colliders to probe CP violation in extended scalar sectors while remaining consistent with current EDM constraints.","authors":"Jayita Lahiri, Cheng Li, Gudrid Moortgat-Pick","nlinked":88,"nref":90,"src":"INSPIRE","html":true},{"id":"3154219","arxiv":"2605.09571","title":"Einstein-Cartan pseudoscalaron inflation, reheating and nonthermal leptogenesis","first":"Benedetto","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1210691]]. Also cites widely used network papers: [[779828]], [[2817040]]. Closest of your papers: [[922002]] (coupling 0.03, 4 shared references). Closest network paper: [[779828]] (coupling 0.13, 37 shared references). Shared topics: majorana neutrino.","score":28.7,"rank":8,"section":"replacement","parts":[0.51,0.07,0.37,0.0,0.31],"abstract":"We study the postinflationary dynamics of an Einstein-Cartan-Holst gravity-motivated inflationary scenario, known as Einstein-Cartan pseudoscalaron inflation, coupled to a type-I seesaw extension of the Standard Model with three heavy right-handed Majorana neutrinos. In particular, we show that nonthermal leptogenesis emerges as a necessary and self-consistent mechanism for generating the observed baryon asymmetry of the Universe, mainly because of the universal coupling of the inflaton to the additional heavy Majorana fermions. The resulting framework provides theoretical predictions that are fully compatible with the latest cosmological constraints from the Cosmic Microwave Background, Baryon Acoustic Oscillations, and Big Bang Nucleosynthesis, as well as with neutrino oscillation experiments, for a wide range of the fundamental Barbero-Immirzi model parameter $γ$, which controls the inflationary and postinflationary phases. In particular, for $γ\\sim -1/100$ and a lightest Majorana-neutrino mass $\\gtrsim 10^{13}$ GeV, we find a scalar spectral index $n_s \\sim 0.970$, a tensor-to-scalar ratio $r \\sim 0.004$, for a number of $e$-folds before the end of inflation $N_e \\lesssim 60$, and a baryon-to-entropy ratio $n_B/s \\sim 8.7 \\times 10^{-11}$","authors":"Carlo Di Benedetto, Alessandro Di Marco, Emanuele Orazi, Gianfranco Pradisi","nlinked":142,"nref":144,"src":"INSPIRE","html":true},{"id":"3222948","arxiv":"2611.05501","title":"Indirect probes of heavy neutral leptons through the dipole portal at FCC-ee","first":"Vignaroli","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2937257]]. Closest of your papers: [[1746620]] (coupling 0.02, 3 shared references). Closest network paper: [[3073459]] (coupling 0.13, 22 shared references).","score":23.1,"rank":9,"section":"new","parts":[0.45,0.06,0.37,0.0,0.0],"abstract":"We study indirect probes of the gauge-invariant dipole portal of Majorana heavy neutral leptons (HNLs) at FCC-ee. Virtual HNLs modify electroweak gauge-boson propagation and lepton couplings through loops with two dipole interactions. We calculate the resulting finite matching corrections and their effects on $Z$-pole observables. For real, flavour-aligned couplings, the local response is specified by four combinations of coupling shifts. Independent local ultraviolet interactions can reproduce all four, making the dipole interpretation dependent on assumptions about those interactions. With improved Standard Model predictions, FCC-ee can probe equal, same-sign hypercharge and weak dipole coefficients as small as $0.14\\,\\mathrm{TeV}^{-2}$ at an HNL mass of 1 TeV. This projection assumes dipole dominance, with independent ultraviolet coefficients set to zero at twice the HNL mass. We quantify how additional ultraviolet contributions can weaken or strengthen the sensitivity. At 1 TeV, the projected reach is competitive with HL-LHC same-sign dilepton searches for Majorana HNLs, while larger masses allow smaller dipole coefficients to be probed within the effective theory's domain of validity. Radiative Higgs decays offer a modest further improvement. The FeynRules, FeynArts and UFO models used in this analysis are publicly available at \\href{https://doi.org/10.5281/zenodo.23667622}{doi:10.5281/zenodo.23667622}.","authors":"Natascia Vignaroli","nlinked":78,"nref":78,"src":"INSPIRE","html":true},{"id":"3159193","arxiv":"2605.24473","title":"Freeze-in $SU(2)$ vector dark matter at low reheating temperature","first":"Ghosh","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[1518747]], [[2817040]]. Closest of your papers: [[1746620]] (coupling 0.07, 8 shared references). Closest network paper: [[2962467]] (coupling 0.12, 9 shared references). Shared topics: discrete symmetry, relic abundance.","score":21.2,"rank":10,"section":"replacement","parts":[0.11,0.22,0.35,0.0,0.53],"abstract":"The freeze-in mechanism for dark matter (DM) requires extremely feeble interactions with the Standard Model (SM), preventing thermal equilibrium in the early Universe and typically evading experimental detection. However, for sufficiently low reheating temperatures ($T_{\\rm RH}$), the observed relic abundance can be realized with larger couplings, opening prospects for experimental searches. In this work, we investigate freeze-in production of $SU(2)_{\\rm HS}$ vector dark matter (VDM) in a low-$T_{\\rm RH}$ cosmology. The framework naturally contains three mass-degenerate stable VDM candidates without the need for any additional discrete symmetry. We perform a systematic study of the dark matter phenomenology and identify the parameter space consistent with the observed relic abundance. We work with the approximation of instantaneous reheating and consider the DM abundance to be negligible at $T_{\\rm RH}$. In contrast to conventional freeze-in scenarios, the required DM couplings can be sizable, rendering part of the parameter space already constrained by existing direct searches like PandaX-4T and LZ, while a significant region remains within the reach of future experiments such as DARWIN. Though one can realize the freeze-in mechanism for an abelian $U(1)_X$ vector DM models as well, we find that the non-abelian structure of the $SU(2)_{\\rm HS}$ scenario leads to a distinct feature due to a larger number of dark matter particles, resulting in an enlarged viable parameter space due to the multiplicity of dark matter states.","authors":"Dilip Kumar Ghosh, Sourav Gope, Xiao-Gang He, Xuan Hong, Sk Jeesun","nlinked":45,"nref":45,"src":"INSPIRE","html":true},{"id":"3223096","arxiv":"2611.06643","title":"Quantum field theory treatment of the spin-flavor precession of Dirac neutrinos with diagonal magnetic moments","first":"Dvornikov","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2845531]]. Closest network paper: [[594326]] (coupling 0.04, 2 shared references). Shared topics: neutrino mass.","score":20.8,"rank":11,"section":"new","parts":[0.45,0.0,0.11,0.0,0.33],"abstract":"We apply the quantum field theory (QFT) approach to describe the spin-flavor precession of Dirac neutrinos. The magnetic moments matrix of these neutrinos is taken to be diagonal in the mass basis. Neutrino mass eigenstates are considered to be virtual particles in the QFT approach. The neutrino contribution to the matrix element of the overall process, which includes the emission, the propagation and the detection of neutrinos, is contained in the propagators of massive neutrinos. Using the recently derived propagator of a massive neutrino, which exactly accounts for the magnetic moment interaction, we derive the transition probability of the process $ν_{e\\mathrm{L}}\\toν_{μ\\mathrm{L}}$ under the influence of a magnetic field. The result is compared with the prediction of the standard quantum mechanical (QM) approach. We briefly discuss the possibility to derive the QFT corrections to the QM expressions.","authors":"Maxim Dvornikov","nlinked":16,"nref":18,"src":"INSPIRE","html":true},{"id":"3168392","arxiv":"2606.14373","title":"Machine-learned particle flow as a foundation model for collider physics","first":"Mokhtar","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1455793]] (coupling 0.01, 1 shared references). Closest network paper: [[2716079]] (coupling 0.05, 4 shared references).","score":18.5,"rank":12,"section":"replacement","parts":[0.45,0.02,0.14,0.0,0.0],"abstract":"The workflow from particle collision to physics analysis passes through a series of reconstruction steps that are traditionally modular and disconnected, with no shared representation linking low-level detector data to high-level analysis tasks. We show that casting event reconstruction as a machine learning problem naturally produces such a shared representation. We repurpose a machine learning model trained for particle-flow reconstruction (MLPF) to perform three distinct analysis tasks: jet flavor identification, jet energy regression, and missing momentum regression. By appending the per-particle latent representations learned during reconstruction as additional input features, we substantially improve over baselines that use conventional particle-level features alone. We further demonstrate that a single linear layer trained using only the latent representations achieves competitive performance against state-of-the-art baseline architectures, and outperforms the baseline for missing momentum regression with approximately 35 times fewer parameters. These results demonstrate that the latent representations learned during reconstruction encode essential physics information needed for downstream analysis, establishing MLPF as a foundation model and offering a concrete step toward an end-to-end pipeline from detector data to physics analysis.","authors":"Farouk Mokhtar, Joosep Pata, Michael Kagan, Javier Duarte","nlinked":38,"nref":49,"src":"INSPIRE","html":true},{"id":"3222890","arxiv":"2611.05440","title":"Meson spectra in a screened relativized quark model","first":"Huang","nauth":6,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.00, 1 shared references). Closest network paper: [[1710056]] (coupling 0.02, 8 shared references).","score":18.0,"rank":13,"section":"new","parts":[0.48,0.01,0.06,0.0,0.0],"abstract":"In this work, we employed the modified Godfrey--Isgur model to systematically investigate the mass spectra of several light, heavy-light, and heavy-heavy meson systems. In this model, a screened potential is employed to phenomenologically account for modifications to the long-range confining interaction associated with unquenched effects. We performed a global refit of the relevant model parameters to a combined set of 90 adopted meson masses spanning all three sectors, ensuring a consistent parameter determination across the different meson systems. Using the resulting parameter set, we calculated the low-lying and highly excited spectra and the corresponding mixed states in different meson families, and compared our results with existing experimental data and other theoretical results. The assignment of several newly observed structures (such as $B_c^*$ and $D_{s1}(2933)$) have also been discussed based on their predicted masses. Overall, the model describes several main spectroscopic features across different flavors and provides mass predictions for highly excited states that have not yet been experimentally established.","authors":"Zhe-Qi Huang, Lei Huang, Xiao-Lei Zhang, Xin-Lei Ge, Hao Chen, Cheng-Qun Pang","nlinked":108,"nref":110,"src":"INSPIRE","html":true},{"id":"3222201","arxiv":"2611.01533","title":"Resolving the Two-Fold Ambiguity in Tau Momentum Reconstruction via a Self-Consistent Weighting Method","first":"Ping","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3214449]] (coupling 0.04, 1 shared references).","score":17.3,"rank":14,"section":"replacement","parts":[0.45,0.0,0.1,0.0,0.0],"abstract":"The reconstruction of $τ$ lepton momenta in $e^{+}e^{-} \\to τ^{+}τ^{-}$ processes suffers from a two-fold kinematic ambiguity due to undetected neutrinos. We show that the common practice of retaining both solutions with equal weight systematically biases the extracted angular coefficients: the bias grows with the size of the $\\cos^{2}θ$ modulation of the production distribution $f(\\cosθ)$, but remains resolvable even in the nearly uniform QED limit at the $ψ(2S)$ threshold. We propose a self-consistent weighting method based on a fixed-point theorem: assigning normalized weights $w_{i} = f(\\cosθ_{i})/[f(\\cosθ_{1})+f(\\cosθ_{2})]$ yields a weighted distribution $h(x) = f(x)[1+\\varepsilon(x)]$ with $\\varepsilon(x) \\ll 1$ under a detailed balance condition. Monte Carlo simulations at $\\sqrt{s}=3.686$~GeV and $4.8$~GeV show that the fixed-point iteration converges to the true angular coefficient $α$ within statistical uncertainty, providing a robust framework for angular analysis without event-by-event ambiguity resolution.","authors":"Rong-Gang Ping","nlinked":9,"nref":9,"src":"INSPIRE","html":true},{"id":"3216260","arxiv":"2610.24634","title":"ISR Reconstruction of Radiative $C=+1$ Charmonia as the Origin of the Belle--BESIII Line-Shape Puzzle","first":"Liu","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3214449]] (coupling 0.02, 1 shared references).","score":16.5,"rank":15,"section":"replacement","parts":[0.45,0.0,0.05,0.0,0.0],"abstract":"A longstanding disagreement persists between Belle and BESIII over the line shapes of $e^+e^-\\to Λ_c^+\\barΛ_c^-$, $D_sD_{s1}(2536)$, and $D_sD_{s2}^{*}(2573)$ near 4.63 GeV. Belle observes enhancements through initial state radiation that are absent or much weaker at BESIII. We propose that the extra Belle yield arises from radiative production of a $C=+1$ charmonium. Luminosity normalization increases this contribution to the extracted cross sections, so tens of fb can explain the enhancements. Belle II can test this mechanism through full reconstruction and searches for missing charmonia in open charm modes.","authors":"Cheng-Xi Liu, Tian-Le Gao, Cheng-Ping Shen, Xiang Liu","nlinked":44,"nref":45,"src":"INSPIRE","html":true},{"id":"3201080","arxiv": ,"c"],[68,21,"c"],[13,68,"k"],[21,80,"c"],[37,80,"c"],[50,67,"c"],[2,69,"k"],[44,72,"c"],[12,51,"c"],[9,70,"k"],[62,33,"c"],[43,22,"c"],[10,71,"k"],[50,80,"c"],[62,41,"c"],[1,72,"c"],[21,37,"c"],[7,73,"c"],[0,37,"c"],[17,79,"c"],[23,22,"c"],[50,17,"c"],[0,74,"c"],[18,33,"c"],[63,33,"c"],[76,33,"c"],[80,60,"c"],[51,60,"c"],[36,52,"c"],[39,33,"c"],[78,75,"c"],[20,18,"c"],[11,22,"k"],[0,75,"c"],[3,76,"k"],[20,19,"c"],[66,57,"c"],[32,44,"c"],[16,22,"c"],[19,18,"c"],[48,33,"c"],[6,77,"c"],[60,75,"c"],[63,38,"c"],[44,66,"c"],[13,21,"c"],[0,78,"k"],[0,79,"c"],[63,39,"c"],[0,80,"c"],[33,67,"c"],[38,17,"c"],[63,75,"c"],[42,41,"c"],[78,41,"c"],[49,57,"c"]],"next":[{"arxiv":"2611.06799","id":"3223105","title":"Ground-State Heavy-Baryon Mass Spectrum in the Relativistic Independent Quark Model","authors":"Divyajyoti Pandey, Kalpalata Dash, Sanjay Kumar Swain","score":8.6,"section":"new","rank":16,"parts":[0.06,0.01,0.06,0.0,0.52],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.00, 1 shared references). Closest network paper: [[3213801]] (coupling 0.02, 4 shared references). Shared topics: dirac particle.","abstract":"We extend our work to compute the ground-state baryon mass spectrum containing charm and bottom quarks in the relativistic independent quark (RIQ) model with an average flavor--independent confining potential in equally mixed scalar--vector harmonic form. Each quark moves as a Dirac particle inside the potential. The resulting core mass is then corrected perturbatively, accounting for the pion self-energy, pion exchange, and pairwise color--electric and color--magnetic one-gluon exchange. Six input parameters common to every baryon: the potential parameters (confinement strength, the potential offset) and the $u(=d)$, $s$, $c$, and $b$ constituent quark masses are optimized using a few experimentally measured baryon states. The model then uses these optimized parameters to predict the mass spectra of doubly heavy, mixed-$bc$, and triply heavy baryons. We compare our predictions with lattice QCD, relativistic quark model results, and available experimental measurements. Our results are consistent with these model predictions and experimental results."},{"arxiv":"2611.06755","id":"3223116","title":"Earthquake Forecast via Neutrino Tomography at the DUNE Baseline","authors":"Bipin Singh Koranga, Samrat Vashisht, Vivek Kumar Nautiyal","score":7.2,"section":"new","rank":17,"parts":[0.06,0.08,0.14,0.0,0.09],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[796080]] (coupling 0.03, 1 shared references). Closest network paper: [[625792]] (coupling 0.05, 7 shared references).","abstract":"We investigate the sensitivity of accelerator-based neutrino oscillations to localized electron-density enhancements associated with seismic fault zones along the Fermilab SURF baseline of the Deep Underground Neutrino Experiment (DUNE). Motivated by the reactor antineutrino proposal of Wang, Chen, and Li, we model the anomaly as a uniform-density slab embedded in the surrounding crust and calculate exact three flavour oscillation probabilities using layer by layer evolution. Our results show that localized density enhancements can produce measurable variations in muon-to-electron appearance probabilities for both neutrinos and antineutrinos, with potentially significant relative effects. The predicted variations exhibit weak dependence on the leptonic CP violating phase, suggesting that time-differential measurements may help reduce uncertainties associated with the unknown CP phase. However, the event statistics required for a statistically significant detection substantially exceed those expected during a short-duration precursor interval. Consequently, detecting sufficiently persistent density anomalies may be possible under favourable conditions, whereas short-term earthquake forecasting is not feasible with the nominal DUNE configuration. Our findings establish a theoretical framework for exploring localized Earth-density perturbations through long-baseline neutrino oscillations."},{"arxiv":"2611.05747","id":"3222983","title":"The Cosmology of Hawking Axions","authors":"Abdelaziz Hussein, Gordan Krnjaic, Sarunas Verner","score":7.1,"section":"new","rank":18,"parts":[0.0,0.05,0.38,0.0,0.0],"note":"Closest of your papers: [[2855387]] (coupling 0.02, 2 shared references). Closest network paper: [[2693756]] (coupling 0.13, 12 shared references).","abstract":"Since primordial black holes (PBH) are always non-relativistic, their cosmological energy fraction grows relative to that of radiation. Thus, for even a tiny initial PBH abundance, the universe generically enters an epoch of early matter domination, which ends when the PBH evaporate to restore the hot big bang. We consider the possibility that a PBH dominated era yields a population of boosted axion-like particles (ALPs) produced from Hawking evaporation. Eventually these ``Hawking axions\" become non-relativistic and decay to photons, which can affect various cosmological and astrophysical observables. Here we place new constraints on these particles through their impact on big bang nucleosynthesis, cosmic microwave background, large-scale structure, and X-ray observables. Furthermore, if Hawking axions remain relativistic through recombination, then depending on the progenitor PBH mass, they contribute $ΔN_{\\rm eff}\\simeq0.05$-$0.11$, which may be observable with future CMB probes."},{"arxiv":"2611.05504","id":"3222939","title":"Gravitational waves flooding the Universe after wall domination","authors":"Sabir Ramazanov, Zhen-Min Zeng","score":6.5,"section":"cross","rank":19,"parts":[0.0,0.05,0.34,0.0,0.0],"note":"Closest of your papers: [[2690106]] (coupling 0.02, 1 shared references). Closest network paper: [[2828434]] (coupling 0.12, 10 shared references).","abstract":"We discuss a possible early Universe scenario, where radiation era is interrupted by the epoch of domination of domain walls eventually annihilating into particles. During this period the Universe undergoes accelerated expansion, while the comoving correlation length of the domain wall network remains constant. The network serves as a source of tensor modes, which get frozen upon exiting the horizon similarly to the case of inflationary fluctuations. The modes re-enter the horizon during the subsequent stage of radiation domination and since then contribute to the gravitational wave background. The spectral shape of gravitational waves predicted in this scenario is markedly different compared to the case of domain walls remaining sub-dominant all the way till annihilation. These gravitational waves are strong enough to be observed with present-day and future facilities in a broad range of frequencies. In particular, their energy density is sufficient to produce a significant impact on the effective number of neutrino species, unless the duration of wall domination is suitably constrained."},{"arxiv":"2611.03373","id":"3222389","title":"Towards AI-Agent-Accelerated Research in High-Energy Physics: A Case Study in Monte Carlo Analysis","authors":"Tianqi Gao, Ruobing Jiang","score":6.2,"section":"replacement","rank":20,"parts":[0.0,0.13,0.16,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.04, 4 shared references). Closest network paper: [[1971314]] (coupling 0.05, 2 shared references).","abstract":"We investigate how far contemporary LLM-based agents can participate in multistep computational high-energy-physics research under reproducible human supervision. Using a previously published CEPC Bell-observable analysis in $e^+e^- \\to ZH$, $Z \\to q\\bar q$, $H \\to ZZ^* \\to 4μ$ as a case study, we test two capabilities. First, the agent performs an instruction-constrained reproduction: it is explicitly instructed not to use the published numerical results as analysis targets, although no technical information-access barrier is imposed. The analysis definition is fixed before the formal comparison, and the resulting detector-level $I_3$ central values reproduce the four published benchmark points to within about 2% without retuning to those values. Second, the agent is used for an open-ended extension with no target answer supplied. Using 200,000 fast-simulated events, a stage-resolved audit identifies muon isolation as the largest single contribution to the hard-to-detector shift, and subsequent diagnostics connect the effect to angle-dependent isolation efficiency, proximity to the hard $Z \\to q\\bar q$ system, and mixed electromagnetic activity from muon final-state radiation and hadron decays. Throughout, the agent assists with workflow planning, code and configuration inspection, Monte Carlo production, anomaly diagnosis, control construction, statistical analysis, and result organization, while state-changing actions and final interpretation remain under human control. The study shows that the value of AI agents in HEP may lie not only in faster code generation, but in faster scientific iteration, and motivates systematic benchmarking across historical HEP analyses using correctness, human intervention, and researcher-time efficiency as explicit metrics."},{"arxiv":"2611.05465","id":"3222896","title":"Probing Heavier-Baryon Oscillations through Light-Baryon Mixing","authors":"Arnau Bas i Beneito, Svjetlana Fajfer, Alexey A. Petrov","score":6.0,"section":"new","rank":21,"parts":[0.0,0.06,0.29,0.0,0.0],"note":"Closest of your papers: [[1222142]] (coupling 0.02, 2 shared references). Closest network paper: [[2053590]] (coupling 0.10, 20 shared references).","abstract":"Motivated by the existing direct limits on $Ξ_b^0$ and $Ξ_c^0$ oscillations, we investigate how Standard Model weak interactions connect baryon-number-violating mixing in heavy neutral baryons to the much more strongly constrained neutron-antineutron and $Λ-\\barΛ$ mixing. We focus on $Ξ_b^0$, $Λ_b^0$, $Ξ_c^0$, and $Ω_c^0$ oscillations and derive indirect constraints on their mass-mixing parameters from existing limits on $n-\\bar n$ oscillations and on $Λ-\\barΛ$ mixing, the latter inferred from dinucleon-decay searches. The weak baryon-to-baryon transition amplitudes are estimated by saturating the relevant hadronic correlators with low-lying intermediate baryons. The required weak vertices are modelled using semileptonic form factors from lattice QCD, quark models, and QCD sum rules. Since these form factors must be continued outside their physical semileptonic domains and the resulting loop integrals depend on a UV cutoff, our results are order-of-magnitude estimates subject to sizeable hadronic uncertainties. For a benchmark cutoff of $10~{\\rm GeV}$, the indirect bounds on the $Ξ_b^0$ and $Ξ_c^0$ mixing parameters are roughly three and five orders of magnitude stronger than the direct LHCb and Belle limits, indicating that light-baryon $|ΔB|=2$ searches can probe heavy-baryon oscillations far beyond present direct sensitivities."},{"arxiv":"2607.02649","id":"3177405","title":"EFT Validity and Truncation Uncertainty from few Nuisance Parameters","authors":"Benoît Assi, Adam Martin, William Shepherd","score":6.0,"section":"replacement","rank":22,"parts":[0.06,0.06,0.15,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1671831]] (coupling 0.02, 3 shared references). Closest network paper: [[2630211]] (coupling 0.05, 4 shared references).","abstract":"An observable in an Effective Field Theory (EFT) is an expansion in a set of small parameters, no different than any other perturbation series. Truncating such a series expansion leaves the leading dropped term as the dominant source of error, and that term itself contains a calculable portion. We explore the partial calculation of this next-order error, available at dim-6$^2$ in SMEFT with no additional tools needed to simulate it, and explore how to efficiently use that partial calculation to model the next-order uncertainty in full using a minimal number of nuisance parameters. This estimate of the uncertainty of the EFT signal rate naturally imposes EFT validity by ensuring that bounds are driven by kinematic regions where truncation uncertainties are parametrically smaller than the signal. We incorporate the calculable dim-6$^2$ piece into the signal and cover the remaining higher-dimension uncertainty with a small set of nuisance parameters derived from a scan over Wilson-coefficient values. Our algorithm to determine the relevant nuisance parameters and distributions is automation-friendly and applies to arbitrary truncation choices. We then provide multiple examples of its implementation in high-energy collider processes focused on SMEFT truncated at $\\mathcal{O}(Λ^{-2})$, where the dim-6$^2$ piece is used to estimate the full $\\mathcal O(Λ^{-4})$ dependence. In the examples considered here the reduction of nuisance parameters is appreciable, generically reducing the nuisance parameter count by an order of magnitude compared to naive estimates."},{"arxiv":"2611.05491","id":"3222980","title":"Quantum computing for high energy nuclear physics","authors":"João Barata","score":5.9,"section":"cross","rank":23,"parts":[0.0,0.0,0.19,0.0,0.31],"note":"Closest network paper: [[3157653]] (coupling 0.07, 21 shared references). Shared topics: collider phenomenology.","abstract":"Quantum information science (QIS) offers a new set of conceptual and computational tools ideally suited to exploring the many-body, out-of-equilibrium, and real-time properties of strongly interacting quantum systems. These themes find a natural counterpart in high energy nuclear physics, whose central goal is to describe the properties of Quantum Chromodynamics (QCD), the theory of the strong interaction, under extreme conditions. Relevant examples range from the formation and internal structure of hadrons, to the collective and thermalization dynamics of strongly interacting QCD matter, and the properties of complex many-body scattering processes. Although tremendous progress has been made over the past decades in our understanding of QCD in the nuclear physics context, through perturbative methods, lattice QCD, and effective theory descriptions, phenomena that are intrinsically connected to real-time dynamics, highly entangled many-body evolution, or finite density regimes remain only partially accessible with existing approaches. In this article, we argue that QIS can help realize a new paradigm for addressing these open questions. With the aim of making the discussion accessible to both high energy nuclear physics and QIS audiences, we provide an overview of selected open problems in high energy nuclear physics, with emphasis on aspects motivated by collider phenomenology, and discuss how they can be approached using QIS tools. This connection is illustrated through representative examples drawn from the recent literature, making the case that QIS can become a driving force for discovery in nuclear physics in the coming years."},{"arxiv":"2611.05453","id":"3222912","title":"The Search for the Top Quark","authors":"Paul D. Grannis","score":5.7,"section":"cross","rank":24,"parts":[0.0,0.11,0.17,0.0,0.0],"note":"Closest of your papers: [[483425]] (coupling 0.04, 2 shared references). Closest network paper: [[3213801]] (coupling 0.06, 6 shared references).","abstract":"The discovery of the top quark in 1995 completed the roster of the matter particles, quarks and leptons, expected in the Standard Model and in many of its suggested extensions. However, the top quark does not conform to the pattern set by its sister quarks and has come to be a critical component of the ongoing searches for physics beyond the prevailing paradigm. (Prepared for the Proceedings of the 4th International Symposium on the History of Particle Physics, CERN, Nov. 2025.)"},{"arxiv":"2605.30404","id":"3162977","title":"Leptonic CP Phase Determination from Fisher Information in T2K and NO$ν$A","authors":"Neetu Raj Singh Chundawat, Luis A. Delgadillo, Yu-Feng Li","score":5.7,"section":"replacement","rank":25,"parts":[0.06,0.02,0.14,0.0,0.09],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1854224]] (coupling 0.01, 1 shared references). Closest network paper: [[3158607]] (coupling 0.05, 7 shared references).","abstract":"The precise determination of the leptonic CP phase $δ_{\\rm CP}$ remains one of the central objectives of current and future long-baseline (LBL) neutrino oscillation experiments. Quantum estimation theory provides a natural framework to quantify the ultimate precision limits for estimating physical parameters encoded in quantum states. In this work, we employ the quantum Fisher information to investigate how much information about $δ_{\\rm CP}$ is intrinsically encoded in neutrino states and how efficiently it is extracted in present LBL experiments such as T2K and NO$ν$A. We first analyze the intrinsic quantum sensitivity of neutrino and antineutrino states and demonstrate how matter effects generate a neutrino mass-ordering dependent information structure. To compare the intrinsic information content of the quantum state with the information experimentally accessible through flavor measurements, we compute the event-level Fisher information from reconstructed event spectra using Poisson statistics including backgrounds and systematics. We find that both experiments extract only a small fraction of the total information available in the underlying quantum state. This extraction efficiency becomes particularly suppressed near maximally CP-violating regions, where the reconstructed event spectra exhibit reduced sensitivity to small variations in $δ_{\\rm CP}$. We also apply the same framework to the reactor mixing angle $θ_{13}$, providing a benchmark for comparison with the estimation of $δ_{\\rm CP}$. Our analysis provides a complementary information-theoretic perspective on precise estimation of oscillation parameters in LBL neutrino experiments."},{"arxiv":"2611.05444","id":"3222903","title":"Photon-Counting Readout via Electro-Optic Microwave-to-Optical Transduction for Axion Haloscopes","authors":"Jing Wu, Raphael Cervantes, Doga Murat Kurkcuoglu, Zheshen Zhang, Silvia Zorzetti","score":5.4,"section":"new","rank":26,"parts":[0.0,0.09,0.14,0.0,0.07],"note":"Closest of your papers: [[1607572]] (coupling 0.03, 3 shared references). Closest network paper: [[1843058]] (coupling 0.05, 5 shared references).","abstract":"Axion dark matter searches require highly sensitive detection schemes with high scan rate to efficiently explore the parameter space. Building upon the conventional Sikivie haloscope, where axions convert into microwave photons inside a magnetic-field-immersed resonant cavity, we present a photon-counting scheme based on an electro-optic microwave-to-optical transducer. Through a comprehensive theoretical model under realistic experimental constraints, we find that the optimal operating regime employs an overcoupled microwave cavity, trading peak transduction efficiency for reduced transducer noise. Furthermore, combining parameters already demonstrated in existing devices, in a device with optimized extrinsic coupling rates, would yield a scan-rate enhancement of 5-10 relative to quantum-limited homodyne detection. Improvements in quality factors, coupling rates, and thermal management push this enhancement beyond 50. While our quantitative model is benchmarked at 9 GHz, the scheme adapts well to haloscopes across the 5-12 GHz range, where shrinking cavity volumes severely degrade the achievable scan rate. These results demonstrate the potential of electro-optical photon detection as a high-speed detection technique for axion dark matter searches."},{"arxiv":"2611.05500","id":"3222924","title":"SMEFT Constraints on Top Electroweak Couplings and a Composite Higgs Interpretation","authors":"Leandro Da Rold, Juan Fernandez","score":5.1,"section":"new","rank":27,"parts":[0.06,0.05,0.11,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1116165]] (coupling 0.02, 1 shared references). Closest network paper: [[3193100]] (coupling 0.04, 40 shared references).","abstract":"Recent LHC measurements of $tWZ$, $t\\bar t Z$ and single top production provide complementary probes of top quark electroweak interactions. We incorporate these measurements into a global Standard Model effective field theory analysis of 46 independent dimension-six Wilson coefficients at linear order. The updated fit remains compatible with the Standard Model at $95\\%$ CL, and favors negative values of $C_{Hq}^{(-)}\\equiv C_{Hq}^{(1)}-C_{Hq}^{(3)}$ and $C_{Ht}$, with central values suggestive of TeV scale new physics. We also present an effective composite Higgs model based on a two-site description that realizes this pattern of Wilson coefficients through partial compositeness. The model includes custodial symmetry and protection of the $Z\\bar b_L b_L$ coupling. A fermion bitriplet generates the required left-handed shift, and an additional embedding of the right-handed top allows negative contributions to $C_{Ht}$ from both fermion and spin-one exchange. Scanning four right-handed top embeddings, we find parameter regions within the $68\\%$ CL contour that are compatible with electroweak precision data, Higgs coupling measurements and applicable direct searches. The $T$ parameter limits the negative fermionic contribution to $C_{Ht}$, favoring a spin-one contribution of comparable or greater magnitude. Larger $SU(2)_R$ representations extend the reach toward negative $C_{Ht}$, and also enhance four-quark interactions that increase the four-top cross section, in the direction favored by current measurements. The mechanism connects the preferred top electroweak shifts to complementary tests through single production of quarks with electric charge $-4/3$, modified Higgs couplings and four-top production."},{"arxiv":"2610.42103","id":"3223702","title":"Charge Pumping Leptogenesis from the Symmetric Mass Generation Phase on a Four-Leg Ladder Lattice","authors":"Runze Chi, Meng Zeng, Tao Xiang, Yi-Zhuang You, Bertrand I. Halperin, Juven Wang","score":5.1,"section":"cross","rank":28,"parts":[0.06,0.06,0.09,0.0,0.0],"note":"Also cites widely used network papers: [[779828]]. Closest of your papers: [[922002]] (coupling 0.02, 2 shared references). Closest network paper: [[3157653]] (coupling 0.03, 6 shared references).","abstract":"Quantized charge pumping in quantum Hall systems is a bulk topological property, typically manifesting on gapless boundaries as spectral flow through chiral edge modes upon flux insertion. When the boundary is anomaly-free, it can be symmetrically gapped by symmetric mass generation (SMG) interactions. However, the effects on quantized charge pumping at an interacting gapped boundary are unclear. We address this using density-matrix renormalization group simulations of a four-leg ladder quasi-(2+1)d realization of the (1+1)d 3-4-5-0 lattice chiral fermion model with six-fermion interactions at one edge. We find gapless modes near the interacting edge for both weak and strong couplings, but the edge can be in a fully gapped SMG phase at intermediate coupling. We also identify spontaneous breaking of the model's $\\mathbb{Z}_2$ symmetry above a critical interaction strength. Across all three boundary phases, we find quantized charge pumping with the same pumped charge per flux quantum. The spatial distribution of the pumped charge varies between phases. Besides charge pumping, we study how a single injected fermion propagates under open boundary conditions. In the SMG phase, an interaction-induced flavor-mixing current develops at the endpoints of the gapped edge, which is absent in the weak- and strong-coupling limits. This current reveals a charge-redistribution mechanism unique to the SMG phase. Additionally, we propose an analogy between charge pumping in this model and a topological leptogenesis scenario in the (3+1)d Standard Model. The anomaly-free chiral U(1) symmetries of the 3-4-5-0 model play a role analogous to the baryon-minus-lepton symmetry of the Standard Model. In both settings, charge pumping can be associated with a continuous deformation along a classically defined but quantum-anomalous direction, while a discrete subgroup remains an exact quantum symmetry."},{"arxiv":"2610.20611","id":"3215209","title":"A global analysis of ${\\bar B}\\to DP$ and ${\\bar B} \\to {\\bar D} P$ decays","authors":"Bhubanjyoti Bhattacharya, Rida Boumris, David London","score":5.0,"section":"replacement","rank":29,"parts":[0.06,0.02,0.16,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[1391029]] (coupling 0.05, 5 shared references).","abstract":"Recently, a fit to the 10 measured branching ratios of ${\\bar B} \\to D P$ decays ($B = \\{B^+, B^0, B_s^0\\}$, $D = \\{D^0, D^+, D_s^+\\}$, $P \\in \\{ π, K\\}$) was performed under the assumption of flavor SU(3) symmetry [SU(3)$_F$]. A terrible fit was found: there was a $> 5σ$ disagreement with the SU(3)$_F$ limit of the Standard Model [SM$_{\\rm{SU(3)}_F}$]. It was also found that this discrepancy can be removed by adding $\\sim 20\\%$ SU(3)$_F$-breaking effects. Now, the ${\\bar B} \\to D^0 P$ amplitudes can contribute to other observables (direct and indirect CP asymmetries) if they interfere with the amplitudes for ${\\bar B} \\to {\\bar D}^0 P$ decays. This happens if the $D^0$ and ${\\bar D}^0$ decay to the same final state (e.g., $K^+ K^-$, $π^+ π^-$, $K^\\pm π^\\mp$, etc.). In this paper, we perform a combined fit of ${\\bar B} \\to D P$ and ${\\bar B} \\to {\\bar D} P$ decays, including all observables. We again find a $> 5σ$ disagreement with the SM$_{\\rm{SU(3)}_F}$, and we find that the data can be explained if $\\sim 60\\%$ SU(3)$_F$-breaking effects are included."},{"arxiv":"2512.21761","id":"3095826","title":"Differentiable Principal-Value Inversion for Neural-Network Extraction of Generalized Parton Distributions","authors":"Dima Watkins, Ishara Fernando, Dustin Keller","score":4.8,"section":"replacement","rank":30,"parts":[0.0,0.02,0.05,0.0,0.33],"note":"Closest of your papers: [[1455793]] (coupling 0.01, 1 shared references). Closest network paper: [[3193100]] (coupling 0.02, 14 shared references). Shared topics: discrete symmetry.","abstract":"We present a neural-network method for reconstructing generalized parton distributions (GPDs) from Compton form factors (CFFs). The network represents quark singlet, nonsinglet, and gluon distributions at a common reference scale. Next-to-leading-order QCD evolution and hard-scattering coefficients connect these distributions to CFFs at the measured scales. Discrete symmetries are imposed exactly, and polynomiality is constrained for a finite set of Mellin moments while leaving their allowed coefficients free. In a noiseless closure test with 45 complex-CFF input positions, the reconstructed charge-weighted quark GPD has a relative $L^2$ error of $4.90\\%$ over the evaluation domain. Real- and imaginary-CFF prediction errors at 512 kinematic positions excluded from the fit are $0.75\\%$ and $2.75\\%$. Tests using only real CFFs at 160 experimental coordinates give GPD errors of $0.75\\%$ and $3.05\\%$ for two network initializations with exact inputs; these increase to $32.7\\%$ and $49.2\\%$ for one fixed perturbation at the quoted experimental error scale. For experimentally extracted CFFs, we reconstruct GPDs from the mean of 32 smooth CFF replica functions and from two individual replicas. The resulting GPD shapes depend on both the input fluctuations and the number of optimization iterations. These results demonstrate a working NLO reconstruction method and quantify the contrast between exact-input recovery and reconstruction with uncertain inputs."},{"arxiv":"2611.05474","id":"3222925","title":"Dynamics of self-gravitating halos with decaying dark matter","authors":"Anna Bencke, Marc Kamionkowski, Annika H. G. Peter, Juniper Morales","score":4.6,"section":"cross","rank":31,"parts":[0.0,0.08,0.1,0.0,0.07],"note":"Closest of your papers: [[2859009]] (coupling 0.03, 2 shared references). Closest network paper: [[1989085]] (coupling 0.04, 4 shared references).","abstract":"We study the evolution of self-gravitating spherical dark matter halos composed of dark matter particles that decay to a slightly less massive particle and a massless particle. The small kick velocity imparted to the daughter particle upon decay heats the halo. If the kick velocity is small compared with the characteristic velocity, the halo remains bound but puffs out. We also consider, for the first time, decaying halos with anisotropic initial conditions and find non-negligible effects on the resulting density profile. To simulate the halo evolution, we utilize the recently developed \\texttt{NSphere} code across a broad range of decay times and kick velocities. We train an emulator to provide a mapping between the decay parameters and the relaxed density profile. We discuss how the resulting halo-scale signatures complement existing cosmological constraints on decaying dark matter and can be tested by upcoming surveys."},{"arxiv":"2611.06329","id":"3223029","title":"Primordial Black Holes and Induced Gravitational Waves from Inflation with History-Dependent Effective Dissipation","authors":"Narges Rashidi","score":4.5,"section":"cross","rank":32,"parts":[0.0,0.04,0.18,0.0,0.07],"note":"Closest of your papers: [[2855387]] (coupling 0.01, 2 shared references). Closest network paper: [[2693756]] (coupling 0.06, 7 shared references).","abstract":"We study inflation with an exponential factor multiplying the scalar Lagrangian and depending on the accumulated expansion history through a field-dependent coupling. Variation of the complete action on a finite interval yields an adjoint response with a final-time boundary condition. We derive the background and coupled scalar perturbation equations and examine five benchmarks for an exponential plateau potential and a smooth single-window coupling. The kinetic, direct-coupling and adjoint contributions nearly cancel, producing transient positive minima of the first Hubble slow-roll parameter, $ε_1$, without a comparable reduction in field velocity. The scalar spectra, normalized to the cosmic microwave background (CMB) pivot amplitude, develop localized peaks with amplitudes $0.033$--$0.098$. Under Gaussian statistics and the adopted radiation-era collapse prescription, the the primordial black hole (PBH) abundance peaks span masses from $4.52\\times10^{-13}$ to $34.05\\,M_\\odot$. The lightest-mass benchmark reaches $f_{\\rm PBH}\\simeq0.99$, allowing nearly all dark matter within the monochromatic approximation. The accompanying scalar-induced gravitational-wave spectra span peak frequencies from $6.78\\times10^{-10}$ to $5.92\\times10^{-3}\\,\\mathrm{Hz}$, with selected benchmarks lying within the projected sensitivities of future detectors."},{"arxiv":"2604.06541","id":"3141855","title":"Quantum-Inspired Tensor Network Autoencoders for Anomaly Detection: A MERA-Based Approach","authors":"Emre Gurkanli, Michael Spannowsky","score":4.3,"section":"replacement","rank":33,"parts":[0.0,0.06,0.17,0.0,0.0],"note":"Closest of your papers: [[1627633]] (coupling 0.02, 2 shared references). Closest network paper: [[3171459]] (coupling 0.06, 8 shared references).","abstract":"We investigate whether a multiscale tensor-network architecture provides a useful inductive bias for reconstruction-based anomaly detection in collider jets. Jets are produced by a branching cascade, so their internal structure is naturally organised across angular and momentum scales. This motivates an autoencoder that compresses information hierarchically and can reorganise short-range correlations before coarse-graining. Guided by this picture, we formulate a Multiscale Entanglement Renormalization Ansatz (MERA)-inspired autoencoder acting on ordered jet constituents. To our knowledge, a MERA-inspired autoencoder has not previously been proposed, and this architecture has not been explored in collider anomaly detection. We compare this architecture to a dense autoencoder, the corresponding tree-tensor-network limit, and classical baselines within a background-only reconstruction framework. The paper is organised around two main questions: whether locality-aware hierarchical compression is genuinely supported by the data, and whether the disentangling layers of MERA contribute beyond a simpler tree hierarchy. To address these questions, we combine benchmark comparisons with a training-free local-compressibility diagnostic and a direct identity-disentangler ablation. In the nominal benchmark, the MERA-inspired model attains a higher mean AUC than the dense autoencoder at all three latent dimensions while using roughly one-third of its trainable parameters. The locality-preserving multiscale structure is well matched to jet data, and, at the strongest compression bottleneck, the trained disentanglers move substantially away from the identity and are accompanied by a positive mean performance shift. Overall, the study supports locality-aware hierarchical compression as a useful and parameter-efficient inductive bias for reconstruction-based jet anomaly detection in this benchmark setting."},{"arxiv":"2611.05463","id":"3222932","title":"Top Spin and CP from Equivariant Transformers","authors":"Henning Bahl, Marco Menen, Antoine Petitjean, Tilman Plehn","score":4.2,"section":"new","rank":34,"parts":[0.0,0.05,0.17,0.0,0.0],"note":"Closest of your papers: [[1627633]] (coupling 0.02, 3 shared references). Closest network paper: [[2893828]] (coupling 0.06, 7 shared references).","abstract":"Measurements of spin correlations and CP are an exciting and challenging part of the precision-LHC program. We first show how L-GATr-slim, as a Lorentz-equivariant transformer, significantly boosts the spin analyzing power for hadronic top quarks. We then show how adding a pseudoscalar channel to its architecture allows us to learn and interpret optimal observables and their CP properties. We demonstrate this for WBF-Higgs production at parton level and top pair production including detector effects."},{"arxiv":"2611.06769","id":"3223115","title":"Born spreading with consistent shower starting scales in MC@NLO and FxFx merging","authors":"Rikkert Frederix, Paolo Torrielli","score":3.9,"section":"new","rank":35,"parts":[0.0,0.02,0.22,0.0,0.0],"note":"Closest of your papers: [[1615477]] (coupling 0.01, 1 shared references). Closest network paper: [[3206672]] (coupling 0.08, 7 shared references).","abstract":"Negative weights are a major cost in NLO event generation matched to parton showers at the LHC, as they increase the number of events needed for a given statistical precision. Born spreading reduces the fraction of negative-weight $\\mathbb S$ events in MC@NLO by redistributing the Born contribution over the radiation variables. It introduces no bias only if everything that is passed to the parton shower together with $\\mathbb S$ events depends on Born-level quantities alone. We show that the same condition is needed for the MC counterterms to reproduce the first shower emission, independently of how the radiation phase space is integrated. In MadGraph5_aMC@NLO, the $\\mathbb S$-event starting scales did not fully satisfy this condition, which so far prevented the public release of Born spreading. We present a new and consistent construction of the starting scales for ordinary MC@NLO, FxFx merging and MC@NLO-$Δ$, with which Born spreading is now publicly available, including for merged samples. We also study modified formulations of the MC counterterms, and FxFx-merged $W$+jets production with up to two jets at NLO, for which Born spreading reduces the fraction of negative weights after merging without affecting the predictions, and the event samples are generated six times faster than with the former implementation."}],"refs":{"3154758":{"first":"Echeverria","year":2026,"nauth":4,"title":"Dark matter as a source for lepton flavor violation","role":"other"},"1249404":{"first":"Restrepo","year":2013,"nauth":3,"title":"Models with radiative neutrino masses and viable dark matter candidates","role":"seed"},"2842150":{"first":"Qureshi","year":2024,"nauth":4,"title":"Probing light scalars and vector-like quarks at the high-luminosity LHC","role":"other"},"3213801":{"first":"Ferrando Solera","year":2026,"nauth":1,"title":"Chiral Symmetries in the Standard Model of Particle Physics and its Extensions","role":"other"},"2662299":{"first":"Choudhury","year":2023,"nauth":4,"title":"Bilinear R-parity violating supersymmetry under the light of neutrino oscillation, Higgs and flavor data","role":"other"},"1455793":{"first":"von der Pahlen","year":2016,"nauth":4,"title":"Radiative Type III Seesaw Model and its collider phenomenology","role":"seed"},"796080":{"first":"de Campos","year":2008,"nauth":5,"title":"Finding the Higgs Boson through Supersymmetry","role":"seed"},"1671831":{"first":"Abdullah","year":2018,"nauth":5,"title":"Probing a simplified, $W^{\\prime}$ model of $R(D^{(\\ast)})$ anomalies using $b$-tags, $\\tau$ leptons and missing energy","role":"seed"},"651654":{"first":"Barbier","year":2004,"nauth":11,"title":"R-parity violating supersymmetry","role":"other"},"611590":{"first":"Mira","year":2003,"nauth":4,"title":"Supersymmetric one family model without Higgsinos","role":"seed"},"1116165":{"first":"Cardenas","year":2012,"nauth":3,"title":"The role of charged Higgs boson decays in the determination of tan β-like parameters","role":"seed"},"1118587":{"first":"de Campos","year":2012,"nauth":8,"title":"Probing Neutralino Properties in Minimal Supergravity with Bilinear R-Parity Vi
