<script>
const RAW = {"n":[{"id":"3222926","arxiv":"2611.05475","title":"Complete set of bounded-from-below conditions for the $A_4$-symmetric three-Higgs-doublet model","first":"Lavoura","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[2626725]], [[2793703]]. Closest of your papers: [[1249404]] (coupling 0.05, 3 shared references). Closest network paper: [[2626725]] (coupling 0.13, 5 shared references).","score":33.9,"rank":1,"section":"new","parts":[0.7,0.13,0.36,0.0,0.0],"abstract":"We derive bounded-from-below necessary conditions for the scalar potential of an $A_4$-invariant three-Higgs-doublet model. The field Ansätze that we have used were devised with the help of Claude. Testing our set of conditions on $10^6$ random potentials, that in parallel we minimize by brute force using the Mathematica package StableWein, we find that the set seems to be necessary and sufficient for boundedness-from-below.","authors":"Luís Lavoura, André Milagre","nlinked":36,"nref":37,"src":"INSPIRE","html":true},{"id":"3222920","arxiv":"2611.05685","title":"Probing CP Violation in the Complex 2HDMS with a 95 GeV Scalar at Future $e^+e^-$ Colliders","first":"Lahiri","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2666538]]. Closest of your papers: [[1746620]] (coupling 0.02, 4 shared references). Closest network paper: [[2666538]] (coupling 0.30, 24 shared references).","score":30.9,"rank":2,"section":"new","parts":[0.45,0.07,0.87,0.0,0.0],"abstract":"In this study, we investigate the prospects for probing CP violation in the complex singlet extension of the two-Higgs-doublet model (2HDM) at future electron-positron colliders. In extended scalar sectors, cancellations among different contributions to electric dipole moments (EDMs) can relax the stringent constraints on CP-violating phases, potentially bringing them in the current reach of collider experiments. We consider a scenario in which both the 125 GeV Higgs boson and the additional scalar associated with the reported 95 GeV excess are CP-mixed states. We probe the CP-violating phase of the 95 GeV scalar through its production via Higgsstrahlung and subsequent decay into a tau-lepton pair, using a CP-sensitive forward-backward asymmetry in hadronic and semileptonic tau-decay channels. We estimate the sensitivity at future lepton colliders, namely the ILC, FCC-ee, and CEPC, and investigate the impact of the Standard Model Drell-Yan background. We find that the hadronic channel offers greater sensitivity than the semileptonic channel. We also compare our results with existing constraints and future projections for CP violation in the 125 GeV Higgs sector and briefly discuss the implications for electroweak baryogenesis. Our results highlight the potential of future lepton colliders to probe CP violation in extended scalar sectors while remaining consistent with current EDM constraints.","authors":"Jayita Lahiri, Cheng Li, Gudrid Moortgat-Pick","nlinked":88,"nref":90,"src":"INSPIRE","html":true},{"id":"3222948","arxiv":"2611.05501","title":"Indirect probes of heavy neutral leptons through the dipole portal at FCC-ee","first":"Vignaroli","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2937257]]. Closest of your papers: [[1746620]] (coupling 0.02, 3 shared references). Closest network paper: [[3073459]] (coupling 0.13, 22 shared references).","score":23.1,"rank":3,"section":"new","parts":[0.45,0.06,0.37,0.0,0.0],"abstract":"We study indirect probes of the gauge-invariant dipole portal of Majorana heavy neutral leptons (HNLs) at FCC-ee. Virtual HNLs modify electroweak gauge-boson propagation and lepton couplings through loops with two dipole interactions. We calculate the resulting finite matching corrections and their effects on $Z$-pole observables. For real, flavour-aligned couplings, the local response is specified by four combinations of coupling shifts. Independent local ultraviolet interactions can reproduce all four, making the dipole interpretation dependent on assumptions about those interactions. With improved Standard Model predictions, FCC-ee can probe equal, same-sign hypercharge and weak dipole coefficients as small as $0.14\\,\\mathrm{TeV}^{-2}$ at an HNL mass of 1 TeV. This projection assumes dipole dominance, with independent ultraviolet coefficients set to zero at twice the HNL mass. We quantify how additional ultraviolet contributions can weaken or strengthen the sensitivity. At 1 TeV, the projected reach is competitive with HL-LHC same-sign dilepton searches for Majorana HNLs, while larger masses allow smaller dipole coefficients to be probed within the effective theory's domain of validity. Radiative Higgs decays offer a modest further improvement. The FeynRules, FeynArts and UFO models used in this analysis are publicly available at \\href{https://doi.org/10.5281/zenodo.23667622}{doi:10.5281/zenodo.23667622}.","authors":"Natascia Vignaroli","nlinked":78,"nref":78,"src":"INSPIRE","html":true},{"id":"3222915","arxiv":"2611.05464","title":"Flavour Chains at the TeV Edge","first":"Greljo","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2051195]]. Closest of your papers: [[2690106]] (coupling 0.02, 2 shared references). Closest network paper: [[2842150]] (coupling 0.06, 7 shared references). Shared topics: vector-like fermion.","score":23.1,"rank":4,"section":"new","parts":[0.45,0.06,0.17,0.0,0.28],"abstract":"We study chains of vector-like fermions that generate the Yukawa hierarchies as products of small mixings, with the Higgs coupled at a single link. Minimal Flavour Protection allows these flavour messengers to live at the TeV scale, while Higgs naturalness offers a reason to place them there: in cosmological solutions based on Higgs criticality, their large multiplicity lowers the critical point of the Higgs potential to the TeV scale. Crucially, the same Higgs interactions induce tree-level shifts in the $Z$ and $W$ couplings of light fermions. Existing LEP and SLD measurements already bound $M_F/|y_F|\\gtrsim 3$ TeV, while a future Tera-$Z$ factory such as FCC-ee could probe up to $100$ TeV. It would test the parameter space most relevant to Higgs naturalness, reaching scenarios with Higgs-mass tuning at the level of $10^{-4}$ or worse in minimal realisations. Longer chains partially alleviate this tuning but do not eliminate it, making a Tera-$Z$ factory a decisive test of the framework.","authors":"Admir Greljo, Xavier Ponce Díaz, Lia Schöneweiß","nlinked":137,"nref":141,"src":"INSPIRE","html":true},{"id":"3223096","arxiv":"2611.06643","title":"Quantum field theory treatment of the spin-flavor precession of Dirac neutrinos with diagonal magnetic moments","first":"Dvornikov","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2845531]]. Closest network paper: [[594326]] (coupling 0.04, 2 shared references). Shared topics: neutrino mass.","score":20.7,"rank":5,"section":"new","parts":[0.45,0.0,0.11,0.0,0.33],"abstract":"We apply the quantum field theory (QFT) approach to describe the spin-flavor precession of Dirac neutrinos. The magnetic moments matrix of these neutrinos is taken to be diagonal in the mass basis. Neutrino mass eigenstates are considered to be virtual particles in the QFT approach. The neutrino contribution to the matrix element of the overall process, which includes the emission, the propagation and the detection of neutrinos, is contained in the propagators of massive neutrinos. Using the recently derived propagator of a massive neutrino, which exactly accounts for the magnetic moment interaction, we derive the transition probability of the process $ν_{e\\mathrm{L}}\\toν_{μ\\mathrm{L}}$ under the influence of a magnetic field. The result is compared with the prediction of the standard quantum mechanical (QM) approach. We briefly discuss the possibility to derive the QFT corrections to the QM expressions.","authors":"Maxim Dvornikov","nlinked":16,"nref":18,"src":"INSPIRE","html":true},{"id":"1518959","arxiv":"1703.08148","title":"Fermionic triplet dark matter in an $SO(10)$-inspired left right model","first":"Arbeláez","nauth":3,"year":2017,"cites":11,"role":"seed","note":"","score":null},{"id":"2666538","arxiv":"2306.03735","title":"Scotogenic explanation for the 95 GeV excesses","first":"Escribano","nauth":3,"year":2023,"cites":37,"role":"other","note":"","score":null},{"id":"594326","arxiv":"hep-ph/0209047","title":"Standard and nonstandard neutrino properties","first":"Valle","nauth":1,"year":2002,"cites":10,"role":"other","note":"","score":null},{"id":"2937257","arxiv":"2506.15777","title":"Decoupling neutrino magnetic moment from mass with $SU(2)_L$ invariance","first":"Pagès","nauth":2,"year":2025,"cites":3,"role":"other","note":"","score":null},{"id":"1847368","arxiv":"2102.09247","title":"Flavor dependent U(1) symmetric Zee model with a vector-like lepton","first":"Matsui","nauth":3,"year":2021,"cites":5,"role":"other","note":"","score":null},{"id":"3214449","arxiv":"2610.17210","title":"Dark Matter Stability from residual flavour symmetries","first":"Landini","nauth":3,"year":2026,"cites":0,"role":"other","note":"","score":null},{"id":"2626725","arxiv":"2301.10811","title":"Discrete dark matter mechanism as the source of neutrino mass scales","first":"Bonilla","nauth":4,"year":2023,"cites":17,"role":"other","note":"","score":null},{"id":"2842150","arxiv":"2410.17854","title":"Probing light scalars and vector-like quarks at the high-luminosity LHC","first":"Qureshi","nauth":4,"year":2024,"cites":9,"role":"other","note":"","score":null},{"id":"2793703","arxiv":"2406.00188","title":"Cutting the scotogenic loop: adding flavor to dark matter","first":"Kumar","nauth":3,"year":2024,"cites":26,"role":"other","note":"","score":null},{"id":"2051195","arxiv":"2203.06680","title":"Early-Universe Model Building","first":"Asadi","nauth":40,"year":2022,"cites":55,"role":"other","note":"","score":null},{"id":"2909343","arxiv":"2504.05272","title":"Standard Model Tested with Neutrinos","first":"Atzori Corona","nauth":6,"year":2025,"cites":17,"role":"other","note":"","score":null},{"id":"2845531","arxiv":"2411.03122","title":"Neutrino Electromagnetic Properties","first":"Giunti","nauth":4,"year":2024,"cites":61,"role":"other","note":"","score":null},{"id":"3073459","arxiv":"","title":"Super-weakly coupled particles: phenomenology and neutrino mass models","first":"Beltrán Lloría","nauth":1,"year":2025,"cites":0,"role":"other","note":"","score":null},{"id":"2802335","arxiv":"2406.17861","title":"Discrete dark matter with light Dirac neutrinos","first":"Borah","nauth":4,"year":2024,"cites":25,"role":"other","note":"","score":null},{"id":"2829800","arxiv":"2409.12085","title":"Unveiling the secrets of new physics through top quark tagging","first":"Sahu","nauth":3,"year":2024,"cites":7,"role":"other","note":"","score":null},{"id":"2775441","arxiv":"2404.05704","title":"Novel collider signatures in the type-I 2HDM+a model","first":"Argyropoulos","nauth":3,"year":2024,"cites":11,"role":"other","note":"","score":null},{"id":"614714","arxiv":"","title":"Status of neutrino oscillations and nonstandard properties","first":"Valle","nauth":1,"year":2003,"cites":0,"role":"other","note":"","score":null},{"id":"1249404","arxiv":"1308.3655","title":"Models with radiative neutrino masses and viable dark matter candidates","first":"Restrepo","nauth":3,"year":2013,"cites":148,"role":"seed","note":"","score":null},{"id":"2088431","arxiv":"2205.13550","title":"Assessment of the dimension-5 seesaw portal and impact of exotic Higgs decays on non-pointing photon searches","first":"Delgado","nauth":5,"year":2022,"cites":37,"role":"other","note":"","score":null}],"e":[[0,5,"k"],[15,16,"c"],[1,6,"c"],[13,11,"c"],[8,16,"c"],[4,7,"k"],[17,23,"c"],[14,22,"c"],[18,11,"c"],[2,8,"c"],[1,9,"k"],[3,10,"k"],[0,11,"c"],[3,12,"k"],[18,13,"c"],[10,22,"c"],[0,13,"c"],[3,14,"c"],[4,15,"k"],[4,16,"c"],[2,17,"k"],[8,22,"c"],[0,18,"k"],[3,19,"k"],[1,20,"k"],[4,21,"k"],[0,22,"k"],[2,23,"k"]],"next":[{"arxiv":"2611.06799","id":"3223105","title":"Ground-State Heavy-Baryon Mass Spectrum in the Relativistic Independent Quark Model","authors":"Divyajyoti Pandey, Kalpalata Dash, Sanjay Kumar Swain","score":8.7,"section":"new","rank":6,"parts":[0.06,0.01,0.06,0.0,0.53],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.00, 1 shared references). Closest network paper: [[3213801]] (coupling 0.02, 4 shared references). Shared topics: dirac particle.","abstract":"We extend our work to compute the ground-state baryon mass spectrum containing charm and bottom quarks in the relativistic independent quark (RIQ) model with an average flavor--independent confining potential in equally mixed scalar--vector harmonic form. Each quark moves as a Dirac particle inside the potential. The resulting core mass is then corrected perturbatively, accounting for the pion self-energy, pion exchange, and pairwise color--electric and color--magnetic one-gluon exchange. Six input parameters common to every baryon: the potential parameters (confinement strength, the potential offset) and the $u(=d)$, $s$, $c$, and $b$ constituent quark masses are optimized using a few experimentally measured baryon states. The model then uses these optimized parameters to predict the mass spectra of doubly heavy, mixed-$bc$, and triply heavy baryons. We compare our predictions with lattice QCD, relativistic quark model results, and available experimental measurements. Our results are consistent with these model predictions and experimental results."},{"arxiv":"2611.06755","id":"3223116","title":"Earthquake Forecast via Neutrino Tomography at the DUNE Baseline","authors":"Bipin Singh Koranga, Samrat Vashisht, Vivek Kumar Nautiyal","score":7.3,"section":"new","rank":7,"parts":[0.06,0.08,0.14,0.0,0.09],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[796080]] (coupling 0.03, 1 shared references). Closest network paper: [[625792]] (coupling 0.05, 7 shared references).","abstract":"We investigate the sensitivity of accelerator-based neutrino oscillations to localized electron-density enhancements associated with seismic fault zones along the Fermilab SURF baseline of the Deep Underground Neutrino Experiment (DUNE). Motivated by the reactor antineutrino proposal of Wang, Chen, and Li, we model the anomaly as a uniform-density slab embedded in the surrounding crust and calculate exact three flavour oscillation probabilities using layer by layer evolution. Our results show that localized density enhancements can produce measurable variations in muon-to-electron appearance probabilities for both neutrinos and antineutrinos, with potentially significant relative effects. The predicted variations exhibit weak dependence on the leptonic CP violating phase, suggesting that time-differential measurements may help reduce uncertainties associated with the unknown CP phase. However, the event statistics required for a statistically significant detection substantially exceed those expected during a short-duration precursor interval. Consequently, detecting sufficiently persistent density anomalies may be possible under favourable conditions, whereas short-term earthquake forecasting is not feasible with the nominal DUNE configuration. Our findings establish a theoretical framework for exploring localized Earth-density perturbations through long-baseline neutrino oscillations."},{"arxiv":"2611.05747","id":"3222983","title":"The Cosmology of Hawking Axions","authors":"Abdelaziz Hussein, Gordan Krnjaic, Sarunas Verner","score":7.1,"section":"new","rank":8,"parts":[0.0,0.05,0.38,0.0,0.0],"note":"Closest of your papers: [[2855387]] (coupling 0.02, 2 shared references). Closest network paper: [[2693756]] (coupling 0.13, 12 shared references).","abstract":"Since primordial black holes (PBH) are always non-relativistic, their cosmological energy fraction grows relative to that of radiation. Thus, for even a tiny initial PBH abundance, the universe generically enters an epoch of early matter domination, which ends when the PBH evaporate to restore the hot big bang. We consider the possibility that a PBH dominated era yields a population of boosted axion-like particles (ALPs) produced from Hawking evaporation. Eventually these ``Hawking axions\" become non-relativistic and decay to photons, which can affect various cosmological and astrophysical observables. Here we place new constraints on these particles through their impact on big bang nucleosynthesis, cosmic microwave background, large-scale structure, and X-ray observables. Furthermore, if Hawking axions remain relativistic through recombination, then depending on the progenitor PBH mass, they contribute $ΔN_{\\rm eff}\\simeq0.05$-$0.11$, which may be observable with future CMB probes."},{"arxiv":"2611.05504","id":"3222939","title":"Gravitational waves flooding the Universe after wall domination","authors":"Sabir Ramazanov, Zhen-Min Zeng","score":6.7,"section":"cross","rank":9,"parts":[0.0,0.05,0.35,0.0,0.0],"note":"Closest of your papers: [[2690106]] (coupling 0.02, 1 shared references). Closest network paper: [[2828434]] (coupling 0.12, 10 shared references).","abstract":"We discuss a possible early Universe scenario, where radiation era is interrupted by the epoch of domination of domain walls eventually annihilating into particles. During this period the Universe undergoes accelerated expansion, while the comoving correlation length of the domain wall network remains constant. The network serves as a source of tensor modes, which get frozen upon exiting the horizon similarly to the case of inflationary fluctuations. The modes re-enter the horizon during the subsequent stage of radiation domination and since then contribute to the gravitational wave background. The spectral shape of gravitational waves predicted in this scenario is markedly different compared to the case of domain walls remaining sub-dominant all the way till annihilation. These gravitational waves are strong enough to be observed with present-day and future facilities in a broad range of frequencies. In particular, their energy density is sufficient to produce a significant impact on the effective number of neutrino species, unless the duration of wall domination is suitably constrained."},{"arxiv":"2611.05465","id":"3222896","title":"Probing Heavier-Baryon Oscillations through Light-Baryon Mixing","authors":"Arnau Bas i Beneito, Svjetlana Fajfer, Alexey A. Petrov","score":6.0,"section":"new","rank":10,"parts":[0.0,0.06,0.29,0.0,0.0],"note":"Closest of your papers: [[1222142]] (coupling 0.02, 2 shared references). Closest network paper: [[2053590]] (coupling 0.10, 20 shared references).","abstract":"Motivated by the existing direct limits on $Ξ_b^0$ and $Ξ_c^0$ oscillations, we investigate how Standard Model weak interactions connect baryon-number-violating mixing in heavy neutral baryons to the much more strongly constrained neutron-antineutron and $Λ-\\barΛ$ mixing. We focus on $Ξ_b^0$, $Λ_b^0$, $Ξ_c^0$, and $Ω_c^0$ oscillations and derive indirect constraints on their mass-mixing parameters from existing limits on $n-\\bar n$ oscillations and on $Λ-\\barΛ$ mixing, the latter inferred from dinucleon-decay searches. The weak baryon-to-baryon transition amplitudes are estimated by saturating the relevant hadronic correlators with low-lying intermediate baryons. The required weak vertices are modelled using semileptonic form factors from lattice QCD, quark models, and QCD sum rules. Since these form factors must be continued outside their physical semileptonic domains and the resulting loop integrals depend on a UV cutoff, our results are order-of-magnitude estimates subject to sizeable hadronic uncertainties. For a benchmark cutoff of $10~{\\rm GeV}$, the indirect bounds on the $Ξ_b^0$ and $Ξ_c^0$ mixing parameters are roughly three and five orders of magnitude stronger than the direct LHCb and Belle limits, indicating that light-baryon $|ΔB|=2$ searches can probe heavy-baryon oscillations far beyond present direct sensitivities."},{"arxiv":"2611.05491","id":"3222980","title":"Quantum computing for high energy nuclear physics","authors":"João Barata","score":6.0,"section":"cross","rank":11,"parts":[0.0,0.0,0.19,0.0,0.31],"note":"Closest network paper: [[3157653]] (coupling 0.07, 21 shared references). Shared topics: collider phenomenology.","abstract":"Quantum information science (QIS) offers a new set of conceptual and computational tools ideally suited to exploring the many-body, out-of-equilibrium, and real-time properties of strongly interacting quantum systems. These themes find a natural counterpart in high energy nuclear physics, whose central goal is to describe the properties of Quantum Chromodynamics (QCD), the theory of the strong interaction, under extreme conditions. Relevant examples range from the formation and internal structure of hadrons, to the collective and thermalization dynamics of strongly interacting QCD matter, and the properties of complex many-body scattering processes. Although tremendous progress has been made over the past decades in our understanding of QCD in the nuclear physics context, through perturbative methods, lattice QCD, and effective theory descriptions, phenomena that are intrinsically connected to real-time dynamics, highly entangled many-body evolution, or finite density regimes remain only partially accessible with existing approaches. In this article, we argue that QIS can help realize a new paradigm for addressing these open questions. With the aim of making the discussion accessible to both high energy nuclear physics and QIS audiences, we provide an overview of selected open problems in high energy nuclear physics, with emphasis on aspects motivated by collider phenomenology, and discuss how they can be approached using QIS tools. This connection is illustrated through representative examples drawn from the recent literature, making the case that QIS can become a driving force for discovery in nuclear physics in the coming years."},{"arxiv":"2611.05453","id":"3222912","title":"The Search for the Top Quark","authors":"Paul D. Grannis","score":5.8,"section":"cross","rank":12,"parts":[0.0,0.11,0.17,0.0,0.0],"note":"Closest of your papers: [[483425]] (coupling 0.04, 2 shared references). Closest network paper: [[3213801]] (coupling 0.06, 6 shared references).","abstract":"The discovery of the top quark in 1995 completed the roster of the matter particles, quarks and leptons, expected in the Standard Model and in many of its suggested extensions. However, the top quark does not conform to the pattern set by its sister quarks and has come to be a critical component of the ongoing searches for physics beyond the prevailing paradigm. (Prepared for the Proceedings of the 4th International Symposium on the History of Particle Physics, CERN, Nov. 2025.)"},{"arxiv":"2611.05444","id":"3222903","title":"Photon-Counting Readout via Electro-Optic Microwave-to-Optical Transduction for Axion Haloscopes","authors":"Jing Wu, Raphael Cervantes, Doga Murat Kurkcuoglu, Zheshen Zhang, Silvia Zorzetti","score":5.4,"section":"new","rank":13,"parts":[0.0,0.09,0.14,0.0,0.07],"note":"Closest of your papers: [[1607572]] (coupling 0.03, 3 shared references). Closest network paper: [[1843058]] (coupling 0.05, 5 shared references).","abstract":"Axion dark matter searches require highly sensitive detection schemes with high scan rate to efficiently explore the parameter space. Building upon the conventional Sikivie haloscope, where axions convert into microwave photons inside a magnetic-field-immersed resonant cavity, we present a photon-counting scheme based on an electro-optic microwave-to-optical transducer. Through a comprehensive theoretical model under realistic experimental constraints, we find that the optimal operating regime employs an overcoupled microwave cavity, trading peak transduction efficiency for reduced transducer noise. Furthermore, combining parameters already demonstrated in existing devices, in a device with optimized extrinsic coupling rates, would yield a scan-rate enhancement of 5-10 relative to quantum-limited homodyne detection. Improvements in quality factors, coupling rates, and thermal management push this enhancement beyond 50. While our quantitative model is benchmarked at 9 GHz, the scheme adapts well to haloscopes across the 5-12 GHz range, where shrinking cavity volumes severely degrade the achievable scan rate. These results demonstrate the potential of electro-optical photon detection as a high-speed detection technique for axion dark matter searches."},{"arxiv":"2610.42103","id":"","title":"Charge Pumping Leptogenesis from the Symmetric Mass Generation Phase on a Four-Leg Ladder Lattice","authors":"Runze Chi, Meng Zeng, Tao Xiang, Yi-Zhuang You, Bertrand I. Halperin, Juven Wang","score":5.1,"section":"cross","rank":14,"parts":[0.06,0.06,0.09,0.0,0.0],"note":"Also cites widely used network papers: [[779828]]. Closest of your papers: [[922002]] (coupling 0.02, 2 shared references). Closest network paper: [[3157653]] (coupling 0.03, 6 shared references).","abstract":"Quantized charge pumping in quantum Hall systems is a bulk topological property, typically manifesting on gapless boundaries as spectral flow through chiral edge modes upon flux insertion. When the boundary is anomaly-free, it can be symmetrically gapped by symmetric mass generation (SMG) interactions. However, the effects on quantized charge pumping at an interacting gapped boundary are unclear. We address this using density-matrix renormalization group simulations of a four-leg ladder quasi-(2+1)d realization of the (1+1)d 3-4-5-0 lattice chiral fermion model with six-fermion interactions at one edge. We find gapless modes near the interacting edge for both weak and strong couplings, but the edge can be in a fully gapped SMG phase at intermediate coupling. We also identify spontaneous breaking of the model's $\\mathbb{Z}_2$ symmetry above a critical interaction strength. Across all three boundary phases, we find quantized charge pumping with the same pumped charge per flux quantum. The spatial distribution of the pumped charge varies between phases. Besides charge pumping, we study how a single injected fermion propagates under open boundary conditions. In the SMG phase, an interaction-induced flavor-mixing current develops at the endpoints of the gapped edge, which is absent in the weak- and strong-coupling limits. This current reveals a charge-redistribution mechanism unique to the SMG phase. Additionally, we propose an analogy between charge pumping in this model and a topological leptogenesis scenario in the (3+1)d Standard Model. The anomaly-free chiral U(1) symmetries of the 3-4-5-0 model play a role analogous to the baryon-minus-lepton symmetry of the Standard Model. In both settings, charge pumping can be associated with a continuous deformation along a classically defined but quantum-anomalous direction, while a discrete subgroup remains an exact quantum symmetry."},{"arxiv":"2611.05500","id":"3222924","title":"SMEFT Constraints on Top Electroweak Couplings and a Composite Higgs Interpretation","authors":"Leandro Da Rold, Juan Fernandez","score":5.0,"section":"new","rank":15,"parts":[0.06,0.05,0.1,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1116165]] (coupling 0.02, 1 shared references). Closest network paper: [[2903351]] (coupling 0.03, 3 shared references).","abstract":"Recent LHC measurements of $tWZ$, $t\\bar t Z$ and single top production provide complementary probes of top quark electroweak interactions. We incorporate these measurements into a global Standard Model effective field theory analysis of 46 independent dimension-six Wilson coefficients at linear order. The updated fit remains compatible with the Standard Model at $95\\%$ CL, and favors negative values of $C_{Hq}^{(-)}\\equiv C_{Hq}^{(1)}-C_{Hq}^{(3)}$ and $C_{Ht}$, with central values suggestive of TeV scale new physics. We also present an effective composite Higgs model based on a two-site description that realizes this pattern of Wilson coefficients through partial compositeness. The model includes custodial symmetry and protection of the $Z\\bar b_L b_L$ coupling. A fermion bitriplet generates the required left-handed shift, and an additional embedding of the right-handed top allows negative contributions to $C_{Ht}$ from both fermion and spin-one exchange. Scanning four right-handed top embeddings, we find parameter regions within the $68\\%$ CL contour that are compatible with electroweak precision data, Higgs coupling measurements and applicable direct searches. The $T$ parameter limits the negative fermionic contribution to $C_{Ht}$, favoring a spin-one contribution of comparable or greater magnitude. Larger $SU(2)_R$ representations extend the reach toward negative $C_{Ht}$, and also enhance four-quark interactions that increase the four-top cross section, in the direction favored by current measurements. The mechanism connects the preferred top electroweak shifts to complementary tests through single production of quarks with electric charge $-4/3$, modified Higgs couplings and four-top production."},{"arxiv":"2611.06329","id":"3223029","title":"Primordial Black Holes and Induced Gravitational Waves from Inflation with History-Dependent Effective Dissipation","authors":"Narges Rashidi","score":4.6,"section":"cross","rank":16,"parts":[0.0,0.04,0.18,0.0,0.07],"note":"Closest of your papers: [[2855387]] (coupling 0.02, 2 shared references). Closest network paper: [[2693756]] (coupling 0.06, 7 shared references).","abstract":"We study inflation with an exponential factor multiplying the scalar Lagrangian and depending on the accumulated expansion history through a field-dependent coupling. Variation of the complete action on a finite interval yields an adjoint response with a final-time boundary condition. We derive the background and coupled scalar perturbation equations and examine five benchmarks for an exponential plateau potential and a smooth single-window coupling. The kinetic, direct-coupling and adjoint contributions nearly cancel, producing transient positive minima of the first Hubble slow-roll parameter, $ε_1$, without a comparable reduction in field velocity. The scalar spectra, normalized to the cosmic microwave background (CMB) pivot amplitude, develop localized peaks with amplitudes $0.033$--$0.098$. Under Gaussian statistics and the adopted radiation-era collapse prescription, the the primordial black hole (PBH) abundance peaks span masses from $4.52\\times10^{-13}$ to $34.05\\,M_\\odot$. The lightest-mass benchmark reaches $f_{\\rm PBH}\\simeq0.99$, allowing nearly all dark matter within the monochromatic approximation. The accompanying scalar-induced gravitational-wave spectra span peak frequencies from $6.78\\times10^{-10}$ to $5.92\\times10^{-3}\\,\\mathrm{Hz}$, with selected benchmarks lying within the projected sensitivities of future detectors."},{"arxiv":"2611.05474","id":"3222925","title":"Dynamics of self-gravitating halos with decaying dark matter","authors":"Anna Bencke, Marc Kamionkowski, Annika H. G. Peter, Juniper Morales","score":4.6,"section":"cross","rank":17,"parts":[0.0,0.08,0.11,0.0,0.07],"note":"Closest of your papers: [[2859009]] (coupling 0.03, 2 shared references). Closest network paper: [[1989085]] (coupling 0.04, 4 shared references).","abstract":"We study the evolution of self-gravitating spherical dark matter halos composed of dark matter particles that decay to a slightly less massive particle and a massless particle. The small kick velocity imparted to the daughter particle upon decay heats the halo. If the kick velocity is small compared with the characteristic velocity, the halo remains bound but puffs out. We also consider, for the first time, decaying halos with anisotropic initial conditions and find non-negligible effects on the resulting density profile. To simulate the halo evolution, we utilize the recently developed \\texttt{NSphere} code across a broad range of decay times and kick velocities. We train an emulator to provide a mapping between the decay parameters and the relaxed density profile. We discuss how the resulting halo-scale signatures complement existing cosmological constraints on decaying dark matter and can be tested by upcoming surveys."},{"arxiv":"2611.05463","id":"3222932","title":"Top Spin and CP from Equivariant Transformers","authors":"Henning Bahl, Marco Menen, Antoine Petitjean, Tilman Plehn","score":4.3,"section":"new","rank":18,"parts":[0.0,0.05,0.18,0.0,0.0],"note":"Closest of your papers: [[1627633]] (coupling 0.02, 3 shared references). Closest network paper: [[2893828]] (coupling 0.06, 7 shared references).","abstract":"Measurements of spin correlations and CP are an exciting and challenging part of the precision-LHC program. We first show how L-GATr-slim, as a Lorentz-equivariant transformer, significantly boosts the spin analyzing power for hadronic top quarks. We then show how adding a pseudoscalar channel to its architecture allows us to learn and interpret optimal observables and their CP properties. We demonstrate this for WBF-Higgs production at parton level and top pair production including detector effects."},{"arxiv":"2611.06769","id":"3223115","title":"Born spreading with consistent shower starting scales in MC@NLO and FxFx merging","authors":"Rikkert Frederix, Paolo Torrielli","score":3.9,"section":"new","rank":19,"parts":[0.0,0.02,0.22,0.0,0.0],"note":"Closest of your papers: [[1615477]] (coupling 0.01, 1 shared references). Closest network paper: [[3206672]] (coupling 0.08, 7 shared references).","abstract":"Negative weights are a major cost in NLO event generation matched to parton showers at the LHC, as they increase the number of events needed for a given statistical precision. Born spreading reduces the fraction of negative-weight $\\mathbb S$ events in MC@NLO by redistributing the Born contribution over the radiation variables. It introduces no bias only if everything that is passed to the parton shower together with $\\mathbb S$ events depends on Born-level quantities alone. We show that the same condition is needed for the MC counterterms to reproduce the first shower emission, independently of how the radiation phase space is integrated. In MadGraph5_aMC@NLO, the $\\mathbb S$-event starting scales did not fully satisfy this condition, which so far prevented the public release of Born spreading. We present a new and consistent construction of the starting scales for ordinary MC@NLO, FxFx merging and MC@NLO-$Δ$, with which Born spreading is now publicly available, including for merged samples. We also study modified formulations of the MC counterterms, and FxFx-merged $W$+jets production with up to two jets at NLO, for which Born spreading reduces the fraction of negative weights after merging without affecting the predictions, and the event samples are generated six times faster than with the former implementation."},{"arxiv":"2611.06129","id":"3223037","title":"What Does Precision Spectroscopy Actually Constrain about X17 Couplings?","authors":"Raoul Serao, Antonio Capolupo","score":3.8,"section":"new","rank":20,"parts":[0.0,0.07,0.1,0.0,0.0],"note":"Closest of your papers: [[1708009]] (coupling 0.03, 1 shared references). Closest network paper: [[3214448]] (coupling 0.04, 3 shared references).","abstract":"Can precision spectroscopy disentangle the individual couplings of the X17 boson? Within a leading one-body model, we combine electronic and muonic spectroscopy of hydrogen, deuterium and helium with lepton magnetic moments. We show that hydrogen-deuterium comparisons can lose neutron sensitivity through cancellations, while the combined observables restore generic local identifiability without guaranteeing finite individual bounds. The unrestricted fit admits formally unbounded nucleon-coupling directions, some of which violate the assumptions underlying the physical model. Finite-coupling tests nevertheless reveal statistically compatible solutions, with bounds dependent on nuclear responses and physical assumptions. Our results establish what precision measurements genuinely constrain and what additional information is required to extract meaningful limits on X17 couplings."},{"arxiv":"2611.05872","id":"3222990","title":"Investigations on the low-lying $cccq\\bar{q}$ resonances in a constituent quark model","authors":"Yue-Mei Yin, mao-jun Yan, Chun-Sheng An, Cheng-Rong Deng","score":3.6,"section":"new","rank":21,"parts":[0.06,0.01,0.08,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.00, 1 shared references). Closest network paper: [[2817040]] (coupling 0.03, 30 shared references).","abstract":"In present work, mass spectrum of the low-lying $cccq\\bar{q}$ pentaquarks states with $q\\bar{q}=u\\bar{u}$, $d\\bar{d}$ and $s\\bar{s}$, are investigated employing a constituent quark model, within which the spin-dependent hyperfine interactions are taken to be the instanton-induced interaction and the one-gluon-exchange interaction, respectively. The model parameters are fixed by fitting the mass spectrum of the relative $q\\bar{q}$ and $qqq$ traditional hadrons. The numerical results show that energies for all the obtained states in the two employed models are higher than corresponding meson-baryon channels, consequently, we roughly estimate strong decays of these states using a simple quark rearrangement model, the corresponding partial width ratios for different decay channels are presented."},{"arxiv":"2611.05440","id":"3222890","title":"Meson spectra in a screened relativized quark model","authors":"Zhe-Qi Huang, Lei Huang, Xiao-Lei Zhang, Xin-Lei Ge, Hao Chen, Cheng-Qun Pang","score":3.1,"section":"new","rank":22,"parts":[0.06,0.01,0.06,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.00, 1 shared references). Closest network paper: [[1710056]] (coupling 0.02, 8 shared references).","abstract":"In this work, we employed the modified Godfrey--Isgur model to systematically investigate the mass spectra of several light, heavy-light, and heavy-heavy meson systems. In this model, a screened potential is employed to phenomenologically account for modifications to the long-range confining interaction associated with unquenched effects. We performed a global refit of the relevant model parameters to a combined set of 90 adopted meson masses spanning all three sectors, ensuring a consistent parameter determination across the different meson systems. Using the resulting parameter set, we calculated the low-lying and highly excited spectra and the corresponding mixed states in different meson families, and compared our results with existing experimental data and other theoretical results. The assignment of several newly observed structures (such as $B_c^*$ and $D_{s1}(2933)$) have also been discussed based on their predicted masses. Overall, the model describes several main spectroscopic features across different flavors and provides mass predictions for highly excited states that have not yet been experimentally established."},{"arxiv":"2611.06284","id":"3223039","title":"A search for sterile neutrinos at ultrahigh energies at the Pierre Auger Observatory","authors":" The Pierre Auger Collaboration, A. Abdul Halim, P. Abreu, M. Aglietta, M. Ahmed, I. Allekotte, K. Almeida Cheminant, R. Aloisio, J. Alvarez-Muñiz, A. Ambrosone, J. Ammerman Yebra, L. Anchordoqui, B. Andrada, L. Andrade Dourado, L. Apollonio, C. Aramo, J. C. Arteaga Velázquez, P. Assis, G. Avila, E. Avocone, A. Bakalova, Y. Balibrea, A. Baluta, F. Barbato, A. Bar ervatory to probe long-lived weakly interacting particles."},{"arxiv":"2611.05469","id":"3222936","title":"Superconducting Qubits as Quantum Targets for Direct Particle Scattering","authors":"Doojin Kim, Kyoungchul Kong, Myeonghun Park","score":2.8,"section":"new","rank":24,"parts":[0.0,0.04,0.06,0.0,0.07],"note":"Closest of your papers: [[1741056]] (coupling 0.01, 1 shared references). Closest network paper: [[1399202]] (coupling 0.02, 1 shared references).","abstract":"We introduce a novel approach to particle detection in which a superconducting qubit itself serves as the scattering target and a resolved transition between circuit eigenstates constitutes the observable final state. The scattering amplitude factorizes into the incident-particle current and a finite-momentum electromagnetic transition response of the qubit. This momentum dependence is essential in that the energy transfer is fixed by the microwave-scale level spacing, whereas a nonrelativistic incident particle can transfer a spatial momentum parametrically larger than that energy and thereby resolve the device geometry. For charge-dominated processes, we recast the response as an induced-offset-charge kernel obtained from an auxiliary electrostatic weighting potential, providing a practical route from circuit geometry to a differential scattering cross section. We illustrate the framework with an Xmon-style transmon and photon-mediated scattering of dark matter. The exceptionally small qubit transition threshold opens sensitivity to an eV-to-keV mass regime that is largely unexplored by existing direct-detection experiments."},{"arxiv":"2611.05789","id":"3222967","title":"Gluon and Faddeev--Popov ghost propagators in rotating background: An eigenfunction approach","authors":"Benjamín García-Contreras, Luis A. Hernández, R. Zamora","score":2.1,"section":"cross","rank":25,"parts":[0.0,0.05,0.04,0.0,0.0],"note":"Closest of your papers: [[2030200]] (coupling 0.02, 1 shared references). Closest network paper: [[3127309]] (coupling 0.02, 2 shared references).","abstract":"We construct the free gluon and Faddeev--Popov ghost propagators in rigidly rotating cylindrical coordinates using an eigenfunction approach within the Feynman gauge. Starting from the quadratic gauge-fixed QCD action, we derive the corresponding kinetic operators and obtain their spectral representations. For the gluon field, a circular polarization basis diagonalizes the vector wave operator, leading to polarization-dependent shifts in the orders of the radial Bessel functions. In the absence of radial boundaries, we explicitly recover the standard Minkowski propagator in inertial Cartesian coordinates, showing that the off-diagonal tensor components in the cylindrical basis have a geometrical origin. We then extend the construction to a finite-radius cylinder satisfying the causality condition $|Ω|R<1$, imposing relative boundary conditions on the gluon field and Dirichlet conditions on the ghosts. The resulting discrete transverse spectra involve both Dirichlet and Neumann eigenvalues for the gluon modes, from which we obtain explicit spectral representations of the propagators. Our results provide a consistent framework for perturbative QCD calculations in rotating geometries, retaining the angular-momentum, polarization, and boundary effects relevant to future studies of correlation functions and radiative corrections."}],"refs":{"2671727":{"first":"Dreiner","year":2023,"nauth":5,"title":"Recasting bounds on long-lived heavy neutral leptons in terms of a light supersymmetric R-parity violating neutralino","role":"other"},"2693756":{"first":"Kitabayashi","year":2023,"nauth":1,"title":"Constraining scotogenic dark matter and primordial black holes using induced gravitational waves","role":"other"},"779828":{"first":"Davidson","year":2008,"nauth":3,"title":"Leptogenesis","role":"other"},"3206672":{"first":"Boukidi","year":2026,"nauth":3,"title":"Precise QCD Predictions for the Scotogenic Model function list(){const box=document.getElementById('list');
  if(!NEWS.length){box.innerHTML=`<div class="empty">No paper in this listing reaches a score of ${M.threshold}.</div>`;document.getElementById('mainnet').hidden=true;return}
  NEWS.forEach(n=>{const d=document.createElement('article');d.className='paper';d.id='p'+n.i;
    d.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <h2>${esc(n.title)}</h2>
    <div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    <p class="abs">${esc(n.abstract)}</p><button class="linkbtn absmore" type="button" hidden>More</button>
    <p class="why">${why(n.note)}</p>
    <div class="row"><div class="bars">${n.parts.map((v,j)=>`<span><span class="pl">${P[j]}</span><span class="ps">${PS[j]}</span> <span class="mb"><i style="width:${Math.round(v*100)}%"></i></span></span>`).join('')}</div><span>${n.nlinked} of ${n.nref} references linked to INSPIRE · refs from ${esc(n.src)}</span></div>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a>${n.html?`<a href="https://arxiv.org/html/${esc(n.arxiv)}" target="_blank" rel="noopener" title="arXiv's experimental HTML version">HTML</a>`:''}<button class="linkbtn graphbtn" type="button">Show in network</button></div>`;
    d.querySelector('.graphbtn').addEventListener('click',()=>pick(n,true));
    d.querySelector('.absmore').addEventListener('click',e=>{const o=d.classList.toggle('open');e.target.textContent=o?'Less':'More'});
    box.appendChild(d)});
  toc();tex(box)}
// Phones: long author lists show the first 3 and "et al." (tap to expand); abstracts fold to 3 lines with More.
function authors(s){const a=String(s||'').split(', ');if(a.length<=3)return esc(s);
  return `<span class="au-short">${esc(a.slice(0,3).join(', '))} <button class="aubtn" type="button" aria-label="Show all ${a.length} authors">et al. (+${a.length-3})</button></span><span class="au-full">${esc(s)}</span>`}
document.addEventListener('click',e=>{const b=e.target.closest('.aubtn');if(b)b.closest('.authors').classList.add('open')});
function fold(){document.querySelectorAll('.paper').forEach(d=>{const p=d.querySelector('.abs'),b=d.querySelector('.absmore');
  if(!p||!b||d.classList.contains('open'))return;b.hidden=!(p.scrollHeight>p.clientHeight+2)})}
function toc(){const t=document.getElementById('toc');if(!NEWS.length)return;t.hidden=false;
  const X=RAW.next||[];
  t.innerHTML=`<h3>In this listing</h3><ol>${NEWS.map(n=>`<li><a href="#p${n.i}"><span class="sc${n.role==='repl'?' repl':''}">${n.score.toFixed(0)}</span><span class="tt">${esc(n.title)}</span></a></li>`).join('')}${X.length?`<li class="more-link"><a href="#more"><span class="sc">+${X.length}</span><span class="tt">The next ${X.length} papers by score (folded)</span></a></li>`:''}</ol>`;
  const m=t.querySelector('.more-link a');if(m)m.addEventListener('click',()=>{document.getElementById('more').open=true});tex(t)}
let sel=NEWS[0]||null, hover=null, query='', G;
const svg=d3.select('#svg'), tip=document.getElementById('tip');
function draw(){
  if(!NEWS.length)return;
  const RNG=d3.randomLcg(11);
  const W=Math.max(300,document.getElementById('chart').clientWidth), H=W<600?500:480, m={l:16,r:16,t:20,b:34};
  svg.attr('viewBox',`0 0 ${W} ${H}`); svg.selectAll('*').remove();
  const yrs=d3.extent(N,n=>n.year);
  const x=d3.scaleLinear().domain([yrs[0]-.5,yrs[1]+1.2]).range([m.l+8,W-m.r-8]);
  const ticks=x.ticks(W<600?6:12).filter(t=>Number.isInteger(t)&&t<=yrs[1]);
  svg.append('g').attr('class','grid').selectAll('line').data(ticks).join('line').attr('x1',d=>x(d)).attr('x2',d=>x(d)).attr('y1',m.t).attr('y2',H-m.b);
  svg.append('g').attr('class','axis').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x).tickValues(ticks).tickFormat(d3.format('d')).tickSizeOuter(0));
  const cy=(m.t+H-m.b)/2, xf=n=>isNew(n)?x(yrs[1]+.75):x(n.year);
  const sim=N.map(n=>({n,x:xf(n)+(RNG()-.5)*4,y:cy+(RNG()-.5)*H*.5}));
  const links=E.map(e=>({source:sim[e.s],target:sim[e.t],s:e.s,t:e.t,k:e.k}));
  d3.forceSimulation(sim).force('x',d3.forceX(s=>xf(s.n)).strength(1)).force('y',d3.forceY(cy).strength(.04))
    .force('link',d3.forceLink(links).strength(.03)).force('charge',d3.forceManyBody().strength(-40))
    .force('col',d3.forceCollide(s=>r(s.n)+2)).stop().tick(320);
  sim.forEach(s=>{s.y=Math.max(m.t+8,Math.min(H-m.b-8,s.y));s.x=Math.max(m.l+4,Math.min(W-m.r-4,s.x))});
  G=svg.append('g');
  G.append('g').selectAll('path').data(links).join('path').attr('class',l=>'edge '+l.k)
    .attr('d',l=>{const a=l.source,b=l.target;return `M${a.x},${a.y}Q${(a.x+b.x)/2},${(a.y+b.y)/2-Math.abs(a.x-b.x)*.12} ${b.x},${b.y}`});
  G.append('g').selectAll('circle').data([...sim].sort((a,b)=>RANK[b.n.role]-RANK[a.n.role])).join('circle')
    .attr('class','node').attr('cx',s=>s.x).attr('cy',s=>s.y).attr('r',s=>r(s.n)).attr('fill',s=>col(s.n))
    .on('pointerenter',(ev,s)=>{hover=s.n;showTip(ev,s.n);paint()}).on('pointermove',(ev,s)=>showTip(ev,s.n))
    .on('pointerleave',()=>{hover=null;tip.hidden=true;paint()}).on('click',(ev,s)=>pick(s.n,false));
  const lab=sim.filter(s=>isNew(s.n)||s.n.role==='seed'||s.n.deg>=3);
  const L=lab.map(s=>{const right=s.x>W*.8,t=isNew(s.n)?`#${s.n.rank} ${s.n.first}`:`${s.n.first} ${s.n.year}`,w=t.length*6.2;return{s,t,right,x0:right?s.x-r(s.n)-4-w:s.x+r(s.n)+4,w,y:s.y+4}}).sort((a,b)=>a.y-b.y);
  const placed=[];L.forEach(l=>{let k=0;while(k<40&&placed.some(p=>l.x0<p.x0+p.w&&p.x0<l.x0+l.w&&Math.abs(l.y-p.y)<13)){l.y+=13*(k%2?-1:1)*(1+Math.floor(k/2));k++;l.y=Math.max(m.t+10,Math.min(H-m.b-4,l.y))}placed.push(l)});
  G.append('g').selectAll('text').data(L).join('text').attr('class','nlabel').attr('x',l=>l.right?l.s.x-r(l.s.n)-4:l.s.x+r(l.s.n)+4).attr('y',l=>l.y)
    .attr('text-anchor',l=>l.right?'end':'start').text(l=>l.t);
  paint();
}
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  const nmin=M.nextMin;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}${nmin!=null?`: every paper scoring ${nmin} or more, and at least ${M.nextCount} when available`:''}; not drawn in the network`;
  const cut=nmin!=null?X.findIndex(n=>n.score<nmin):-1;
  box.innerHTML=X.map((n,i)=>(i===cut?`<li class="divider">Below ${nmin}: weaker relation (most of these share no specific reference, coupling or topic with your work)</li>`:'')+`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
list();nextList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
