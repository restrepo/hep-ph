<script>
const RAW = {"n":[{"id":"3220257","arxiv":"2610.38734","title":"Neutrino electromagnetic properties after the first $pp$ solar neutrino observation at XENONnT","first":"Romeri","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 6 network papers: [[3069207]], [[2909343]], [[2845531]], [[2513697]], [[2085162]], [[1287034]]. Closest of your papers: [[599285]] (coupling 0.03, 4 shared references). Closest network paper: [[2909343]] (coupling 0.22, 19 shared references). Shared topics: neutrino physics.","score":50.5,"rank":1,"section":"new","parts":[0.97,0.1,0.64,0.0,0.4],"abstract":"The XENONnT Collaboration has recently reported the first measurement of low-energy solar neutrinos through elastic neutrino-electron scattering in a dark matter detector, opening a new window on Standard Model predictions and on neutrino electromagnetic properties. We analyze these data to extract the $pp$ neutrino flux normalization and the weak mixing angle at low momentum transfer ($\\sim 0.1$ MeV). We also derive bounds on the neutrino charge radii, magnetic moments, and millicharges, as well as on the sterile-neutrino dipole portal. Since the $pp$-flux determination displays a mild excess, we further investigate the role of the $^{14}$C background in the fit and assess how it affects the extracted parameters. Our results show that dark matter detectors now offer a probe of neutrino physics that is complementary to dedicated precision experiments.","authors":"Valentina De Romeri, Dimitrios K. Papoulias, Federica Pompa, Christoph A. Ternes","nlinked":103,"nref":111,"src":"INSPIRE","html":true},{"id":"3111415","arxiv":"2601.18147","title":"Radiative generation of chiral vector operators in $b\\to s ν\\barν$ transition","first":"Yan","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 3 network papers: [[2813804]], [[2069870]], [[1744787]]. Closest of your papers: [[1746620]] (coupling 0.02, 2 shared references). Closest network paper: [[2813804]] (coupling 0.33, 29 shared references).","score":44.9,"rank":2,"section":"replacement","parts":[0.83,0.05,0.95,0.0,0.0],"abstract":"The recent Belle II evidence for $B^+ \\to K^+ ν\\barν$, combined with a suppressed branching fraction ratio $R \\equiv Br(B^0 \\to K^{*0} ν\\barν) / Br(B^+ \\to K^+ ν\\barν)$, necessitates new physics contributing to both left- and right-handed vector operators. We perform a systematic topological classification of one-loop completions that radiatively generate both operators without tree-level mediation, and construct two minimal benchmark scenarios: a scalar-rich model and a fermion-rich model. Evaluating these frameworks under specific benchmark mass schemes and four distinct flavor structures, we find a generic anti-correlation where enhancing one decay channel typically suppresses the other. A notable exception is a decoupled flavor configuration within the scalar-rich model, which yields simultaneous constructive interference, reducing $R$ by $4.22\\%$ while satisfying all complementary flavor bounds. Under a universal coupling assumption, the scalar-rich model yields exact cancellation in the charged mode, highlighting the non-trivial interplay between flavor structure and loop-generated Wilson coefficients.","authors":"Xin-Shuai Yan, Wen-Feng Liu, Qin Chang, Ya-Dong Yang","nlinked":91,"nref":94,"src":"INSPIRE","html":true},{"id":"3220482","arxiv":"2610.39858","title":"Spontaneous CP violation and leptogenesis in minimal flavour models","first":"Câmara","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1210691]]. Also cites widely used network papers: [[779828]], [[902365]]. Closest of your papers: [[922002]] (coupling 0.04, 5 shared references). Closest network paper: [[3088651]] (coupling 0.30, 87 shared references). Shared topics: neutrino mass, majorana mass, mass matrix.","score":39.9,"rank":3,"section":"new","parts":[0.51,0.13,0.84,0.0,0.55],"abstract":"We consider a type-I seesaw framework extended by a scalar singlet whose vacuum expectation value (VEV) breaks CP spontaneously. The singlet VEV phase provides a common origin for low-energy leptonic CP violation and the high energy CP violation needed to generate the observed baryon asymmetry of the Universe (BAU) through leptogenesis. We identify two minimal flavour models based on a discrete $\\mathcal{Z}_4$ symmetry, whose neutrino flavour structure is encoded entirely in the heavy Majorana mass matrix. Both models predict $δ\\simeq 3π/2$, a definite octant for the atmospheric $θ_{23}$ mixing angle, and lower bounds of approximately $60~\\mathrm{meV}$ ($50~\\mathrm{meV}$) on the lightest neutrino mass and the effective Majorana mass $m_{ββ}$ for normal (inverted) ordering, within reach of future neutrinoless double-beta decay searches. We study scalar-singlet assisted leptogenesis in the non-resonant regime, including new decay, scattering, and washout processes involving the heavy scalars, as well as their contributions to the CP asymmetries. By solving the unflavoured Boltzmann equations, we identify the regions of parameter space in which the minimal flavour models successfully account for the observed BAU.","authors":"H. B. Câmara, F. R. Joaquim, J. R. Rocha","nlinked":117,"nref":120,"src":"INSPIRE","html":true},{"id":"3220435","arxiv":"2610.39616","title":"Scalar Non-standard Interactions in Type-II Seesaw","first":"Kalita","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 3 network papers: [[2715897]], [[582695]], [[1634858]]. Closest of your papers: [[1755250]] (coupling 0.02, 1 shared references). Closest network paper: [[1684358]] (coupling 0.06, 1 shared references). Shared topics: neutrino mass, seesaw model, mass matrix.","score":39.8,"rank":4,"section":"new","parts":[0.83,0.07,0.16,0.0,0.62],"abstract":"We study the theoretical origin of scalar non-standard interactions (SNSI) in an \\(A_4\\)-symmetric Type-II seesaw model. The model contains an \\(SU(2)_L\\) scalar triplet \\(Δ\\) and a real scalar singlet \\(S\\). After electroweak symmetry breaking, their CP-even neutral fluctuations mix to form two physical scalar states \\(φ_1\\) and \\(φ_2\\). These physical scalars couple to both neutrinos and charged leptons, establishing a connection between the neutrino sector and ordinary matter through scalar interactions. This induces a matter-dependent correction to the Type-II seesaw neutrino mass matrix. The SNSI contribution, governed by the relevant Yukawa couplings and the SNSI coefficient, can enhance or suppress the neutrino masses relative to their vacuum values. The model provides a simple and consistent description of how scalar mixing can give rise to SNSI and connects neutrino interactions in matter with the underlying structure of the scalar sector.","authors":"Bhaswati Kalita, Mrinal Kumar Das","nlinked":28,"nref":41,"src":"INSPIRE","html":true},{"id":"3187965","arxiv":"2608.05150","title":"The QCD Axion and Neutrino Masses","first":"Debnath","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2697191]]. Closest of your papers: [[1607572]] (coupling 0.09, 6 shared references). Closest network paper: [[1861353]] (coupling 0.23, 22 shared references). Shared topics: neutrino mass, seesaw mechanism.","score":38.2,"rank":5,"section":"replacement","parts":[0.45,0.25,0.65,0.0,0.53],"abstract":"The strong CP problem and the origin of neutrino masses are among the clearest motivations for physics beyond the Standard Model. The Peccei-Quinn mechanism offers an elegant dynamical solution to the strong CP problem, predicting the QCD axion, while neutrino masses point to new degrees of freedom or interactions beyond the Standard Model. We explore the possibility that these two phenomena arise from a common origin by identifying the Peccei-Quinn symmetry-breaking scale with the scale responsible for neutrino mass generation. We perform a systematic and unified analysis of this connection in both DFSZ and KSVZ realizations of the Peccei-Quinn mechanism, considering the Type-I, Type-II, and Type-III seesaw mechanisms, the Zee radiative model, and the colored seesaw. For each scenario, we determine the axion couplings to photons and neutrinos and examine their phenomenological consequences. A robust prediction of all the frameworks considered is the existence of axion-neutrino couplings. We show that these interactions can significantly affect the axion decays. If the QCD axion makes up the observed dark matter, these couplings also lead to a large monochromatic neutrino flux from axion decays, opening a complementary path to test these theories in future neutrino experiments.","authors":"Hridoy Debnath, Pavel Fileviez Perez, Grace Miller","nlinked":68,"nref":76,"src":"INSPIRE","html":true},{"id":"3220488","arxiv":"2610.39930","title":"Sleptons Masses in the Minimal Supersymmetric $SU(3)_{C}\\times SU(3)_{L}\\times U(1)_{N}$ Model","first":"Rodriguez","nauth":1,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[611590]] (coupling 0.27, 17 shared references). Closest network paper: [[2972391]] (coupling 0.15, 11 shared references). Shared topics: lepton number.","score":28.3,"rank":6,"section":"new","parts":[0.0,0.69,0.42,0.0,0.13],"abstract":"We present the mass spectrum of the sleptons in the Minimal Supersymmetric $SU(3)_{C}\\times SU(3)_{L}\\times U(1)_{N}$ Model, when all the usual neutral scalars fields obtain vacuum expectation values. In this model, we can define $R$-Parity conservation, where our superpotential respect the invariance of the quantum number ${\\cal F} \\equiv B+L$, where $B$ is the baryon number while $L$ is the total lepton number.","authors":"M. C. Rodriguez","nlinked":56,"nref":77,"src":"INSPIRE","html":true},{"id":"3220455","arxiv":"2610.39697","title":"Radiative $θ$ in Left-Right Universal Seesaw","first":"Banno","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2716079]]. Closest of your papers: [[1607572]] (coupling 0.04, 3 shared references). Closest network paper: [[2158000]] (coupling 0.10, 8 shared references). Shared topics: seesaw mechanism, mass matrix.","score":27.0,"rank":7,"section":"new","parts":[0.45,0.1,0.3,0.0,0.36],"abstract":"We investigate radiative corrections to the QCD $\\barθ$ parameter in the minimal left-right symmetric model with a universal seesaw mechanism, where parity symmetry ensures $\\barθ=0$ at tree level. Assuming Hermitian vector-like quark mass matrices, we identify the $CP$-odd rephasing invariants contributing to $\\barθ$ and evaluate the leading two-loop corrections to the light-quark mass matrices induced by soft parity breaking. We find that the dominant contributions do not decouple and depend sensitively on the mass splittings as well as flavor mixings of the vector-like quarks. For hierarchical vector-like quark masses, the resulting $\\barθ$ typically exceeds the current experimental bound from the neutron electric dipole moment. Satisfying this bound requires either nearly degenerate vector-like quark masses or strongly suppressed additional flavor mixing angles. In the former case, the radiative corrections are suppressed by a GIM-like mechanism. For generic mixing parameters, the dimensionless relative mass splittings are constrained to be below approximately $10^{-2}$ and $10^{-4}$ in the up- and down-type vector-like quark sectors, respectively. These results severely restrict the inverted vector-like quark mass hierarchy motivated by the universal seesaw mechanism.","authors":"Tatsuya Banno, Junji Hisano, Teppei Kitahara, Naohiro Osamura","nlinked":46,"nref":47,"src":"INSPIRE","html":true},{"id":"3159206","arxiv":"2605.25300","title":"A D_5 Model of Quarks with Explicit CP Violation","first":"Fu","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2715897]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[3095799]] (coupling 0.09, 4 shared references). Shared topics: fermion mass.","score":23.2,"rank":8,"section":"replacement","parts":[0.48,0.02,0.26,0.0,0.2],"abstract":"The hierarchy of fermion masses and mixings lacks a self-consistent theoretical explanation at the dynamical or symmetry level, and the origin of CP violation remains unclear. These two issues have long been major challenges in particle physics. In this paper, we investigate the quark sector of a four-Higgs-doublet model with an exact D_5 symmetry. Within the framework of explicit CP violation, we consider the most general real vacuum, and perform a numerical fit of the quark mass spectrum and the CKM matrix using a Differential Evolution. We demonstrate that the model achieves an excellent overall goodness of fit with χ^2 = 6.97, and the Jarlskog invariant J_{CP} = 3.144 \\times 10^{-5} agrees with the experimental value within 0.19σ. This indicates that the new source of CP violation provided by the model is consistent to generate the observed CP violation in the quark sector. Moreover, the hierarchies inherent in the vacuum expectation values and the quark Yukawa couplings naturally explain the observed hierarchy of the quark masses and mixing parameters.","authors":"Dong-Ping Fu, Michihisa Takeuchi","nlinked":43,"nref":49,"src":"INSPIRE","html":true},{"id":"3220105","arxiv":"2610.37987","title":"Baryon-Number Violating $Λ_c$ Decays from Light-Cone Sum Rules","first":"Mohamed","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2053590]]. Closest of your papers: [[2080612]] (coupling 0.01, 1 shared references). Closest network paper: [[2940838]] (coupling 0.07, 3 shared references).","score":19.9,"rank":9,"section":"new","parts":[0.45,0.02,0.19,0.0,0.07],"abstract":"Baryon-number-violating decays with missing energy probe new interactions connecting Standard-Model quarks to light invisible fermions. Such signatures can arise from dimension-six operators coupling three quarks to an SM-singlet fermion $χ$, which escapes detection. With a suitable baryon-number assignment for $χ$, total baryon number is conserved while its violation is apparent in the visible sector. We study the exclusive decays $Λ_c\\toπ\\barχ$ and $Λ_c\\to K\\barχ$, determining the required form factors using light-cone sum rules with pion and kaon distribution amplitudes. The calculation includes leading-order two-particle contributions up to twist four and factorisable four-particle terms. Two $Λ_c$ interpolating currents are employed to assess the current dependence. Using single-operator benchmarks based on collider bounds, we obtain branching fractions of order $10^{-7}$ over sizeable parts of the physical region, with uncertainty envelopes reaching $10^{-6}$ in some scenarios. These are indicative estimates within the retained light-cone expansion. We compare with existing chiral-perturbation-theory and QCD-factorisation estimates and discuss experimental prospects. Future data from STCF and Belle II could probe part of the predicted range, while FCC-ee could reach smaller branching fractions.","authors":"Ali Mohamed","nlinked":36,"nref":37,"src":"INSPIRE","html":false},{"id":"3220363","arxiv":"2610.39057","title":"Linking a 152 GeV diphoton excess to dark matter and gravitational waves in the singlet-extended 2HDM","first":"Dong","nauth":5,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[1494411]], [[902365]]. Closest of your papers: [[1746620]] (coupling 0.04, 8 shared references). Closest network paper: [[1963411]] (coupling 0.17, 22 shared references). Shared topics: relic density.","score":18.6,"rank":10,"section":"new","parts":[0.11,0.12,0.49,0.0,0.38],"abstract":"We investigate the diphoton excesses near $152~\\mathrm{GeV}$ accompanied by missing transverse momentum (MET) in the Type-I two-Higgs-doublet model extended by a complex scalar singlet, whose imaginary component serves as a pseudo-Nambu-Goldstone dark matter (DM) candidate $χ$. The signal arises from the cascade process $gg\\to h_3\\to h_2h_2\\toγγχχ$, where $h_2$ is the scalar resonance near $152~\\mathrm{GeV}$ and $h_3$ is a heavier CP-even scalar. After imposing the theoretical and experimental constraints, we identify parameter regions that accommodate at least one of the Low-MET and High-MET excesses within $1σ$ and simultaneously reproduce the observed DM relic density within an assumed $10\\%$ theoretical uncertainty. A subset of these samples supports first-order electroweak phase transitions with substantial supercooling. For a three-year observation, selected samples yield gravitational-wave signals with signal-to-noise ratios (SNRs) above $10$ at LISA, TianQin, DECIGO, and BBO. A representative benchmark that accommodates both excesses within their respective $1σ$ intervals and satisfies the relic-density requirement yields a three-year BBO SNR of approximately $173$.","authors":"Yabo Dong, Jun Fan, Kun Wang, Haijun Yang, Jingya Zhu","nlinked":117,"nref":124,"src":"INSPIRE","html":true},{"id":"3198462","arxiv":"2609.00692","title":"Flavor-Violating Higgs and Top Decays in the Type 1B Flavorful Two-Higgs-Doublet Model with a Twist","first":"Hou","nauth":6,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[902365]], [[2817040]]. Closest of your papers: [[1116165]] (coupling 0.12, 4 shared references). Closest network paper: [[1255324]] (coupling 0.07, 7 shared references).","score":17.1,"rank":11,"section":"replacement","parts":[0.11,0.34,0.19,0.0,0.0],"abstract":"We study flavor-violating decays of the SM-like Higgs boson and rare top decays in the Type 1B realization of the flavorful two-Higgs-doublet model with a twist, focusing on $h\\to sb$, $h\\to db$, $h\\to uc$, $h\\toμτ$, $h\\to eτ$, $h\\to eμ$, $t\\to ch$, and $t\\to uh$. We present the relevant amplitude and branching-ratio formulae, include one-loop vertex corrections, and impose constraints from Higgs signal-strength measurements, electroweak precision tests, meson mixing, $B\\to X_sγ$, direct HFV searches and CLFV constraints, including $μ-e$ conversion. The surviving parameter space favors $\\mathrm{BR}(h\\to sb)\\gg\\mathrm{BR}(h\\to db)$, $\\mathrm{BR}(t\\to ch)\\gg\\mathrm{BR}(t\\to uh)$, and $\\mathrm{BR}(h\\toμτ)\\gg\\mathrm{BR}(h\\to eτ)\\sim\\mathrm{BR}(h\\to eμ)$ in the lepton sector. One-loop effects usually preserve these hierarchies, but can modify individual channels through different mechanisms: sizable destructive tree--loop interference can reduce $h\\to sb$ enough to yield rare $\\mathrm{BR}_{\\mathrm{1L}}(h\\to db)>\\mathrm{BR}_{\\mathrm{1L}}(h\\to sb)$ points, whereas the large relative corrections found in rare top decays mainly reflect strong SM-like alignment suppressing the tree-level amplitudes.","authors":"Ti-Bin Hou, Zheng Li, Yu-Ju Peng, Jin-Lei Yang, Hao-Ran Ma, Tai-Fu Feng","nlinked":48,"nref":48,"src":"INSPIRE","html":true},{"id":"2878706","arxiv":"2502.07539","title":"Neutralino dark matter in gauge mediation","first":"Takeuchi","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[677884]] (coupling 0.06, 3 shared references). Closest network paper: [[824840]] (coupling 0.14, 8 shared references). Shared topics: dark matter candidate, direct detection, direct detection experiment.","score":16.8,"rank":12,"section":"replacement","parts":[0.0,0.17,0.4,0.0,0.56],"abstract":"We explore the potential of neutralino dark matter within the framework of gauge-mediated supersymmetry (SUSY) breaking. Gauge mediation offers an advantage over gravity mediation, as SUSY CP/flavor problems are avoided more easily, leading to significantly milder fine-tuning for electroweak symmetry-breaking compared to gravity mediation. In our models, the lightest neutralino, as the lightest SUSY particle (LSP), is a viable dark matter candidate, assuming a gravitino mass of $\\mathcal{O}(100)~\\mathrm{TeV}$. The models are formulated in five-dimensional space-time, where the SUSY breaking field and the matter fields are placed on separate branes to avoid issues related to flavor and CP violation, and the radion is stabilized by a supersymmetric Goldberger--Wise mechanism. Four distinct neutralino dark matter scenarios are studied: bino-wino coannihilation, higgsino dark matter, wino dark matter, and entropy-diluted bino dark matter. For each case, we determine the allowed parameter spaces and evaluate their consistency with existing experimental limits. Additionally, we examine the potential for testing these models through future investigations at the High-Luminosity Large Hadron Collider (HL-LHC) and through dark matter direct detection experiments.","authors":"Michihisa Takeuchi, Norimi Yokozaki, Junhao Zhu","nlinked":73,"nref":77,"src":"INSPIRE","html":true},{"id":"3220223","arxiv":"2610.38745","title":"Searching for Dark Photons and ALPs using Gamma-rays from Nuclear Reactors","first":"Angel","nauth":4,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Queiroz. Also cites widely used network papers: [[1518747]], [[1688995]]. Closest of your papers: [[2859009]] (coupling 0.02, 3 shared references). Closest network paper: [[2513697]] (coupling 0.07, 7 shared references).","score":13.7,"rank":13,"section":"new","parts":[0.11,0.06,0.19,0.5,0.0],"abstract":"Nuclear reactors are intense sources of MeV gamma rays, produced in fission, radiative neutron capture and the de-excitation of fission products. Building on earlier phenomenological studies, we present a detector-independent description of the production of light, weakly coupled particles by reactor gamma rays and of their detection through scattering, absorption and decay in a nearby detector. We consider kinetically mixed dark photons, produced and detected through Compton-like processes, and axion-like particles (ALPs) coupled to photons, electrons and nucleons, produced through Primakoff conversion, Compton-like scattering and magnetic nuclear transitions such as the $2.23~\\mathrm{MeV}$ line of $p(n,γ)d$. As a concrete application, we derive the projected sensitivities of the CONUS+ germanium experiment at the Leibstadt reactor and of a conceivable $100$-kg CONUS100 upgrade. For sub-MeV dark photons, CONUS+ and CONUS100 reach kinetic mixings of $ε\\simeq1.65\\times10^{-5}$ and $1.2\\times10^{-5}$, respectively, for $0.5~\\mathrm{keV}\\lesssim m_{A'}\\lesssim0.5~\\mathrm{MeV}$. For ALPs, we show that CONUS100 can probe an unexplored region of parameter space at MeV masses, in particular through $a\\to e^+e^-$ decays of ALPs emitted in the deuteron line, assuming a energy window extended to $10~\\mathrm{MeV}$.","authors":"Lucia Angel, Manfred Lindner, Farinaldo S. Queiroz, Bilge S. Solak","nlinked":61,"nref":67,"src":"INSPIRE","html":true},{"id":"3154143","arxiv":"2605.08501","title":"Lepton Flavor Violating Higgs decays at the Compact Linear Collider","first":"Garay","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[1402978]] (coupling 0.07, 4 shared references). Closest network paper: [[1224299]] (coupling 0.06, 6 shared references). Shared topics: lepton flavor violation.","score":12.5,"rank":14,"section":"replacement","parts":[0.0,0.21,0.17,0.0,0.37],"abstract":"Lepton flavor violating Higgs decays could appear in scenarios beyond the Standard Model of particle physics. In this article, we study the sensitivity of a future Compact Linear Collider (CLIC) to such processes, namely, $h\\rightarrow eμ$, $h\\rightarrowτμ$, and $h\\rightarrow eτ$. In the absence of any observation, 95\\% CL\\ upper limits in the region of $10^{-4}$ to $10^{-5}$ could be placed on the branching fractions of these processes, assuming integrated luminosities of $4$\\,ab$^{-1}$ at $\\sqrt{s}=1.4$ TeV and $5$\\,ab$^{-1}$ at $\\sqrt{s}=3$ TeV.","authors":"Francisca Garay, Gabriel Vega, Philipp Roloff","nlinked":49,"nref":55,"src":"INSPIRE","html":true},{"id":"2969567","arxiv":"2509.12007","title":"Dark Parton Shower Effects for Cosmic Ray Boosted Dark Matter","first":"Chen","nauth":6,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[1518747]]. Closest of your papers: [[2859009]] (coupling 0.04, 7 shared references). Closest network paper: [[3083722]] (coupling 0.08, 19 shared references). Shared topics: direct detection.","score":11.8,"rank":15,"section":"replacement","parts":[0.06,0.12,0.23,0.0,0.25],"abstract":"We investigate the effects of dark parton showers on the direct detection of cosmic-ray boosted dark matter (CRDM), focusing on a dark-photon-mediated model with fermionic dark matter--electron interactions. Using a Monte Carlo framework to incorporate Sudakov form factors and kinematic dipole recoil schemes, we simulate the evolution of the CRDM energy spectrum under dark sector splitting. Our results reveal that dark parton showering induces an energy-dependent reshaping of the CRDM flux, particularly characterized by a depletion of the high-energy flux. For a dark matter (DM) mass of 1 keV and a coupling of $g_D=3$, the CRDM flux can be enhanced by up to a factor of 1.12 in the $\\mathcal{O}(10^{-2} \\sim 1)$ MeV energy range for $2m_χ\\lesssim m_{A^\\prime} \\lesssim 10^{-2}$ MeV, whereas it is suppressed by more than 50% at energies around 100 MeV for $m_{A^\\prime} \\lesssim 10^{-3}$ MeV. We then translate these effects into experimental sensitivities for PandaX-4T, Super-Kamiokande, and JUNO. For $m_{A^\\prime} = 10^{-3}$ MeV and $g_D=3$, the bounds on the kinetic mixing parameter $ε^2$ are relaxed by factors of 1.02, 1.6, and 1.4, respectively. Incorporating the effects of DM parton distribution functions (PDFs) at neutrino detectors alongside dark parton shower effects further relaxes these bounds.","authors":"Zirong Chen, Shao-Feng Ge, Jinmian Li, Junle Pei, Feng Yang, Cong Zhang","nlinked":171,"nref":176,"src":"INSPIRE","html":true},{"id":"3220170","arxiv":"2610.38531","title":"Inelastic Kinetic Decoupling in WIMP Leptogenesis: A Minimal $Z_4$ Model","first":"Liu","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2859009]] (coupling 0.04, 4 shared references). Closest network paper: [[2628411]] (coupling 0.08, 8 shared references). Shared topics: indirect detection, relic abundance.","score":11.7,"rank":16,"section":"new","parts":[0.0,0.12,0.23,0.0,0.45],"abstract":"We study a minimal $Z_4$-symmetric extension of the Standard Model in which a singlet Dirac fermion $χ$ constitutes dark matter, whose annihilations generate a lepton asymmetry through WIMP leptogenesis. Kinetic equilibrium is maintained mainly by the inelastic conversion $χL\\leftrightarrow\\barχΨ$. Compared with the near elastic regime, a sizable mass gap suppresses the conversion rate more rapidly as the Universe cools. This naturally drives kinetic decoupling to earlier times, even away from resonance. Starting from the full inelastic collision operator, we derive an effective momentum transfer rate for kinetic decoupling. We then solve the coupled Boltzmann equations for the dark matter abundance, its temperature $T_χ$, and the $B-L$ asymmetry. Early kinetic decoupling can significantly modify the relic abundance, although near resonance this modification can be reduced by annihilation-induced heating. The $B-L$ asymmetry can be affected when asymmetry production overlaps with a substantial departure from kinetic equilibrium. In our scan, the largest deviations occur mainly for $x_{\\rm lep}\\gtrsim x_{\\rm cd}$. After imposing our constraints, asymmetry production typically ends before chemical decoupling, leaving the final asymmetry essentially unchanged. For indirect detection, we generate the photon spectrum with Pythia and evaluate the Fermi-LAT dwarf spheroidal likelihood.","authors":"An Liu, Hong-Hao Zhang","nlinked":56,"nref":61,"src":"INSPIRE","html":true},{"id":"2744388","arxiv":"2401.03827","title":"Supersymmetry, Part I (Theory)","first":"Allanach" Pascoli, Salvador Rosauro-Alcaraz","score":9.1,"section":"replacement","rank":17,"parts":[0.0,0.05,0.28,0.0,0.33],"note":"Closest of your papers: [[2859009]] (coupling 0.02, 3 shared references). Closest network paper: [[3081701]] (coupling 0.10, 9 shared references). Shared topics: dark matter candidate.","abstract":"Super-Kamiokande has reported a small excess of electron antineutrino events in the 20 MeV energy range, in the search for the diffuse supernova neutrino background. We interpret this signal as a possible indication of dark matter that annihilates dominantly into neutrinos, pointing to a thermal dark matter candidate with $s$-wave annihilation and with mass in the tens of MeV range. This mass scale naturally fits into rich dark sector extensions of the Standard Model. Neutrino experiments, including JUNO, will be able to test this hypothesis in the coming years."},{"arxiv":"2610.40629","id":"3220618","title":"A Lighter QCD-Axion from Small Instantons","authors":"Sourav Bera, Susobhan Chattopadhyay, Rick S. Gupta","score":9.0,"section":"new","rank":18,"parts":[0.0,0.15,0.3,0.0,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.05, 5 shared references). Closest network paper: [[2697191]] (coupling 0.11, 14 shared references).","abstract":"We propose models where the QCD axion mass can be much smaller than the standard expectation. We show that this is possible in models where both QCD and the Standard Model flavor structure get modified in the ultraviolet (UV). In these models, both the axion mass and the up-quark Yukawa can receive sizeable non-perturbative contributions from instantons in the UV. If both these effects are carefully taken into account, the QCD axion is not necessarily heavier than usual expectations and can, in fact, be much lighter. We show that if small instanton contributions account for a large fraction of the up-quark Yukawa, the QCD axion can be lighter than standard expectations whereas it is heavier otherwise. We propose two different models where this condition is realised: (1) one where the QCD gauge group emerges as a subgroup from a product of $SU(3)$ groups in the UV; and (2) a composite Higgs model that also implements partial compositeness. In both these models the QCD axion can lie not only in the region to the right of the QCD axion band but also far to its left. This is especially relevant for a range of proposed haloscope and helioscope experiments that will probe a region mostly to the left of the QCD band."},{"arxiv":"2609.31833","id":"3208476","title":"Neutrino Direct Simulation Monte Carlo: Accurate modeling of out-of-equilibrium decaying cosmological relics","authors":"Kensuke Akita, Miguel Escudero, Oleksii Ihnatenko, Maksym Ovchynnikov","score":8.6,"section":"replacement","rank":19,"parts":[0.06,0.08,0.27,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2855387]] (coupling 0.03, 4 shared references). Closest network paper: [[2875244]] (coupling 0.09, 10 shared references).","abstract":"We consider nonstandard cosmologies in which decaying relics inject energy at MeV temperatures, driving neutrinos out of equilibrium. The subsequent neutrino evolution shapes predictions for the cosmic radiation density and primordial light element abundances. Earlier work introduced Neutrino Direct Simulation Monte Carlo ($ν$DSMC), which describes neutrino transport through Monte Carlo sampling of particle interactions. Here, we extend this method by jointly evolving the relic population, neutrino spectra, electromagnetic plasma, and cosmic expansion, and coupling this evolution to Big Bang nucleosynthesis. The framework includes direct and inverse decays of the relic, neutrino flavor conversion, quantum statistics, and pion production by energetic neutrinos. To reveal the physical impact of these effects and independently test $ν$DSMC, we compare several approaches to neutrino evolution across a range of nonstandard cosmological scenarios. We find excellent agreement with independent solutions of quantum kinetic or quasi-classical Boltzmann equations. Compared with these calculations, $ν$DSMC includes a broader range of physical processes and is substantially faster for strongly nonthermal neutrino populations. This makes broad, robust parameter scans for nonstandard cosmologies practical. We show that when departures from thermal equilibrium are large, approximations that average over neutrino momenta can give qualitatively incorrect predictions, including the wrong sign of the change in the effective number of neutrino species and substantially incorrect primordial nuclear abundances. We conclude that the extended $ν$DSMC framework enables reliable cosmological tests of new physics by following neutrino thermalization and its observable consequences."},{"arxiv":"2610.38618","id":"3220196","title":"Two-loop BRST-restoring finite counter-terms for chiral non-abelian gauge theories","authors":"Achilleas Lazopoulos, Vera Paroutiadou","score":8.5,"section":"new","rank":20,"parts":[0.0,0.0,0.56,0.0,0.0],"note":"Closest network paper: [[3213801]] (coupling 0.20, 22 shared references).","abstract":"We study the renormalization of anomaly-free chiral $SU(N)$ gauge theories without scalar fields through two-loop order. We adopt the Breitenlohner--Maison--'t Hooft--Veltman (BMHV) scheme for the treatment of $γ_5$ in dimensional regularization. This prescription induces spurious breaking of BRST symmetry, requiring finite symmetry-restoring counter-terms in addition to the subtraction of ultraviolet divergences. We derive these counter-terms for a general, possibly reducible fermion representation, thus restoring the BRST symmetry, through two loops."},{"arxiv":"2610.39173","id":"3220389","title":"Stable Electroweak Strings and Nambu Monopoles Nested at Inert-Higgs Interfaces","authors":"Muneto Nitta","score":8.4,"section":"new","rank":21,"parts":[0.06,0.11,0.2,0.0,0.0],"note":"Also cites widely used network papers: [[902365]]. Closest of your papers: [[2690106]] (coupling 0.04, 3 shared references). Closest network paper: [[1674879]] (coupling 0.07, 7 shared references).","abstract":"Electroweak $Z$ strings are generally unstable, and their Nambu-monopole endpoints lack topological protection in the bulk. Using degenerate inert and inert-like Higgs vacua as a solvable reference, we show that their interface supports both defects. The analytic interface carries a normalizable $SU(2)$ relative-orientation field. Its effective theory supports locally stable unit-flux $Z$ strings in a one-vacuum phase and fractional $Z$ strings in a two-vacuum phase. The fractional string carries an $S^2$ orientation field; a Nambu monopole is a second kink between symmetry-related, equal-tension $Z$ strings. We identify phases in which Nambu monopoles are confined or deconfined within the interface: in the confined phase, their $Z$ flux is concentrated into fractional strings, whereas in the deconfined phase, the monopole becomes a vortex within the interface and its $Z$ flux spreads radially through the interface. The electromagnetic magnetic field extends outside the interface in both phases. We determine analytic string profiles, effective-theory stability regions, and the unchanged electromagnetic magnetic charge across this confinement transition."},{"arxiv":"2610.38463","id":"3220160","title":"Gauge-parameter cancellation and finite form factors in one-loop quark scattering in the refined Gribov-Zwanziger framework","authors":"Wan Wu","score":8.0,"section":"new","rank":22,"parts":[0.0,0.16,0.21,0.0,0.0],"note":"Closest of your papers: [[1746620]] (coupling 0.06, 3 shared references). Closest network paper: [[2940264]] (coupling 0.07, 4 shared references).","abstract":"We calculate the one-loop amplitude for distinct-flavor massless quark scattering in a local BRST-invariant refined Gribov-Zwanziger theory with minimally coupled quarks. The constraint determinant and two dynamical quark flavors are included in the action and in the loop sum. Retaining the refined Gribov-Zwanziger masses in the free field matrix, we combine the mixed self-energy insertion, complete vertex and box corrections, and external-leg residues. The difference between a general linear covariant gauge and a reference gauge vanishes symbolically after removal of the Stueckelberg regulator in the specified dimensional prescription. We separate ultraviolet and infrared poles, retaining contributions hidden by scaleless integrals and by the order of mass and dimensional limits. Local modified-minimal-subtraction counterterms close the ultraviolet poles, and the remaining infrared poles cancel in the stated nonzero-mass domain. The finite answer is supplied as eight color-spin form factors over a thirty-entry scalar integral inventory, with all 144 finite-function coefficients provided electronically. The result defines a partonic amplitude on a specified analytic branch; it does not assume colored asymptotic states or establish an inclusive next-to-leading-order cross section."},{"arxiv":"2610.38705","id":"3220224","title":"How natural are Froggatt-Nielsen Models?","authors":"Gero von Gersdorff, Lucas Modesto","score":7.9,"section":"new","rank":23,"parts":[0.06,0.11,0.16,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1222142]] (coupling 0.04, 3 shared references). Closest network paper: [[2721886]] (coupling 0.06, 2 shared references).","abstract":"The Froggatt-Nielsen (FN) mechanism aims at a natural explanation of the surprising hierarchical structure of the masses and mixings of Standard Model quarks and leptons. We test this claimed naturalness against various known and some original measures of fine-tuning, including various local measures as well as Bayes fac- tors. The FN models serve as a fruitful laboratory for testing and comparing these measures. We find that the standard Barbieri-Giudice metric is overestimating nat- uralness in many cases, as it does not sufficiently account for the failure of a model to be realized at order-one parameter values, even though the latter are favoured by an appropriate prior distribution. As a side product of our study, we present simple geometric expressions for the posterior distributions of the parameters on the manifold of best-fit values."},{"arxiv":"2512.12023","id":"3092736","title":"Melting LHC detectors: A novel search for stopped long-lived particles","authors":"Julia L. Gonski, Peter W. Graham, Surjeet Rajendran, Harikrishnan Ramani, Samuel S. Y. Wong","score":7.7,"section":"replacement","rank":24,"parts":[0.06,0.1,0.17,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[796080]] (coupling 0.03, 3 shared references). Closest network paper: [[1518938]] (coupling 0.06, 6 shared references).","abstract":"Particles at the TeV scale with lifetimes of a year or longer could have been abundantly produced at the LHC yet escaped detection because of backgrounds, and could still be trapped within detector materials. With gluinos in split supersymmetry as a working example, we show that these trapped particles can be recovered from detector materials once prepared in liquid form, for example, by melting silicon detectors, extracting liquid argon from the electromagnetic calorimeter, or constructing a large water pool near ATLAS or CMS. These liquid samples can then be processed using iterative centrifugation followed by mass spectrometry, enabling single-particle sensitivity in macroscopic samples. This method can potentially discover gluinos up to 3 TeV in mass at the HL-LHC. It can also improve upon existing limits for other long-lived particles. For example, it can discover the stop up to 2 TeV, and will also be sensitive to integer-charged particles in the TeV range."},{"arxiv":"2507.22124","id":"2955520","title":"Supernova cooling from neutrino-devouring dark matter","authors":"Yugen Lin, Chih-Ting Lu, Ningqiang Song","score":7.6,"section":"replacement","rank":25,"parts":[0.0,0.06,0.13,0.0,0.39],"note":"Closest of your papers: [[1607572]] (coupling 0.02, 1 shared references). Closest network paper: [[3069207]] (coupling 0.05, 5 shared references). Shared topics: direct detection, direct detection experiment.","abstract":"Supernova cooling provides a powerful probe of physics beyond the Standard Model (SM), in particular for new, light states interacting feebly with SM particles. In this \\textit{Letter}, we investigate for the first time the production of fermionic dark matter (DM) via the neutrino-devouring process inside a core-collapse supernova, which contributes to the excessive cooling of the supernova. By incorporating state-of-the-art supernova simulation data and the full time evolution information, we derive stringent and robust limits on DM interactions, which can improve upon direct detection limits by several orders of magnitude. We exclude the cross sections down to $10^{-51}-10^{-58}$~cm$^2$ in the keV-MeV mass range for DM-electron scattering, and $10^{-49}-10^{-56}$~cm$^2$ in the 0.1-100~MeV mass range for DM-nucleon scattering, supplemented by complementary constraints from cosmology, astrophysics, colliders and direct detection experiments in the larger cross section regime. We also close almost the entire window in which fermionic DM constitutes $\\mathcal{O}(1)$ fraction of DM due to its coupling to electrons in the keV-MeV mass range."},{"arxiv":"2610.39752","id":"3220475","title":"Dwarf Galaxy Reticulum II's MeerKAT L-Band Observation: Constraining WIMP Dark Matter","authors":"Phillip Badenhorst, Michael Sarkis, Yin-Zhe Ma, Wen-Qing Guo, Geoff Beck, Qiang Yuan, Gyula I. G. Jozsa, Steven G. Murray","score":7.3,"section":"cross","rank":26,"parts":[0.06,0.09,0.12,0.0,0.07],"note":"Also cites widely used network papers: [[1518747]]. Closest of your papers: [[2859009]] (coupling 0.03, 4 shared references). Closest network paper: [[2751074]] (coupling 0.04, 5 shared references).","abstract":"The nature of dark matter remains one of the most profound open questions in modern physics, with weakly interacting massive particles (WIMPs) among the leading candidates proposed to account for the observed anomalies across cosmic scales. If WIMPs annihilate or decay in the dense dark matter haloes of nearby galaxies, the resulting high-energy electrons/positrons can produce synchrotron radiation in the presence of ambient magnetic fields, yielding a potentially detectable radio signature. Dwarf spheroidal galaxies are particularly promising targets for indirect dark matter searches due to their high mass-to-light ratios and low astrophysical foreground contamination. While radio observations have been widely used to constrain WIMP properties in these systems, the resulting limits remain highly sensitive to poorly constrained magnetic field assumptions. Here we utilize L-band ($1.3$--$1.5$ GHz) observations from the MeerKAT array directed towards dwarf galaxy Reticulum II and measure the surface brightness profile across the dwarf galaxy. Combining these measurements with theoretical models of WIMP annihilation and yield 95% confidence level upper limits on the WIMP annihilation cross-section $\\langleσv\\rangle \\lesssim 10^{-26}$ cm$^3$ s$^{-1}$ for masses $m_χ\\sim 10$-$200$ GeV (with the assumed uniform magnetic field model and diffusion constant). As next-generation radio facilities such as the Square Kilometre Array come online, robust characterisation of magnetic environments in dwarf galaxies will be essential to fully exploit their sensitivity to the particle nature of dark matter."},{"arxiv":"2610.40064","id":"3220495","title":"At the EDGES of MADness: phenomenology of relic millicharged atomic dark matter","authors":"Eleonora Vanzan, Kimberly K. Boddy, Ely D. Kovetz","score":7.3,"section":"cross","rank":27,"parts":[0.0,0.04,0.36,0.0,0.07],"note":"Closest of your papers: [[1755250]] (coupling 0.01, 2 shared references). Closest network paper: [[2051195]] (coupling 0.12, 45 shared references).","abstract":"Millicharged dark matter lives in a corner of parameter space that has been considerably shrinking over the past decades, due to constraints from cosmology, astrophysical systems, and ground-based experiments. A particularly interesting probe is the 21-cm absorption signal at Cosmic Dawn, which attracted interest in light of the EDGES claim: the reported excess absorption can be explained by millicharged dark matter with a fractional electric charge of~$10^{-6} \\lesssim ε\\lesssim 10^{-4}$, but it must be a subpercent of the total dark matter abundance to remain consistent with the cosmic microwave background (CMB). We show that very low fractions of millicharged dark matter naturally arise from atomic dark matter: a dark sector model that replicates the physics of standard atomic hydrogen. Dark ions undergo the process of dark recombination, leaving a relic ionized component that, in the presence of kinetic mixing, is naturally millicharged. We modify the cosmological Boltzmann solver CLASS to incorporate this scenario, and we investigate the parameter space of millicharged atomic dark matter (MAD) that is allowed by CMB, large-scale structure, and supernovae data. We find there are cosmologically viable regions of MAD parameter space that are consistent with laboratory and astrophysical bounds and also overlap with the EDGES-defined window. Although the EDGES result is likely not a Cosmic Dawn signal, MAD leaves distinctive cosmological signatures, accessible to upcoming 21-cm observations."},{"arxiv":"2610.27996","id":"3216889","title":"Partial reconstruction of the decay $B_{s}^{0}\\rightarrow φ(K^{+}K^{-})η' (π^{+}π^{-}η)$ at a future high-luminosity Z factory","authors":"Jeremiah D. Juevesano, Marlon P. Brade, Dennis C. Arogancia, Jan Mickelle V. Maratas","score":7.2,"section":"replacement","rank":28,"parts":[0.06,0.05,0.25,0.0,0.0],"note":"Also cites widely used network papers: [[1688995]]. Closest of your papers: [[1627633]] (coupling 0.01, 1 shared references). Closest network paper: [[2012877]] (coupling 0.09, 4 shared references).","abstract":"The decay $B_s^0 \\to φ(K^+K^-)η'(π^+π^-η)$ is of particular interest in flavour physics because in the Standard Model it proceeds predominantly through the quark transition $\\bar{b} \\to \\bar{s}s\\bar{s}$. However, the reconstruction of this decay is experimentally challenging due to the presence of the neutral $η$ particle, which significantly reduces the overall reconstruction efficiency. In this study, the feasibility of using the partial reconstruction technique to reconstruct the invariant mass of the $B_s^0$ meson without explicitly detecting the $η$ particle is investigated. Monte Carlo simulated events corresponding to an FCC-ee environment are used, and the effects of detector momentum and vertex resolutions on the reconstruction performance are examined. The results show that improved vertex resolution substantially improves the global reconstructed mass response and partial-reconstruction efficiency, while improvements in momentum resolution are manifested primarily through a narrowing of the fitted central DCB component. These findings suggest that future high-luminosity $e^+e^-$ colliders such as FCC-ee could effectively exploit the partial reconstruction technique to study rare decay modes containing undetected neutral particles."},{"arxiv":"2610.37852","id":"3220076","title":"Core-collapse universality for inelastic self-interacting dark matter halos","authors":"Evan Batteas, Alexander Brisebois, Maheen Hemani, Maximilian Heyne, J. Leo Kim, Lukas Lehmann, Laura Sagunski, Aster Schnell, Sean Tulin","score":7.1,"section":"cross","rank":29,"parts":[0.0,0.06,0.3,0.0,0.07],"note":"Closest of your papers: [[2859009]] (coupling 0.02, 3 shared references). Closest network paper: [[1989085]] (coupling 0.11, 12 shared references).","abstract":"We study the gravothermal collapse of inelastic dark matter halos with velocity-dependent elastic and dissipative self-interactions. Within the gravothermal fluid framework, we derive the effective cooling rate for dark matter upscattering to an excited state followed by decay back to the ground state, with emitted states carrying off energy from the halo. We solve the gravothermal fluid equations numerically to simulate spherically symmetric halos over the core-growing and collapse phases of their evolution. While halos with purely elastic self-interactions have universal evolution trajectories, inelastic dark matter halos exhibit much more diversity in their evolution. Nevertheless, inelastic halo dynamics contain a hidden parametric universality from which we derive a semi-analytic formula for calculating the halo collapse time for arbitrary velocity-dependent elastic and inelastic cross sections without the need for simulations."},{"arxiv":"2610.38932","id":"3220356","title":"Hunting for Long-Lived ALPs in Top Events via Displaced Dielectron Pairs at the LHC","authors":"Juliette Alimena, Freya Blekman, Cesare Cazzaniga, Xabier Cid Vidal, Jeremi Niedziela, Lovisa Rygaard, Rosalia Soto Rey","score":7.0,"section":"new","rank":30,"parts":[0.0,0.12,0.23,0.0,0.0],"note":"Closest of your papers: [[1708009]] (coupling 0.04, 1 shared references). Closest network paper: [[2812533]] (coupling 0.08, 4 shared references).","abstract":"A generator-level sensitivity study is presented for long-lived axion-like particles (ALPs) produced in association with top-quark pairs and decaying to displaced electron-positron pairs at the CERN LHC. The prompt objects from the top quark-antiquark system provide independent handles for event selection, allowing the event to be selected independently of the displaced electron pair and extending the search to ALP masses below the dimuon threshold. A search strategy motivated by the CMS detector is developed for ALP masses between 17 MeV and 10 GeV and proper decay lengths between 0.1 mm and 1 m. Expected upper limits at 95% confidence level are computed for $σ(pp\\to t\\bar t a)\\times\\mathcal{B}(a\\to e^+e^-)$ as a function of the ALP mass and proper decay length. In the most sensitive region of the parameter space considered, values of the cross section times branching fraction of order $10^{-3}$ pb can be probed for an integrated luminosity of 500 fb$^{-1}$ at $\\sqrt{s}=13$ TeV. These projections do not include detector-level displaced-electron reconstruction or instrumental backgrounds."},{"arxiv":"2606.16099","id":"3168770","title":"LIGO, LISA and Ultralight Axion-like Dark Matter","authors":"Lawrence M. Krauss","score":7.0,"section":"replacement","rank":31,"parts":[0.0,0.12,0.19,0.0,0.07],"note":"Closest of your papers: [[1607572]] (coupling 0.04, 3 shared references). Closest network paper: [[2697191]] (coupling 0.07, 7 shared references).","abstract":"Interferometric searches for axion-like dark matter (ALP DM) via the induced photon birefringence in a coherent background have been proposed and analyzed by several authors over the past decade, with tabletop experiments (LIDA, ADBC, DANCE) reporting first results and detailed calculations available for both ground-based (LIGO, GEO600 via DarkGEO) and space-based (LISA, TianQin, Taiji, BBO via Gué et al. and Yao et al.) gravitational-wave detectors. We revisit this class of measurements within the framework of Krauss (2019), and provide a detailed treatment of the interplay between the DM coherence length $λ_{\\rm coh}$, the interferometer arm length $L$, and the detector transfer function, with attention to the distinct suppression regimes $λ_{\\rm coh} > L$ (cancellation) and $λ_{\\rm coh} < L$ (random walk). For LIGO the sensitivity is set by the Fabry-Pérot arm cavity response peaking sharply near the cavity free spectral range, reproducing the results of Nagano et al.; the naive single-pass estimate substantially overstates the reach and cannot be applied directly. For LISA, with the polarization-sensitive modification proposed by Gué et al. or Yao et al., the natural mass range $m_a \\sim 4\\times10^{-19}$--$4\\times10^{-16}$ eV (LISA science band) is accessible and the projected reach $g_{aγγ}\\lesssim {\\rm few}\\times 10^{-13}$ GeV$^{-1}$ (realistic optical-metrology noise) improves on the CAST bound over most of the band by up to about two orders of magnitude. We discuss directional signatures from the Galactic DM wind, both annual and sidereal, as a discrimination tool for candidate signals. Local DM substructure with anisotropic velocity dispersion can shift and enhance the reach in specific mass windows."},{"arxiv":"2610.38397","id":"3220161","title":"Gravitational Dark Matter Production from Spectator Field in $R^2$-Higgs Inflation","authors":"Arnab Samanta, Rajesh Mondal, Tanmoy Modak","score":6.8,"section":"cross","rank":32,"parts":[0.0,0.0,0.11,0.0,0.52],"note":"Closest network paper: [[2051195]] (coupling 0.04, 11 shared references). Shared topics: relic density, relic abundance.","abstract":"We investigate the cosmological gravitational dark matter production of spectator field $χ$ in the multifield $R^2$-Higgs inflation. The spectator field $χ$ couples to gravity only through a non-minimal coupling $ξ_χχ^2R$ and serves as a dark matter (DM) candidate. Working consistently in the Einstein frame, we derive the equation of motion of the background fields and fluctuations at linear order using the doubly covariant formalism. We show the dark matter production and the subsequent comoving relic abundance heavily depend on this effective mass of the field $χ$. Specifically, we find that there exists cancellation regions in the effective mass-squared of $χ$, which ensures the correct relic abundance is achieved. Further, we show that the preheating from Higgs and Goldstone may play critical role in accounting the observed relic density."},{"arxiv":"2605.08338","id":"3154205","title":"Revisiting predictions for cosmic-ray antinucleon fluxes from Galactic Dark Matter","authors":"Lorenzo Stefanuto, Mattia Di Mauro, Fiorenza Donato, Nicolao Fornengo, Jordan Koechler, David Maurin","score":6.8,"section":"replacement","rank":33,"parts":[0.0,0.11,0.18,0.0,0.07],"note":"Closest of your papers: [[860906]] (coupling 0.04, 3 shared references). Closest network paper: [[1697948]] (coupling 0.06, 8 shared references).","abstract":"The data on cosmic antiprotons have reached an outstanding precision on energies spanning from GeV to hundreds of TeV, thanks to the space-based AMS-02 experiment. The balloon-borne GAPS experiment, which just completed its first Antarctic flight, will address antiproton and antideuteron fluxes well below GeV energies. Antinuclei in cosmic rays, as well as being produced by spallation reactions between cosmic-ray nuclei and the atoms of the interstellar medium, may hide contributions from exotic sources, such as particle dark matter annihilation in the Galaxy. In this paper, we present predictions for cosmic antiproton, antideuteron and antihelium fluxes both from secondary and dark matter origin. We use state-of-the-art production spectra, nuclear coalescence for antinuclei, and Galactic propagation models to derive upper limits on the dark matter annihilation cross-section from AMS-02 antiproton data in different propagation scenarios (BIG and QUAINT). We quantify the impact of future GAPS data, showing that its sensitivity to sub-GV antiprotons could improve the $\\langleσv\\rangle$ constraints by up to an order of magnitude for light DM ($m_χ \\lesssim 50$ GeV). For heavier antinuclei, the detection perspective with existing and upcoming experiments are derived for those scenarios consistent with AMS-02 antiproton flux. The detectability of such signals strongly depends on the experiment, the propagation model, and the hadronization tuning. Our analysis underscores the complementarity of antinuclei channels for indirect DM searches and the critical role of low-energy windows in constraining light DM candidates."},{"arxiv":"2610.39579","id":"3220445","title":"Cosmological constraints on extra radiation and early dark energy with lepton asymmetry and varying quark masses","authors":"Yo Toda","score":6.7,"section":"cross","rank":34,"parts":[0.0,0.03,0.17,0.0,0.33],"note":"Closest of your papers: [[1755250]] (coupling 0.01, 2 shared references). Closest network paper: [[2051195]] (coupling 0.06, 23 shared references). Shared topics: neutrino mass.","abstract":"We investigate cosmological constraints on extra radiation and axionlike early dark energy (EDE), allowing primordial lepton asymmetry or light-quark-mass variation during big bang nucleosynthesis (BBN). We combine Planck CMB, DESI DR2 BAO, Pantheon+ supernovae, and primordial helium and deuterium measurements. When both extra radiation and lepton asymmetry are allowed, we obtain $N_{\\rm eff}=3.27\\pm0.16$, $ξ=0.017\\pm0.011$, and $H_0=69.24\\pm0.92\\,{\\rm km\\,s^{-1}\\,Mpc^{-1}}$. A positive lepton asymmetry compensates the helium increase caused by extra radiation, allowing a higher inferred Hubble constant even with the LBT helium measurement, which agrees with standard BBN. For EDE, primordial-abundance measurements instead restrict the higher baryon densities associated with larger EDE fractions, which reduce the predicted deuterium abundance. Allowing lepton asymmetry does not relax this restriction. In contrast, a positive light-quark-mass variation increases deuterium and compensates this reduction, permitting larger EDE fractions and a higher inferred Hubble constant. The same variation leaves the extra-radiation constraint nearly unchanged. We also find that allowing lepton asymmetry relaxes the 95\\% upper limit on the summed neutrino mass from $0.0640\\,{\\rm eV}$ to $0.0777\\,{\\rm eV}$ in the extra-radiation model."},{"arxiv":"2607.08833","id":"3179630","title":"Flavorful Interactions of AGN Neutrinos with Dark Matter Spike","authors":"S. Abbaslu, Y. Farzan, A. Maleki","score":6.7,"section":"replacement","rank":35,"parts":[0.0,0.03,0.13,0.0,0.37],"note":"Closest of your papers: [[796080]] (coupling 0.01, 1 shared references). Closest network paper: [[3070028]] (coupling 0.04, 4 shared references). Shared topics: neutrino mass.","abstract":"IceCube-Gen2 is going to make the dream of precise flavor ratio measurement for high energy cosmic neutrinos a reality. Motivated by this prospect, we build a model for the interaction of neutrinos with the dark matter and study the impact of the neutrino interaction with the dark matter spike around active galactic nuclei on the neutrino flavor ratio measurement. We show that, under certain circumstances, the flavor measurement by IceCube-Gen2 may discriminate between this model and the standard expectation, $(ν_e^\\oplus:ν_μ^\\oplus:ν_τ^\\oplus)\\simeq (1/3:1/3:1/3)$, as well as the prediction for a damped muon source. We discuss how we can derive information about the spike as well as about the characteristics of the dark matter particles composing it by combining the flavor ratio measurements with the results of the terrestrial experiments determining the neutrino mass ordering and a potential deviation from the standard model predictions in the measurements of the tau decay modes."},{"arxiv":"2610.40275","id":"3220532","title":"Going off the (momentum) grid: A simple implementation of noncold relics in linear Boltzmann solvers","authors":"Arad Nasiri, Murali Saravanan, Caio B. de S. Nascimento","score":6.6,"section":"cross","rank":36,"parts":[0.06,0.05,0.16,0.0,0.07],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1755250]] (coupling 0.02, 5 shared references). Closest network paper: [[2052515]] (coupling 0.06, 19 shared references).","abstract":"Linear Boltzmann solvers typically evolve the perturbations of noncold relics, such as massive neutrinos or hot subcomponents of the dark matter, on a momentum grid, often switching to a fl function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}, not drawn in the network`;
  box.innerHTML=X.map(n=>`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
list();nextList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
