<script>
const RAW = {"n":[{"id":"3219721","arxiv":"2610.35444","title":"Probing the singlet-triplet scotogenic model with lepton flavor violation, gravitational waves and dark matter","first":"Li","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites your papers: [[1746620]]. Cites 10 network papers: [[2871910]], [[2878308]], [[2701993]], [[2940359]], [[1862804]], [[2689316]]…. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1746620]] (coupling 0.09, 14 shared references). Closest network paper: [[3219721]] (coupling 1.00, 118 shared references). Shared topics: scotogenic model, lepton flavor violation, neutrino mass, direct detection.","score":66.8,"rank":1,"section":"new","parts":[1.0,0.27,1,0.0,0.88],"abstract":"We perform a comprehensive phenomenological analysis of neutrino masses, lepton-flavor violation, gravitational-wave signature induced by the first-order electroweak phase transition, and scalar dark matter within the framework of the singlet--triplet scotogenic model. We derive general analytical expressions for the one-loop Wilson coefficients of the penguin and box contributions to lepton-flavor-violating processes, considering generic scalar and fermion mediators. These general results are then applied to the singlet--triplet scotogenic model to calculate the branching ratios of $μ\\to eγ$ and $μ\\to e\\overline{e}e$, as well as the coherent $μ$--$e$ conversion rate. We systematically investigate the lepton-flavor-violation phenomenology and the constraints from current and future experiments. It is found that the coupling $λ_5$ plays a key role in connecting neutrino masses, lepton flavor violation, and dark matter direct detection. We also study the finite-temperature effective potential and the gravitational-wave signatures of the resulting first-order phase transition. By analyzing the thermal history of the model, we identify the viable parameter space allowing for a first-order electroweak phase transition in the early Universe and find that the portal parameters $λ_1^Ω$ and $μ_1$ play a crucial role in determining the transition strength. The corresponding stochastic gravitational-wave spectra can be probed by future gravitational-wave observatories. As a representative example, we identify a benchmark point that simultaneously satisfies the current constraints from lepton-flavor-violation and dark-matter experiments and generates a stochastic gravitational-wave spectrum that may be probed by the Laser Interferometer Space Antenna, the Big Bang Observer, and the Ultimate Deci-hertz Interferometer Gravitational-wave Observatory.","authors":"Shi-Yu Li, Jun-Nan Lu, Yang Zhang, Gui-Jun Ding","nlinked":118,"nref":134,"src":"INSPIRE","html":true},{"id":"3219000","arxiv":"2610.34880","title":"Light top-flavoured dark matter in dark SMEFT: one-loop matching and phenomenology","first":"Gao","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2012877]]. Also cites widely used network papers: [[1518747]]. Closest of your papers: [[2859009]] (coupling 0.10, 13 shared references). Closest network paper: [[2813804]] (coupling 0.15, 18 shared references). Shared topics: indirect detection, relic abundance.","score":36.5,"rank":2,"section":"new","parts":[0.48,0.28,0.42,0.0,0.49],"abstract":"We study light top-flavoured dark matter (DM) below the electroweak (EW) scale within the dark Standard Model effective field theory (DSMEFT). We perform the one-loop matching of the DSMEFT onto the dark low-energy effective field theory (DLEFT) at the EW scale for all relevant operators that couple scalar, fermionic or vector DM, as well as axion-like particles, exclusively to third-generation quarks. After QCD evolution to the relevant low-energy scales, we match the DLEFT onto the non-relativistic EFT for DM-nucleus scattering. This EFT chain provides a unified framework for phenomenological studies of rare $B$- and $K$-meson decays with missing energy, direct and indirect detection, and the thermal relic abundance. Interpreting the Belle II excess in $B^+\\to K^+ν\\barν$ as a decay into DM, we find that only the DSMEFT operators contributing at tree level can accommodate it with $O(1)$ couplings for a new-physics scale of $1\\,\\mathrm{TeV}$. The decay $B^0\\to K^{*0}+\\mathrm{inv}$ provides the strongest constraint over large portions of the Belle II-favoured parameter space, while $K^+\\toπ^++\\mathrm{inv}$ can dominate at low and $B_s\\to\\mathrm{inv}$, $B^+\\toπ^++\\mathrm{inv}$ and $Υ(1S)\\to\\mathrm{inv}$ become important at high DM masses, respectively. Direct-detection searches by CRESST-III and DarkSide-50 are competitive for operators involving scalar quark currents and, depending on the operator, exclude the Belle~II-favoured band for $m_{\\mathrm{DM}}\\gtrsim1$-$2\\,\\mathrm{GeV}$. We also perform detailed analyses of the thermal relic abundance and the indirect-detection constraints from the CMB and Fermi-LAT.","authors":"Meng-Chao Gao, Xin-Qiang Li, Ya-Dong Yang, Xing-Bo Yuan, Xin Zhang","nlinked":166,"nref":177,"src":"INSPIRE","html":true},{"id":"3219068","arxiv":"2610.35587","title":"Neutrino Phenomenology and Leptogenesis from Non-Invertible Fusion Symmetry","first":"Borah","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2715897]]. Closest of your papers: [[1249404]] (coupling 0.05, 4 shared references). Closest network paper: [[3214252]] (coupling 0.10, 8 shared references). Shared topics: neutrino mass, seesaw model, majorana mass, neutrino data.","score":31.0,"rank":3,"section":"new","parts":[0.45,0.13,0.29,0.0,0.68],"abstract":"We constructed a minimal type-I seesaw model with two right-handed neutrinos, in which the flavor structure is determined by a non-invertible \\(\\mathbb{Z}_2\\)-gauged \\(\\mathbb{Z}_5\\) fusion symmetry~($\\mathbb{Z}^{IN}_5$). The framework, incorporating a second Higgs doublet and an auxiliary \\(\\mathbb{Z}_2\\) parity, yields predictive neutrino mass textures without introducing flavon fields. A fit to neutrino data selects the inverted mass ordering with \\(m_3=0\\) and predicts a nearly maximal Dirac CP phase, together with a characteristic prediction for the effective Majorana mass governing neutrinoless double-beta decay($0νββ$). We further investigate thermal leptogenesis and show that the framework can reproduce the observed baryon asymmetry of the Universe. Our results establish a connection between predictive neutrino phenomenology and leptogenesis within a minimal framework based on non-invertible fusion symmetry.","authors":"Pulakesh Borah, Mrinal Kumar Das","nlinked":34,"nref":42,"src":"INSPIRE","html":true},{"id":"3218847","arxiv":"2610.33593","title":"A Tool-Grounded AI Agent for Gauge Coupling Unification and Proton Decay","first":"Saad","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[707996]]. Closest of your papers: [[1518959]] (coupling 0.03, 3 shared references). Closest network paper: [[1861353]] (coupling 0.11, 12 shared references).","score":23.6,"rank":4,"section":"new","parts":[0.45,0.1,0.31,0.0,0.0],"abstract":"We present proton_agent, a tool-grounded AI agent that enables natural-language interaction with computational tools for gauge coupling unification and proton decay in grand unified theories. The agent translates user requests into computational tasks, selects and executes the appropriate tools, and interprets their outputs. All numerical calculations, model evaluations, experimental comparisons, parameter scans, and visualizations are handled by a deterministic scientific backend to ensure numerical accuracy and reproducibility. A central objective of this framework is to enable fully local deployment using free and open-source LLMs, while retaining compatibility with commercial LLM APIs. The framework computes one- and two-loop gauge beta coefficients for user-defined scalar and fermion multiplets and performs gauge coupling evolution through the Standard Model and various intermediate symmetry-breaking stages of $SO(10)$, including $SU(3)_C \\times SU(2)_L \\times SU(2)_R \\times U(1)_{B-L}$, $SU(3)_C \\times SU(2)_L \\times U(1)_R \\times U(1)_{B-L}$, $SU(4)_C \\times SU(2)_L \\times U(1)_R$, and $SU(4)_C \\times SU(2)_L \\times SU(2)_R$. For proton decay, the framework evaluates gauge-mediated dimension-six contributions in non-supersymmetric $SU(5)$ and $SO(10)$, as well as dressed dimension-five contributions in their supersymmetric counterparts. It supports benchmark calculations for user-specified parameter points, random and grid-based parameter scans, Markov-chain Monte Carlo exploration, comparisons with experimental limits, and publication-ready two- and three-dimensional visualizations. We describe the agent architecture, demonstrate its capabilities through representative benchmark calculations and regression tests, and discuss its current physics scope.","authors":"Shaikh Saad","nlinked":73,"nref":81,"src":"INSPIRE","html":true},{"id":"3218872","arxiv":"2610.33805","title":"Fermiophobic Z' Bosons in 3-4-1 Models: Classification and Collider Constraints","first":"Suarez","nauth":3,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Rojas. Closest of your papers: [[611590]] (coupling 0.04, 3 shared references). Closest network paper: [[1960293]] (coupling 0.17, 8 shared references). Shared topics: collider phenomenology, gauge symmetry.","score":20.1,"rank":5,"section":"new","parts":[0.0,0.12,0.48,0.5,0.44],"abstract":"We investigate the fermion spectra and collider phenomenology of models based on the \\(SU(3)_C \\otimes SU(4)_L \\otimes U(1)_X\\) gauge symmetry, focusing on two realizations of the electric charge operator characterized by \\(b=c=1\\) and \\(b=1,\\ c=-2\\). For each configuration, we classify anomaly-free fermion sets and identify five minimal spectra with at least three SM-like quark and lepton families for each configuration, distinguishing algebraically irreducible structures from reducible spectra that remain minimal under the three-family requirement. We derive the chiral couplings of the additional neutral gauge boson \\(Z'\\) to Standard Model fermions and show that distinct anomaly-free fermion spectra can lead to identical low-energy neutral-current interactions. We then investigate the corresponding collider constraints using the ATLAS dilepton resonance search at \\(\\sqrt{s}=13\\) TeV with an integrated luminosity of \\(139\\,\\mathrm{fb}^{-1}\\), assuming negligible \\(Z-Z'\\) mixing and kinematically inaccessible exotic fermions. A particularly interesting result emerges for the \\(b=c=1\\) configuration, where all \\(Z'\\) couplings to Standard Model fermions are proportional to \\(\\sinψ\\), with \\(ψ\\) denoting the additional neutral gauge-boson mixing angle. Consequently, these couplings vanish simultaneously at \\(ψ=nπ\\), giving rise to a fermiophobic limit in which conventional Drell-Yan dilepton constraints disappear. In contrast, the \\(b=1,\\ c=-2\\) configuration does not exhibit a universal fermiophobic limit. Our results demonstrate that collider constraints on additional neutral gauge bosons depend sensitively on the fermion embeddings and neutral gauge-boson mixing structure, and suggest the possibility of comparatively light \\(Z'\\) bosons in suitable realizations of extended electroweak gauge theories.","authors":"Eduard Suarez, Yithsbey Giraldo, Eduardo Rojas","nlinked":24,"nref":24,"src":"INSPIRE","html":true},{"id":"3218965","arxiv":"2610.34720","title":"Fermion Mass and Mixing Patterns from Fusion Algebras","first":"Distler","nauth":3,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[509514]] (coupling 0.05, 3 shared references). Closest network paper: [[3144122]] (coupling 0.19, 11 shared references). Shared topics: fermion mass.","score":16.8,"rank":6,"section":"new","parts":[0.06,0.15,0.55,0.0,0.2],"abstract":"The large hierarchy of fermion masses in the Standard Model has long posed a challenge to be explained. One approach is to try to invoke a symmetry principle to dictate the structure (\"texture\") of the matrices of fermion Yukawa couplings to the Higgs field. Here we invoke noninvertible symmetries, specifically, fusion algebras, to provide such textures. In particular, the structure of the fusion-algebra can be used to assign labels to each field, which determines how suppressed any given composite operator is as a term in the Lagrangian. In UV completions, this can be interpreted as specifying a hierarchy of operators that in the IR effective theory become the Yukawa couplings to the Higgs field. Remaining agnostic of a specific UV model, we perform a Monte Carlo numerical scan over unknown Wilson coefficients, and we identify the rank-8 fusion algebra $\\rm{FR}^{8,6}_8$ as the one providing the best fit for the textures of the up-quark, down-quark and charged-lepton Yukawa matrices. We also study the predictions for the CKM and PMNS mixing matrices, with the conclusion that none of the fusion algebras we study provide an accurate fit for the masses and mixing angles simultaneously. The fusion algebra structure ensures that the textures that we find are stable under RG running and persist down to low energies.","authors":"Jacques Distler, Can Kilic, Sanjay Mathai","nlinked":41,"nref":43,"src":"INSPIRE","html":true},{"id":"3218910","arxiv":"2610.34325","title":"Near-exact Upper Confidence Limits for Axion Haloscopes","first":"Rosso","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1607572]] (coupling 0.07, 4 shared references). Closest network paper: [[2697191]] (coupling 0.12, 11 shared references).","score":11.1,"rank":7,"section":"cross","parts":[0.0,0.19,0.35,0.0,0.0],"abstract":"The data acquisition of axion haloscopes commonly implements sequential adaptive frequency scans. We present a method to calculate likelihood-based upper confidence limits on axion-photon coupling under this circumstance. We compare the likelihood-based method conceptually and quantitatively with tailor-made methods, i.e. the one proposed by Brubaker et al. (Geometric) and its upgrade the Bayesian Power-Measured (BPM) framework proposed by Palken et al. We find that the likelihood method yields average upper limits that are significantly more constraining than those obtained from these methods. For example, expected constraints improve by a factor of 1.4 as compared with the current state of the art when applied to projections for the ALPHA Plasma-haloscope. We further clarify the statistical basis for the Geometric and BPM methods. In particular, we point out the correspondence of BPM to e-values, proposed as an alternative to conventional p-values in statistics.","authors":"Andrea Gallo Rosso, Jan Conrad","nlinked":32,"nref":48,"src":"INSPIRE","html":true},{"id":"2871910","arxiv":"2501.13171","title":"Type-III scotogenic model: Inflation, dark matter, and collider phenomenology","first":"Singh","nauth":4,"year":2025,"cites":10,"role":"other","note":"","score":null},{"id":"1955022","arxiv":"2110.15167","title":"Singlet fermion dark matter and Dirac neutrinos from Peccei-Quinn symmetry","first":"Carvajal","nauth":4,"year":2021,"cites":7,"role":"other","note":"","score":null},{"id":"2878308","arxiv":"2502.05270","title":"Collider signatures of fermionic scotogenic dark matter","first":"Lozano","nauth":3,"year":2025,"cites":10,"role":"other","note":"","score":null},{"id":"611590","arxiv":"hep-ph/0301088","title":"Supersymmetric one family model without Higgsinos","first":"Mira","nauth":4,"year":2003,"cites":4,"role":"seed","note":"","score":null},{"id":"2817040","arxiv":"","title":"Review of particle physics","first":"Navas","nauth":244,"year":2024,"cites":6536,"role":"other","note":"","score":null},{"id":"1759674","arxiv":"1910.08422","title":"Phenomenology of scotogenic scalar dark matter","first":"Ávila","nauth":4,"year": 0,"c"],[44,22,"c"],[18,40,"c"],[33,53,"c"],[15,53,"c"],[11,34,"c"],[6,41,"k"],[14,24,"c"],[3,43,"k"],[12,35,"c"],[39,22,"c"],[50,12,"c"],[44,12,"c"],[36,23,"c"],[50,53,"c"],[4,49,"k"],[0,50,"c"],[1,51,"k"],[24,53,"c"],[28,53,"c"],[33,23,"c"],[51,23,"c"],[14,22,"c"],[8,38,"c"],[16,31,"c"],[7,23,"c"],[16,28,"c"],[16,35,"c"],[44,23,"c"],[37,36,"c"],[35,28,"c"],[12,53,"c"],[31,28,"c"],[14,53,"c"],[16,44,"c"],[33,44,"c"],[16,11,"c"],[8,24,"c"],[49,53,"c"],[5,27,"k"],[13,27,"c"],[44,14,"c"],[44,31,"c"],[7,11,"c"],[4,32,"k"],[17,23,"c"],[44,35,"c"],[41,8,"c"],[33,15,"c"],[44,11,"c"],[33,9,"c"],[6,38,"k"],[1,39,"k"],[16,53,"c"],[7,12,"c"],[44,9,"c"],[0,46,"c"],[5,47,"k"],[7,53,"c"],[9,50,"c"],[13,47,"c"],[28,15,"c"],[23,28,"c"],[34,45,"c"],[44,53,"c"],[16,23,"c"]],"next":[{"arxiv":"2610.35789","id":"3219121","title":"The neutrino fog for inelastic dark matter","authors":"C. S. Amarasinghe","score":9.5,"section":"new","rank":8,"parts":[0.0,0.12,0.34,0.0,0.07],"note":"Closest of your papers: [[2859009]] (coupling 0.04, 2 shared references). Closest network paper: [[3201080]] (coupling 0.12, 6 shared references).","abstract":"We characterize the behavior of the neutrino fog for inelastic dark matter scattering on xenon. The inelastic scattering kinematics reshape the recoil spectrum of the signal and produce a qualitatively different neutrino fog landscape. In some regions of the inelastic parameter space the fog is completely absent for future xenon experiments at any scale, while in other regions the fog is dispelled only to reappear at larger exposures. We find that multiple background sources with uncertain normalizations can make the onset of the fog jump discontinuously with the dark matter mass and mass splitting, while the discovery limit varies smoothly. We also describe a mechanism by which reduced uncertainties on neutrino rates may have the unintuitive effect of raising neutrino floors derived from the fog opacity."},{"arxiv":"2610.33152","id":"3218788","title":"A Low Scale for Quark-Lepton Unification","authors":"Lawrence J. Hall, Claudio Andrea Manzari, Clara Murgui","score":8.8,"section":"new","rank":9,"parts":[0.06,0.05,0.22,0.0,0.2],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[530816]] (coupling 0.02, 1 shared references). Closest network paper: [[1704332]] (coupling 0.08, 9 shared references). Shared topics: fermion mass.","abstract":"The measured fermion masses may be pointing to the scale of quark-lepton unification. Studying the renormalization-group evolution of the Standard Model Yukawa couplings, we find that $y_τ=y_b$ and $y_μ=3y_s$ occur at nearly the same scale, around $10^6$ GeV, while the first generation reaches the Georgi-Jarlskog relation $y_e\\simeq y_d/3$ at order $10^8$ GeV and can arise from the same Clebsch structure through a simple hierarchical flavor texture. This pattern naturally suggests low-scale Pati-Salam symmetry. We show that flavor mixing and finite threshold corrections preserve this picture. If the electron mass has an independent origin, the two heavier-generation relations can be realized in theories with a unification scale as low as $(5$-$7)\\times10^5$ GeV. We identify two simple theories that accommodate all three relations and in which the measured masses fix the flavor structure. The first unifies all three generations at $4.6^{+1.2}_{-0.9}\\times10^6$ GeV; the second, with symmetric Yukawa matrices, at $1.5^{+0.7}_{-0.5}\\times10^7$ GeV, and predicts $|V_{cb}|=0.042\\pm0.002$. Their shared light-family texture fixes the relevant vector-leptoquark couplings, making $μ\\to e$ conversion in nuclei a direct test of unification: upcoming searches will probe part of the region selected by the two theories, and proposed facilities could cover it completely."},{"arxiv":"2610.33153","id":"3218786","title":"Muon Tridents at FASER and NA64$μ$: Motivation, Predictions, and Prospects for Precision Measurements","authors":"Reinaldo Francener, Victor P. Goncalves, Felix Kling, Gabriel Rabelo-Soares","score":6.9,"section":"new","rank":10,"parts":[0.06,0.06,0.2,0.0,0.0],"note":"Also cites widely used network papers: [[1688995]]. Closest of your papers: [[2855387]] (coupling 0.02, 3 shared references). Closest network paper: [[2946993]] (coupling 0.07, 16 shared references).","abstract":"The intense flux of high-energy muons produced in the far-forward region of $pp$ collisions at the LHC provides a unique opportunity to study rare electromagnetic interactions at TeV energies. In this work, we investigate the muon trident scattering in muon-nucleus interactions at the FASER experiment, which is expected to have recorded more than $10^5$ such events. The theoretical description of the process is reviewed and improved. Predictions for the total event rates and differential distributions expected during Run~3 of the LHC are presented, taking into account realistic detector acceptance and the main background contributions. The dependence of the predictions on the treatment of the nuclear form factors and the impact of higher-order QED effects such as Coulomb corrections are investigated. Our results indicate that the muon trident process can be measured for the first time at TeV energies using FASER's spectrometer, with a projected precision on the cross-section at the percent level. We also extended our analysis to the NA64$μ$ experiment and showed that, together with FASER, these experiments can probe the energy dependence of the muon trident cross-section over a broad unexplored energy range."},{"arxiv":"2610.33662","id":"3218857","title":"Relativistic corrections to $Υ(1S,2S)\\rightarrowγη^{(\\prime)}$ in perturbative QCD","authors":"Cong Wang, Chao-Jie Fan, Jun-Kang He","score":6.7,"section":"new","rank":11,"parts":[0.06,0.09,0.14,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2855387]] (coupling 0.03, 4 shared references). Closest network paper: [[2625199]] (coupling 0.05, 4 shared references).","abstract":"We calculate the radiative decays $Υ(1S),Υ(2S)\\rightarrowγη^{(\\prime)}$ in perturbative quantum chromodynamics through order $q^{2}$ in the relativistic expansion, including the quark-content, two-gluon, and electromagnetic contributions. The quark contribution dominates, with substantial constructive electromagnetic interference and a strongly suppressed gluon contribution. The annihilation rates depend weakly on the tested light-cone distribution amplitudes and light-quark masses. Relativistic corrections reduce the $Υ(1S)$ rates by a few percent but enhance the $Υ(2S)$ rates by approximately $17\\%$--$30\\%$. The ratio of the $γη^{\\prime}$ and $γη$ branching fractions is sensitive to the light-meson mixing parameters, with predictions differing by about a factor of $5$ between two representative schemes. At a scale of half the quarkonium mass, however, the $Υ(1S)\\rightarrowγη^{\\prime}$ central predictions in the two mixing schemes exceed the experimental upper limit by factors of approximately $5$ and $7$. We also examine the heavy-pseudoscalar admixtures in the light mesons. The $η_c$ contribution is small, whereas $η_b$ mixing can substantially modify the rates through interference. Destructive interference alleviates the discrepancy. With the scale set to the quarkonium mass, the prediction in the mixing scheme inferred from transition form factors is compatible with the upper limit within the input uncertainty."},{"arxiv":"2610.33725","id":"3218866","title":"Direct Detection of Millicharged Particles from Evaporating Primordial Black Holes","authors":"Biprajit Mondal","score":6.3,"section":"new","rank":12,"parts":[0.0,0.07,0.15,0.0,0.2],"note":"Closest of your papers: [[1207270]] (coupling 0.02, 1 shared references). Closest network paper: [[2802615]] (coupling 0.05, 4 shared references). Shared topics: direct detection.","abstract":"We investigate the direct detection of millicharge particles produced via Hawking evaporation of neutral primordial black holes (PBHs). As they travel through the Galactic magnetic field and then Earth's overburden, they lose energy before reaching an underground detector. Using electron recoil signals, we obtain constraints on the mass and charge parameter space for XENONnT, JUNO and Super-K for evolved PBH populations with initial mass $ M_i=10^{15}~\\rm g$ and $ M_i=8\\times10^{15}~\\rm g$ with initial abundances $f_i^{\\rm PBH}=3.9\\times10^{-7}$ and $f_i^{\\rm PBH}=3.7\\times10^{-4}$, respectively. In the relevant parameter space, this model can provide strong constraints in the high mass region."},{"arxiv":"2610.35379","id":"3219053","title":"Revisiting supernova constraints on dark gauge bosons","authors":"Zun Wang, Yongchao Zhang","score":5.9,"section":"new","rank":13,"parts":[0.06,0.05,0.16,0.0,0.0],"note":"Also cites widely used network papers: [[1362180]]. Closest of your papers: [[1854224]] (coupling 0.02, 4 shared references). Closest network paper: [[2513697]] (coupling 0.06, 13 shared references).","abstract":"We revisit the supernova constraints on three well-motivated light gauge bosons: the dark photon, the $U(1)_{B-L}$ gauge boson, and the $U(1)_{L_μ-L_τ}$ gauge boson. For the dark photon and the $U(1)_{B-L}$ gauge boson, we re-evaluate the nucleon bremsstrahlung process within the one-pion exchange approximation, retaining the full momentum and mass dependence. The geometrical dependence of the decay and absorption of these gauge bosons inside the supernova core is also taken into account. Updated bounds on these models are derived based on the cooling of SN1987A and energy deposition constraints from low-energy supernovae (LESNe). Taking the SFHo-18.8 $18.8\\,M_\\odot$ profile, the SN1987A cooling constraints reach masses of about $230$ MeV, $280$ MeV, and $300$ MeV for the dark photon, the $U(1)_{B-L}$ boson, and the $U(1)_{L_μ-L_τ}$ boson, while the corresponding LESN limits extend to about $450$ MeV, $440$ MeV, and $600$ MeV, respectively. The kinetic mixing parameter $ε$ for dark photon, the gauge coupling $g_{BL}$ in the $U(1)_{B-L}$ model, and the gauge coupling $g_{μτ}$ for the $U(1)_{L_μ-L_τ}$ model are constrained down to $5.8\\times10^{-12}$, $2.9\\times10^{-16}$, and $6.4\\times10^{-12}$, respectively."},{"arxiv":"2610.34380","id":"3218940","title":"Spiralling into Dark Energy: Axio-Dilaton Attractors in Light of Current Data","authors":"Mario Ramos-Hamud","score":5.9,"section":"cross","rank":14,"parts":[0.0,0.0,0.06,0.5,0.0],"note":"Co-authors of yours: Ramos-Hamud. Closest network paper: [[795558]] (coupling 0.02, 2 shared references).","abstract":"In string compactifications, dilaton-like moduli always come paired with axions, and the two fields interact through a curved field-space metric. We study the cosmology of such an axio-dilaton system, in which the dilaton rolls down an exponential potential corrected by a polynomial prefactor and couples to a massless axion through the kinetic function $W=e^{-ξφ_1/M_p}$. A dynamical systems analysis shows that the late-time attractor follows a non-geodesic trajectory in field space with equation of state $ω_φ=(λ-2ξ)/(λ+2ξ)$, so accelerated expansion is possible for steep potentials provided $ξ\\ggλ$. No physical fixed point is phantom. A Bayesian analysis with DESI DR2 BAO, binned Pantheon supernovae and Planck 2018 distance priors gives $λ\\gtrsim7$--$9$ and $\\log_{10}ξ\\gtrsim2.5$ at 95% confidence, together with a degeneracy between the two parameters. The model is slightly favoured over $Λ$CDM by current data, while the different polynomial corrections cannot yet be distinguished. This contribution is based on arXiv:2609.22539."},{"arxiv":"2610.33729","id":"3218865","title":"Exploring the Limits: Neutrino Mass and Interacting Dark Sector in the DESI Era","authors":"Weiqiang Yang, Sibo Zhang, Supriya Pan, Luis A. Anchordoqui, Eleonora Di Valentino","score":5.3,"section":"new","rank":15,"parts":[0.0,0.0,0.09,0.0,0.39],"note":"Closest of your papers: [[1686334]] (coupling 0.00, 1 shared references). Closest network paper: [[2940283]] (coupling 0.03, 8 shared references). Shared topics: neutrino mass.","abstract":"We constrain three interacting dark matter--dark energy scenarios using cosmic microwave background measurements, DESI DR2 baryon acoustic oscillations, and the PantheonPlus, Union3, and DES-Dovekie Type Ia supernova compilations. We consider interacting vacuum energy and interacting dark energy with a constant equation of state in the phantom and quintessence regimes, analyzing each scenario with either a fixed total neutrino mass or a freely varying effective neutrino mass. When the positivity prior is relaxed, all three scenarios favor negative effective neutrino masses for every dataset combination. Although some combinations permit small positive masses, none of the 95\\% confidence intervals reaches the minimum mass required by neutrino oscillation experiments. Allowing the effective neutrino mass to vary produces significances for a nonzero coupling reaching approximately $3σ$, but the preferred masses remain negative. These results demonstrate that the interaction and constant dark energy equations of state considered here fail to resolve the DESI neutrino-mass tension."},{"arxiv":"2610.33757","id":"3218862","title":"Dissecting flavor tagging with graph neural networks","authors":"Ankita Budhraja, Sunny Kumar Singh, Balbeer Singh","score":4.8,"section":"new","rank":16,"parts":[0.0,0.04,0.23,0.0,0.0],"note":"Closest of your papers: [[1627633]] (coupling 0.01, 2 shared references). Closest network paper: [[2893828]] (coupling 0.08, 7 shared references).","abstract":"Graph neural networks such as ParticleNet are widely used for quark/gluon jet tagging. We study how the discriminating power of such a network is distributed between constituent multiplicity and the remaining structure of the jet, differentially in jet transverse momentum and multiplicity. To this end, we train ParticleNet on quark and gluon jets from Z+jet production in Pythia, with the two classes matched in transverse momentum and rapidity over the wide range $80\\leq p_{T}^{\\rm jet}\\leq 400$ GeV. We find that the network learns how the fraction of gluon jets changes with the multiplicity in every $p_{T}^{\\rm jet}$ bin, including the shift of the multiplicity at which quark and gluon jets are equally likely, which implies that it uses the jet scale (reconstructed from its constituents) jointly with its substructure. At fixed multiplicity, the gluon probabilities it assigns agree on average with the observed gluon fractions, but are widely spread about the mean. This allows us to interpret its output as the sum of the multiplicity log-likelihood ratio and a residual log-likelihood ratio at fixed multiplicity, which allows the network to correctly identify 20-34% of the jets whose multiplicity favors the opposite class. By rescaling the radial spread of the constituents at fixed multiplicity, we find that the network considers broader jets more gluon-like, and that this response is largest at low and intermediate multiplicity, where the multiplicity alone does not decide the class of a jet."},{"arxiv":"2610.33150","id":"3218780","title":"Dark Matter phase space distribution under a fully relativistic treatment. Eddington inversion according to general relativity","authors":"Jaime Hoefken Zink, Pellegrino Piantadosi","score":4.5,"section":"new","rank":17,"parts":[0.0,0.09,0.07,0.0,0.07],"note":"Closest of your papers: [[2859009]] (coupling 0.03, 3 shared references). Closest network paper: [[1851133]] (coupling 0.03, 2 shared references).","abstract":"We develop a fully relativistic extension of Eddington inversion to reconstruct the phase-space distribution function of dark matter from its density profile. Treating dark matter as an effective perfect fluid in a static, spherically symmetric spacetime, we use the Tolman-Oppenheimer-Volkoff equations to determine the gravitational background and derive an Abel-type inversion that yields the distribution function in terms of the conserved particle energy measured at infinity. We show that the resulting expression recovers the classical Eddington inversion in the weak-field, nonrelativistic limit. We also investigate the finite-boundary contribution, which can introduce an unphysical divergence, and present a regularization procedure that removes it. We apply our method to a Milky Way model consisting of a generalized Navarro-Frenk-White halo and a Gondolo-Silk dark-matter spike around Sagittarius A$^*$, neglecting baryonic contributions. The relativistic and Newtonian velocity distributions agree at radii far from the Galactic center but begin to differ at distances of order $10^{-5}\\,\\mathrm{pc}$. Closer to the black hole, the relativistic peak speed can reach approximately twice the Newtonian prediction. Finally, we derive a general expression for dark-matter capture by neutron stars that accommodates arbitrary ambient velocity distributions. Near Sagittarius A$^*$, the relativistic capture factor is nearly an order of magnitude smaller than the Maxwell-Boltzmann prediction, while the Newtonian Eddington result can overestimate it by a factor of approximately two. These results demonstrate the importance of relativistic phase-space reconstruction for dark-matter phenomenology in strong gravitational fields."},{"arxiv":"2610.35285","id":"3219039","title":"Probing the Collins effect at photon-photon colliders","authors":"Simone Anedda, Carlo Flore, Francesco Murgia, Cristian Pisano","score":4.1,"section":"new","rank":18,"parts":[0.06,0.01,0.11,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.00, 1 shared references). Closest network paper: [[3158084]] (coupling 0.04, 3 shared references).","abstract":"We propose to study the Collins effect in the production of almost back-to-back unpolarized hadrons (mainly charged pions) by looking at their azimuthal distributions around the jet thrust-axis in the process $γγ\\to h_1h_2X$. The quasi-real photons in the initial state can be emitted either by two scattering leptons or two charged heavy nuclei in ultra-peripheral collisions. We provide numerical estimates for kinematic configurations in principle accessible at the Future Circular Collider and at the planned experiments on ultra-peripheral collisions at the LHC. We find that the corresponding asymmetries can be sizable, even up to around 10-15%. The proposed measurements would thus shed light on the fragmentation mechanism of quarks into hadrons and, in principle, would allow one to distinguish among different existing models for the Collins functions."},{"arxiv":"2610.34540","id":"3218964","title":"Axions from Betelgeuse: Probing Axion Couplings with $^{23}\\rm{Na}$ and $^{55}\\rm{Mn}$","authors":"Nicholas A. M. Revel, Baldeep Grewal, Anupam Ray, Aaron C. Vincent","score":4.1,"section":"new","rank":19,"parts":[0.06,0.03,0.07,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 2 shared references). Closest network paper: [[2703113]] (coupling 0.02, 3 shared references).","abstract":"We investigate axion-like particle (ALP) production in the interior of Betelgeuse via nuclear de-excitation of thermally populated excited states of $^{23}$Na and $^{55}$Mn. As these ALPs propagate to Earth, they can produce photons either through their conversion in the Galactic magnetic field or through their decay. Using INTEGRAL-ISGRI and NuSTAR observations, we search for these photon signals, find no significant excess, and derive 95% CL exclusion limits on the ALP couplings. For magnetic-field conversion of ALPs, the $^{23}\\mathrm{Na}$ ($^{55}\\mathrm{Mn}$) line observed with INTEGRAL-ISGRI constrains $|g_{aγ}g_{ap}| < 4.1\\times10^{-21}$ ($6.9\\times10^{-19}$) $\\mathrm{GeV}^{-1}$ for $m_a < 10^{-10} \\mathrm{eV}$. For ALP decays, the $^{23}\\mathrm{Na}$ ($^{55}\\mathrm{Mn}$) line observed with INTEGRAL-ISGRI (NuSTAR) constrains $|g_{aγ}g_{ap}|$ down to $3.0\\times10^{-22}$ ($2.9\\times10^{-19}$) $\\mathrm{GeV}^{-1}$ at $m_a \\simeq 400$ ($83$) keV, weakening in both cases as $m_a^{-3/2}$ for lower ALP masses, and as $m_a^{-2}$ for $^{23}$Na below $m_a \\sim 1$ keV, with sensitivity extending to $m_a \\simeq 440.2$ ($124$) keV. Although our $^{23}\\mathrm{Na}$-based limits are the strongest for both channels, their larger transition energy makes them more sensitive to the precise evolutionary stage of Betelgeuse, whereas the $^{55}\\mathrm{Mn}$-based limits are considerably more robust against such uncertainties."},{"arxiv":"2610.35620","id":"3219103","title":"Threshold effects of inelastic neutrino-dark-matter scattering in AGN spikes","authors":"Cheng-Wei Chiang, Van Que Tran","score":3.7,"section":"new","rank":20,"parts":[0.0,0.05,0.1,0.0,0.07],"note":"Closest of your papers: [[860906]] (coupling 0.01, 1 shared references). Closest network paper: [[2941092]] (coupling 0.04, 4 shared references).","abstract":"High-energy neutrinos from active galactic nuclei provide a powerful probe of dark matter (DM) spikes surrounding supermassive black holes. While elastic neutrino-DM scattering mediated by a light particle produces little net attenuation due to regeneration, inelastic scattering, $νχ_1\\toνχ_2$, introduces a nonzero minimum energy loss, $E_{\\rm th}$. We show that this threshold prevents the near-cancellation between attenuation and regeneration, producing a distinctive spectral deficit above $E_{\\rm th}$ accompanied by a pile-up below it. Solving the full neutrino cascade, including repeated scattering and secondary neutrinos from excited-state decays, we demonstrate that this feature persists for both narrow and broad energy-transfer kernels. Using public IceCube data for NGC 1068 and an unbinned likelihood analysis with a freely fitted intrinsic power-law spectrum, we derive upper limits on the asymptotic optical depth of $τ_0<26-39$ for a narrow kernel (kernel width $ε=0.01$) over $E_{\\rm th}=0.24-3.0$ TeV and $τ_0<20-26$ for a broad kernel ($ε=0.36$) over $E_{\\rm th}=0.24-2.4$ TeV, at the nominal $90\\%$ confidence level. An intrinsic high-energy cutoff weakens the narrow-kernel limits by factors of $2.2-7.4$ and the broad-kernel limits by factors of $2.0-5.0$. We further investigate DM velocity effects and combine NGC 1068 with CGCG 420-015 and TXS 0506+056 to extend the threshold reach. In a vector-mediator realization, an optimistic adiabatic DM spike can yield constraints on the neutrino coupling competitive with laboratory bounds for broad energy-transfer kernels."},{"arxiv":"2610.34858","id":"3218977","title":"Reparametrisation invariance, anomalies and pseudoscalar states in massless quantum electrodynamics","authors":"Joshua Cesca, Archil Kobakhidze, Elden Loomes","score":3.6,"section":"cross","rank":21,"parts":[0.0,0.0,0.12,0.0,0.18],"note":"Closest network paper: [[1778129]] (coupling 0.04, 2 shared references). Shared topics: gauge symmetry.","abstract":"In electrodynamics, and more generally in gauge theories, quantisation introduces an ambiguity whereby the vector current, the axial current, or both may acquire an anomalous divergence. These anomalies can be classified as relevant, conventionally associated with the infrared properties of the theory, and irrelevant, arising from the freedom in the choice of renormalisation scheme. We show that, under a axial reparametrisation of the fermion fields, the global axial symmetry can be promoted to a gauge redundancy. Requiring this gauge symmetry to be preserved at the quantum level eliminates the irrelevant anomalies, leaving a non-propagating pseudoscalar field that acts as a Lagrange multiplier enforcing the familiar axial anomaly. We further argue that, on topologically non-trivial spacetimes, in particular those with non-trivial second cohomology, this axial gauge symmetry can undergo a Higgs mechanism, rendering the pseudoscalar field an emergent propagating degree of freedom. Finally, we briefly point out an analogous emergent state associated with the conformal anomaly."},{"arxiv":"2610.35818","id":"3219126","title":"Holographic Approaches to Hadron Structure","authors":"Luigi Cappiello, Anton Rebhan, Shigeki Sugimoto","score":3.5,"section":"new","rank":22,"parts":[0.06,0.02,0.07,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1397629]] (coupling 0.01, 1 shared references). Closest network paper: [[813721]] (coupling 0.02, 12 shared references).","abstract":"We give an introduction to and an overview of holographic approaches to QCD and hadron structure. After an introduction to the string-theoretic foundations of holographic QCD, we review the predictions of top-down and bottom-up models for the phenomenology of mesons, baryons, and glueballs. We focus on the top-down model following from probe flavor branes in the Witten model of low-energy Yang-Mills theory and, in the more phenomenological approach of bottom-up models, on minimal models based on five-dimensional anti-de Sitter space."},{"arxiv":"2610.34947","id":"3218998","title":"Exact flavor conservation at the quark level in causal clusters: strange particles, protons and light nuclei in small collision systems","authors":"Paolo Castorina, Helmut Satz","score":3.5,"section":"new","rank":23,"parts":[0.06,0.02,0.07,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[2946993]] (coupling 0.02, 5 shared references).","abstract":"The suppression of strange hadrons in pp and p--Pb collisions at the LHC, including the $φ$ meson, has recently been described by the exact conservation of strangeness imposed on the quarks of a causally connected cluster before hadronization. Here we extend this approach to the light flavors. The numbers of up and down quarks and antiquarks are conserved in the same cluster, and the suppression of a baryon or a nucleus depends only on how many light quarks of each flavor it contains. With the strangeness sector fixed by the previous analysis, a single constant, the ratio $r$ of light to strange quark abundances, determines the multiplicity dependence of protons, deuterons, He and hypertriton in pp and p--Pb collisions. Including the finite size of the nuclei, one obtains a very good fit of the data for $r=3.76\\pm0.38$, i.e.\\ strange quarks about 0.27 times as abundant as light quarks per flavor, close to the value known from string fragmentation"},{"arxiv":"2610.34741","id":"3218975","title":"\"Inevitable'' nonstrange tetraquark states and $ρρ$ interaction","authors":"Yanyue Pan, Yuying Hao, Shirui Zhao, Hongxia Huang, Jialun Ping","score":3.2,"section":"new","rank":24,"parts":[0.06,0.01,0.04,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[2817040]] (coupling 0.02, 11 shared references).","abstract":"Investigation of the interaction between two $ρ$ mesons with $IJ=00, 02, 11, 20$ and $22$ is conducted systematically in the framework of the quark delocalization color screening model. The results show that there is a strong attractive potential between two $ρ$ mesons, which makes it easier for these two mesons to form bound states. The largest binding energies occur for $IJ=02$ and $IJ=00$ with values over a hundred MeV, while the $IJ=20$ state is the least bound and has a binding energy of only a few MeV. Moreover, the results of intercluster distances favor a molecular interpretation of these states. The interaction analysis reveals that the $ρρ$ and $ΔΔ$ interactions share certain similarities. Drawing inspiration from the $d^*$ dibaryon prediction and from decay-property analyses, we suggest that the $ρρ$ with $IJ=02$ may be the most promising candidate of the ``inevitable'' nonstrange tetraquark state, which deserves experimental search."},{"arxiv":"2610.35156","id":"3219029","title":"$Δ(1232)$ isobars and neutrino opacities in hot dense matter","authors":"Subha Mitra, Bharat Kumar","score":3.1,"section":"cross","rank":25,"parts":[0.06,0.01,0.04,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.00, 1 shared references). Closest network paper: [[2751074]] (coupling 0.02, 1 shared references).","abstract":"We calculated the diffusion mean free paths of electron neutrinos and antineutrinos in hot, neutrino-trapped matter containing $Δ(1232)$ isobars, as found in proto-neutron stars and neutron star merger remnants. We included charged-current absorption with the $NΔ$ weak vertex of weak pion production, neutral-current scattering on all baryons and three-body antineutrino absorption on electron--baryon pairs, with relativistic mean-field kinematics. The reaction $\\barν_e+e^-+n\\toΔ^-$ dominates the antineutrino opacity whenever the neutron and electron chemical potentials exceed the in-medium $Δ^-$ rest energy, even where the $Δ$ population is negligible. At two to four times saturation density, where the reaction is open, it shortens the antineutrino mean free path from \\nubarLamNucMin--\\nubarLamNucMax~m to \\nubarLamDMin--\\nubarLamDMax~cm. Because antineutrinos are scarce at high lepton fraction, this changes lepton-number diffusion only at low lepton fraction, by up to \\DtwoRedHi\\% at these densities and by a factor of \\DtwoRedLow\\ at 1.5 times saturation density. For electron neutrinos, absorption on the $Δ^-$ and, at low lepton fraction, the opening of nucleonic absorption shorten the mean free path by factors of up to \\nuRatioYLthreeMax\\ at lepton fraction 0.3 and up to about \\nuRatioYLoneMax\\ at lepton fraction 0.1. We also showed that, for a given axial coupling, the spin of the $Δ$ reduces its Gamow--Teller strength per particle from 3 to $5/3$."},{"arxiv":"2610.35176","id":"3219006","title":"Large-$N$ $π^+π^+$ scattering from twisted Eguchi--Kawai reduction","authors":"Claudio Bonanno, Margarita García Pérez, Antonio González-Arroyo, Ken-Ichi Ishikawa, Masanori Okawa, Fernando Romero-López","score":2.8,"section":"cross","rank":26,"parts":[0.06,0.01,0.04,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.00, 1 shared references). Closest network paper: [[2817040]] (coupling 0.01, 19 shared references).","abstract":"We present the first computation of the $π^+π^+$ scattering length in large-$N$ QCD in the 't Hooft limit, $N_{\\scriptscriptstyle{\\rm f}}/N\\to 0$, using the twisted Eguchi--Kawai formulation of the lattice theory. We employ values of $N$ up to 1156 and consider several quark masses and lattice spacings to achieve controlled large-$N$, continuum, and chiral limits. The chiral behavior of the scattering length is compared with next-to-leading-order Chiral Perturbation Theory predictions. Our result for the low-energy coupling describing the sub-leading quark-mass dependence is consistent with existing S-matrix bootstrap bounds. Combining TEK results with previous lattice QCD data obtained using standard methods for $3\\le N\\le 6$, we are also able to extract sub-leading $\\mathcal{O}(1/N)$ corrections to the large-$N$ scattering length."},{"arxiv":"2610.35717","id":"3219090","title":"Lepton polarization and sensitivity to the form factors in $Λ\\to p\\,\\ell^-\\barν_\\ell$ with lattice QCD","authors":"Qazi Maaz Us Salam, Ishtiaq Ahmed","score":2.7,"section":"new","rank":27,"parts":[0.0,0.05,0.09,0.0,0.0],"note":"Closest of your papers: [[2855387]] (coupling 0.02, 3 shared references). Closest network paper: [[1862925]] (coupling 0.03, 4 shared references).","abstract":"We investigate the polarization of the charged lepton in the semileptonic hyperon decay $Λ\\to p\\,\\ell^-\\barν_\\ell$ ($\\ell=e,μ$) within the Standard Model, using the form factors obtained from lattice QCD. We compute the longitudinal, transverse and normal polarization of the lepton, the forward-backward asymmetry of each lepton spin state, and the lepton flavor universality ratio $R_{μe}$. We show that the longitudinal polarization determines the ratio $g_1/f_1$ of the axial-vector to vector couplings, and that the forward-backward asymmetries of the electron and of negative-helicity muons determine the weak magnetism. The asymmetry of positive-helicity muons is fixed by kinematics up to a small dependence on the second-class form factors, whereas $R_{μe}$ is nearly independent of $g_1/f_1$ and the weak magnetism. For comparison, we also use the QCD sum-rule form factors, whose $g_1/f_1$ and weak magnetism are opposite in sign to experiment and lattice QCD, and find very different values for the observables that depend on them. Moreover, the $q^2$ dependence of $R_{μe}$ fixes the longitudinal polarization of the muon, which can thus be measured from the decay rates, without measuring the muon spin. The normal polarization is generated by the electromagnetic final-state interaction and provides the Standard Model reference for searches for time-reversal violation. The electron forward-backward asymmetry and $R_{μe}$ can be measured at BESIII and the proposed Super Tau-Charm Facility, and $R_{μe}$ also at LHCb. These measurements can test the Standard Model and the lattice-QCD form factors."}],"refs":{"3144122":{"first":"Okada","year":2026,"nauth":2,"title":"Dirac one-loop seesaw mechanism with a noninvertible fusion rule","role":"other"},"2751074":{"first":"Yaguna","year":2024,"nauth":2,"title":"Singlet Dirac dark matter streamlined","role":"other"},"1862804":{"first":"de Boer","year":2021,"nauth":5,"title":"Indirect detection constraints on the scotogenic dark matter model","role":"other"},"2701993":{"first":"Singh","year":2023,"nauth":3,"title":"Low scale leptogenesis in sin function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  const nmin=M.nextMin;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}${nmin!=null?`: every paper scoring ${nmin} or more, and at least ${M.nextCount} when available`:''}; not drawn in the network`;
  const cut=nmin!=null?X.findIndex(n=>n.score<nmin):-1;
  box.innerHTML=X.map((n,i)=>(i===cut?`<li class="divider">Below ${nmin}: weaker relation (most of these share no specific reference, coupling or topic with your work)</li>`:'')+`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
list();nextList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
