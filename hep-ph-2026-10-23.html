<script>
const RAW = {"n":[{"id":"3218141","arxiv":"2610.31254","title":"A consistent neutrino determination of the low-energy weak mixing angle","first":"Corona","nauth":8,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[2909343]], [[2762109]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[599285]] (coupling 0.03, 3 shared references). Closest network paper: [[2909343]] (coupling 0.28, 22 shared references).","score":39.6,"rank":1,"section":"new","parts":[0.72,0.08,0.81,0.0,0.0],"abstract":"The weak mixing angle, $\\sin^2θ_W$, is a fundamental parameter of the Standard Model and a sensitive probe of electroweak physics across various energy scales. At low momentum transfer, the Standard Model prediction approaches a well-defined low-energy plateau, providing a target for precision tests of the electroweak theory. At the lowest momentum transfer, atomic parity violation (APV) in cesium provides one of the most precise determinations of the weak mixing angle. Here, we review and update the status of this determination and compare it with other available probes. We then consistently reanalyze low-energy neutrino scattering data and combine the resulting determinations from coherent elastic scattering (CE$ν$NS) and neutrino-electron scattering. The complementary sensitivity of these processes to electroweak couplings enables a neutrino-based determination of the low-energy weak mixing angle, accounting for electroweak radiative corrections and relevant theoretical uncertainties. Our global analysis yields $\\sin^2θ_W^{\\rm low}(ν\\,\\text{data}) = 0.233^{+0.007}_{-0.006}$. We assess the consistency and relative impact of the individual neutrino measurements and discuss the prospects for future CE$ν$NS and neutrino-electron scattering experiments to improve the precision of this determination. Our analysis provides an independent test of the Standard Model at low momentum transfer, complementary to that provided by atomic parity violation.","authors":"M. Atzori Corona, M. Cadeddu, N. Cargioli, F. Dordei, L. Ferro, C. Giunti, R. Pavarani, M. Sestu","nlinked":78,"nref":84,"src":"INSPIRE","html":true},{"id":"3218200","arxiv":"2610.31658","title":"Neutrino Mass in Left-Right Symmetry: From Majorana Signals to Dirac Predictions","first":"Tello","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[2696652]], [[2715897]]. Closest of your papers: [[1755250]] (coupling 0.02, 5 shared references). Closest network paper: [[2696652]] (coupling 0.19, 21 shared references). Shared topics: neutrino mass, seesaw mechanism.","score":39.4,"rank":2,"section":"new","parts":[0.7,0.06,0.54,0.0,0.49],"abstract":"We review neutrino mass as a probe of restored parity in left-right symmetric theories, emphasizing the distinct Majorana and Dirac realizations. In the Majorana theory, lepton-number violation connects the seesaw mechanism to neutrinoless double beta decay, heavy-neutrino production and the Keung-Senjanovic process. The Dirac alternative removes these characteristic signals while retaining a relation between left- and right-handed flavor. The right-handed leptonic mixing matrix can then be reconstructed from low-energy data and the spontaneous parity-breaking parameter. Requiring the two lepton Yukawa matrices to admit a common real parity basis turns this reconstruction into a compatibility condition that determines the allowed Dirac phase on each branch. For three generations, this requirement reduces to a single rephasing-invariant CP-odd obstruction, which also governs the right-left modulus mismatch and the relative CP orientation. The small Dirac masses also restrict the parity deformation and its induced strong-CP phase. For compressed mixed-sign neutrino spectra, a tiny parity deformation can nevertheless generate large leptonic CP violation, despite stringent strong-CP constraints. The resulting branch-dependent correlations connect leptonic CP, the absolute neutrino mass and strong CP. We place this construction alongside radiative and unified approaches to predicting leptonic CP violation.","authors":"Vladimir Tello","nlinked":92,"nref":94,"src":"INSPIRE","html":true},{"id":"3218042","arxiv":"2610.30534","title":"What if dark matter is composite of least interacting particles?","first":"Fortes","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[3122101]], [[2820658]]. Closest of your papers: [[2859009]] (coupling 0.04, 3 shared references). Closest network paper: [[3133857]] (coupling 0.06, 3 shared references). Shared topics: discrete symmetry.","score":34.1,"rank":3,"section":"new","parts":[0.7,0.11,0.17,0.0,0.37],"abstract":"In this work, we investigate the possibility that Dark Matter contains particles that interact with known matter only through gravity, the least interacting particles (LIPs). Specifically, we consider the case of a dark Proca vector field, which does not mix in the kinetic term with any of the vector bosons of the Standard Model if a discrete symmetry (Z2 ) is imposed. Breaking this symmetry introduces kinetic mixing. Here, we study two realization mechanisms, namely kinetic mixing with the electromagnetic field after electroweak symmetry breaking (Scenario A) and kinetic mixing with the weak hypercharge gauge field (Scenario B). We also consider generalized kinetic terms that violate parity and time-reversal symmetries.","authors":"Elaine C. F. S. Fortes, Vicente Pleitez","nlinked":29,"nref":43,"src":"INSPIRE","html":true},{"id":"3217971","arxiv":"2610.30240","title":"Probing Heavy Neutral Leptons through New Gauge Interactions at the Forward Physics Facilities","first":"Burk","nauth":6,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Dutta. Cites 1 network paper: [[1634858]]. Closest of your papers: [[1686334]] (coupling 0.04, 4 shared references). Closest network paper: [[2671727]] (coupling 0.12, 15 shared references).","score":29.2,"rank":4,"section":"new","parts":[0.45,0.11,0.35,0.5,0.0],"abstract":"We investigate the prospects for improving the heavy neutral lepton (HNL) searches at the far-forward LHC experiments FASER and FASER$ν$, as well as their proposed HL-LHC successors, FASER2 and FASER$ν$2, using new HNL production mechanisms. We consider scenarios in which HNLs couple directly to a new $U(1)$ gauge boson and decay into visible Standard Model final states through mixing with active neutrinos. Focusing on the $U(1)_{B-L}$, $U(1)_{B-3L_τ}$, and $U(1)_B$ gauge extensions as benchmark models, we study HNL production through proton bremsstrahlung and Drell--Yan processes, which probe complementary mediator-mass regimes. We analyze several visible decay channels, including charged leptons, neutral mesons, and other hadrons, and evaluate the projected sensitivities for different neutrino-flavor mixing patterns. We find that these new production mechanisms that differ qualitatively from the conventional picture in which both production and decay are controlled by active-sterile mixing enable the far-forward LHC program to probe previously unexplored regions of HNL parameter space, with the first-ever demonstration of FASER$ν$ having sensitivity to HNLs and FASER2 and FASER$ν$2 offering substantially enhanced sensitivity during the HL-LHC era, even reaching the canonical seesaw prediction for all three lepton flavors. Our results demonstrate that new gauge interactions can substantially enhance HNL production independently of the active-sterile mixing that governs their visible decays, opening complementary opportunities to explore HNLs at the forward physics facilities.","authors":"Francis M. Burk, P. S. Bhupal Dev, Bhaskar Dutta, Tao Han, Aparajitha Karthikeyan, Doojin Kim","nlinked":77,"nref":81,"src":"INSPIRE","html":true},{"id":"3218090","arxiv":"2610.30981","title":"Construction and phenomenological analysis of dynamical Inverse seesaw neutrino mixing model","first":"Bisht","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1589459]]. Closest of your papers: [[1686334]] (coupling 0.04, 3 shared references). Closest network paper: [[2862717]] (coupling 0.06, 8 shared references). Shared topics: neutrino oscillation data, neutrino mass, gauge symmetry.","score":29.0,"rank":5,"section":"new","parts":[0.45,0.12,0.16,0.0,0.71],"abstract":"In this manuscript, a dynamical inverse seesaw neutrino ISS(3+1+1+1) mixing model based on the gauge symmetry $U(1)_{B-L}$ extended by the flavor symmetry $A_{4}\\times Z_{2}$ has been constructed. ISS(3+1+1+1) represents three generations of right-handed neutrinos and an extra three generation of singlets sterile neutrinos, wherein the right-handed neutrinos are triplets under $A_4$ symmetry. Furthermore, the five scalar flavon fields are considered in the model, which reproduce neutrino oscillation data within the NuFIT 6.0 experimental range with statistical $\\text{|pull|}=0.01 σ$. The neutrino mass hierarchy is obtained by minimizing the dynamical $A_4\\times Z_2$ scalar flavon $φ_v$ potential. The effective neutrino mass parameter $m_{ββ}$ for the neutrinoless double beta decay $0vββ$ has been charecterised in the manuscript. The effective neutrino mass parameter spans a finite region in the parameter space rather then being confined to a single point and it is constrained by the KamLAND-Zen excluded band. The model successfully explains active-sterile neutrino mixing and non-unitarity of the PMNS matrix is consistent with the cosmological upper bound. The minimum value of the sum of the active neutrinos' mass turns out to be $m_{i}\\approx 62\\ \\ (99.4)\\ \\text{meV}$ for Normal ordering (Inverted ordering), which lies within the range of both Planck 2018 loose cosmological limit $\\sum m_{i}<120\\ \\text{meV}$ and tighter limit $\\sum m_{i}<72\\ \\text{meV}$ of DESI-2024. Our model immensely favours normal ordering, in agreement with the tighter constraints reported by DESI-2024.","authors":"Manish Singh Bisht, Shuchi Bisht, Mayank Joshi, Navjot Hothi","nlinked":47,"nref":59,"src":"INSPIRE","html":true},{"id":"3218033","arxiv":"2610.30360","title":"Gravitational Waves From an Entangled SO(3) Cosmic String Network","first":"Chen","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2969254]]. Closest of your papers: [[2690106]] (coupling 0.03, 2 shared references). Closest network paper: [[2715897]] (coupling 0.06, 13 shared references). Shared topics: neutrino mass.","score":23.8,"rank":6,"section":"new","parts":[0.45,0.08,0.16,0.0,0.33],"abstract":"Discrete non-Abelian symmetries such as $\\mathrm{A_4}$ are widely used in models of lepton flavor to explain neutrino mass hierarchy and their large mixing. If such a symmetry arises from the spontaneous breaking of a continuous group, cosmic strings can form. We study the breaking $\\mathrm{SO}(3)\\to \\mathrm{A_4}$, for which the strings are classified by the non-Abelian group $π_1(\\mathrm{SO}(3)/\\mathrm{A_4})\\cong \\mathrm{T}'$, the binary tetrahedral group. Because the string fluxes do not commute, colliding strings may reconnect, pass through each other, or become joined by a bridge whose flux can belong to a different string network. We derive the probabilities of these outcomes directly from the group structure; in network models they are usually treated as free parameters. Including them in a multi-network velocity-dependent one-scale model, we find that the correlation length of the networks decreases and their energy density increases relative to Abelian $\\mathrm{U}(1)$ strings of the same tension. The resulting stochastic gravitational-wave background is enhanced by up to nearly three orders of magnitude, showing that the algebraic structure of $π_1$ leaves a direct imprint on the gravitational-wave spectrum.","authors":"Mu-Chun Chen, Cameron Moffett-Smith","nlinked":51,"nref":52,"src":"INSPIRE","html":true},{"id":"3218194","arxiv":"2610.31666","title":"Boosted Dark Matter Directionality in Large Liquid Scintillator Detectors","first":"Tse","nauth":5,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Choi. Closest of your papers: [[2859009]] (coupling 0.04, 4 shared references). Closest network paper: [[3083722]] (coupling 0.06, 11 shared references). Shared topics: displaced vertex.","score":15.1,"rank":7,"section":"new","parts":[0.0,0.11,0.17,0.5,0.42],"abstract":"Light dark matter can be boosted by cosmic-ray-dark matter interactions, which opens the possibility of direct-detection searches with large neutrino detectors. We consider the signal produced by boosted dark matter undergoing quasi-elastic scattering off carbon and knocking out a neutron in a large liquid scintillator detector. A distinctive delayed gamma ray from neutron capture can be reconstructed after $\\sim 210$ $μ$s, which is paired up with the prompt signal during neutron propagation. We find that 100 kt$\\cdot$yr of data from the neutron-coincidence channel will be able to probe new parameter space compared to free proton signals found in previous work. We further consider the possibility of utilizing directional information from the displaced vertex associated with the capture of the final-state neutron. However, we find that directional information does not materially improve the sensitivity due to the large nucleon scattering angle.","authors":"Samuel S. H. Tse, Qishan Liu, Kenny C. Y. Ng, Koun Choi, Yu-Feng Li","nlinked":80,"nref":91,"src":"INSPIRE","html":true},{"id":"3218072","arxiv":"2610.30640","title":"Yukawa textures due to selection rules in magnetized orbifold models","first":"Kobayashi","nauth":5,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[713693]] (coupling 0.02, 1 shared references). Closest network paper: [[3144122]] (coupling 0.32, 22 shared references).","score":14.7,"rank":8,"section":"new","parts":[0.0,0.04,0.9,0.0,0.0],"abstract":"We study systematically Yukawa textures, which can be derived from magnetized $T^2/\\mathbf{Z}_2$ and $T^2/\\mathbf{Z}_4$ orbifold models with various magnetic fluxes and Scherk-Schwarz phases. Remarkably, the nearest neighbor interaction pattern as well as the diagonal Yukawa matrix is statistically favorable in $T^2/\\mathbf{Z}_2$ orbifold models. Also, in $T^2/\\mathbf{Z}_4$ orbifold models, selection rules are nontrivial and lead to textures, which cannot be derived from group-theoretical symmetries.","authors":"Tatsuo Kobayashi, Tomoyasu Kori, Shuhei Miyamoto, Riku Nakano, Haruki Uchida","nlinked":69,"nref":69,"src":"INSPIRE","html":true},{"id":"3218172","arxiv":"2610.31312","title":"Lepton number and flavor violation mediated by doubly charged scalars at $μ$TRISTAN $μ^+ μ^+$ collider","first":"Fukuyama","nauth":3,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1249404]] (coupling 0.04, 7 shared references). Closest network paper: [[2614876]] (coupling 0.06, 11 shared references). Shared topics: lepton flavor violation, neutrino mass, discrete symmetry, lepton number.","score":13.4,"rank":9,"section":"new","parts":[0.0,0.1,0.18,0.0,0.75],"abstract":"Charged lepton flavor violation is an important probe of physics beyond the Standard Model. Although $ΔL_μ= -ΔL_e = \\pm 1$ lepton flavor violating (LFV) processes, such as $μ\\to eγ$ and $μ\\to 3e$, are severely constrained experimentally, there is still plenty of room for LFV processes involving lepton number violation (LNV). In this paper, we investigate such processes at a $μ^+μ^+$ collider that remain even if processes with $ΔL_μ= -ΔL_e = \\pm 1$ are forbidden by discrete symmetries. We consider processes induced by doubly charged scalars, which can be either an $SU(2)_L$ singlet or a component of an $SU(2)_L$ triplet. The cross sections of these processes at the collider depend on the representation of the scalar unless the muon beam is unpolarized. In the case of $ΔL_μ= -ΔL_e = 2$, we discuss the combination of the muonium-to-antimuonium transition and the $μ^+μ^+ \\to e^+e^+γ/Z$ processes at the collider, and how the model parameters, such as the scalar couplings and mass, can be determined from experimental measurements. Doubly charged scalars are often utilized in models for generating neutrino masses, and they can also be used to construct models with LNV processes at a muon collider. If neutrino masses are generated at tree level, the LNV processes at the collider are suppressed, and therefore, we consider models that do not induce neutrino masses at tree level. LNV processes, such as $μ^+μ^+ \\to t\\bar b t\\bar b$ and $μ^+μ^+ \\to μ^+ e^- t\\bar b t\\bar b$, are possible in these models. Even if LNV is indicated by searches at hadron colliders, it is worthwhile to pursue these processes as clean LNV signals at a lepton collider.","authors":"Takeshi Fukuyama, Yukihiro Mimura, Yuichi Uesaka","nlinked":86,"nref":94,"src":"INSPIRE","html":true},{"id":"3218045","arxiv":"2610.30526","title":"Localized Neutrinos in Two Dark Dimensions","first":"Ahmed","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1854224]] (coupling 0.01, 1 shared references). Closest network paper: [[582695]] (coupling 0.03, 6 shared references). Shared topics: dirac neutrino mass, neutrino mass, observed neutrino mass.","score":10.3,"rank":10,"section":"new","parts":[0.0,0.02,0.09,0.0,0.83],"abstract":"We study neutrino masses in a six-dimensional framework with two compact dark dimensions. In the conventional flat-bulk realization, the sterile-neutrino zero mode is strongly volume suppressed, so a fundamental scale near $10~\\mathrm{TeV}$ requires a large higher-dimensional Yukawa coupling to reproduce the observed neutrino masses, while the accompanying two-dimensional Kaluza--Klein tower is strongly constrained by oscillation data. We show that localizing the sterile-neutrino wave function near the Standard-Model brane substantially alleviates both effects. Using a Gaussian localizer, realistic Dirac neutrino masses are obtained with perturbative, order-one Yukawa couplings, while the brane-visible sterile excitations form a shell spectrum with $M_s^2=8μ^2 s$, and squared active--sterile mixings that decrease as $1/s$. The localization scale therefore separates the experimentally relevant sterile-neutrino spectrum from the gravitational compactification scale. We derive the resulting three-flavour structure and study its phenomenological consequences for reactor oscillations and tritium beta decay, including comparisons with current flat-LED and KATRIN constraints.","authors":"Waqas Ahmed, George K. Leontaris","nlinked":63,"nref":63,"src":"INSPIRE","html":true},{"id":"1589459","arxiv":"1704.01107","title":"Singlet scalar Dark matter in $U(1)_{B-L}$ models without right-handed neutrinos","first":"Singirala","nauth":3,"year":2017,"cites":40,"role":"other","note":"","score":null},{"id":"3083722","arxiv":"","title":"Probing neutrino nature and interactions in cosmology and astrophysics","first":"Herbermann","nauth":1,"year":2025,"cites":0,"role":"other","note":"","score":null},{"id":"1625258","arxiv":"1709.08417","title":"Common origin of neutrino mass and dark matter from anomaly cancellation requirements of a $U(1)_{B-L}$ model","first":"Nanda","nauth":2,"year":2017,"cites":50,"role":"other","note":"","score":null},{"id":"2760060","arxiv":"","title":"Various Phenomenological Aspects of the R-parity Violating MSSM","first":"Köhler","nauth":1,"year":2024,"cites":0,"role":"other","note":"","score":null},{"id":"2862717","arxiv":"2412.18550","title":"Fermion Masses and Mixings and Charged Lepton Flavor Violation in a 3-3-1 Model with Inverse Seesaw","first":"Cárcamo Hernández","nauth":4,"year":2024,"cites":3,"role":"other","note":"","score":null},{"id":"2158000","arxiv":"2209.14246","title":"Type II Dirac seesaw portal to the mirror sector: Connecting neutrino masses and a solution to the strong <math display=\"inline\"><mi>C<\/mi><mi>P<\/mi><\/math> problem","first":"Berbi ,"k"],[1,41,"k"],[38,20,"c"],[2,43,"k"],[26,48,"c"],[7,46,"k"],[17,20,"c"],[8,48,"k"],[26,22,"c"],[4,14,"k"],[9,16,"k"],[26,37,"c"],[2,27,"k"],[34,37,"c"],[29,18,"c"],[28,20,"c"],[46,48,"c"],[46,20,"c"],[5,42,"k"],[40,10,"c"],[17,48,"c"],[6,11,"k"],[0,18,"k"],[0,19,"c"],[24,19,"c"],[5,21,"c"],[22,48,"c"],[2,28,"c"],[3,25,"k"],[35,37,"c"],[1,31,"c"],[8,34,"k"],[12,10,"c"],[2,30,"k"],[8,36,"k"],[7,40,"k"],[6,44,"k"],[11,42,"c"],[5,26,"k"],[5,32,"k"]],"next":[{"arxiv":"2610.30261","id":"3218006","title":"Variable-phase methods and data for long-range scattering","authors":"Marcos M. Flores, Kalliopi Petraki, Thomas Pignard","score":8.9,"section":"new","rank":11,"parts":[0.0,0.07,0.3,0.0,0.23],"note":"Closest of your papers: [[1249404]] (coupling 0.03, 2 shared references). Closest network paper: [[3122101]] (coupling 0.10, 6 shared references). Shared topics: relic abundance.","abstract":"Long-range interactions play an important role in dark-matter phenomenology, affecting the relic abundance, indirect-detection signals, and structure formation on galactic scales. Reliable predictions often require nonperturbative solutions of the Schrödinger equation over broad parameter ranges and many partial waves. We present a numerical framework based on the variable-phase method, which recasts the radial Schrödinger equation as a system of first-order equations and allows both regular and irregular solutions to be computed efficiently. The former determine phase shifts and Sommerfeld factors, while the latter provide additional information relevant for the self-consistent unitarization of contact-like inelastic interactions. We discuss the numerical implementation, integration-domain selection, partial-wave convergence, and comparisons with analytic limits. We release the code together with tables for the Yukawa potential containing phase shifts, Sommerfeld factors, elastic and angularly weighted cross sections, and the irregular-solution information relevant for unitarization. These resources facilitate dark-matter studies without requiring repeated computationally intensive scans."},{"arxiv":"2610.31101","id":"3218111","title":"Saxion Decay and Dark Radiation in the KSVZ Axion Model","authors":"Sidhartha Samtani, Amartya Sengupta","score":8.8,"section":"new","rank":12,"parts":[0.0,0.16,0.27,0.0,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.06, 6 shared references). Closest network paper: [[2697191]] (coupling 0.10, 15 shared references).","abstract":"We calculate the relativistic axion energy density produced by the decay of a curvature-displaced Peccei--Quinn condensate in a quartic KSVZ model. We follow the radial PQ field (the saxion) as it relaxes from its inflationary minimum and determine the surviving condensate abundance from the adiabatic action of its oscillations. We then evolve the condensate through its decay into axions and visible particles to calculate the resulting dark-radiation contribution, expressed as $ΔN_{\\rm eff}$. With one heavy coloured KSVZ fermion and no additional portal interactions included, the axion channel dominates the two tree-level decay modes. Two reference histories yield $ΔN_{\\rm eff}\\simeq0.033$ and $0.12$, with maximum saxion energy fractions below $1\\%$ and $4\\%$, respectively. At fixed quartic coupling, increasing the duration of curvature release reduces the predicted axion radiation density relative to visible radiation by a factor of approximately $28$ while preserving the primordial isocurvature amplitude."},{"arxiv":"2610.30507","id":"3218049","title":"ULTRAMAN: A Proposed ultrasound detector for macroscopic dark matter","authors":"Oem Trivedi, Robert J. Scherrer, Alfredo Gurrola","score":8.7,"section":"cross","rank":13,"parts":[0.0,0.05,0.09,0.5,0.07],"note":"Co-authors of yours: Gurrola. Closest of your papers: [[1741056]] (coupling 0.02, 1 shared references). Closest network paper: [[1399202]] (coupling 0.03, 1 shared references).","abstract":"We propose ULTRAMAN (ULTRAsound Macro ANalyzer), a passive ultrasound array experiment designed to search for macroscopic dark matter (macros) through coherent acoustic disturbances generated as compact objects traverse a controlled target medium. Unlike existing dark matter detectors that primarily rely on scintillation, ionization, or other signatures of energy deposition, ULTRAMAN exploits the acoustic response of matter to reconstruct individual highly supersonic trajectories using synchronized multielement ultrasound arrays. The framework connects macro stopping power and interaction cross section to the resulting acoustic pressure, while the expected event rate probes the macro mass and abundance. A genuine candidate would appear not as an isolated radio frequency spike, but as a correlated multichannel track consistent with a single highly supersonic passage through the target. Representative macro, nuclearite, axion quark nugget, and primordial black hole benchmarks are shown to occupy distinct regions of the resulting acoustic observable space. Existing ultrasound technology offers a realistic route to an event-level terrestrial search for macroscopic dark matter, with null observations translating into complementary constraints on its parameter space."},{"arxiv":"2610.30245","id":"3217957","title":"Sequential SBI for Resonance Searches at the LHC","authors":"Henning Bahl, Ranit Das","score":8.5,"section":"new","rank":14,"parts":[0.06,0.1,0.22,0.0,0.0],"note":"Also cites widely used network papers: [[902365]]. Closest of your papers: [[1455793]] (coupling 0.03, 7 shared references). Closest network paper: [[3187354]] (coupling 0.08, 7 shared references).","abstract":"Neural simulation-based inference has been shown to extract significantly more information from LHC data than histogram-based analyses. So far, it has mostly been applied to couplings, for which the polynomial structure of the scattering amplitude can be exploited. Masses and widths instead move and deform the signal in phase space, and learning their likelihood requires many event samples covering the continuous theory parameter space. We show how sequential simulation-based inference can address this by iteratively concentrating the simulations where the observed data points. Using a parton-level example with an exact reference likelihood and reconstruction-level analyses of $A\\to ZH\\to \\ell\\ell b\\bar b$ and $Y\\to HH\\to (t\\bar t)(t\\bar t)$, we demonstrate that sequential training produces significantly more accurate and better calibrated likelihoods than single round training with the same amount of training events."},{"arxiv":"2610.30773","id":"3218076","title":"A Chiral Nelson-Barr Relaxion","authors":"Cristien Arzate, Joshua Iascau","score":8.4,"section":"new","rank":15,"parts":[0.0,0.07,0.23,0.0,0.29],"note":"Closest of your papers: [[1116165]] (coupling 0.02, 1 shared references). Closest network paper: [[1863157]] (coupling 0.08, 7 shared references). Shared topics: seesaw mechanism.","abstract":"We present the chiral Nelson-Barr relaxion model, an extension of the Nelson-Barr relaxion framework with a gauged chiral $\\mathrm{U}(1)$ symmetry. It includes vector-like quarks to cancel gauge anomalies and a scalar whose vacuum expectation value generates their masses. The chiral symmetry forbids the leading operators responsible for the Nelson-Barr and clockwork quality problems. Right-handed neutrinos generate light-neutrino masses through the type-I seesaw mechanism and permit thermal leptogenesis. For the particular coupling considered, relaxion phenomenology gives $f_{\\mathrm{max}}^{\\mathrm{pheno}}\\sim 4\\times 10^{11}\\ \\mathrm{GeV}$, about eight times the corresponding phenomenological ceiling in the original model. The model can accommodate thermal leptogenesis if its right-handed-neutrino masses and reheating history satisfy the required temperature bounds."},{"arxiv":"2610.30252","id":"3217999","title":"Neutrino Transition Polarizability","authors":"Matteo Borrello, Michele Tammaro","score":8.4,"section":"new","rank":16,"parts":[0.0,0.06,0.27,0.0,0.25],"note":"Closest of your papers: [[1708009]] (coupling 0.02, 2 shared references). Closest network paper: [[2671727]] (coupling 0.09, 13 shared references). Shared topics: seesaw mechanism.","abstract":"We study Neutrino Transition Polarizability, where a light pseudoscalar $φ$ couples active neutrinos to heavy neutral leptons $N$ and interacts with two photons. We consider an effective description of the active - sterile interaction, and a realization within the inverse seesaw mechanism; the coupling to photons is generated by heavy charged states. For $m_N>m_φ$, the decay $N\\toνφ$ can greatly shorten the heavy neutrino lifetime, while $φ\\toγγ$ produces a displaced photon pair. This changes the relevant search strategies, favoring production and decay inside detectors. We discuss existing constraints and estimate the sensitivity of displaced photon searches at DUNE, Belle II, LHCb and FCC-ee, highlighting the complementarity of neutrino scattering and meson and electroweak boson decays."},{"arxiv":"2610.30253","id":"3217976","title":"Mass-Varying Dark Matter, Naturally","authors":"Cédric Delaunay, Seung J. Lee, Yuan Yin, Bingrong Yu","score":7.7,"section":"new","rank":17,"parts":[0.0,0.07,0.18,0.0,0.28],"note":"Closest of your papers: [[468209]] (coupling 0.03, 2 shared references). Closest network paper: [[2958466]] (coupling 0.06, 5 shared references). Shared topics: relic abundance.","abstract":"Ultralight scalars that vary dark-matter masses require protection from quantum corrections. Cyclic $\\mathbb{Z}_N$ symmetries provide this protection but also suppress variation of the mean mass of equally populated partners. Unsuppressed variation typically requires asymmetric reheating through symmetry-breaking couplings that threaten radiative control. We show that scalar-induced mass splittings built into these constructions can instead bias relic abundances through symmetric interactions. The mechanism applies to thermal and nonthermal relics that reach internal equilibrium after production, and permits mass variation over a broad range of timescales."},{"arxiv":"2610.30238","id":"3217972","title":"Probing imperfect axions with nuclear clocks","authors":"Salvatore Bottaro, Andrea Caputo, Gilad Perez, Yotam Soreq, Alfredo Stanzione","score":6.8,"section":"new","rank":18,"parts":[0.0,0.1,0.2,0.0,0.07],"note":"Closest of your papers: [[1607572]] (coupling 0.03, 4 shared references). Closest network paper: [[2697191]] (coupling 0.07, 11 shared references).","abstract":"We show that $^{229}$Th nuclear clocks can probe departures from the Peccei-Quinn (PQ) solution to the strong CP problem. Explicit PQ breaking or additional CP-violating interactions can shift the minimum of the axion potential and generate CP-violating couplings to matter, inducing a clock response linear in the axion field. We investigate explicit PQ breaking and quark chromo-electric dipole operators as representative realizations of these \\textit{imperfect axion} scenarios, consistent with electric dipole moment constraints. For axion dark matter, the linear signal oscillates at the Compton frequency and can dominate the quadratic response. Even without axion dark matter, the Earth can source a static axion field, enabling fifth-force searches with nuclear clocks."},{"arxiv":"2610.30255","id":"3217987","title":"$γ$hosts from the past: reheating neutron stars with supernova-sourced ALPs","authors":"Debajit Bose, Sougata Ganguly, Tanmoy Kumar, Nirmal Raj","score":6.5,"section":"new","rank":19,"parts":[0.0,0.1,0.23,0.0,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.04, 4 shared references). Closest network paper: [[2063283]] (coupling 0.08, 10 shared references).","abstract":"Axion-like particles (ALPs) can be copiously produced in the hot and dense environment of a core-collapse supernova. If their mass is within an order of magnitude of the supernova temperature, a non-negligible fraction of them will remain gravitationally bound to the neutron star remnant. This basin of ALPs can then decay to photons over the lifetime of the neutron star, thereby reheating it. Using the measured luminosities of several neutron stars, we close multiple windows in ALP parameter space while also satisfying the SN 1987A cooling constraint on the ALP-nucleon coupling. In particular, using the 35000 K upper limit on the temperature of the coldest neutron star observed, PSR J2144$-$3933, we derive the strongest upper limits on the ALP-photon coupling for 1$-$400 MeV ALP masses. Ceilings on these limits arising from ALP decays occurring within the neutron star lifetime may be overcome by using younger neutron stars such as the one in Cas A, probing couplings orders of magnitude higher. Observations of a $2000 \\, {\\rm K}$-hot neutron star in infrared observatories such as the James Webb Space Telescope could reach ALP-photon couplings three orders lower and ALP masses one order lower than our current limits."},{"arxiv":"2610.31370","id":"3218163","title":"RIDDLE: Revealing Irregularities through Distributional Discrepancies in Latent-space via Stein-Witness Estimation","authors":"Ali Eren Simsek","score":5.4,"section":"new","rank":20,"parts":[0.0,0.04,0.29,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.02, 1 shared references). Closest network paper: [[3187354]] (coupling 0.10, 2 shared references).","abstract":"RIDDLE is a new method for resonant anomaly detection that uses a scalar Stein-witness function to identify discrepancies between unlabeled signal-region events and a background distribution inferred from dijet-mass sidebands. The witness is optimized in a latent representation of auxiliary jet observables against a differentiable background reference, without requiring an explicit signal model. The method is evaluated using simulated LHC Olympics dijet events and compared with idealized and supervised benchmarks that share the same statistical construction but have access to additional signal or background information. RIDDLE demonstrates strong signal--background discrimination comparable to the idealized benchmark, while largely preserving the background dijet-mass spectrum under anomaly-score selection. Tests incorporating additional angular information and deliberately mass-correlated features further demonstrate the method's robustness under the studied conditions. Together, these results highlight the potential of RIDDLE as a robust, data-driven approach for enhanced resonance searches that combines effective anomaly discrimination with background-shape preservation."},{"arxiv":"2610.30338","id":"3218104","title":"Machine Learning Neutrino-Nucleus Cross Sections II: More Leptons","authors":"Daniel C. Hackett, Joshua Isaacson, Shirley Weishi Li, Karla Tame-Narvaez, Michael L. Wagman","score":5.2,"section":"new","rank":21,"parts":[0.0,0.03,0.22,0.0,0.09],"note":"Closest of your papers: [[1397629]] (coupling 0.01, 1 shared references). Closest network paper: [[2721859]] (coupling 0.08, 4 shared references).","abstract":"Neutrino-nucleus cross sections are essential inputs for long-baseline neutrino oscillation experiments, yet remain challenging to model with high precision. Recent work demonstrated that fully black-box data-driven cross-section models cannot accurately generalize between near- and far-detector fluxes, but imposing Standard-Model symmetries via structure-function parameterizations provides a well-posed learning problem in a simplified DUNE-inspired muon-neutrino disappearance analysis. Here, we extend this framework to multiple lepton flavors and both neutrino and antineutrino beam modes, incorporating the electron appearance channel and enabling a simultaneous determination of $\\sin^2θ_{23}$, $Δm^2_{31}$, and the CP-violating phase $δ_{\\rm CP}$. We find that the learned cross section model recovers the injected oscillation parameters without significant bias, with constraints comparable to those obtained using the exact underlying cross section. Flux uncertainties have more significant effects in the multi-channel case, and incorporating flux nuisance parameters into the learning problem is required for accurate results. Our results demonstrate that this data-driven approach can be extended to the multi-channel measurements needed for long-baseline neutrino oscillation analyses."},{"arxiv":"2610.31103","id":"3218131","title":"Interpreting the top quark mass using simulations of top-flavoured mesons","authors":"Alexander Lind","score":3.7,"section":"new","rank":22,"parts":[0.06,0.02,0.07,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[2878308]] (coupling 0.03, 2 shared references).","abstract":"Active work is being done on the issue of the interpretation of the top quark mass in terms of well-defined theoretical definitions. This work considers this issue by simulating fictitious heavy-light top-flavoured mesons with a fixed mass in Pythia 8.3. Within Heavy Quark Effective Theory, the mass of the top mesons can be related to the pole mass of the top quark. By fitting final-state observables in top pair production at current hadron and future lepton colliders, we extract a negative mass difference between the input Pythia mass for the top quark and the pole mass of around $240$-$330$ MeV, consistent with $\\mathcal{O}(Λ_{\\rm QCD})$."},{"arxiv":"2610.30984","id":"3218087","title":"At the Highest-Frequency Frontier: Thermal Gravitational Waves from Supernovae","authors":"Xun-Jie Xu, Yong Xu, Qiqin Yin","score":3.6,"section":"new","rank":23,"parts":[0.0,0.01,0.22,0.0,0.0],"note":"Closest of your papers: [[1686334]] (coupling 0.00, 1 shared references). Closest network paper: [[2828434]] (coupling 0.08, 5 shared references).","abstract":"Core-collapse supernovae can be powerful sources of high-frequency gravitational waves (GWs) as the extreme temperatures and densities in the core allow a considerable number of gravitons to be produced thermally. We present the first systematic calculation of the thermal GW spectrum of a core-collapse supernova. By evaluating the dominant emission channels---including electron and proton photoproduction ($γe^{-}\\to he^{-}$, $γp\\to h\\,p$) and gravitational bremsstrahlung ($e^{-}p\\to e^{-}p\\,h$, $e^{-}e^{-}\\to e^{-}e^{-}h$)---we find that a core-collapse supernova generates a total thermal GW luminosity of $1.27\\times10^{26}$ W, approximately 18 orders of magnitude larger than that of the Sun. The thermal GW spectrum peaks at energies of $\\mathcal{O}(0.1\\,{\\rm GeV})$, extending the predicted spectrum of known GW sources to an unprecedented high-frequency regime. Our results provide a benchmark thermal GW spectrum at the high-frequency frontier."},{"arxiv":"2610.30510","id":"3218051","title":"Same Events, Weaker Bound: Model Dependence in Magellanic Microlensing Limits on Primordial Black Holes","authors":"David Morales-Zapien, Lucas Brown, Stefano Profumo","score":3.6,"section":"cross","rank":24,"parts":[0.0,0.03,0.13,0.0,0.07],"note":"Closest of your papers: [[2855387]] (coupling 0.01, 1 shared references). Closest network paper: [[2936837]] (coupling 0.04, 5 shared references).","abstract":"OGLE microlensing of the Magellanic Clouds sets the leading bounds on primordial black holes (PBHs) as dark matter from $10^{-8}$ to $10^{3}\\,M_\\odot$. Holding the detected events and survey efficiencies fixed, we show that changes to the Milky Way halo, the stellar lens populations and the Large Magellanic Cloud halo, each motivated by recent data, weaken the published strict 20-year bound by up to $\\simeq6$, and by over an order of magnitude in an extreme stress test. With primordial clustering, the planetary-mass bound weakens by a factor $3.4$--$6$. We strongly recommend that compact-object dark matter limits be quoted together with their modeling assumptions and, generally, be derived under conservative assumptions."},{"arxiv":"2610.31441","id":"3218217","title":"Gravitational Wave Diffractive Images Reveal the Structure of Astrophysical Objects","authors":"Han Gil Choi, Sunghoon Jung, Volodymyr Takhistov","score":2.7,"section":"cross","rank":25,"parts":[0.0,0.02,0.1,0.0,0.07],"note":"Closest of your papers: [[2859009]] (coupling 0.00, 2 shared references). Closest network paper: [[2936837]] (coupling 0.03, 5 shared references).","abstract":"Scattering patterns encode the structure of extended objects, as demonstrated by charged particle scattering on atomic nuclei. Gravitational wave (GW) diffraction offers an analogous probe of otherwise invisible mass distributions. At linear order in the lens potential we derive expressions relating the central diffractive image contribution to a gravitationally lensed GW waveform to the Fourier transform of the projected lens density. For finite mass lenses this contribution takes the form of a point mass Born amplitude multiplied by a normalized mass form factor, analogous to that in nuclear scattering. As the frequency of GWs from a merging compact binary source evolves the signal samples this form factor across spatial scales, imprinting lens structure through interference with the primary image. Using full numerical wave optics calculations we quantify the observational reach for extended dark matter objects, primordial black holes halo-dressed by dark matter halos and superradiance clouds of ultralight bosons around black holes. For the considered source populations, five year observations with next generation detectors can distinguish extended lenses from point masses, probing dark matter fractions down to $\\mathcal{O}(10^{-5})$, and halo-dressed primordial black holes from matched bare black holes, probing primordial black hole dark matter fractions down to $\\mathcal{O}(10^{-6})$. For sufficiently close source-lens configurations, scalar superradiance clouds can produce distinguishable diffraction signatures for boson masses of approximately $10^{-17}-10^{-12}~\\mathrm{eV}$. These results provide a framework for characterizing extended dark matter and compact object astrophysical environments."},{"arxiv":"2610.31224","id":"3218149","title":"Particle-level parton densities and uncertainties for the resolved photon at NLO","authors":"Andy Buckley, Frank Krauss, Peter Meinzinger, Vithyaban Anjelo Narendran","score":2.6,"section":"new","rank":26,"parts":[0.0,0.0,0.17,0.0,0.0],"note":"Closest network paper: [[2847985]] (coupling 0.06, 6 shared references).","abstract":"We present a new set of parton distribution functions (PDFs), PL$γ$26, for the resolved photon at next-to-leading order (NLO), the first to be fitted to a wide range of jet measurements from several experiments. Jet production in photoproduction at HERA and in $γγ$ collisions at LEP is sensitive to both the quark and the gluon content of the photon, but the measurements lie at low scales, where non-perturbative corrections are large. We therefore choose a novel approach and fit the PDFs to these measurements at particle level, using NLO predictions from the general-purpose event generator SHERPA, matched to the parton shower and including hadronisation and multi-parton interactions (MPI). As part of the procedure, we tune the MPI model separately for photon--proton and photon--photon collisions. Modelling these non-factorisable effects in the fit, rather than through external correction factors, lets us include many more measurements and data points. We estimate the experimental uncertainties with replicas and compare the fitted PDFs with previous sets."},{"arxiv":"2610.30239","id":"3217982","title":"Faithful Uncertainties in ML-Based Inverse Problems: GPs, NNs and NTKs for the Triplet PDF","authors":"Nina Elmer, Sven Krippendorf, Maria Ubiali","score":2.4,"section":"new","rank":27,"parts":[0.0,0.01,0.15,0.0,0.0],"note":"Closest of your papers: [[1686334]] (coupling 0.00, 1 shared references). Closest network paper: [[2946993]] (coupling 0.05, 10 shared references).","abstract":"Machine-learning methods are increasingly used to solve inverse problems in physics, where a faithful estimate of the uncertainty on the reconstructed function is as important as its central value. We address this question in the simplest instance of a parton distribution function (PDF) determination: the reconstruction of the non-singlet triplet distribution $T_3(x,Q_0^2)$ from deep-inelastic scattering data. Within a closure-test framework, in which the underlying PDF is known and the pseudo-data carry correlated experimental uncertainties, we compare Gaussian processes with different kernels, neural-network ensembles trained with different loss functions, and empirical neural tangent kernel approximations. We find that methods yielding comparable central reconstructions can produce markedly different uncertainties, and we identify the ingredients that control them: a likelihood that includes the full experimental covariance, the functional prior encoded in the kernel or in the endpoint preprocessing, and, for tangent-kernel approximations, the stage of training at which the kernel is evaluated. A normalised-bias diagnostic shows that calibration depends on the correlations of the predictive covariance, not only on its pointwise width. Our results illustrate why closure tests and covariance-aware diagnostics are essential to validate uncertainties in ML-based approaches to inverse problems."},{"arxiv":"2610.30784","id":"3218088","title":"Constraints on interacting dark energy with a constant equation of state in light of DESI DR2: The role of the interaction term","authors":"Zhao-Yu Li, Tian-Nuo Li, Guo-Hong Du, Sheng-Han Zhou, Yun-He Li, Jing-Fei Zhang, Xin Zhang","score":2.3,"section":"cross","rank":28,"parts":[0.0,0.0,0.1,0.0,0.07],"note":"Closest of your papers: [[1686334]] (coupling 0.00, 1 shared references). Closest network paper: [[3174071]] (coupling 0.03, 6 shared references).","abstract":"Recent DESI baryon acoustic oscillation (BAO) analyses suggest a preference for an evolving dark energy equation of state (EoS) that crosses the phantom divide $w=-1$. Interactions between dark energy and dark matter can also produce an apparent phantom-divide crossing in the effective dark energy EoS. In this work, we investigate interacting dark energy (IDE) models with a constant EoS parameter $w$, using cosmic microwave background (CMB) observations from Planck, ACT, and SPT, DESI DR2 BAO measurements, and type Ia supernova data from PantheonPlus, DES-Dovekie, and DESY5. We consider four typical forms of the interaction term $Q$. Our results show that the IDE models with $Q\\proptoρ_{\\rm de}$ generally exhibit a stronger preference for nonzero dark-sector interactions. In particular, for the CMB+DESI+DES-Dovekie data, the IDE model with $Q=βH_0ρ_{\\rm de}$ yields $β=-2.52^{+0.80}_{-0.54}$ and $w=-1.510^{+0.170}_{-0.120}$, corresponding to deviations from $β=0$ and $w=-1$ at the $3.2σ$ and $3.0σ$ levels, respectively. Interestingly, the effective EoS of the IDE model with $Q=βH_0ρ_{\\rm de}$ exhibits a redshift evolution resembling that of the $w_0w_a$CDM model, crossing the phantom divide. Bayesian evidence further indicates that this IDE model is favored over $Λ$CDM and the other three IDE models. Our analysis helps identify which interaction forms better account for current cosmological observations."},{"arxiv":"2610.30250","id":"3218007","title":"Continuous Measurement of Quantum Axion Dark Matter","authors":"Yunjia Bao, Dhong Yeon Cheong, Nicholas L. Rodd, Joey Takach, Lian-Tao Wang, Kevin Zhou","score":2.1,"section":"new","rank":29,"parts":[0.0,0.0,0.09,0.0,0.07],"note":"Closest network paper: [[1831221]] (coupling 0.03, 8 shared references).","abstract":"We provide a fully quantum-mechanical description of the continuous measurement of wavelike dark matter. Our focus is cavity haloscopes, although our results inform a broad range of axion searches. We extend the input-output formalism by treating the axion as a quantum field, finding how its quantum state is imprinted onto higher-order moments of observables of the outgoing transmission-line modes. We further develop a novel measurement-record formalism, which computes the joint probability distribution of all measurement outcomes and is well suited to studying the axion in the time domain. With it, we compute the exact axion-induced number distribution for the first time, demonstrating that it is not Poisson. We argue that virialized axion dark matter is expected to be in a Gaussian quantum state, and show that number or quadrature measurements can distinguish this from the predictions of a coherent state or even a Bose-Einstein condensate. Finally, we show that intrinsically quantum effects, such as those from Fock or squeezed axion states, are far too weak to detect."},{"arxiv":"2610.31290","id":"3218183","title":"Extraction of transverse-momentum-dependent helicity distributions of the nucleon","authors":"Ke Yang, Tianbo Liu, Bo-Qiang Ma, Peng Sun, Yuxiang Zhao, Yiyu Zhou","score":2.0,"section":"new","rank":30,"parts":[0.0,0.0,0.14,0.0,0.0],"note":"Closest network paper: [[2824738]] (coupling 0.05, 7 shared references).","abstract":"We present an updated global analysis of the transverse-momentum-dependent (TMD) helicity distributions of the nucleon from measurements of the longitudinal double-spin asymmetry $A_{LL}$ in semi-inclusive deep-inelastic scattering (SIDIS). The analysis incorporates target- and detected-hadron-mass corrections, next-to-next-to-leading-order matching in the small-$b_T$ operator product expansion, and an improved treatment of correlated systematic uncertainties. The present data constrain the up- and down-quark helicity TMDs, whereas the sea-quark and gluon distributions remain weakly constrained. After integration over transverse momenta up to the hard scale, the up- and down-quark distributions agree with collinear helicity distributions within uncertainties. Using the extracted TMDs and the Wandzura-Wilczek-type approximation, we predict the $\\cosφ_h$ modulation of $A_{LL}$ and find agreement with the HERMES and CLAS measurements. We also provide predictions for SIDIS $A_{LL}$ at CLAS12 and for longitudinal single-spin asymmetries in $W^\\pm$ production with leptonic decays at STAR kinematics. An impact study with pseudodata for the proposed Electron-Ion Collider in China (EicC) indicates substantial potential to improve constraints on helicity TMDs at intermediate $x$, including the presently weakly constrained sea-quark sector."}],"refs":{"1116165":{"first":"Cardenas","year":2012,"nauth":3,"title":"The role of charged Higgs boson decays in the determination of tan β-like parameters","role":"seed"},"3122101":{"first":"Griffith","year":2026,"nauth":4,"title":"Minimal dark matter: Generalized framework and direct-detection sensitivity","role":"other"},"2969254":{"first":"Jana","year":2025,"nauth":3,"title":"Gravitational Wave Signature and the Nature of Neutrino Masses: Majorana, Dirac, or Pseudo-Dirac?","role":"other"},"2690106":{"first":"Cárcamo Hernández","year":2023,"nauth":4,"title":"Effective Interactions for the SM Fermion Mass Hierarchy and their Possible UV Realization","role":"seed"},"3144122":{"first":"Okada","year":2026,"nauth":2,"title":"Dirac one-loop seesaw mechanism with a noninvertible fusion rule","role":"other"},"2820658":{"first":"Herrera","year":2024,"nauth":2,"title":"Anapole moment of neutrinos and radioactive sources near liquid xenon detectors","role":"other"},"2862717":{"first":"Cárcamo Hernández","year":2024,"nauth":4,"title":"Fermion Masses and Mixings and Charged Lepton Flavor Violation in a 3-3-1 Model with Inverse Seesaw","role":"other"},"2958466":{"first":"Bélanger","year":2025,"nauth":4,"title":"Illuminating scalar dark matter co-scattering in EFT with monophoton sign ole":"seed"},"713693":{"first":"Aristizabal Sierra","year":2006,"nauth":2,"title":"Leptonic Charged Higgs Decays in the Zee Model","role":"seed"}},"meta":{"date":"Friday, 23 October 2026","url":"https://arxiv.org/catchup/hep-ph/2026-10-23","cat":"hep-ph","year":2026,"built":"2026-10-31","topics":true,"halfLife":5.0,"watch":[],"nown":65,"next":600,"onInspire":53,"threshold":10.0,"nrel":10,"nlist":53,"counts":{"new":39,"cross":14,"replacement":0},"below":[{"arxiv":"2610.30261","title":"Variable-phase methods and data for long-range scattering","score":8.9},{"arxiv":"2610.31101","title":"Saxion Decay and Dark Radiation in the KSVZ Axion Model","score":8.8},{"arxiv":"2610.30507","title":"ULTRAMAN: A Proposed ultrasound detector for macroscopic dark matter","score":8.7},{"arxiv":"2610.30245","title":"Sequential SBI for Resonance Searches at the LHC","score":8.5},{"arxiv":"2610.30773","title":"A Chiral Nelson-Barr Relaxion","score":8.4},{"arxiv":"2610.30252","title":"Neutrino Transition Polarizability","score":8.4}]}};
const M = RAW.meta;
const N = RAW.n.map((a,i)=>({i,...a,out:[],inn:[]}));
const E = RAW.e.map(([s,t,k])=>({s,t,k}));
E.forEach(e=>{N[e.s].out.push(e.t);N[e.t].inn.push(e.s)});
N.forEach(n=>n.deg=n.out.length+n.inn.length);
const ROLE={today:'Listing: new or cross-list',repl:'Listing: replacement',seed:'Your paper',other:'Network paper (other authors)'};
const RANK={today:0,repl:1,seed:2,other:3};
const SEC={new:'New',cross:'Cross-list',replacement:'Replacement'};
const col=n=>`var(--${n.role})`;
const isNew=n=>n.role==='today'||n.role==='repl';
const r=n=>isNew(n)?4+n.score/9:2.6+1.5*Math.log10(1+n.cites)+(n.role==='seed'?1:0);
const auth=n=>n.first+(n.nauth>2?' et al.':n.nauth===2?' + 1':'');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plain=s=>String(s).replace(/\$/g,'').replace(/\\([a-zA-Z]+)/g,'$1').replace(/[{}^_]/g,'');
const REFS=RAW.refs||{};
// reasons text: [[INSPIRE id]] becomes 'Author Year' with a pop-up (authors, year, title), like the graph's tooltip
const why=s=>esc(s).replace(/\[\[(\d+)\]\]/g,(m,k)=>{const r=REFS[k];return r?`<span class="ref ${r.role}" tabindex="0" data-ref="${k}">${esc(r.first)} ${r.year}</span>`:m});
const tex=el=>{if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([el]).then(()=>fold()).catch(()=>{})};
const NEWS=N.filter(isNew).sort((a,b)=>a.rank-b.rank);
document.getElementById('eyebrow').innerHTML=`arXiv ${esc(M.cat)} · <a href="${esc(M.url)}" target="_blank" rel="noopener">${esc(M.date)}</a>`;
document.getElementById('dek').textContent=`${M.nrel} of the ${M.nlist} papers in this listing (${M.counts.new} new, ${M.counts.cross} cross-lists, ${M.counts.replacement} replacements) score ${M.threshold} or more for belonging to the reference and citation network of your ${M.nown} papers and the ${M.next} papers by other authors around them. Highest score first.`;
const T=!!M.topics;   // network file with shared phrases: 35/30/15/10 + 10% shared topics
document.getElementById('foot').innerHTML=`<p><b>Score (0–100).</b> ${T?35:40}% direct citations of network papers (each of your papers counts 1, each other network paper 0.6, network papers with over 1,000 citations 0.06; saturating as 1 − e<sup>−x</sup>); ${T?30:35}% bibliographic coupling with your own papers (idf-weighted cosine of INSPIRE-linked reference sets, best match and mean of the top three, 0.30 = full marks); 15% best coupling with the other network papers (0.35 = full marks); 10% authorship (you, or your co-authors)${T?`; 10% shared topics: technical phrases of two or more words in the title and abstract that your papers and the network use much more often than hep-ph as a whole (each weighted by how much more${M.halfLife?`, with recent papers counting more: a paper's weight halves every ${M.halfLife} years`:''}; saturating as 1 − e<sup>−x/3</sup>)${(M.watch||[]).length?`, plus your watch topics (${M.watch.map(esc).join(', ')})`:''}`:''}.</p>
<p><b>Data.</b> Network: INSPIRE records supplied with the project. Listing papers: INSPIRE records where already harvested (${M.onInspire} of ${M.nlist}); for the rest the reference list was read from the arXiv source and matched to INSPIRE by arXiv number, DOI and texkey. Only links between papers on this page are drawn. Built ${esc(M.built)}.</p>`;
const P=['Direct citations','Coupling to your papers','Coupling to network','Authorship','Shared topics'];
const PS=['Citations','Your papers','Network','Authors','Topics'];   // short labels for phones
function list(){const box=document.getElementById('list');
  if(!NEWS.length){box.innerHTML=`<div class="empty">No paper in this listing reaches a score of ${M.threshold}.</div>`;document.getElementById('mainnet').hidden=true;return}
  NEWS.forEach(n=>{const d=document.createElement('article');d.className='paper';d.id='p'+n.i;
    d.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <h2>${esc(n.title)}</h2>
    <div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    <p class="abs">${esc(n.abstract)}</p><button class="linkbtn absmore" type="button" hidden>More</button>
    <p class="why">${why(n.note)}</p>
    <div class="row"><div class="bars">${n.parts.map((v,j)=>`<span><span class="pl">${P[j]}</span><span class="ps">${PS[j]}</span> <span class="mb"><i style="width:${Math.round(v*100)}%"></i></span></span>`).join('')}</div><span>${n.nlinked} of ${n.nref} references linked to INSPIRE · refs from ${esc(n.src)}</span></div>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a>${n.html?`<a href="https://arxiv.org/html/${esc(n.arxiv)}" target="_blank" rel="noopener" title="arXiv's experimental HTML version">HTML</a>`:''}<button class="linkbtn graphbtn" type="button">Show in network</button></div>`;
    d.querySelector('.graphbtn').addEventListener('click',()=>pick(n,true));
    d.querySelector('.absmore').addEventListener('click',e=>{const o=d.classList.toggle('open');e.target.textContent=o?'Less':'More'});
    box.appendChild(d)});
  toc();tex(box)}
// Phones: long author lists show the first 3 and "et al." (tap to expand); abstracts fold to 3 lines with More.
function authors(s){const a=String(s||'').split(', ');if(a.length<=3)return esc(s);
  return `<span class="au-short">${esc(a.slice(0,3).join(', '))} <button class="aubtn" type="button" aria-label="Show all ${a.length} authors">et al. (+${a.length-3})</button></span><span class="au-full">${esc(s)}</span>`}
document.addEventListener('click',e=>{const b=e.target.closest('.aubtn');if(b)b.closest('.authors').classList.add('open')});
function fold(){document.querySelectorAll('.paper').forEach(d=>{const p=d.querySelector('.abs'),b=d.querySelector('.absmore');
  if(!p||!b||d.classList.contains('open'))return;b.hidden=!(p.scrollHeight>p.clientHeight+2)})}
function toc(){const t=document.getElementById('toc');if(!NEWS.length)return;t.hidden=false;
  const X=RAW.next||[];
  t.innerHTML=`<h3>In this listing</h3><ol>${NEWS.map(n=>`<li><a href="#p${n.i}"><span class="sc${n.role==='repl'?' repl':''}">${n.score.toFixed(0)}</span><span class="tt">${esc(n.title)}</span></a></li>`).join('')}${X.length?`<li class="more-link"><a href="#more"><span class="sc">+${X.length}</span><span class="tt">The next ${X.length} papers by score (folded)</span></a></li>`:''}</ol>`;
  const m=t.querySelector('.more-link a');if(m)m.addEventListener('click',()=>{document.getElementById('more').open=true});tex(t)}
let sel=NEWS[0]||null, hover=null, query='', G;
const svg=d3.select('#svg'), tip=document.getElementById('tip');
function draw(){
  if(!NEWS.length)return;
  const RNG=d3.randomLcg(11);
  const W=Math.max(300,document.getElementById('chart').clientWidth), H=W<600?500:480, m={l:16,r:16,t:20,b:34};
  svg.attr('viewBox',`0 0 ${W} ${H}`); svg.selectAll('*').remove();
  const yrs=d3.extent(N,n=>n.year);
  const x=d3.scaleLinear().domain([yrs[0]-.5,yrs[1]+1.2]).range([m.l+8,W-m.r-8]);
  const ticks=x.ticks(W<600?6:12).filter(t=>Number.isInteger(t)&&t<=yrs[1]);
  svg.append('g').attr('class','grid').selectAll('line').data(ticks).join('line').attr('x1',d=>x(d)).attr('x2',d=>x(d)).attr('y1',m.t).attr('y2',H-m.b);
  svg.append('g').attr('class','axis').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x).tickValues(ticks).tickFormat(d3.format('d')).tickSizeOuter(0));
  const cy=(m.t+H-m.b)/2, xf=n=>isNew(n)?x(yrs[1]+.75):x(n.year);
  const sim=N.map(n=>({n,x:xf(n)+(RNG()-.5)*4,y:cy+(RNG()-.5)*H*.5}));
  const links=E.map(e=>({source:sim[e.s],target:sim[e.t],s:e.s,t:e.t,k:e.k}));
  d3.forceSimulation(sim).force('x',d3.forceX(s=>xf(s.n)).strength(1)).force('y',d3.forceY(cy).strength(.04))
    .force('link',d3.forceLink(links).strength(.03)).force('charge',d3.forceManyBody().strength(-40))
    .force('col',d3.forceCollide(s=>r(s.n)+2)).stop().tick(320);
  sim.forEach(s=>{s.y=Math.max(m.t+8,Math.min(H-m.b-8,s.y));s.x=Math.max(m.l+4,Math.min(W-m.r-4,s.x))});
  G=svg.append('g');
  G.append('g').selectAll('path').data(links).join('path').attr('class',l=>'edge '+l.k)
    .attr('d',l=>{const a=l.source,b=l.target;return `M${a.x},${a.y}Q${(a.x+b.x)/2},${(a.y+b.y)/2-Math.abs(a.x-b.x)*.12} ${b.x},${b.y}`});
  G.append('g').selectAll('circle').data([...sim].sort((a,b)=>RANK[b.n.role]-RANK[a.n.role])).join('circle')
    .attr('class','node').attr('cx',s=>s.x).attr('cy',s=>s.y).attr('r',s=>r(s.n)).attr('fill',s=>col(s.n))
    .on('pointerenter',(ev,s)=>{hover=s.n;showTip(ev,s.n);paint()}).on('pointermove',(ev,s)=>showTip(ev,s.n))
    .on('pointerleave',()=>{hover=null;tip.hidden=true;paint()}).on('click',(ev,s)=>pick(s.n,false));
  const lab=sim.filter(s=>isNew(s.n)||s.n.role==='seed'||s.n.deg>=3);
  const L=lab.map(s=>{const right=s.x>W*.8,t=isNew(s.n)?`#${s.n.rank} ${s.n.first}`:`${s.n.first} ${s.n.year}`,w=t.length*6.2;return{s,t,right,x0:right?s.x-r(s.n)-4-w:s.x+r(s.n)+4,w,y:s.y+4}}).sort((a,b)=>a.y-b.y);
  const placed=[];L.forEach(l=>{let k=0;while(k<40&&placed.some(p=>l.x0<p.x0+p.w&&p.x0<l.x0+l.w&&Math.abs(l.y-p.y)<13)){l.y+=13*(k%2?-1:1)*(1+Math.floor(k/2));k++;l.y=Math.max(m.t+10,Math.min(H-m.b-4,l.y))}placed.push(l)});
  G.append('g').selectAll('text').data(L).join('text').attr('class','nlabel').attr('x',l=>l.right?l.s.x-r(l.s.n)-4:l.s.x+r(l.s.n)+4).attr('y',l=>l.y)
    .attr('text-anchor',l=>l.right?'end':'start').text(l=>l.t);
  paint();
}
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}, not drawn in the network`;
  box.innerHTML=X.map(n=>`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
list();nextList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
