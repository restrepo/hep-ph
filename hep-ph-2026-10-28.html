<script>
const RAW = {"n":[{"id":"3219359","arxiv":"2610.36060","title":"Hybrid seesaw from $SU(2)_1 \\times SU(2)_2 \\times U(1)_Y$","first":"Herrero-Brocal","nauth":3,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Vicente. Cites 1 network paper: [[2931725]]. Closest of your papers: [[452755]] (coupling 0.07, 3 shared references). Closest network paper: [[2931725]] (coupling 0.23, 23 shared references). Shared topics: lepton flavor violation, neutrino mass, seesaw mechanism, gauge symmetry.","score":44.6,"rank":1,"section":"new","parts":[0.45,0.22,0.66,0.5,0.74],"abstract":"We study neutrino mass generation in a model based on the $SU(3)_c \\times SU(2)_1 \\times SU(2)_2 \\times U(1)_Y$ gauge symmetry, in which the Standard Model $SU(2)_L$ arises at low energies as the diagonal subgroup of the two $SU(2)$ factors. The symmetry is enlarged with a global $U(1)_{B-L}$ symmetry, spontaneously broken by the vacuum expectation value of a scalar bidoublet. Light neutrino masses are generated at tree level through a hybrid of the type-III, inverse and linear seesaw mechanisms. A distinctive feature of the construction is the existence of a Nambu-Goldstone boson, the majoron, which transforms non-trivially under the original gauge symmetry while being mostly singlet under the Standard Model gauge group. We explore the phenomenological consequences of this setup, including electroweak precision constraints, the production of the nearly degenerate $W'$ and $Z'$ bosons at colliders and lepton flavor violating decays with a majoron in the final state. The latter constitute the most promising signature of the model.","authors":"Antonio Herrero-Brocal, Javier Perez-Soler, Avelino Vicente","nlinked":58,"nref":62,"src":"INSPIRE","html":true},{"id":"3219442","arxiv":"2610.36780","title":"Probing Charged Higgs Bosons through $H^\\pm \\to W^\\pm A$ Decay in the Type-I Two-Higgs Doublet Model","first":"Arhrib","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1473845]]. Also cites widely used network papers: [[902365]]. Closest of your papers: [[1627633]] (coupling 0.04, 6 shared references). Closest network paper: [[1473845]] (coupling 0.19, 36 shared references).","score":29.3,"rank":2,"section":"new","parts":[0.48,0.12,0.53,0.0,0.07],"abstract":"A light pseudoscalar lighter than the 125 GeV Higgs boson remains allowed within the type-I Two-Higgs Doublet Model (2HDM), consistent with current collider constraints, including Higgs signal strength measurements and direct searches for additional Higgs bosons. At the Large Hadron Collider (LHC), the light pseudoscalar $A$ can be pair-produced through the undetected decay of the Standard Model-like Higgs boson, $h_{125} \\to AA$, when this channel is kinematically accessible (i.e., $m_A < m_{h_{125}}/2$). For the charged scalar $H^\\pm$, once open, the bosonic decay channel $H^\\pm \\to W^{\\pm(*)} A$ naturally dominates over the fermionic $H^\\pm \\to τ^\\pmν$ and $H^\\pm \\to tb$ channels, while relaxing the existing $H^\\pm$ limits. As a result, we propose searching for the charged Higgs boson through $H^\\pm \\to W^{\\pm(*)} A$ in the $4b+2j+\\ellν$ final state. This channel is particularly sensitive to moderate-to-large $\\tanβ$ values and provides an excellent complementary probe to searches based on fermionic $H^\\pm$ decays at the LHC. Our collider analysis demonstrates that this channel can probe a substantial region of the type-I 2HDM parameter space at the high-luminosity LHC.","authors":"Abdesslam Arhrib, Mohamed Krab, Tanmoy Mondal, Prasenjit Sanyal","nlinked":96,"nref":104,"src":"INSPIRE","html":true},{"id":"3219477","arxiv":"2610.37106","title":"Probing new $C\\!P$-violating sources in $Λ_b\\toΛ_c\\ell^-\\barν_\\ell$","first":"Li","nauth":6,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2785325]]. Closest of your papers: [[1671831]] (coupling 0.03, 3 shared references). Closest network paper: [[2785325]] (coupling 0.18, 26 shared references).","score":25.7,"rank":3,"section":"new","parts":[0.45,0.07,0.53,0.0,0.0],"abstract":"While baryonic $C\\!P$ violation has been observed, its potential to reveal new physics beyond the sensitivity of mesonic decays remains an open question. We investigate this potential within semileptonic $b\\to c\\ell\\barν_\\ell$ transitions by comparing the angular distributions of $Λ_b\\toΛ_c(\\toΛπ)\\ell^-\\barν_\\ell$ and $\\bar B\\to D^*(\\to Dπ)\\ell^-\\barν_\\ell$ utilizing lattice-QCD form factors. We perform a global fit to $R(D^{(*)})$ alongside auxiliary $C\\!P$-even measurements to delineate the phenomenologically viable parameter space for new-physics Wilson coefficients. Leveraging these allowed ranges and the lattice inputs, we evaluate the complementary sensitivity of both angular distributions to novel weak phases. We demonstrate that the baryonic decay mode probes combinations of Wilson coefficients that remain inaccessible in mesonic angular distributions, thereby providing critical supplementary information for identifying new physics.","authors":"Dong-Hao Li, Meng-Chao Gao, Qin Qin, Meng-Han Wu, Fu-Sheng Yu, Xing-Bo Yuan","nlinked":78,"nref":82,"src":"INSPIRE","html":true},{"id":"3219367","arxiv":"2610.36163","title":"A GOOFy Three Higgs Doublet Model","first":"Varzielas","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1846048]]. Also cites widely used network papers: [[902365]], [[2817040]]. Closest of your papers: [[1116165]] (coupling 0.03, 2 shared references). Closest network paper: [[2932612]] (coupling 0.11, 28 shared references).","score":25.5,"rank":4,"section":"new","parts":[0.51,0.09,0.32,0.0,0.02],"abstract":"Recent developments in two-Higgs doublet models identified regions of parameter space which are renormalization-group invariant to all orders of perturbation theory but cannot be described by any of the known symmetries of those models. These were dubbed GOOFy symmetries, as they involve scalar doublets and their complex conjugates transforming independently, and imaginary scaling of spacetime coordinates is needed to ensure invariance of kinetic terms. We build a three-Higgs doublet model with a GOOFy symmetry including extensions to the fermion sector. We prove renormalization group invariance through a direct calculation of the model's beta functions and analyse the corresponding phenomenology. The model is shown to be compatible with current LHC observations, displaying interesting features which may be probed in the near future.","authors":"I. de Medeiros Varzielas, P.M. Ferreira, S. Oliveira","nlinked":81,"nref":88,"src":"INSPIRE","html":true},{"id":"3219528","arxiv":"2610.37318","title":"High significance measurement of reactor coherent elastic neutrino-nucleus scattering on germanium by CONUS+","first":"Ackermann","nauth":19,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2513697]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1708009]] (coupling 0.02, 1 shared references). Closest network paper: [[2890702]] (coupling 0.11, 20 shared references).","score":23.5,"rank":5,"section":"new","parts":[0.48,0.06,0.32,0.0,0.0],"abstract":"We report the most precise measurement to date of coherent elastic neutrino-nucleus scattering (CE$ν$NS) from reactor antineutrinos using the CONUS+ high-purity germanium detectors at the Leibstadt nuclear power plant. With an exposure of 1296 kg$\\cdot$days reactor-on, a blind likelihood analysis yields $1555 \\pm 152$ CE$ν$NS events, with a significance of 10.2 $σ$, in agreement with the Standard Model expectation of $1701 \\pm 198$ events within 0.6 standard deviations. The result also determines the weak mixing angle at a momentum transfer of about 10 MeV, $\\sin^2θ_W = 0.225 \\pm 0.022$, consistent with the Standard Model prediction.","authors":"N. Ackermann, H. Bonet, C. Buck, J. Hakenmüller, G. Heusser, M. Lindner, W. Maneschg, M. Meier, S. Mertens, D. Piani, M. Rank, T. Rink, E. Sánchez García, Y. Shi, L. Schönfeld, I. Stalder, H. Strecker, J. Wendel, J. Woenckhaus","nlinked":43,"nref":47,"src":"INSPIRE","html":true},{"id":"3219358","arxiv":"2610.36107","title":"Projected sensitivity to the ADD large extra dimensions model in the monojet plus missing transverse momentum final state at HL-LHC, HE-LHC, and FCC-hh","first":"Guler","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1710078]]. Closest of your papers: [[1627633]] (coupling 0.04, 2 shared references). Closest network paper: [[3139191]] (coupling 0.07, 4 shared references).","score":22.7,"rank":6,"section":"new","parts":[0.45,0.12,0.21,0.0,0.0],"abstract":"We present a unified projection of the sensitivity to the Arkani-Hamed-Dimopoulos-Dvali (ADD) model of large extra dimensions in the monojet plus missing transverse momentum final state at the HL-LHC ($\\sqrt{s}=14$ TeV, 3 ab$^{-1}$), the HE-LHC (27 TeV, 15 ab$^{-1}$) and the FCC-hh (100 TeV, 30 ab$^{-1}$), for $n=2,3,4,6$ extra dimensions, with one selection, significance estimator and calibration throughout. Signal samples are generated with Pythia 8 and combined with the post-fit Standard-Model background yields released by ATLAS and CMS on HEPData; the expected significance combines the thirteen exclusive $E_{\\mathrm{T}}^{\\mathrm{miss}}$ bins of the ATLAS signal region, matching the binning of the published likelihood fit. Two elements are new. First, the energy scaling of the background to higher $\\sqrt{s}$, including the $13\\to14$ TeV step, is measured as a function of $E_{\\mathrm{T}}^{\\mathrm{miss}}$ from dedicated $Z(ν\\barν)$+jets and $W(\\ellν)$+jets samples rather than assumed constant; this reduces the projected FCC-hh reach by 39% relative to a constant-factor treatment. Second, the framework is anchored to the published ATLAS Run-2 expected 95% CL limits through a transparent $n$-dependent calibration, determined directly for all five values of $n$ and found consistent with unity ($1.001\\pm1.4\\%$), so that it acts as a consistency check rather than a sizeable correction; the selection response is validated against the published ATLAS cutflow. The projected 95% CL exclusion reach in $M_D$ for $n=2$ is 12.5, 15.2 and 22.0 TeV at the three colliders, with $5σ$ discovery reach of 9.8, 12.0 and 17.0 TeV, extending the ATLAS Run-2 bound of $M_D>11.2$ TeV by factors of 1.1-2.0. The calibration scheme provides a template for analogous future-collider studies; the projections hold within the stated Run-2-anchored detector and uncertainty assumptions.","authors":"Emine Gurpinar Guler","nlinked":30,"nref":35,"src":"INSPIRE","html":true},{"id":"3219454","arxiv":"2610.36902","title":"Nucleon decays into three leptons plus a kaon","first":"Liang","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1318349]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1222142]] (coupling 0.02, 1 shared references). Closest network paper: [[2053590]] (coupling 0.08, 13 shared references).","score":22.0,"rank":7,"section":"new","parts":[0.48,0.05,0.24,0.0,0.0],"abstract":"We systematically investigate baryon-number-violating (BNV) nucleon decays into three leptons and a kaon within the framework of low-energy effective field theory (LEFT). We identify all kinematically allowed four-body decay modes involving a $K^+$ or $K^0$ meson and derive their decay widths induced by local dimension-9 operators in terms of the LEFT Wilson coefficients. These results are obtained by classifying the relevant operators, which contain three lepton and three quark fields, including one strange quark, according to their transformation properties under the chiral symmetry group, matching them onto chiral perturbation theory. By reanalyzing existing experimental data, we establish stringent bounds on the partial lifetimes of these four-body decay modes and derive corresponding constraints on the dimension-9 Wilson coefficients. Our results provide a convenient EFT framework for connecting the underlying BNV interactions to experimental searches for these exotic nucleon decays.","authors":"Jin-Han Liang, Xiao-Dong Ma, Xiang Zhao","nlinked":42,"nref":44,"src":"INSPIRE","html":false},{"id":"3219569","arxiv":"2610.37541","title":"On-shell Mass Renormalisation and RG-improved Effective Potential in Vector-like Lepton Models","first":"Daberstiel","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1993049]]. Closest of your papers: [[1397629]] (coupling 0.01, 1 shared references). Closest network paper: [[2664140]] (coupling 0.10, 18 shared references).","score":20.9,"rank":8,"section":"new","parts":[0.45,0.03,0.28,0.0,0.0],"abstract":"We discuss the on-shell mass renormalisation in a class of six vector-like lepton (VLL) extensions of the Standard Model with seesaw-like contributions to the SM lepton masses. The schemes absorb large radiative corrections to the SM lepton masses arising from mixing between the SM and VLLs with up to $5\\times5$ mixing matrices and allows for efficient computation of observables and the low-scale $\\overline{\\text{MS}}$ values of model parameters. We determine and solve the redundancy-free 2-loop renormalisation-group (RG) equations, compute the RG-improved effective potential and study the vacuum instability scales of each of the VLL models. We find rich phase behaviour and parameter regions that show instability scales as low as $10^5$ GeV as well as regions where the one-loop corrections to the input parameters can lead to a stable vacuum.","authors":"Gregor Daberstiel, Kilian Möhling, Dominik Stöckinger, Hyejung Stöckinger-Kim","nlinked":76,"nref":76,"src":"INSPIRE","html":true},{"id":"3219311","arxiv":"2610.36003","title":"Elastic Scattering of Dirac Dark Matter with Charged Leptons through a Scalar Mediator: Analytical Framework, Numerical Stability, and Direct-Detection Bounds","first":"Xuan","nauth":2,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[1518747]], [[2817040]]. Closest of your papers: [[2859009]] (coupling 0.05, 5 shared references). Closest network paper: [[2942451]] (coupling 0.07, 5 shared references). Shared topics: dark matter model, fermion mass.","score":15.0,"rank":9,"section":"new","parts":[0.11,0.16,0.21,0.0,0.31],"abstract":"We investigate a leptophilic simplified dark matter model in which a Dirac fermion χinteracts with Standard Model charged leptons ≪ through a real scalar mediator S. Starting from the low-energy Yukawa interaction Lagrangian in the fermion mass eigenbasis, we derive closed-form tree-level analytical expressions for the invariant scattering amplitude, the spin-averaged squared matrix element, and the differential and total elastic cross sections. To overcome the numerical loss of significance that arises when evaluating the standard antiderivative difference in the heavy-mediator regime, we rearrange the phase-space integral into positive-definite recoil contributions supplemented by convergent power-series expansions. This analytical formulation smoothly connects the light-mediator and heavy-mediator regimes without relying on Effective Field Theory (EFT) contact approximations, allowing us to establish quantitative validity criteria for the contact limit. Finally, we map the microscopic differential cross section onto the reference electron-scattering cross section and evaluate the resulting coupling constraints using experimental data from SENSEI, DAMIC, SuperCDMS, XENON10, and XENON1T.","authors":"Nguyen Nhu Xuan, Vu Toan Thang","nlinked":25,"nref":28,"src":"INSPIRE","html":true},{"id":"3219319","arxiv":"2610.36004","title":"Relativistic Elastic Scattering of Cosmic-Ray Boosted Dirac Dark Matter with Charged Leptons through a Scalar Mediator","first":"Xuan","nauth":2,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[1518747]], [[2817040]]. Closest of your papers: [[2859009]] (coupling 0.04, 5 shared references). Closest network paper: [[2942451]] (coupling 0.07, 6 shared references). Shared topics: fermion mass.","score":12.9,"rank":10,"section":"new","parts":[0.11,0.13,0.21,0.0,0.19],"abstract":"We investigate the relativistic kinematics, spinor-recoil structure, and direct-detection phenomenology of a Dirac dark matter fermion interacting with SM charged leptons through a real scalar mediator within a low-energy effective Lagrangian in the fermion mass basis. Standard halo direct-detection searches lose sensitivity for sub-MeV dark matter, because the maximum recoil energy falls below detector thresholds. When halo dark matter particles are upscattered to relativistic energies by galactic cosmic-ray electrons (CRE), the momentum transfer in both the astrophysical upscattering stage and the terrestrial detection stage can exceed the fermion mass scales. By decomposing the tree-level $t$-channel cross section into three positive-definite contributions, we separate the static-numerator contribution from the linear and quadratic momentum-transfer spinor-recoil contributions, evaluated via convergent power series that reduce subtractive cancellation at small momentum transfer. For incident large kinetic energies, the spinor-recoil contributions become comparable to and begin to exceed $σ_0$; at substantially higher energies, they enhance the total cross section by several orders of magnitude relative to the static-numerator approximation. Furthermore, retaining the dynamical scalar propagator yields a high-energy cross section that decreases as $1/s$ and satisfies $s$-wave helicity partial-wave unitarity, in contrast to the linear $\\mathcal{O}(s/m_S^4)$ growth of the contact approximation. Applying the exact differential recoil spectra within an effective propagation model for cosmic-ray electron boosted dark matter (CRE-BDM), we derive $90\\%$ C.L. exclusion bounds in the 1 keV -- 10 MeV mass range from Super-Kamiokande, XENONnT, and PandaX-4T, extending experimental sensitivity into the sub-MeV window.","authors":"Nguyen Nhu Xuan, Vu Toan Thang","nlinked":30,"nref":33,"src":"INSPIRE","html":true},{"id":"3219369","arxiv":"2610.36161","title":"Asymmetric Reheating of a Dark Sector","first":"Cosme","nauth":3,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1679809]] (coupling 0.08, 3 shared references). Closest network paper: [[3070028]] (coupling 0.09, 10 shared references).","score":12.7,"rank":11,"section":"new","parts":[0.06,0.2,0.26,0.0,0.07],"abstract":"We study asymmetric post-inflationary reheating in a framework with two sequestered MSSM-like sectors (the ``visible'' and ``dark'' sectors) with different supersymmetry-breaking scales, with dark matter corresponding to the lightest dark baryons. In this setup, independent Affleck-Dine dynamics in the two sectors offers a natural explanation for the comparable abundances of visible and dark matter. We relate the resulting temperature hierarchy to the inflaton's partial decay widths in different kinematical regimes, where it may decay into dark sector particles via 2-, 3- or 4-body processes. The latter case yields the most asymmetric reheating scenario, and we discuss the implications of this regime for the dark sector's thermal history, namely regarding the corresponding strong and weak interactions. While in this kinematical regime the contribution of light dark sector degrees of freedom to $ΔN_{\\rm eff}$ is negligible, we show that it increases significantly in the regime where 3-body decays are possible, particularly near the threshold for dark Higgs pair-production where $ΔN_{\\rm eff}^{\\max} \\simeq 0.078$. The current combined BBN+CMB+BAO bound leaves only a narrow allowed interval of the 2-body decay regime immediately above threshold, while next-generation CMB experiments could probe slightly below it.","authors":"Catarina Cosme, João G. Rosa, Inês Sequeira","nlinked":69,"nref":69,"src":"INSPIRE","html":true},{"id":"3219332","arxiv":"2610.36049","title":"Dark Matter Coherent Freeze-Out Mechanism: A Comprehensive Analysis","first":"Ferrante","nauth":4,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2855387]] (coupling 0.04, 5 shared references). Closest network paper: [[2828434]] (coupling 0.06, 5 shared references). Shared topics: relic density, dark matter candidate, dark matter model.","score":11.7,"rank":12,"section":"new","parts":[0.0,0.1,0.17,0.0,0.62],"abstract":"Both Weakly-Interacting Massive Particle (WIMP) and Axion-Like Particle (ALP) are attractive particle dark matter candidates. In this paper we consider a scenario in which both WIMP and ALP are present. The two species interact via a non-derivative quadratic coupling modeled on the axion-nucleon interaction in QCD. We show that even a small (Planck-suppressed) coupling can drastically modify the cosmological history of both species. In the very early Universe, the ALP field acquires a vacuum expectation value, and the system undergoes an inverse phase transition at a temperature around or below the weak scale. WIMPs may remain in equilibrium far beyond the usual freeze-out time, eventually decoupling via a novel \"coherent freeze-out\" mechanism. WIMP annihilation cross sections several orders of magnitude above the canonical thermal target value can be consistent with the observed relic density in the coherent freeze-out scenario. At the same time, coherent oscillations of the ALP field do not begin until after the phase transition, and the initial conditions for these oscillations are set by the thermal physics of the phase transition. The ALP relic density is then predicted unambiguously in terms of the WIMP mass and coupling. We term this scenario \"ALP miracle\", since the observed relic density is obtained when these parameters are around their natural values, the weak and the Planck scale. The ALP miracle scenario prefers the ALP mass above about $10^{-3}\\,\\mathrm{eV}$, far larger than other popular ALP dark matter models. The ALP miracle parameter space overlaps with a currently allowed region of the QCD axion band, a large fraction of which is expected to be probed by the proposed IAXO experiment.","authors":"Steven Ferrante, Lillian Luo, Maxim Perelstein, Bingrong Yu","nlinked":55,"nref":57,"src":"INSPIRE","html":true},{"id":"3219469","arxiv":"2610.37039","title":"Constraining New Physics by Studying Single Top Quark Production","first":"Roknabadi","nauth":3,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[902365]], [[2817040]]. Closest of your papers: [[1116165]] (coupling 0.04, 1 shared references). Closest network paper: [[3190962]] (coupling 0.05, 3 shared references).","score":10.3,"rank":13,"section":"new","parts":[0.11,0.12,0.14,0.0,0.06],"abstract":"This study introduces a beyond the Standard Model framework by adding a charged scalar particle, H_c, analogous to the charged Higgs in the Two-Higgs-Doublet Model (2HDM), but analyzed without the restrictive constraints typically applied in 2HDM scenarios. To assess the impact of H_c on single top quark production, two approaches are taken. First, variations in the production cross-section via the s- and t-channels are examined under different values of the model parameters, compared to the SM predictions. Second, spin correlations are analyzed, focusing on differences in the spin of the mediated particle between the new model and SM in the single top quark production via the s-channel. Within the framework of the simplified phenomenological model considered here, a significant fraction of the parameter space can be constrained by combining the two approaches.","authors":"Maryam Roknabadi, Saeid Paktinat Mehdiabadi, Seyed Mohammad Reza Tabatabaei","nlinked":21,"nref":25,"src":"INSPIRE","html":true},{"id":"1518747","arxiv":"1703.07364","title":"The waning of the WIMP? A re "k"],[44,22,"c"],[17,13,"c"],[4,37,"c"],[1,28,"c"],[45,13,"c"],[60,28,"c"],[8,42,"k"],[6,43,"c"],[2,44,"c"],[42,26,"c"],[8,50,"k"],[47,28,"c"],[2,53,"k"],[7,58,"k"],[61,30,"c"],[6,26,"c"],[3,60,"k"],[8,61,"k"],[10,30,"k"],[1,63,"k"],[55,62,"c"],[11,24,"k"],[59,13,"c"],[33,61,"c"],[50,26,"c"],[0,19,"k"],[2,22,"k"],[33,51,"c"],[26,23,"c"],[48,34,"c"],[12,27,"k"],[34,62,"c"],[20,26,"c"],[45,56,"c"],[12,33,"k"],[22,53,"c"],[36,28,"c"],[56,28,"c"],[7,40,"c"],[0,39,"k"],[45,26,"c"],[11,42,"k"],[9,14,"k"],[32,26,"c"],[4,52,"k"],[5,34,"k"],[35,37,"c"],[1,55,"k"],[0,57,"k"],[11,59,"k"],[41,34,"c"],[9,29,"k"],[60,13,"c"],[4,26,"c"],[61,13,"c"],[6,64,"k"],[0,65,"k"]],"next":[{"arxiv":"2610.36033","id":"3219331","title":"Can inflationary axion fluctuations dominate over misalignment?","authors":"Seung J. Lee, Sarunas Verner, Bingrong Yu","score":7.8,"section":"new","rank":14,"parts":[0.0,0.07,0.19,0.0,0.28],"note":"Closest of your papers: [[1607572]] (coupling 0.02, 3 shared references). Closest network paper: [[1955022]] (coupling 0.07, 10 shared references). Shared topics: relic abundance.","abstract":"The relic abundance of light stable axion dark matter is usually set by misalignment. We study whether the inflationary fluctuations of the axion can dominate instead, and we follow the modes analytically through an instantaneous transition from de Sitter expansion to radiation domination, neglecting the axion mass during inflation and keeping it afterward. Since the energy density is quadratic in the field, a fluctuation-dominated abundance carries an isocurvature perturbation even when the mean displacement vanishes. For a canonical minimally coupled axion the spectrum is scale invariant, and fluctuation-dominated dark matter exceeds the Planck isocurvature limit by about eight orders of magnitude. An inflaton-dependent kinetic function or a nonminimal coupling to the Ricci scalar tilts the spectrum blue, moving the fluctuation power from CMB scales to small scales. Imposing the Planck limit at the pivot scale, we find that fluctuation-dominated dark matter with a constant kinetic slope requires the spectral tilt $n_η-1\\gtrsim0.27$ and the axion mass $m_η \\gtrsim200 \\rm{GeV}$ at $H_I=10^{10}\\rm{GeV}$, and $n_η-1\\gtrsim0.34$ and $m_η\\gtrsim4.5\\,$keV at $H_I=10^{13}\\rm{GeV}$. A kinetic function with a running slope lowers these masses to $1.4~\\rm{GeV}$ and $0.7\\,$eV, respectively. For the QCD axion, whose oscillations start late, we estimate that any single power-law spectrum blue enough to satisfy the pivot limit gives too little fluctuation abundance, and misalignment dominates."},{"arxiv":"2610.37308","id":"3219544","title":"Nonradial oscillation modes of axion condensed neutron stars in the Cowling approximation","authors":"Antonio Gómez-Bañón, Pantelis Pnigouras, José A. Pons","score":7.4,"section":"new","rank":15,"parts":[0.0,0.13,0.24,0.0,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.04, 3 shared references). Closest network paper: [[1955022]] (coupling 0.08, 8 shared references).","abstract":"In light QCD axion models, finite-density corrections to the axion potential can source a nonvanishing axion field inside neutron stars. Extending our previous analysis of radial oscillations, we study the nonradial ($l=2$) oscillation spectrum of such axion condensed neutron stars in the relativistic Cowling approximation, keeping the fluid and axion perturbations fully coupled and dynamical. The condensate modifies the fluid spectrum in two ways: the altered equilibrium structure raises the $f$- and $p$-mode frequencies by up to $\\sim20\\%$, while the dynamical coupling to the axion field partially compensates this shift, almost entirely for the $f$-mode. Fluid modes with frequencies above the axion mass acquire a new damping channel through axion emission. The $f$-mode remains below this threshold for all configurations supporting a condensate, whereas the $p$-modes are damped on timescales that can be as short as $\\sim10$ ms, shorter than their gravitational-wave damping times, except for certain axion masses where the outgoing axion amplitude nearly vanishes. The spectrum also contains a family of strongly damped axion-dominated quasinormal modes, with imaginary parts of order kHz, and a sequence of gravitationally bound axion states analogous to gravitational atom levels. Below the propagation threshold, the bound $p$-modes undergo avoided crossings with these levels, exchanging their fluid- and axion-dominated character."},{"arxiv":"2610.36906","id":"3219473","title":"Phenomenology of strangeness-changing two-body currents in antineutrino scattering","authors":"Jarosalw A. Nowak","score":6.9,"section":"new","rank":16,"parts":[0.06,0.03,0.26,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1854224]] (coupling 0.01, 1 shared references). Closest network paper: [[2102705]] (coupling 0.09, 15 shared references).","abstract":"Antineutrinos produce hyperons without kaons through Cabibbo-suppressed quasi-elastic scattering on a single nucleon. A two-body current acting on a correlated nucleon pair, nubar [NN] -> l+ Y N', gives the same hyperons plus a second nucleon. A companion paper constructs this current without fixing its size. StrangeMC, the only generator with the channel, set it to a flat 15% of the quasi-elastic hyperon cross section. We determine the ratio f = sigma_2p2h/sigma_QE of the two-body to the quasi-elastic hyperon cross section on carbon versus antineutrino energy, and the detector signatures of two-body events. The strange two-body current and its non-strange counterpart are computed on the same nucleon pair. Their ratio is converted into f with the Valencia non-strange 2p2h and quasi-elastic cross sections for carbon, assuming that nuclear effects missing from the pair are common to both. Under this assumption f rises from 0.14 at 0.6 GeV to 0.20-0.22 at 2-5 GeV. Averaged over the Booster antineutrino spectra it is 0.15-0.17, close to the 15% placeholder, which StrangeMC now replaces with f(E). The largest evaluated uncertainty comes from separating the two-body current from one-body production followed by rescattering: across the separation prescriptions explored, f at 1 GeV ranges from 0.12 to 0.22. Interference with one-body production is not calculated and could be as large as the two-body rate. In a simulated SBND antineutrino-mode exposure on argon with the carbon f, two-body events are about 11% of events that produce a strange hadron. They supply more than a quarter of the kaon-less Sigma+ events used to tag hyperon charge exchange, partly as Sigma+ made at the weak vertex. They reconstruct 12-30% low in energy under the quasi-elastic hypothesis. After final-state interactions half of them have a proton above 40 MeV at the vertex, against a fifth of quasi-elastic events."},{"arxiv":"2610.36062","id":"3219366","title":"Late reheating in the era of precision cosmology","authors":"Kensuke Akita, Oleksii Ihnatenko, Maksym Ovchynnikov","score":6.7,"section":"new","rank":17,"parts":[0.0,0.05,0.12,0.0,0.33],"note":"Closest of your papers: [[1755250]] (coupling 0.02, 2 shared references). Closest network paper: [[2052515]] (coupling 0.04, 13 shared references). Shared topics: neutrino mass.","abstract":"We study the minimum cosmic reheating temperature allowed by recent measurements of primordial nuclear abundances and of the cosmic microwave background. We find that reheating by decays of a light particle into electrons and neutrinos is compatible with both at temperatures around 0.4 MeV, an order of magnitude below the bound for purely electromagnetic channels. This scenario has implications for cosmology and laboratory searches. For example, nearly standard neutrino radiation can coexist with a smaller active neutrino mass density at unchanged physical masses, by up to a factor of five for normal ordering. The weaker suppression of clustering changes matter power at the percent level, which forthcoming galaxy surveys and lensing measurements may probe. Late reheating also suppresses sterile neutrino production at mixings within the projected reach of laboratory experiments."},{"arxiv":"2610.36030","id":"3219356","title":"A Practical Guide to Sensitivity Projections for Beyond the Standard Model Physics","authors":"Francesca Acanfora, Michael J. Baker, Joaquim Iguaz Juan, Aidan Symons, Andrea Thamm","score":6.6,"section":"new","rank":18,"parts":[0.0,0.08,0.29,0.0,0.0],"note":"Closest of your papers: [[1615477]] (coupling 0.03, 1 shared references). Closest network paper: [[2917228]] (coupling 0.10, 6 shared references).","abstract":"Statistics is a well-established discipline, yet its application can be confusing, particularly in fields where the language of statistics is unfamiliar and when making projections, where real data is not yet available. Both of these factors are commonplace in Beyond the Standard Model physics. In this work, we clarify the distinction between goodness-of-fit tests, which assess the compatibility of an observation with a single hypothesis, and hypothesis tests, which quantify how strongly some data prefer one hypothesis over another. We emphasise that for Beyond the Standard Model sensitivity projections, hypothesis testing should be used. We give detailed examples using both Poisson and multinomially distributed data, deriving exact $p$-values and discussing Monte Carlo and asymptotic approximations. We further demonstrate that for the Asimov data set all the test statistics discussed, for both goodness-of-fit tests and hypothesis tests, can be approximated by Pearson's $χ^2$ statistic, and the difference in approaches comes down to the distribution of the test statistics. We also compare goodness-of-fit and hypothesis test $p$-values in two realistic examples. We (1) consider the reach of a muon collider on heavy spin-1 resonances and (2) provide updated projections for the potential of current and future gamma ray telescopes to probe new dark sectors via the observation of Hawking radiation from the explosion of a black hole. Finally, we discuss the CLs method, the significance and systematic errors."},{"arxiv":"2610.37137","id":"3219282","title":"What the Primary Lund Plane Omits: A Model-Stitching Diagnosis of a Jet-Tagger Representation Gap","authors":"Saurabh Rai, Sanmay Ganguly","score":5.8,"section":"new","rank":19,"parts":[0.0,0.05,0.29,0.0,0.0],"note":"Closest of your papers: [[1627633]] (coupling 0.02, 1 shared references). Closest network paper: [[2893828]] (coupling 0.10, 4 shared references).","abstract":"Lund-plane and Particle Transformer (ParT) jet taggers can differ in performance because one representation is weaker, or because a weaker downstream computation reads an adequate one. Standalone performance cannot separate these. Model stitching can: it links the frozen early layers of one network to the frozen late layers of another through a single trained linear map. As a positive control we use an incomplete Lund representation, the primary declustering branch, whose deficit is known independently. Stitched into ParT's downstream, it reaches a background rejection at least as much as its own downstream recovers, yet far below ParT's background rejection: the deficit is representational, not computational. A hypergraph reader over splitting triplets does no better, ruling out higher-order correlations as the cause. The gap is invisible in AUC, which stays within 1% of its target value, and appears only in background rejection at low signal efficiency. It localizes to 0.6% of background jets, at and above the top mass, with more constituents but fewer primary splittings than typical background. Rebuilding the representation on the full Cambridge/Aachen declustering tree repairs the deficit as predicted: standalone rejection rises, closing 72% of the gap. Masking nodes at inference shows the repaired network still relies almost entirely on the primary branch; the secondary splittings make the representation learnable rather than supplying information it reads. Along the primary branch, the widest-angle splitting, near the top and $W$ opening angles, is worth nearly twice a random one. For quark/gluon tagging the primary branch is far less deficient, retaining 77.6% of ParT's rejection (46.9% for top), and the full tree closes only 33% of the gap (72% for top)."},{"arxiv":"2610.27068","id":"3216791","title":"ASTROLABE: A 3D Particle-Level Surrogate for Cosmology Simulation with Physical Flow Matching","authors":"Ibrahim Elsharkawy, David Curtin, Yonatan Kahn, Neal Weiner","score":4.7,"section":"new","rank":20,"parts":[0.0,0.04,0.18,0.0,0.07],"note":"Closest of your papers: [[2859009]] (coupling 0.01, 2 shared references). Closest network paper: [[2719600]] (coupling 0.06, 6 shared references).","abstract":"The microphysics of dark matter (DM) is imprinted on cosmological structure across an enormous dynamic range. Nonlinear cosmological observables are most reliably modeled with N-body and hydrodynamic simulations. However, systematic N-body scans over DM theory space are prohibitively expensive. Machine learning emulators provide a possible solution, but are currently limited by either low resolution or only the ability to emulate specific observables. We introduce Astrolabe, a flow-matching-based generative emulator designed to be free of both constraints. Astrolabe acts directly on the 6N phase-space coordinates of N individual particles. With no voxel grid in the output, there is no voxel-resolution ceiling, and in principle any observable can be measured from inference. Astrolabe is computationally tractable via a field-particle hybrid transformer in which every particle cross-attends to multiscale field tokens, so compute and memory are linear in N. Astrolabe incorporates physical flow matching by taking the prior distribution for the flow to be approximate COmoving Lagrangian Acceleration (COLA)-based coordinates rather than unphysical noise, with momentum and mass conservation enforced at all points along flow time. In the Lambda-CDM cases we test, Astrolabe produces realistic fields with accurate power spectra, halo mass functions, velocity profiles, and halo density profiles. We also observe out-of-distribution generalization, with accurate emulation of dark-acoustic oscillation initial conditions. Astrolabe is also capable of being fine-tuned to simulate very large N and we demonstrate this by emulating a TNG50-3-dark simulation at a fraction of the cost. This method represents a first step toward a general and powerful cosmology simulation surrogate, which may eventually permit the inclusion of baryonic physics and a systematic exploration of richer dark sector interactions."},{"arxiv":"2610.36081","id":"3219340","title":"Custodial scalars and Higgs branch","authors":"Luc Darmé, Baptiste Filoche, Sebastian Monath","score":4.1,"section":"new","rank":21,"parts":[0.0,0.08,0.12,0.0,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.03, 3 shared references). Closest network paper: [[2788812]] (coupling 0.04, 3 shared references).","abstract":"We show that, for most gauged scalar fields, the scalar potential can be systematically organised into an ordered tree of increasingly symmetric operators. The intermediary global symmetries represented in the tree allow at tree-level a subset of the scalar field components, the custodial scalars, to be technically lighter than the scalar mass scale, or even exactly massless (so-called accidents). We further demonstrate, using the notion of moment maps, that such structure can be related to the Higgs branch of supersymmetric theories, allowing the use of powerful symplectic geometry tools in studying the vacuum of non-supersymmetric scalar potentials. We present various applications, from an example of a non-abelian accident to a Standard Model-like Higgs sector generated from custodial scalars."},{"arxiv":"2610.37254","id":"3219563","title":"Global Analysis of Nuclear Parton Distribution Functions using Markov Chain Monte Carlo","authors":"Nasim Derakhshanian","score":4.0,"section":"new","rank":22,"parts":[0.0,0.02,0.23,0.0,0.0],"note":"Closest of your papers: [[1397629]] (coupling 0.01, 2 shared references). Closest network paper: [[2102705]] (coupling 0.08, 35 shared references).","abstract":"Global analyses of nuclear parton distribution functions (nPDFs) have traditionally used the Hessian method for uncertainty estimation, relying on a local quadratic approximation of the chi-squared function. This Gaussian approximation can be inadequate when experimental constraints are limited and parameter correlations are strong, as it cannot fully capture asymmetric uncertainties, flat directions, or multiple minima. This thesis develops a Bayesian framework for nPDF determination using Markov Chain Monte Carlo (MCMC) techniques within the nCTEQ analysis framework. An adaptive Metropolis-Hastings algorithm enables direct sampling of the posterior distribution, revealing pronounced non-Gaussian behavior and secondary minima, particularly in the valence distributions. The analysis presents the first global single-nucleus determination of lead (Pb) PDFs based exclusively on lead data, complemented by a multi-nuclei analysis incorporating different nuclear targets through a standard analytic dependence on the mass number. Including lighter nuclei significantly constrains quark distributions and changes the extracted lead PDFs, while the gluon distribution remains comparatively stable. A comparison with Hessian-based results highlights the limitations of the Gaussian approximation in regions with strong nonlinearity or multimodality. Overall, this work establishes Bayesian MCMC inference as a flexible framework for nPDF determination, providing a more comprehensive characterization of parameter uncertainties and the underlying parameter space."},{"arxiv":"2610.36160","id":"3219381","title":"How particle physics stops ultra-relativistic bubbles and shapes their gravitational waves","authors":"Alessandro Strumia","score":4.0,"section":"new","rank":23,"parts":[0.0,0.05,0.17,0.0,0.0],"note":"Closest of your papers: [[1854224]] (coupling 0.02, 1 shared references). Closest network paper: [[2862278]] (coupling 0.06, 10 shared references).","abstract":"The gravitational-wave spectrum produced by ultra-relativistic bubbles in a first-order cosmological phase transition can be approximated in terms of their energy density as a function of bubble size. Bubble collisions and post-collision classical evolution negligibly change it. The dominant energy loss is particle scattering, often in the Landau--Pomeranchuk--Migdal regime. So the GW spectrum depends on the particle-physics coupling (interpolating between the `envelope' and `bulk flow' limits), on the interaction type (gauge, Yukawa, scalar quartic, ...), and on whether particle number is conserved. Finally, we consider broken global symmetries, which give a mixture of `elastic' and `inelastic' collisions."},{"arxiv":"2610.37627","id":"3219586","title":"Using Higgs Boson Production in Association with Three Jets via Gluon Fusion at the LHC to Investigate the CP Properties of the Higgs Boson","authors":"Arunima Bhattacharya, Francisco Campanario, Michael Kubocz, Terrance Figy, Tunde Kushimo, Ivan Rosario","score":3.8,"section":"new","rank":24,"parts":[0.0,0.06,0.13,0.0,0.0],"note":"Closest of your papers: [[1207270]] (coupling 0.02, 3 shared references). Closest network paper: [[1494411]] (coupling 0.05, 14 shared references).","abstract":"A neutral Higgs boson $Φ$ with general scalar and pseudoscalar couplings and accompanying jets can be efficiently produced via gluon fusion through heavy-quark loops in high-energy hadronic collisions. We present integrated cross sections and kinematic distributions for the production of a generic Higgs boson $Φ$ in association with three jets, $pp \\to Φjjj$, at order $α_{s}^{5}$. We include the full mass dependence of the top- and bottom-quark loop contributions, combined coherently so that their interference is retained. Earlier finite-mass calculations of $Φ+3$ jets with bottom-quark loops and $CP$-odd or $CP$-mixed couplings were restricted to $gg \\to gggΦ$; we include the complete set of partonic subprocesses, and find that the quark-containing channels supply close to one half of the pseudoscalar three-jet cross section at $\\tanβ=1$. In a Type-II two-Higgs-doublet model the bottom-quark loop comes to dominate the rate as $\\tanβ$ is increased, so that the cross section is non-monotonic in $\\tanβ$. Comparing against the heavy-top effective theory and its form-factor-improved version, we show that the effective description fails in the hard tails of the transverse-momentum and dijet-mass distributions, while the third-jet centrality $z^\\star$ and the rapidity separation of the two leading jets are largely insensitive to the heavy-quark treatment. We further study the multi-jet azimuthal correlation $Φ_{2}$, built from the jet momenta on the two sides of the Higgs boson in rapidity, and find that the bottom-quark contribution modifies its shape even for a state of definite $CP$. For a $CP$-mixed state the interference of the two couplings adds a $\\sin2Φ_2$ term, which a simple counting asymmetry isolates and which no $CP$ eigenstate can produce. Numerical results are presented for the LHC at $\\sqrt{s}=13.6~$TeV and $m_Φ=125.2~$GeV."},{"arxiv":"2610.37210","id":"3219515","title":"Exclusive production of doubly charmed baryon pair at B Factories","authors":"Xiao Liang, Jun Jiang, Chun-Yuan Li, Meng-Li Liu, Xing-Hua Yang, Zong-Guo Si","score":3.8,"section":"new","rank":25,"parts":[0.06,0.01,0.09,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.00, 1 shared references). Closest network paper: [[1710056]] (coupling 0.03, 10 shared references).","abstract":"The exclusive production of doubly charmed baryon pairs $Ξ_{cc}+\\barΞ_{cc}$ via $e^+e^-$ annihilation at B factories are calculated in the framework of non-relativistic QCD (NRQCD). The total cross sections, theoretical uncertainties, differential distributions and event yields for the BaBar and Belle II experiments are systematically discussed. According to our study, the detection prospects for both experiments are unfavorable."},{"arxiv":"2610.37638","id":"3219591","title":"Weighing dark matter particles with gravitational waves","authors":"Rodrigo Vicente, Francisco Duque, Theophanes K. Karydas, Gianfranco Bertone","score":3.8,"section":"new","rank":26,"parts":[0.0,0.06,0.09,0.0,0.07],"note":"Closest of your papers: [[2859009]] (coupling 0.02, 3 shared references). Closest network paper: [[2719600]] (coupling 0.03, 3 shared references).","abstract":"It is commonly assumed that the mass of dark matter particles cannot be determined from their gravitational effects when dark matter behaves as collisionless matter. Here we show that extreme-mass-ratio inspirals observable by millihertz gravitational-wave observatories such as the Laser Interferometer Space Antenna (LISA) could measure the mass of ultralight dark matter particles in sufficiently dense dark matter spikes. The separation of scales between the two black holes allows ultralight dark matter to form a collisionless density spike around the massive primary while retaining wave effects in its interaction with the stellar-mass companion. We incorporate wave-dependent accretion and dynamical friction into relativistic inspiral waveforms and jointly infer the dark matter particle mass, spike normalisation and binary parameters from simulated LISA signals. For massive black holes at the low-mass end of the LISA population ($M\\sim 10^5 M_\\odot$), our forecasts show that particle masses spanning $10^{-14}-10^{-11}\\,\\mathrm{eV}$ could be measured to within an order of magnitude."},{"arxiv":"2610.37382","id":"3219557","title":"Covariant Wigner function and spin polarization of the Rarita-Schwinger field","authors":"Matteo Buzzegoli, Aleksandar Gecic, Rajeev Singh","score":3.7,"section":"new","rank":27,"parts":[0.0,0.06,0.12,0.0,0.0],"note":"Closest of your papers: [[2855387]] (coupling 0.03, 3 shared references). Closest network paper: [[2940264]] (coupling 0.04, 4 shared references).","abstract":"We study the covariant Wigner function for the spin-$3/2$ Rarita-Schwinger field and its relation to the spin density matrix and the mean spin polarization vector. We obtain a formula relating the covariant Wigner function to the mean spin vector for a weakly interacting field. We then calculate the mean spin vector induced by thermal vorticity, thermal shear, and spin potential at local thermal equilibrium in the Belinfante, canonical and GLW pseudo-gauges. The resulting formula can be used to predict the spin polarization of spin-$3/2$ hadrons, such as the $Ω^-$, in heavy-ion collisions. Differences in the thermal-shear induced polarization in the canonical and Belinfante pseudo-gauges make it possible to use local spin polarization measurements of the $Ω^-$ to discriminate between the two pseudo-gauges."},{"arxiv":"2610.36591","id":"3219430","title":"Warm inflation beyond the Gaussian limit: primordial black holes and induced gravitational waves","authors":"Mayukh R. Gangopadhyay, Nilanjana Kumar","score":3.7,"section":"new","rank":28,"parts":[0.0,0.03,0.19,0.0,0.0],"note":"Closest of your papers: [[2855387]] (coupling 0.01, 1 shared references). Closest network paper: [[2693756]] (coupling 0.07, 7 shared references).","abstract":"In warm inflation, the primordial fluctuations are driven by random kicks from a hot radiation bath. Two features of these kicks matter: how long the bath remembers them, which shapes the power spectrum, and how their strengths are spread, which controls the rare, extreme fluctuations. In this paper, we investigate how primordial black holes and the accompanying induced gravitational waves can be used to discriminate between these two features. We use a simple model inspired by warm inflation, in which independent kicks of random strength add up to a narrow peak in the power spectrum. At leading order, the induced gravitational wave depends only on the power spectrum and is therefore insensitive to how the kicks are distributed. However, the black holes are very sensitive to these rare large fluctuations. Hence, two baths can yield the same gravitational wave signal while forming black holes at very different rates. A modest kurtosis range of 0.1 to 0.3 enhances black-hole formation by factors of ten to a million at fixed gravitational-wave amplitude, the larger factors for the rarer black holes. Counting peaks rather than all points, or widening the spectrum, lowers the enhancement by at most a factor of about four. In general a change in the power affects both phenomena, while the kurtosis affects only the black hole production."},{"arxiv":"2610.36611","id":"3219436","title":"Quark mixing and CP violation due to torsional interaction","authors":"Arnab Chakraborty, Amitabha Lahiri","score":3.6,"section":"new","rank":29,"parts":[0.06,0.01,0.08,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.00, 1 shared references). Closest network paper: [[3094526]] (coupling 0.03, 3 shared references).","abstract":"The dynamics of fermions in spacetime generates torsion, ultimately leading to a current-current interaction independent of gravity. This torsional four-fermion interaction is generically chiral and non-universal and may have observable consequences. Furthermore, the fermion basis in which this torsional interaction is diagonal may be different from the mass basis and the flavor basis. We work out the structure of the quark sector, where new CKM-like matrices appear as a result of diagonalizing the torsional interaction. CP violation is modified in general due to the appearance of additional phases. We also consider various processes which are affected by it such as kaon decays in particular and show that even when the torsional interaction is taken to be diagonal in the flavor basis, flavor-changing processes are still affected due to the non-universality of the torsional coupling constants. Finally, we discuss rephasing invariants in the presence of the torsional interaction and show how the Jarlskog invariant is modified even when the torsion basis is aligned with the flavor basis."},{"arxiv":"2610.36065","id":"3219365","title":"Absence of linear power corrections in heavy-quark pair production in a non-Abelian gauge theory","authors":"Duarte Fontes, Dennis Horstmann, Kirill Melnikov, Davide Maria Tagliabue","score":3.3,"section":"new","rank":30,"parts":[0.0,0.06,0.1,0.0,0.0],"note":"Closest of your papers: [[2855387]] (coupling 0.02, 3 shared references). Closest network paper: [[2940264]] (coupling 0.04, 4 shared references).","abstract":"We study the infrared sensitivity of heavy-quark pair production by a color-neutral vector current in perturbation theory. We work in a spontaneously broken SU(2) gauge theory where, by tuning parameters to make the gauge-boson mass $m_g$ small, we use it as a probe of infrared physics. We find that, through next-to-next-to-leading order, terms linear in $m_g$ cancel in the differential cross section, provided that it is expressed through a short-distance heavy-quark mass. Interestingly, we establish this cancellation without evaluating any integrals explicitly, by relating virtual integrals to real-emission ones through loop-energy residues, with a suitable redefinition of the real-emission momenta. Our result is the first strong indication that the cancellation of non-perturbative linear power corrections in the corresponding QCD process extends to the non-Abelian sector. It is also a concrete non-Abelian example of the extension of the Kinoshita-Lee-Nauenberg theorem to linear infrared terms for sufficiently inclusive observables."},{"arxiv":"2610.37198","id":"3219541","title":"Searches for new particle physics by methods of classical and neutrino astronomy","authors":"Sergey Troitsky","score":3.1,"section":"new","rank":31,"parts":[0.0,0.04,0.13,0.0,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.01, 1 shared references). Closest network paper: [[2942451]] (coupling 0.04, 8 shared references).","abstract":"Selected astrophysical methods for testing particle-physics models are reviewed. Stellar structure and evolution constrain additional channels of energy loss and transport; high-energy photon propagation probes photon mixing with new particles and modifications of electron-positron pair production; large-volume neutrino telescopes are used to search for magnetic monopoles, neutrinos from superheavy dark-matter decay, and non-standard neutrino propagation. Recent applications of these methods are discussed, involving the tip of the red-giant branch in the color-luminosity diagram, gamma-ray burst 221009A, and data from the Baikal Gigaton Volume Detector (Baikal-GVD) and the IceCube experiment. In each case, particle-physics parameters are inferred through a forward model that accounts for the response to new physics, propagation, detection, and nuisance parameters."},{"arxiv":"2610.37398","id":"3219280","title":"An end-to-end framework for uncertainty-aware validation of generative models","authors":"Giada Badaracco, Sean Benevedes, Christina Reissel, Philip Harris, Gaia Grosso","score":2.5,"section":"new","rank":32,"parts":[0.0,0.0,0.17,0.0,0.0],"note":"Closest network paper: [[3187354]] (coupling 0.06, 3 shared references).","abstract":"Density estimation with generative models is a common task in the physical sciences, for example in background estimation in particle physics. Existing machine learning techniques, however, lack methods to quantify uncertainties that can be propagated into a statistical test. That limits the validation of generative models to standard goodness-of-fit tests, in which the generative model is treated as exact (point-null hypothesis). But a model fitted to a finite training set is never exact, so if its uncertainties are neglected, any sufficiently powerful goodness-of-fit test will eventually reject it once the test set is large enough to resolve this estimation error. We propose SIGMA, an end-to-end framework combining density estimation with principled uncertainty quantification. We use Gaussian mixture models, for which uncertainties are tractable, and further construct a new goodness-of-fit test in which these uncertainties are profiled as nuisance parameters to account for the statistical error of the fit, promoting the conventional point-null test to a composite one. A rejection then signals genuine mismodeling rather than a test set large enough to resolve the error of the fit, provided the propagated uncertainties faithfully cover that error. We demonstrate the framework on a controlled two-dimensional toy model and on a collider physics benchmark modeling the QCD background process. With uncertainties included, the same model can be trusted on test sets up to an order of magnitude larger than the standard test allows. Our work thus provides a statistically grounded basis for a robust use of generative models in the physical sciences."},{"arxiv":"2610.36073","id":"3219308","title":"Regression on high-dimensional phase space","authors":"Andrew J. Larkoski","score":2.3,"section":"new","rank":33,"parts":[0.0,0.02,0.11,0.0,0.0],"note":"Closest of your papers: [[1615477]] (coupling 0.01, 1 shared references). Closest network paper: [[2829800]] (coupling 0.04, 4 shared references).","abstract":"Machine learning tasks in particle physics are typically expressed in terms of regression, or relaxation toward some optimal solution as defined by an objective or loss function. In this paper, we introduce a large multiplicity expansion for analyzing regression tasks, which enables significant analytic understanding. For concreteness, we study regression with energy flow polynomials (EFPs), a complete linear basis of infrared and collinear safe observables on Lorentz invariant phase space. While the expectation value of any EFP scales like a constant in the large multiplicity limit, we prove that the covariance on uniform phase space of any two EFPs is highly suppressed and scales like the inverse of the squared multiplicity. This very unintuitive result relies on detailed cancellation guaranteed by the interplay of permutation invariance, momentum conservation, and rotational invariance. This scaling of the covariance with multiplicity further implies that the coefficients in an expansion of EFPs must scale quadratically in multiplicity. We present an example of regression with EFPs as applied to $e^+e^-\\to$ hadrons events, and show how the regression can be solved analytically through the complementary expansions of the large multiplicity limit and of familiar fixed-order perturbation theory of QCD."}],"refs":{"1518747":{"first":"Arcadi","year":2017,"nauth":8,"title":"The waning of the WIMP? A review of models, searches, and constraints","role":"other"},"1207270":{"first":"Aristizabal Sierra","year":2012,"nauth":3,"title":"LSP sneutrino decays into heavy standard model pairs","role":"seed"},"452755":{"first":"Diaz","year":1997,"nauth":4,"title":"Neutrino mass and missing momentum Higgs boson signals","role":"seed"},"2859009":{"first":"Arbeláez","year":2024,"nauth":5,"title":"Effective field theory and scalar triplet dark matter","role":"seed"},"2693756":{"first":"Kitabayashi","year":2023,"nauth":1,"title":"Constraining scotogenic dark matter and primordial black holes using induced gravitational waves","role":"other"},"1615477":{"first":"Flórez","year":2017,"nauth":5,"title":"Expanding the Reach of Heavy Neutrino Searches at the LHC","role":"seed"},"1318349":{"first":"Faroughy","year":2014,"nauth":3,"titl   svg.attr('viewBox',`0 0 ${W} ${H}`); svg.selectAll('*').remove();
  const yrs=d3.extent(N,n=>n.year);
  const x=d3.scaleLinear().domain([yrs[0]-.5,yrs[1]+1.2]).range([m.l+8,W-m.r-8]);
  const ticks=x.ticks(W<600?6:12).filter(t=>Number.isInteger(t)&&t<=yrs[1]);
  svg.append('g').attr('class','grid').selectAll('line').data(ticks).join('line').attr('x1',d=>x(d)).attr('x2',d=>x(d)).attr('y1',m.t).attr('y2',H-m.b);
  svg.append('g').attr('class','axis').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x).tickValues(ticks).tickFormat(d3.format('d')).tickSizeOuter(0));
  const cy=(m.t+H-m.b)/2, xf=n=>isNew(n)?x(yrs[1]+.75):x(n.year);
  const sim=N.map(n=>({n,x:xf(n)+(RNG()-.5)*4,y:cy+(RNG()-.5)*H*.5}));
  const links=E.map(e=>({source:sim[e.s],target:sim[e.t],s:e.s,t:e.t,k:e.k}));
  d3.forceSimulation(sim).force('x',d3.forceX(s=>xf(s.n)).strength(1)).force('y',d3.forceY(cy).strength(.04))
    .force('link',d3.forceLink(links).strength(.03)).force('charge',d3.forceManyBody().strength(-40))
    .force('col',d3.forceCollide(s=>r(s.n)+2)).stop().tick(320);
  sim.forEach(s=>{s.y=Math.max(m.t+8,Math.min(H-m.b-8,s.y));s.x=Math.max(m.l+4,Math.min(W-m.r-4,s.x))});
  G=svg.append('g');
  G.append('g').selectAll('path').data(links).join('path').attr('class',l=>'edge '+l.k)
    .attr('d',l=>{const a=l.source,b=l.target;return `M${a.x},${a.y}Q${(a.x+b.x)/2},${(a.y+b.y)/2-Math.abs(a.x-b.x)*.12} ${b.x},${b.y}`});
  G.append('g').selectAll('circle').data([...sim].sort((a,b)=>RANK[b.n.role]-RANK[a.n.role])).join('circle')
    .attr('class','node').attr('cx',s=>s.x).attr('cy',s=>s.y).attr('r',s=>r(s.n)).attr('fill',s=>col(s.n))
    .on('pointerenter',(ev,s)=>{hover=s.n;showTip(ev,s.n);paint()}).on('pointermove',(ev,s)=>showTip(ev,s.n))
    .on('pointerleave',()=>{hover=null;tip.hidden=true;paint()}).on('click',(ev,s)=>pick(s.n,false));
  const lab=sim.filter(s=>isNew(s.n)||s.n.role==='seed'||s.n.deg>=3);
  const L=lab.map(s=>{const right=s.x>W*.8,t=isNew(s.n)?`#${s.n.rank} ${s.n.first}`:`${s.n.first} ${s.n.year}`,w=t.length*6.2;return{s,t,right,x0:right?s.x-r(s.n)-4-w:s.x+r(s.n)+4,w,y:s.y+4}}).sort((a,b)=>a.y-b.y);
  const placed=[];L.forEach(l=>{let k=0;while(k<40&&placed.some(p=>l.x0<p.x0+p.w&&p.x0<l.x0+l.w&&Math.abs(l.y-p.y)<13)){l.y+=13*(k%2?-1:1)*(1+Math.floor(k/2));k++;l.y=Math.max(m.t+10,Math.min(H-m.b-4,l.y))}placed.push(l)});
  G.append('g').selectAll('text').data(L).join('text').attr('class','nlabel').attr('x',l=>l.right?l.s.x-r(l.s.n)-4:l.s.x+r(l.s.n)+4).attr('y',l=>l.y)
    .attr('text-anchor',l=>l.right?'end':'start').text(l=>l.t);
  paint();
}
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  const nmin=M.nextMin;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}${nmin!=null?`: every paper scoring ${nmin} or more, and at least ${M.nextCount} when available`:''}; not drawn in the network`;
  const cut=nmin!=null?X.findIndex(n=>n.score<nmin):-1;
  box.innerHTML=X.map((n,i)=>(i===cut?`<li class="divider">Below ${nmin}: weaker relation (most of these share no specific reference, coupling or topic with your work)</li>`:'')+`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
list();nextList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
