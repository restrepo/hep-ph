<script>
const RAW = {"n":[{"id":"3161765","arxiv":"2605.27519","title":"Probing the dynamical inverse seesaw mechanism with low-frequency gravitational waves","first":"Borah","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[2860403]], [[2828434]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1249404]] (coupling 0.03, 9 shared references). Closest network paper: [[3190827]] (coupling 0.23, 36 shared references).","score":41.7,"rank":1,"section":"replacement","parts":[0.72,0.09,0.66,0.0],"abstract":"We study the possibility of probing the dynamical inverse seesaw mechanism for the origin of light neutrino masses via the detection of stochastic gravitational waves (GW) in the low-frequency regime currently being probed by pulsar timing arrays. As the lepton number-violating term in inverse seesaw typically remains in the sub-MeV ballpark, its dynamical origin naturally brings the possibility of a low-scale first-order phase transition, which can be probed at low-frequency GW experiments. We also find interesting complementarity with heavy neutral lepton searches, as GW experiments remain sensitive to parameter space with small active-sterile mixing, which is out of reach for most particle physics experiments.","authors":"Debasish Borah, Sounak Dutta, Partha Kumar Paul, Indrajit Saha, Narendra Sahu","nlinked":132,"nref":132,"src":"INSPIRE","html":true},{"id":"3219359","arxiv":"2610.36060","title":"Hybrid seesaw from $SU(2)_1 \\times SU(2)_2 \\times U(1)_Y$","first":"Herrero-Brocal","nauth":3,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Vicente. Cites 1 network paper: [[2931725]]. Closest of your papers: [[452755]] (coupling 0.07, 3 shared references). Closest network paper: [[2931725]] (coupling 0.23, 23 shared references).","score":40.6,"rank":2,"section":"new","parts":[0.45,0.22,0.66,0.5],"abstract":"We study neutrino mass generation in a model based on the $SU(3)_c \\times SU(2)_1 \\times SU(2)_2 \\times U(1)_Y$ gauge symmetry, in which the Standard Model $SU(2)_L$ arises at low energies as the diagonal subgroup of the two $SU(2)$ factors. The symmetry is enlarged with a global $U(1)_{B-L}$ symmetry, spontaneously broken by the vacuum expectation value of a scalar bidoublet. Light neutrino masses are generated at tree level through a hybrid of the type-III, inverse and linear seesaw mechanisms. A distinctive feature of the construction is the existence of a Nambu-Goldstone boson, the majoron, which transforms non-trivially under the original gauge symmetry while being mostly singlet under the Standard Model gauge group. We explore the phenomenological consequences of this setup, including electroweak precision constraints, the production of the nearly degenerate $W'$ and $Z'$ bosons at colliders and lepton flavor violating decays with a majoron in the final state. The latter constitute the most promising signature of the model.","authors":"Antonio Herrero-Brocal, Javier Perez-Soler, Avelino Vicente","nlinked":58,"nref":62,"src":"INSPIRE","html":true},{"id":"3178731","arxiv":"2607.07794","title":"Universal seesaw mechanism for fermion masses and strong CP problem","first":"Perez","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1993049]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.09, 8 shared references). Closest network paper: [[1993049]] (coupling 0.08, 6 shared references).","score":31.9,"rank":3,"section":"replacement","parts":[0.48,0.25,0.24,0.0],"abstract":"We propose a framework for fermion mass generation based on a universal seesaw. The Standard Model is extended by an Abelian gauge symmetry acting on right-handed fermions, together with vector-like fermions and scalar fields. The ordinary Yukawa couplings are forbidden, except for the top-quark coupling to the Higgs, which is allowed at the renormalizable level and remains unsuppressed. The charged-fermion hierarchies then arise from mixing with the vector-like sector, and light neutrino masses emerge from a neutral sector Majorana seesaw. CP is exact in the ultraviolet and broken spontaneously by scalar vacuum expectation values. The resulting CP-violating phase is transmitted to the quark sector and generates the CKM phase, while a Nelson-Barr structure, realized through the universal seesaw block form, keeps the physical QCD vacuum angle zero at tree level. Consistency with EDM bounds beyond tree level requires moderately suppressed Yukawa couplings between SM doublets to the vector-like sector. If the leading higher-dimensional operators are unsuppressed, the same requirement can favor a low breaking scale for the new Abelian symmetry. In this regime the vector-like fermions can lie at the TeV scale, with suppressed mixing with the electroweak sector. This framework provides a simple setting in which the hierarchies of charged-fermion masses, neutrino masses, and CP-violating parameters can be accounted for within a common extension of the Standard Model.","authors":"Pavel Fileviez Perez, Clara Murgui","nlinked":38,"nref":40,"src":"INSPIRE","html":true},{"id":"3219442","arxiv":"2610.36780","title":"Probing Charged Higgs Bosons through $H^\\pm \\to W^\\pm A$ Decay in the Type-I Two-Higgs Doublet Model","first":"Arhrib","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1473845]]. Also cites widely used network papers: [[902365]]. Closest of your papers: [[1627633]] (coupling 0.04, 6 shared references). Closest network paper: [[1473845]] (coupling 0.19, 36 shared references).","score":31.6,"rank":4,"section":"new","parts":[0.48,0.12,0.53,0.0],"abstract":"A light pseudoscalar lighter than the 125 GeV Higgs boson remains allowed within the type-I Two-Higgs Doublet Model (2HDM), consistent with current collider constraints, including Higgs signal strength measurements and direct searches for additional Higgs bosons. At the Large Hadron Collider (LHC), the light pseudoscalar $A$ can be pair-produced through the undetected decay of the Standard Model-like Higgs boson, $h_{125} \\to AA$, when this channel is kinematically accessible (i.e., $m_A < m_{h_{125}}/2$). For the charged scalar $H^\\pm$, once open, the bosonic decay channel $H^\\pm \\to W^{\\pm(*)} A$ naturally dominates over the fermionic $H^\\pm \\to τ^\\pmν$ and $H^\\pm \\to tb$ channels, while relaxing the existing $H^\\pm$ limits. As a result, we propose searching for the charged Higgs boson through $H^\\pm \\to W^{\\pm(*)} A$ in the $4b+2j+\\ellν$ final state. This channel is particularly sensitive to moderate-to-large $\\tanβ$ values and provides an excellent complementary probe to searches based on fermionic $H^\\pm$ decays at the LHC. Our collider analysis demonstrates that this channel can probe a substantial region of the type-I 2HDM parameter space at the high-luminosity LHC.","authors":"Abdesslam Arhrib, Mohamed Krab, Tanmoy Mondal, Prasenjit Sanyal","nlinked":96,"nref":104,"src":"INSPIRE","html":true},{"id":"3219367","arxiv":"2610.36163","title":"A GOOFy Three Higgs Doublet Model","first":"Varzielas","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1846048]]. Also cites widely used network papers: [[902365]], [[2817040]]. Closest of your papers: [[1116165]] (coupling 0.03, 2 shared references). Closest network paper: [[2932612]] (coupling 0.11, 28 shared references).","score":28.3,"rank":5,"section":"new","parts":[0.51,0.09,0.32,0.0],"abstract":"Recent developments in two-Higgs doublet models identified regions of parameter space which are renormalization-group invariant to all orders of perturbation theory but cannot be described by any of the known symmetries of those models. These were dubbed GOOFy symmetries, as they involve scalar doublets and their complex conjugates transforming independently, and imaginary scaling of spacetime coordinates is needed to ensure invariance of kinetic terms. We build a three-Higgs doublet model with a GOOFy symmetry including extensions to the fermion sector. We prove renormalization group invariance through a direct calculation of the model's beta functions and analyse the corresponding phenomenology. The model is shown to be compatible with current LHC observations, displaying interesting features which may be probed in the near future.","authors":"I. de Medeiros Varzielas, P.M. Ferreira, S. Oliveira","nlinked":81,"nref":88,"src":"INSPIRE","html":true},{"id":"3219477","arxiv":"2610.37106","title":"Probing new $C\\!P$-violating sources in $Λ_b\\toΛ_c\\ell^-\\barν_\\ell$","first":"Li","nauth":6,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2785325]]. Closest of your papers: [[1671831]] (coupling 0.03, 3 shared references). Closest network paper: [[2785325]] (coupling 0.18, 26 shared references).","score":28.3,"rank":6,"section":"new","parts":[0.45,0.07,0.53,0.0],"abstract":"While baryonic $C\\!P$ violation has been observed, its potential to reveal new physics beyond the sensitivity of mesonic decays remains an open question. We investigate this potential within semileptonic $b\\to c\\ell\\barν_\\ell$ transitions by comparing the angular distributions of $Λ_b\\toΛ_c(\\toΛπ)\\ell^-\\barν_\\ell$ and $\\bar B\\to D^*(\\to Dπ)\\ell^-\\barν_\\ell$ utilizing lattice-QCD form factors. We perform a global fit to $R(D^{(*)})$ alongside auxiliary $C\\!P$-even measurements to delineate the phenomenologically viable parameter space for new-physics Wilson coefficients. Leveraging these allowed ranges and the lattice inputs, we evaluate the complementary sensitivity of both angular distributions to novel weak phases. We demonstrate that the baryonic decay mode probes combinations of Wilson coefficients that remain inaccessible in mesonic angular distributions, thereby providing critical supplementary information for identifying new physics.","authors":"Dong-Hao Li, Meng-Chao Gao, Qin Qin, Meng-Han Wu, Fu-Sheng Yu, Xing-Bo Yuan","nlinked":78,"nref":82,"src":"INSPIRE","html":true},{"id":"3219528","arxiv":"2610.37318","title":"High significance measurement of reactor coherent elastic neutrino-nucleus scattering on germanium by CONUS+","first":"Ackermann","nauth":19,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2513697]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1708009]] (coupling 0.02, 1 shared references). Closest network paper: [[2890702]] (coupling 0.11, 20 shared references).","score":26.3,"rank":7,"section":"cross","parts":[0.48,0.06,0.32,0.0],"abstract":"We report the most precise measurement to date of coherent elastic neutrino-nucleus scattering (CE$ν$NS) from reactor antineutrinos using the CONUS+ high-purity germanium detectors at the Leibstadt nuclear power plant. With an exposure of 1296 kg$\\cdot$days reactor-on, a blind likelihood analysis yields $1555 \\pm 152$ CE$ν$NS events, with a significance of 10.2 $σ$, in agreement with the Standard Model expectation of $1701 \\pm 198$ events within 0.6 standard deviations. The result also determines the weak mixing angle at a momentum transfer of about 10 MeV, $\\sin^2θ_W = 0.225 \\pm 0.022$, consistent with the Standard Model prediction.","authors":"N. Ackermann, H. Bonet, C. Buck, J. Hakenmüller, G. Heusser, M. Lindner, W. Maneschg, M. Meier, S. Mertens, D. Piani, M. Rank, T. Rink, E. Sánchez García, Y. Shi, L. Schönfeld, I. Stalder, H. Strecker, J. Wendel, J. Woenckhaus","nlinked":43,"nref":47,"src":"INSPIRE","html":true},{"id":"3219358","arxiv":"2610.36107","title":"Projected sensitivity to the ADD large extra dimensions model in the monojet plus missing transverse momentum final state at HL-LHC, HE-LHC, and FCC-hh","first":"Guler","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1710078]]. Closest of your papers: [[1627633]] (coupling 0.04, 2 shared references). Closest network paper: [[3139191]] (coupling 0.07, 4 shared references).","score":25.5,"rank":8,"section":"new","parts":[0.45,0.12,0.21,0.0],"abstract":"We present a unified projection of the sensitivity to the Arkani-Hamed-Dimopoulos-Dvali (ADD) model of large extra dimensions in the monojet plus missing transverse momentum final state at the HL-LHC ($\\sqrt{s}=14$ TeV, 3 ab$^{-1}$), the HE-LHC (27 TeV, 15 ab$^{-1}$) and the FCC-hh (100 TeV, 30 ab$^{-1}$), for $n=2,3,4,6$ extra dimensions, with one selection, significance estimator and calibration throughout. Signal samples are generated with Pythia 8 and combined with the post-fit Standard-Model background yields released by ATLAS and CMS on HEPData; the expected significance combines the thirteen exclusive $E_{\\mathrm{T}}^{\\mathrm{miss}}$ bins of the ATLAS signal region, matching the binning of the published likelihood fit. Two elements are new. First, the energy scaling of the background to higher $\\sqrt{s}$, including the $13\\to14$ TeV step, is measured as a function of $E_{\\mathrm{T}}^{\\mathrm{miss}}$ from dedicated $Z(ν\\barν)$+jets and $W(\\ellν)$+jets samples rather than assumed constant; this reduces the projected FCC-hh reach by 39% relative to a constant-factor treatment. Second, the framework is anchored to the published ATLAS Run-2 expected 95% CL limits through a transparent $n$-dependent calibration, determined directly for all five values of $n$ and found consistent with unity ($1.001\\pm1.4\\%$), so that it acts as a consistency check rather than a sizeable correction; the selection response is validated against the published ATLAS cutflow. The projected 95% CL exclusion reach in $M_D$ for $n=2$ is 12.5, 15.2 and 22.0 TeV at the three colliders, with $5σ$ discovery reach of 9.8, 12.0 and 17.0 TeV, extending the ATLAS Run-2 bound of $M_D>11.2$ TeV by factors of 1.1-2.0. The calibration scheme provides a template for analogous future-collider studies; the projections hold within the stated Run-2-anchored detector and uncertainty assumptions.","authors":"Emine Gurpinar Guler","nlinked":30,"nref":35,"src":"INSPIRE","html":true},{"id":"3219454","arxiv":"2610.36902","title":"Nucleon decays into three leptons plus a kaon","first":"Liang","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1318349]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1222142]] (coupling 0.02, 1 shared references). Closest network paper: [[2053590]] (coupling 0.08, 13 shared references).","score":24.7,"rank":9,"section":"new","parts":[0.48,0.05,0.24,0.0],"abstract":"We systematically investigate baryon-number-violating (BNV) nucleon decays into three leptons and a kaon within the framework of low-energy effective field theory (LEFT). We identify all kinematically allowed four-body decay modes involving a $K^+$ or $K^0$ meson and derive their decay widths induced by local dimension-9 operators in terms of the LEFT Wilson coefficients. These results are obtained by classifying the relevant operators, which contain three lepton and three quark fields, including one strange quark, according to their transformation properties under the chiral symmetry group, matching them onto chiral perturbation theory. By reanalyzing existing experimental data, we establish stringent bounds on the partial lifetimes of these four-body decay modes and derive corresponding constraints on the dimension-9 Wilson coefficients. Our results provide a convenient EFT framework for connecting the underlying BNV interactions to experimental searches for these exotic nucleon decays.","authors":"Jin-Han Liang, Xiao-Dong Ma, Xiang Zhao","nlinked":42,"nref":44,"src":"INSPIRE","html":false},{"id":"3219569","arxiv":"2610.37541","title":"On-shell Mass Renormalisation and RG-improved Effective Potential in Vector-like Lepton Models","first":"Daberstiel","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1993049]]. Closest of your papers: [[1397629]] (coupling 0.01, 1 shared references). Closest network paper: [[2664140]] (coupling 0.10, 18 shared references).","score":23.3,"rank":10,"section":"new","parts":[0.45,0.03,0.28,0.0],"abstract":"We discuss the on-shell mass renormalisation in a class of six vector-like lepton (VLL) extensions of the Standard Model with seesaw-like contributions to the SM lepton masses. The schemes absorb large radiative corrections to the SM lepton masses arising from mixing between the SM and VLLs with up to $5\\times5$ mixing matrices and allows for efficient computation of observables and the low-scale $\\overline{\\text{MS}}$ values of model parameters. We determine and solve the redundancy-free 2-loop renormalisation-group (RG) equations, compute the RG-improved effective potential and study the vacuum instability scales of each of the VLL models. We find rich phase behaviour and parameter regions that show instability scales as low as $10^5$ GeV as well as regions where the one-loop corrections to the input parameters can lead to a stable vacuum.","authors":"Gregor Daberstiel, Kilian Möhling, Dominik Stöckinger, Hyejung Stöckinger-Kim","nlinked":76,"nref":76,"src":"INSPIRE","html":true},{"id":"2964321","arxiv":"2508.19358","title":"Axions and Axion-like particles: collider searches","first":"Biekötter","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1843058]]. Closest of your papers: [[2855387]] (coupling 0.01, 3 shared references). Closest network paper: [[2817238]] (coupling 0.07, 14 shared references).","score":22.8,"rank":11,"section":"replacement","parts":[0.45,0.04,0.21,0.0],"abstract":"We give an overview of collider searches for Axion-like particles (ALPs). The intention of this review is to give a pedagogical introduction to collider phenomenology of ALPs, and provide a starting point for newcomers, including suitable references to deepen their knowledge. We motivate how ALPs arise from the breaking of approximate global symmetries and describe their interactions across different scales in an effective field theory framework. We further review the dominant production and decay channels for ALPs at high-energy hadron and lepton colliders as well as indirect ways to probe their interactions via precision measurements of Standard Model processes.","authors":"Anke Biekötter, Ken Mimasu","nlinked":165,"nref":175,"src":"INSPIRE","html":false},{"id":"3215611","arxiv":"2610.21886","title":"Low-Scale See-Saw Mechanism and the Majorana Nature of Heavy Neutrinos","first":"Okawa","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1249404]] (coupling 0.05, 7 shared references). Closest network paper: [[3105005]] (coupling 0.13, 13 shared references).","score":13.7,"rank":12,"section":"replacement","parts":[0.06,0.16,0.38,0.0],"abstract":"We investigate the possibility to determine the Majorana nature of the heavy Majorana neutrinos present in the low-scale type I seesaw mechanism of neutrino mass generation in experiments at $e^+ \\text{-} e^-$ and $μ^+ \\text{-} μ^-$ colliders. This is done on the examples of two specific symmetry-protected seesaw scenarios with two right-handed (RH) singlet neutrinos and one seesaw realization with three RH neutrinos. We use the forward-backward symmetry in the angular distribution of the heavy neutral leptons produced in the $e^+ \\text{-} e^-$ and $μ^+ \\text{-} μ^-$ collisions as an indicator of their Majorana nature. Our results indicate that the experiments at FCCee during its first phase of operation have a remarkable potential not only to discover the heavy neutral leptons associated with the type I seesaw mechanism if they have masses smaller than the $Z^0$-boson mass, but also to probe and provide evidence for their Majorana nature.","authors":"Takuya Okawa, S.T. Petcov","nlinked":56,"nref":58,"src":"INSPIRE","html":true},{"id":"3219369","arxiv":"2610.36161","title":"Asymmetric Reheating of a Dark Sector","first":"Cosme","nauth":3,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1679809]] (coupling 0.08, 3 shared references). Closest network paper: [[3070028]] (coupling 0.09, 10 shared references).","score":13.3,"rank":13,"section":"new","parts":[0.06,0.2,0.26,0.0],"abstract":"We study asymmetric post-inflationary reheating in a framework with two sequestered MSSM-like sectors (the ``visible'' and ``dark'' sectors) with different supersymmetry-breaking scales, with dark matter corresponding to the lightest dark baryons. In this setup, independent Affleck-Dine dynamics in the two sectors offers a natural explanation for the comparable abundances of visible and dark matter. We relate the resulting temperature hierarchy to the inflaton's partial decay widths in different kinematical regimes, where it may decay into dark sector particles via 2-, 3- or 4-body processes. The latter case yields the most asymmetric reheating scenario, and we discuss the implications of this regime for the dark sector's thermal history, namely regarding the corresponding strong and weak interactions. While in this kinematical regime the contribution of light dark sector degrees of freedom to $ΔN_{\\rm eff}$ is negligible, we show that it increases significantly in the regime where 3-body decays are possible, particularly near the threshold for dark Higgs pair-production where $ΔN_{\\rm eff}^{\\max} \\simeq 0.078$. The current combined BBN+CMB+BAO bound leaves only a narrow allowed interval of the 2-body decay regime immediately above threshold, while next-generation CMB experiments could probe slightly below it.","authors":"Catarina Cosme, João G. Rosa, Inês Sequeira","nlinked":69,"nref":69,"src":"INSPIRE","html":true},{"id":"3219311","arxiv":"2610.36003","title":"Elastic Scattering of Dirac Dark Matter with Charged Leptons through a Scalar Mediator: Analytical Framework, Numerical Stability, and Direct-Detection Bounds","first":"Xuan","nauth":2,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[1518747]], [[2817040]]. Closest of your papers: [[2859009]] (coupling 0.05, 5 shared references). Closest network paper: [[2942451]] (coupling 0.07, 5 shared references).","score":13.2,"rank":14,"section":"new","parts":[0.11,0.16,0.21,0.0],"abstract":"We investigate a leptophilic simplified dark matter model in which a Dirac fermion χinteracts with Standard Model charged leptons ≪ through a real scalar mediator S. Starting from the low-energy Yukawa interaction Lagrangian in the fermion mass eigenbasis, we derive closed-form tree-level analytical expressions for the invariant scattering amplitude, the spin-averaged squared matrix element, and the differential and total elastic cross sections. To overcome the numerical loss of significance that arises when evaluating the standard antiderivative difference in the heavy-mediator regime, we rearrange the phase-space integral into positive-definite recoil contributions supplemented by convergent power-series expansions. This analytical formulation smoothly connects the light-mediator and heavy-mediator regimes without relying on Effective Field Theory (EFT) contact approximations, allowing us to establish quantitative validity criteria for the contact limit. Finally, we map the microscopic differential cross section onto the reference electron-scattering cross section and evaluate the resulting coupling constraints using experimental data from SENSEI, DAMIC, SuperCDMS, XENON10, and XENON1T.","authors":"Nguyen Nhu Xuan, Vu Toan Thang","nlinked":25,"nref":28,"src":"INSPIRE","html":true},{"id":"3219319","arxiv":"2610.36004","title":"Relativistic Elastic Scattering of Cosmic-Ray Boosted Dirac Dark Matter with Charged Leptons through a Scalar Mediator","first":"Xuan","nauth":2,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[1518747]], [[2817040]]. Closest of your papers: [[2859009]] (coupling 0.04, 5 shared references). Closest network paper: [[2942451]] (coupling 0.07, 6 shared references).","score":12.2,"rank":15,"section":"new","parts":[0.11,0.13,0.21,0.0],"abstract":"We investigate the relativistic kinematics, spinor-recoil structure, and direct-detection phenomenology of a Dirac dark matter fermion interacting with SM charged leptons through a real scalar mediator within a low-energy effective Lagrangian in the fermion mass basis. Standard halo direct-detection searches lose sensitivity for sub-MeV dark matter, because the maximum recoil energy falls below detector thresholds. When halo dark matter particles are upscattered to relativistic energies by galactic cosmic-ray electrons (CRE), the momentum transfer in both the astrophysical upscattering stage and the terrestrial detection stage can exceed the fermion mass scales. By decomposing the tree-level $t$-channel cross section into three positive-definite contributions, we separate the static-numerator contribution from the linear and quadratic momentum-transfer spinor-recoil contributions, evaluated via convergent power series that reduce subtractive cancellation at small momentum transfer. For incident large kinetic energies, the spinor-recoil contributions become comparable to and begin to exceed $σ_0$; at substantially higher energies, they enhance the total cross section by several orders of magnitude relative to the static-numerator approximation. Furthermore, retaining the dynamical scalar propagator yields a high-energy cross section that decreases as $1/s$ and satisfies $s$-wave helicity partial-wave unitarity, in contrast to the linear $\\mathcal{O}(s/m_S^4)$ growth of the contact approximation. Applying the exact differential recoil spectra within an effective propagation model for cosmic-ray electron boosted dark matter (CRE-BDM), we derive $90\\%$ C.L. exclusion bounds in the 1 keV -- 10 MeV mass range from Super-Kamiokande, XENONnT, and PandaX-4T, extending experimental sensitivity into the sub-MeV window.","authors":"Nguyen Nhu Xuan, Vu Toan Thang","nlinked":30,"nref":33,"src":"INSPIRE","html":true},{"id":"3218194","arxiv":"2610.31666","title":"Boosted Dark Matter Directionality in Large Liquid Scintillator Detectors","first":"Tse","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Co-authors of yours: Choi. Closest of your papers: [[2859009]] (coupling 0.04, 4 shared references). Closest network paper: [[3083722]] (coupling 0.06, 11 shared references).","score":11.5,"rank":16,"section":"replacement","parts":[0.0,0.11,0.17,0.5],"abstract":"Light dark matter can be boosted by cosmic-ray-dark matter interactions, which opens the possibility of direct-detection searches with large neutrino detectors. We consider the signal produced by boosted dark matter undergoing quasi-elastic scattering off carbon and knocking out a neutron in a large liquid scintillator detector. A distinctive delayed gamma ray from neutron capture can be reconstructed after $\\sim 210$$μ$s, which is paired up with the prompt signal during neutron propagation. We find that 100 kt$\\cdot$yr of data from the neutron-coincidence channel will be able to probe new parameter space compared to free proton signals found in previous work. We further consider the possibility of utilizing directional information from the displaced vertex associated with the capture of the final-state neutron. However, we find that directional information does not materially improve the sensitivity due to the large nucleon scattering angle.","authors":"Samuel S.H. Tse, Qishan Liu, Kenny C.Y. Ng, Koun Choi, Yu-Feng Li","nlinked":80,"nref":91,"src":"INSPIRE","html":true},{"id":"3219469","arxiv":"2610.37039","title":"Constraining New Physics by Studying Single Top Quark Production","first":"Roknabadi","nauth":3,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[902365]], [[2817040]]. Closest of your papers: [[1116165]] (coupling 0.04, 1 shared references). Closest network paper: [[3190962]] (coupling 0.05, 3 shared references).","score":11.0,"rank":17,"section":"new","parts":[0.11,0.12,0.14,0.0],"abstract":"This study introduces a beyond the Standard Model framework by adding a charged scalar particle, H_c, analogous to the charged Higgs in the Two-Higgs-Doublet Model (2HDM), but analyzed without the restrictive constraints typically applied in 2HDM scenarios. To assess the impact of H_c on single top quark production, two approaches are taken. First, variations in the production cross-section via the s- and t-channels are examined under different values of the model parameters, compared to the SM predictions. Second, spin correlations are analyzed, focusing on differences in the spin of the mediated particle between the new model and SM in the single top quark production via the s-channel. Within the framework of the simplified phenomenological model considered here, a significant fraction of the parameter space can be constrained by combining the two approaches.","authors":"Maryam Roknabadi, Saeid Paktinat Mehdiabadi, Seyed Mohammad Reza Tabatabaei","nlinked":21,"nref":25,"src":"INSPIRE","html":true},{"id":"1846048","arxiv":"2102.05658","title":"Controlled fermion mixing and FCNCs in a $\\Delta(27)$ 3+1 Higgs Doublet Model","first":"Cárcamo Hernández","nauth":4,"year":2021,"cites":15,"role":"other","note":"","score":null},{"id":"2513697","arxiv":"2211.11905","title":"Physics implications of a combined analysis of COHERENT CsI and LAr data","first":"De Romeri","nauth":6,"year":2022,"cites":114,"role":"other","note":"","score":null},{"id":"2775441","arxiv":"2404.05704","title":"Novel collider signatures in the type-I 2HDM+a model","first":"Argyropoulos","nauth":3,"year":2024,"cites":11,"role":"other","note":"","score":null},{"id":"2969254","arxiv":"2509.10456","title":"Gravitational Wave Signature and the Nature of Neutrino Masses: Majorana, Dirac, or Pseudo-Dirac?","first":"Jana","nauth":3,"year":2025,"cites":11,"role":"other","note":"","score":nul ,63,"k"],[0,64,"c"],[46,61,"c"],[11,21,"c"],[11,65,"k"],[3,66,"k"],[5,67,"c"],[8,68,"k"],[57,33,"c"],[3,69,"c"],[65,23,"c"],[54,66,"c"],[35,21,"c"],[14,70,"k"],[28,66,"c"],[1,71,"k"],[2,72,"k"],[42,26,"c"],[10,73,"c"],[78,21,"c"],[12,21,"c"],[4,23,"c"],[13,70,"k"],[13,74,"k"],[55,61,"c"],[88,34,"c"],[0,75,"k"],[12,76,"k"],[19,47,"c"],[0,77,"k"],[44,26,"c"],[72,84,"c"],[28,73,"c"],[10,78,"k"],[30,23,"c"],[63,60,"c"],[79,21,"c"],[70,21,"c"],[11,79,"k"],[0,80,"c"],[12,81,"k"],[31,65,"c"],[50,65,"c"],[85,23,"c"],[7,82,"k"],[13,27,"k"],[0,21,"c"],[82,37,"c"],[75,21,"c"],[1,83,"k"],[77,59,"c"],[16,21,"c"],[2,84,"k"],[16,23,"c"],[16,85,"k"],[1,86,"c"],[80,37,"c"],[82,21,"c"],[86,21,"c"],[51,74,"c"],[16,87,"k"],[4,21,"c"],[75,77,"c"],[14,35,"k"],[82,53,"c"],[62,83,"c"],[6,88,"k"],[80,21,"c"],[29,34,"c"],[74,81,"c"]],"next":[{"arxiv":"2410.08195","id":"2839003","title":"Unusual portals to new exotics, the $W$-gluon portal","authors":"Linda M. Carpenter, Katherine Schwind","score":9.9,"section":"replacement","rank":18,"parts":[0.0,0.2,0.2,0.0],"note":"Closest of your papers: [[1663960]] (coupling 0.08, 2 shared references). Closest network paper: [[2630211]] (coupling 0.07, 5 shared references).","abstract":"We explore models where new light exotic (LEX) states interact with the Standard Model (SM) through the $W$-gluon portal, an asymmetric di-boson portal. The complete set of effective operators up to dimension six which couple a single LEX state to at least one $W$ boson and one gluon is considered. Other Standard Model particles may also be present in the interactions. We show that the $W$-gluon portal allows us to access a large array of exotic states in non-trivial representations of SU(3)$_\\text{c}$ and SU(2)$_\\text{L}$. New single production collider modes and phenomenological signatures for these light exotic states at the LHC and $ep$ colliders are discussed."},{"arxiv":"2508.12392","id":"2961741","title":"Stringy Constraints on Modular Flavor Models","authors":"Keiya Ishiguro, Takafumi Kai, Tatsuo Kobayashi, Hajime Otsuka","score":9.7,"section":"replacement","rank":19,"parts":[0.0,0.02,0.6,0.0],"note":"Closest of your papers: [[1249404]] (coupling 0.01, 1 shared references). Closest network paper: [[1973492]] (coupling 0.21, 26 shared references).","abstract":"We investigate stringy constraints on moduli spaces in modular flavor models by analyzing moduli-dependent threshold corrections in heterotic string vacua. While moduli play a crucial role in determining the flavor structure of fermions predicted by modular flavor models, the parameter space in which their vacuum expectation values are allowed has not been fully explored. In this work, within the framework of perturbative heterotic string theory on toroidal orbifolds, we derive constraints on the moduli space and study their systematic behavior. We characterize the stringy constraints in terms of the dilaton, the beta-function coefficients, and the ratio between a complex-structure modulus and a Kähler modulus. It is found that the large value of the modulus controlling the flavor structure, i.e., $τ\\simeq i \\infty$, is inconsistent within perturbative string theory, and the self-dual point $τ=i$ is also disfavored in the large volume regime of toroidal backgrounds. In addition, we discuss the phenomenological implications of these stringy constraints."},{"arxiv":"2610.37308","id":"3219544","title":"Nonradial oscillation modes of axion condensed neutron stars in the Cowling approximation","authors":"Antonio Gómez-Bañón, Pantelis Pnigouras, José A. Pons","score":8.7,"section":"new","rank":20,"parts":[0.0,0.14,0.26,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.05, 3 shared references). Closest network paper: [[1955022]] (coupling 0.09, 8 shared references).","abstract":"In light QCD axion models, finite-density corrections to the axion potential can source a nonvanishing axion field inside neutron stars. Extending our previous analysis of radial oscillations, we study the nonradial ($l=2$) oscillation spectrum of such axion condensed neutron stars in the relativistic Cowling approximation, keeping the fluid and axion perturbations fully coupled and dynamical. The condensate modifies the fluid spectrum in two ways: the altered equilibrium structure raises the $f$- and $p$-mode frequencies by up to $\\sim20\\%$, while the dynamical coupling to the axion field partially compensates this shift, almost entirely for the $f$-mode. Fluid modes with frequencies above the axion mass acquire a new damping channel through axion emission. The $f$-mode remains below this threshold for all configurations supporting a condensate, whereas the $p$-modes are damped on timescales that can be as short as $\\sim10$ ms, shorter than their gravitational-wave damping times, except for certain axion masses where the outgoing axion amplitude nearly vanishes. The spectrum also contains a family of strongly damped axion-dominated quasinormal modes, with imaginary parts of order kHz, and a sequence of gravitationally bound axion states analogous to gravitational atom levels. Below the propagation threshold, the bound $p$-modes undergo avoided crossings with these levels, exchanging their fluid- and axion-dominated character."},{"arxiv":"2609.11747","id":"3202484","title":"Precise bubble wall velocity in a specific phase transition pattern in the CxSM and beyond","authors":"Shihang Tang, Fa Peng Huang, Chikako Idegawa","score":8.2,"section":"replacement","rank":21,"parts":[0.0,0.08,0.36,0.0],"note":"Closest of your papers: [[2080612]] (coupling 0.03, 2 shared references). Closest network paper: [[3157653]] (coupling 0.13, 22 shared references).","abstract":"The bubble wall velocity is a key quantity in cosmological first-order phase transitions, with important implications for electroweak baryogenesis, gravitational wave signals, the dark matter relic density and primordial black holes formed during the phase transition. However, it is often treated as a free input in phenomenological studies, while a self-consistent determination remains challenging. In this work, taking the complex singlet extension of the Standard Model as an example, we investigate the bubble wall dynamics and velocity in a specific electroweak phase transition pattern where both the Higgs field and the coupled singlet scalar experience friction. The microscopic friction arising from particle interactions with the plasma is evaluated using Boltzmann transport equations, while the macroscopic plasma response is described through hydrodynamic analysis. By applying the steady state force balance condition, we numerically determine the bubble wall velocity for different model parameters. We show that the wall velocity is governed by the competition between the driving force from the effective potential and plasma friction, and that its variation can significantly affect the baryon asymmetry. Our study provides a quantitative investigation of bubble wall dynamics in this overlooked phase transition pattern and its implications for early Universe phenomenology."},{"arxiv":"2610.36906","id":"3219473","title":"Phenomenology of strangeness-changing two-body currents in antineutrino scattering","authors":"Jarosalw A. Nowak","score":7.3,"section":"cross","rank":22,"parts":[0.06,0.03,0.26,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1854224]] (coupling 0.01, 1 shared references). Closest network paper: [[2102705]] (coupling 0.09, 15 shared references).","abstract":"Antineutrinos produce hyperons without kaons through Cabibbo-suppressed quasi-elastic scattering on a single nucleon. A two-body current acting on a correlated nucleon pair, nubar [NN] -> l+ Y N', gives the same hyperons plus a second nucleon. A companion paper constructs this current without fixing its size. StrangeMC, the only generator with the channel, set it to a flat 15% of the quasi-elastic hyperon cross section. We determine the ratio f = sigma_2p2h/sigma_QE of the two-body to the quasi-elastic hyperon cross section on carbon versus antineutrino energy, and the detector signatures of two-body events. The strange two-body current and its non-strange counterpart are computed on the same nucleon pair. Their ratio is converted into f with the Valencia non-strange 2p2h and quasi-elastic cross sections for carbon, assuming that nuclear effects missing from the pair are common to both. Under this assumption f rises from 0.14 at 0.6 GeV to 0.20-0.22 at 2-5 GeV. Averaged over the Booster antineutrino spectra it is 0.15-0.17, close to the 15% placeholder, which StrangeMC now replaces with f(E). The largest evaluated uncertainty comes from separating the two-body current from one-body production followed by rescattering: across the separation prescriptions explored, f at 1 GeV ranges from 0.12 to 0.22. Interference with one-body production is not calculated and could be as large as the two-body rate. In a simulated SBND antineutrino-mode exposure on argon with the carbon f, two-body events are about 11% of events that produce a strange hadron. They supply more than a quarter of the kaon-less Sigma+ events used to tag hyperon charge exchange, partly as Sigma+ made at the weak vertex. They reconstruct 12-30% low in energy under the quasi-elastic hypothesis. After final-state interactions half of them have a proton above 40 MeV at the vertex, against a fifth of quasi-elastic events."},{"arxiv":"2610.36030","id":"3219356","title":"A Practical Guide to Sensitivity Projections for Beyond the Standard Model Physics","authors":"Francesca Acanfora, Michael J. Baker, Joaquim Iguaz Juan, Aidan Symons, Andrea Thamm","score":7.0,"section":"new","rank":23,"parts":[0.0,0.08,0.29,0.0],"note":"Closest of your papers: [[1615477]] (coupling 0.03, 1 shared references). Closest network paper: [[2917228]] (coupling 0.10, 6 shared references).","abstract":"Statistics is a well-established discipline, yet its application can be confusing, particularly in fields where the language of statistics is unfamiliar and when making projections, where real data is not yet available. Both of these factors are commonplace in Beyond the Standard Model physics. In this work, we clarify the distinction between goodness-of-fit tests, which assess the compatibility of an observation with a single hypothesis, and hypothesis tests, which quantify how strongly some data prefer one hypothesis over another. We emphasise that for Beyond the Standard Model sensitivity projections, hypothesis testing should be used. We give detailed examples using both Poisson and multinomially distributed data, deriving exact $p$-values and discussing Monte Carlo and asymptotic approximations. We further demonstrate that for the Asimov data set all the test statistics discussed, for both goodness-of-fit tests and hypothesis tests, can be approximated by Pearson's $χ^2$ statistic, and the difference in approaches comes down to the distribution of the test statistics. We also compare goodness-of-fit and hypothesis test $p$-values in two realistic examples. We (1) consider the reach of a muon collider on heavy spin-1 resonances and (2) provide updated projections for the potential of current and future gamma ray telescopes to probe new dark sectors via the observation of Hawking radiation from the explosion of a black hole. Finally, we discuss the CLs method, the significance and systematic errors."},{"arxiv":"2605.31123","id":"3162975","title":"Radiative Corrections to Elastic Lepton-Proton Scattering with Focus on Two-Photon-Exchange Diagrams","authors":"Daniel Crowe, Syed Mehedi Hasan, Doreen Wackeroth","score":6.3,"section":"replacement","rank":24,"parts":[0.06,0.07,0.1,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2855387]] (coupling 0.02, 4 shared references). Closest network paper: [[2625199]] (coupling 0.04, 4 shared references).","abstract":"Lepton (electron and muon) scattering experiments are excellent tools to gain insight into the nucleon structure. Elastic electron-proton scattering probes the spatial distribution of charge and magnetization inside the proton, and comparing electron-proton and muon-proton scattering data tests lepton universality. The availability of a plethora of scattering data with increased precision and observed discrepancies such as the proton form factor puzzle and the proton radius puzzle motivated a renewed effort to improve the theoretical framework. Realizing that the one-photon-exchange approximation (OPE), i.~e. the Born approximation, is not sufficient, radiative corrections in QED, especially the two-photon-exchange (TPE) diagrams, are under investigation. The TPE diagrams are of special interest among the radiative corrections, since their hadronic-structure-dependent contribution generates an additional dependence of the cross section on the virtual-photon polarization parameter beyond the Born approximation that is not captured by standard model-independent radiative correction procedures, and that directly impacts the extraction of proton form factors. In this work, we present a complete calculation of QED radiative corrections to elastic electron-proton and muon-proton scattering at next-to-leading order, taking into account loop-momentum-dependent form factors. In the discussion of their numerical impact on lepton-proton scattering cross sections, we pay special attention to the elastic nucleon contribution to the TPE diagrams and compare them with existing theoretical predictions and lepton-proton scattering data."},{"arxiv":"2610.37137","id":"3219282","title":"What the Primary Lund Plane Omits: A Model-Stitching Diagnosis of a Jet-Tagger Representation Gap","authors":"Saurabh Rai, Sanmay Ganguly","score":6.1,"section":"new","rank":25,"parts":[0.0,0.05,0.29,0.0],"note":"Closest of your papers: [[1627633]] (coupling 0.02, 1 shared references). Closest network paper: [[2893828]] (coupling 0.10, 4 shared references).","abstract":"Lund-plane and Particle Transformer (ParT) jet taggers can differ in performance because one representation is weaker, or because a weaker downstream computation reads an adequate one. Standalone performance cannot separate these. Model stitching can: it links the frozen early layers of one network to the frozen late layers of another through a single trained linear map. As a positive control we use an incomplete Lund representation, the primary declustering branch, whose deficit is known independently. Stitched into ParT's downstream, it reaches a background rejection at least as much as its own downstream recovers, yet far below ParT's background rejection: the deficit is representational, not computational. A hypergraph reader over splitting triplets does no better, ruling out higher-order correlations as the cause. The gap is invisible in AUC, which stays within 1% of its target value, and appears only in background rejection at low signal efficiency. It localizes to 0.6% of background jets, at and above the top mass, with more constituents but fewer primary splittings than typical background. Rebuilding the representation on the full Cambridge/Aachen declustering tree repairs the deficit as predicted: standalone rejection rises, closing 72% of the gap. Masking nodes at inference shows the repaired network still relies almost entirely on the primary branch; the secondary splittings make the representation learnable rather than supplying information it reads. Along the primary branch, the widest-angle splitting, near the top and $W$ opening angles, is worth nearly twice a random one. For quark/gluon tagging the primary branch is far less deficient, retaining 77.6% of ParT's rejection (46.9% for top), and the full tree closes only 33% of the gap (72% for top)."},{"arxiv":"2610.36049","id":"3219332","title":"Dark Matter Coherent Freeze-Out Mechanism: A Comprehensive Analysis","authors":"Steven Ferrante, Lillian Luo, Maxim Perelstein, Bingrong Yu","score":6.0,"section":"new","rank":26,"parts":[0.0,0.1,0.17,0.0],"note":"Closest of your papers: [[2855387]] (coupling 0.04, 5 shared references). Closest network paper: [[2828434]] (coupling 0.06, 5 shared references).","abstract":"Both Weakly-Interacting Massive Particle (WIMP) and Axion-Like Particle (ALP) are attractive particle dark matter candidates. In this paper we consider a scenario in which both WIMP and ALP are present. The two species interact via a non-derivative quadratic coupling modeled on the axion-nucleon interaction in QCD. We show that even a small (Planck-suppressed) coupling can drastically modify the cosmological history of both species. In the very early Universe, the ALP field acquires a vacuum expectation value, and the system undergoes an inverse phase transition at a temperature around or below the weak scale. WIMPs may remain in equilibrium far beyond the usual freeze-out time, eventually decoupling via a novel \"coherent freeze-out\" mechanism. WIMP annihilation cross sections several orders of magnitude above the canonical thermal target value can be consistent with the observed relic density in the coherent freeze-out scenario. At the same time, coherent oscillations of the ALP field do not begin until after the phase transition, and the initial conditions for these oscillations are set by the thermal physics of the phase transition. The ALP relic density is then predicted unambiguously in terms of the WIMP mass and coupling. We term this scenario \"ALP miracle\", since the observed relic density is obtained when these parameters are around their natural values, the weak and the Planck scale. The ALP miracle scenario prefers the ALP mass above about $10^{-3}\\,\\mathrm{eV}$, far larger than other popular ALP dark matter models. The ALP miracle parameter space overlaps with a currently allowed region of the QCD axion band, a large fraction of which is expected to be probed by the proposed IAXO experiment."},{"arxiv":"2610.36033","id":"3219331","title":"Can inflationary axion fluctuations dominate over misalignment?","authors":"Seung J. Lee, Sarunas Verner, Bingrong Yu","score":5.3,"section":"new","rank":27,"parts":[0.0,0.07,0.19,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.02, 3 shared references). Closest network paper: [[1955022]] (coupling 0.07, 10 shared references).","abstract":"The relic abundance of light stable axion dark matter is usually set by misalignment. We study whether the inflationary fluctuations of the axion can dominate instead, and we follow the modes analytically through an instantaneous transition from de Sitter expansion to radiation domination, neglecting the axion mass during inflation and keeping it afterward. Since the energy density is quadratic in the field, a fluctuation-dominated abundance carries an isocurvature perturbation even when the mean displacement vanishes. For a canonical minimally coupled axion the spectrum is scale invariant, and fluctuation-dominated dark matter exceeds the Planck isocurvature limit by about eight orders of magnitude. An inflaton-dependent kinetic function or a nonminimal coupling to the Ricci scalar tilts the spectrum blue, moving the fluctuation power from CMB scales to small scales. Imposing the Planck limit at the pivot scale, we find that fluctuation-dominated dark matter with a constant kinetic slope requires the spectral tilt $n_η-1\\gtrsim0.27$ and the axion mass $m_η \\gtrsim200 \\rm{GeV}$ at $H_I=10^{10}\\rm{GeV}$, and $n_η-1\\gtrsim0.34$ and $m_η\\gtrsim4.5\\,$keV at $H_I=10^{13}\\rm{GeV}$. A kinetic function with a running slope lowers these masses to $1.4~\\rm{GeV}$ and $0.7\\,$eV, respectively. For the QCD axion, whose oscillations start late, we estimate that any single power-law spectrum blue enough to satisfy the pivot limit gives too little fluctuation abundance, and misalignment dominates."},{"arxiv":"2607.22102","id":"3183185","title":"Updated E141 constraints on a long-lived $X_{17}$ vector boson","authors":"A. Celentano, A. Marini, L. Marsicano","score":5.1,"section":"replacement","rank":28,"parts":[0.0,0.08,0.16,0.0],"note":"Closest of your papers: [[1708009]] (coupling 0.03, 1 shared references). Closest network paper: [[3214448]] (coupling 0.06, 5 shared references).","abstract":"Since its first observation by the ATOMKI experiment in 2018, the $\\rm ^*Be$ anomaly has attracted considerable interest within the dark sector community as it may indicate the existence of a new fundamental particle with a mass of about 16.9 MeV, the $X_{17}$. However, the minimal model describing $X_{17}$ as a new vector boson is severely constrained by null results from legacy beam-dump experiments. Among these, the E141 experiment at SLAC places stringent limits on the $X_{17}$ coupling to electrons $\\varepsilon_e$ in the $5.1\\times10^{-5}\\lesssim \\varepsilon_e\\lesssim1.7\\times10^{-4}$ region. This excludes the possibility of a long-lived $X_{17}$, potentially in contrast with the preliminary estimate of the particle lifetime recently reported by the ATOMKI collaboration. The E141 limits commonly adopted in the literature rely on reinterpretations of the original analysis under solid but simplifying assumptions. While these studies provide a reliable estimate of the experiment's reach, they rely on approximations that were well justified when the boson mass was largely unconstrained. With the $X_{17}$ mass now confined to a narrow region by recent experimental observations, a more refined treatment of the E141 sensitivity becomes necessary. In this work, we revisit the E141 exclusion limits in the $X_{17}$ scenario by performing a dedicated reanalysis that incorporates a more accurate treatment of the experimental setup and signal prediction. We quantify the impact of these refinements on the excluded parameter space and discuss their implications for the compatibility between the E141 constraints and the vector boson interpretation of the ATOMKI anomalies."},{"arxiv":"2610.36081","id":"3219340","title":"Custodial scalars and Higgs branch","authors":"Luc Darmé, Baptiste Filoche, Sebastian Monath","score":4.5,"section":"new","rank":29,"parts":[0.0,0.08,0.12,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.03, 3 shared references). Closest network paper: [[2788812]] (coupling 0.04, 3 shared references).","abstract":"We show that, for most gauged scalar fields, the scalar potential can be systematically organised into an ordered tree of increasingly symmetric operators. The intermediary global symmetries represented in the tree allow at tree-level a subset of the scalar field components, the custodial scalars, to be technically lighter than the scalar mass scale, or even exactly massless (so-called accidents). We further demonstrate, using the notion of moment maps, that such structure can be related to the Higgs branch of supersymmetric theories, allowing the use of powerful symplectic geometry tools in studying the vacuum of non-supersymmetric scalar potentials. We present various applications, from an example of a non-abelian accident to a Standard Model-like Higgs sector generated from custodial scalars."},{"arxiv":"2610.11088","id":"3212882","title":"Probing CP violation in dark scalar decays at the SHiP experiment","authors":"Mayumi Aoki, Takashi Shimomura","score":4.4,"section":"replacement","rank":30,"parts":[0.0,0.07,0.14,0.0],"note":"Closest of your papers: [[2080612]] (coupling 0.02, 1 shared references). Closest network paper: [[2946993]] (coupling 0.05, 9 shared references).","abstract":"We investigate CP violation in the decays of a GeV-scale dark scalar boson into mesons, muons and photons. Both scalar and pseudoscalar couplings to the SM fermions are considered to study how the CP structure of the dark scalar boson can be probed through its decays. The scalar and pseudoscalar interactions predominantly induce decays into two-meson and three-meson final states, respectively. We propose the simultaneous observation of these two classes of decay modes as a probe of CP violation in the dark scalar sector. The expected signal rates at the SHiP and FASER2 experiments are evaluated based on the dark scalar production from heavy-meson decays. We find that the ratio of three-meson to two-meson decay events at SHiP has the potential to probe a wide range of the CP-violating parameter space for dark scalar masses around the GeV scale. We also show that the two-muon and di-photon channels can provide complementary information for the CP violation search."},{"arxiv":"2610.36160","id":"3219381","title":"How particle physics stops ultra-relativistic bubbles and shapes their gravitational waves","authors":"Alessandro Strumia","score":4.2,"section":"new","rank":31,"parts":[0.0,0.05,0.17,0.0],"note":"Closest of your papers: [[1854224]] (coupling 0.02, 1 shared references). Closest network paper: [[2862278]] (coupling 0.06, 10 shared references).","abstract":"The gravitational-wave spectrum produced by ultra-relativistic bubbles in a first-order cosmological phase transition can be approximated in terms of their energy density as a function of bubble size. Bubble collisions and post-collision classical evolution negligibly change it. The dominant energy loss is particle scattering, often in the Landau--Pomeranchuk--Migdal regime. So the GW spectrum depends on the particle-physics coupling (interpolating between the `envelope' and `bulk flow' limits), on the interaction type (gauge, Yukawa, scalar quartic, ...), and on whether particle number is conserved. Finally, we consider broken global symmetries, which give a mixture of `elastic' and `inelastic' collisions."},{"arxiv":"2610.37627","id":"3219586","title":"Using Higgs Boson Production in Association with Three Jets via Gluon Fusion at the LHC to Investigate the CP Properties of the Higgs Boson","authors":"Arunima Bhattacharya, Francisco Campanario, Michael Kubocz, Terrance Figy, Tunde Kushimo, Ivan Rosario","score":4.2,"section":"new","rank":32,"parts":[0.0,0.06,0.13,0.0],"note":"Closest of your papers: [[1207270]] (coupling 0.02, 3 shared references). Closest network paper: [[1494411]] (coupling 0.05, 14 shared references).","abstract":"A neutral Higgs boson $Φ$ with general scalar and pseudoscalar couplings and accompanying jets can be efficiently produced via gluon fusion through heavy-quark loops in high-energy hadronic collisions. We present integrated cross sections and kinematic distributions for the production of a generic Higgs boson $Φ$ in association with three jets, $pp \\to Φjjj$, at order $α_{s}^{5}$. We include the full mass dependence of the top- and bottom-quark loop contributions, combined coherently so that their interference is retained. Earlier finite-mass calculations of $Φ+3$ jets with bottom-quark loops and $CP$-odd or $CP$-mixed couplings were restricted to $gg \\to gggΦ$; we include the complete set of partonic subprocesses, and find that the quark-containing channels supply close to one half of the pseudoscalar three-jet cross section at $\\tanβ=1$. In a Type-II two-Higgs-doublet model the bottom-quark loop comes to dominate the rate as $\\tanβ$ is increased, so that the cross section is non-monotonic in $\\tanβ$. Comparing against the heavy-top effective theory and its form-factor-improved version, we show that the effective description fails in the hard tails of the transverse-momentum and dijet-mass distributions, while the third-jet centrality $z^\\star$ and the rapidity separation of the two leading jets are largely insensitive to the heavy-quark treatment. We further study the multi-jet azimuthal correlation $Φ_{2}$, built from the jet momenta on the two sides of the Higgs boson in rapidity, and find that the bottom-quark contribution modifies its shape even for a state of definite $CP$. For a $CP$-mixed state the interference of the two couplings adds a $\\sin2Φ_2$ term, which a simple counting asymmetry isolates and which no $CP$ eigenstate can produce. Numerical results are presented for the LHC at $\\sqrt{s}=13.6~$TeV and $m_Φ=125.2~$GeV."},{"arxiv":"2503.23741","id":"2906211","title":"Classification of modular symmetries in non-supersymmetric heterotic string theories","authors":"Shuta Funakoshi, Yuichi Koga, Hajime Otsuka","score":4.2,"section":"replacement","rank":33,"parts":[0.0,0.0,0.28,0.0],"note":"Closest network paper: [[1973492]] (coupling 0.10, 8 shared references).","abstract":"We study modular symmetries in non-supersymmetric heterotic string theories on toroidal backgrounds with Wilson line modulus, constructed by stringy Scherk-Schwartz compactification. In particular, we focus on a subgroup of the T-duality group 𝒪(D +16, D, ℤ) with D = 2 given by an outer automorphism of the Narain lattice, which can be mapped to the Siegel modular group Sp(4, ℤ). We classify the modular symmetries and a 𝒞P-like symmetry on T$^{2}$ and its orbifolds with symmetric and asymmetric orbifold twists. It turns out that the non-supersymmetric heterotic string theories only enjoy a part of modular symmetries in contrast to supersymmetric ones. Furthermore, the gauge symmetry is maximally enhanced at fixed points of modular symmetries on T$^{2}$ on which we analyze the vacuum structure of eight-dimensional tachyon-free vacua."},{"arxiv":"2610.37210","id":"3219515","title":"Exclusive production of doubly charmed baryon pair at B Factories","authors":"Xiao Liang, Jun Jiang, Chun-Yuan Li, Meng-Li Liu, Xing-Hua Yang, Zong-Guo Si","score":4.1,"section":"new","rank":34,"parts":[0.06,0.01,0.09,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.00, 1 shared references). Closest network paper: [[1710056]] (coupling 0.03, 10 shared references).","abstract":"The exclusive production of doubly charmed baryon pairs $Ξ_{cc}+\\barΞ_{cc}$ via $e^+e^-$ annihilation at B factories are calculated in the framework of non-relativistic QCD (NRQCD). The total cross sections, theoretical uncertainties, differential distributions and event yields for the BaBar and Belle II experiments are systematically discussed. According to our study, the detection prospects for both experiments are unfavorable."},{"arxiv":"2610.27068","id":"3216791","title":"ASTROLABE: A 3D Particle-Level Surrogate for Cosmology Simulation with Physical Flow Matching","authors":"Ibrahim Elsharkawy, David Curtin, Yonatan Kahn, Neal Weiner","score":4.1,"section":"cross","rank":35,"parts":[0.0,0.04,0.18,0.0],"note":"Closest of your papers: [[2859009]] (coupling 0.01, 2 shared references). Closest network paper: [[2719600]] (coupling 0.06, 6 shared references).","abstract":"The microphysics of dark matter (DM) is imprinted on cosmological structure across an enormous dynamic range. Nonlinear cosmological observables are most reliably modeled with N-body and hydrodynamic simulations. However, systematic N-body scans over DM theory space are prohibitively expensive. Machine learning emulators provide a possible solution, but are currently limited by either low resolution or only the ability to emulate specific observables. We introduce Astrolabe, a flow-matching-based generative emulator designed to be free of both constraints. Astrolabe acts directly on the 6N phase-space coordinates of N individual particles. With no voxel grid in the output, there is no voxel-resolution ceiling, and in principle any observable can be measured from inference. Astrolabe is computationally tractable via a field-particle hybrid transformer in which every particle cross-attends to multiscale field tokens, so compute and memory are linear in N. Astrolabe incorporates physical flow matching by taking the prior distribution for the flow to be approximate COmoving Lagrangian Acceleration (COLA)-based coordinates rather than unphysical noise, with momentum and mass conservation enforced at all points along flow time. In the Lambda-CDM cases we test, Astrolabe produces realistic fields with accurate power spectra, halo mass functions, velocity profiles, and halo density profiles. We also observe out-of-distribution generalization, with accurate emulation of dark-acoustic oscillation initial conditions. Astrolabe is also capable of being fine-tuned to simulate very large N and we demonstrate this by emulating a TNG50-3-dark simulation at a fraction of the cost. This method represents a first step toward a general and powerful cosmology simulation surrogate, which may eventually permit the inclusion of baryonic physics and a systematic exploration of richer dark sector interactions."},{"arxiv":"2610.36611","id":"3219436","title":"Quark mixing and CP violation due to torsional interaction","authors":"Arnab Chakraborty, Amitabha Lahiri","score":4.0,"section":"new","rank":36,"parts":[0.06,0.01,0.08,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.00, 1 shared references). Closest network paper: [[3094526]] (coupling 0.03, 3 shared references).","abstract":"The dynamics of fermions in spacetime generates torsion, ultimately leading to a current-current interaction independent of gravity. This torsional four-fermion interaction is generically chiral and non-universal and may have observable consequences. Furthermore, the fermion basis in which this torsional interaction is diagonal may be different from the mass basis and the flavor basis. We work out the structure of the quark sector, where new CKM-like matrices appear as a result of diagonalizing the torsional interaction. CP violation is modified in general due to the appearance of additional phases. We also consider various processes which are affected by it such as kaon decays in particular and show that even when the torsional interaction is taken to be diagonal in the flavor basis, flavor-changing processes are still affected due to the non-universality of the torsional coupling constants. Finally, we discuss rephasing invariants in the presence of the torsional interaction and show how the Jarlskog invariant is modified even when the torsion basis is aligned with the flavor basis."},{"arxiv":"2610.37254","id":"3219563","title":"Global Analysis of Nuclear Parton Distribution Functions using Markov Chain Monte Carlo","authors":"Nasim Derakhshanian","score":4.0,"section":"new","rank":37,"parts":[0.0,0.02,0.23,0.0],"note":"Closest of your papers: [[1397629]] (coupling 0.01, 2 shared references). Closest network paper: [[2102705]] (coupling 0.08, 35 shared references).","abstract":"Global analyses of nuclear parton distribution functions (nPDFs) have traditionally used the Hessian method for uncertainty estimation, relying on a local quadratic approximation of the chi-squared function. This Gaussian approximation can be inadequate when experimental constraints are limited and parameter correlations are strong, as it cannot fully capture asymmetric uncertainties, flat directions, or multiple minima. This thesis develops a Bayesian framework for nPDF determination using Markov Chain Monte Carlo (MCMC) techniques within the nCTEQ analysis framework. An adaptive Metropolis-Hastings algorithm enables direct sampling of the posterior distribution, revealing pronounced non-Gaussian behavior and secondary minima, particularly in the valence distributions. The analysis presents the first global single-nucleus determination of lead (Pb) PDFs based exclusively on lead data, complemented by a multi-nuclei analysis incorporating different nuclear targets through a standard analytic dependence on the mass number. Including lighter nuclei significantly constrains quark distributions and changes the extracted lead PDFs, while the gluon distribution remains comparatively stable. A comparison with Hessian-based results highlights the limitations of the Gaussian approximation in regions with strong nonlinearity or multimodality. Overall, this work establishes Bayesian MCMC inference as a flexible framework for nPDF determinatio     <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
list();nextList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
