<script>
const RAW = {"n":[{"id":"2960176","arxiv":"2508.09579","title":"Neutrino mass predictions with metaheuristic optimization under $A_4$ modular symmetry","first":"Aslam","nauth":6,"year":2025,"cites":0,"role":"repl","note":"Cites 2 network papers: [[1973492]], [[1846048]]. Closest of your papers: [[1607572]] (coupling 0.02, 1 shared references). Closest network paper: [[1973492]] (coupling 0.20, 24 shared references). Shared topics: neutrino mass, seesaw mechanism, fermion mass.","score":40.6,"rank":1,"section":"replacement","parts":[0.7,0.06,0.56,0.0,0.6],"abstract":"The current research aims to conduct an exhaustive investigation of the neutrino mass model based on $A_4$ discrete non-abelian modular symmetry, specifically in the context of the linear seesaw mechanism, where the conventional type I seesaw mechanism is extended, with particular attention given to the optimization of the parameters using incomprehensible but intelligible-in-time logics optimization algorithm (ILA), a metaheuristic optimization. Unlike other approaches to discrete flavor symmetry, the modular approach to flavor dynamics is found to significantly reduce the number and complexity of flavon fields required to give realistic textures to fermion masses. The key predictions include neutrino masses, $U_\\text{PMNS}$ matrices, effective neutrino masses for neutrinoless double beta decay, beta decay, Dirac and Majorana CP violation phases for normal (NO) and inverted mass ordering (IO), offering testable implications. The working efficiency of the ILA optimization technique is also estimated. The optimized neutrino oscillation parameters are well consistent with recent experimental data. Our analysis also aligns with Planck cosmological constraints on the sum of neutrino masses $0.06<Σm<0.12\\ \\text{eV}$.","authors":"Muhammad Waheed Aslam, Abrar Ahmad Zafar, Muhammad Naeem Aslam, Amina magdich, Yamen El Touati, Ahmed A. Hamoud","nlinked":123,"nref":165,"src":"INSPIRE","html":true},{"id":"3118629","arxiv":"2602.11085","title":"Sterile neutrino dark matter in conformal Majoron models","first":"Gonçalves","nauth":5,"year":2025,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1421898]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[452755]] (coupling 0.03, 2 shared references). Closest network paper: [[839969]] (coupling 0.10, 8 shared references). Shared topics: neutrino mass and mixing, relic density, neutrino mass, singlet scalar, seesaw mechanism.","score":33.7,"rank":2,"section":"replacement","parts":[0.48,0.1,0.29,0.0,0.94],"abstract":"We study sterile neutrino dark matter (DM) in a classically conformal U(1)' extension of the Standard Model with three right-handed neutrinos and a Majoron-like singlet scalar that generate the observed pattern of active neutrino masses and mixing via the type-I seesaw mechanism. Working in the regime of strongly suppressed active-sterile mixing, we show that the observed DM abundance can be produced through freeze-in from feeble interactions mediated by the heavy Z' and the conformal scalar. We solve the Boltzmann equation for the nonthermal phase-space distribution and confront the scenario with Lyman-$α$ and strong gravitational lensing data by computing the matter power spectrum. For keV-mass sterile neutrinos we identify the viable parameter space consistent with the inferred relic density and structure-formation and X-ray bounds, including regions compatible with a tentative 3.5 keV line. If a second sterile state is long-lived, late decays can realize a two-component setup that alleviates the $S_8$ tension. However, explanations of the 3.5 keV line and the $S_8$ tension are incompatible with the strong-lensing limit from JWST if the neutrinos saturate the relic abundance. In a highly fine-tuned variant of the model, the 220 PeV KM3NeT event can also be explained by invoking the decay of a superheavy sterile neutrino.","authors":"João Gonçalves, Danny Marfatia, António P. Morais, Vinícius Oliveira, Roman Pasechnik","nlinked":73,"nref":77,"src":"INSPIRE","html":true},{"id":"3221049","arxiv":"2610.40821","title":"The Yottascale at Tera-$Z$: Petascale SUSY?","first":"Allwicher","nauth":5,"year":2025,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1394206]] (coupling 0.03, 4 shared references). Closest network paper: [[2053590]] (coupling 0.08, 17 shared references).","score":23.4,"rank":3,"section":"new","parts":[0.48,0.09,0.23,0.0,0.01],"abstract":"As experimental and theoretical advances are made, the paradigm of grand unification faces growing challenges. In light of what has been learned at the LHC, from Higgs mass measurement and direct searches for supersymmetry, we contrast the current theoretical predictions in a simplified supersymmetric grand unified theory against present and future experimental precision, focussing on threshold corrections and renormalisation group effects above the electroweak scale. More precisely, the theoretical precision is juxtaposed to the experimental one. Especially, the impact of a future Tera-$Z$ factory such as FCC-ee is examined, while also considering the expected future improvement of proton decay constraints. We find that the improvement on the measurement of the gauge couplings expected at Tera-$Z$ will yield sensitivity to higher loop orders in the evolution of the couplings up to the Yottascale, calling for further theoretical efforts. In a minimal $\\rm{SU}(5)$ scenario with nearly degenerate SUSY spectrum, we study the impact of the proton decay constraint on the SUSY scale, comparing 2- and 3-loop analyses. While the 2-loop results point to a SUSY scale around 1 PeV, the 3-loop analysis seems to exclude the model entirely. This follows from the fact that at 1-loop in the GUT threshold corrections, the mass of the colour-triplet Higgs is completely determined by the IR parameters. This \\textit{IR determination} is not accidental, but rooted in the group structure and breaking of the GUT theory.","authors":"Lukas Allwicher, Francisco N. C. Dahab, Christophe Grojean, Gabriel M. Salla, Lucine Tabatt","nlinked":61,"nref":67,"src":"INSPIRE","html":true},{"id":"3221694","arxiv":"2610.41960","title":"Neutrino Oscillation in a Static Dihole Geometry","first":"Capobianco","nauth":2,"year":2025,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1220579]] (coupling 0.01, 2 shared references). Closest network paper: [[2049444]] (coupling 0.03, 6 shared references). Shared topics: neutrino mass.","score":22.0,"rank":4,"section":"cross","parts":[0.45,0.04,0.08,0.0,0.38],"abstract":"We investigate neutrino flavor oscillations in the static equal-mass Majumdar-Papapetrou dihole geometry, restricting the propagation to the symmetry plane. Within the null approximation, we derive the leading contribution to the neutrino phase and numerically evaluate the geodesic integrals. For two neutrino flavors, interference between different trajectories introduces a dependence on the individual neutrino masses and on the neutrino mass ordering for nonmaximal mixing. We analyze the transition probability in different spacetime configurations possessing two light rings, a merged light ring (critical configuration), and no light rings in the equatorial plane. In the weak-lensing regime, the transition probability generally increases with the black holes' individual masses, while variations in the half-separation produce no qualitative change in the transition probability. In stronger-lensing configurations, variations in both the mass and half-separation modify the heights and positions of the extrema, with no monotonic increase or decrease in the transition probability. For the critical and no-light-ring configurations studied, we identify three zero-winding trajectories connecting the source and detector, including one passing near the symmetry axis. The probability remains oscillatory, and its oscillatory pattern depends strongly on the neutrino energy.","authors":"Rogério Capobianco, Rafael C. R. de Lima","nlinked":49,"nref":54,"src":"INSPIRE","html":true},{"id":"3221023","arxiv":"2610.40866","title":"Phenomenological Chiral Effective Field Theory for Neutrino Event Generators","first":"Graham-Jones","nauth":5,"year":2025,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1671831]] (coupling 0.01, 3 shared references). Closest network paper: [[2102705]] (coupling 0.10, 34 shared references).","score":21.8,"rank":5,"section":"new","parts":[0.48,0.03,0.27,0.0,0.0],"abstract":"Single-pion production is a crucial interaction channel for accelerator-based neutrino experiments, which rely on neutrino event generators for its cross sections. However, no model implemented in current generators provides a consistent and systematically improvable description of the resonance region. In this work, we develop a phenomenological chiral effective field theory model of pion production, built from nucleons, pions, and the $Δ(1232)$ with consistent, spin 3/2, gauge-invariant couplings, and we implement it in a fully automated pipeline from the Lagrangian to events using FeynRules, UFO 2.0, and Sherpa. We validate our results with pion photoproduction data and compare against neutrino bubble chamber, MINERvA, T2K, MicroBooNE, MiniBooNE, and electron-carbon scattering data. The framework can be systematically improved by extending the Lagrangian with higher-order operators and additional degrees of freedom, and by refitting couplings and form factors as new data become available. Combined with nuclear model interfaces, our approach opens a path to resonance-region predictions that meet the needs of next-generation experiments.","authors":"Zara Graham-Jones, Mareen Hoppe, Joshua Isaacson, Shirley Weishi Li, Miša Toman","nlinked":151,"nref":160,"src":"INSPIRE","html":true},{"id":"2854105","arxiv":"2411.19196","title":"Dark axion portal at $Z$ boson factories","first":"Jodłowski","nauth":1,"year":2025,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2824738]]. Closest of your papers: [[677884]] (coupling 0.03, 1 shared references). Closest network paper: [[2946993]] (coupling 0.06, 9 shared references).","score":21.8,"rank":6,"section":"replacement","parts":[0.45,0.06,0.18,0.0,0.13],"abstract":"Dark axion portal connects an axion-like-particle (ALP), which can be the QCD axion, with the SM by the coupling to a photon and a dark photon, leading to a rich and distinct phenomenology related to dark matter, astrophysics, and cosmology. We note that due to the gauge invariance, the $Z$ boson-dark photon-ALP coupling should also be generated with sizable strength, and we study its phenomenological consequences at $Z$ boson factories: LEP, FCC-ee, and forward physics detectors at the LHC and FPF@FCC - FASER and MATHUSLA. Due to the large number of $Z$ bosons produced, DAP particles can be efficiently produced and detected by semi-visible displaced decays of the heavier DS species to $γ$+inv. or $f^+ f^-$+inv., and via missing energy signature with zero or one photon. Because of the complementarity of the two approaches, we find great prospects in exploring both short and long-lived lifetime regimes of DAP, especially when the heavier dark species has mass above $0.1\\,$GeV.","authors":"Krzysztof Jodłowski","nlinked":33,"nref":33,"src":"INSPIRE","html":true},{"id":"3165854","arxiv":"2606.07225","title":"Simultaneous Dalitz-plot decomposition of the $e^+ e^- \\to J/ψ\\, π\\, π\\, (K \\bar{K})$ processes in the 4.13-4.36 GeV region using dispersive final-state interactions","first":"Ermolina","nauth":3,"year":2025,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3193100]] (coupling 0.03, 25 shared references).","score":17.2,"rank":7,"section":"replacement","parts":[0.45,0.0,0.09,0.0,0.0],"abstract":"We present a joint analysis of the processes $e^+e^- \\to J/ψπ^+π^-$ and $e^+e^- \\to J/ψK^+K^-$ at center-of-mass energies from 4.13 to 4.36 GeV. The amplitudes are constructed using the Dalitz-plot decomposition formalism, with the $e^+e^-$ energy dependence encoded through the $Y(4220)$ and $Y(4320)$ resonant structures together with a nonresonant production mechanism. The scalar $ππ/K\\bar K$ final-state interaction is treated dispersively using a coupled-channel Omnès representation. This allows us to describe the measured total cross sections and one-dimensional invariant-mass distributions with a single set of energy-independent parameters. We find that a purely resonant description of the BESIII data is insufficient, requiring a nonresonant term at the amplitude level which undergoes $ππ/K\\bar{K}$ rescattering. Within the present isobar model, we extract Breit-Wigner parameters for the $Z_c(3900)$, $Y(4220)$, and $Y(4320)$ states, and determine the corresponding subprocess cross sections.","authors":"Viktoriia Ermolina, Igor Danilkin, Marc Vanderhaeghen","nlinked":48,"nref":52,"src":"INSPIRE","html":true},{"id":"3220089","arxiv":"2610.37922","title":"Meson-baryon final-state interactions in the $ψ(3686)\\to pK^-K_S^0\\barΞ^0$ decay","first":"Sobrinho","nauth":3,"year":2025,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3214449]] (coupling 0.02, 1 shared references).","score":16.5,"rank":8,"section":"replacement","parts":[0.45,0.0,0.04,0.0,0.0],"abstract":"We study the decay $ψ(3686)\\to p K^- \\bar K^0 \\barΞ^0$, treating the $ψ(3686)$ as a $c\\bar c$ state and therefore as a singlet under SU(3) transformations in the light-quark sector. We consider all possible combinations of a baryon, an antibaryon, and two pseudoscalar mesons that form an SU(3) singlet, retaining the terms that can lead to the $p K^- \\bar K^0 \\barΞ^0$ final state through $S$-wave final-state interactions. Three independent SU(3)-singlet structures are identified and assigned different weights. We also include the contribution of the $Λ(1520)$ in the meson-baryon $D$-wave. A fit to the data provides a good description of all six invariant-mass distributions. In addition to the $Λ(1520)$ contribution, we find a small contribution from the $Λ(1670)$ in the $K^-p$ invariant-mass distribution, generated by final-state interactions, and a contribution from the $Σ(1430)$, which produces a significant distortion of the $\\bar K^0p$ invariant-mass distribution relative to phase space. This study demonstrates the value of investigating charmonium decays into a baryon-antibaryon pair and two pseudoscalar mesons, complementing the more commonly studied decays into a baryon-antibaryon pair and a single pseudoscalar meson.","authors":"Fernando César Sobrinho, Wen-Tao Lyu, Eulogio Oset","nlinked":45,"nref":46,"src":"INSPIRE","html":true},{"id":"2817040","arxiv":"","title":"Review of particle physics","first":"Navas","nauth":244,"year":2024,"cites":6609,"role":"other","note":"","score":null},{"id":"839969","arxiv":"0912.2478","title":"Inert-Sterile Neutrino: Cold or Warm Dark Matter Candidate","first":"Gelmini","nauth":3,"year":2009,"cites":55,"role":"other","note":"","score":null},{"id":"1973492","arxiv":"2111.10944","title":"Zee model in a modular $A_4$ symmetry","first":"Nomura","nauth":3,"year":2021,"cites":21,"role":"other","note":"","score":null},{"id":"3193100","arxiv":"","title":"Review of Particle Physics","first":"Takahashi","nauth":259,"year":2026,"cites":450,"role":"other","note":"","score":null},{"id":"2874212","arxiv":"2501.18181","title":"Permuted charged lepton correction in the framework of dirac seesaw","first":"Goswami","nauth":2,"year":2025,"cites":6,"role":"other","note":"","score":null},{"id":"2824738","arxiv":"2409.02163","title":"FPF@FCC: neutrino, QCD, and BSM physics opportunities with far-forward experiments at a 100 TeV Proton Collider","first":"Mammen Abraham","nauth":10,"year":2024,"cites":38,"role":"other","note":"","score":null},{"id":"2817238","arxiv":"2408.05995","title":"Searching for long-lived light neutralinos and axionlike particles at the SHiNESS experiment","first":"Wang","nauth":3,"year":2024,"cites":5,"role":"other","note":"","score":null},{"id":"2053590","arxiv":"2203.08771","title":"Searches for baryon number violation in neutrino experiments: a white paper","first":"Dev","nauth":38,"year":2022,"cites":65,"role":"other","note":"","score":null},{"id":"2946993","arxiv":"","title":"Physics to Look Forward To: The Broad Application and Discovery Potential of Far-Forward Physics at the LHC","first":"Fieg","nauth":1,"year":2025,"cites":0,"role":"other","note":"","score":null},{"id":"2090218","arxiv":"2206.00661","title":"Charged lepton flavor violating processes in the Grimus-Neufeld model","first":"Dūdėnas","nauth":5,"year":2022,"cites":10,"role":"other","note":"","score":null},{"id":"3158084","arxiv":"2605.21065","title":"The Single Photon Signature of a Light Long-lived Neutralino at Remote Detectors at the LHC","first":"Dreiner","nauth":4,"year":2026,"cites":2,"role":"other","note":"","score":null},{"id":"1863322","arxiv":"2105.06539","title":"Type-3/2 seesaw mechanism","first":"Demir","nauth":3,"year":2021,"cites":3,"role":"other","note":"","score":null},{"id":"2775479","arxiv":"2404.06223","title":"Dark sterile neutrinos on a linear seesaw of neutrino masses","first":"Matute","nauth":1,"year":2024,"cites":0,"role":"other","note":"","score":null},{"id":"2715897","arxiv":"2310.20681","title":"Phenomenology of lepton masses and mixing with discrete flavor symmetries","first":"Chauhan","nauth":9,"year":2023,"cites":70,"role":"other","note":"","score":null},{"id":"1421898","arxiv":"1602.04816","title":"A White Paper on keV Sterile Neutrino Dark Matter","first":"Drewes","nauth":136,"year":2016,"cites":739,"role":"other","note":"","score":null},{"id":"2102705","arxiv":"2206.13792","title":"Neutrinos and their interactions with matter","first":"Sajjad Athar","nauth":3,"year":2022,"cites":73,"role":"other","note":"","score":null},{"id":"707996","arxiv":"hep-ph/0601023","title":"Proton stability in grand unified theories, in strings and in branes","first":"Nath","nauth":2,"year":2006,"cites":577,"role":"other","note":"","score":null},{"id":"1394206","arxiv":"1509.06313","title":"Fermion dark matter from SO(10) GUTs","first":"Arbelaez","nauth":4,"year":2015,"cites":30,"role":"seed","note":"","score":null},{"id":"452755","arxiv":"hep-ph/9712487","title":"Neutrino mass and missing momentum Higgs boson signals","first":"Diaz","nauth":4,"year":1997,"cites":9,"role":"seed","note":"","score":null},{"id":"1846048","arxiv":"2102.05658","title":"Controlled fermion mixing and FCNCs in a $\\Delta(27)$ 3+1 Higgs Doublet Model","first":"Cárcamo Hernández","nauth":4,"year":2021,"cites":16,"role":"other","note":"","score":null}],"e":[[2,8,"c"],[1,9,"k"],[0,10,"c"],[18,8,"c"],[7,11,"c"],[2,11,"c"],[0,12,"k"],[12,8,"c"],[4,11,"c"],[4,8,"c"],[5,13,"c"],[5,14,"k"],[2,15,"k"],[5,16,"k"],[21,10,"c"],[22,9,"c"],[2,17,"k"],[5,18,"k"],[8,24,"c"],[20,22,"c"],[4,19,"k"],[13,8,"c"],[1,20,"k"],[3,11,"c"],[16,13,"c"],[15,24,"c"],[0,21,"k"],[11,24,"c"],[16,8,"c"],[15,25,"c"],[1,8,"c"],[6,11,"c"],[1,22,"c"],[4,23,"k"],[8,15,"c"],[12,21,"c"],[2,24,"k"],[11,15,"c"],[2,25,"k"],[1,26,"k"],[0,27,"c"],[11,8,"c"]],"next":[{"arxiv":"2608.15240","id":"3191617","title":"Prospects for Direct Detection of Ultralight Dark Matter candidates in deci-Hz Band with IndIGO-D","authors":"Md. Emanuel Hoque, Andrew L. Miller, Arunava Mukherjee","score":8.9,"section":"replacement","rank":9,"parts":[0.0,0.07,0.14,0.0,0.46],"note":"Closest of your papers: [[1607572]] (coupling 0.02, 3 shared references). Closest network paper: [[1843058]] (coupling 0.05, 7 shared references). Shared topics: dark matter candidate, direct detection.","abstract":"We investigate the sensitivity of IndIGO-D, a proposed space-based decihertz gravitational-wave interferometer, to different classes of ultralight dark matter. IndIGO-D will probe the $\\sim0.01$--$10~\\mathrm{Hz}$ frequency band between those accessible to current ground- and future space-based gravitational-wave interferometers, providing access to ultralight dark-matter masses beyond the reach of existing instruments. We consider two complementary signatures: interferometric displacements induced by coherently oscillating scalar (dilaton), vector (dark-photon, $U(1)_B$ and $U(1)_{B-L}$ gauge groups), and tensor fields with masses $m_{\\rm DM}\\sim10^{-17}$--$10^{-14}~\\mathrm{eV}$; and changes in laser polarization induced by pseudoscalar axion dark matter at higher masses, around $m_a\\sim10^{-12}~\\mathrm{eV}$. For the dilatons, dark photons and tensors, we compute the expected sensitivities using two pipelines -- cross-correlation and BSD excess-power -- assuming L-shaped and triangular interferometer layouts and three representative noise power spectral densities (S1, S2, S3), each for two years of continuous observation. We find that the projected sensitivities agree to within a factor of order unity across the search pipelines and interferometer geometries. In particular, we show that IndIGO-D could open previously unconstrained coupling parameter space for vector and tensor dark matter across $m_{\\rm DM}\\sim10^{-16}$--$10^{-14}~\\mathrm{eV}$, bridging the sensitivity of space- and ground-based experiments. For axion dark matter, we demonstrate that a complementary detection for laser light polarization shifts, limited primarily by photon shot noise, could probe the axion-photon coupling $g_{aγ}$ at masses around $m_a\\sim10^{-12}~\\mathrm{eV}$ at a level potentially better than that of other future experiments without degrading sensitivity to gravitational waves."},{"arxiv":"2610.40749","id":"3220958","title":"Combinatorial Residual Network: a decay-chain-aware classifier without explicit jet assignment","authors":"John Alison, Patrick Bryant, Alejandro Gomez Espinosa, Christian Guinto-Brody, Aniket Khanal, Chuyuan Liu, Sindhu Murthy, Guanglei Zhao","score":7.8,"section":"cross","rank":10,"parts":[0.0,0.12,0.28,0.0,0.0],"note":"Closest of your papers: [[1627633]] (coupling 0.04, 4 shared references). Closest network paper: [[2646004]] (coupling 0.10, 7 shared references).","abstract":"Final states with several jets from the decays of heavy particles pose a combinatorial problem, since the jets must be assigned, at least implicitly, to their parent particles. We describe the Combinatorial Residual Network (CoReNet), a classifier that encodes the assumed decay chain of the final state in its architecture. CoReNet builds its event representation level by level along the decay hierarchy, evaluates every jet assignment hypothesis with weights shared across objects, and combines the hypotheses with learned weights using residual networks. The exchange symmetries of the decay are built into the construction, the size of the network does not depend on the number of hypotheses, and the network is trained with the classification loss alone, without generator-level jet assignments. The architecture was developed for the $b\\bar{b}b\\bar{b}$ final state and has been used in several CMS searches. On fast-simulation samples of Higgs boson pair production in the $b\\bar{b}b\\bar{b}$ final state against QCD multijet production, CoReNet with 1508 trainable parameters performs well above kinematic baselines and trains in minutes on a single GPU. Its hypothesis weights select the truth-matched jet pairing in most of the signal events in which it is defined, although no assignment target is used in training. Since only the encoded decay chain is specific to the final state, the construction carries over to other topologies, which we test with $HH \\to b\\bar{b}W^+W^-$ against semileptonic $t\\bar{t}$. There, encoding the decay chain of the background as well as that of the signal further improves the classification, at a cost of about $10^3$ parameters. In both final states its performance is comparable to that of a state-of-the-art transformer-based network more than two orders of magnitude larger. The implementation is publicly available at https://github.com/cms-cmu/CoReNet."},{"arxiv":"2610.40793","id":"3220971","title":"Layered Wire-Grid Haloscope for Millielectronvolt Axions and Dark Photons","authors":"Andrea Caputo","score":7.6,"section":"new","rank":11,"parts":[0.0,0.13,0.25,0.0,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.05, 5 shared references). Closest network paper: [[2697191]] (coupling 0.09, 13 shared references).","abstract":"We propose MADGRID (Millielectronvolt Axions and Dark photons with layered GRIDs), a few wire grids in front of a mirror, tuned by their spacing, forming an epsilon-near-zero slab that radiates through its face into external optics. Unlike wire-plasma haloscopes, the signal need not cross the lossy medium to reach an antenna, and metal grids replace the disks of dielectric haloscopes. A 1 m$^2$ array in 10 T could probe axion-photon couplings below the CAST bound up to 1.4 meV with kinetic-inductance detectors, and KSVZ couplings over 0.8-3.9 meV with future photon counters. Without a magnet, it could probe dark photon mixings down to $3.4\\times10^{-16}$."},{"arxiv":"2509.11906","id":"2969618","title":"Enhanced Cosmic-Ray Cooling in AGN from Dark Matter Deep Inelastic Scattering","authors":"Linjie Li, Chih-Ting Lu, Arvind Kumar Mishra, Liangliang Su, Lei Wu","score":7.4,"section":"replacement","rank":12,"parts":[0.06,0.06,0.18,0.0,0.07],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2855387]] (coupling 0.02, 3 shared references). Closest network paper: [[3083722]] (coupling 0.06, 12 shared references).","abstract":"The diffusion of high-energy cosmic rays (CRs) through the dark matter (DM) spikes of active galactic nuclei entails significant energy loss via interactions with DM. While previous studies of sub-GeV DM have focused on elastic scattering, this process becomes insufficient at higher proton energies and DM masses. In this work, we investigate the CR-DM deep inelastic scattering (DIS) as mediated by a vector portal. We calculate the DIS contribution to the CR energy loss rate and derive stringent exclusion limits on the CR-DM scattering cross-section for DM masses between $10^{-6}$ GeV and $1$ GeV. For higher CR energies and mediator masses, the resulting CR cooling timescales are reduced by orders of magnitude after involving the DIS contribution, producing stringent constraints that surpass most of current experimental limits."},{"arxiv":"2610.41575","id":"3221629","title":"Phase transition dynamics of Abelian-Higgs vortices in the oscillating axion background","authors":"Naoya Kitajima, Shota Nakagawa","score":7.1,"section":"new","rank":13,"parts":[0.0,0.09,0.25,0.0,0.07],"note":"Closest of your papers: [[1607572]] (coupling 0.03, 3 shared references). Closest network paper: [[2703113]] (coupling 0.09, 10 shared references).","abstract":"We investigate the effect of an oscillating axion background on thermally induced vortex-antivortex production in the Abelian-Higgs model. Through its coupling to the gauge field, the axion sources an electromagnetic response in the presence of vortex magnetic flux, modifying the dynamics of the vortices. We study this system using Langevin lattice simulations with dissipation and stochastic noise. It is shown that the phase transition dynamics of Abelian-Higgs vortices, namely the pair creation of vortex and antivortex under thermal fluctuations, can be significantly modified in the oscillating axion background. We find that the axion background shifts the rapid increase in the vortex density to lower temperature. In particular, this transition temperature becomes smaller as the oscillation frequency of the axion increases. The temperature dependence of the correlation length is also modified. These features provide a new experimental approach for the axion dark matter using superconducting devices."},{"arxiv":"2610.41504","id":"3221623","title":"Quantum Popcorn: the shape of a phase transition bubble","authors":"Kfir Blum, Ipak Fadakar, Omri Rosner, Guilherme L. Pimentel","score":6.9,"section":"new","rank":14,"parts":[0.0,0.05,0.36,0.0,0.0],"note":"Closest of your papers: [[2080612]] (coupling 0.02, 1 shared references). Closest network paper: [[3186376]] (coupling 0.13, 6 shared references).","abstract":"A quantum tunneling event in field theory is usually depicted as the materialization of a spherical bubble of true vacuum. The bubble appears at rest, and its profile is the time-symmetric slice of Coleman's bounce, the Euclidean solution that controls the decay rate. However, the bubble is spherical only in the leading semiclassical approximation: at the next order the configuration is a Gaussian ensemble of fluctuations around the bounce. We derive the wave functional of the field on the nucleation slice from the half-bounce path integral, and use it to compute the root-mean-square quadrupole moment of a bubble at nucleation. The relative deformation of the bubble wall radius $R$ is $δR/R\\sim(\\hbar/S_b)^{1/2}$, with $S_b$ the bounce action. Thus $δR/R\\sim0.1$ for a typical cosmological phase transition with $S_b/\\hbar\\sim100$."},{"arxiv":"2610.40766","id":"3221005","title":"Hints of self-interacting dark matter from strong gravitational lensing","authors":"Daniel Gilman, Kalliopi Petraki, Thomas Pignard, James Gurian, Alex Kusenko, Anna Nierenberg","score":6.5,"section":"cross","rank":15,"parts":[0.0,0.0,0.24,0.0,0.29],"note":"Closest network paper: [[1989085]] (coupling 0.08, 8 shared references). Shared topics: indirect detection.","abstract":"An analysis of 29 quadruply imaged quasars hints at dark matter halo densities consistent with gravothermal core collapse, a key prediction of self-interacting dark matter. We interpret this evidence through elastic Yukawa scattering, combining lensing with upper limits on the cross-section strength from galaxy clusters and Milky Way satellite evaporation. Favored models have dark matter masses of $20$-$80\\,{\\rm GeV}$, MeV-scale mediators, and Yukawa-potential strengths near $10^{-3}$, yielding cross-sections of $10^2$--$10^4 \\, {\\rm cm^2\\,g^{-1}}$ at $10\\,{\\rm km\\,s^{-1}}$. Cosmological, direct and indirect detection bounds on MeV-scale mediators motivate a neutrinophilic scalar dilepton that decays invisibly without Higgs mixing. These results demonstrate how inferences on core collapse constrain dark sector physics."},{"arxiv":"2610.41175","id":"3220989","title":"Toward a Three-Body Holonomy Standard Model","authors":"Tadashi Yoshikawa","score":6.1,"section":"new","rank":16,"parts":[0.0,0.07,0.15,0.0,0.18],"note":"Closest of your papers: [[2690106]] (coupling 0.02, 1 shared references). Closest network paper: [[3095799]] (coupling 0.05, 3 shared references). Shared topics: gauge symmetry.","abstract":"We propose a phenomenological framework toward a Three-Body Holonomy Standard Model in which the number three is selected by the minimal primitive cyclic structure of a democratic many-body interaction network. The resulting threefold holonomy information is assumed to survive in $(3+1)$ dimensions as an internal three-state space. A Lorentz-invariant six-fermion interaction provides a candidate microscopic origin of the internal cyclic correlations, with their matching to Wilson holonomy left as a dynamical requirement. The parity-related holonomy sectors of the underlying $(1+1)$-dimensional Dirac system motivate left- and right-handed internal structures and a trinification-like $SU(3)_C\\times SU(3)_L\\times SU(3)_R$ gauge completion. Vertical holonomy selects a $2+1$ splitting, while spontaneous left-right vacuum misalignment provides a possible route to chiral symmetry breaking. Horizontal holonomy organizes the three-family mass structure, with heavy-fermion mixing generating effective flavor and CP-violating patterns. Although a complete ultraviolet derivation remains open, the framework provides a unified scenario connecting primitive three-body dynamics to gauge symmetry, symmetry breaking, and fermion flavor."},{"arxiv":"2607.23737","id":"3183562","title":"Radiative decays of $J/ψ,\\,ψ(2S)\\rightarrowγη^{(\\prime)}$ in perturbative QCD with relativistic corrections","authors":"Jun-Kang He, Chao-Jie Fan, Cong Wang","score":5.8,"section":"replacement","rank":17,"parts":[0.06,0.07,0.11,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2855387]] (coupling 0.03, 4 shared references). Closest network paper: [[2625199]] (coupling 0.04, 4 shared references).","abstract":"We present the first calculation of the radiative decays $J/ψ,ψ(2S)\\rightarrowγη^{(\\prime)}$ in perturbative QCD that includes the order-$q^{2}$ relativistic corrections in all three short-distance contributions, namely the quark-antiquark, two-gluon, and QED contributions. The amplitudes are found to be remarkably insensitive to the light-cone distribution amplitude and to the light-quark mass, a robustness that persists through order $q^{2}$ and makes the predictions correspondingly reliable. The relativistic correction enhances the $J/ψ$ branching ratios by roughly a factor of 2, narrowing their shortfall from experiment, whereas for the $ψ(2S)$ it is about twice as large as for the $J/ψ$ and the low-order expansion converges poorly. In two representative $η$--$η^{\\prime}$ mixing schemes, the ratio $\\mathcal{R}_{1S}=\\mathcal{B}(γη^{\\prime})/\\mathcal{B}(γη)$ proves sharply sensitive to the mixing angle and favors the smaller of the two. The predicted $ψ(2S)$ rates lie well above the data in both channels, already at leading order, and most severely for the anomalously small $γη$ channel. Such a discrepancy suggests that a mechanism beyond the hard perturbative process is at work. As a physically motivated attempt, we explore the $η_{c}$-mixing contribution, which adds coherently to the perturbative one and is comparable to it in the $γη$ channel, and find that the interference can bring the $ψ(2S)$ rates into agreement with the data, although its extraction is limited by a strong sensitivity to the mixing parameters."},{"arxiv":"2610.22224","id":"3215657","title":"The hadronic-vacuum-polarization contribution to the muon anomalous magnetic moment in isospin-symmetric lattice QCD with twisted-mass fermions","authors":"C. Alexandrou, S. Bacchio, A. De Santis, A. Evangelista, J. Finkenrath, R. Frezzotti, G. Gagliardi, M. Garofalo, N. Kalntis, B. Kostrzewa, V. Lubicz, L. Maio, F. Margari, F. Pittler, S. Romiti, F. Sanfilippo, C. Schneider, S. Simula, N. Tantalo, C. Urbach, U. Wenger","score":5.6,"section":"replacement","rank":18,"parts":[0.0,0.05,0.27,0.0,0.0],"note":"Closest of your papers: [[2690106]] (coupling 0.02, 4 shared references). Closest network paper: [[2706495]] (coupling 0.09, 14 shared references).","abstract":"We present a lattice-QCD calculation of the leading-order hadronic-vacuum-polarization (HVP) contribution to the anomalous magnetic moment of the muon in isospin-symmetric QCD. We employ the gauge configurations generated by the Extended Twisted Mass Collaboration (ETMC) with $N_f = 2 + 1 + 1$ flavors of Wilson-clover twisted-mass quarks at four lattice spacings and at values of the quark-mass parameters matching the definition of isospin-symmetric QCD given in the FLAG review 2024 and in the 2025 edition of the Muon $g-2$ Theory Initiative White Paper (WP25). After retuning the simulation parameters to precisely match these two definitions of isospin-symmetric QCD, and after carrying out an extrapolation to the continuum limit based on the data at lattice spacings $a \\simeq 0.049, 0.057, 0.068$ and $0.079$~fm, and spatial lattice sizes up to $L \\simeq 7.7$~fm, we obtain $a_μ^{\\rm HVP, FLAG}(\\rm{iso}) = (720.0 \\pm 6.9) \\times 10^{-10}$ and $a_μ^{\\rm HVP, WP25}(\\rm{iso}) = (714.8 \\pm 7.4) \\times 10^{-10}$. Our results, which have a relative uncertainty of about $1 \\%$, agree well with the corresponding determinations by other lattice groups. After adding to our determination of $a_μ^{\\rm HVP, WP25}(\\rm{iso})$ the leading isospin-breaking corrections provided in the WP25, namely $a_μ^{\\rm HVP, WP25}({\\rm IB}) = 0.1(3.4)\\times 10^{-10}$, we obtain for the full HVP the value $a_μ^{\\rm HVP}= (714.9 \\pm 8.1)\\times 10^{-10}$. This result translates into a Standard Model prediction for the muon anomalous magnetic moment that is fully consistent with the latest result by the Fermilab Muon $g-2$ experiment and strengthens the tension between lattice QCD and data-driven (pre-CMD3) dispersive determinations."},{"arxiv":"2610.39215","id":"3220407","title":"Nucleon Wave Functions from QCD Vacuum Topology","authors":"Wei-Yang Liu, Ismail Zahed","score":5.5,"section":"replacement","rank":19,"parts":[0.11,0.03,0.05,0.0,0.0],"note":"Also cites widely used network papers: [[1688995]], [[2817040]]. Closest of your papers: [[1679809]] (coupling 0.01, 1 shared references). Closest network paper: [[2946993]] (coupling 0.02, 6 shared references).","abstract":"Instantons, as topologically nontrivial gauge field configurations, provide a microscopic mechanism for chiral symmetry breaking and the $U_A(1)$ anomaly in QCD. Within the instanton liquid model (ILM), instantons generate multi-fermion interactions governed by their density and size. Using this framework, we develop a microscopic description of the nucleon based on instanton-induced quark--quark correlations. We derive the diquark interaction kernels arising from single instantons and instanton--anti-instanton molecules, revealing a strong attraction in the scalar channel and weaker correlations in the spin-one channels. Embedding these interactions in a covariant, permutation-symmetric Bethe--Salpeter--Faddeev equation yields a nucleon mass $m_N=939.53~{\\rm MeV}$, with a predominantly scalar-diquark component ($98\\%$) and a small axial-vector admixture ($2\\%$) around the mass pole. Despite its small weight, the small admixture generates substantial spin--isospin interference, yielding an axial charge $g_A=1.265$, close to experiment. The resulting covariant amplitude is analytically continued to the light front to obtain the leading three-quark wave function. The corresponding unpolarized, helicity, and transversity parton distributions, along with their QCD-evolved moments, provide a direct connection to lattice QCD calculations and global-fit analyses. Our results show that the topology of the QCD vacuum organizes not only the nucleon mass and spin structure, but also its leading valence partonic content, providing a microscopic foundation for a more complete description including confinement and higher Fock components."},{"arxiv":"2610.41473","id":"3221608","title":"Probing dark sector with decihertz gravitational wave observations of compact binary inspirals in IndIGO-D","authors":"Divya Tahelyani, Abhishek Sharma, Anand S. Sengupta, Arpan Bhattacharyya","score":5.1,"section":"cross","rank":20,"parts":[0.0,0.06,0.12,0.0,0.15],"note":"Closest of your papers: [[1746620]] (coupling 0.02, 4 shared references). Closest network paper: [[1844771]] (coupling 0.04, 3 shared references).","abstract":"We investigate the potential of decihertz gravitational-wave (GW) observations of compact-binary inspirals to probe atomic dark matter (aDM) and its interactions through an ultralight massive dark photon. We consider a scenario in which neutron stars accumulate DM charged under a dark Abelian massive vector mediator, leading to an additional long-range Yukawa interaction between compact objects and associated dipolar radiation. In this framework, the GW waveform acquires characteristic corrections parameterized by the Yukawa coupling strength $α$, the dipole-radiation parameter $γ$, and a parameter related to the mediator mass $μ$. These corrections include a leading $-1$ post-Newtonian dipole contribution and finite-mediator-mass effects. We relate the aDM corrections to existing parameterized tests of general relativity and perform Bayesian parameter-estimation analyses for simulated binary neutron star (BNS) and neutron star-black hole (NSBH) systems incorporating the modified binary inspiral in a proposed space-based decihertz detector, named IndIGO-D. For a GW170817-like BNS with nonzero aDM couplings chosen near current observational bounds, we find that the dark-photon rest energy can be inferred with a $90\\%$ credible uncertainty of $O(10^{-20})\\,\\mathrm{eV}$, conditional on a detectable dark-sector contribution. Analyses with weaker dark-sector interactions $(α\\lesssim O(10^{-8}))$ show that the mediator mass remains unconstrained when both the Yukawa coupling and dipole-radiation contribution are negligible, but can be measured even for a negligible Yukawa coupling if the dipole-radiation contribution is sufficiently strong. Our results demonstrate that future decihertz GW observatories can serve as powerful laboratories for testing dark-sector physics and probing dark matter interactions in compact binaries through precision GW measurements."},{"arxiv":"2608.01272","id":"3186440","title":"Properties of the $D_{s0}^*(2317)^\\pm$ in hot and dense nuclear matter","authors":"Tomona Kinugawa, Àngels Ramos, Laura Tolos","score":5.1,"section":"replacement","rank":21,"parts":[0.06,0.03,0.14,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1741056]] (coupling 0.01, 1 shared references). Closest network paper: [[1710056]] (coupling 0.05, 19 shared references).","abstract":"We investigate the properties of the $D_{s0}^\\ast(2317)^\\pm$ in hot and dense nuclear matter using a coupled-channel molecular model built on next-to-leading-order heavy meson chiral perturbation theory. In-medium modifications to the $D_{s0}^\\ast(2317)^+$ stem from changes to the $DK$ channel within the coupled $DK$-$D_s η$ system. As nuclear density increases, the $D_{s0}^\\ast(2317)^+$ quasiparticle peak shifts toward lower energies and broadens, tracking the behavior of the $D$-meson spectral function. As for temperature effects, those are milder, with the thermal smearing of the Fermi surface and the melting of $Σ_c N^{-1}$ excitations in the $D$-meson spectral function shifting the $D_{s0}^\\ast(2317)^+$ peak back toward its free-space mass while narrowing it. Conversely, the behavior of the $D_{s0}^\\ast(2317)^-$ is governed by the $\\bar D \\bar K$ channel and its medium behavior is driven by the $\\bar K$ spectral function. With increasing temperature, the $D_{s0}^\\ast(2317)^-$ also approaches its free-space mass, but its width broadens before saturating at high temperatures. Incorporating explicit medium dependencies into the interaction kernel, driven by density and/or temperature variations in the pion decay constant, further shifts the $D_{s0}^\\ast(2317)^+$ mass lower and narrows its width with temperature. As for $D_{s0}^\\ast(2317)^-$, its mass also drops with temperature but its width increases. These contrasting medium behaviors offer a promising pathway to constrain the internal structure of these exotic states."},{"arxiv":"2610.04909","id":"3211566","title":"The Phenomenology of the Dark Dimension and Non-Supersymmetric Strings","authors":"Cumrun Vafa","score":5.1,"section":"replacement","rank":22,"parts":[0.0,0.0,0.01,0.0,0.49],"note":"Closest network paper: [[2744388]] (coupling 0.01, 1 shared references). Shared topics: neutrino mass, gauge symmetry.","abstract":"Swampland principles, combined with the smallness of dark energy $Λ$, lead to the dark dimension scenario, with one extra dimension of micron size. We review this scenario and its predictions: KK graviton dark matter (or the KK tower of the quintessence field into which the gravitons convert), neutrino masses tied to $Λ^{1/4}$ via a bulk $B-L$ gauge symmetry, QCD axion decay constant $f_a\\sim Λ^{1/12}\\sim 10^9-10^{10}$ GeV at the 5d Planck scale $M_5$, connecting electroweak hierarchy to $Λ^{1/6}$, and a relation between the GUT and weak scales with $M_5$ as the geometric mean. The dark dimension also provides a concrete realization of an evolving dark sector: the evolution of its diameter correlates the variation of dark energy with that of the dark matter mass, fitting the recent DESI DR2 (+CMB+supernovae) data while avoiding the phantom crossing that the $w_0w_a$CDM parametrization would suggest---the apparent phantom behavior instead arises from the evolving dark matter mass. The fits suggest that the dark energy field sits in the interior of moduli space, near an unstable critical point. Motivated by this, we review recent progress on non-supersymmetric string vacua: isolated critical points protected by duality symmetries, in non-geometric flux compactifications and in Scherk--Schwarz compactifications of M-theory, and an emerging duality web for non-supersymmetric strings. This note is based on two talks given by the author at String Phenomenology 2026 (Paris) and Strings 2026 (Shanghai)."},{"arxiv":"2610.40781","id":"3221086","title":"Leaking Sound Waves: Gravitational Waves From Dark Sectors Weakly Coupled to the Standard Model","authors":"Marco Finetti, Helena Kolešová, Daniil Krichevskiy","score":4.6,"section":"cross","rank":23,"parts":[0.0,0.0,0.31,0.0,0.0],"note":"Closest network paper: [[2807770]] (coupling 0.11, 9 shared references).","abstract":"First-order phase transitions in a dark sector can produce an observable stochastic gravitational-wave background, and many models predicting such signals in current and future experiments have been explored. For moderately strong transitions, hydrodynamical simulations suggest that sound waves generated by the expansion and collisions of true-vacuum bubbles are the dominant source of gravitational waves. It is often assumed that these sound waves propagate only within the dark-sector fluid, while the impact of the visible sector is neglected. In this paper, we investigate the effects of a weak coupling between the dark and visible fluids on the resulting gravitational-wave signal. We adopt a phenomenological hydrodynamical description of two ultra-relativistic fluids, parametrizing their interactions without specifying an underlying microscopic model. We focus on the regime in which the coupling can be neglected during the phase transition but becomes relevant during the subsequent, longer-lasting period of sound wave propagation. Within this framework, we analytically show that, even if the bubble expansion initially affects only the dark fluid, sound waves can subsequently be induced in the visible sector. Using the sound-shell model, we find that, despite the additional sound waves generated in the visible sector, the total gravitational-wave signal sourced by both fluids is generally suppressed compared to the case of a completely decoupled dark sector. This suppression becomes more pronounced for larger interaction rates and a larger ratio of relativistic degrees of freedom in the visible sector to those in the dark sector. The coupling also modifies the shape of the gravitational-wave spectrum."},{"arxiv":"2603.28805","id":"3137663","title":"Determining G with Laser Spectroscopy to 38 ppb","authors":"Noah Bray-Ali","score":4.6,"section":"replacement","rank":24,"parts":[0.0,0.11,0.09,0.0,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.04, 2 shared references). Closest network paper: [[2775818]] (coupling 0.03, 2 shared references).","abstract":"A precision measurement is proposed to determine, in a couple hours of integration time, the axion Compton frequency using a modest power (3 mW) tunable external cavity diode laser at 2458 nm as input to drive a free space tabletop Mach Zehnder interferometer whose sensing arm passes the expanded beam waist (3 mm) light beam through a 1 T strong, 40 cm long dipole magnetic field created by a custom built permanent magnet assembly with a large but achievable (6 mm) gap between poles. As the laser frequency is slowly modulated at 1 kHz through a 600 MHz wide window that is well within the 30 GHz fine tuning range of the laser, a small but readily observable modulation appears in the dark port optical power of the dark fringe phase locked interferometer due to photons converting into axions within the light beam as it passes through the magnetic field. Measuring the axion Compton frequency, around 122 THz, where the dark port power modulation peaks, to within the linewidth of the laser, about 1 MHz, then determines G to 38 parts per billion (ppb), a roughly 600 fold improvement, through a relation between the axion Compton frequency and G, involving h, c, and nucleon masses."},{"arxiv":"2208.01640","id":"2131795","title":"Searching for Ultra-Light Axions with Twisted Cavity Resonators of Anyon Rotational Symmetry with Bulk Modes of Non-Zero Helicity","authors":"J. F. Bourhill, E. C. I. Paterson, M. Goryachev, M. E. Tobar","score":4.5,"section":"replacement","rank":25,"parts":[0.0,0.09,0.13,0.0,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.03, 3 shared references). Closest network paper: [[1861353]] (coupling 0.05, 5 shared references).","abstract":"Möbius-ring resonators stem from a well-studied geometrical structure with a one-sided topology, the Möbius strip, and have been shown to exhibit fermion rotational symmetry with respect to an untwisted ring resonator, which exhibits boson rotational symmetry [1]. Here, we present twisted hollow resonators with equilateral triangular cross-sections, leading to cavities with anyon rotational symmetry. Unlike conventional cavity resonators, these structures permit bulk resonant modes with a non-zero complex electromagnetic overlap $\\mathcal C_p=\\int_V\\mathbf{E}_p\\cdot\\mathbf{B}_p^*\\,dτ$. The real and imaginary parts of this overlap couple to different observable quadratures. Although the negative-frequency component of a real axion field is immaterial for haloscopes employing a static DC magnetic field, it must be retained for a pumped resonator because the complex forms of Maxwell's equations differ for positive and negative frequencies and produce distinct upper and lower mixing branches. Retaining both branches shows that the real overlap produces amplitude-modulated sidebands, whereas the imaginary helicity of the modes studied here produces phase-modulated sidebands through the axion-photon chiral anomaly. A sensitive ultra-light dark-matter experiment may therefore be realised with an ultra-stable oscillator and a phase-sensitive readout. The sensitivity curves calculated here require the assumed noise floor to be interpreted as phase-modulation noise rather than amplitude-modulation noise, and consequently require sufficiently low residual oscillator phase noise at the axion Fourier frequency. The scheme removes the usual requirement for an external magnetic field and permits superconducting resonators with reduced surface loss and enhanced axion sensitivity."},{"arxiv":"2610.41823","id":"3221665","title":"Primordial black holes and gravitational waves from aligned axion inflation","authors":"Nadir Ijaz","score":3.5,"section":"cross","rank":26,"parts":[0.0,0.02,0.2,0.0,0.0],"note":"Closest of your papers: [[926166]] (coupling 0.01, 1 shared references). Closest network paper: [[2693756]] (coupling 0.07, 9 shared references).","abstract":"We study the production of primordial black holes (PBHs) and scalar-induced gravitational waves (SIGWs) in aligned axion inflation through the transition between two stages of inflation. The first stage proceeds along a metastable trajectory and ends when this trajectory loses stability, causing the fields to turn towards the attractor of the second inflationary stage. During the transition, coupled adiabatic--entropy evolution produces a localized enhancement of the curvature power spectrum. We compute the PBH abundance from this spectrum assuming Gaussian primordial curvature perturbations and using the nonlinear compaction-function formalism with a spectrum-dependent collapse threshold and critical collapse. Representative benchmark solutions yield asteroid-mass PBHs with a potentially significant dark-matter abundance, together with an associated SIGW background."},{"arxiv":"2606.21152","id":"3170901","title":"Spin correlations and quantum entanglement in $γγ\\to t\\bar t$ at polarized photon colliders with NLO QCD corrections","authors":"Jun Jiang, Zong-Guo Si, Han Zhang, Xin-Yi Zhang","score":3.4,"section":"replacement","rank":27,"parts":[0.06,0.01,0.06,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.00, 1 shared references). Closest network paper: [[3193100]] (coupling 0.02, 17 shared references).","abstract":"We study spin correlations and quantum entanglement in the process $γγ\\to t\\bar t$ with the photons coming from Compton backscattered laser beam. We present predictions for the cross sections and spin observables including next-to-leading order (NLO) QCD corrections under various beam-polarization configurations. The NLO QCD corrections significantly enhance the total cross section while having only a minor impact on spin observables. Using the spin density matrix of the $t\\bar t$ system, we further investigate quantum entanglement and Bell nonlocality. We find that the entanglement is the strongest near the $t\\bar t$ invariant-mass threshold, while both entanglement and Bell nonlocality are highly sensitive to the initial beam polarization. Our results provide a theoretical basis for future studies of quantum correlations in top-quark pair production at photon colliders."},{"arxiv":"2610.40775","id":"3220987","title":"On the Role of Gravity in Supercooled Phase Transitions","authors":"Filippo Cutrona, Alberto Salvio","score":3.3,"section":"new","rank":28,"parts":[0.0,0.03,0.15,0.0,0.0],"note":"Closest of your papers: [[2080612]] (coupling 0.01, 1 shared references). Closest network paper: [[2828434]] (coupling 0.05, 5 shared references).","abstract":"Theories with radiative mass generation and radiative symmetry breaking (RSB) lead to first-order phase transitions (FOPTs) and the production of gravitational waves (GWs) as well as primordial black holes if supercooling lasts long enough. Here we investigate the role of gravity in supercooled FOPTs that occur in the RSB scenario. We use a model-independent approach that is valid when a quantity (which we explicitly determine and is computable once the model is specified) is small enough. Eventually, the curvature of spacetime becomes relevant if the FOPT does not complete in the case in which gravity is ignored. We also include the effect on the FOPT of the non-minimal couplings with coefficients of zero mass dimension. Depending on such non-minimal couplings, gravity can enhance or reduce the region of parameter space where the phase transition completes. Observable consequences of the role of gravity on the FOPT that can be probed by current and future GW detectors are then worked out and we explore the possibility that the background of GWs detected by pulsar timing arrays is produced by FOPTs in the RSB scenario. We also estimate the number of e-folds that elapse when the field playing the role of the order parameter is trapped in the false vacuum, which provides important information for cosmology."}],"rest":[{"arxiv":"2610.41078","title":"Pure annihilation decay $B_c^+ \\to ST$ with improved perturbative QCD formalism","score":3.3,"section":"new","rank":29},{"arxiv":"2512.18866","title":"Partial Next-to-Next-to-Leading-Order Corrections to the $B \\to π$ Form Factors from Light-Cone Sum Rules","score":3.3,"section":"replacement","rank":30},{"arxiv":"2605.07095","title":"Baryon Bethe-Salpeter Equation in Minkowski-Space QCD$_   const cut=nmin!=null?X.findIndex(n=>n.score<nmin):-1;
  box.innerHTML=X.map((n,i)=>(i===cut?`<li class="divider">Below ${nmin}: weaker relation (most of these share no specific reference, coupling or topic with your work)</li>`:'')+`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
// the rest of the day's papers by score: only the title, linked to the arXiv record
function restList(){const X=RAW.rest||[];if(!X.length)return;const d=document.getElementById('rest'),box=document.getElementById('restlist');
  d.hidden=false;d.querySelector('summary').firstChild.textContent=`All other ${X.length} papers in this listing `;
  document.getElementById('restsub').textContent='by score, title only';
  box.innerHTML=X.map(n=>`<li><span class="sc">#${n.rank} · ${n.score.toFixed(1)}</span><a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">${esc(n.title)}</a></li>`).join('');
  d.addEventListener('toggle',()=>{if(d.open)tex(box)})}
list();nextList();restList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
