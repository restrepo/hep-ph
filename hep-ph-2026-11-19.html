<script>
const RAW = {"n":[{"id":"3113252","arxiv":"2601.22740","title":"Radiative Dirac Neutrino Masses from Modular $S_3$ Symmetry in an Axion Model","first":"Kang","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 16 network papers: [[2877739]], [[2963992]], [[2963338]], [[2931725]], [[2697191]], [[2871910]]…. Also cites widely used network papers: [[1688995]]. Closest of your papers: [[1607572]] (coupling 0.04, 6 shared references). Closest network paper: [[2697191]] (coupling 0.18, 27 shared references). Shared topics: dirac neutrino mass, radiative neutrino mass, lepton flavor violation, neutrino mass, mass matrix.","score":55.9,"rank":1,"section":"replacement","parts":[1.0,0.12,0.52,0.0,0.94],"abstract":"We present a unified axion model framework that simultaneously addresses the origin of neutrino masses, leptonic flavor structure, the strong CP problem, and dark matter. The model is based on a global $U(1)_{\\rm PQ}$ symmetry combined with a modular $S_3$ symmetry and is realized within a novel class of KSVZ-type axion model. Exotic colored fermions and scalars mediate radiative neutrino mass generation at the one loop-level. The PQ charge assignment forbids tree-level neutrino masses and leaves a residual $Z_3$ symmetry that ensures the Dirac nature of neutrinos. In the minimal realization, the neutrino mass matrix is of rank two, predicting one massless neutrino. Consequently, the sum of neutrino masses is constrained for both the normal and inverted hierarchies. We analyze the implications for charged lepton flavor violation and the lepton $g-2$. The axion emerging from this framework dynamically resolves the strong CP problem and accounts for the observed dark matter abundance. Notably, the predicted axion-photon coupling is within reach of upcoming experiments and consistent with existing astrophysical and cosmological bounds.","authors":"Sin Kyu Kang, Ranjeet Kumar, Hiroshi Okada","nlinked":157,"nref":158,"src":"INSPIRE","html":true},{"id":"3225739","arxiv":"2611.09478","title":"An interrelation of three neutrino mixing angles","first":"Xing","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[3193100]], [[2762216]]. Closest of your papers: [[1854224]] (coupling 0.02, 1 shared references). Closest network paper: [[2762216]] (coupling 0.07, 10 shared references). Shared topics: neutrino mixing angle.","score":30.8,"rank":2,"section":"replacement","parts":[0.7,0.06,0.19,0.0,0.18],"abstract":"We conjecture a novel interrelation of three neutrino mixing angles: $θ^{}_{23} = \\left(θ^{}_{12} + θ^{}_{13}\\right)/2 + π/8$, which predicts $θ^{}_{23} = 43.46^\\circ \\pm 0.26^\\circ$ with inputs of the latest JUNO and Daya Bay precision data. A simple ansatz is proposed to derive this phenomenologically favored and experimentally testable angle relation, and a new expansion of the lepton flavor mixing matrix in powers of a single small parameter is presented as a by-product.","authors":"Zhi-zhong Xing","nlinked":26,"nref":26,"src":"INSPIRE","html":true},{"id":"3195622","arxiv":"2608.23713","title":"Soft Scale Symmetry Breaking with Laguerre Explicit Regulators","first":"Vieira","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[3193100]], [[582695]]. Closest of your papers: [[617551]] (coupling 0.01, 1 shared references). Closest network paper: [[3213801]] (coupling 0.03, 5 shared references).","score":26.9,"rank":3,"section":"replacement","parts":[0.7,0.03,0.09,0.0,0.01],"abstract":"In this work, we search for explicit regulators that do not spuriously break scale invariance starting from conditions established by implicit regularization. There is a family of regulator functions that obeys the conditions and leads to soft breaking terms of the dilatation current. This family of functions is shown to be related to the Laguerre polynomials. We apply this approach by revisiting quadratic divergences in the context of the naturalness problem of the Standard Model and show that the quadratic dependence of the Higgs mass on the cutoff is not required by consistency of scale-symmetry breaking and can be removed within this class of regulators. Applications of these regulators beyond 1-loop order are also considered.","authors":"A. R. Vieira","nlinked":54,"nref":54,"src":"INSPIRE","html":true},{"id":"3230948","arxiv":"2611.24241","title":"Search for Heavy Charged Higgs Bosons in Boosted Top and Bottom Quark Final States at a 1.4 TeV Future Lepton Collider","first":"Hashemi","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[822544]]. Also cites widely used network papers: [[902365]]. Closest of your papers: [[1116165]] (coupling 0.05, 2 shared references). Closest network paper: [[1224299]] (coupling 0.10, 10 shared references).","score":26.7,"rank":4,"section":"new","parts":[0.48,0.15,0.3,0.0,0.07],"abstract":"The discovery potential for heavy charged Higgs bosons $H^\\pm$ decaying into a top-bottom quark pair is investigated at a future $e^+e^-$ collider operating at $\\sqrt{s}=1.4~\\mathrm{TeV}$. The study considers charged Higgs masses between 200 and 600 GeV within all four Yukawa types of the two-Higgs-doublet model (2HDM). The boosted $tb$ final state is explored using complementary cut-based and machine-learning analyses based on boosted decision trees (BDT). The expected signal significance and sensitivity contours in the $(m_{H^\\pm},\\tanβ)$ plane are obtained for each Yukawa type. The resulting sensitivity extends to regions of the 2HDM parameter space beyond the projected reach of the High-Luminosity LHC (HL-LHC), demonstrating the complementary potential of a future high-energy lepton collider to probe heavy charged Higgs bosons.","authors":"Majid Hashemi","nlinked":50,"nref":53,"src":"INSPIRE","html":true},{"id":"3115088","arxiv":"2602.03384","title":"Asymmetric dark matter from leptogenesis in type-III seesaw framework with modular $S_4$ symmetry","first":"Abhishek","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[779828]]. Closest of your papers: [[922002]] (coupling 0.04, 2 shared references). Closest network paper: [[3148101]] (coupling 0.13, 8 shared references). Shared topics: neutrino oscillation data, relic density, neutrino mass, seesaw mechanism, majorana mass.","score":19.6,"rank":5,"section":"replacement","parts":[0.06,0.1,0.37,0.0,0.89],"abstract":"We present a unified framework for neutrino masses, baryogenesis, and dark matter based on a modular $S_4$ symmetry combined with a type-III seesaw mechanism. All Yukawa couplings, CP phases, and flavor textures originate from a single complex modulus $τ$, whose vacuum expectation value controls both visible and dark sector dynamics. The same modular parameter fixes the neutrino mass matrix, determines the CP asymmetries driving resonant leptogenesis, and correlates the resulting baryon and dark matter abundances. A detailed numerical analysis shows that the model reproduces all neutrino oscillation data within the $3σ$ NuFIT~5.2 (2024) ranges for normal ordering, predicting $δ_{\\rm CP} \\simeq \\pm (150^\\circ-180^\\circ)$, $\\sum m_ν\\simeq(0.06-0.08)~\\mathrm{eV}$, and an effective Majorana mass $m_{ββ} \\simeq (0.3 - 4)\\times 10^{-3}~\\mathrm{eV}$, testable in next-generation neutrinoless double-beta decay experiments. The same modular Yukawas yield resonantly enhanced CP asymmetries $|ε_{L,χ}| \\sim 10^{-9}-10^{-6}$ at $M_Σ\\sim 10^{7}~\\mathrm{GeV}$, successfully generating the observed baryon asymmetry $η_B\\simeq6\\times10^{-10}$ and dark relic density $Ω_χh^2\\simeq0.12$ without additional free parameters. The predicted correlation $Ω_χ/Ω_B\\simeq5.4$ fixes the dark matter mass to $m_χ\\simeq0.1-2~\\mathrm{GeV}$, consistent with all current constraints. This framework therefore realizes a fully predictive baryon$-$dark matter co-genesis, where the geometry of the modular symmetry links the origin of flavor, CP violation, and the cosmic matter asymmetry.","authors":" Abhishek, V. Suryanarayana Mummidi","nlinked":44,"nref":44,"src":"INSPIRE","html":true},{"id":"3231110","arxiv":"2611.24694","title":"Pole parameters of the $f_2(1270)$ and $f_2'(1525)$ from a coupled-channel analysis of the radiative $J/ψ$ multipoles","first":"Danilkin","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.00, 1 shared references). Closest network paper: [[3193100]] (coupling 0.02, 18 shared references).","score":18.3,"rank":6,"section":"new","parts":[0.48,0.01,0.06,0.0,0.0],"abstract":"We determine the pole parameters of $f_2(1270)$ and $f_2'(1525)$ from the combined fit to the isoscalar $D$-wave $ππ$ phase shift, the $ππ\\to K\\bar K$ modulus, and the BESIII $J/ψ\\toγπ^0π^0$ and $γK_SK_S$ data: all three $2^{++}$ multipoles $E1$, $M2$ and $E3$, and the $M2$-$E1$ phases. The hadronic amplitude is a two-channel $K$-matrix with two poles and all parameters free, so that no resonance information is taken from the Particle Data Group. The radiative decay amplitudes are written as a coupled-channel Muskhelishvili-Omnès representation, with the Omnès matrix generated by that hadronic amplitude. The left-hand cuts, which carry the production dynamics, are approximated by a linear subtraction polynomial in the physical region. The model-independent kinematic constraints among the $J=2$ helicity amplitudes are implemented explicitly. The fit describes all $358$ points with $χ^2/N=1.29$ and gives $\\sqrt{s_p}=(1267.5\\pm1.3\\pm2.6)-i\\,\\frac{1}{2}\\,(175.5\\pm2.4\\pm7.4)\\ \\mathrm{MeV}$ for the $f_2(1270)$ and $(1514.8\\pm2.8\\pm1.5)-i\\,\\frac{1}{2}\\,(80.4\\pm3.4\\pm4.8)\\ \\mathrm{MeV}$ for the $f_2'(1525)$, where the first uncertainty is statistical, from a parametric bootstrap with the data errors rescaled by $\\sqrt{χ^2/N}$ of each set, and the second systematic, from $17$ variations of the analysis.","authors":"Igor Danilkin, David Baron, Emilie Passemar, Marc Vanderhaeghen","nlinked":46,"nref":50,"src":"INSPIRE","html":true},{"id":"3230863","arxiv":"2611.24344","title":"Doubly heavy open--flavor tetraquarks within the relativistic quark model","first":"Galkin","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[1710056]] (coupling 0.04, 17 shared references).","score":17.4,"rank":7,"section":"new","parts":[0.45,0.0,0.1,0.0,0.0],"abstract":"Mass spectra of the ground, orbitally and radially excited states of doubly heavy open--flavor tetraquarks are calculated within the relativistic quark model based on the quasipotential approach and quantum chromodynamics. Tetraquarks are considered as bound states of a heavy diquark $\\mathrm{QQ^{\\prime}}$ ($\\mathrm{Q,Q^{\\prime} = c,b}$) and a light antidiquark $\\mathrm{\\overline{qq^{\\prime}}}$ ($\\mathrm{q,q^{\\prime} = u,d,s}$). The diquark--antidiquark interaction quasipotential includes both spin--independent and spin--dependent relativistic contributions. The finite sizes of the diquark and antidiquark are taken into account via the form factors of their interaction with gluons. Masses of the ground ($1S$) and excited ($1P$, $2S$, $1D$, $2P$, $3S$) states are calculated including the mixing of states with the same observable quantum numbers $J^{P}$ but different spins $S$. The obtained masses are compared with the lowest allowed thresholds for strong fall--apart decays into a pair of heavy--light mesons in $S$--wave. Most of the states lie significantly above these thresholds. However, several states, predominantly orbital excitations with large $J$, lie below or slightly above the corresponding thresholds and, thus, could be promising candidates for experimental observation. The number of such near--threshold states increases for tetraquarks containing bottom quarks. The predicted mass of the ground state of the $\\mathrm{cc\\overline{ud}}$ tetraquark with $J^{P}=1^{+}$ is consistent with the experimentally observed $\\mathrm{T}_{\\mathrm{cc}}(3875)^{+}$ state.","authors":"Vladimir O. Galkin, Elena M. Savchenko","nlinked":107,"nref":116,"src":"INSPIRE","html":true},{"id":"3159166","arxiv":"2605.25918","title":"Predicted Exotic Doubly Heavy-Strange Pentaquarks","first":"Feijoo","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[1710056]] (coupling 0.03, 12 shared references).","score":17.0,"rank":8,"section":"replacement","parts":[0.45,0.0,0.08,0.0,0.0],"abstract":"We predict exotic doubly heavy--strange pentaquarks with minimal quark content $u\\bar d sQQ'$ ($QQ'=cc,bc,bb$) within a coupled-channel unitary framework where the interaction is derived from an extension of the local hidden gauge approach to the heavy-quark sector. We obtain a robust spectrum of manifestly exotic states; two states appear in the $u\\bar d scc$ sector, three in $u\\bar d scb$, and two in $u\\bar d sbb$. These emerge either as bound states or resonances, along with seven additional virtual states manifested as threshold cusps. The binding mechanism is dominated by off-diagonal transitions among heavy-baryon--light-meson channels, while diagonal interactions are strongly suppressed. These results extend exotic hadron spectroscopy into the doubly heavy--strange sector and provide concrete targets for future experimental searches.","authors":"Albert Feijoo, Eulogio Oset","nlinked":86,"nref":87,"src":"INSPIRE","html":true},{"id":"3230853","arxiv":"2611.23984","title":"Role of excited hyperons in $K^{*}Ξ$ production via $K^{-}N$ scattering","first":"Ma","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3227657]] (coupling 0.01, 1 shared references).","score":16.4,"rank":9,"section":"new","parts":[0.45,0.0,0.04,0.0,0.0],"abstract":"We investigate the production mechanism of $K^-N\\to K^*Ξ$ and the role of high-mass excited hyperons within an effective Lagrangian approach, using a combined fit to cross section and polarization data for $K^-p\\to K^{*+}Ξ^-$. The model includes $s$- and $u$-channel exchanges of the ground-state $Λ$ and $Σ$ hyperons, together with $s$-channel contributions from $Λ(2325)$ and $Σ(2230)$. The pronounced near-threshold enhancement of the total cross section is driven mainly by these excited hyperons, whereas $u$-channel exchange dominates at backward angles at higher energies. Polarization results show that both the $K^*$ spin-density matrix elements and the $Ξ$ recoil polarization are sensitive to excited-hyperon contributions near threshold. Notably, the latter remains sensitive to interference involving excited-hyperon amplitudes even at higher energies. Moreover, with the same fitted parameters and no additional free parameters, the predicted cross sections for $K^-p\\to K^{*0}Ξ^0$ and $K^-n\\to K^{*0}Ξ^-$ agree well with available measurements. Finally, a Dalitz analysis of $K^-p \\to K^{*+}Ξ^- \\to KπΞ^-$, together with existing $KπΞ^-$ cross section data, indicates the feasibility of reconstructing $K^{*+}Ξ^-$ through this final state. These results suggest that $K^*Ξ$ production provides a valuable reaction channel for investigating high-mass excited hyperons and their hadronic couplings, and offers theoretical guidance for future experimental measurements.","authors":"Si-Yu Ma, Xiao-Yun Wang","nlinked":55,"nref":56,"src":"INSPIRE","html":true},{"id":"3230802","arxiv":"2611.23922","title":"Gravitational Form Factors and Transverse Mechanical Structure of the Charged Kaon in a Two-Fock-Sector Light-Front Hamiltonian","first":"Thakuria","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3227657]] (coupling 0.01, 1 shared references).","score":16.3,"rank":10,"section":"new","parts":[0.45,0.0,0.03,0.0,0.0],"abstract":"We study the electromagnetic and gravitational form factors of the charged kaon in a light-front Hamiltonian model with coupled $|u\\bar s\\rangle$ and $|u\\bar s g\\rangle$ Fock sectors. We solve the coupled Hamiltonian in a longitudinal Jacobi and transverse harmonic-oscillator basis, with the interaction strength fixed by the kaon mass. The momentum form factors are extracted from $T^{++}$, while the stress form factors are obtained from the transverse shear projection of the QCD Belinfante energy-momentum tensor, including diagonal, sector-changing, and constrained-field contributions. The strange antiquark carries the largest fraction of the kaon's longitudinal momentum, whereas the gluon carries only $2.05\\%$. Despite this small momentum fraction, the gluon contributes $42.4\\%$ of $|D_K(0)|$, for which we obtain $D_K(0)=-2.03610$. The charge and transverse momentum radii are $0.5178\\pm0.0278\\,\\mathrm{fm}$ and $0.3394\\pm0.0113\\,\\mathrm{fm}$, respectively, with uncertainties estimated from mass and basis variations. We obtain the transverse mechanical distributions using two ultraviolet continuations of the directly calculated $D$ form factors beyond $Q^2=2\\,\\mathrm{GeV}^2$. Both continuations give positive pressure at small transverse distances and negative pressure at larger distances. The corresponding transverse mechanical radii are $0.4616\\pm0.0130\\,\\mathrm{fm}$ and $0.4768\\pm0.0132\\,\\mathrm{fm}$, both larger than the transverse momentum radius. The central pressure changes substantially between the two continuations, whereas the pressure zero and mechanical radii vary much less.","authors":"Parashmani Thakuria, Madhurjya Lalung, Jayanta Kumar Sarma","nlinked":79,"nref":85,"src":"INSPIRE","html":true},{"id":"3231108","arxiv":"2611.24671","title":"A New GUT","first":"Agrawal","nauth":3,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Reig. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1663960]] (coupling 0.03, 1 shared references). Closest network paper: [[1966767]] (coupling 0.09, 15 shared references).","score":13.2,"rank":11,"section":"new","parts":[0.06,0.08,0.25,0.5,0.0],"abstract":"We present a new class of 4-dimensional Grand Unified Theories where the gauge sectors of the standard model have a novel embedding in the unified group that does not factor through an $SU(5)$ subgroup. The smallest example has gauge algebra $\\frak{su}(12)$ and an anomaly-free spectrum that produces the three standard model generations with no additional chiral matter. The embedding predicts the axion-photon anomaly ratio $E/N=2/3$ and the weak mixing angle $\\sin^2θ_W=1/2$ at the unification scale. Gauge-mediated proton decay proceeds through flipped-$SU(5)$-like operators and the minimally charged smooth monopole carries two Dirac charge units. The global gauge group can be $SU(12)$ or $SU(12)/\\mathbb{Z}_2$, with the former allowing color singlets of half-integer electric charge. We develop a GUT bootstrap to constrain $SU(n)$ embeddings with three generations and no additional chiral matter. For unified fermions in up to two-index representations, we prove that all new embeddings arise from the $SU(8m+4)$ family, including flavor unified models for $m \\geq 2$.","authors":"Prateek Agrawal, Michael Nee, Mario Reig","nlinked":51,"nref":56,"src":"INSPIRE","html":true},{"id":"3225702","arxiv":"2611.09106","title":"Probing Dark Matter via the Migdal Effect in LUX-ZEPLIN Data","first":"Yu","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[1741056]] (coupling 0.07, 5 shared references). Closest network paper: [[2890702]] (coupling 0.10, 17 shared references).","score":11.0,"rank":12,"section":"replacement","parts":[0.0,0.2,0.28,0.0,0.07],"abstract":"Sub-GeV dark matter (DM) particles deposit little energy in conventional direct-detection experiments and are therefore difficult to probe, but the Migdal effect provides an electronic signal from atomic ionization accompanying the recoil. Using the new results of the LUX-ZEPLIN experiment with a 4.2 tonne-year exposure, we evaluate the sensitivity of the Migdal effect to the spin-independent DM--nucleon scattering cross section. For masses between $350~\\mathrm{MeV}$ and $10~\\mathrm{GeV}$, the projected 90\\% upper limits range from $6.5\\times10^{-37}$ to $3.1\\times10^{-43}~\\mathrm{cm^2}$. These limits are then used to constrain the minimal scalar- and vector-mediator DM models. For the light-mediator DM model, the constraint on the coupling reaches $α\\simeq 10^{-12}$, which is stronger than or comparable to the constraints from kaon decays, stellar cooling, and SN1987A.","authors":"Yang Yu, Lei Feng","nlinked":47,"nref":48,"src":"INSPIRE","html":true},{"id":"1741056","arxiv":"1906.09685","title":"Singlet-Doublet Dirac Dark Matter and Neutrino Masses","first":"Restrepo","nauth":3,"year":2019,"cites":24,"role":"seed","note":"","score":null},{"id":"2963992","arxiv":"2508.18713","title":"<math display=\"inline\"><msub><mi>Z<\/mi><mn>4<\/mn><\/msub><\/math> scotogenic model with a Higgs portal","first":"Jobu","nauth":2,"year":2025,"cites":3,"role":"other","note":"","score":null},{"id":"1710056","arxiv":"1812.07638","title":"Report from Working Group 4","first":"Cerri","nauth":303,"year":2018,"cites":322,"role":"other","note":"","score":null},{"id":"1607572","arxiv":"1706.08240","title":"Anomalous leptonic U(1) symmetry: Syndetic origin of the QCD axion, weak-scale dark matter, and radiative neutrino mass","first":"Ma","nauth":3,"year":2017,"cites":22,"role":"seed","note":"","score":null},{"id":"3193100","arxiv":"","title":"Review of Particle Physics","first":"Takahashi","nauth":259,"year":2026,"cites":493,"role":"other","note":"","score":null},{"id":"2793703","arxiv":"2406.00188","title":"Cutting the scotogenic loop: adding flavor to dark matter","first":"Kumar","nauth":3,"year":2024,"cites":29,"role":"other","note":"","score":null},{"id":"1923685","arxiv":"2109.08394","title":"Multi-Higgs Models: model \mathtt{C}_{\\mathtt{W}}$ masked around the clusters, $5.7σ$ if also combined with $\\mathtt{S}_3$), and 74-75 GeV: a triplet not only rare ($3.5σ$) but also forming a $\\{70,74\\}$ GeV nonad ($3.4σ$; strengthening to $4.0σ$, $4.6σ$, and $6.1σ$, respectively). The spectral features, robust in and out of the $\\mathtt{C}_{\\mathtt{W}}$ region and $\\mathtt{S}_3$ clusters, appear in all Galactic quadrants and only in the cluster rest frame (vanishing upon redshift rescaling or permutation), fade away from cluster centers, are absent from their surrounding stacked fields, and like $\\mathtt{C}_{\\mathtt{W}}$ indicate intrinsic few $10^{-19}$ cm$^3$ s$^{-1}$ cross sections (uncorrected) across samples. All features are largely explained by cross-annihilating $69.7^{+0.4}_{-1.0}$ and $74.5^{+1.1}_{-0.6}$ GeV WIMPs."},{"arxiv":"2605.28275","id":"3161788","title":"Dark Matter Interpretation of the Super-Kamiokande Antineutrino Excess in $\\mathrm{U}(1)_{L_μ-L_τ}$ model","authors":"Motoi Endo, Yushi Mura, Tenta Tsuji","score":9.2,"section":"replacement","rank":14,"parts":[0.0,0.06,0.23,0.0,0.4],"note":"Closest of your papers: [[2859009]] (coupling 0.02, 3 shared references). Closest network paper: [[2875244]] (coupling 0.08, 8 shared references). Shared topics: relic abundance. Your watch topics: neutrino background.","abstract":"Recent Super-Kamiokande analyses of the diffuse supernova neutrino background, based on data across all SK phases, indicate a mild preference over the zero-DSNB hypothesis at the level of about $2.3σ$ with electron-like antineutrino events at $E_{\\barν_e} \\simeq 20\\,\\mathrm{MeV}$. We investigate whether all or part of this excess can be accounted for by MeV-scale dark matter annihilation into neutrinos in a $\\mathrm{U}(1)_{L_μ-L_τ}$ model. The dark matter is a Dirac fermion with $m_χ\\simeq 22\\,\\mathrm{MeV}$ that annihilates via a light $Z'$ mediator into $ν_μ\\barν_μ$ and $ν_τ\\barν_τ$, which are partly converted into $\\barν_e$ through flavor oscillations. We find that this scenario can account for the excess, or a fraction thereof, while reproducing the observed relic abundance via thermal freeze-out. We further discuss the relevant laboratory and cosmological constraints, including neutrino trident production, NA64-$μ$, Borexino, and the contribution to $ΔN_\\mathrm{eff}$."},{"arxiv":"2511.15897","id":"3085079","title":"Exploring enhanced non-resonant di-Higgs production at the HL-LHC with neural networks","authors":"Leandro Da Rold, Manuel Epele, Anibal D. Medina, Nicolás I. Mileo, Alejandro Szynkman","score":8.0,"section":"replacement","rank":15,"parts":[0.06,0.1,0.19,0.0,0.0],"note":"Also cites widely used network papers: [[1494411]]. Closest of your papers: [[1671831]] (coupling 0.03, 6 shared references). Closest network paper: [[1494411]] (coupling 0.07, 31 shared references).","abstract":"We investigate di-Higgs production in the $b\\bar{b}γγ$ final state at the LHC, focusing on scenarios where the gluon fusion process is enhanced by new colored scalars, which could be identified as squarks or leptoquarks. We consider two benchmarks characterized by the mass of the lightest colored scalar, BM$_{\\mathrm{L}}$ and BM$_{\\mathrm{H}}$, corresponding to 464 GeV and 621 GeV, respectively. Using Monte Carlo simulations for both the signal and the dominant backgrounds, we perform a discovery analysis with deep neural networks, exploring various architectures and input variables. Our results show that the discrimination power is maximized by employing two dedicated classifiers, one trained against QCD backgrounds and another against backgrounds involving single-Higgs processes. Furthermore, we demonstrate that including high-level features -- such as the invariant masses $m_{γγ}$, $m_{bb}$, and $m_{hh}$, as well as the transverse momenta and angular separations of the photon and $b$-jet pairs -- significantly improves the performance compared to using only low-level features as the invariant mass and momenta of the final particles. For the latter case, we find that architectures processing photon and $b$-jet variables separately can enhance the significance for BM$_{\\mathrm{H}}$. Projecting for an integrated luminosity of 3 ab$^{-1}$, we obtain a significance of 7.2 for BM$_{\\mathrm{L}}$, while it drops to 3.1 for BM$_{\\mathrm{H}}$. In the particular case of BM$_{\\mathrm{L}}$, discovery level significance can be reached at 1.4 ab$^{-1}$. We also estimate how these results could be modified by potential systematic uncertainties."},{"arxiv":"2611.24091","id":"3230857","title":"Improving Sensitivity to Rare Processes at the LHC with Geodesic-Aware Graph Neural Networks","authors":"Benjamin Fuks, A. Hammad, Adil Jueid, Mihoko Nojiri","score":7.7,"section":"new","rank":16,"parts":[0.06,0.08,0.21,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1455793]] (coupling 0.03, 6 shared references). Closest network paper: [[2623950]] (coupling 0.07, 9 shared references).","abstract":"Rare processes at the Large Hadron Collider often lead to final states with quarks, for which the dominant backgrounds contain the same reconstructed objects as the signal. The colour structure of the hard process, imprinted on the pattern of soft QCD radiation, carries information that is largely left unused by standard analyses. We introduce a geometric representation of this colour flow by mapping hadronic constituents onto the unit sphere through a modified inverse stereographic projection centred on a pair of jets selected as a colour-singlet resonance candidate. The jet separation defines a circular region whose interior and exterior are mapped to opposite hemispheres, allowing a graph neural network to exploit the resulting radiation pattern using geodesic distances. As a benchmark, we consider flavour-changing neutral interactions of the top quark with the Higgs boson at $\\sqrt{s}=13.6$~TeV, through associated $tH$ production and $t\\bar t$ production with one top quark undergoing a $t\\to qH$ decay, where $q=u,c$, focusing on subsequent $H\\to b\\bar b$ and leptonically top quark decays in both channels. Relative to a baseline graph neural network operating in the $(η,φ)$ plane, the geodesic-aware network improves the expected 95\\% confidence-level limits on $\\mathrm{BR}(t\\to uH)$ and $\\mathrm{BR}(t\\to cH)$ by about an order of magnitude, to $1.1\\times10^{-4}$ and $8.3\\times10^{-5}$ for an assumed integrated luminosity of $139~\\mathrm{fb}^{-1}$. The approach can also be applied to searches for other colour-singlet resonances decaying into quarks or gluons."},{"arxiv":"2611.23978","id":"3230935","title":"Geoneutrinos (and reactor neutrinos) do not visibly decay","authors":"Mauricio Bustamante","score":7.5,"section":"new","rank":17,"parts":[0.06,0.04,0.28,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[452755]] (coupling 0.01, 1 shared references). Closest network paper: [[2052515]] (coupling 0.10, 28 shared references).","abstract":"Neutrinos that decay on their way to a detector arrive depleted, more so at low energies, where time dilation lengthens their lifetime the least. Geoneutrinos---electron antineutrinos from the radioactive decay of uranium and thorium inside the Earth---have energies of a few MeV and travel up to the diameter of the Earth. We use them to test neutrino decay for the first time. We compute the geoneutrino signal at Borexino, KamLAND, SNO+, and JUNO for visible decay, in which the daughter neutrinos are themselves detected, and compare it against their published data. We find no evidence of decay that holds across Earth models. Combining the four experiments, we limit the decay $ν_1 \\to ν_3$ in the inverted mass ordering at 90% C.L.: $τ_1/m_1 > 3.7 \\times 10^{-9}$ s eV$^{-1}$ when the radiogenic power of the Earth is left free and $τ_1/m_1 > 4.4 \\times 10^{-9}$ to $1.6 \\times 10^{-8}$ s eV$^{-1}$ when it is taken from Earth models. With an Earth model assumed, the geoneutrinos set the limit; with the power free, the antineutrinos from nuclear reactors that the same experiments detect count as much as the geoneutrinos. These are the first terrestrial limits on the visible decay of $ν_1$."},{"arxiv":"2610.12719","id":"3213657","title":"Stochastic gravitational waves from narrow-band cosmological magnetic fields","authors":"Abdias Aires, Tatsuya Daniel","score":7.1,"section":"replacement","rank":18,"parts":[0.06,0.01,0.16,0.0,0.23],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.00, 1 shared references). Closest network paper: [[2828434]] (coupling 0.06, 4 shared references). Shared topics: dark matter model.","abstract":"We calculate the spectrum of gravitational waves generated by a cosmological magnetic field with a narrow-band power spectrum. For a magnetic spectrum narrowly peaked at a comoving wavenumber $k_c$, we find that the gravitational wave signal has a maximum at $2k_c$ and, as expected from momentum conservation, has a sharp cutoff at that scale. We apply this analysis to an ultralight dark matter model of magnetogenesis operating around recombination, in which an axion-photon coupling generates a helical magnetic field by parametric resonance. We determine the conditions for the resulting gravitational waves to enter the frequency range of pulsar timing experiments. Although the required frequency can be reached for sufficiently large coupling, the corresponding amplitude is below the experimental sensitivity for physically allowed energy densities of the magnetic field. We generalize this conclusion to models of magnetogenesis operating at other epochs, estimating as $T \\simeq 160$ MeV the temperature of a magnetogenesis process assumed to be the source of the stochastic gravitational wave background suggested by pulsar timing arrays. We place the lower bound $T \\gtrsim 1$-10 MeV on such viable models."},{"arxiv":"2207.08856","id":"2116929","title":"Dimension-8 SMEFT Matching Conditions for the Low-Energy Effective Field Theory","authors":"Serge Hamoudou, Jacky Kumar, David London","score":6.6,"section":"replacement","rank":19,"parts":[0.0,0.0,0.44,0.0,0.0],"note":"Closest network paper: [[2778553]] (coupling 0.15, 15 shared references).","abstract":"In particle physics, the modern view is to categorize things in terms of effective field theories (EFTs). Above the weak scale, we have the SMEFT, formed when the heavy new physics (NP) is integrated out, and for which the Standard Model (SM) is the leading part. Below $M_W$, we have the LEFT (low-energy EFT), formed when the heavy SM particles ($W^\\pm$, $Z^0$, $H$, $t$) are also integrated out. In order to determine how low-energy measurements depend on the underlying NP, it is necessary to compute the matching conditions of LEFT operators to SMEFT operators. These matching conditions have been worked out for all LEFT operators up to dimension 6 in terms of SMEFT operators up to dimension 6 at the one-loop level. However, this is not sufficient for all low-energy observables. In this paper we present the momentum-independent matching conditions of all such LEFT operators to SMEFT operators up to dimension 8 at tree level."},{"arxiv":"2604.19864","id":"3148047","title":"Low-Multiplicity Jets as Probes of GeV-Scale Light-Quark-Coupled Particles","authors":"Carlos Henrique de Lima, David McKeen, Maximilian Swiatlowski","score":6.6,"section":"replacement","rank":20,"parts":[0.06,0.1,0.11,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2080612]] (coupling 0.03, 2 shared references). Closest network paper: [[2751564]] (coupling 0.04, 2 shared references).","abstract":"We propose a search at the LHC for GeV-scale particles coupling predominantly to light quarks based on low-multiplicity jets. The search targets production in association with a hard photon and uses the feature that a light gauge-singlet can only decay into a small number of hadronic channels, yielding jets with anomalously low charged-track multiplicity and mass compared to QCD jets at the same transverse momentum. We determine the sensitivity to scalar and pseudoscalar couplings to up-quarks, and suggest a data-driven estimate that reduces the sensitivity to jet modeling uncertainties. This search extends the reach to hadronically-coupled particles into a previously inaccessible regime."},{"arxiv":"2411.08097","id":"2848010","title":"Atomic Dark Matter, Interacting Dark Radiation, and the Hubble Tension","authors":"Manuel A. Buen-Abad, Zackaria Chacko, Ina Flood, Can Kilic, Gustavo Marques-Tavares, Taewook Youn","score":6.3,"section":"replacement","rank":21,"parts":[0.0,0.05,0.28,0.0,0.07],"note":"Closest of your papers: [[1679809]] (coupling 0.02, 1 shared references). Closest network paper: [[2051195]] (coupling 0.10, 51 shared references).","abstract":"We present a new class of interacting dark sector models that can address the Hubble tension. Interacting dark radiation (DR) has previously been put forward as a solution to the problem, but this proposal is disfavored by the high-$\\ell$ cosmic microwave background (CMB) data. We modify this basic framework by introducing a subcomponent of dark matter (DM) that interacts strongly with the DR, so that together they constitute a tightly coupled fluid at early times. We show that if this subcomponent decouples from the interacting DR during the CMB epoch, the $\\ell$ modes of the CMB that entered the horizon before decoupling are impacted differently from those that entered after, allowing a solution to the problem. We present a model that realizes this framework, which we dub \"New Atomic Dark Matter\", or nuADaM, in which the interacting dark matter (iDM) subcomponent is composed of dark atoms, and dark \"neutrinos\" with long-range interactions contribute to the DR, hence the name of the model. This iDM subcomponent is acoustic at early times but decouples from the DR following dark recombination. In contrast to conventional atomic dark matter (ADM) models, the dark photon is part of a richer DR sector, which ensures that it continues to be self-interacting even after recombination. We show that this model admits a significantly larger value of $H_0$ than $Λ\\mathrm{CDM}$ when fit to CMB and BAO data, while maintaining a comparable goodness of fit. Once the SHOES data set is included, it provides a significantly better fit than $Λ\\mathrm{CDM}$."},{"arxiv":"2611.23384","id":"3230775","title":"Capturing Ultralight Dark Matter Around Black Holes","authors":"Salvatore Bottaro, Viktor Firsov, Gilad Perez, Halil Steuer, Ofri Telem","score":6.1,"section":"new","rank":22,"parts":[0.0,0.1,0.16,0.0,0.07],"note":"Closest of your papers: [[1607572]] (coupling 0.04, 3 shared references). Closest network paper: [[2703113]] (coupling 0.06, 6 shared references).","abstract":"Ultralight dark matter (DM) can form hydrogen-like bound states around black holes (BHs), that can be perturbatively described at small gravitational fine-structure constant alpha=G*M*mu<<1, where M and mu are the masses of the BH and the DM scalar, respectively. We show that self-interactions lead to the formation of a 2p-halo around a Schwarzschild BH, with the final cloud density as high as 10^5 times the background density. We also show that for the case of a Kerr BH with a superradiant cloud, the decay of the 211 state can populate the ground state faster than it decays into the BH. Consequently, the 211 cloud mass is bounded from above by M_{211}^{crit}/M~=5*10^{-3}*alpha^{-1/2}*[f_a/10^{16} GeV]^2 up to an O(1) factor depending on the spin of the BH. Crucially, for rapidly spinning BHs with M~<4*10^6 M_{sun}, alpha~<0.03, and f_a~<9*10^{15} GeV the resulting superradiant cloud mass is lower than previously assumed, which might have an impact on axion bounds from measurements of stellar BH spins."},{"arxiv":"2611.24674","id":"3231140","title":"On the cosmic window for neutrino self-interactions","authors":"Ivan Pérez-Castro, Jorge Venzor, Josue De-Santiago, Pablo Roig, Abdel Pérez-Lorenzana","score":6.1,"section":"new","rank":23,"parts":[0.0,0.06,0.28,0.0,0.0],"note":"Closest of your papers: [[452755]] (coupling 0.02, 2 shared references). Closest network paper: [[2052515]] (coupling 0.10, 32 shared references).","abstract":"Neutrino self-interactions ($ν$SI) beyond the Standard Model have arisen as a promising probe of new physics in cosmology. In this Letter, we show that $ν$SI emerging in the low-energy limit of renormalizable theories implies resonant mediator behavior. We identify two regions for $ν$SI: (i) neutrinos become tightly coupled with background evolution; for the first time, we establish how this evolution modifies the Boltzmann hierarchy equations (BHEs), and (ii) resonant $ν$SI dominates the dynamics with negligible background evolution, relevant for mediator masses $\\sim 10^{-6}-1$ MeV. In region (i), before matter-radiation equality, neutrino free-streaming is determined by the effective four-fermion interaction, known as the heavy-mediator limit (HML); we explore the impact of background evolution on this scenario, and from our modified BHEs, we show that self-interacting dark radiation scenarios require larger couplings than previously estimated to mimic $ν$SI. Region (ii) shows that the simplest realization of $ν$SI mediated by a (pseudo)scalar particle leads to an extra radiation contribution of $ΔN_{\\rm eff}^{\\rm CMB} \\approx 0$, instead of the commonly quoted $\\simeq 0.12$, at the CMB epoch. Overall, we highlight that our findings should be considered in any plausible scenario involving $ν$SI."},{"arxiv":"2611.24825","id":"3231163","title":"Three-nucleon potentials and their matrix elements for $δ_{\\mathrm{NS}}$ in superallowed $β$ decays","authors":"Graham Chambers-Wall, Maria Dawid, Emanuele Mereghetti, Saori Pastore, Maria Piarulli","score":6.0,"section":"cross","rank":24,"parts":[0.06,0.05,0.17,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.02, 2 shared references). Closest network paper: [[1847652]] (coupling 0.06, 5 shared references).","abstract":"We derive three-nucleon potentials for radiative corrections at order $\\mathcal{O}(αε_χ^2)$ in chiral effective field theory where $α$ is the electromagnetic coupling and $ε_χ$ is the chiral expansion parameter. These corrections contribute to the nuclear-structure-dependent term $δ_\\mathrm{NS}$ for determinations of the Cabibbo-Kobayashi-Maskawa matrix element $V_{ud}$ from superallowed nuclear $β$ decays. We compute matrix elements of three-nucleon contributions at orders $\\mathcal{O}(α^2)$ and $\\mathcal{O}(αε_χ^2)$ using quantum Monte Carlo methods. We find the matrix elements at order $\\mathcal{O}(α^2)$ to be large and to have an effect on the extraction of $V_{ud}$ at the scale of $10^{-4}$. In the case of $^{10}$C, the matrix elements of $\\mathcal{O}(αε_χ^2)$ three-nucleon operators provide a 2% correction to $δ_{\\text{NS}}$, and are thus beyond the current precision goals. The relative size of three-nucleon corrections to $δ_{\\text{NS}}$ in medium mass nuclei, where two-body contributions tend to be smaller, remains to be investigated. We then use these results to determine $V_{ud}$ from the superallowed transition ${}^{10}\\mathrm{C}\\rightarrow{}^{10}\\mathrm{B}$."},{"arxiv":"2611.23993","id":"3230940","title":"Probing dimension-six SMEFT operators in heavy-quark sector at future muon collider","authors":"Serdar Spor","score":5.8,"section":"new","rank":25,"parts":[0.0,0.11,0.16,0.0,0.0],"note":"Closest of your papers: [[1627633]] (coupling 0.03, 3 shared references). Closest network paper: [[1674879]] (coupling 0.06, 4 shared references).","abstract":"We investigate the sensitivity to the dimension-six Standard Model Effective Field Theory (SMEFT) operators which define the interactions of heavy-quarks with electroweak gauge bosons and with leptons via the process $μ^- μ^+ \\rightarrow Wtb$, followed by leptonic W-boson decays, at a 10 TeV muon collider with an integrated luminosity of 10 ab$^{-1}$. Signal and background events are generated at leading order using MadGraph5aMC@NLO, interfaced with Pythia 8 for parton showering and hadronization, and passed through Delphes 3.5 for fast detector simulation. The 95% confidence level (C.L.) limits on nine Wilson coefficients are derived using a cut-based method for two $b$-tagging working points (70% and 90% efficiencies). These limits are significantly tighter than those currently reported by the CMS Collaboration; furthermore, these results highlight the advanced potential of a future high-energy muon collider to investigate new physics within the electroweak sector through precise measurements of heavy-quark interactions."},{"arxiv":"2610.12623","id":"3213667","title":"Probing $τ$ lepton dipole moments at FCC-ee","authors":"Dario Buttazzo, Gabriele Levati, Yang Ma, Fabio Maltoni, Paride Paradisi, ZeQiang Wang","score":5.7,"section":"replacement","rank":26,"parts":[0.0,0.06,0.25,0.0,0.0],"note":"Closest of your papers: [[2690106]] (coupling 0.02, 3 shared references). Closest network paper: [[2706495]] (coupling 0.09, 13 shared references).","abstract":"We study the sensitivity of future high-luminosity $e^+e^-$ colliders to the electromagnetic and weak dipole moments of the $τ$ lepton within the Standard Model Effective Field Theory. We analyse several complementary processes across the FCC-ee operating stages and show that the exceptional luminosity and clean environment of future $e^+e^-$ colliders allow for substantial improvements over current limits from LEP and the LHC. The $e^+e^- \\to τ^+τ^-$ process provides excellent sensitivity to weak dipole operators through resonant $Z$ production and $Z$-pole energy scans, while $γγ\\to τ^+τ^-$ yields the strongest constraint on the anomalous magnetic moment owing to the dominance of linear interference effects in the near-threshold region. Higher-energy stages improve the sensitivity to the $τ$ electric dipole moment. The radiative processes $e^+e^- \\to τ^+τ^-γ$ and $H\\toτ^+τ^-γ$ provide complementary, though subleading, probes of $τ$ dipole operators. Combining all channels, we estimate the statistical reach at the 95% CL to be $|Δa_τ|<2.8\\times10^{-5}$, $|d_τ|<2.5\\times10^{-18}\\,e\\,{\\rm cm}$, $|Δa_τ^Z|<1.0\\times10^{-5}$, and $|d_τ^Z|<4.4\\times10^{-19}\\,e\\,{\\rm cm}$, improving upon the current bounds by several orders of magnitude. These projections quantify the potential statistical reach of the FCC-ee program, motivating dedicated studies incorporating detector effects, systematic uncertainties, and higher-order theoretical predictions."},{"arxiv":"2611.23374","id":"3230757","title":"The Price of Discovery: Cost-Optimized Detectors for the GUT-Scale QCD Axion","authors":"Joshua N. Benabou, Joshua W. Foster, Benjamin R. Safdi","score":5.2,"section":"new","rank":27,"parts":[0.0,0.07,0.16,0.0,0.07],"note":"Closest of your papers: [[1607572]] (coupling 0.02, 3 shared references). Closest network paper: [[1831221]] (coupling 0.06, 17 shared references).","abstract":"Grand unification and string theory point to a quantum chromodynamics (QCD) axion with mass between $10^{-11}$ and $10^{-8}$ eV, while heterotic string theory suggests a mass of $0.5-0.8$ neV. We study which laboratory experiment could discover or exclude DFSZ-strength QCD axion dark matter at and above 0.5 neV at the lowest cost, which we estimate from scaling laws calibrated to historical data. We find that a lumped-element detector, building on the ABRACADABRA concept, can do so with demonstrated readout technology; an example is a shielded toroid about 14 m across with a 6 T NbTi magnet, whose magnet and cryostat we estimate at around 120 million Swiss francs (MCHF). If projected readout targets are met, a 5 m toroid at 25 MCHF suffices. We find these designs by optimizing the toroid, solenoid, and core lumped-element topologies under a common cost metric. The toroid emerges as the most promising and cost-effective topology. The optimal field of the toroid detector is far below the 16 T of the proposed DMRadio-GUT design, which would cost nearly twice as much as our optimum. Heterodyne searches with superconducting radio-frequency cavities, with cavity shapes that we optimize for price, cost between about the same as and twice as much as the lumped-element detectors, but require cavities of volumes $\\sim50-2000$ m$^3$. We find that nuclear-magnetic-resonance searches (CASPEr) need orders-of-magnitude gains in spin polarization and coherence. We release axionMultiPhysics, an open-source finite-element and multiphysics package for, e.g., magnetoquasistatic and full-wave electromagnetics, superconductors, readout circuits, and mechanics, from which most of our numerical results were obtained."},{"arxiv":"2611.23869","id":"3230837","title":"Coupled-channel pole structure and bare-state mixing of bottom-strange heavy-quark spin partners","authors":"Ying-Bo He, Liu-Lin Wang, Ze-Hao Luo, Xiao-Hai Liu, Mao-Jun Yan","score":5.1,"section":"new","rank":28,"parts":[0.06,0.01,0.18,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.00, 1 shared references). Closest network paper: [[1710056]] (coupling 0.06, 25 shared references).","abstract":"Motivated by the observation of the $B_{s0}^*(5700)$ and the heavy-quark symmetry relations connecting the $DK$, $D^*K$, $\\bar{B}K$, and $\\bar B^*K$ systems, we investigate whether the same chiral dynamics can generate negative-parity partners dominated by the $\\bar B_1K$ and $\\bar B_2^*K$ components. We further examine how nearby bare bottom-strange states reshape the pole spectrum through coupled-channel mixing. Both the relevant $S$-wave scattering and the lower-lying $P$-wave decay channels are explicitly included in the coupled-channel calculation. In the absence of bare states, the interaction generates two negative-parity poles near $6.15$ GeV. Coupling the hadronic channels to the corresponding quark-model configurations leads to a richer two-pole structure in each sector, with the pole masses, widths, and channel residues governed by the interplay between the bare states and the hadronic dynamics. In particular, the inclusion of the bare states substantially increases the widths of the negative-parity poles with the larger $S$-wave molecular components. The resulting correlated patterns in the pole spectrum provide testable signatures for future studies of excited bottom-strange mesons."},{"arxiv":"2611.23343","id":"3230777","title":"An energy-dependent rescaling of the neutrino propagation Hamiltonian: Standard Model Extension identification, matter sector, and long-baseline degeneracy","authors":"Neda Razzaghi","score":5.0,"section":"new","rank":29,"parts":[0.0,0.0,0.09,0.0,0.36],"note":"Closest network paper: [[2148109]] (coupling 0.03, 3 shared references). Shared topics: standard model extension, mass matrix.","abstract":"We study the consequences of multiplying the neutrino propagation Hamiltonian by a real, energy-dependent scalar, $H_η(E)=f(E)H_0(E)$ with $f(E)=1-η_0(E/E_0)^2$, a minimal-length ansatz. Its vacuum part is a dimension-four, CPT-even Lorentz-violating term of the Standard Model Extension with coefficient $(\\cL)_{ii}=-η_0(m_i^2-m_1^2)/(2E_0^2)$, diagonal in the mass basis and fixed by the mass matrix, hence removable by a reparametrization. The matter-potential rescaling has dimension-five behaviour and is CPT-odd. For $f=1-η_0(E/E_0)^p$ the vacuum term behaves as a dimension $p+2$ operator and the matter term as $p+3$, so only $p=2$ gives a marginal vacuum operator; $p=0$ is absorbed into the measured mass splittings, and non-integer $p$ admits no local operator. For $η_0=0.02$ at $E_0=2.5$~GeV we find $|(\\cL)_{33}|\\simeq4\\times10^{-24}$, comparable to present atmospheric bounds, whereas a Planck-suppressed deformation with $β_0=\\mathcal{O}(1)$ gives $3.2\\times10^{-58}$. At constant density it is equivalent to $L\\to f(E)L$: mixing angles and the Dirac phase are unchanged, the CP asymmetry is reparametrized rather than generated, and the leading observable is a rescaling of $\\dm_{31}$. At $1297$~km a re-fit of $\\dm_{31}$ alone absorbs $23$~per cent of the squared probability difference, and a four-parameter re-fit absorbs $41.5$~per cent. No statistical analysis is performed; degeneracy means a distance in probability space, not a confidence interval."},{"arxiv":"2611.24537","id":"3231101","title":"Active Learning and Genetic Search for Discrete Abelian Flavor Model Building","authors":"Selin Aşmanoğlu, Christopher D. Carone","score":4.4,"section":"new","rank":30,"parts":[0.0,0.1,0.1,0.0,0.0],"note":"Closest of your papers: [[1394206]] (coupling 0.03, 2 shared references). Closest network paper: [[1127519]] (coupling 0.04, 2 shared references).","abstract":"The sequential breaking of discrete flavor symmetries provides a theoretical framework that can explain quark mass and mixing angle hierarchies. Each model is identified by its field content, charge assignments and symmetry breaking pattern, leading to an enormous space of possible models; this motivates the investigation of computational approaches for identifying promising candidates. In this work, we focus on quark flavor models with the flavor symmetry group $G_F=(\\mathbb{Z}_2)^p$, where $p$ is a positive integer; operators involving flavon fields which spontaneously break the flavor symmetry determine the size of the Yukawa matrix entries. We consider two search strategies: an active learning search employing a random forest regressor and a genetic search. The generation of candidate models is automated and models are evaluated using a loss function that takes into account the logarithmic discrepancy between the model prediction and target observable values as well as penalties for model complexity. We find that both our active learning and genetic algorithms significantly outperform random model generation, which we use as a control; our active learning approach identifies lower-loss models faster (i.e., with fewer exact model evaluations) than our genetic search, though each ultimately finds successful models. Our results support the effectiveness of active learning and evolutionary optimization as approaches to automate the search for promising models based on discrete flavor symmetries."},{"arxiv":"2511.16554","id":"3085109","title":"Dark Matter-Dark Radiation Interactions and the Hubble Tension","authors":"Manuel A. Buen-Abad, Zackaria Chacko, Ina Flood, Can Kilic, Gustavo Marques-Tavares, Taewook Youn","score":4.2,"section":"replacement","rank":31,"parts":[0.0,0.01,0.22,0.0,0.07],"note":"Closest of your papers: [[1686334]] (coupling 0.00, 1 shared references). Closest network paper: [[2051195]] (coupling 0.08, 35 shared references).","abstract":"Models in which a subcomponent of dark matter interacts with dark radiation have been proposed as a solution to the Hubble tension. In this framework, the interacting subcomponent of dark matter is in thermal equilibrium with the dark radiation in the early universe, but decouples from it around the time of matter-radiation equality. We study this general class of models and evaluate the quality of fit to recent cosmological data on the cosmic microwave background (from Planck 2018 and ACT DR6), baryon acoustic oscillations, large-scale structure, supernovae type Ia, and Cepheid variables. We focus on three benchmark scenarios that differ in the rate at which the dark matter decouples from the dark radiation, resulting in different patterns of dark acoustic oscillations. Fitting without ACT DR6 data, we find that all three scenarios significantly reduce the Hubble tension relative to $Λ$CDM, with an exponentially fast decoupling being the most preferred. The tension is reduced to less than $2 \\, σ$ in fits that don't include the SH0ES collaboration results as part of the data and to less than $1 \\, σ$ when these are included. The preference for the interacting model is substantially reduced when ACT DR6 data are included. We find that the largest $H_0$ value at the $95 \\%$ confidence region is $70.1$ km/s/Mpc without the SH0ES data, leading to only a mild reduction in the tension. This increases to $72.5$ km/s/Mpc, corresponding to a reduction in the tension to less than $3 \\, σ$, if the SH0ES results are included in the fit."},{"arxiv":"2611.24625","id":"3231134","title":"LIGO-Virgo-KAGRA stochastic constraints on first-order phase transitions: A tale of priors","authors":"S. AbdusSalam, J. Kersten, S. A. Ojaghi, L. Velasco-Sevilla, A. Zafari","score":4.1,"section":"cross","rank":32,"parts":[0.0,0.04,0.19,0.0,0.0],"note":"Closest of your papers: [[1854224]] (coupling 0.01, 1 shared references). Closest network paper: [[3219721]] (coupling 0.07, 6 shared references).","abstract":"We re-examine the methodology for constraining cosmological first-order phase transitions from gravitational-wave searches using Bayesian statistical analysis. Specifically, we use results from LIGO-Virgo-KAGRA searches for a stochastic gravitational wave background during observing runs O1--O4a. We explore multiple prior choices across three categories of fit parameters: geometrical parameters, thermodynamical parameters of phase transitions, and the parameters of an Abelian Higgs particle physics model. Our key finding is that the constraints on most parameters describing gravitational waves from a phase transition depend strongly on the prior. Consequently, the data do not yet allow to derive robust constraints on these parameters. Besides, even if a parameter is meaningfully constrained, the upper limit can vary significantly with the prior range. We provide practical recommendations for assessing the robustness of parameter estimates and guidelines for rigorously testing prior independence in future analyses."}],"rest":[{"arxiv":"2606.08329","title":"Lepton $g-2$ non-universality of hadronic contributions and a sub-GeV window to New Physics","score":3.9,"section":"replacement","rank":33},{"arxiv":"2606.15680","title":"Assessing the enrichment of heat-producing elements in deep-mantle structures using a directional geoneutrino detector","score":3.9,"section":"replacement","rank":34},{"arxiv":"2611.23371","title":"Seeing through the fog: astrophysical priors and the evidence for new physics in pulsar timing arrays","score":3.7,"section":"cross","rank":35},{"arxiv":"2611.23385","title":"Leading Axion Sensitivity with Interstellar Medium Optical Line Emission","score":3.6,"section":"new","rank":36},{"arxiv":"2605.15910","title":"Geometric algebra as the input language of collider foundation models","score":3.6,"section":"replacement","rank":37},{"arxiv":"2604.14281","title":"Probing $τ$ lepton dipole moments at future lepton colliders","score":3.5,"section":"replacement","rank":38},{"arxiv":"2603.16266","title":"Lattice QCD study of the $K^*(892)$ resonance at the physical point","score":3.5,"section":"replacement","rank":39},{"arxiv":"2611.23373","title":"Why supersonic UAP events are not accompanied by acoustic booms?","score":3.3,"section":"new","rank":40},{"arxiv":"2611.24372","title":"Reproducing $J/ψ\\to γ+3P$ data with meson spectroscopy and understanding $X(2370)$","score":3.3,"section":"new","rank":41},{"arxiv":"2611.24435","title":"Total Angular Momentum Assignments in the Hadron Spectrum","score":3.1,"section":"new","rank":42},{"arxiv":"2611.14593","title":"Strongly supercooled first-order phase transitions: monopole abundance, entropy production and homogeneity consistency","score":3.1,"section":"replacement","rank":43},{"arxiv":"2610.37198","title":"Searches for new particle physics by methods of classical and neutrino astronomy","score":3.0,"section":"   box.innerHTML=X.map(n=>`<li><span class="sc">#${n.rank} · ${n.score.toFixed(1)}</span><a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">${esc(n.title)}</a></li>`).join('');
  d.addEventListener('toggle',()=>{if(d.open)tex(box)})}
list();nextList();restList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
