<script>
const RAW = {"n":[{"id":"3222604","arxiv":"2611.04600","title":"Light Mediators at the Neutrino-Dark Matter Frontier: Coherent Scattering, Precision Constraints, and Complementary Searches","first":"Serao","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[2513697]], [[2085162]]. Closest of your papers: [[2080612]] (coupling 0.02, 2 shared references). Closest network paper: [[2085162]] (coupling 0.15, 14 shared references). Shared topics: direct detection.","score":35.8,"rank":1,"section":"new","parts":[0.7,0.06,0.43,0.0,0.32],"abstract":"Low-threshold neutrino and dark-matter experiments constrain light mediators through different momentum transfers, targets, and coupling combinations. We examine scalar and vector interactions in coherent neutrino--nucleus scattering, neutrino--electron scattering, and dark-matter direct detection. Three representative interaction models are used to compare recoil spectra and coupling degeneracies. For $^{73}\\mathrm{Ge}$ and $^{131}\\mathrm{Xe}$, the nuclear-charge response matrix has a condition number of approximately 115, so two different targets may still leave nearly parallel blind directions. An analytic profile-likelihood calculation shows how spectral overlap and uncertainties in neutrino interactions affect dark-matter discovery sensitivity in the neutrino fog. We discuss the implications of measurements from COHERENT, CONUS+, LZ, XENONnT, and PandaX-4T and specify which theoretical inputs, detector responses, and statistical correlations are needed to combine their constraints. keyword : coherent elastic neutrino-nucleus scattering; light mediators; neutrino--electron scattering; dark matter direct detection; non-standard interactions; solar neutrinos; complementarity","authors":"Raoul Serao, Mohamed Ouchemhou, Antonio Capolupo, Salvatore Capozziello","nlinked":60,"nref":77,"src":"INSPIRE","html":true},{"id":"3222457","arxiv":"2611.03751","title":"Electroweak Constraints on Nuclear Neutron Distributions and the Low-Energy Weak Mixing Angle","first":"Huang","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[2909343]], [[2513697]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1708009]] (coupling 0.01, 1 shared references). Closest network paper: [[2085162]] (coupling 0.17, 19 shared references).","score":33.7,"rank":2,"section":"cross","parts":[0.72,0.04,0.48,0.0,0.0],"abstract":"Coherent elastic neutrino--nucleus scattering (CE$ν$NS) offers a low-energy probe of the weak mixing angle, $\\sin^2θ_W$, and possible new physics in the neutrino sector. Its reliable interpretation, however, requires independent constraints on the neutron distributions of the target nuclei. We exploit correlations across nuclei within an extended Skyrme energy-density-functional framework to propagate constraints from the CREX and PREX-II parity-violating electron-scattering (PVES) measurements to CE$ν$NS targets. This yields neutron form factors and radii, with relative radius uncertainties below $1\\%$. Using these inferred neutron form factors, we jointly analyze the COHERENT CsI, Ge, and Ar data and obtain $\\sin^2θ_W=0.231^{+0.016}_{-0.015}$, consistent with the Standard Model prediction. These results provide the first electroweak-experimentally constrained benchmarks for nuclear-structure studies, neutrino-sector electroweak tests, and CE$ν$NS signal predictions in dark-matter detectors.","authors":"Xu-Run Huang, Tong-Gang Yue, Zhen Zhang, Lie-Wen Chen","nlinked":80,"nref":84,"src":"INSPIRE","html":true},{"id":"3222513","arxiv":"2611.03893","title":"Searching for Long-Lived Dark Scalars with MAPP-1 and MAPP-2 at the HL-LHC","first":"Arifeen","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[2671727]], [[1724453]]. Also cites widely used network papers: [[1518747]], [[2817040]]. Closest of your papers: [[2855387]] (coupling 0.03, 4 shared references). Closest network paper: [[3158084]] (coupling 0.07, 8 shared references).","score":31.0,"rank":3,"section":"new","parts":[0.73,0.08,0.19,0.0,0.0],"abstract":"Feebly interacting particles (FIPs) arise generically in dark-sector extensions of the Standard Model (SM). Among the simplest and most theoretically motivated such candidates is a dark scalar that mixes with the SM Higgs boson, acting as a mediator between the dark sector and the SM. For sufficiently small mixing, such a dark scalar manifests at collider experiments as a long-lived particle with a macroscopic decay length---a signature to which conventional general-purpose detectors have limited sensitivity. The MoEDAL-MAPP experiment is a dedicated search facility at the Large Hadron Collider (LHC) targeting long-lived FIPs as avatars of physics beyond the SM. We present $95\\%$ confidence-level background-free sensitivity projections for the MAPP-1 and MAPP-2 detectors at the High-Luminosity LHC to Higgs-portal dark scalars produced via rare $B$-meson decays and exotic Higgs boson decays. Our results establish the proposed MAPP-2 detector as a complementary probe of feebly-coupled dark scalars, with sensitivity to lifetimes beyond the reach of existing collider searches.","authors":"Shafakat Arifeen, James Pinfold, Pierre-Philippe A. Ouimet, Michael Staelens","nlinked":66,"nref":72,"src":"INSPIRE","html":true},{"id":"3183161","arxiv":"2607.22093","title":"Polarization fractions and helicity-dependent CP asymmetries in $B_{(s)} \\to ρρ, ρK^\\ast$ and $K^\\ast K^\\ast$ decays","first":"Chai","nauth":6,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[1710056]], [[3193100]]. Closest network paper: [[3201794]] (coupling 0.03, 2 shared references).","score":25.6,"rank":4,"section":"replacement","parts":[0.7,0.0,0.08,0.0,0.0],"abstract":"In this paper, we present a phenomenological analysis of $B_{(s)} \\to ρρ, ρK^\\ast$ and $K^\\ast K^\\ast$ decays using state-of-the-art perturbative QCD (pQCD) calculations. Our study is primarily motivated by recent polarization measurements from the LHCb and Belle II collaborations, which have significantly improved the precision of polarization fractions and enabled the first full determination of polarization-dependent CP asymmetries. This work extends the comprehensive pQCD study of charmless two-body $B$ decays reported in our previous paper [Chin. Phys. C 46 (2022) 123103], with a particular focus on polarization observables, especially the CP asymmetries in each helicity state, which reflect distinct orbital angular momentum configurations between the two vector mesons. Our predictions for the branching ratios and longitudinal polarization fractions in the $B^0 \\to K^{\\ast 0} {\\bar K}^{\\ast 0}$ and $B^+ \\to ρ^0 K^{\\ast +}$ modes are in good agreement with the new experimental data. However, the calculated longitudinal polarization fraction for $B_s \\to K^{\\ast 0} {\\bar K}^{\\ast 0}$ is significantly larger than the LHCb measurement. Moreover, the predicted (helicity-dependent) CP asymmetries in $B^+ \\to ρ^0 K^{\\ast +}$ are about $30 \\%$ smaller than the observed values. These discrepancies point to a rich interplay between different topological amplitudes, highlighting the need for further theoretical investigation to resolve the long-standing polarization puzzle in two-body $B$ decays into vector mesons.","authors":"Jian Chai, Shan Cheng, Feng-Qing Hu, Ya Li, Jin-Yang Shen, Da-Cheng Yan","nlinked":37,"nref":38,"src":"INSPIRE","html":true},{"id":"3222565","arxiv":"2611.04237","title":"Observable gravitational waves from unstable ALP catastrogenesis","first":"Gelmini","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[851494]]. Closest of your papers: [[1607572]] (coupling 0.06, 6 shared references). Closest network paper: [[1944631]] (coupling 0.09, 22 shared references).","score":24.6,"rank":5,"section":"new","parts":[0.45,0.17,0.24,0.0,0.0],"abstract":"We focus on gravitational waves (GWs) observable in pulsar timing array and interferometric searches that are produced by the annihilation of cosmic string-wall networks in axion-like particle (ALP) models. We called this process \"catastrogenesis.\" It produces GWs with a characteristic peaked spectrum. These GWs would not be observable if the ALPs were stable. We thus assume that ALPs decay into two photons before Big-Bang nucleosynthesis (BBN). The large ALP-photon coupling required could induce field dissipation and friction on cosmic walls through interactions with the radiation background. We study the conditions under which these effects are negligible and map the parameter regions yielding observable GW signals onto the usual ALP mass-coupling parameter space. We find that, in these regions, ALPs dominate the energy density of the Universe before they decay, leading to a period of intermediate matter domination, which would leave a clear imprint on the GW spectrum.","authors":"Graciela B. Gelmini, Jonah Hyman, Yu Watanabe","nlinked":100,"nref":107,"src":"INSPIRE","html":true},{"id":"3222799","arxiv":"2611.04857","title":"Electroweak corrections to the SM-like Higgs boson decays and the Higgs trilinear coupling in the real Higgs triplet model","first":"Aiko","nauth":6,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1455793]] (coupling 0.01, 1 shared references). Closest network paper: [[2628447]] (coupling 0.17, 20 shared references).","score":23.6,"rank":6,"section":"new","parts":[0.45,0.02,0.47,0.0,0.0],"abstract":"We study new physics effects on the decays of the standard model-like Higgs boson ($h$) and the Higgs trilinear coupling including the full one-loop corrections in the real Higgs triplet model (RHTM). We adopt the on-shell renormalization scheme, in which the scalar mixing angles are renormalized in a gauge-independent way using the pinch technique. We found that sizable one-loop effects can arise in the decay rates through the Higgs wave-function (external-leg) corrections, while the tree-level effects are rather small due to the constraint on the vacuum expectation value of the triplet field from the electroweak precision measurements. In addition, the $h\\toγγ$ decay rate and the $hhh$ coupling are sensitive to loop contributions. The RHTM may be distinguishable from other extended Higgs models by studying the correlations among the $h\\toττ$, $h\\to ZZ^{*}$, and $h\\toγγ$ decay modes, and such characteristic predictions can be tested at the High-Luminosity LHC or future Higgs factories.","authors":"Masashi Aiko, Shinya Kanemura, Mariko Kikuchi, Kodai Sakurai, Sora Taniguchi, Kei Yagyu","nlinked":115,"nref":118,"src":"INSPIRE","html":true},{"id":"3145848","arxiv":"2604.15006","title":"Cosmology of Inelastic Self-Interacting Dark Matter: Linear Evolution and Observational Constraints","first":"Duan","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1992028]]. Closest of your papers: [[2859009]] (coupling 0.02, 3 shared references). Closest network paper: [[1989085]] (coupling 0.13, 16 shared references).","score":23.6,"rank":7,"section":"replacement","parts":[0.45,0.05,0.37,0.0,0.07],"abstract":"We study the linear cosmological evolution of inelastic self-interacting dark matter in a two-component dark sector with a small mass splitting, assuming thermal initial conditions for the two species. We derive the coupled background and perturbation equations for inelastic conversion between the two species, considering both power-law and low-velocity saturation cross sections. Exothermic conversion injects kinetic energy into the light component, generating pressure support that suppresses small-scale structure and produces dark acoustic oscillations in the matter power spectrum. The resulting cutoff at scale $k > 1\\,h\\,\\mathrm{Mpc}^{-1}$ depends on the normalization and velocity dependence of the cross section, the dark matter mass and the mass splitting. Using linear power spectra computed with a modified Boltzmann solver, we apply recast constraints from Lyman-$α$ forest data and high-redshift UV luminosity functions, finding non-monotonic but closed exclusion regions driven by the competition between efficient conversion and rapid depletion of the heavy component. These results show that the internal thermodynamics of a secluded multi-component dark sector can leave observable imprints on structure formation, providing a complementary probe of secluded dark matter.","authors":"Xin-Chen Duan, Yue-Lin Sming Tsai, Ziwei Wang","nlinked":111,"nref":112,"src":"INSPIRE","html":true},{"id":"3191293","arxiv":"2608.14269","title":"Nonstandard Solution for Anomaly Cancellation as Seesaw Neutrino Origin in the SM","first":"Zou","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[713693]] (coupling 0.02, 4 shared references). Closest network paper: [[1812354]] (coupling 0.09, 6 shared references).","score":22.2,"rank":8,"section":"replacement","parts":[0.45,0.06,0.24,0.0,0.08],"abstract":"For fixed Standard Model (SM) non-Abelian representations of 15 chiral fermions with arbitrary hypercharges, anomaly cancellation admits the usual assignment and a distinct nonstandard solution. In the latter, the exotic quark and lepton weak doublets and exotic lepton singlet have zero hypercharge, whereas the two exotic quark singlets carry opposite hypercharges $-q$ and $q$. The neutral exotic lepton singlets naturally provide heavy neutrinos. With two copies, the minimal model realizes the minimal type-I seesaw, yielding one massless active neutrino, and predicts $m_{ββ}=1.2$--$4.1$ meV for normal ordering and $15.9$--$48.9$ meV for inverted ordering. In a direct SM realization, generating exotic-quark masses through the SM Higgs mechanism fixes their electric charges to $\\pm 1/2$. A separate $SU(2)_{L'}$ realization of the nonstandard solution can allow exotic-quark masses ranging from several TeV to 10 TeV with order-one Yukawa couplings while all charged exotic particles carry charges $\\pm q$. In both cases, the lightest exotic quark and lepton are generically stable, providing distinctive and potentially testable signatures while remaining compatible with current constraints.","authors":"Zi-Yue Zou, Chia-Wei Liu, Zhong-Lv Huang, Xiao-Gang He","nlinked":49,"nref":53,"src":"INSPIRE","html":true},{"id":"3222464","arxiv":"2611.03783","title":"GUT Color-Triplet Around the Corner: The Story of an Overlooked Lightness","first":"Dvali","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1663960]] (coupling 0.02, 1 shared references). Closest network paper: [[2773789]] (coupling 0.02, 2 shared references).","score":19.6,"rank":9,"section":"new","parts":[0.45,0.07,0.07,0.0,0.08],"abstract":"In traditional approach to the doublet-triplet splitting problem in grand unified theories (GUTs) it is assumed that color-triplet partner of the Higgs doublet must be superheavy in order not to mediate proton decay. However, it has been proposed [1] that the splitting, instead of the mass sector, can occur among the Yukawa couplings. In this scenario the color-triplet emerges as a long-lived $T$-particle with the mass around the TeV scale. This framework provides a direct low-energy window into GUT physics. In the present paper, we study an explicit supersymmetric $SO(10)$ GUT which realizes this mechanism, including effects of gravity-mediated supersymmetry breaking. We show how the shift of the heavy fields, triggered by supersymmetry-breaking, generates a tiny coupling between the $T$-particle and the Standard Model fields and explore the resulting phenomenology. Depending on the order of gravitino mass in which the coupling emerges, the lifetime of the $T$-particle is either around a second or exceeds the age of the Universe. In our analysis, we validate some earlier constraints on (super)gravity vacua imposed by the $S$-matrix: based on the Goldstino Argument, we show that none of the GUT vacua have positive energy densities, whereas the Minkowski vacua are safe against tunneling. We also highlight the role of the species scale cutoff in sensitivity of the low energy observables towards the GUT physics.","authors":"Gia Dvali, Manuel Ettengruber, Anna Jankowsky, Tongxuan Zhang","nlinked":66,"nref":71,"src":"INSPIRE","html":true},{"id":"3192747","arxiv":"2608.18949","title":"Three-body forces in the quark model","first":"Baek","nauth":7,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.00, 1 shared references). Closest network paper: [[1710056]] (coupling 0.03, 20 shared references).","score":18.1,"rank":10,"section":"replacement","parts":[0.48,0.0,0.07,0.0,0.0],"abstract":"We review the connection between constituent-quark Hamiltonians and QCD and investigate the long-standing difficulty of describing meson and baryon spectra with one common two-body interaction. A Hamiltonian calibrated to ground-state mesons leaves systematic baryon mass residuals, largest in the light-quark sector and decreasing toward heavier flavors. We show that a short-range, color-spin-dependent connected three-quark interaction substantially reduces this incompatibility. Mass-scaled finite-range profiles yield high-accuracy baryon spectra, whereas flavor-independent common-range profiles do not remove the residual flavor pattern. The result is tested on additional ground-state baryons outside the calibration set and through meson--baryon compatibility analyses across several alternative quark-model Hamiltonians. We also benchmark radial and orbital excitations to identify the regime in which a static compact valence Hamiltonian remains reliable, and provide explicit color-spin matrix elements for two- and three-body operators in baryons and multiquark configurations. Within the tested valence-space representations, the results indicate that a mass-dependent short-range connected three-quark interaction provides the missing contribution required for a consistent simultaneous description of meson and baryon ground-state spectra.","authors":"Jongheon Baek, Aaron Park, Emiko Hiyama, Sungsik Noh, Hyeongock Yun, Kyong Chol Han, Su Houng Lee","nlinked":351,"nref":394,"src":"INSPIRE","html":true},{"id":"3222816","arxiv":"2611.04981","title":"Renormalization and Factorization Scale-Invariant Predictions for the $e^+e^-\\to J/ψ+η_c$ process at $B$ factories","first":"Gong","nauth":7,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.00, 1 shared references). Closest network paper: [[3214449]] (coupling 0.01, 1 shared references).","score":17.8,"rank":11,"section":"new","parts":[0.48,0.01,0.04,0.0,0.0],"abstract":"We perform a NNLO perturbative QCD analysis for exclusive double charmonium production $e^+e^-\\to J/ψ+η_c$ within the NRQCD factorization formalism using the Principle of Maximum Conformality (PMC). It is well known that this charmonium process suffers poor pQCD convergence, as well as large renormalization scale uncertainty. The PMC is used to remove conventional renormalization scale uncertainty. Based on two fundamental physical processes of charmonium, $J/ψ\\rightarrow e^+e^-$ and $η_c\\rightarrowγγ$, and using the NNLO perturbative results together with experimental measurements, we extract the factorization-scale-dependent long-distance matrix elements for $J/ψ$ and $η_c$. Combining these two matrix elements with the factorization-scale-dependent short-distance coefficient, we obtain predictions that are independent of the factorization scale for the $e^+e^-\\to J/ψ+η_c$ process. Our predictions agree with the measurement from the BaBar collaborations within errors. Remarkably, we provide a new way to eliminate conventional renormalization and factorization scale ambiguities for the $e^+e^-\\to J/ψ+η_c$ process. We further demonstrate that the slow convergence of the pQCD series is an intrinsic property of this double-charmonium process.","authors":"Si-Qi Gong, Ting Sun, Sheng-Quan Wang, Jian-Ming Shen, Xu-Dong Huang, Xing-Gang Wu, Leonardo Di Giustino","nlinked":67,"nref":71,"src":"INSPIRE","html":true},{"id":"3222456","arxiv":"2611.03782","title":"Toponium hadroproduction at next-to-next-to-leading order in NRQCD","first":"Klein","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1615477]] (coupling 0.01, 1 shared references). Closest network paper: [[3206672]] (coupling 0.03, 3 shared references).","score":17.5,"rank":12,"section":"new","parts":[0.45,0.02,0.08,0.0,0.0],"abstract":"We present the first next-to-next-to-leading-order (NNLO) predictions for inclusive color-singlet toponium hadroproduction within NRQCD in the zero-width limit for the top quark. The central new result is the NNLO QCD correction to the short-distance coefficient for pseudoscalar toponium production. The predictions include electroweak and relativistic corrections, additional production channels, and perturbatively evaluated bound-state matrix elements. At the Large Hadron Collider proton-proton center-of-mass energy of $13\\,\\mathrm{TeV}$, we obtain a cross section of $4.87^{+0.63}_{-0.65}\\,\\mathrm{pb}$, with scale and parametric uncertainties combined. The NNLO corrections reduce the renormalization- and factorization-scale uncertainties by approximately a factor of four relative to NLO, to the few-percent level. The dominant remaining uncertainty arises from the Coulomb-scale dependence of the bound-state matrix elements.","authors":"Sven Yannick Klein, Fabio Maltoni, Hua-Sheng Shao, Lukas Simon, Guoxing Wang","nlinked":52,"nref":57,"src":"INSPIRE","html":true},{"id":"3184530","arxiv":"2607.27202","title":"Anomalies in Hadronic $B \\to VV$ Decays","first":"Bhattacharya","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[2013947]] (coupling 0.03, 1 shared references).","score":17.0,"rank":13,"section":"replacement","parts":[0.45,0.0,0.08,0.0,0.0],"abstract":"Recently, a fit of charmless $B\\to PP$ decays ($B \\in \\{B^0, B^+, B_s^0\\}$, $P \\in \\{ π, K, η, η' \\}$) to the latest data was performed under the assumption of flavour SU(3) symmetry [SU(3)$_F$]. It was found that there is a $4.1σ$ disagreement with the SU(3)$_F$ limit of the Standard Model [$\\rm SM_{SU(3)_F}$]. In this paper, we extend this analysis to charmless $B \\to VV$ decays ($V \\in \\{ρ, K^*, φ, ω\\}$). The fit examining $B \\to ρK^*$ decays, assuming only isospin symmetry, is found to be acceptable. When we fit to $B \\to VV$ decays with $V \\in \\{ ρ, K^* \\}$ within SU(3)$_F$, we find a $5.2σ$ discrepancy with SM$_{SU(3)_F}$. Finally, when $B \\to VV$ decays with $V \\in \\{ ρ, K^*, φ, ω\\}$ are considered, the discrepancy grows to $>7σ$. The theoretical input in this analysis is modest, so our results are quite rigorous, group theoretically, and hold almost exactly in the SU(3)$_F$ limit. Although it seems unlikely that the introduction of $\\sim 30$% SU(3)$_F$-breaking effects can account for this discrepancy, this must be verified.","authors":"Bhubanjyoti Bhattacharya, Marianne Bouchard, Alexandre Jean, David London, Ipsita Ray","nlinked":47,"nref":48,"src":"INSPIRE","html":true},{"id":"3222544","arxiv":"2611.04014","title":"Branching Fractions and CP-Violating Asymmetries in D => PP Decays","first":"Buccella","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3214449]] (coupling 0.02, 1 shared references).","score":16.7,"rank":14,"section":"new","parts":[0.45,0.0,0.06,0.0,0.0],"abstract":"We update an $SU(3)_F$ analysis of $D\\to PP$ decays ($P\\equiv π, K$) in which the dominant $SU(3)_F$-breaking effects are modeled through final-state interactions. The new fit improves the description relative to the previous parameter set, although significant global tension remains, mainly in charged-$D$ modes. Within the adopted rescattering model, the direct CP asymmetries in $D^0\\toπ^+π^-$, $K^+K^-$, $π^0π^0$, and $K_S^0 K_S^0$ depend on two additional reduced amplitudes. Using the $D^0\\toπ^+π^-$ and $D^0\\to K^+K^-$ asymmetries as inputs, we derive conditional predictions for the two neutral modes. The OZI-motivated benchmark $Δ_4=0$ is mildly disfavored by the charged-mode asymmetries and leads to substantially smaller asymmetries in the neutral modes, which can be tested with more precise $K_S^0K_S^0$ and $π^0π^0$ measurements.","authors":"Franco Buccella, Pietro Santorelli","nlinked":27,"nref":29,"src":"INSPIRE","html":true},{"id":"3222628","arxiv":"2611.04770","title":"Investigating nucleon resonances in the $pp\\to K^+K^+ΛΛ$ reaction","first":"Zhang","nauth":8,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3214449]] (coupling 0.01, 1 shared references).","score":16.3,"rank":15,"section":"new","parts":[0.45,0.0,0.04,0.0,0.0],"abstract":"In this work, we investigate the \\(pp \\to K^+ K^+ ΛΛ\\) reaction using an effective Lagrangian approach and the isobar model. The calculation includes the exchange of \\(π\\), \\(η\\), \\(σ\\), \\(ρ\\), \\(ω\\), and \\(K\\) mesons, as well as contributions from eight nucleon resonances: \\(N(1535)\\), \\(N(1650)\\), \\(N(1710)\\), \\(N(1720)\\), \\(N(1895)\\), \\(N(1900)\\), \\(N(2060)\\) and \\(N(2120)\\). The double-resonance excitation mechanism (\\(NN \\to N^* N^*\\)) is found to dominate this reaction over the entire energy range considered. Among the exchanged mesons, the \\(η\\) exchange provides the largest contribution at lower energies, whereas the \\(K\\) exchange dominates at higher energies. Near the threshold, \\(N(1535)\\) and \\(N(1650)\\) play the most important roles, while at higher energies \\(N(1710)\\) and \\(N(1720)\\) become dominant. Due to isospin conservation, this reaction is predominantly coupled to nucleon resonances, providing a relatively clean channel for \\(N^*\\) spectroscopy. Our results indicate the unique potential of this reaction for studying nucleon resonances and provide a theoretical reference for future experimental studies at HIAF.","authors":"Zi-Zhao Zhang, Xu Cao, Bo-Chao Liu, Zi-Xi Ou-Yang, Ke Wang, Yin-Jie Wang, Jia-Jun Wu, Zhi-Hong Ye","nlinked":71,"nref":77,"src":"INSPIRE","html":true},{"id":"3138503","arxiv":"2604.00866","title":"Signatures of Long-Lived Heavy Neutral Leptons from Neutrinophilic Charged Higgs Pair Production at the LHC","first":"Okada","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1854224]] (coupling 0.04, 4 shared references). Closest network paper: [[3105005]] (coupling 0.10, 14 shared references). Shared topics: displaced vertex.","score":14.9,"rank":16,"section":"replacement","parts":[0.06,0.13,0.29,0.0,0.45],"abstract":"In the neutrinophilic Higgs doublet framework, the neutrino Dirac Yukawa couplings can be sizable because of the small vacuum expection value of the extra Higgs doublet, even for a low seesaw scale. Due to this structure, the neutrinophilic charged Higgs bosons, once created, decay dominantly into heavy neutral leptons (HNLs) and charged leptons. This is a new mechanism to produce a gauge singlet HNL without suppressed cross sections. In the standard seesaw, one HNL can be long-lived, when the lightest neutrino is sufficiently light. We investigate displaced vertex signatures of the long-lived HNLs produced from the decays of the charged Higgs pair at the high luminosity LHC. We consider one displaced vertex as well as two displaced vertices signatures and perform a dedicated simulation to identify the displaced leptons. We find that high statistical significance can be achieved for the observation of one displaced vertex for charged Higgs pair production cross section $>\\mathcal{O}(1)$ fb. On the other hand, the observation of two displaced vertices is challenging, particularly for charged Higgs pair production cross section below $\\mathcal{O}(10)$ fb.","authors":"Nobuchika Okada, Prasenjit Sanyal, Ravindra Kumar Verma","nlinked":72,"nref":72,"src":"INSPIRE","html":true},{"id":"3222486","arxiv":"2611.03794","title":"Shortcomings of the squark simplified model","first":"Agashe","nauth":5,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[677884]] (coupling 0.05, 2 shared references). Closest network paper: [[824840]] (coupling 0.12, 5 shared references). Shared topics: supersymmetric model.","score":14.7,"rank":17,"section":"new","parts":[0.06,0.16,0.35,0.0,0.24],"abstract":"We argue that the squark simplified model commonly used in collider analyses fails to represent realistic low-energy supersymmetric models and significantly underestimates squark production rates at hadron colliders. This has important implications for extracting squark mass limits at the LHC and assessing the potential reach of HL-LHC or the FCC-hh. In particular, we find that the current LHC squark mass limit is realistically in the range of 2.6-3.0 TeV, rather than the 1.7-1.8 TeV range that is typically quoted based on the simplified model.","authors":"Kaustubh Agashe, Roberto Franceschini, Gian F. Giudice, Andre Lessa, Xing Wang","nlinked":32,"nref":39,"src":"INSPIRE","html":true},{"id":"3193100","arxiv":"","title":"Review of Particle Physics","first":"Takahashi","nauth":259,"year":2026,"cites":450,"role":"other","note":"","score":null},{"id":"1812354","arxiv":"2008.08573","title":"Anomaly-free chiral  $U(1)_D$ and its scotogenic implication","first":"Wong","nauth":1,"year":2020,"cites":14,"role":"other","note":"","score" uthors":"Mattia Di Mauro, Caleb Gemmell, Dan Hooper, Fabrizio Vassallo","score":7.6,"section":"new","rank":19,"parts":[0.0,0.05,0.27,0.0,0.19],"note":"Closest of your papers: [[2080612]] (coupling 0.02, 1 shared references). Closest network paper: [[3130997]] (coupling 0.10, 6 shared references). Shared topics: lepton number.","abstract":"Cosmic-ray antideuterons and antihelium-3 nuclei are promising probes of dark matter (DM). In light of potential detections of heavy antinuclei at AMS-02, we investigate a recently proposed scenario in which DM annihilates into color-singlet scalars carrying baryon and lepton number, which has been shown to enhance antideuteron and antihelium-3 fluxes relative to antiprotons. Accounting for Galactic propagation and detector sensitivities, we calculate the number of events predicted by our model for parameters that are compatible with the seven-year AMS-02 antiproton data. Broad regions of the DM-mediator mass plane result in observable antideuteron fluxes at AMS-02 and GAPS. While detecting antihelium-3 remains more challenging, potentially detectable fluxes can arise for light mediators and moderately light DM, and in general are enhanced relative to the standard WIMP predictions. Furthermore, we find antihelium-to-antideuteron event ratios of O(0.1), closer to those suggested by the reported AMS-02 candidate events than conventional WIMP predictions."},{"arxiv":"2603.27257","id":"3137150","title":"Particle--antiparticle asymmetry from charge separation at expanding horizons","authors":"She-Sheng Xue","score":7.6,"section":"replacement","rank":20,"parts":[0.06,0.07,0.24,0.0,0.0],"note":"Also cites widely used network papers: [[779828]]. Closest of your papers: [[922002]] (coupling 0.02, 2 shared references). Closest network paper: [[2743646]] (coupling 0.08, 6 shared references).","abstract":"In a Friedmann universe with a time-varying cosmological term, massive particle--antiparticle pairs are produced continuously from the spacetime vacuum, and their members are separated by horizons. Along the cosmic history that explains $n_s$, $A_s$, $r$ and the low-$\\ell$ power anomaly, we show how this separation generates the observed asymmetry. Horizons absorb the charge they separate, since gravity does not conserve global charges. Charge separation at the many horizons inside today's Hubble volume then acts as a volume violation of the U(1) charge, at a rate $Γ_C=κ_CΓ_M$ proportional to pair production. The sign requires a C- and CP-odd coupling to the time arrow. We describe both by an effective Lagrangian with a U(1)-violating coupling $g_c\\,δ\\mathcal O_SΦ^2$ to the spacetime vacuum and a time bias $-\\partial_μf(R)\\,J^μ$. For $f=c_a\\ln|R|$ the chemical potential of producing a particle is $μ\\simeq2c_a\\dot H/H$. The asymmetry per pair reaches an attractor in the pair-dominated episode and freezes when the cosmological term is exhausted. The observed value requires $|c_a|/τ_S\\simeq(0.65$--$1.0)\\times10^{-4}$, with $T_S=τ_SH/2π$ the temperature of the spacetime vacuum, and its sign is fixed by the arrow of time. The Yukawa decays of the pairs transfer the asymmetry, with a uniform sign, to baryons and leptons and to dark-matter particles. The current of the charged decay products generates a magnetic field of $10^{-14}$--$10^{-11}$ G today on the coherence length of reheating."},{"arxiv":"2606.31476","id":"3175093","title":"Landau-Zener formula and resonant axion conversion in neutron star magnetospheres","authors":"Matti Heikinheimo, Topi Sirkiä, Kimmo Tuominen","score":6.8,"section":"replacement","rank":21,"parts":[0.0,0.08,0.3,0.0,0.0],"note":"Closest of your papers: [[2855387]] (coupling 0.02, 3 shared references). Closest network paper: [[2697191]] (coupling 0.11, 11 shared references).","abstract":"We investigate the Landau-Zener description of resonant axion-photon conversion in neutron star magnetospheres. We find that this picture often fails for axion conversions to millimeter-to-optical band photons due to the characteristic resonance width exceeding the size of the conversion region. This comparison of scales yields a simple criterion for evaluating the validity of the Landau-Zener formula. We verify this criterion numerically, and show that when invalid, the Landau-Zener conversion probability may significantly deviate from the numerical result. In light of these findings, we revise constraints on axions from neutron star optical-band polarization searches."},{"arxiv":"2609.16276","id":"3203922","title":"Probabilistic, Structure-Intrinsic Clustering with a Hierarchical Embedding (PSICHE) in Time and Space Applied In Particle Physics Jet Reconstruction","authors":"Margaret Lazarovits, Christopher Rogan","score":6.0,"section":"replacement","rank":22,"parts":[0.0,0.09,0.23,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.03, 3 shared references). Closest network paper: [[1971314]] (coupling 0.08, 3 shared references).","abstract":"Jet reconstruction is an active and open area of particle physics research, with questions related to jet size, multiplicity, substructure, and experimental performance in the presence of pileup and noise. Analogous challenges are ubiquitous throughout other applications of unsupervised learning in the context of clustering and association. This paper introduces a new algorithm for clustering in the context of jet reconstruction: Probabilistic, Structure-Intrinsic Clustering with a Hierarchical Embedding (PSICHE). PSICHE addresses several challenges and shortcomings of existing jet clustering methods with novel features, including but not limited to: (i) dynamically-learned and variable jet (cluster) sizes, (ii) unsupervised, multi-scale learning of emergent features, like jet substructure and multiplicity, (iii) clustering in space and time, and (iv) incorporation of domain-specific experimental uncertainties. All of these properties are achieved in a self-consistent, probabilistic framework that is computationally tractable. Furthermore, demonstrations of these features are presented for a range of jet clustering examples in LHC scenarios for various physics phenomena, clustering inputs, pileup conditions, and detector performance parameters."},{"arxiv":"2611.03748","id":"3222469","title":"Topological Diagnostics of CP Degeneracies in Long-Baseline Neutrino Oscillations with Non-Standard Interactions via Pancharatnam Open-Path Phases","authors":"Neda Razzaghi","score":5.6,"section":"new","rank":23,"parts":[0.0,0.0,0.32,0.0,0.09],"note":"Closest network paper: [[1864802]] (coupling 0.11, 3 shared references).","abstract":"We investigate the topological signatures of neutral-current Non-Standard Interactions (NSI) in long-baseline neutrino oscillations by extending the open-path Pancharatnam geometric phase framework. Incorporating off-diagonal vector couplings ($\\varepsilon_{eτ} = |\\varepsilon_{eτ}|e^{iφ_{eτ}}$) into the discrete-layer matter Hamiltonian across the DUNE baseline ($L = 1300\\text{ km}$), we analyze the state evolution for both neutrino ($ν_μ\\to ν_e$) and antineutrino ($\\barν_μ\\to \\barν_e$) appearance channels over the broadband energy spectrum $E_ν\\in [0.5, 8.0]\\text{ GeV}$. Our analysis demonstrates that complex NSI phases imprint distinct, energy-dependent spectral dispersions onto the open-path geometric holonomies $Φ_g^{(n)}$ and their $\\mathcal{CP}$-conjugate counterparts. By clarifying that these geometric phases manifest through gauge-invariant interference terms $ΔΓ_{nm}$ rather than asymptotic single-channel measurements, we construct the $\\mathcal{CP}$-violating geometric phase differences $ΔΦ_g^{\\mathrm{CP}}$. We show that the interplay between these geometric dispersions and the matter-potential sign reversal under $\\mathcal{CP}$-conjugation forces the neutrino and antineutrino degeneracy bands to intersect at non-parallel angles in the two-dimensional $(δ_{\\mathrm{CP}}, φ_{eτ})$ parameter space. This non-trivial topological intersection isolates a unique physical solution, providing a robust, independent diagnostic capable of breaking persistent parameter degeneracies even under realistic calorimetric energy smearing."},{"arxiv":"2610.06734","id":"3212018","title":"Two-loop RI/SMOM-$\\overline{\\text{MS}}$ matching factors for the renormalization of bi-local operators contributing to $ε_K$","authors":"Erik Lundstrum","score":5.6,"section":"replacement","rank":24,"parts":[0.0,0.1,0.18,0.0,0.0],"note":"Closest of your papers: [[2855387]] (coupling 0.04, 3 shared references). Closest network paper: [[2940264]] (coupling 0.06, 4 shared references).","abstract":"The measure of indirect CP violation in the neutral kaon system, $ε_K$, is an important precision test of the Standard Model. A first-principles Standard Model prediction of $ε_K$ requires evaluating the long-distance contribution in which the $ΔS = 2$ process proceeds via two $ΔS = 1$ operators. The non-perturbative nature of QCD in the relevant energy regimes requires a lattice QCD simulation. In this paper we present the two-loop, $O(α_s)$ RI/SMOM - $\\overline{\\text{MS}}$ matching factors required to renormalize a lattice QCD calculation of the long-distance contribution to $ε_K$."},{"arxiv":"2611.03904","id":"3222489","title":"Constraints on a Long-Lived X17 Vector Boson with FASER","authors":" FASER Collaboration, Roshan Mammen Abraham, Xiaocong Ai, Saul Alonso Monsalve, John Anders, Emma Kate Anderson, Akitaka Ariga, Tomoko Ariga, Jeremy Atkinson, Florian U. Bernlochner, Jianming Bian, Tobias Boeckh, Eliot Bornand, Jamie Boyd, Lydia Brenner, Angela Burger, Franck Cadoux, Haichuan Cao, Roberto Cardella, David W. Casper, Charlotte Cavanagh, Shiyang Chen, Xin Chen, Xing Cheng, Dhruv Chouhan, Emily Chown, Andrea Coccaro, Fabio Cufino, Stephane Débieux, Ansh Desai, Sergey Dmitrievsky, Radu Dobre, Monica D'Onofrio, Sinead Eley, Yannick Favre, Jonathan L. Feng, Carlo Alberto Fenoglio, Didier Ferrere, Max Fieg, Wissal Filali, Elena Firu, Haruhi Fujimori, Edward Galantay, Ali Garabaglu, Stephen Gibson, Sergio Gonzalez-Sevilla, Yuri Gornushkin, Yotam Granov, Jinjing Gu, Carl Gwilliam, Elie Hammou, Daiki Hayakawa, Michael Holzbock, Shih-Chieh Hsu, Zhen Hu, Giuseppe Iacobucci, Tomohiro Inada, Luca Iodice, Sune Jakobsen, Cesar Jesus-Valls, Arash Jofrehei, Hans Joos, Enrique Kajomovitz, Hiroaki Kawahara, Alex Keyken, Felix Kling, Daniela Köck, Pantelis Kontaxakis, Jelle Koorn, Umut Kose, Peter Krack, Susanne Kuehn, Thanushan Kugathasan, Sebastian Laudage, Lorne Levinson, Botao Li, Jiaxi Liu, Yi Liu, Joern Mahlstedt, Toni Mäkelä, Yasuhiro Maruya, Anna Mascellani, Lawson McCoy, Josh McFayden, Andrea Pizarro Medina, Hiroaki Menjo, Théo Moretti, Toshiyuki Nakano, Laurie Nevay, Ken Ohashi, Hidetoshi Otono, Lorenzo Paolozzi, Annabelle Parry, Pawan Pawan, Brian Petersen, Titi Preda, Markus Prim, Junkai Qin, Michaela Queitsch-Maitland, Juan Rojo, Hiroki Rokujo, André Rubbia, Jorge Sabater-Iglesias, Osamu Sato, Paola Scampoli, Kristof Schmieden, Matthias Schott, Cristiano Sebastiani, Anna Sfyrla, Davide Sgalaberna, Mansoora Shamim, Yosuke Takubo, Kakeru Tanaka, Simon Thor, Eric Torrence, Serhan Tufanli, Oscar Ivan Valdes Martinez, Svetlana Vasina, Emanuele Villa, Benedikt Vormwald, Chi Wang, Yuxiao Wang, Eli Welch, Aaron White, Monika Wielers, Benjamin James Wilson, Zhongyi Wu, Yue Xu, Heng Yang, Lekai Yao, Daichi Yoshikawa, Stefano Zambito, Shunliang Zhang, Yuxuan Zhang, Xingyu Zhao, Zijian Zhao","score":5.5,"section":"cross","rank":25,"parts":[0.0,0.08,0.21,0.0,0.0],"note":"Closest of your papers: [[1708009]] (coupling 0.03, 1 shared references). Closest network paper: [[2872550]] (coupling 0.07, 9 shared references).","abstract":"The ATOMKI anomalies motivate the possibility of a new particle, the X17, with a mass of 17 MeV and weak couplings to nuclei and electrons. Such a particle may be produced at the LHC, travel 480 m in the far-forward direction, and decay to $e^+e^-$ in FASER. In this paper, previous FASER searches for dark photons and axion-like particles (ALPs) are combined and interpreted as searches for a candidate X17 particle, the protophobic vector boson. The searches use data collected from $pp$ collisions at $\\sqrt{s} = 13.6$ TeV in LHC Run 3 from 2022 for the dark photon search and from 2022-2023 for the ALP search. No excess events are found above the expected background, and the combined null results exclude a previously-unconstrained \"low-coupling window\" with electron coupling $6 \\times 10^{-5} < ε_e < 1.2 \\times 10^{-4}$. A \"high-coupling window\" remains."},{"arxiv":"2611.05170","id":"3222863","title":"Constraining tau-sterile neutrino mixing with high-energy astrophysical neutrinos","authors":"Mauricio Bustamante, Qinrui Liu","score":5.1,"section":"new","rank":26,"parts":[0.0,0.08,0.18,0.0,0.0],"note":"Closest of your papers: [[1708009]] (coupling 0.03, 3 shared references). Closest network paper: [[1754895]] (coupling 0.06, 11 shared references).","abstract":"Whether a sterile neutrino mixes with the three active ones remains an open question. Its mixing with the tau neutrino, $|U_{τ4}|^2$, is the least constrained, since terrestrial experiments probe it only indirectly and over limited ranges of sterile-neutrino mass. We show that TeV-PeV astrophysical neutrinos probe it differently. Their sources make almost no $ν_τ$, but oscillations over cosmological distances turn about one third of them into $ν_τ$ before they reach Earth. Mixing with a sterile neutrino would make these $ν_τ$ scarcer, lowering the $ν_τ$ fraction that neutrino telescopes measure, whatever the sterile-neutrino mass. In contrast, sterile mixing with $ν_e$ or $ν_μ$ is nearly undetectable. Fitting the flavor composition measured by IceCube, with the composition at the sources left free, we find $|U_{τ4}|^2 < 0.88$ at 90% C.L. Combining IceCube with present and planned neutrino telescopes, including IceCube-Gen2 and HUNT, could lower this limit to 0.24-0.29 by 2040 and to 0.12-0.14 by 2050. By 2050, these limits would match some present terrestrial limits, though not the strongest."},{"arxiv":"2506.13310","id":"2935131","title":"QCD Axion Conversion in Magnetospheres of Neutron Stars","authors":"Shubham Yadav, Sachin Dev Kushwaha, Kamni Pawar","score":4.9,"section":"replacement","rank":27,"parts":[0.0,0.06,0.16,0.0,0.07],"note":"Closest of your papers: [[2855387]] (coupling 0.02, 3 shared references). Closest network paper: [[2697191]] (coupling 0.06, 8 shared references).","abstract":"The axion-converted-photons flux plays a key role in searches of QCD axions as a dark matter (DM) candidate. In addition to solving the strong CP problem, these may explain the properties of the mysterious DM. Neutron star (NS) cooling by neutrino/axion emissions rate constrains the astrophysical properties of superdense matter. We attempt to analyse the impact of strong magnetic fields on the emission properties of axions by employing the APR, FPS, and SLY equation of State (EoS). We modify the Tolman Oppenheimer Volkoff (TOV) equations by considering effects of strong fields' and generate profiles. We assume Cooper-pair-breaking formation (PBF) and the Bremsstrahlung process occurring in the core of NS. We use the radial distance-dependent magnetic field configuration within the permissible limit of the central magnetic field. Our work explores the variations in the axion masses of 10 meV, 15 meV, and 20 meV as a cooling source for spherically symmetric magnetised NSs. We have also shown the energy spectrum of axions and their conversion to photons. Our analysis shows that the cooling rate and the luminosity of observables (axions) for NSs change significantly due to the magnetic field. The results for the luminosity of axions is quite sensitive to its mass and EoS, as the less separation is observed for SLY EoS in comparison to the FPS and APR EoS. We report that the spectrum of axions from the Bremsstrahlung process dominates over the PBF process at lesser axion energies, within the possible axion mass range for PSR J1357-6429 NS. Our results reveal that the impact of the magnetic field is less at lower axion energies, indicating the necessity for including a magnetic field in axion-to-photon conversion mechanisms. The results for the axions mass 10 meV and 15 meV as compared to 20 meV confirms the existing report of the 16 meV."},{"arxiv":"2606.17132","id":"3169184","title":"Are neutrinos Majorana? Fixed-target and high-energy astrophysical searches decide","authors":"Gabriela Barenboim, Mauricio Bustamante, Qinrui Liu","score":4.8,"section":"replacement","rank":28,"parts":[0.06,0.03,0.12,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1854224]] (coupling 0.01, 3 shared references). Closest network paper: [[2941092]] (coupling 0.04, 10 shared references).","abstract":"The original version of this paper proposed a new approach to determining whether neutrinos are Dirac or Majorana fermions, a fundamental open question in particle physics. Conventional searches rely on neutrinoless double beta decay, but this electron-only channel suffers from blind spots. We propose a new, complementary probe to overcome this limitation. A heavy neutral lepton (HNL) triggers a high-energy shift in how the active neutrino flavors ($ν_e$, $ν_μ$, $ν_τ$) mix---but only if the neutrinos are Majorana. For GeV-scale HNLs, the upcoming beam-dump experiment SHiP can discover the HNL and measure how it mixes with the active flavors.However, the proposed signature of the Majorana nature of neutrinos does not exist. The reasons are explained here. The analysis has been superseded by Ref.~\\cite{Barenboim:2026udr}. The original version is retained as v1 for the record."},{"arxiv":"2602.01010","id":"3113767","title":"Search for Vector-Like Singlet Top ($T$) Quark in a Future Muon-Proton ($μp$) Collider at $\\sqrt{s} = 5.29, 6.48,$ and $9.16$ TeV using Advanced Machine Learning Architectures","authors":"Haroon Sagheer, M. Tayyab Javaid, Ijaz Ahmed, M. Danial Farooq, Jamil Muhammad","score":4.7,"section":"replacement","rank":29,"parts":[0.0,0.09,0.14,0.0,0.0],"note":"Closest of your papers: [[1615477]] (coupling 0.03, 4 shared references). Closest network paper: [[2829800]] (coupling 0.05, 10 shared references).","abstract":"We study the sensitivity of a future $μp$ collider to singly produced singlet vector-like $T$ quarks in the $T\\to Wb$ decay mode across both fully hadronic ($bjj$) and leptonic ($b\\ellν$) final states at $\\sqrt{s}=5.29$, $6.48$, and $9.16~\\mathrm{TeV}$. Utilizing resolved-object reconstruction and TMVA-based multivariate classifiers (BDT, BDTG, MLP, and Likelihood), we perform a fast-simulation scan over $m_T=2$--$5~\\mathrm{TeV}$ and the $(g^{*},m_T)$ parameter space. To quantify improvements, we compare this multivariate selection against the closest cut-based baseline at a benchmark point of $m_T=3~\\mathrm{TeV}$, $\\sqrt{s}=9.16~\\mathrm{TeV}$, and $\\mathcal{L}=3000~\\mathrm{fb}^{-1}$, incorporating a $20\\%$ background-normalization uncertainty via the Asimov significance $Z_A$. At this benchmark, the hadronic channel exhibits a substantial enhancement in both $S/\\sqrt{S+B}$ and $Z_A$, improving from $18.05$ and $1.44$ to $273.51$ and $42.24$, respectively. Similarly, the leptonic channel improves from $3.51$ and $0.330$ to $113.85$ and $21.51$. In the full parameter scan, the $\\sqrt{s}=9.16~\\mathrm{TeV}$ configuration provides the strongest sensitivity at $\\mathcal{L}=3000~\\mathrm{fb}^{-1}$. The hadronic channel excludes (discovers) regions with $g^{*}\\in[0.20,0.50]$ ($[0.30,0.50]$) up to $m_T\\approx4.0~(3.5)~\\mathrm{TeV}$, while the leptonic channel remains sensitive up to $m_T\\approx5.0~\\mathrm{TeV}$ for $g^{*}\\in[0.10,0.50]$. These gains arise from the higher-purity multivariate signal regions evaluated under a common significance prescription, and not from a change of the collider configuration. The projections assume resolved-object reconstruction and fast detector simulation, and the absolute reach should be read with these assumptions in mind."},{"arxiv":"2611.04890","id":"3222820","title":"DAMA/LIBRA dark matter signal: a global analysis","authors":"Matti Heikinheimo, Sebastian Sassi, Alex Stendahl, Kimmo Tuominen, Niklas Zimmermann","score":4.5,"section":"new","rank":30,"parts":[0.0,0.04,0.17,0.0,0.07],"note":"Closest of your papers: [[1119599]] (coupling 0.01, 1 shared references). Closest network paper: [[1862804]] (coupling 0.06, 4 shared references).","abstract":"The annual modulation reported by the DAMA/LIBRA collaboration remains in tension with the null results of other direct-detection experiments. We investigate the compatibility of DAMA/LIBRA with LZ, PICO-60 and CDMSlite within a generalized non-relativistic effective field theory (EFT) framework. In addition to the EFT operator expansion we investigate additional modifications to the standard WIMP picture, including inelastic scattering, variations in the NaI quenching factors, and a rescaling of the dark-matter velocity dispersion. We perform a Markov chain Monte Carlo analysis in this extended model space, using two alternative approaches to the likelihood function describing the DAMA/LIBRA data. Both approaches result in strong discrepancy between the data from DAMA/LIBRA and other experiments. We conclude that the extended model space considered here cannot accommodate the DAMA/LIBRA signal while remaining consistent with the non-observation of dark matter in other experiments."},{"arxiv":"2611.03793","id":"3222490","title":"Gaia's dark partners: A new signature of dissipative dark matter","authors":"Badal Bhalla, David Dunsky, Akshay Ghalsasi, Benjamin V. Lehmann, Jackie Lodman, Kuver Sinha","score":4.5,"section":"cross","rank":31,"parts":[0.0,0.03,0.19,0.0,0.07],"note":"Closest of your papers: [[2859009]] (coupling 0.01, 2 shared references). Closest network paper: [[2051195]] (coupling 0.07, 30 shared references).","abstract":"The Gaia mission has greatly improved our understanding of the stellar binary population. Beyond providing an extensive catalog of binary systems with two luminous stars, Gaia has also discovered several systems that appear to be star--black hole (BH) binaries. One of the leading candidate formation channels for these systems is dynamical exchange, in which one component of a star--star binary is ejected from the system and replaced by a BH. Exchange processes are very sensitive to the velocity distribution of the incoming objects, and become very efficient in the limit that perturbers are slow, so the exchanged binary population is a sensitive probe of slow-moving objects. A population of slow-moving, nonluminous objects is naturally produced in dissipative dark matter (DDM) scenarios, where a subcomponent of dark matter can cool to form a dark disk and dark compact objects (DCOs), including but not limited to BHs, with a small velocity dispersion. In this work, we evaluate the rate at which DCOs formed by DDM exchange into star--star binaries to form star--DCO binaries. We find that in a wide range of parameter space, even under conservative assumptions, the rate of exchange interactions is sufficient to produce the objects that Gaia has observed to date. In some portions of parameter space, the predicted exchange rate is well in excess of the rate estimated from observations. We point out the potential for competitive constraints on the DDM parameter space with current and future data, making the Gaia mission an important testbed for dark sector cooling."},{"arxiv":"2611.04802","id":"3222623","title":"Study of enhancing the signal-background separation for the Higgs boson production in association with a single top-quark in $pp$ collisions at the LHC","authors":"Rustam Azimzade, Alina Dadashova, Igor Boiko, Vladimir Lyubushkin, Nazim Huseynov","score":4.4,"section":"new","rank":32,"parts":[0.0,0.06,0.17,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.02, 3 shared references). Closest network paper: [[2035302]] (coupling 0.06, 12 shared references).","abstract":"In this paper, a multivariate analysis based approach for enhancing the extraction of the rare Standard Model (SM) process being studied - Higgs boson production in association with a single top quark (tH) - from the prevailing background processes is presented. The analysis was performed using a Monte Carlo generated dataset simulating the outcomes of proton-proton collisions at the Large Hadron Collider (LHC). A deep fully connected neural network was developed for signal-background discrimination, incorporating a masking mechanism designed to suppress the contribution of input variables associated with objects that were not reconstructed in a given event. The performance of the masked architecture was evaluated on independent Monte Carlo samples. The results of the proposed methodology are compared with a conventional cut-based approach in terms of the statistical significance of the tH production channel. The developed framework was tested using a simulated dataset corresponding approximately to the combined statistical samples of LHC Runs 1, 2, and 3."},{"arxiv":"2611.04468","id":"3222587","title":"Vertex-resummed kinetic theory of dipole-symmetric bosons from 2PI effective action","authors":"Chun-Wei Su","score":4.0,"section":"new","rank":33,"parts":[0.0,0.0,0.27,0.0,0.0],"note":"Closest network paper: [[2677060]] (coupling 0.09, 7 shared references).","abstract":"The formalism of non-equilibrium dynamics for the dipole-symmetric $U(N)$ model involving $N$-component charged scalar fields is studied on the Schwinger-Keldysh contour by a systematic $1/N$ expansion of two-particle-irreducible (2PI) effective action to the next-to-leading order (NLO). The differential equations describing non-equilibrium evolution equations of two-point functions and field expectation values related to the symmetry breaking in the dynamics are derived, which encompass scatterings between modes essential in the late-time evolution and thermalization beyond the scope of the mean field. At the late-time regime of the evolution, the leading-order (LO) gradient expansion is performed to construct the vertex-resummed kinetic theory by encoding non-perturbative effects in the vertex through the resummation, which is distinct from the standard kinetic theory written by the weak-coupling expansion."},{"arxiv":"2611.04136","id":"3222533","title":"Revisiting the gamma-ray signal from light ALPs emitted during the evaporation of memory-burdened PBHs","authors":"Cheng-Rui Jiang, Tong Li","score":3.8,"section":"new","rank":34,"parts":[0.0,0.07,0.12,0.0,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.02, 3 shared references). Closest network paper: [[2697191]] (coupling 0.04, 8 shared references).","abstract":"The memory-burden effect was recently proposed to take into account the information back-reaction in the evaporation of primordial black holes (PBHs). In this work, we systematically explore the axion-like particle (ALP) production via the evaporation of memory-burdened PBHs and the subsequent ALP-photon conversion in cosmic magnetic fields. The PBH evaporation progress is divided in the semiclassical phase of Hawking radiation and the quantum memory-burden phase. The time evolution of PBH mass and the gamma-ray flux after the conversion of PBH-emitted ALP are then evaluated by considering the memory-burden induced PBH entropy suppression. Furthermore, we investigate the detection prospects of this evaporation-conversion signal in next-generation satellite telescopes, including AMEGO, e-ASTROGAM and MAST. The detectable PBH mass range is extended down to masses much smaller than $10^{15}$ g. Applying the Fisher forecasting method, we derive the projected sensitivity for PBH fraction $f_{\\rm PBH}$ and ALP-photon coupling $g_{aγγ}$."},{"arxiv":"2506.09103","id":"2933346","title":"The Primakoff effect: The Axion-Photon Mixing in the Context of Stellar Plasma Physics","authors":"Bernard Teles de Menezes","score":3.7,"section":"replacement","rank":35,"parts":[0.0,0.04,0.13,0.0,0.07],"note":"Closest of your papers: [[1607572]] (coupling 0.01, 1 shared references). Closest network paper: [[1843058]] (coupling 0.04, 3 shared references).","abstract":"We propose in this work the study of the production of axions in stellar plasma medium through an external magnetic field. In the background field approximation, we can show that the presence of the external magnetic field induces a mixing between the photon and the axion, i.e. the so called Primakoff effect. Since the axion is one of the greatest candidates for dark matter, for being a neutral pseudo-scalar field, the Primakoff process constitutes a mechanism (or portal) to access the dark sector, which in turn provides us new perspectives beyond the standard model. In the high energies limit, observables like probabilities transitions and particles production rates were computed."},{"arxiv":"2602.13384","id":"3120654","title":"CMB Spectral Distortions from Resonant Conversions in Atomic Dark Sectors","authors":"Duncan K. Adams, Jared Barron, Bryce Cyr, Xiuyuan Zhang","score":3.7,"section":"replacement","rank":36,"parts":[0.0,0.03,0.19,0.0,0.0],"note":"Closest of your papers: [[1904961]] (coupling 0.01, 1 shared references). Closest network paper: [[2875244]] (coupling 0.07, 8 shared references).","abstract":"Dark sectors consisting of atomic constituents (electrons, protons, and photons) offer a well-motivated extension to the Standard Model while providing multiple avenues for phenomenological study. In this work, we explore the impact of conversions between the dark and Standard Model photons in the primordial CMB spectral distortion epoch ($10^3 \\lesssim z \\lesssim 10^6$). These conversions are resonantly enhanced when the induced thermal masses of both photonic species are equal, thus leading to the possibility that sizeable distortions can be produced. To this end, we solve the Boltzmann equation at early times to determine the (irreducible) freeze-in or freeze-out abundance of dark photons. This procedure also allows us to update the limits on generic milli-charged dark sectors using the ACT DR6 bound on the number of effective radiative degrees of freedom ($N_{\\rm eff}$). By then modeling the evolution of the thermal masses in both sectors, we compute the primordial CMB distortion using the Landau-Zener formalism. We find that when the dark electron and proton are roughly similar in mass (the positronium limit), current spectral distortion data from the COBE/FIRAS instrument is able to rule out novel regions of parameter space. We also forecast bounds from the proposed FOSSIL satellite, finding that spectral distortions can also be used to probe the ultra-low dark electric charge regions of parameter space, which are difficult to investigate by other means."},{"arxiv":"2609.17858","id":"3204430","title":"Matter Swapping between Two Branes: A Local Type IIB D3--D7--D3 Mechanism for Charged-Fermion Mixing via E3 Instantons","authors":"Michaël Sarrazin","score":3.7,"section":"replacement","rank":37,"parts":[0.0,0.08,0.08,0.0,0.0],"note":"Closest of your papers: [[2030200]] (coupling 0.03, 2 shared references). Closest network paper: [[2149989]] (coupling 0.03, 3 shared references).","abstract":"Effective infrared two-sheeted descriptions of fermion mixing between braneworlds have emerged in several distinct realizations and lead to testable matter-swapping effects, motivating low-energy searches and cosmological applications. The recurrence of the same low-energy fermion operator motivates investigating whether this structure can also arise from a D-brane mechanism. We investigate a local Type IIB D3$_+$--D7--D3$_-$/E3 mechanism for generating perturbatively forbidden interbrane mixing. Under explicitly stated microscopic conditions, the E3 instanton generates fermion mixing with both scalar and pseudoscalar components. The pseudoscalar component reproduces the characteristic mixing structure of the two-sheeted fermion operator, while D7 Wilson transport supplies the gauge-invariant relative connection between the two brane sectors. We establish the corresponding gauge matching for transitions between stationary states at resonance. The analysis also provides a model-building roadmap toward a compact phenomenological realization. Such a realization requires electromagnetic sequestering of the two fermion sectors and a sufficiently light non-uniform D7 gauge mode capable of mediating a long-range relative interaction. In such a compactification, the mixing parameter $g$ would be determined by microscopic instanton data and matter-field normalization, providing a connection to low-energy constraints."}],"refs":{"3158084":{"first":"Dreiner","year":2026,"nauth":4,"title":"The Single Photon Signature of a Light Long-lived Neutralino at Remote Detectors at the LHC","role":"other"},"2513697":{"first":"De Romeri","year":2022,"nauth":6,"title":"Physics implications of a combined analysis of COHERENT CsI and LAr data","role":"other"},"1518747":{"first":"Arcadi","year":2017,"nauth":8,"title":"The waning of the WIMP? A review of models, searches, and constraints","role":"other"},"2085162":{"first":"Atzori Corona","year":2022,"nauth":8,"title":"Impact of the Dresden-II and COHERENT neutrino scattering data on neutrino electromagnetic properties and electroweak physics","role":"other"},"1615477":{"first":"Flórez","year":2017,"nauth":5,"title":"Expanding the Reach of Heavy Neutrino Searches at the LHC","role":"seed"},"2013947":{"first":"Mahata","year":2021,"nauth":4,"title":"Study of the semileptonic $B_c \\to \\eta_c \\tau^- \\bar \\nu _\\tau$ decay in $W'$ model","role":"other"},"2875244":{"first":"Oliveira","year":2025,"nauth":5,"title":"Type-II seesaw mechanism for Dirac neutrinos and its implications on N$_{eff}$ and lepto const why=s=>esc(s).replace(/\[\[(\d+)\]\]/g,(m,k)=>{const r=REFS[k];return r?`<span class="ref ${r.role}" tabindex="0" data-ref="${k}">${esc(r.first)} ${r.year}</span>`:m});
const tex=el=>{if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([el]).then(()=>fold()).catch(()=>{})};
const NEWS=N.filter(isNew).sort((a,b)=>a.rank-b.rank);
document.getElementById('eyebrow').innerHTML=`arXiv ${esc(M.cat)} · <a href="${esc(M.url)}" target="_blank" rel="noopener">${esc(M.date)}</a>`;
document.getElementById('dek').textContent=`${M.nrel} of the ${M.nlist} papers in this listing (${M.counts.new} new, ${M.counts.cross} cross-lists, ${M.counts.replacement} replacements) score ${M.threshold} or more for belonging to the reference and citation network of your ${M.nown} papers and the ${M.next} papers by other authors around them. Highest score first.`;
const T=!!M.topics;   // network file with shared phrases: 35/30/15/10 + 10% shared topics
document.getElementById('foot').innerHTML=`<p><b>Score (0–100).</b> ${T?35:40}% direct citations of network papers (each of your papers counts 1, each other network paper 0.6, network papers with over 1,000 citations 0.06; saturating as 1 − e<sup>−x</sup>); ${T?30:35}% bibliographic coupling with your own papers (idf-weighted cosine of INSPIRE-linked reference sets, best match and mean of the top three, 0.30 = full marks); 15% best coupling with the other network papers (0.35 = full marks); 10% authorship (you, or your co-authors)${T?`; 10% shared topics: technical phrases of two or more words in the title and abstract that your papers and the network use much more often than hep-ph as a whole (each weighted by how much more${M.halfLife?`, with recent papers counting more: a paper's weight halves every ${M.halfLife} years`:''}; saturating as 1 − e<sup>−x/3</sup>)${(M.watch||[]).length?`, plus your watch topics (${M.watch.map(esc).join(', ')})`:''}`:''}.</p>
<p><b>Data.</b> Network: INSPIRE records supplied with the project. Listing papers: INSPIRE records where already harvested (${M.onInspire} of ${M.nlist}); for the rest the reference list was read from the arXiv source and matched to INSPIRE by arXiv number, DOI and texkey. Only links between papers on this page are drawn. Built ${esc(M.built)}.</p>`;
const P=['Direct citations','Coupling to your papers','Coupling to network','Authorship','Shared topics'];
const PS=['Citations','Your papers','Network','Authors','Topics'];   // short labels for phones
function list(){const box=document.getElementById('list');
  if(!NEWS.length){box.innerHTML=`<div class="empty">No paper in this listing reaches a score of ${M.threshold}.</div>`;document.getElementById('mainnet').hidden=true;return}
  NEWS.forEach(n=>{const d=document.createElement('article');d.className='paper';d.id='p'+n.i;
    d.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <h2>${esc(n.title)}</h2>
    <div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    <p class="abs">${esc(n.abstract)}</p><button class="linkbtn absmore" type="button" hidden>More</button>
    <p class="why">${why(n.note)}</p>
    <div class="row"><div class="bars">${n.parts.map((v,j)=>`<span><span class="pl">${P[j]}</span><span class="ps">${PS[j]}</span> <span class="mb"><i style="width:${Math.round(v*100)}%"></i></span></span>`).join('')}</div><span>${n.nlinked} of ${n.nref} references linked to INSPIRE · refs from ${esc(n.src)}</span></div>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a>${n.html?`<a href="https://arxiv.org/html/${esc(n.arxiv)}" target="_blank" rel="noopener" title="arXiv's experimental HTML version">HTML</a>`:''}<button class="linkbtn graphbtn" type="button">Show in network</button></div>`;
    d.querySelector('.graphbtn').addEventListener('click',()=>pick(n,true));
    d.querySelector('.absmore').addEventListener('click',e=>{const o=d.classList.toggle('open');e.target.textContent=o?'Less':'More'});
    box.appendChild(d)});
  toc();tex(box)}
// Phones: long author lists show the first 3 and "et al." (tap to expand); abstracts fold to 3 lines with More.
function authors(s){const a=String(s||'').split(', ');if(a.length<=3)return esc(s);
  return `<span class="au-short">${esc(a.slice(0,3).join(', '))} <button class="aubtn" type="button" aria-label="Show all ${a.length} authors">et al. (+${a.length-3})</button></span><span class="au-full">${esc(s)}</span>`}
document.addEventListener('click',e=>{const b=e.target.closest('.aubtn');if(b)b.closest('.authors').classList.add('open')});
function fold(){document.querySelectorAll('.paper').forEach(d=>{const p=d.querySelector('.abs'),b=d.querySelector('.absmore');
  if(!p||!b||d.classList.contains('open'))return;b.hidden=!(p.scrollHeight>p.clientHeight+2)})}
function toc(){const t=document.getElementById('toc');if(!NEWS.length)return;t.hidden=false;
  const X=RAW.next||[];
  t.innerHTML=`<h3>In this listing</h3><ol>${NEWS.map(n=>`<li><a href="#p${n.i}"><span class="sc${n.role==='repl'?' repl':''}">${n.score.toFixed(0)}</span><span class="tt">${esc(n.title)}</span></a></li>`).join('')}${X.length?`<li class="more-link"><a href="#more"><span class="sc">+${X.length}</span><span class="tt">The next ${X.length} papers by score (folded)</span></a></li>`:''}</ol>`;
  const m=t.querySelector('.more-link a');if(m)m.addEventListener('click',()=>{document.getElementById('more').open=true});tex(t)}
let sel=NEWS[0]||null, hover=null, query='', G;
const svg=d3.select('#svg'), tip=document.getElementById('tip');
function draw(){
  if(!NEWS.length)return;
  const RNG=d3.randomLcg(11);
  const W=Math.max(300,document.getElementById('chart').clientWidth), H=W<600?500:480, m={l:16,r:16,t:20,b:34};
  svg.attr('viewBox',`0 0 ${W} ${H}`); svg.selectAll('*').remove();
  const yrs=d3.extent(N,n=>n.year);
  const x=d3.scaleLinear().domain([yrs[0]-.5,yrs[1]+1.2]).range([m.l+8,W-m.r-8]);
  const ticks=x.ticks(W<600?6:12).filter(t=>Number.isInteger(t)&&t<=yrs[1]);
  svg.append('g').attr('class','grid').selectAll('line').data(ticks).join('line').attr('x1',d=>x(d)).attr('x2',d=>x(d)).attr('y1',m.t).attr('y2',H-m.b);
  svg.append('g').attr('class','axis').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x).tickValues(ticks).tickFormat(d3.format('d')).tickSizeOuter(0));
  const cy=(m.t+H-m.b)/2, xf=n=>isNew(n)?x(yrs[1]+.75):x(n.year);
  const sim=N.map(n=>({n,x:xf(n)+(RNG()-.5)*4,y:cy+(RNG()-.5)*H*.5}));
  const links=E.map(e=>({source:sim[e.s],target:sim[e.t],s:e.s,t:e.t,k:e.k}));
  d3.forceSimulation(sim).force('x',d3.forceX(s=>xf(s.n)).strength(1)).force('y',d3.forceY(cy).strength(.04))
    .force('link',d3.forceLink(links).strength(.03)).force('charge',d3.forceManyBody().strength(-40))
    .force('col',d3.forceCollide(s=>r(s.n)+2)).stop().tick(320);
  sim.forEach(s=>{s.y=Math.max(m.t+8,Math.min(H-m.b-8,s.y));s.x=Math.max(m.l+4,Math.min(W-m.r-4,s.x))});
  G=svg.append('g');
  G.append('g').selectAll('path').data(links).join('path').attr('class',l=>'edge '+l.k)
    .attr('d',l=>{const a=l.source,b=l.target;return `M${a.x},${a.y}Q${(a.x+b.x)/2},${(a.y+b.y)/2-Math.abs(a.x-b.x)*.12} ${b.x},${b.y}`});
  G.append('g').selectAll('circle').data([...sim].sort((a,b)=>RANK[b.n.role]-RANK[a.n.role])).join('circle')
    .attr('class','node').attr('cx',s=>s.x).attr('cy',s=>s.y).attr('r',s=>r(s.n)).attr('fill',s=>col(s.n))
    .on('pointerenter',(ev,s)=>{hover=s.n;showTip(ev,s.n);paint()}).on('pointermove',(ev,s)=>showTip(ev,s.n))
    .on('pointerleave',()=>{hover=null;tip.hidden=true;paint()}).on('click',(ev,s)=>pick(s.n,false));
  const lab=sim.filter(s=>isNew(s.n)||s.n.role==='seed'||s.n.deg>=3);
  const L=lab.map(s=>{const right=s.x>W*.8,t=isNew(s.n)?`#${s.n.rank} ${s.n.first}`:`${s.n.first} ${s.n.year}`,w=t.length*6.2;return{s,t,right,x0:right?s.x-r(s.n)-4-w:s.x+r(s.n)+4,w,y:s.y+4}}).sort((a,b)=>a.y-b.y);
  const placed=[];L.forEach(l=>{let k=0;while(k<40&&placed.some(p=>l.x0<p.x0+p.w&&p.x0<l.x0+l.w&&Math.abs(l.y-p.y)<13)){l.y+=13*(k%2?-1:1)*(1+Math.floor(k/2));k++;l.y=Math.max(m.t+10,Math.min(H-m.b-4,l.y))}placed.push(l)});
  G.append('g').selectAll('text').data(L).join('text').attr('class','nlabel').attr('x',l=>l.right?l.s.x-r(l.s.n)-4:l.s.x+r(l.s.n)+4).attr('y',l=>l.y)
    .attr('text-anchor',l=>l.right?'end':'start').text(l=>l.t);
  paint();
}
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  const nmin=M.nextMin;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}${nmin!=null?`: every paper scoring ${nmin} or more, and at least ${M.nextCount} when available`:''}; not drawn in the network`;
  const cut=nmin!=null?X.findIndex(n=>n.score<nmin):-1;
  box.innerHTML=X.map((n,i)=>(i===cut?`<li class="divider">Below ${nmin}: weaker relation (most of these share no specific reference, coupling or topic with your work)</li>`:'')+`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
list();nextList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
