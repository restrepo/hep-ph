,68,"c"],[112,109,"c"],[76,45,"c"],[25,113,"k"],[134,71,"c"],[19,114,"k"],[62,63,"c"],[27,104,"c"],[117,88,"c"],[27,106,"c"],[111,92,"c"],[55,52,"c"],[8,115,"k"],[132,124,"c"],[111,41,"c"],[41,58,"c"],[76,57,"c"],[74,117,"c"],[1,29,"c"],[58,100,"c"],[26,43,"k"],[97,98,"c"],[3,123,"c"],[63,50,"c"],[97,81,"c"],[92,67,"c"],[6,127,"k"],[104,34,"c"],[61,33,"c"],[92,81,"c"],[101,77,"c"],[38,122,"c"],[68,98,"c"],[53,68,"c"],[67,65,"c"],[60,59,"c"],[36,110,"c"],[12,66,"k"],[106,110,"c"],[75,32,"c"]],"next":[{"arxiv":"2607.09282","id":"3179642","title":"Leptogenesis with sub-electroweak-scale reheating temperature","authors":"Basabendu Barman, Arindam Basu, Debasish Borah, Nayan Das","score":8.9,"section":"replacement","rank":28,"parts":[0.06,0.07,0.27,0.0,0.05],"note":"Also cites widely used network papers: [[779828]]. Closest of your papers: [[922002]] (coupling 0.03, 4 shared references). Closest network paper: [[2736974]] (coupling 0.10, 48 shared references).","abstract":"We study the generation of the baryon asymmetry of the Universe via leptogenesis during the post-inflationary reheating epoch, considering reheating temperatures below the temperature of sphaleron freeze-out. Within the framework of a monomial inflaton potential during reheating, we analyze three perturbative reheating scenarios in which the inflaton decays into (i) a pair of Standard Model (SM)-like bosons, (ii) a pair of SM-like fermions, or (iii) exclusively into a pair of heavy right-handed neutrinos, which eventually decays into the SM final states after briefly dominating the energy density of the Universe. For each case, we identify the regions of parameter space that successfully reproduce the observed baryon asymmetry consistently tracking the sphaleron interaction rate during reheating, while satisfying existing cosmological constraints. We also highlight the potential of future primordial gravitational wave observations to probe this class of scenarios."},{"arxiv":"2611.08187","id":"3225487","title":"Light Primordial Black Holes from a First-Order Phase Transition near the End of Inflation: Baryogenesis and Gravitational Wave Signatures","authors":"Zihong Cheng, Fa Peng Huang","score":8.5,"section":"new","rank":29,"parts":[0.06,0.07,0.29,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2080612]] (coupling 0.03, 2 shared references). Closest network paper: [[2693756]] (coupling 0.10, 12 shared references).","abstract":"We investigate the formation and cosmological consequences of light primordial black holes (PBHs) from vacuum bubbles nucleated during a spectator sector first-order phase transition in inflation. We construct a phenomenological model in which the spectator potential evolves with the rolling inflaton, allowing vacuum bubbles to nucleate and grow during inflation. The vacuum ordering subsequently reverses near the end of inflation, leaving the bubble interiors in a metastable false vacuum state. We examine their stability against reverse vacuum tunneling and impose benchmark conditions to suppress this process before and after reheating. Sufficiently large bubbles can subsequently undergo supercritical evolution and form PBHs. In this framework, the PBH abundance is determined by the vacuum tunneling history, while the characteristic mass depends on the nucleation epoch and bubble growth during inflation. For sufficiently light PBHs that evaporate before big bang nucleosynthesis, Hawking radiation can create locally superheated regions in which electroweak symmetry is restored, potentially generating a baryon asymmetry in the presence of additional CP-violating interactions. We also investigate the direct gravitational wave (GW) signals from Hawking radiation and the induced GWs from PBH density fluctuations, the latter arising if an early PBH dominated epoch occurs. For representative benchmark parameters, the resulting baryon asymmetry can reach the ten-percent level of the observed value, while the induced GW signal can reach a peak amplitude of $Ω_{\\rm GW,0}h^2\\sim10^{-7}$ at frequencies of order $10$-$10^2\\,{\\rm Hz}$."},{"arxiv":"2611.07426","id":"3224014","title":"First broadband search for fixed-polarization dark photon dark matter with GigaBREAD","authors":"Jialin Yu, Stefan Knirck, Gabe Hoshino, Rakshya Khatiwada, Alex Lapuente, David W. Miller, Andrew Sonnenschein","score":8.0,"section":"cross","rank":30,"parts":[0.0,0.19,0.11,0.0,0.07],"note":"Closest of your papers: [[1741056]] (coupling 0.07, 3 shared references). Closest network paper: [[2703113]] (coupling 0.04, 2 shared references).","abstract":"We present the first search for fixed-polarization dark photon (DP) dark matter in the 44-52$μ\\mathrm{eV}$ mass range, corresponding to 10.7-12.5GHz. GigaBREAD is a room-temperature broadband dish antenna experiment in which DP convert to ordinary photons on a cylindrical metallic emission surface and are focused onto a radio-frequency receiver. Previous searches, including GigaBREAD and several other dish antenna searches, have assumed randomly polarized DP dark matter. However, vector dark matter produced by a misalignment-like mechanism may retain an approximately fixed polarization, leading to sidereal modulation of the detector response as the Earth rotates. We reanalyze the GigaBREAD data using a polarization-matched likelihood that accounts for the time-dependent projection of a fixed DP polarization onto the detector axis. We find no evidence for a fixed-polarization DP signal and set upper limits on the kinetic mixing parameter at the level of $χ\\sim10^{-12}$. These limits are about $20\\%$ better than a naive limit obtained by rescaling the previous GigaBREAD limit under the fixed-polarization assumption."},{"arxiv":"2611.07385","id":"3224011","title":"Natural Dark Matter in Generalized No-scale $\\mathcal{F}$-$SU(5)$ at the HL-LHC and LUX-ZEPLIN Experiment","authors":"Tianjun Li, James A. Maxin, Dimitri V. Nanopoulos","score":7.7,"section":"new","rank":31,"parts":[0.0,0.06,0.15,0.0,0.38],"note":"Closest of your papers: [[2859009]] (coupling 0.02, 3 shared references). Closest network paper: [[2829800]] (coupling 0.05, 14 shared references). Shared topics: relic density.","abstract":"Is a supersymmetric bulk region with sub-200 GeV neutralinos and right-handed sleptons still feasible? Initially the bulk was the discovery target of the supersymmetry (SUSY) pioneers in the 1980s, though reality crashed those ambitions over the subsequent years and decades, presumptively excluding these light neutralinos and sleptons, inviting finely tuned dark matter scenarios to satisfy emerging high-precision relic density measurements. The answer to this important question is $yes$, if we consider the GUT model $\\mathcal{F}$-$SU(5)$, namely, flipped $SU$(5) supplemented with a string derived TeV-scale extra $10+\\overline{10}$ vector-like multiplet and charged vector-like singlet $(XE,XE^c)$, dubbed flippons. We pair $\\mathcal{F}$-$SU(5)$ with effective supernatural supersymmetry (SUSY), known as generalized No-Scale Supergravity (SUGRA). This merging of $\\mathcal{F}$-$SU(5)$ with generalized No-Scale SUGRA solves the SUSY electroweak fine-tuning problem and includes natural dark matter (NDM) that meets the latest 5$σ$ Planck satellite observations through annihilation only. The NDM in this model is imminently under test by the LUX-ZEPLIN 1000-day experiment, thus prospective observed events by LUX-ZEPLIN in 2026-27 will compel confirmation by the high-luminosity LHC (HL-LHC) energizing in 2030. Therefore, we present the parameter space observable at both LUX-ZEPLIN and the HL-LHC that is consistent with all presently operating experiments, including the LHC Run 3 gluino and squark constraints. Our results predict sub-200 GeV neutralinos and right-handed sleptons in the bulk that are not beyond detection, though more massive electroweakinos greater than 600 GeV are also allowed."},{"arxiv":"2611.07067","id":"3223976","title":"QED corrections to $e^+e^-\\toπ^+π^-(γ)$ with amplitude-level resummation","authors":"Stéphane Delorme, Charles Earnshaw, Frank Krauss, Alan Price, Nora Salone, Andrzej Siódmok","score":7.0,"section":"new","rank":32,"parts":[0.06,0.07,0.2,0.0,0.0],"note":"Also cites widely used network papers: [[813721]]. Closest of your papers: [[2690106]] (coupling 0.02, 4 shared references). Closest network paper: [[2873857]] (coupling 0.07, 8 shared references).","abstract":"We present QED corrections to $e^+e^-\\toπ^+π^-(γ)$ in two independent Monte Carlo event generators, KKMC and SHERPA, for point-like scalar pions dressed with the pion form factor. All-order soft-photon exponentiation is combined with exact one- and two-photon tree amplitudes, the complete one-loop correction including the initial-final boxes with coherent interference, and at second order the photonic two-loop vertices and the exact one-loop correction to one-photon emission. At first order their fiducial cross sections agree to $\\lesssim0.04\\%$ and their distributions within statistical precision. The second-order band is $\\sim0.005\\%$ for CMD, $\\sim0.4\\%$ at $4$ GeV and $\\sim0.9\\%$ at $10$ GeV. Theory nuisance parameters estimate missing higher orders, and we construct a new rule for treating radiative return, where first-order corrections are of order one."},{"arxiv":"2611.08221","id":"3225490","title":"DIS-secting the universe with high-energy neutrinos","authors":"Rhorry Gauld, Lorenzo Guerra, Ulrich Haisch, Alessio Vorona","score":6.6,"section":"new","rank":33,"parts":[0.06,0.06,0.18,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2855387]] (coupling 0.02, 5 shared references). Closest network paper: [[2824738]] (coupling 0.06, 15 shared references).","abstract":"We revisit the impact of electroweak (EW) radiative corrections on the kinematic distributions of charged leptons in neutrino-induced charged-current (CC) deep inelastic scattering (DIS). These corrections are particularly relevant for observables sensitive to collinear photon radiation, such as the energy spectrum of high-energy muons detected in neutrino telescopes. To study these effects, we implement full next-to-leading order (NLO) EW corrections to CC DIS in a flexible Monte Carlo framework, supplemented with higher-order logarithmically enhanced final-state QED radiation and coherent scattering contributions. We compare our results to exclusive NLO QCD plus parton shower (PS) predictions obtained with an existing $\\texttt{POWHEG-BOX}$ event generator, examining different PS models and settings. Based on this comparison, we provide recommendations for the use of the $\\texttt{POWHEG-BOX}$ event generator in experimental analyses. We further assess the impact of radiative corrections on the correlation between the observed muon energy and the incoming neutrino energy, and on the mean inelasticity averaged over a realistic neutrino flux. These corrections can exceed $10\\%$, and above about $10^4\\,{\\rm GeV}$ they receive sizeable contributions from photon-initiated and coherent $W$-boson production, which are not included in the event generator."},{"arxiv":"2611.07056","id":"3223970","title":"Searches for electroweak singlets at future plasma wakefield colliders","authors":"So Chigusa, Simon Knapen, Toby Opferkuch, Inbar Savoray, Christiane Scherb, Weishuang Linda Xu","score":6.5,"section":"new","rank":34,"parts":[0.0,0.06,0.12,0.0,0.29],"note":"Closest of your papers: [[1627633]] (coupling 0.02, 3 shared references). Closest network paper: [[2115290]] (coupling 0.04, 4 shared references). Shared topics: singlet scalar.","abstract":"We study the sensitivity of future 10 TeV plasma wakefield colliders to a real electroweak singlet scalar $S$ coupled to the Standard Model through the Higgs portal. Using luminosity spectra obtained from particle-in-cell simulations, we compare $e^+e^-$ and $e^-e^-$ configurations with both flat and round beam profiles, as well as a $γγ$ collider based on Compton backscattering of laser photons off the $e^-e^-$ beams. The $e^-e^-$ and $γγ$ options avoid the open challenge of accelerating positrons in plasma. Without a positron beam, however, the vector boson fusion channels $e^+e^-\\toν\\barνS$ and $e^+e^-\\toν\\barνSS$, which dominate at $e^+e^-$ colliders, can only proceed through secondary positrons and are heavily suppressed. At a $γγ$ collider, this loss in signal rate is partially compensated by additional photon-initiated processes. While the $e^-e^-$ configurations are not as competitive, both the $e^+e^-$ and $γγ$ wakefield options have a reach qualitatively similar to that of a 10 TeV muon collider and the FCC-hh. Between the two, the $γγ$ option gives the stronger sensitivity if the achievable geometric luminosities of $e^+e^-$ colliders are more than a factor of $\\sim$3 lower than that of the $γγ$ collider."},{"arxiv":"2611.07317","id":"3223979","title":"Constraining the parameter space of a singlet down-type vector-like quark","authors":"Mohammad Ahmady, Maryam Bibi, Ruben Sandapen","score":6.3,"section":"new","rank":35,"parts":[0.06,0.08,0.12,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.03, 2 shared references). Closest network paper: [[2842150]] (coupling 0.04, 3 shared references).","abstract":"We consider a minimal New Physics scenario in which the Standard Model is extended by singlet down-type vector-like quark(VLQ). We constrain its parameter space using the measured branching ratios for $B_s \\to μ^+ μ^-$, $B \\to X_s μ^+ μ^-$ and $B \\to X_s γ$, which are all consistent with Standard Model predictions. Besides considering the tree-level flavor-changing-neutral-current amplitude allowed in this NP scenario, we account for a Higgs--VLQ loop amplitude and show that their resulting interference drives the VLQ mass into the discovery reach via direct searches at the LHC. We also examine the implications of this minimal NP scenario for the rare $B \\to K ν\\barν$ decay where there is a persistent tension between the SM prediction and the Belle II measurements."},{"arxiv":"2611.07366","id":"3224093","title":"A framework for matrix-element-corrected QED antenna showers in hadron decays","authors":"F. Abudinén, G. Morgante, P. Skands","score":6.0,"section":"new","rank":36,"parts":[0.06,0.05,0.16,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1679809]] (coupling 0.02, 2 shared references). Closest network paper: [[1866947]] (coupling 0.06, 10 shared references).","abstract":"We present a general framework for the description of QED parton showers in hadron decays. The formalism is constructed in terms of coherent QED antennae with full dependence on particle masses and extends beyond the YFS approach by systematically incorporating spin-dependent (quasi)collinear single-unresolved limits to all orders. In addition, we incorporate corrections derived from tree-level matrix elements up to $\\mathcal{O}(α^2)$ and describe a generic procedure to obtain such matrix elements using FeynRules and MadGraph. We provide an explicit implementation of the method for decays involving pseudoscalar mesons and for decays of vectors and pseudoscalars into fermion-antifermion pairs, within the combined Pythia+Vincia parton-shower Monte Carlo framework, and compare the resulting QED emission spectra to those generated with Photos and Sherpa+Photons++ through the EvtGen generator."},{"arxiv":"2611.07574","id":"3224040","title":"Probing the Seed Effect of Supermassive Primordial Black Holes with Weak Gravitational Lensing","authors":"Lei Zu, Kazunori Kohri","score":5.7,"section":"cross","rank":37,"parts":[0.0,0.06,0.2,0.0,0.07],"note":"Closest of your papers: [[2855387]] (coupling 0.02, 2 shared references). Closest network paper: [[2936837]] (coupling 0.07, 9 shared references).","abstract":"We investigate the cosmological implications of supermassive primordial black holes (PBHs) as a component of dark matter (DM), focusing on their seed effect on large-scale structure formation. In contrast to the Poisson effect associated with the discrete distribution of PBHs, the seed effect arises because PBHs act as early gravitational seeds, accreting surrounding DM and developing dense DM spikes to form dressed PBHs. These structures enhance the matter power spectrum, particularly on small scales. We model their contribution within the halo-model framework under two prescriptions for DM accretion: an optimistic scenario (Case 1) and a conservative scenario (Case 2), which predict different modifications to the 1-halo term. We constrain the PBH abundance using weak-lensing measurements from the Dark Energy Survey Year 3 (DES Y3), performing a Markov Chain Monte Carlo analysis to derive upper limits on the PBH fraction $f_{\\rm PBH}$, as a function of the PBH mass $M_{\\rm PBH}$. We find that weak lensing places competitive constraints on supermassive PBHs, with the upper limits on $f_{\\rm PBH}$ becoming progressively stronger toward higher PBH masses. Case 1, which predicts more efficient DM accretion and hence a larger enhancement of the matter power spectrum, yields stronger constraints than Case 2; in particular, it excludes $f_{\\rm PBH}\\gtrsim10^{-4}$ for $M_{\\rm PBH}\\gtrsim10^{10} M_\\odot$. We further forecast the sensitivity of the Vera C. Rubin Observatory's Legacy Survey of Space and Time (LSST) using mock weak-lensing data and find that the constraints could improve by approximately two orders of magnitude. Our results establish weak gravitational lensing as a sensitive probe of the seed effect of supermassive PBHs and demonstrate its potential to complement other cosmological and astrophysical searches."},{"arxiv":"2611.07826","id":"3223917","title":"Estimating Spectrum-Free Information Bounds for Generative Surrogates Beyond Conditional Collapse","authors":"Chaitanya Dumbre, Sourabh Dube","score":5.5,"section":"new","rank":38,"parts":[0.0,0.09,0.19,0.0,0.0],"note":"Closest of your papers: [[1615477]] (coupling 0.03, 2 shared references). Closest network paper: [[3187354]] (coupling 0.07, 4 shared references).","abstract":"Conditional generative surrogates in high-energy physics, such as models that predict reconstructed jets from partons, are often evaluated on $1\\text{D}$ marginal divergences among other metrics. Taken alone these metrics can reward conditional collapse. On a CMS simulation benchmark, a sampler that ignores the conditioner beats a trained Mixture Density Network (MDN) on all four target marginals under both KL and Wasserstein-1, and cannot be stably separated from a Conditional Flow Matching (CFM) model on two of the four. We instead score the models with the Continuous Ranked Probability Skill Score (CRPSS) from forecast verification, taking the exact marginal as the reference. We show how global skill depends on the evaluation spectrum, and we also report it within bins of a conditioning variable, where that dependence largely goes away. We then introduce a data-driven $k$-Nearest-Neighbor ($k$-NN) extrapolation that estimates the best CRPS the conditioning information allows. Both models agree with this estimate on all four targets, which suggests that current architectures have reached the information available in the conditioner, at least as far as these per-target scores can tell."},{"arxiv":"2611.07008","id":"3223966","title":"Probing Dark Matter-Electron Scattering with the Central Molecular Zone","authors":"Thong T. Q. Nguyen, Shyam Balaji, Carlos Blanco, Pedro De la Torre Luque","score":5.4,"section":"new","rank":39,"parts":[0.0,0.07,0.18,0.0,0.07],"note":"Closest of your papers: [[2859009]] (coupling 0.02, 4 shared references). Closest network paper: [[2942451]] (coupling 0.06, 10 shared references).","abstract":"The Central Molecular Zone, a dense and gas-rich region surrounding the Galactic Center, hosts numerous dense molecular gas cores that provide unique environments to probe dark matter interactions. Among these, the IRS 13E3 cluster is one of the closest to the Galactic Center and one of the most extensively studied. We show that dark matter-electron scattering can substantially ionize molecular hydrogen (H$_2$) in the IRS 13E3 core, contributing to the ionization rate in conjunction with standard cosmic rays. Using the ionization rate inferred from H$_3^+$ observations of the central parsecs, we derive constraints on heavy and ultralight dark photon mediators, a heavy leptophilic mediator, and electric dipole moment interactions in the strongly interacting regime, where terrestrial searches are limited by the overburden problem. Our results highlight the potential of dense molecular cores near the Galactic Center as promising targets for constraining dark matter interactions with future observations."},{"arxiv":"2611.07877","id":"3224082","title":"Can Two-Point Correlations Determine Gravitational Waves from Sound Waves?","authors":"Guangshang Chen, Jianpeng Dai, Yang Xiao","score":5.3,"section":"new","rank":40,"parts":[0.0,0.0,0.35,0.0,0.0],"note":"Closest network paper: [[2969254]] (coupling 0.12, 8 shared references).","abstract":"Sound waves are expected to be a dominant source of gravitational waves (GWs) from cosmological first-order phase transitions. Their spectrum is commonly predicted using the fluid velocity two-point correlation function under the Gaussian approximation. However, since the GW source is quadratic in velocity, connected four-point correlations may also contribute to the GW spectrum. Through two analytical toy examples, we demonstrate that velocity two-point correlations alone does not always uniquely determine the GW spectrum. Moving beyond these idealized examples, we investigate a realistic acoustic source based on stochastic bubble nucleation and growth, proving that the connected contribution becomes subleading during subsequent linear acoustic propagation, although cosmic expansion limits this suppression. These results clarify when two-point reconstruction is reliable and how higher-order velocity correlations and the duration of acoustic emission affect GW predictions."},{"arxiv":"2604.18286","id":"3147008","title":"Analysis of the $D_0^*(2300)$ resonance from lattice QCD under chiral symmetry","authors":"Jing Luo, Bing Wu, Pan-Pan Shi, Meng-Lin Du","score":5.2,"section":"replacement","rank":41,"parts":[0.06,0.01,0.19,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.00, 1 shared references). Closest network paper: [[1710056]] (coupling 0.07, 26 shared references).","abstract":"We reanalyze the lattice spectra for $I=1/2$ $Dπ$ scattering in the $A_1^+$ irreducible representation from [Phys. Rev. D 111, 014503 (2025)] to investigate the impact of chiral and SU(3) flavor symmetries in $S$-wave $Dπ$ scattering and the $D_0^*(2300)$ resonance. By fitting the phase shifts obtained via Lüscher's formula with both traditional and chirally modified effective-range expansion and $K$-matrix parameterizations, we find that the chiral factor shifts the extracted pole mass closer to the threshold (especially for resonances) and substantially reduces the resonance width. These findings are confirmed by unitarized chiral perturbation theory through a direct fit to the lattice spectra with both the single-channel and the $Dπ$-$Dη$-$D_s\\bar{K}$ coupled-channel schemes. Once the coupled channels are incorporated, the two-pole structure of the $D_0^*(2300)$ emerges. The trajectories of the two poles are investigated by varying the pion mass."},{"arxiv":"2610.26892","id":"3216743","title":"Minimal-length kinematics of coherent light and a proposed two-color vacuum chronoscopy","authors":"Zhi-Wei Wang, Saurya Das, Samuel L. Braunstein","score":5.0,"section":"replacement","rank":42,"parts":[0.0,0.0,0.0,0.5,0.0],"note":"Co-authors of yours: Das.","abstract":"The unification of quantum theory and general relativity suggests the existence of a minimal measurable length, leading to a generalized uncertainty principle (GUP) and an energy-dependent vacuum group velocity. Testing these effects with macroscopic objects typically encounters the ``soccer-ball problem,'' where applying Planck-scale deformations to the total momentum predicts observationally ruled-out velocity deviations. We adopt the prescription, natural in quantum field theory (QFT), in which the GUP modifies single-mode commutators, and verify by explicit calculation that the macroscopic group velocity of a multimode coherent pulse reduces to the single-photon GUP velocity evaluated at the central wavelength, multiplied by the classical Gaussian-beam factor, with no dependence on the total pulse energy. The energy--momentum relation $E=pc$ itself is unmodified; the deformation enters through the velocity--momentum relation and is equivalent to a modified dispersion relation in the wave vector, with a quadratic coefficient that depends on which of the two variables is used. The soccer-ball problem --- which arises only when the GUP is applied to the center-of-mass momentum of a composite system --- is therefore absent for coherent light, and macroscopic petawatt pulses probe the same parameter space as single high-energy photons. Building on this framework, we propose a two-color vacuum chronoscopy experiment using a short-pulse petawatt laser and its high-harmonic generation. By systematically varying the macroscopic beam waist, our setup separates Planck-scale kinematic shifts from classical diffraction delays, establishing a controlled, source-independent terrestrial methodology whose sensitivity we assess against current astrophysical bounds and against the dominant waist-independent systematics that limit it, residual-gas dispersion and the harmonic birth-time offset."},{"arxiv":"2606.28498","id":"3174427","title":"Defining a Minimum Resolution for Unbinned Analyses","authors":"Manuel Szewc","score":4.8,"section":"replacement","rank":43,"parts":[0.0,0.07,0.18,0.0,0.0],"note":"Closest of your papers: [[1627633]] (coupling 0.02, 3 shared references). Closest network paper: [[3187354]] (coupling 0.06, 5 shared references).","abstract":"Collider analyses combine rigorous statistical techniques with state-of-the-art Machine Learning models. However, when the latter are used directly to estimate the likelihood function of the background, hard to quantify systematic effects may bias the estimation of the relevant signal parameters. To address this problem, we present the Minimum Resolution Likelihood (MRL) method, which defines a Fiducial Signal Region that aims to turn systematic effects into statistical uncertainties. We show with examples that the resulting signal strength estimation has a reduced bias, with the effect depending on the sample size and type of signal considered. We consider both toy examples and a realistic application based on the HI-SIGMA technique applied to di-Higgs searches."},{"arxiv":"2611.07897","id":"3224044","title":"The Mass Gap Approach to QCD. III. Solution of the gluon confinement problem","authors":"Vakhtang Gogokhia, Gergely Gábor Barnaföldi","score":4.7,"section":"cross","rank":44,"parts":[0.06,0.05,0.09,0.0,0.0],"note":"Also cites widely used network papers: [[1688995]]. Closest of your papers: [[1708907]] (coupling 0.01, 1 shared references). Closest network paper: [[1843233]] (coupling 0.03, 1 shared references).","abstract":"We present reports on progress in the solution of the gluon confinement problem and in the explanation of the scale breaking in the asymptotic freedom regime in QCD. It is based on the previously formulated the mass gap approach to QCD, which sheds the light on a mass origin in its ground state. We have established the exact expression for the full gluon propagator. One of its solution allows to sum up all the severe (more singular than $1/q^2$) infrared singularities which can be accommodated by a single full gluon propagator. In order to correctly treat them, we have developed a formalism of the joint use of the theory of functions of complex variable, and the dimensional regularization method correctly implemented into the theory of distributions. Despite the presence of the mass gap, gluons remain massless. Our solution satisfies the two boundary conditions: it dominates over all other possible solutions at large distances but itself prevents gluons to appear in the physical spectrum. It possesses the asymptotic freedom behaviour at short distances. We discuss the connection of our results to the Elitzur's theorem."},{"arxiv":"2611.04802","id":"3222623","title":"Study of enhancing the signal-background separation for the Higgs boson production in association with a single top-quark in $pp$ collisions at the LHC","authors":"Rustam Azimzade, Alina Dadashova, Igor Boiko, Vladimir Lyubushkin, Nazim Huseynov","score":4.4,"section":"replacement","rank":45,"parts":[0.0,0.06,0.17,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.02, 3 shared references). Closest network paper: [[2035302]] (coupling 0.06, 12 shared references).","abstract":"In this paper, a multivariate analysis based approach for enhancing the extraction of the rare Standard Model (SM) process being studied - Higgs boson production in association with a single top quark (tH) - from the prevailing background processes is presented. The analysis was performed using a Monte Carlo generated dataset simulating the outcomes of proton-proton collisions at the Large Hadron Collider (LHC). A deep fully connected neural network was developed for signal-background discrimination, incorporating a masking mechanism designed to suppress the contribution of input variables associated with objects that were not reconstructed in a given event. The performance of the masked architecture was evaluated on independent Monte Carlo samples. The results of the proposed methodology are compared with a conventional cut-based approach in terms of the statistical significance of the tH production channel. The developed framework was tested using a simulated dataset corresponding approximately to the combined statistical samples of LHC Runs 1, 2, and 3."},{"arxiv":"2611.08183","id":"3225481","title":"Investigating bottom quark effects in Higgs boson pair production","authors":"David Bürg, Gudrun Heinrich, Philipp Rendler","score":4.3,"section":"new","rank":46,"parts":[0.0,0.09,0.11,0.0,0.0],"note":"Closest of your papers: [[1397629]] (coupling 0.04, 2 shared references). Closest network paper: [[2646004]] (coupling 0.04, 3 shared references).","abstract":"We investigate different effects of bottom quark masses in Higgs boson pair production, considering both bottom quark loops and bottom quarks in the initial state. While the effects are negligible at total cross section level, the situation is different for the Higgs boson pair invariant mass distribution close to the production threshold of the two Higgs bosons."},{"arxiv":"2609.33031","id":"3208562","title":"Resonantly-Enhanced Baryogenesis through Asymmetric Capture by Primordial Black Holes","authors":"Fayez Abu-Ajamieh, Xiaoyan Huo","score":4.1,"section":"replacement","rank":47,"parts":[0.0,0.03,0.21,0.0,0.0],"note":"Closest of your papers: [[922002]] (coupling 0.01, 1 shared references). Closest network paper: [[2693756]] (coupling 0.07, 7 shared references).","abstract":"Primordial black holes (PBHs) can generate the Baryon Asymmetry of the Universe (BAU) through asymmetric capture of baryon-charge-carrying particles, but previous realizations of this mechanism typically yield an asymmetry well below the observed value because the relevant CP-violating scattering asymmetry is loop suppressed. We show that this limitation can be overcome through resonant CP violation in a mixed system of two nearly degenerate unstable fermions, $Y_{1,2}$, whose mass splitting is comparable to their decay widths. Rare production of the coherent $Y_1$--$Y_2$ state, followed by CP-asymmetric return and loss decays, generates an $\\mathcal{O}(0.1)$ difference in integrated decay probabilities while preserving the global baryon charge at the Lagrangian level. Embedding this resonant source in the PBH-capture transport system yields the observed baryon asymmetry. We first reproduce the mechanism in a zero-temperature, sudden-evaporation treatment, which gives $η_B^{T=0}\\simeq1.74\\times10^{-10} \\simeq2.00η_B^{\\rm obs}$. We find that after including thermal corrections and continuous PBH evaporation and entropy production, the resulting BAU becomes $η_B = 8.72\\times 10^{-11}$ in agreement with the observed value. An interesting finding of the model is that even if PBH absorption remains active, we would still have BAU $η_{B}^{\\text{no evap}} \\sim 9.1 \\times 10^{-12} \\sim 0.105 η_B^{\\rm obs}$. We further investigate gravitational-wave signatures associated with the primordial fluctuations responsible for PBH formation. The corresponding scalar-induced gravitational-wave spectra peak at $f \\sim 0.16\\text{--}0.17~\\mathrm{MHz}$, with $h^2Ω_{\\rm GW}^{\\rm peak} \\sim (3\\text{--}7)\\times 10^{-8}$. Under idealized sensitivity assumptions, U-DECIGO can achieve signal-to-noise ratios above 10 for the benchmark spectra."}],"rest":[{"arxiv":"2606.21658","title":"Towards LLM-Powered Automation of a Dark Matter Constraint Repository","score":4.1,"section":"replacement","rank":48},{"arxiv":"2607.06046","title":"Radiative decays of $X(3872)$ within $D{\\bar D}^*$ molecular framework","score":3.8,"section":"replacement","rank":49},{"arxiv":"2608.04105","title":"Quarkoniumlike states above open-flavor thresholds in Born-Oppenheimer EFT","score":3.7,"section":"replacement","rank":50},{"arxiv":"2610.39959","title":"$P$-wave quarkonia in jets at the LHC","score":3.7,"section":"replacement","rank":51},{"arxiv":"2611.07136","title":"St   document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}${nmin!=null?`: every paper scoring ${nmin} or more, and at least ${M.nextCount} when available`:''}; not drawn in the network`;
  const cut=nmin!=null?X.findIndex(n=>n.score<nmin):-1;
  box.innerHTML=X.map((n,i)=>(i===cut?`<li class="divider">Below ${nmin}: weaker relation (most of these share no specific reference, coupling or topic with your work)</li>`:'')+`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
// the rest of the day's papers by score: only the title, linked to the arXiv record
function restList(){const X=RAW.rest||[];if(!X.length)return;const d=document.getElementById('rest'),box=document.getElementById('restlist');
  d.hidden=false;d.querySelector('summary').firstChild.textContent=`All other ${X.length} papers in this listing `;
  document.getElementById('restsub').textContent='by score, title only';
  box.innerHTML=X.map(n=>`<li><span class="sc">#${n.rank} · ${n.score.toFixed(1)}</span><a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">${esc(n.title)}</a></li>`).join('');
  d.addEventListener('toggle',()=>{if(d.open)tex(box)})}
list();nextList();restList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
