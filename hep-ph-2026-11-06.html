<script>
const RAW = {"n":[{"id":"3190925","arxiv":"2608.12497","title":"Spontaneous Scoto-leptogenesis","first":"Datta","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 7 network papers: [[2940283]], [[3094526]], [[2623114]], [[1605577]], [[822544]], [[875754]]…. Also cites widely used network papers: [[779828]], [[902365]]. Closest of your papers: [[1455793]] (coupling 0.06, 14 shared references). Closest network paper: [[2940283]] (coupling 0.24, 41 shared references). Shared topics: scotogenic model, neutrino mass, direct detection, direct detection experiment.","score":59.7,"rank":1,"section":"replacement","parts":[0.99,0.21,0.69,0.0,0.85],"abstract":"We propose a low-scale spontaneous leptogenesis scenario within the dynamical minimal scotogenic model for accommodating neutrino masses and inert scalar dark matter simultaneously. Thus, we dub the mechanism Spontaneous Scoto-leptogenesis. In this setup, a rolling Majoron arising from the global $U(1)_{B-L}$ symmetry breaking induces an effective chemical potential for the $B-L$ charge in the presence of $B-L$ violating interactions that allow for the efficient decays and inverse decays of right handed neutrinos (RHN) and RHN mediated scattering, so it gives rise to the observed baryon asymmetry of the Universe through the electroweak sphaleron conversion. The mechanism becomes effective in the strong washout regime and successfully lowers the viable mass scale of the lightest RHN to the range of TeV scales, thereby making the thermal scotogenic leptogenesis with two hierarchical RHNs accessible to direct tests. We identify the roles of the $λ_5$ coupling for spontaneous leptogenesis and inert scalar dark matter through the efficient erasure of the inert scalar asymmetry. We also explore the regime for Majoron dark matter from the kinetic misalignment, showing that a multicomponent dark sector comprising the inert scalar and the Majoron can be realized in the model. The resulting framework provides a unified origin for low-scale baryogenesis, neutrino masses, and multicomponent dark sector, so it can be tested by complementary experimental probes through direct detection experiments, collider searches for inert scalars, and future detection of Majoron dark matter or dark radiation.","authors":"Arghyajit Datta, Hyun Min Lee, Jun-Ho Song","nlinked":107,"nref":112,"src":"INSPIRE","html":true},{"id":"3224074","arxiv":"2611.07509","title":"Scale-Invariant Three-Component Dark Matter and Gravitational Wave Signals","first":"Hosseini","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites your papers: [[1686334]]. Cites 12 network papers: [[2896713]], [[2843521]], [[3221793]], [[3183927]], [[3131565]], [[2862278]]…. Closest of your papers: [[2855387]] (coupling 0.05, 7 shared references). Closest network paper: [[3224074]] (coupling 1.00, 76 shared references). Shared topics: relic density, direct detection.","score":59.6,"rank":2,"section":"new","parts":[1.0,0.15,1,0.0,0.5],"abstract":"We study a classically scale-invariant extension of the Standard Model (SM) with four new fields in a hidden sector: a complex scalar $S$, two Dirac fermions $ψ^{1,2}$ and the gauge boson $V_μ$ of a new $U(1)_D$ symmetry. The scalar $S$ couples to the SM through the Higgs portal. We identify regions of parameter space in which $V_μ$, $ψ^1$ and $ψ^2$ are all stable, giving a three-component dark matter (DM) scenario. The model is classically scale invariant, and the electroweak symmetry breaks because of the loop effects. We impose the observed relic density and current direct detection bounds, and then study the finite temperature effective potential. For a benchmark point, we find a first-order phase transition and compute the resulting gravitational wave (GW) spectrum, which we compare with the projected sensitivities of space-based interferometers. Although the viable parameter space is small, it can be probed by future experiments.","authors":"Mojtaba Hosseini, Rouzbeh Rouzbehi","nlinked":76,"nref":76,"src":"INSPIRE","html":true},{"id":"2775441","arxiv":"2404.05704","title":"Novel collider signatures in the type-I 2HDM+$a$ model","first":"Argyropoulos","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites your papers: [[1627633]]. Cites 8 network papers: [[1932468]], [[1699542]], [[1674879]], [[1724453]], [[1499879]], [[1489221]]…. Also cites widely used network papers: [[1494411]], [[1518747]]. Closest of your papers: [[1627633]] (coupling 0.08, 15 shared references). Closest network paper: [[2775441]] (coupling 1.00, 210 shared references).","score":58.0,"rank":3,"section":"replacement","parts":[1.0,0.24,1,0.0,0.07],"abstract":"The 2HDM+$a$ model is one of the main models used in the interpretations of dark matter searches at the LHC. So far, all the 2HDM+$a$ benchmarks considered by the ATLAS and CMS experiments are limited to a type-II Yukawa sector, in which the Higgs bosons $A$, $H$, and $H^\\pm$ are all constrained to be mass-degenerate and heavier than around $600 \\, {\\rm GeV}$. In this work, we present the first detailed study of 2HDM+$a$ models with a type-I Yukawa sector, which, for moderate values of $\\tanβ$, lift the constraints from flavour physics, allowing the extra Higgs bosons to be even lighter than the $125 \\, {\\rm GeV}$ Higgs boson discovered at the LHC. We discuss several benchmarks where the $A$, $H$, and $H^\\pm$ states are not necessarily mass-degenerate and the signatures that arise in these models, some of which have not yet been explored at the LHC. We present the dominant channels in the studied benchmarks and the expected sensitivity in Run 2 data using truth-level analyses and discuss potential improvements in the experimental searches for Run 3.","authors":"Spyros Argyropoulos, Ulrich Haisch, Ilia Kalaitzidou","nlinked":210,"nref":213,"src":"INSPIRE","html":true},{"id":"3218141","arxiv":"2610.31254","title":"A consistent neutrino determination of the low-energy weak mixing angle","first":"Corona","nauth":8,"year":2026,"cites":0,"role":"repl","note":"Cites 3 network papers: [[2909343]], [[3193100]], [[2762109]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[599285]] (coupling 0.03, 3 shared references). Closest network paper: [[2909343]] (coupling 0.27, 22 shared references).","score":43.5,"rank":4,"section":"replacement","parts":[0.84,0.08,0.77,0.0,0.0],"abstract":"The weak mixing angle, $\\sin^2θ_W$, is a fundamental parameter of the Standard Model and a sensitive probe of electroweak physics across various energy scales. At low momentum transfer, the Standard Model prediction approaches a well-defined low-energy plateau, providing a target for precision tests of the electroweak theory. At the lowest momentum transfer, atomic parity violation (APV) in cesium provides one of the most precise determinations of the weak mixing angle. Here, we review and update the status of this determination and compare it with other available probes. We then consistently reanalyze low-energy neutrino scattering data and combine the resulting determinations from coherent elastic scattering (CE$ν$NS) and neutrino-electron scattering. The complementary sensitivity of these processes to electroweak couplings enables a neutrino-based determination of the low-energy weak mixing angle, accounting for electroweak radiative corrections and relevant theoretical uncertainties. Our global analysis yields $\\sin^2θ_W^{\\rm low}(ν\\,\\text{data}) = 0.232\\pm 0.006$. We assess the consistency and relative impact of the individual neutrino measurements and discuss the prospects for future CE$ν$NS and neutrino-electron scattering experiments to improve the precision of this determination. Our analysis provides an independent test of the Standard Model at low momentum transfer, complementary to that provided by atomic parity violation.","authors":"M. Atzori Corona, M. Cadeddu, N. Cargioli, F. Dordei, L. Ferro, C. Giunti, R. Pavarani, M. Sestu","nlinked":82,"nref":88,"src":"INSPIRE","html":true},{"id":"3122861","arxiv":"2602.18564","title":"Mixed Freeze-In and Freeze-Out Histories and Dark-Sector Decays in a $\\mathbb{Z}_4$ Two-Scalar Model","first":"Carvalho-Corrêa","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[795558]], [[1724453]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1686334]] (coupling 0.09, 6 shared references). Closest network paper: [[2843521]] (coupling 0.14, 12 shared references). Shared topics: relic density.","score":43.1,"rank":5,"section":"replacement","parts":[0.72,0.27,0.41,0.0,0.38],"abstract":"We study dark matter production in a renormalisable $\\mathbb{Z}_4$ Higgs-portal model containing a complex scalar $S_A$ and a real scalar $S_B$, where one or both states remain out of thermal equilibrium with the Standard Model bath. We follow their coupled evolution through conversion, semi-annihilation, and the decay $S_B\\to S_A S_A$ when kinematically allowed. We impose theoretical consistency conditions, limits on invisible Higgs decays, and LZ direct-detection bounds, accounting for each component's relic fraction. We check WIMP/FIMP assignments against interaction rates. When both states are stable, we find viable FIMP--FIMP and mixed WIMP--FIMP scenarios. In mixed cases, the WIMP-like state remains constrained by its Higgs-portal interactions, with the surviving points mainly concentrated near the Higgs resonance. The FIMP-like state can, however, provide a substantial fraction of the relic density with a negligible direct-detection signal. For $M_{S_B}>2M_{S_A}$, the decay of the heavier scalar leads to three production histories: SuperWIMP production, injection-assisted freeze-out, and sequential freeze-in. The mechanism depends on parent and daughter production. These decays can increase the abundance of a WIMP after freeze-out or contribute to the final abundance of a FIMP, changing the relation between the daughter's Higgs coupling and its relic density. Since the primary decays produce no Standard Model particles, electromagnetic and hadronic BBN bounds on visible decay products do not apply directly. We find $r_{\\rm BBN}\\ll1$ throughout the retained sample. To assess effects on structure formation, we use the dark matter fraction produced through decays and an equivalent thermal-WDM mass as approximate diagnostics. Some late-decay configurations are flagged as potentially warm, whereas the sequential freeze-in sample satisfies $m_{\\rm WDM}^{\\rm eq}\\gtrsim1~\\mathrm{MeV}$.","authors":"J. P. Carvalho-Corrêa, B. A. Couto e Silva, B. L. Sánchez-Vega","nlinked":52,"nref":53,"src":"INSPIRE","html":true},{"id":"3222604","arxiv":"2611.04600","title":"Light Mediators at the Neutrino-Dark Matter Frontier: Coherent Scattering, Precision Constraints, and Complementary Searches","first":"Serao","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[2513697]], [[2085162]]. Closest of your papers: [[2080612]] (coupling 0.02, 3 shared references). Closest network paper: [[2085162]] (coupling 0.13, 14 shared references). Shared topics: direct detection.","score":35.3,"rank":6,"section":"replacement","parts":[0.7,0.07,0.37,0.0,0.32],"abstract":"Low-threshold neutrino and dark-matter experiments constrain light mediators through different momentum transfers, targets, and coupling combinations. We examine scalar and vector interactions in coherent neutrino--nucleus scattering, neutrino--electron scattering, and dark-matter direct detection. Three representative interaction models are used to compare recoil spectra and coupling degeneracies. For $^{73}\\mathrm{Ge}$ and $^{131}\\mathrm{Xe}$, the nuclear-charge response matrix has a condition number of approximately 115, so two different targets may still leave nearly parallel blind directions. An analytic profile-likelihood calculation shows how spectral overlap and uncertainties in neutrino interactions affect dark-matter discovery sensitivity in the neutrino fog. We discuss the implications of measurements from COHERENT, CONUS+, LZ, XENONnT, and PandaX-4T and specify which theoretical inputs, detector responses, and statistical correlations are needed to combine their constraints. keyword : coherent elastic neutrino-nucleus scattering; light mediators; neutrino--electron scattering; dark matter direct detection; non-standard interactions; solar neutrinos; complementarity","authors":"Raoul Serao, Mohamed Ouchemhou, Antonio Capolupo, Salvatore Capozziello","nlinked":76,"nref":232,"src":"INSPIRE","html":true},{"id":"3220828","arxiv":"2512.17695","title":"Baryogenesis and EDMs in the 2HDM with a Complex Singlet","first":"Garbrecht","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2773789]]. Closest of your papers: [[2080612]] (coupling 0.03, 2 shared references). Closest network paper: [[3121930]] (coupling 0.38, 52 shared references).","score":33.5,"rank":7,"section":"replacement","parts":[0.45,0.09,1,0.0,0.0],"abstract":"We perform the first joint analysis of baryogenesis from initial Higgs charges (also called Higgsogenesis) and electric dipole moments (EDMs) in a model with two Higgs doublets, a complex scalar, and a Majorana fermion. In our proposed scenario, baryogenesis happens in three steps: (1) The decay of the scalar produces an asymmetry between the two Higgs doublets which is partly transferred to fermions via Standard Model processes. (2) This asymmetry is converted into a $B-L$ charge via interactions mediated by the Majorana fermion. (3) The weak sphaleron processes partially convert the resulting $B-L$ charge into a $B$ asymmetry. We perform a numerical analysis of baryogenesis and the EDM contributions and find that, due to resonant enhancement, baryogenesis is possible with singlet masses as low as $10^5$ GeV. We also find that for some parameters, the model can give large contributions to the electron and neutron EDM while also producing baryogenesis. The present scenario offers a new perspective on interpreting observational bounds in terms of cosmology: Because it relies on out-of-equilibrium decays, the questions of baryogenesis and $CP$ violation in the Higgs sector may be linked with EDM signals without the additional assumption of a first order electroweak phase transition.","authors":"Björn Garbrecht, Edward Wang","nlinked":86,"nref":91,"src":"INSPIRE","html":false},{"id":"3225492","arxiv":"2611.08440","title":"Signatures of Neutrinophilic Pion Dark Matter","first":"Chevallier","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1607799]]. Closest of your papers: [[2859009]] (coupling 0.03, 3 shared references). Closest network paper: [[3081701]] (coupling 0.08, 7 shared references). Shared topics: displaced vertex, small neutrino, neutrino mass, relic abundance.","score":29.8,"rank":8,"section":"new","parts":[0.45,0.08,0.24,0.0,0.81],"abstract":"We study the phenomenology of pion dark matter coupled to neutrinos in a confining sector that dynamically generates both small neutrino masses and dark matter mass from gauge confinement. Dark matter semi-annihilation to active neutrinos or annihilation to light sterile neutrinos can reproduce the observed relic abundance through thermal freeze-out while satisfying constraints from self-interactions. In the first scenario, semi-annihilations of sub-GeV dark matter in the galactic halo produce a flux of antineutrinos which can provide a viable interpretation for the mild electron antineutrino excess reported by the Super-Kamiokande collaboration. We assess the potential of the JUNO detector to test this interpretation. In the second scenario, light sterile neutrinos can leave signatures through displaced vertex searches at accelerator facilities.","authors":"Claire Chevallier, Ji-Heng Guo, Giacomo Landini","nlinked":92,"nref":93,"src":"INSPIRE","html":true},{"id":"3223949","arxiv":"2611.07031","title":"Constraining $U(1)_{L_μ-L_τ}$ Model with Dark Matter Using Relic Density and $N_{\\rm eff}$ Bounds","first":"Gola","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1493855]]. Also cites widely used network papers: [[1362180]]. Closest of your papers: [[2859009]] (coupling 0.03, 4 shared references). Closest network paper: [[1918090]] (coupling 0.14, 15 shared references). Shared topics: relic density.","score":29.3,"rank":9,"section":"new","parts":[0.48,0.09,0.39,0.0,0.38],"abstract":"We study thermal Dirac dark matter in the gauged $U(1)_{L_μ-L_τ}$ model, focusing on resonant annihilation near the $Z'$ pole. We determine the parameter space that satisfies the Planck relic density bound while remaining consistent with collider, astrophysical, and laboratory searches. MeV-scale dark matter and the $Z'$ mediator decouple near the active neutrino decoupling temperature; entropy injection into the neutrino bath modifies $T_ν/T_γ$, leading to a shift in the effective number of relativistic species, $N_{\\rm eff}$. Incorporating the coupled temperature evolution alongside the Planck 2018 limit on $N_{\\rm eff}$, we find that the viable parameter space is restricted to a narrow mass window of $M_{Z'} \\sim 30\\text{--}50\\text{ MeV}$ with $g' \\simeq 10^{-7}-10^{-6}$, well within reach of upcoming fixed-target experiments such as SHiP and LDMX.","authors":"Shivam Gola","nlinked":59,"nref":62,"src":"INSPIRE","html":true},{"id":"","arxiv":"2611.08388","title":"Top-Quark Pair Production and Decay in Extended Higgs Sectors","first":"Banfi","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[1494411]], [[902365]]. Closest of your papers: [[1402978]] (coupling 0.01, 1 shared references). Closest network paper: [[2646004]] (coupling 0.11, 5 shared references). Shared topics: collider phenomenology.","score":26.9,"rank":10,"section":"new","parts":[0.51,0.03,0.3,0.0,0.35],"abstract":"Extensions of the Higgs sector in the Standard Model address outstanding questions like the first-order electroweak phase transition and also present a rich collider phenomenology. The two-Higgs-doublet model is a minimal extension of the Standard Model with an extra complex $SU(2)_L$ doublet, and consists of an extra scalar, a pseudoscalar and a pair of charged Higgs bosons along with a Standard-Model-like Higgs boson. We present a modified version of the hvq library of the POWHEG-BOX-V2 event generator interfaced with the OpenLoops 2 amplitude generator to obtain predictions for top-quark pair production at NLO accuracy, including top-quark decays with full spin correlations in a framework that extends the SM Higgs sector with an extra heavy scalar and a pseudoscalar. The interference effects between the scalar and pseudoscalar signals, and the Standard Model QCD background are implemented. We include parton showers and hadronisation, and take detector effects into consideration. The status of our work and plans to extend it to future collider projects are discussed.","authors":"Andrea Banfi, Alexander Lind, Jonas M. Lindert, Vishakha Lingadahally","nlinked":22,"nref":23,"src":"arXiv source","html":true},{"id":"3224001","arxiv":"2611.07281","title":"Testing the Pseudo-Dirac Nature of Atmospheric Neutrinos","first":"Bitter","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1249404]] (coupling 0.05, 10 shared references). Closest network paper: [[2969254]] (coupling 0.13, 11 shared references).","score":25.5,"rank":11,"section":"new","parts":[0.45,0.14,0.37,0.0,0.0],"abstract":"Pseudo-Dirac neutrinos are characterized by extremely small mass-squared differences between two nearly degenerate, strongly-mixed, active-sterile states. These differences are associated with new very-long oscillation lengths and provide a probe of the nature of neutrinos. Atmospheric neutrinos can probe these oscillations as they allow access to a broad range of baseline distances, from tens of kilometers to the Earth's diameter. We investigate the sensitivity of an experiment like the Deep Underground Neutrino Experiment (DUNE) to the pseudo-Dirac nature of neutrinos through measurements of the atmospheric neutrino flux. We concentrate on the modifications to the atmospheric neutrino energy and angular spectra induced by one new oscillation frequency associated with the $ν_3$ state and determine the parameter space that can be probed with atmospheric neutrinos at a DUNE-like detector. We also comment on the sensitivity of these measurements to the sub-leading \"solar\" oscillations, which are also characterized by a relatively small mass-squared difference.","authors":"Olivia M. Bitter, André de Gouvêa, Srubabati Goswami, Supriya Pan","nlinked":51,"nref":51,"src":"INSPIRE","html":true},{"id":"3224034","arxiv":"2611.07578","title":"Can cosmic neutrinos induce a cosmic birefringence signal?","first":"Reig","nauth":1,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Reig. Cites 1 network paper: [[1493855]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.02, 3 shared references). Closest network paper: [[1847652]] (coupling 0.03, 5 shared references).","score":25.0,"rank":12,"section":"new","parts":[0.48,0.06,0.1,0.5,0.0],"abstract":"A coupling of photons to the cosmic neutrino asymmetry current has been proposed to explain the hinted isotropic rotation of CMB polarization. Gauge invariant UV completions require a Kalb-Ramond field that is exactly dual to a massless axion. We show that, in this case, the product of the axion-photon coupling and the axion-neutrino current coupling is fixed by the signal, $g_{aγ}/f_\\ell=1/Λ_*^2$ with $Λ_*\\simeq10$ TeV. Using $SU(2)_L$ gauge invariance we show that the dual axion couples to electrons as $g_{aγ}g_{ae}=m_e/Λ_*^2\\simeq5\\times10^{-12}\\,\\mathrm{GeV}^{-1}$. This value is excluded by the measured electron magnetic moment combined with light-shining-through-a-wall searches, as well as by stellar evolution. Conserved anomaly-free currents may evade these bounds, but then either a contact interaction among SM fermions excludes the model, or the relic neutrinos decouple from the signal. We conclude that cosmic neutrinos cannot induce a birefringence signal.","authors":"Mario Reig","nlinked":70,"nref":70,"src":"INSPIRE","html":true},{"id":"3225516","arxiv":"2611.08459","title":"Testing the Spin of New Physics with Top Precision Measurements","first":"Lessa","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1982681]]. Closest of your papers: [[2855387]] (coupling 0.04, 4 shared references). Closest network paper: [[2173030]] (coupling 0.06, 5 shared references). Shared topics: vector-like fermion.","score":25.0,"rank":13,"section":"new","parts":[0.45,0.12,0.18,0.0,0.28],"abstract":"Precision measurements can reveal not only the presence of new physics, but also information about the dynamics that generated it. We study this question in top-pair production by comparing three top-philic scenarios: a colored scalar top partner, a colored vector-like fermion, and a spin-one $Z^\\prime$ mediator. The first two contribute through loop corrections, while the $Z^\\prime$ contributes at tree level. We show that the scalar and vector-like fermion scenarios match onto the same effective operator structure at low energies,making their distinction unfeasible using the EFT approach. However, near or above threshold their full loop amplitudes develop distinct momentum-dependent interference patterns. Using the top transverse momentum spectrum we find that resonant and loop-induced effects are relatively easy to distinguish, whereas separating the scalar and vector-like hypotheses is substantially more challenging. Nevertheless, their different analytic structures leave measurable information in the shape of the distribution. These results illustrate how precision differential measurements can probe the spin and dynamics of virtual new states even when they are not directly reconstructed, and motivate more powerful multidimensional analyses.","authors":"André Lessa, Vinícius Rocca, Veronica Sanz","nlinked":50,"nref":64,"src":"INSPIRE","html":true},{"id":"3159193","arxiv":"2605.24473","title":"Freeze-in $SU(2)$ vector dark matter at low reheating temperature","first":"Ghosh","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[1518747]], [[2817040]]. Closest of your papers: [[1746620]] (coupling 0.07, 8 shared references). Closest network paper: [[2962467]] (coupling 0.12, 9 shared references). Shared topics: discrete symmetry, relic abundance.","score":21.2,"rank":14,"section":"replacement","parts":[0.11,0.22,0.35,0.0,0.53],"abstract":"The freeze-in mechanism for dark matter (DM) requires extremely feeble interactions with the Standard Model (SM), preventing thermal equilibrium in the early Universe and typically evading experimental detection. However, for sufficiently low reheating temperatures ($T_{\\rm RH}$), the observed relic abundance can be realized with larger couplings, opening prospects for experimental searches. In this work, we investigate freeze-in production of $SU(2)_{\\rm HS}$ vector dark matter (VDM) in a low-$T_{\\rm RH}$ cosmology. The framework naturally contains three mass-degenerate stable VDM candidates without the need for any additional discrete symmetry. We perform a systematic study of the dark matter phenomenology and identify the parameter space consistent with the observed relic abundance. We work with the approximation of instantaneous reheating and consider the DM abundance to be negligible at $T_{\\rm RH}$. In contrast to conventional freeze-in scenarios, the required DM couplings can be sizable, rendering part of the parameter space already constrained by existing direct searches like PandaX-4T and LZ, while a significant region remains within the reach of future experiments such as DARWIN. Though one can realize the freeze-in mechanism for an abelian $U(1)_X$ vector DM models as well, we find that the non-abelian structure of the $SU(2)_{\\rm HS}$ scenario leads to a distinct feature due to a larger number of dark matter particles, resulting in an enlarged viable parameter space due to the multiplicity of dark matter states.","authors":"Dilip Kumar Ghosh, Sourav Gope, Xiao-Gang He, Xuan Hong, Sk Jeesun","nlinked":45,"nref":45,"src":"INSPIRE","html":true},{"id":"2962456","arxiv":"2508.14898","title":"Lorentz-Equivariance without Limitations","first":"Favaro","nauth":8,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2893828]]. Closest of your papers: [[1627633]] (coupling 0.03, 4 shared references). Closest network paper: [[2893828]] (coupling 0.07, 8 shared references).","score":20.8,"rank":15,"section":"replacement","parts":[0.45,0.07,0.19,0.0,0.0],"abstract":"Lorentz Local Canonicalization (LLoCa) ensures exact Lorentz-equivariance for arbitrary neural networks with minimal computational overhead. For the LHC, it equivariantly predicts local reference frames for each particle and propagates any-order tensorial information between them. We apply it to graph networks and transformers. We showcase its cutting-edge performance on amplitude regression, end-to-end event generation, and jet tagging. For jet tagging, we introduce a large top tagging dataset to benchmark LLoCa versions of a range of established benchmark architectures and highlight the importance of symmetry breaking.","authors":"Luigi Favaro, Gerrit Gerhartz, Fred A. Hamprecht, Peter Lippmann, Sebastian Pitz, Tilman Plehn, Huilin Qu, Jonas Spinner","nlinked":66,"nref":126,"src":"INSPIRE","html":true},{"id":"3224007","arxiv":"2611.07013","title":"Latest $ν$s from the Earliest Galaxies: Probing neutrino self-interactions with JWST","first":"Mondol","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[795558]]. Closest of your papers: [[1755250]] (coupling 0.01, 4 shared references). Closest network paper: [[2052515]] (coupling 0.09, 47 shared references).","score":20.6,"rank":16,"section":"cross","parts":[0.45,0.02,0.27,0.0,0.0],"abstract":"Our Universe serves as a complementary laboratory for particle physics interactions. One intriguing possibility is that neutrinos may have beyond-the-Standard-Model (BSM) self-interactions, which can delay their free streaming and have an observable effect across different redshifts. Such interactions can induce scale-dependent changes in the matter power spectrum. The James Webb Space Telescope (JWST) has opened up a new window onto the early Universe by discovering a large population of high-redshift galaxies up to $z \\sim 15$ and various probable galaxy candidates at even higher redshifts, between $z \\sim 15-30$. Such high-redshift observations can probe the matter power spectrum on small scales, since structure formation is hierarchical and the structures hosting these high-redshift galaxies are therefore expected to be small. We, $\\textit{for the first time}$, use the UV luminosity function data from JWST and combine them with the $\\textit{Planck}$ CMB data to probe neutrino self-interactions ($ν$SI). If only one neutrino flavor experiences such BSM interactions, then $\\textit{Planck}$ + JWST data give a 95% C.L. upper limit on $\\mathrm{Log}_{10}(G_{\\mathrm{eff}}/\\mathrm{MeV}^{-2})$ $\\approx$ $-2.75$ and when all three flavors are interacting, the corresponding constraint becomes $\\lesssim -3.41$; both stronger than those obtained using only $\\textit{Planck}$ data. Our results highlight the power of this new observable, the high-redshift UV luminosity function from JWST as a complementary probe to terrestrial experiments, showing that small-scale observables can open a new window onto smaller neutrino self-interaction strengths.","authors":"Ranjini Mondol, Priyank Parashari, Anirban Das, Vera Gluscevic, Ranjan Laha","nlinked":289,"nref":366,"src":"INSPIRE","html":false},{"id":"3224042","arxiv":"2611.07852","title":"Long lived MeV scale bound state dark matter alleviates the ${}^7 Li$ tension","first":"Prasad","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1755250]] (coupling 0.02, 1 shared references). Closest network paper: [[2051195]] (coupling 0.03, 7 shared references).","score":19.2,"rank":17,"section":"new","parts":[0.45,0.05,0.07,0.0,0.07],"abstract":"We investigate the impact of MeV scale unstable bound state dark matter on both thermal and non thermal Big Bang nucleosynthesis. Focusing on the weakly self interacting regime, we find that this framework can reproduce the theoretically predicted abundances through both short and long lived bound states. While long lived bound states can alleviate the cosmological ${}^7$Li problem, they simultaneously lead to discrepancies with other light element abundances. We show that this tension is resolved by incorporating non thermal nucleosynthesis, which act on these non standard initial light element abundances to alleviate the ${}^7 Li$ tension without violating observational constraints on the other elements. Remarkably, across the range of $\\widetildeρ_B$ and $m_χ$ considered, long lived bound states with lifetimes $10^0\\,{\\rm s}\\lesssimτ\\lesssim10^2\\,{\\rm s}$ can simultaneously resolve the ${}^7$Li problem and a large parameter space remain consistent with the observed abundances of the other light elements. Our results demonstrate that non thermal effects are essential for obtaining a consistent nucleosynthesis history in unstable bound state dark matter scenarios.","authors":"Pa. Gokhula Prasad, V. Suryanarayana Mummidi","nlinked":28,"nref":41,"src":"INSPIRE","html":true},{"id":"3223971","arxiv":"2611.07086","title":"Amplitude Analysis of the Invariant-Mass Spectra of Centrally Exclusively Produced $π^+π^-$ and $K^+K^-$ Pairs in $pp$ Collisions at $\\sqrt{s}=510$ GeV","first":"Giri","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[1688995]] (coupling 0.03, 15 shared references).","score":18.6,"rank":18,"section":"cross","parts":[0.48,0.02,0.08,0.0,0.0],"abstract":"We present an amplitude analysis of the $π^{+}π^{-}$ and $K^{+}K^{-}$ invariant-mass spectra from central exclusive $pp$ collisions at $\\sqrt{s}=510~\\mathrm{GeV}$, measured by the STAR experiment with forward-scattered protons tagged in the Roman Pot detectors. The $π^{+}π^{-}$ channel is described with $f_{0}(500)$, $ρ^{0}(770)$, $f_{0}(980)$, $f_{2}(1270)$, $f_{0}(1500)$ and $f_{0}(1710)$ resonances with $χ^{2}/\\mathrm{ndf}=121.712/57$. The fit also yields $m_{f_{0}(980)}=0.989$ GeV and $Γ=0.091$ GeV. The $K^{+}K^{-}$ channel is described with $f_{0}(980)$, $f_{2}(1270)$, $f_{2}^{\\prime}(1525)$ and $f_{0}(1710)$ resonances with $χ^{2}/\\mathrm{ndf}=14.662/15$. The fiducial cross sections for the individual resonances and interference terms were calculated, together with their ratios relative to the total fitted cross section. These ratios were compared across decay channels and qualitatively with previous measurements. A consistent flavor dependence of $f_{0}(1500)$ and $f_{0}(1710)$ has been derived for the highest RHIC collision energies, which is in agreement with low energy data.","authors":"Aranya Giri, Barak Schmookler, Rene Bellwied","nlinked":32,"nref":34,"src":"INSPIRE","html":true},{"id":"3177407","arxiv":"2607.02876","title":"Revisiting $\\bar B^0 \\rightarrow Λ_c^+ \\bar p$ decay with higher twist corrections","first":"Zou","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[1333250]] (coupling 0.02, 1 shared references).","score":16.5,"rank":19,"section":"replacement","parts":[0.45,0.0,0.05,0.0,0.0],"abstract":"We investigate the single-charmed baryonic decays $\\bar B^0 \\to Λ_c^+ \\bar p$ and $\\bar B^0 \\to \\barΛ_c^- p$, which receive contributions from both $W$-emission and $W$-exchange topologies, within the framework of perturbative QCD (PQCD). Higher-power corrections associated with the hadronic light-cone distribution amplitudes (LCDAs) of both the initial- and final-state hadrons are systematically taken into account. We find that these higher-twist contributions play an important role in baryonic $B$ decays and cannot be neglected. A sizable destructive interference between the $W$-emission and $W$-exchange amplitudes is observed, which significantly reduces the predicted branching fraction of $\\bar B^0 \\to Λ_c^+ \\bar p$ and leads to improved agreement with experimental measurements. The doubly Cabibbo-suppressed decay $\\bar B^0 \\to \\barΛ_c^- p$ is studied for the first time. Its branching fraction is predicted to be of order $10^{-8}$, placing it within the reach of future high-luminosity experiments. We further present the first theoretical predictions for the decay asymmetry parameters of both channels, which provide additional observables for testing the underlying decay dynamics and can be confronted with future experimental data.","authors":"Zhi-Tian Zou, Ying Li, Zhou Rui","nlinked":53,"nref":54,"src":"INSPIRE","html":true},{"id":"3205605","arxiv":"2609.23691","title":"LZ-Motivated Pseudo-Dirac Higgsinos in the Supersymmetric 331 Model from the Supersymmetric \\texorpdfstring{$SU(6)$}{SU(6)} GUT Model","first":"Khan","nauth":6,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[677884]] (coupling 0.01, 1 shared references). Closest network paper: [[3202840]] (coupling 0.42, 25 shared references).","score":16.3,"rank":20,"section":"replacement","parts":[0.0,0.04,1,0.0,0.0],"abstract":"The high-recoil event reported by LUX--ZEPLIN motivates a neutral electroweak state with an inelastic splitting in the sub-MeV range. We propose supersymmetric 331 model from the supersymmetric $SU(6)$ GUT model, and we study the electroweakino sector relevant to this recoil. Above the $331$-breaking scale hypercharge is not an independent gauge factor, and the leading bino--wino cancellation is replaced by a relation between the physical $U(1)_X$ and $SU(3)_L$ gaugino invariants, $I_X=-I_L$. A singlet--adjoint gauge-kinetic source also correlates the colored invariant. We diagonalize the neutral gauge--Higgs fermion sector of the renormalizable model and determine the tree-level Higgsino splitting without introducing an effective bino mass by hand. The required solutions form a continuous locus in the gaugino and $331$-breaking parameters. At the reference point, the solution lies close to the leading sum rule, while variation of the $331$-breaking coupling moves the locus continuously. The same calculation tests the ordering of the additional neutral states, the gauge/gaugino contribution to the $331$-breaking scalar mass, and the gravitino ordering. We compare this construction with recent $SU(5)$, singlino-assisted, electroweak-multiplet, nuclear-response and solar-capture analyses of the LZ event.","authors":"Imtiaz Khan, Ali Muhammad, G. Mustafa, Farruh Atamurotov, Ahmadjon Abdujabbarov, Mussawir Khan","nlinked":48,"nref":49,"src":"INSPIRE","html":true},{"id":"2860389","arxiv":"2412.12286","title":"Searching for axion-like particles with SPHEREx","first":"Regis","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Co-authors of yours: Taoso. Closest of your papers: [[1607572]] (coupling 0.04, 3 shared references). Closest network paper: [[2703113]] (coupling 0.09, 8 shared references).","score":13.5,"rank":21,"section":"replacement","parts":[0.0,0.13,0.25,0.5,0.07],"abstract":"We study prospects to detect axion-like particles (ALPs) with the upcoming near-infrared telescope SPHEREx. The signal under investigation is the ALP decay into two photons. Assuming dark matter (DM) to be in the form of ALPs, we analyze the signal from the DM halos of dwarf spheroidal galaxies, the Large Magellanic Cloud and the Milky Way. We find that SPHEREx can significantly improve current limits on the axion-photon coupling in the 0.5-3 eV ALP mass range.","authors":"Marco Regis, Marco Taoso, Jorge Terol Calvo","nlinked":33,"nref":36,"src":"INSPIRE","html":true},{"id":"3225521","arxiv":"2611.08387","title":"Algorithmic Construction of Vector-Valued Modular Forms and Application to an $A_4\\times\\mathbb{Z}_4$-invariant Model of Leptons","first":"Bonnefoy","nauth":3,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[509514]] (coupling 0.02, 1 shared references). Closest network paper: [[1973492]] (coupling 0.26, 25 shared references).","score":12.8,"rank":22,"section":"new","parts":[0.0,0.06,0.74,0.0,0.0],"abstract":"We present an algorithmic procedure that constructs the Vector-Valued Modular Forms (VVMFs) of finite modular groups, as well as its implementation in a companion code. The usual method consists in building the first few VVMFs, whose tensor products then generate the others. We address the difficulty of systematically finding the minimal set of VVMFs that suffices to produce all higher-weight ones, and we propose a method to identify it that makes use of the Burnside-Brauer theorem. For any given group, whose basic group-theoretic and representation-theoretic description is provided by the user, the code determines the minimal set of VVMFs, explicitly builds it using general results of the theory of such functions, then performs the tensor products that generate any other VVMF. Importantly, it automatically takes into account all caveats that might arise during the study of new groups. Our approach reproduces the known results for the finite modular groups explored in the recent phenomenological literature on modular flavor symmetries, and works for additional groups which we tested. We illustrate our algorithm and the working of our code by studying a model of leptons based on the unexplored finite modular group $A_4\\times\\mathbb{Z}_4$.","authors":"Q. Bonnefoy, M. Rausch de Traubenberg, V. Saulquin","nlinked":64,"nref":79,"src":"INSPIRE","html":true},{"id":"3223995","arxiv":"2611.07195","title":"Nuclear Atomic Dark Matter","first":"Asadi","nauth":5,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1679809]] (coupling 0.04, 2 shared references). Closest network paper: [[2778922]] (coupling 0.10, 11 shared references). Shared topics: fermion mass.","score":11.8,"rank":23,"section":"new","parts":[0.06,0.12,0.28,0.0,0.18],"abstract":"The matter coincidence, $Ω_{\\rm DM}\\simeq5Ω_b$, suggests a common origin for visible and dark matter (DM). We show that this motivates the study of nuclear atomic DM (naDM), which is composed of $\\sim5\\,\\mathrm{GeV}$ mirror-neutron DM and a subdominant population of mirror elements. We realize naDM in the Mirror Twin Higgs, employing a twin Froggatt--Nielsen mechanism to generate fermion masses and realize spontaneous $\\mathbb{Z}_2$ symmetry breaking. However, the low-energy mirror framework is more general and can emerge from other ultraviolet completions. naDM gives rise to a novel two-stage dark acoustic oscillation signature, multiple correlated direct-detection signals, and highly exotic twin astrophysics.","authors":"Pouya Asadi, Zackaria Chacko, David Curtin, Micah Mellors, Ethan T. Neil","nlinked":94,"nref":98,"src":"INSPIRE","html":true},{"id":"3222372","arxiv":"2611.02987","title":"Machine-learning discovery potential for a heavy Higgs boson in $e^+e^-\\to ZH$ at a future lepton collider","first":"Hashemi","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[902365]]. Closest of your papers: [[1116165]] (coupling 0.08, 3 shared references). Closest network paper: [[3139191]] (coupling 0.07, 5 shared references).","score":11.8,"rank":24,"section":"replacement","parts":[0.06,0.22,0.21,0.0,0.0],"abstract":"A study of the discovery potential for a CP-even heavy neutral Higgs boson $H$ is presented in the Type-I two-Higgs-doublet model (2HDM) at a future $e^+e^-$ collider with $\\sqrt{s}=500~\\mathrm{GeV}$, focusing on the process $e^+e^-\\to ZH$ with $H\\to WW$, and with $Z\\to\\ell\\ell$ or $Z\\toνν$. The final states are four jets plus two leptons ($4j2\\ell$) and four jets plus missing transverse momentum ($4j2ν$). Both a Boosted Decision Tree (BDT) and a Deep Neural Network (DNN) were trained on the same inputs. The BDT was found to be substantially faster in training and inference without any loss of performance, and it is therefore the classifier used in the interpretation. Three strategies are compared: a cut-based analysis, a one-dimensional BDT selection trained per mass point, and a two-dimensional (BDT $\\times$ $m_H$) template analysed with a profile likelihood. The 2D template improves the expected discovery significance by a factor of $2.5$--$3.6$ in the $4j2\\ell$ channel and by a factor of $5$--$18$ in the $4j2ν$ channel relative to the cut-based analysis, with the largest gains at high $m_H$ where the cut-based mass window loses efficiency. We translate the expected exclusions into $95\\%$ CL upper limits on $σ\\times$ BR and discuss the implications for the Type-I 2HDM parameter space.","authors":"Majid Hashemi","nlinked":38,"nref":48,"src":"INSPIRE","html":true},{"id":"3224051","arxiv":"2611.07806","title":"Search for dark matter axions at 1-2 micro-eV with a RADES-DarkQuantum haloscope at CERN","first":"Puente","nauth":28,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1607572]] (coupling 0.08, 5 shared references). Closest network paper: [[2697191]] (coupling 0.09, 9 shared references).","score":10.7,"rank":25,"section":"cross","parts":[0.0,0.2,0.27,0.0,0.07],"abstract":"The QCD axion remains one of the most compelling candidates for the dark matter of the Universe, yet the mass range around $1$\\text{--}\\SI{2}{\\micro\\electronvolt} remains essentially unexplored. In this paper, we describe a proposal to employ CERN's M1 superconducting magnet to deploy a haloscope to perform a search for galactic axion and axion-like particle dark matter providing continuous coverage from approximately 1.2 to 1.8 \\SI{}{\\micro\\electronvolt}. Under conservative assumptions, the experiment can reach the QCD axion band over a significant fraction of the scanned range, while optimistic detector performance would allow sensitivity to benchmark models such as KSVZ and DFSZ over a large part of the explored mass interval. With the current long shut-down of CERN's accelerators providing a unique and timely window, such an experiment will deliver high-impact results even in conservative scenarios and potentially delivering a definitive test of the axion dark matter paradigm in the unexplored $1$\\text{--}\\SI{2}{\\micro\\electronvolt} mass range.","authors":"Alberto Arcusa Puente, Sergio Arguedas Cuendis, Marcos Buetas Mata, Sergio Calatroni, Cristian Cogollos, Alejandro Díaz-Morcillo, Babette Döbrich, Jacob Egge, Elisa Gabbrielli, Javier Galindo Guarch, Jose María García-Barceló, Benito Gimeno, Yikun Gu, Sophia Hollick, Igor Garcia Irastorza, David Kittlinger, Adrian Lambies-Asensio, Axel Lindner, Manuel Meyer, Adrián Muñoz-Urán, Jose R. Navarro-Madrid, Tobias Ortmann, Sagar Paul, Angel Rodriguez, Kristof Schmieden, Laura Segui, Wolfgang Wernsdorfer, Mina Yami","nlinked":36,"nref":54,"src":"INSPIRE","html":true},{"id":"3094437","arxiv":"2512.17231","title":"Higgs-Portal Stueckelberg Dark Matter","first":"Felice","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[2859009]] (coupling 0.03, 3 shared references). Closest network paper: [[2697223]] (coupling 0.06, 3 shared references). Shared topics: relic density, gauge symmetry.","score":10.4,"rank":26,"section":"replacement","parts":[0.0,0.09,0.18,0.0,0.49],"abstract":"We study dark photon dark matter X associated with a dark $U(1)_X$ gauge symmetry. To evade laboratory and cosmological constraints on kinetic mixing with the Standard Model $U(1)_Y$, we assign a $Z_2$-odd dark parity to X that forbids such mixing. The leading interactions then arise from gauge-invariant dimension-6 Higgs-portal operators, including both parity-even and parity-odd terms. We assume that the dark matter mass is generated via the Stueckelberg mechanism. In the interacting Stueckelberg EFT, a gauge-invariant dimension-6 parent reduces in unitary gauge to the nominal dimension-4 Higgs-portal interaction $(H^†H)X_μX^μ$, with its coefficient correlated with $m_X^2/Λ^2$, while additional derivative operators are organized by the same longitudinal-mode power counting. We investigate freeze-in production of X from Higgs-pair annihilations after reheating, incorporating both field-strength and Stueckelberg-allowed operators. First, we consider the case in which the Wilson coefficients of the gauge-invariant dimension-6 operators, C and $\\tilde C$, are of order unity. Under a conservative single-cutoff power counting in which the strong-coupling scales of the longitudinal mode lie above the cutoff of the field-strength effective theory, we find that the Stueckelberg contributions remain subdominant in dark matter production. We emphasize that this ordering of scales is an explicit assumption rather than a universal consequence of perturbative unitarity. Next, we explore a more general situation in which C and $\\tilde C$ are smaller than unity. In this second case, Stueckelberg-allowed operators can become comparable and generate contributions proportional to $T_{reh}^3$, $T_{reh}^5$, and $T_{reh}^7$, including sign-dependent interference effects. For both cases, we show that there exists a wide parameter space consistent with the observed dark matter relic density.","authors":"Antonio De Felice, Takehiro Ogura, Shinji Tsujikawa, Kimiko Yamashita","nlinked":23,"nref":25,"src":"INSPIRE","html":true},{"id":"3224005","arxiv":"2611.07416","title":"Enhancing Gravitational Waves from Global Strings via a First-Order Phase Transition","first":"Jia","nauth":3,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1607572]] (coupling 0.05, 5 shared references). Closest network paper: [[2736974]] (coupling 0.09, 33 shared references). Shared topics: relic abundance.","score":10.1,"rank":27,"section":"new","parts":[0.0,0.14,0.24,0.0,0.23],"abstract":"We perform the first (3+1)-dimensional lattice simulations of a cosmological first-order phase transition (PT) in which true-vacuum bubbles with random phases nucleate, expand, and collide, producing a network of global strings. We find that the string network enters the scaling regime, and the coefficient of the logarithmic growth is smaller than the value obtained for a second-order PT. From the axion spectrum, we derive the dark-matter relic abundance and the dark-radiation bound from big bang nucleosynthesis on the axion decay constant $f_a$ and mass $m_a$. The ratio of the gravitational wave emission rate to the axion emission rate is found to be about two orders of magnitude larger than in the second-order case, and the resulting gravitational wave spectrum can be probed by pulsar timing arrays as well as by space- and ground-based interferometers.","authors":"Yongtao Jia, Ligong Bian, Huai-Ke Guo","nlinked":80,"nref":85,"src":"INSPIRE","html":true},{"id":"1724453","arxiv":"1903.03616","title":"Dark Matter through the Higgs portal","first":"Arcadi","nauth":3,"year":2019,"cites":399,"role":"other","note":"","score":null},{"id":"2850596","arxiv":"2411.13837","title":"Probing compressed mass spectrum supersymmetry at the high-luminosity LHC with the vector boson fusion topology","first":"Qureshi","nauth":3,"year":2024,"cites":7,"role":"other","note":"","score":null},{"id":"2843521","arxiv":"2410.22252","title":"Spin trio: A dark
