 can infer its existence from the gravitational potential wells around astrophysical objects, but there is no convincing explanation for what its nature and origin are. Moreover, experiments for direct detection, indirect detection, or particle production in accelerators have not shown, until now, any conclusive interaction between dark matter and particles in the standard model. This may imply that dark matter does not interact with ordinary matter and originates from pure gravitational interaction. In this manuscript, we investigate the possibility to constrain the gravitational production of dark matter from the 21cm brightness temperature at the cosmic dawn. Considering only the time when the absorption profile occurs, we can impose upper limits on the dark matter's mass. Future measurements have potential to extend current constraints and help understanding the nature of dark matter."},{"arxiv":"2611.17204","id":"","title":"Probing Ultralight Higher-spin Dark Matter using Stellar Kinematics of Dwarf Galaxies","authors":"Praniti Singh, JiJi Fan, Savvas M. Koushiappas, Isabelle S. Goldstein","score":9.2,"section":"cross","rank":32,"parts":[0.0,0.07,0.43,0.0,0.07],"note":"Closest of your papers: [[1607572]] (coupling 0.02, 3 shared references). Closest network paper: [[2719600]] (coupling 0.15, 14 shared references).","abstract":"Stellar kinematics of the classical Milky Way dwarf galaxies provide a powerful probe of the dark matter distribution and its underlying physics. In this article we use them to explore ultralight dark matter (ULDM) with a non-zero spin. Numerical simulations in the non-relativistic limit have shown that, for the same initial conditions, higher-spin ULDM forms a more diffuse soliton core at the galactic center, with a smoother transition to the NFW outer region, than scalar ULDM. We introduce a generalized parametrization of the ULDM halo profile that captures these spin-induced effects through three additional parameters: the normalization of the central core density, the exponent of the core-halo mass relation, and the radius of the transition to the NFW envelope. Applying this profile in a Bayesian analysis of six classical dwarf galaxies, we find halo masses in the range $10^{8.5}$-$10^{9.5}\\,M_\\odot$ and, from each galaxy individually, a particle mass $m \\gtrsim 3\\times10^{-21}$ eV. The core-halo exponent and the transition radius are consistent with their scalar values. The core-density normalization is also consistent with the scalar value in four galaxies and prefers a core denser than a scalar soliton in Fornax, while the factor-of-several suppression expected for higher-spin cores is not excluded by any single galaxy. The data therefore show no preference for the more diffuse cores of higher-spin ULDM, but do not yet rule them out."},{"arxiv":"2411.18725","id":"2854064","title":"Generating the Dark Matter mass from the QCD vacuum: A new approach to the mass aspect of the Dark Matter-Baryon coincidence problem","authors":"Yi Chung","score":8.9,"section":"replacement","rank":33,"parts":[0.0,0.13,0.18,0.0,0.23],"note":"Closest of your papers: [[1679809]] (coupling 0.05, 2 shared references). Closest network paper: [[3070028]] (coupling 0.06, 7 shared references). Shared topics: dark matter model.","abstract":"The comparable abundances of dark matter and baryons imply a deep connection between the dark sector and the QCD sector. In asymmetric dark matter models, the number densities of both sectors are ensured to be similar. However, a complete solution should also include a mechanism relating their masses. In this study, we explore a new mechanism where an $\\mathcal{O}(Λ_{\\rm QCD})$ dark matter mass arises from the QCD vacuum. The idea is realized by a strongly coupled chiral dark sector, featuring a light composite fermion as the dark matter. Its mass is generated through the vacuum misalignment induced by QCD, ensuring the mass to be comparable with baryons. The model also features additional light bosons, including GeV-scale dark pions and a composite QCD axion."},{"arxiv":"2604.06937","id":"3141818","title":"Squeezed double-$b$ tagging for light hadronic resonances at the LHC","authors":"Dilip Kumar Ghosh, Biswarup Mukhopadhyaya, Sirshendu Samanta, Ritesh K. Singh","score":8.9,"section":"replacement","rank":34,"parts":[0.06,0.09,0.28,0.0,0.0],"note":"Also cites widely used network papers: [[902365]]. Closest of your papers: [[1455793]] (coupling 0.03, 3 shared references). Closest network paper: [[2878308]] (coupling 0.10, 5 shared references).","abstract":"A boosted light resonance decaying into $b\\bar b$ can produce a single jet containing two bottom-hadron decay systems. We investigate this squeezed double-$b$ topology using a tracking-based boosted decision tree that distinguishes non-bottom, single-bottom and double-bottom jets. The classifier combines displaced-track multiplicities and momentum fractions with ordered impact parameters and jet kinematics. For the simulated jet samples, the double-bottom tagging response is approximately $83\\%$, with corresponding single-bottom and non-bottom mistag responses of $9.7\\%$ and $0.5\\%$; charm contamination is assessed separately. The tagger is combined with soft-drop mass reconstruction and an event-level classifier using the candidate and recoil jets to identify light hadronic resonances within the QCD background. As an illustrative example, we consider a singlet extension of the flipped two-Higgs-doublet model with pseudoscalar masses of 30, 50 and 60 GeV. The signal samples use a simplified effective-vertex approximation, replacing the momentum-dependent quark-loop production interaction by a local vertex. A resolved loop calculation and higher-order production corrections are beyond the scope of this tagging study. The resulting reconstruction strategy can be applied to different signal hypotheses with their corresponding kinematic acceptance and tagging response."},{"arxiv":"2610.30773","id":"3218076","title":"A Chiral Nelson-Barr Relaxion","authors":"Cristien Arzate, Joshua Iascau","score":8.9,"section":"replacement","rank":35,"parts":[0.0,0.06,0.23,0.0,0.35],"note":"Closest of your papers: [[1116165]] (coupling 0.02, 1 shared references). Closest network paper: [[1863157]] (coupling 0.08, 7 shared references). Shared topics: seesaw mechanism.","abstract":"We present the chiral Nelson-Barr relaxion model, an extension of the Nelson-Barr relaxion framework with a gauged chiral $\\mathrm{U}(1)$ symmetry. It includes vector-like quarks to cancel gauge anomalies and a scalar whose vacuum expectation value generates their masses. The chiral symmetry forbids the leading operators responsible for the Nelson-Barr and clockwork quality problems. Right-handed neutrinos generate light-neutrino masses through the type-I seesaw mechanism and permit thermal leptogenesis. For the particular Nelson-Barr sector Yukawa coupling considered, relaxion phenomenology gives a maximal scale of $CP$ violation $f_{\\textrm{max}}^{\\textrm{pheno}}\\sim 4 \\times 10^{11}\\ \\mathrm{GeV}$, about an order of magnitude greater than the corresponding phenomenological ceiling in the original model. The model can accommodate thermal leptogenesis if its right-handed-neutrino masses and reheating history satisfy the Davidson-Ibarra bound."},{"arxiv":"2611.15273","id":"3227724","title":"CP Violation in Beauty Baryon Decays","authors":"Jian-Peng Wang, Qin Qin, Stephane Monteil, Fu-Sheng Yu, Yan-Xi Zhang","score":8.2,"section":"new","rank":36,"parts":[0.16,0.03,0.11,0.0,0.0],"note":"Also cites widely used network papers: [[779828]], [[902365]], [[2817040]]. Closest of your papers: [[922002]] (coupling 0.01, 2 shared references). Closest network paper: [[2692782]] (coupling 0.04, 9 shared references).","abstract":"The 2025 discovery of CP violation in the baryon sector marks a tectonic shift in flavor physics, bridging a sixty-year gap since the initial discovery of CP asymmetry in mesons. This review provides a comprehensive synthesis of the theoretical and experimental journey to this milestone. We integrate the development of dynamical calculation frameworks, such as perturbative QCD and the re-scattering mechanism, with the experimental breakthrough achieved through rate asymmetry measurements. Furthermore, we establish a roadmap for the future of the field by detailing the construction of multi-dimensional observables, which are instrumental in advancing the next era of precision physics and refining the search for new physics beyond the standard model."},{"arxiv":"2608.10123","id":"3189945","title":"Heavy neutral leptons beyond the BBN bound: probing the lepton asymmetry of the Universe","authors":"Kensuke Akita, Maksym Ovchynnikov, Vsevolod Syvolap","score":7.3,"section":"replacement","rank":37,"parts":[0.06,0.05,0.14,0.0,0.15],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1755250]] (coupling 0.02, 2 shared references). Closest network paper: [[2931725]] (coupling 0.05, 7 shared references). Your watch topics: neutrino background.","abstract":"Hadronically decaying particles with lifetimes $τ\\gtrsim0.02\\,{\\rm s}$ are excluded by Big Bang Nucleosynthesis almost independently of their abundance: the mesons from their decays convert protons into neutrons faster than the reverse, and helium is overproduced. For heavy neutral leptons (HNLs), this blankets the couplings the upcoming accelerator searches can reach. We propose a scenario with large lepton flavor asymmetries in which HNLs evade it. A Dirac HNL decays into $π^+$ and its antiparticle into $π^-$, so an asymmetry between the two populations injects an excess of $π^+$, which converts the neutrons back to their standard abundance, while a cancellation between the asymmetries and the HNL decays keeps the shift in $N_{\\rm eff}$ small. This opens the parameter space with $m_l+m_π\\lesssim m_N\\lesssim1\\,{\\rm GeV}$ and $τ_N\\lesssim1\\,{\\rm s}$, including a substantial region within the reach of SHiP. A discovery there, combined with the BBN and CMB observables, would fix the primordial flavor asymmetries up to one remaining direction. The relic neutrino background and gravitational waves from the QCD transition epoch may probe that direction, and with it the lepton asymmetry of the Universe."},{"arxiv":"2611.15893","id":"","title":"Chains of Vector-like Leptons at Colliders","authors":"Tao Han, Tong Arthur Wu","score":7.1,"section":"new","rank":38,"parts":[0.0,0.08,0.18,0.0,0.19],"note":"Closest of your papers: [[509514]] (coupling 0.03, 2 shared references). Closest network paper: [[2664140]] (coupling 0.06, 9 shared references). Shared topics: fermion mass.","abstract":"Vector-like leptons (VLLs) are predicted in the chain flavor models, which possess characteristic features to explain the mass hierarchy and mixing of the fermions in the Standard Model (SM). We investigate the production and decay of the VLL chains and quantify the discovery potential at the LHC, FCC-hh, and lepton colliders. The resonant mass sets the new physics scale responsible for the fermion mass generation. The observation of the VLL multiplets associated with each lepton flavor yields the chain structure. The mass difference among the VLL multiplets determines the hopping parameter that gives the power-law pattern for the observed SM fermion masses. The single VLL production via vector boson-lepton fusion directly measures the partial width, equivalently the new Yukawa coupling and the VLL mass hopping parameter. At hadron colliders, the leading production mechanism is pair production via their gauge interaction. We find that HL-LHC may have the sensitivity to reach the chain scale of $800-900\\,\\mathrm{GeV}$ and FCC-hh reaches $>2.5\\,\\mathrm{TeV}$. In $e^+e^-$ and $μ^+μ^-$ colliders, VLL pair production is a clear discovery channel once the threshold is reached. Single production via $Z$-lepton fusion becomes more accessible owing to a lower mass threshold and extends signal discovery to the collider kinematic limit."},{"arxiv":"2611.14641","id":"3227671","title":"A Grover-Accelerated Search for Dark Matter","authors":"Zachary Bogorad, Roni Harnik","score":7.0,"section":"new","rank":39,"parts":[0.06,0.08,0.13,0.0,0.07],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2855387]] (coupling 0.03, 5 shared references). Closest network paper: [[2697191]] (coupling 0.05, 6 shared references).","abstract":"We show that Grover's algorithm can be used to parametrically accelerate wave-like dark matter searches. Despite having a finite coherence time $τ$, wavelike dark matter can imprint a coherent $O(1)$ phase onto a sensor through a dispersive coupling over an integration time which significantly exceeds $τ$. As such, we show that dark matter can be used as a repeatable quantum phase gate in a quantum device. If the sensor is prepared in a superposition of frequencies, we show that this phase can be transferred to a qubit register and digitized. The qubits are thus available for quantum computational processing in which dark matter can take part as a coherent gate. We show that Grover's algorithm can be used to speed up a search for dark matter in $N_{\\rm bins}$ frequency bins by a factor of $\\sqrt{N_{\\rm bins}}$. Although the technological challenges to implementing such a search remain substantial, this demonstrates that there is no fundamental obstruction to accelerating wave-like dark matter searches with quantum computational techniques over many coherence times."},{"arxiv":"2611.14642","id":"3227678","title":"Earth-sized tests of long-range neutrino interactions","authors":"Dyer F. Cardenas, Mauricio Bustamante","score":6.5,"section":"new","rank":40,"parts":[0.0,0.06,0.2,0.0,0.18],"note":"Closest of your papers: [[1755250]] (coupling 0.02, 2 shared references). Closest network paper: [[2771314]] (coupling 0.07, 12 shared references). Shared topics: gauge symmetry.","abstract":"Neutrinos may experience a new long-range force that distinguishes their flavors, mediated by an ultralight neutral boson of a new $U(1)'$ gauge symmetry and sourced by the electrons and nucleons of ordinary matter. Atmospheric neutrinos that cross the Earth would then feel a flavor-dependent potential that alters their oscillations. When the range of the force is about one Earth radius or less, this potential varies from point to point along each neutrino's path, since it comes mostly from the matter near the neutrino. Earlier limits approximated it, either as constant along the path or as following the local density of matter. We compute it exactly at every point of each path, for the Earth model of the IceCube analysis and over the distribution of heights at which the neutrinos are produced, and use it to analyze the 8-yr public IceCube DeepCore sample with the systematic uncertainties of that analysis. For mediator masses from $10^{-15}$ to $10^{-9}$ eV, where the Earth alone sources the potential, we set upper limits at 90% confidence level on the coupling of eight of 14 $U(1)'$ symmetries, those whose potential differs between $ν_μ$ and $ν_τ$. A potential held at its value at the detector would weaken our limits by factors of about 1-3. Below about $10^{-11}$-$10^{-10}$ eV, depending on the symmetry, our limits are stronger than those from tests of the equivalence principle."},{"arxiv":"2606.15387","id":"3168747","title":"Mapping Domain-Wall Bayesian Reconstruction with LISA","authors":"Satyabrata Datta, Rome Samanta","score":6.5,"section":"replacement","rank":41,"parts":[0.0,0.07,0.28,0.0,0.0],"note":"Closest of your papers: [[2690106]] (coupling 0.03, 2 shared references). Closest network paper: [[2828434]] (coupling 0.10, 8 shared references).","abstract":"We study the Bayesian reconstruction of peaked domain-wall gravitational-wave signals with LISA and construct reconstruction maps over the signal-parameter plane. These maps identify regions where the signal can be probed with minimal posterior uncertainty and parameter degeneracy. Our analysis employs a two-parameter domain-wall spectral template and includes astrophysical foregrounds from Galactic double-white-dwarf binaries and extragalactic compact binaries, together with LISA instrumental noise. Bayesian inference is performed for 64 injections using nested sampling, and the resulting posterior quantities are interpolated with the Clough--Tocher method to generate smooth maps across parameter space. Under the adopted instrumental-noise and foreground assumptions, we find that LISA reconstructs domain-wall signals most effectively for annihilation temperatures $T_*\\sim10^3\\!-\\!10^6\\,\\mathrm{GeV}$. In this regime, posteriors become tighter and less degenerate, enabling reliable two-parameter reconstruction. The most favorable region corresponds to signals with ${\\rm SNR}\\gtrsim50$, while signals with ${\\rm SNR}\\sim10$ remain reconstructable near $T_*\\sim10^{5-6}\\,\\mathrm{GeV}$. This weaker-signal region corresponds approximately to $4\\times10^{-12}\\lesssimΩ_{\\rm GW}^{\\rm peak}h^2\\lesssim4\\times10^{-11}$ and $30\\,\\mathrm{mHz}\\lesssim f_p\\lesssim100\\,\\mathrm{mHz}$. Our results provide a quantitative reconstruction forecast for peaked domain-wall signals in the LISA band and a guide for particle-physics models predicting milli-Hz gravitational-wave spectra."},{"arxiv":"2611.15860","id":"","title":"Cosmological Signals from Finite-Lifetime Domain Wall Networks","authors":"Fengwei Yang, Kylar Greene, Aurora Ireland, Yuhsin Tsai","score":5.7,"section":"cross","rank":42,"parts":[0.0,0.09,0.2,0.0,0.0],"note":"Closest of your papers: [[2690106]] (coupling 0.03, 2 shared references). Closest network paper: [[2828434]] (coupling 0.07, 6 shared references).","abstract":"We study cosmological perturbations sourced by metastable domain wall (DW) networks. Using the unconnected segment model, we derive analytic expressions for the scalar and tensor power spectra in the long-wavelength regime, finding a fixed ratio between their amplitudes during the scaling regime. These spectra grow as the network evolves, driven by the increasing correlation length and slower redshifting of the wall energy density relative to radiation, and peak at a scale set by the network's collapse time. Comparing the scalar spectrum with observational constraints, we derive bounds on the DW energy density at collapse, which we apply to $\\mathbb{Z}_2$ and axion models. When these bounds are saturated, the resulting CMB $B$-mode signal can be comparable to or larger than the inflationary signal for a tensor-to-scalar ratio $r \\sim 0.03$, potentially bringing it within reach of future CMB polarization experiments."},{"arxiv":"2611.16785","id":"","title":"Bayesian Inference of Fermionic Dark Matter Admixed Neutron Stars Informed by Galaxy Cluster Constraints","authors":"H. C. Das, J. B. Wei","score":5.7,"section":"cross","rank":43,"parts":[0.0,0.06,0.21,0.0,0.07],"note":"Closest of your papers: [[1746620]] (coupling 0.02, 4 shared references). Closest network paper: [[1992028]] (coupling 0.07, 8 shared references).","abstract":"Self-interacting dark matter is constrained on galactic and cluster scales by its elastic scattering cross section per unit mass, $σ/m_χ\\sim 0.1-10\\ {\\rm cm^2/g}$. We incorporate this cross section into the equation of state of an asymmetric, self-interacting fermionic dark matter component and perform a Bayesian inference of dark matter admixed neutron stars in the two-fluid framework at $σ/m_χ= 0.1$, $1$ and $10\\ {\\rm cm^2/g}$. Seven nuclear matter parameters are sampled together with the dark particle mass and mass fraction, and confronted with nuclear theory and neutron star observations. The nuclear sector and the global observables are statistically indistinguishable across the whole range of cross sections, while the data constrain the dark matter mass to $m_χ\\simeq 1.45-1.88$~GeV and its mass fraction to $f_χ\\simeq 0.05-0.09$, depending on the cross section. Finally, comparing runs built from the same parameter draws, so that only the cross section differs, we find that it does change the baryonic radius appreciably, but only for light dark matter, a region the astrophysical data largely disfavor. The self-interaction is therefore not too weak to be seen; however its effect is hidden in the region of parameter space that the present observational data already disfavor."},{"arxiv":"2611.16047","id":"","title":"Anti-periodic Gravitino and Dirac Effective Operators","authors":"Karim Benakli","score":5.4,"section":"cross","rank":44,"parts":[0.0,0.03,0.17,0.0,0.21],"note":"Closest of your papers: [[770422]] (coupling 0.01, 1 shared references). Closest network paper: [[2744388]] (coupling 0.06, 12 shared references). Shared topics: majorana mass.","abstract":"Introducing a preserved $U(1)_R$ symmetry forbids gravitini Majorana masses while allowing a Dirac mass. We investigate how a Dirac mass for gravitini can be described by an effective operator in $N=1$ superspace, in analogy with the well-known Dirac gaugino mass. We find that the corresponding spin-$3/2$ bilinear operator can be expressed in terms of gauge-invariant gravitino curvature superfields coupled through a nonlocal kernel involving an inverse d'Alembertian. We study this construction in minimal five-dimensional supergravity compactified on $S^1/\\mathbb Z_2$. The gravitino satisfies anti-periodic boundary conditions induced by a Scherk-Schwarz twist. The physical Kaluza-Klein Dirac masses then appear as poles in the two-point functions of the curvature superfields associated with sources localized at the endpoints. Separation of physical and gauge modes relates these propagators to a quadratic fermionic kernel represented by a $16\\times16$ matrix. Its elements match the fermionic components of two invariants written in $N=1$ superspace, including their spinor contractions and normalization. This matching is carried out on a fixed background with a nonzero radion auxiliary field."},{"arxiv":"2603.28517","id":"3137111","title":"Heavy-Meson Bag Parameters using Gradient Flow","authors":"Matthew Black, Robert V. Harlander, Jonas T. Kohnen, Fabian Lange, Antonio Rago, Andrea Shindler, Oliver Witzel","score":5.3,"section":"replacement","rank":45,"parts":[0.06,0.01,0.21,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.00, 1 shared references). Closest network paper: [[2648207]] (coupling 0.07, 13 shared references).","abstract":"We demonstrate the use of the gradient flow combined with the short flow-time expansion (GF+SFTX) as a renormalization procedure for four-quark operator matrix elements and associated bag parameters relevant to neutral heavy-meson mixing ($ΔQ=2$) and heavy-meson lifetimes ($ΔQ=0$). Using six RBC/UKQCD 2+1-flavor domain-wall fermion ensembles, we calculate for a charm-strange system with physical quark masses flowed bag parameters and match them to the $\\overline{\\text{MS}}$ scheme using perturbative SFTX coefficients up to next-to-next-to-leading order in QCD. We employ a multiscale matching strategy and a renormalization-group improved flow-time evolution which allows for a reliable estimate of systematic uncertainties. For a fictitious neutral $D_s$ meson, we obtain the $ΔQ=2$ $\\overline{\\text{MS}}$ bag parameter ${\\cal B}^{\\overline{\\text{MS}}}_1(3\\,{\\rm GeV})=0.7673(123)$, consistent with existing short-distance $D^0$ mixing determinations. For the $ΔQ=0$ lifetime-ratio operator basis, we find the $\\overline{\\text{MS}}$ results $B^{\\overline{\\text{MS}}}_1(3\\,{\\rm GeV})=1.0524(97)$, $B^{\\overline{\\text{MS}}}_2(3\\,{\\rm GeV})=0.9621(71)$, $ε^{\\overline{\\text{MS}}}_1(3\\,{\\rm GeV})=-0.2275(76)$, and $ε^{\\overline{\\text{MS}}}_2(3\\,{\\rm GeV})=-0.0005(8)$. We provide conversion formulae to re-express these results for an arbitrary choice of evanescent operators. These results demonstrate that GF+SFTX can deliver precise determinations of dimension-six four-quark operators and establish a framework for future lattice computations including more complex operator bases, where the challenge of power-divergent mixing is shifted to the continuum and handled in the SFTX."},{"arxiv":"2610.42103","id":"3223702","title":"Charge Pumping Leptogenesis from the Symmetric Mass Generation Phase on a Four-Leg Ladder Lattice","authors":"Runze Chi, Meng Zeng, Tao Xiang, Yi-Zhuang You, Bertrand I. Halperin, Juven Wang","score":5.1,"section":"cross","rank":46,"parts":[0.06,0.06,0.09,0.0,0.0],"note":"Also cites widely used network papers: [[779828]]. Closest of your papers: [[922002]] (coupling 0.02, 2 shared references). Closest network paper: [[3157653]] (coupling 0.03, 6 shared references).","abstract":"Quantized charge pumping in quantum Hall systems is a bulk topological property, typically manifesting on gapless boundaries as spectral flow through chiral edge modes upon flux insertion. When the boundary is anomaly-free, it can be symmetrically gapped by symmetric mass generation (SMG) interactions. However, the effects on quantized charge pumping at an interacting gapped boundary are unclear. We address this using density-matrix renormalization group simulations of a four-leg ladder quasi-(2+1)d realization of the (1+1)d 3-4-5-0 lattice chiral fermion model with six-fermion interactions at one edge. We find gapless modes near the interacting edge for both weak and strong couplings, but the edge can be in a fully gapped SMG phase at intermediate coupling. We also identify spontaneous breaking of the model's $\\mathbb{Z}_2$ symmetry above a critical interaction strength. Across all three boundary phases, we find quantized charge pumping with the same pumped charge per flux quantum. The spatial distribution of the pumped charge varies between phases. Besides charge pumping, we study how a single injected fermion propagates under open boundary conditions. In the SMG phase, an interaction-induced flavor-mixing current develops at the endpoints of the gapped edge, which is absent in the weak- and strong-coupling limits. This current reveals a charge-redistribution mechanism unique to the SMG phase. Additionally, we propose an analogy between charge pumping in this model and a topological leptogenesis scenario in the (3+1)d Standard Model. The anomaly-free chiral U(1) symmetries of the 3-4-5-0 model play a role analogous to the baryon-minus-lepton symmetry of the Standard Model. In both settings, charge pumping can be associated with a continuous deformation along a classically defined but quantum-anomalous direction, while a discrete subgroup remains an exact quantum symmetry."},{"arxiv":"2611.14584","id":"3227643","title":"A Positive Turn: Coupled Quintessence and Cosmological Neutrino Masses","authors":"Tian-Nuo Li, William Giarè, Guo-Hong Du, Eleonora Di Valentino, Luis A. Anchordoqui, Shao-Jiang Wang, Xin Zhang, Rong-Gen Cai","score":5.1,"section":"cross","rank":47,"parts":[0.0,0.0,0.08,0.0,0.37],"note":"Closest of your papers: [[1686334]] (coupling 0.00, 1 shared references). Closest network paper: [[3174071]] (coupling 0.03, 5 shared references). Shared topics: neutrino mass.","abstract":"In $Λ$CDM, the CMB and DESI BAO upper limits on the total neutrino mass are in tension with the lower bounds from oscillation experiments, and analyses allowing negative effective masses favor negative values. We investigate whether a coupled quintessence (CQ) model in which dark matter interacts with a canonical scalar field $φ$ through an exponential mass coupling $m_{\\rm c}(φ)\\propto e^{-βφ/M_{\\rm Pl}}$ can alleviate this tension. Combining CMB, DESI, and supernova data, we find that CQ yields neutrino-mass constraints comparable to those obtained in CPL and consistent with oscillation experiments within $2σ$ for normal ordering, without requiring the scalar-field equation of state to cross the phantom divide. We further show that it alleviates the tension more effectively than alternative interacting dark energy models that instead favor more negative effective masses. This comparison shows that whether dark sector interactions can relax neutrino mass bounds ultimately depends on the interplay of their effects on primary CMB anisotropies, geometry, growth, and lensing."},{"arxiv":"2611.16807","id":"","title":"Solar Neutrinos at the ESSνSB experiment","authors":" ESSnuSB Collaboration, J. Aguilar, D. Barčot, E. Baussan, A. K. Bhattacharyya, M. Blennow, M. Bogomilov, B. Bolling, E. Bouquerel, F. Bramati, A. Branca, G. Brunetti, I. Bustinduy, C. J. Carlile, J. Cederkall, T. W. Choi, S. Choubey, P. Christiansen, I. Christodoulou, E. Cristaldo Morales, P. Cupiał, D. D'Ago, H. Danared, J. P. A. M. de André, E. A. Díaz, M. Dracos, I. Efthymiopoulos, T. Ekelöf, M. Eshraqi, G. Fanourakis, A. Farricker, E. Fasoula, T. Fukuda, S. Gago, N. Gazis, Th. Geralis, M. Ghosh, A. Giarnetti, G. Gokbulut, C. Hagner, L. Halić, S. G. Hernández, J. Hiegel, M. Hooft, K. E. Iversen, N. Jachowicz, M. Jakkapu, M. Jensen, I. Karakoulias, E. Kasimi, A. Kayis Topaksu, B. Kliček, K. Kordas, B. Kovač, A. Leisos, A. Longhin, M. López, C. Maiano, S. Marangoni, J. G. Marcos, C. Marrelli, D. Meloni, M. Mezzetto, N. Milas, J. L. Muñoz, K. Niewczas, M. Oglakci, T. Ohlsson, M. Olvegård, A. Opanasenko, M. Pari, D. Patrzalek, G. Petkov, Ch. Petridou, P. Poussot, A. Psallidas, F. Pupilli, M. L. Reguera, D. Saiang, E. Salehi, D. Sampsonidis, A. Scanu, C. Schwab, F. Sordo, G. Stavropoulos, M. Stipčević, R. Tarkeshian, F. Terranova, T. Tolba, M. Topp-Mugglestone, E. Trachanas, R. Tsenov, A. Tsirigotis, S. E. Tzamarias, M. Vanderpoorten, G. Vankova-Kirilova, N. Vassilopoulos, S. Vihonen, J. Wurtz, V. Zeter, O. Zormpa","score":5.0,"section":"new","rank":48,"parts":[0.0,0.06,0.16,0.0,0.08],"note":"Closest of your papers: [[1615477]] (coupling 0.02, 2 shared references). Closest network paper: [[3069207]] (coupling 0.06, 6 shared references).","abstract":"We investigate the sensitivity of the ESSnuSB large underground water-Cherenkov (WC) detector to two key solar neutrino signatures: the MSW spectral upturn in the $^8$B electron neutrino survival probability $P_{ee}(E_ν)$, and the first direct observation of the rare hep neutrino flux. The analysis incorporates detector systematic uncertainties (energy resolution and flux normalization) and models environmental backgrounds from cosmic-ray muon spallation and $^{222}$Rn contamination. We adopt a shape-driven analysis strategy with a floating overall normalization, so that the discovery power relies on the spectral distortion rather than on the absolute event rate. In a realistic scenario with 90% spallation rejection efficiency, informed by the Super-Kamiokande experience and recent JUNO analyses, residual spallation backgrounds prevent either signal from reaching $5σ$ significance within 20 years of exposure. For the hep flux, we present a detailed sensitivity study to both its discovery and its precision, and quantify how the required spallation veto efficiency and recoil energy threshold jointly determine the achievable significance for both signals. At the adopted thresholds, discovery-level sensitivity for both signals requires approximately 99% spallation rejection over a 20-year exposure."},{"arxiv":"2611.15867","id":"","title":"Ensemble Learning with Unsupervised and Semi-Supervised Models for New Physics Searches at Colliders","authors":"Alexandre Alves, Eduardo da Silva Almeida, Douglas Roberto de Matos Pimentel","score":4.9,"section":"new","rank":49,"parts":[0.0,0.12,0.09,0.0,0.0],"note":"Closest of your papers: [[1671831]] (coupling 0.04, 3 shared references). Closest network paper: [[1759674]] (coupling 0.03, 4 shared references).","abstract":"New physics beyond the Standard Model is widely believed to exist motivated by key limitations of the current theory. However, in the absence of undisputed experimental signals, there is little guidance on what type of extended physics model should be built. To address the challenge of training machine learning classifiers to spot unknown phenomena, many algorithms have been applied to the task of either identifying anomalous events relative to background expectations or cluster collision events together in classes of similarity. However, as in the supervised case, the no free lunch theorem assures that the performance of unsupervised models depends on the specific signal hypothesis and their inductive biases, and the successful identification of a given signal by a particular algorithm does not guarantee comparable performance for other signals. In this study, we take a step toward a more model-independent unsupervised and semi-supervised search strategy by combining classifiers into ensembles. Our goal is addressing two complementary aspects of unsupervised ensemble learning - overall performance and robustness of the classification task from a thorough assessment of ensemble models. We show that, despite sacrificing some performance relative to the best individual model in the majority of cases, the ensembles provide robust and reliable classification predictions across several signal hypotheses, increasing confidence that genuinely unknown new physics will not pass unnoticed."},{"arxiv":"2512.08234","id":"3091059","title":"New Type of Monopoles in QCD and Standard Model","authors":"Liping Zou, Pengming Zhang, Y. M. Cho","score":4.9,"section":"replacement","rank":50,"parts":[0.0,0.03,0.26,0.0,0.0],"note":"Closest of your papers: [[1615477]] (coupling 0.01, 2 shared references). Closest network paper: [[2942451]] (coupling 0.09, 9 shared references).","abstract":"We present the new monopole solutions in QCD, the Georgi-Glashow model, and the standard model. QCD has a new monopole, the Wu-Yang monopole which has the chromon dressing. The Georgi-Glashow model has a new monopole, the Wu-Yang monopole which h   const ticks=x.ticks(W<600?6:12).filter(t=>Number.isInteger(t)&&t<=yrs[1]);
  svg.append('g').attr('class','grid').selectAll('line').data(ticks).join('line').attr('x1',d=>x(d)).attr('x2',d=>x(d)).attr('y1',m.t).attr('y2',H-m.b);
  svg.append('g').attr('class','axis').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x).tickValues(ticks).tickFormat(d3.format('d')).tickSizeOuter(0));
  const cy=(m.t+H-m.b)/2, xf=n=>isNew(n)?x(yrs[1]+.75):x(n.year);
  const sim=N.map(n=>({n,x:xf(n)+(RNG()-.5)*4,y:cy+(RNG()-.5)*H*.5}));
  const links=E.map(e=>({source:sim[e.s],target:sim[e.t],s:e.s,t:e.t,k:e.k}));
  d3.forceSimulation(sim).force('x',d3.forceX(s=>xf(s.n)).strength(1)).force('y',d3.forceY(cy).strength(.04))
    .force('link',d3.forceLink(links).strength(.03)).force('charge',d3.forceManyBody().strength(-40))
    .force('col',d3.forceCollide(s=>r(s.n)+2)).stop().tick(320);
  sim.forEach(s=>{s.y=Math.max(m.t+8,Math.min(H-m.b-8,s.y));s.x=Math.max(m.l+4,Math.min(W-m.r-4,s.x))});
  G=svg.append('g');
  G.append('g').selectAll('path').data(links).join('path').attr('class',l=>'edge '+l.k)
    .attr('d',l=>{const a=l.source,b=l.target;return `M${a.x},${a.y}Q${(a.x+b.x)/2},${(a.y+b.y)/2-Math.abs(a.x-b.x)*.12} ${b.x},${b.y}`});
  G.append('g').selectAll('circle').data([...sim].sort((a,b)=>RANK[b.n.role]-RANK[a.n.role])).join('circle')
    .attr('class','node').attr('cx',s=>s.x).attr('cy',s=>s.y).attr('r',s=>r(s.n)).attr('fill',s=>col(s.n))
    .on('pointerenter',(ev,s)=>{hover=s.n;showTip(ev,s.n);paint()}).on('pointermove',(ev,s)=>showTip(ev,s.n))
    .on('pointerleave',()=>{hover=null;tip.hidden=true;paint()}).on('click',(ev,s)=>pick(s.n,false));
  const lab=sim.filter(s=>isNew(s.n)||s.n.role==='seed'||s.n.deg>=3);
  const L=lab.map(s=>{const right=s.x>W*.8,t=isNew(s.n)?`#${s.n.rank} ${s.n.first}`:`${s.n.first} ${s.n.year}`,w=t.length*6.2;return{s,t,right,x0:right?s.x-r(s.n)-4-w:s.x+r(s.n)+4,w,y:s.y+4}}).sort((a,b)=>a.y-b.y);
  const placed=[];L.forEach(l=>{let k=0;while(k<40&&placed.some(p=>l.x0<p.x0+p.w&&p.x0<l.x0+l.w&&Math.abs(l.y-p.y)<13)){l.y+=13*(k%2?-1:1)*(1+Math.floor(k/2));k++;l.y=Math.max(m.t+10,Math.min(H-m.b-4,l.y))}placed.push(l)});
  G.append('g').selectAll('text').data(L).join('text').attr('class','nlabel').attr('x',l=>l.right?l.s.x-r(l.s.n)-4:l.s.x+r(l.s.n)+4).attr('y',l=>l.y)
    .attr('text-anchor',l=>l.right?'end':'start').text(l=>l.t);
  paint();
}
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  const nmin=M.nextMin;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}${nmin!=null?`: every paper scoring ${nmin} or more, and at least ${M.nextCount} when available`:''}; not drawn in the network`;
  const cut=nmin!=null?X.findIndex(n=>n.score<nmin):-1;
  box.innerHTML=X.map((n,i)=>(i===cut?`<li class="divider">Below ${nmin}: weaker relation (most of these share no specific reference, coupling or topic with your work)</li>`:'')+`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
// the rest of the day's papers by score: only the title, linked to the arXiv record
function restList(){const X=RAW.rest||[];if(!X.length)return;const d=document.getElementById('rest'),box=document.getElementById('restlist');
  d.hidden=false;d.querySelector('summary').firstChild.textContent=`All other ${X.length} papers in this listing `;
  document.getElementById('restsub').textContent='by score, title only';
  box.innerHTML=X.map(n=>`<li><span class="sc">#${n.rank} · ${n.score.toFixed(1)}</span><a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">${esc(n.title)}</a></li>`).join('');
  d.addEventListener('toggle',()=>{if(d.open)tex(box)})}
list();nextList();restList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
