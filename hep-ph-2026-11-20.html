<script>
const RAW = {"n":[{"id":"3201808","arxiv":"2609.08918","title":"Probing the Inert Scalar Sector of the Inert Doublet Model via Vector-Boson Fusion at a Muon Collider","first":"Arhrib","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites 3 network papers: [[1692611]], [[822544]], [[1501489]]. Also cites widely used network papers: [[902365]], [[2817040]]. Closest of your papers: [[1455793]] (coupling 0.07, 12 shared references). Closest network paper: [[3188716]] (coupling 0.14, 16 shared references). Shared topics: inert doublet.","score":47.4,"rank":1,"section":"replacement","parts":[0.85,0.21,0.4,0.0,0.52],"abstract":"We investigate how a future high-energy muon collider (MuC) probe the inert scalar sector of the Inert Doublet Model (IDM) through a comprehensive set of $2\\to4$ electroweak gauge-boson fusion processes. The scalar spectrum consists of two $CP$-even neutral scalars, $h$ and $H$, one $CP$-odd neutral scalar $A$, and a pair of charged scalars $H^\\pm$. We assume the neutral scalar $H$ is the lightest inert state and the dark matter (DM) candidate, while we identify the observed $125$~GeV Higgs boson with the scalar from the Standard-Model-like doublet. We consider charged Higgs pair production, $μ^+μ^-\\to H^+H^-ν\\barν$, induced by $WW$ fusion, as well as the associated channels $μ^+μ^-\\to HH^\\pmμ^\\mpν$ and $μ^+μ^-\\to AH^\\pmμ^\\mpν$, induced by $WZ$ and $Wγ$ fusion. Owing to their Vector Boson Fusion (VBF) origin, the corresponding cross sections increase significantly with collider energy, making them particularly well suited for exploration at a high-energy MuC. We first study the $2\\to 2$ subprocesses $WW\\to H^+ H^-$ and $WV\\to H^+ S_i$, with $V=Z, γ$ and $S_i=H,A$, and establish the presence of destructive interference among the contributing diagrams. After imposing theoretical consistency requirements and current experimental constraints, including those from DM and collider searches, we evaluate the corresponding signal rates at $\\sqrt{s}=3$, $10$, and $20$~TeV. We further perform a detector-level Monte Carlo analysis combined with a cut-based signal-background selection. Our results demonstrate that the sensitivity to inert scalar production grows significantly with collision energy, establishing the $10$ and $20$~TeV stages of a MuC as powerful probes of the IDM scalar sector.","authors":"Abdesslam Arhrib, Es-said Ghourmin, Ayoub Hmissou, Larbi Rahili, Bassim Taki","nlinked":88,"nref":94,"src":"INSPIRE","html":true},{"id":"3161765","arxiv":"2605.27519","title":"Probing the dynamical inverse seesaw mechanism with low-frequency gravitational waves","first":"Borah","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[2860403]], [[2828434]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1249404]] (coupling 0.03, 8 shared references). Closest network paper: [[3190827]] (coupling 0.22, 33 shared references). Shared topics: neutrino mass, seesaw mechanism.","score":41.9,"rank":2,"section":"replacement","parts":[0.72,0.08,0.62,0.0,0.5],"abstract":"We study the possibility of probing the dynamical inverse seesaw mechanism for the origin of light neutrino masses via the detection of stochastic gravitational waves (GW) in the low-frequency regime currently being probed by pulsar timing arrays. As the lepton number-violating term in inverse seesaw typically remains in the sub-MeV ballpark, its dynamical origin naturally brings the possibility of a low-scale first-order phase transition, which can be probed at low-frequency GW experiments. We also find interesting complementarity with heavy neutral lepton searches, as GW experiments remain sensitive to parameter space with small active-sterile mixing, which is out of reach for most particle physics experiments.","authors":"Debasish Borah, Sounak Dutta, Partha Kumar Paul, Indrajit Saha, Narendra Sahu","nlinked":127,"nref":132,"src":"INSPIRE","html":true},{"id":"3231394","arxiv":"2611.26274","title":"Photon-Mediated Axino-Bino Scattering Process for the LZ High-Energy Recoil Event","first":"Yin","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3201080]]. Closest of your papers: [[2859009]] (coupling 0.02, 4 shared references). Closest network paper: [[3202840]] (coupling 0.41, 27 shared references).","score":33.6,"rank":3,"section":"new","parts":[0.45,0.07,1,0.0,0.07],"abstract":"We for the first time investigate the photon-mediated endothermic axino-bino scattering process to explain the LUX-ZEPLIN (LZ) high-energy recoil event. We calculate the signals from non-relativistic halo and boosted dark matter (DM), including natural xenon isotopes, detector efficiency, and energy resolution. For a fixed Standard Halo Model (SHM) distribution, a simplified three-bin Poisson analysis yields a best-fit benchmark with mass $m\\simeq506\\,\\mathrm{GeV}$ and mass splitting $δ\\simeq326\\,\\mathrm{keV}$ at the adopted upper coupling bound $g_γ=10^{-3}\\,\\mathrm{GeV}^{-1}$. It predicts approximately one accepted event, with $70\\%$ in the middle bin. A boosted benchmark with $m\\simeq82.87\\,\\mathrm{GeV}$ and $δ\\simeq0.626\\,\\mathrm{MeV}$ provides a comparable fit. Broader Gaussian incident energy distributions allow fitted masses down to a few GeV. Thus, both the halo and boosted DM scenarios can fit the LZ signal at different DM mass scales.","authors":"Xiangwei Yin, Quanyu Wang, Tianjun Li","nlinked":62,"nref":63,"src":"INSPIRE","html":true},{"id":"3231350","arxiv":"2611.25931","title":"Interpretation of the LZ Event via Inelastic ALP-Dark Photon Transition with Photon Exchange","first":"Wang","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3201080]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1741056]] (coupling 0.03, 4 shared references). Closest network paper: [[3202840]] (coupling 0.28, 19 shared references).","score":32.4,"rank":4,"section":"new","parts":[0.48,0.1,0.79,0.0,0.07],"abstract":"The LUX-ZEPLIN (LZ) experiment has reported a nuclear recoil event at $248\\pm23$~keV with a global significance of about $2.6σ$. We for the first time explain it via the inelastic process with photon mediator. We consider a dark matter (DM) axion-like particle (ALP) $a$ converts into a heavier dark photon $γ'$ via the nuclear electromagnetic current, and study the photon-mediated endothermic transition $aA\\rightarrowγ'A$. We derive the kinematics and cross sections for non-relativistic halo and boosted ALPs. A three-bin Poisson fit to the LZ data includes the xenon isotopes, charge form factors, detector efficiency, and energy resolution. Halo DM, which has mass $m\\simeq1.2$~TeV, mass splitting $δ\\simeq346$~keV, and near the upper coupling bound, reproduces the event with about $61\\%$ in the middle bin. Boosted DM with $v_{0}=0.05\\,c$ and $Φ_{0}=10^{5}~\\mathrm{cm^{-2}\\,s^{-1}}$ requires only $m\\simeq5.74$~GeV and $δ\\simeq6.66$~MeV to give about $62\\%$. We find that a broader Gaussian spread in the incident energy has a significant effect on the fitted masses.","authors":"Quanyu Wang, Xiangwei Yin, Tianjun Li","nlinked":63,"nref":64,"src":"INSPIRE","html":true},{"id":"3231217","arxiv":"2611.25029","title":"Dirac leptogenesis with charged leptons","first":"Garcés","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1904961]] (coupling 0.03, 2 shared references). Closest network paper: [[3070028]] (coupling 0.11, 12 shared references). Shared topics: lepton flavor violation, lepton number.","score":27.7,"rank":5,"section":"new","parts":[0.45,0.09,0.32,0.0,0.45],"abstract":"Popular frameworks that explain the baryon asymmetry of the Universe (BAU) are electroweak baryogenesis, requiring a first-order phase transition, and Majorana leptogenesis, which relies on lepton number violation in the neutrino sector. Dirac leptogenesis offers an alternative mechanism that avoids both requirements, instead allowing the BAU to follow from previously generated chiral asymmetries that remain out of equilibrium in the early Universe. Conventional realizations of this scenario typically invoke ultra-light Dirac neutrinos. In this work, we generalize the mechanism to include Standard Model charged leptons by assuming that their mass-generating interactions have a UV origin and arise from higher-dimensional operators. For concreteness, the analysis is performed within a Froggatt-Nielsen setup, which allows us to naturally address fermionic mass hierarchies, too, now linked to the BAU, and we show that the proposed mechanism is viable by supercooling the flavon phase transition. The framework predicts a flavon with a (1.7-50) GeV mass, bounded by the non-observation of lepton flavor violation and the requirement for the Universe to not reheat above sphaleron temperatures, which could be indirectly probed by future lepton flavor violation experiments.","authors":"Juan P. Garcés, Florian Goertz, Maya Hager","nlinked":73,"nref":82,"src":"INSPIRE","html":true},{"id":"3118953","arxiv":"2602.12154","title":"Resurrecting Kaluza-Klein Dark Matter with Low-Temperature Reheating","first":"Ghosh","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[1220579]] (coupling 0.09, 5 shared references). Closest network paper: [[2962467]] (coupling 0.21, 17 shared references). Shared topics: discrete symmetry, relic density, relic abundance.","score":24.6,"rank":6,"section":"replacement","parts":[0.0,0.29,0.61,0.0,0.68],"abstract":"In Universal Extra Dimension (UED) scenarios, the lightest Kaluza-Klein (KK) particle is naturally stable due to a remnant discrete symmetry, KK parity, arising from extra-dimensional compactification. This stability requires no ad hoc symmetry and renders Kaluza-Klein dark matter a well-motivated candidate, provided it reproduces the observed relic abundance. The minimal UED (mUED) framework being highly predictive is strongly constrained by the combined requirements of relic density and collider searches under standard cosmological assumptions. We revisit the dark matter phenomenology of mUED in the presence of a nonstandard cosmological history featuring a low reheating temperature driven by prolonged inflaton decay. Solving the coupled Boltzmann equations for dark matter, radiation, and inflaton energy densities, we show that entropy injection during reheating can dilute the relic abundance by orders of magnitude, reopening large regions of parameter space previously ruled out. We further demonstrate that the revived parameter space is consistent with current collider, direct-detection, and indirect-detection constraints, while remaining testable by upcoming experiments.","authors":"Kirtiman Ghosh, Abhishek Roy, Rameswar Sahu","nlinked":67,"nref":72,"src":"INSPIRE","html":true},{"id":"3230059","arxiv":"2611.21252","title":"Phenomenology of neutrino mass ordering synergies in reactor, accelerator, and atmospheric neutrino experiments, and the role of the detector response","first":"Cerrone","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1708009]] (coupling 0.01, 1 shared references). Closest network paper: [[2721859]] (coupling 0.04, 4 shared references). Shared topics: neutrino mass, neutrino physics.","score":23.8,"rank":7,"section":"replacement","parts":[0.45,0.04,0.12,0.0,0.52],"abstract":"The neutrino mass ordering is one of the main open questions of neutrino physics, addressed by reactor, accelerator, and atmospheric experiments and by their combination. When the data are fitted under the wrong ordering, each experiment returns its own value of $Δm^2_{31}$, its wrong-ordering solution. We show that this solution is a weighted average of the values preferred by the individual bins of the measured event spectra, in reconstructed energy and, for atmospheric neutrinos, also zenith angle, with weights set by their statistical precision. Both the values and the weights depend on the detector response. In the plane of $Δm^2_{31}$ fitted under the two orderings, the solutions lie on lines of slope close to $-1$, so that each experiment is described by one intercept. The weighted bin average extends the mass ordering sum rule to any oscillation experiment, including atmospheric neutrinos in Earth matter. It recovers the known closed forms for short-baseline reactors and for accelerators in vacuum, and for JUNO it equals a closed form evaluated at one effective energy, which depends on the energy resolution. Above the MSW resonance the frequency of atmospheric $ν_μ$ disappearance becomes nearly independent of $δ_{CP}$, and the $ν_μ$ disappearance solution moves mainly with $θ_{23}$. The atmospheric intercept depends on the energy and direction resolutions, the energy range, and the event classes, and differs between detectors. The synergy of two experiments is determined by the separation of their intercepts relative to their precisions on $|Δm^2_{31}|$. With JUNO, this separation depends strongly on $δ_{CP}$ for an accelerator and is nearly independent of $δ_{CP}$ and $θ_{23}$ for IceCube DeepCore using all channels.","authors":"Vanessa Cerrone, Marco Grassi","nlinked":97,"nref":112,"src":"INSPIRE","html":true},{"id":"3231410","arxiv":"2611.26324","title":"$Zb\\bar{b}$ couplings at the Large Hadron Collider","first":"Dermisek","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1455793]] (coupling 0.03, 4 shared references). Closest network paper: [[1857809]] (coupling 0.05, 5 shared references).","score":20.4,"rank":8,"section":"new","parts":[0.45,0.08,0.14,0.0,0.0],"abstract":"Constraining the $Z$-boson couplings of the $b$ quark, or even ruling out the possibility of an opposite-sign coupling, is considered very challenging at the LHC. Utilizing signatures of new physics resulting from contact operators accompanying the modification of $Zb\\bar{b}$ couplings from Standard Model predictions, we show that the ATLAS measurement of $pp\\to Zh$ already ruled out the opposite-sign couplings by more than 9.5 standard deviations. We also argue that $pp\\to Zhb$, which receives a contribution from the same contact term, would lead to even better sensitivity. Furthermore, we show that with future data this indirect method can provide the strongest constraints on $Zb\\bar{b}$ couplings, and can even probe the anomaly in these couplings left over from the LEP era.","authors":"Radovan Dermisek, Keith Hermanek, Marcos A. Hernandez Ojeda, Taegyu Lee, Navin McGinnis","nlinked":51,"nref":52,"src":"INSPIRE","html":true},{"id":"2938740","arxiv":"2506.20113","title":"Mono-Higgs signature in a singlet fermionic dark matter model","first":"Kim","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[1494411]], [[2817040]]. Closest of your papers: [[2859009]] (coupling 0.03, 4 shared references). Closest network paper: [[1976965]] (coupling 0.13, 8 shared references). Shared topics: relic density, dark matter candidate, direct detection, direct detection experiment, dark matter model.","score":20.2,"rank":9,"section":"replacement","parts":[0.11,0.1,0.38,0.0,0.76],"abstract":"We investigate mono-Higgs production as a probe of singlet fermionic dark matter (SFDM) at the LHC. In this framework, a Standard Model (SM) gauge-singlet Dirac fermion serves as the dark matter candidate, interacting with the visible sector through a real scalar mediator that mixes with the SM Higgs boson. Focusing on light dark matter with $M_ψ\\in [0.1,10]$ GeV, we analyze the viable parameter space under constraints from relic density, Higgs decay properties, invisible decay bounds, rare $B$-meson decays, and direct detection experiments. We compute the mono-Higgs production cross sections at $\\sqrt{s}=13~\\mathrm{TeV}$ and compare approximate detector-level yields with the ATLAS $b\\bar b$ search, supplemented by an inclusive upper bound for the CMS four-lepton channel. For the two benchmarks, the signal is dominated by non-resonant Higgs-pair production followed by an invisible Higgs decay. The resulting signal rate depends on both the production cross sections and the physical invisible branching fractions. The inclusive rates of $3.33$ and $1.43$~fb at loop-induced leading order provide quantitative signal targets before the visible Higgs decay and analysis cuts. For representative benchmark points satisfying the constraints considered, these comparisons indicate limited sensitivity in the analyzed channels. Nevertheless, the mono-Higgs channel provides a complementary probe of Higgs-portal dark matter scenarios, particularly in the low-mass mediator regime.","authors":"Yeong Gyun Kim, Kang Young Lee, Soo-hyeon Nam","nlinked":67,"nref":70,"src":"INSPIRE","html":true},{"id":"3158551","arxiv":"2605.22088","title":"$b\\to c \\bar u q$ decay and $CP$ violating observables in the presence of new physics contributions","first":"Guo","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1710056]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.00, 1 shared references). Closest network paper: [[1127719]] (coupling 0.04, 10 shared references).","score":19.0,"rank":10,"section":"replacement","parts":[0.48,0.01,0.12,0.0,0.0],"abstract":"In this work, a comprehensive analysis for processes related to $b\\to c\\bar{u}q~(q=d, s)$ transitions is carried out, including new physics contributions. In light of a recent tension between branching fractions for $B_{(s)}\\to D_{(s)}^{(*)}M$ ($M=π, K$) decays in the QCD factorization approach and relevant experimental results, phenomenological constraints on complex-valued Wilson coefficients are discussed. Analyzed observables contain direct $CP$ asymmetry ($A_{\\text{CP}}$) in $B^-\\to D^0π^-$ decays and $γ/φ_3$, one of the angles in the unitarity triangle, combined with others from $τ_{B^+}/τ_{B_d}$, $ΔΓ_{q}/Γ_q$, and $A_{\\rm SL}^{q}~(q=d, s)$. We constrain the complex Wilson coefficients at $1σ$ and $2σ$ levels under color-singlet and color-rearranged scenarios. These constraints yield correlated predictions for $ΔΓ_d/Γ_d$, $A_{\\rm SL}^d$ and $A_{\\text{CP}}$.","authors":"Xuanning Guo, Albertus Hariwangsa Panuluh, Hiroyuki Umeeda, Jinglong Zhu","nlinked":62,"nref":65,"src":"INSPIRE","html":true},{"id":"3231290","arxiv":"2611.25402","title":"Helicity amplitudes and angular distributions in $D\\to b_1(1235)(\\toωπ)\\ell^+ν_\\ell$","first":"Zeng","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3227657]] (coupling 0.02, 1 shared references).","score":16.7,"rank":11,"section":"new","parts":[0.45,0.0,0.06,0.0,0.0],"abstract":"Using the helicity amplitude technique, we derive the decay intensity for the charmed meson semileptonic decays $D\\to b_1(1235)\\ell^+ν_\\ell, b_1(1235)\\toωπ$ with $\\ell=e,μ$. Based on the theoretically predicted hadronic transition form factors, the branching fractions for $D^0\\to b_1(1235)^-\\ell^+ν_\\ell$ and their lepton flavor universality ratios are calculated. The predicted branching fractions of the positronic channel span $(2.6$--$8.8)\\times10^{-5}$, with most theoretical predictions being consistent with the previous BESIII measurement $(7.2\\pm1.8^{+0.6}_{-0.8})\\times10^{-5}$ by assuming $\\mathcal{B}(b_1(1235)\\toωπ)=1$. We further explore the partial decay widths and angular distributions of $D\\to b_1(1235)\\ell^+ν_\\ell, b_1(1235)\\toωπ$ and find distinct behavior among various hadronic transition form factors. Further amplitude analysis with larger statistics is thus desired to test these theoretical predictions.","authors":"Yijia Zeng, Hailong Ma","nlinked":22,"nref":22,"src":"INSPIRE","html":true},{"id":"3231200","arxiv":"2611.25062","title":"Naturalness scale inference in chiral perturbation theory and chiral logarithms","first":"Hassanzadeh","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[813721]] (coupling 0.02, 4 shared references).","score":16.6,"rank":12,"section":"new","parts":[0.45,0.0,0.05,0.0,0.0],"abstract":"We infer naturalness scales of chiral perturbation theory in the mesonic sector using Bayesian techniques that are extended to explicitly take into account chiral logarithms. To demonstrate our approach, we consider the chiral expansion of the pion decay constant $F_π$ and the threshold and subthreshold parameters of $ππ$ scattering. We find a strong observable dependence of the inferred naturalness scales, and show that they need not coincide with the pion mass at which the order-by-order hierarchy of the chiral expansion breaks down. As an application, we discuss the requirements for lattice-QCD constraints on the two combinations of $O(p^6)$ low-energy constants that in the current matching of Roy-equation analyses to chiral perturbation theory need to be estimated from resonance saturation, but could be extracted from the pion-mass dependence of $ππ$ scattering parameters.","authors":"Tara Hassanzadeh, Martin Hoferichter, Lucas Platter, Jacobo Ruiz de Elvira, Matthias R. Schindler","nlinked":57,"nref":60,"src":"INSPIRE","html":true},{"id":"3231208","arxiv":"2611.24985","title":"Hadron masses and pseudoscalar meson form factors in a Poincaré-invariant constituent quark model","first":"Baek","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[1862925]] (coupling 0.02, 1 shared references).","score":16.5,"rank":13,"section":"new","parts":[0.45,0.0,0.04,0.0,0.0],"abstract":"We study a Poincaré-invariant constituent quark model with pair, fine-structure, and finite-range three-quark interactions treated in the diagonalization. A fit of 20 parameters to 36 meson and 27 baryon masses gives an rms deviation of $6.85\\,\\mathrm{MeV}$, with the common offset fixed by a spectral condition. The same mass-fit wave functions give the elastic form factors of ten pseudoscalar mesons in the light-front impulse approximation with the Melosh rotation. The pion and charged-kaon radii are $0.407$ and $0.411\\,\\mathrm{fm}$, below the measured values. Unlike experiment, the kaon radius slightly exceeds the pion radius. Replacing the pion radial function by the normalized $S$-wave component of the $ρ$ raises its radius to $0.604\\,\\mathrm{fm}$, showing that hyperfine compression accounts for most of the deficit in the mean-square charge radius. With the light-quark size fixed by the pion, the $K^+$ and $K^0$ radii require strange-quark sizes that differ by $2.2$ standard deviations.","authors":"Jongheon Baek","nlinked":55,"nref":55,"src":"INSPIRE","html":true},{"id":"3211641","arxiv":"2610.05727","title":"Bakamjian--Thomas construction and light-front zero modes in pseudoscalar transitions: A comparison with the covariant Bethe--Salpeter model","first":"Choi","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3227657]] (coupling 0.01, 1 shared references).","score":16.4,"rank":14,"section":"replacement","parts":[0.45,0.0,0.04,0.0,0.0],"abstract":"We examine the role of light-front zero modes in the extraction of the semileptonic form factor $f_-(q^2)$ between pseudoscalar mesons. In an exactly solvable covariant Bethe--Salpeter (BS) model, we calculate the transverse-current zero-mode contribution directly from the shrinking nonvalence region and reproduce it with an effective operator in the valence convolution. In the valence-only light-front quark model (LFQM) based on the Bakamjian--Thomas (BT) construction, the one-body current is built from on-shell constituent spinors, and the interaction enters through the mass operator and wave functions. The $(+,\\perp)$ extraction of $f_-$ is zero-mode free and is saturated by the on-shell overlap. Using the free constituent invariant masses in the internal minus-current projection gives the same $f_-$ from $(+,-)$ after integration. For spacelike momentum transfer, we prove this equality for rotationally invariant radial wave functions with the light-front Jacobian and the adopted pseudoscalar spin coupling, provided the reduced overlaps converge. Subtracting the minus-current result obtained with physical meson masses from the common transverse result gives the BT completion. Current-component independence indirectly identifies this completion as the effective zero-mode contribution missing from the physical-mass minus-current extraction. When the BS valence current and the effective zero-mode operator for the nonvalence endpoint contribution are transferred unchanged to the Gaussian BT-based LFQM, the resulting expression fails to reproduce the component-independent BT result for $f_-$. We construct a mass-weighted complex transverse contour on which the Gaussian wave functions remain analytic for $0<q^2<(m_1+m_2)^2$, where $m_1$ and $m_2$ are the initial and final active-quark masses.","authors":"Ho-Meoyng Choi","nlinked":60,"nref":60,"src":"INSPIRE","html":true},{"id":"3167932","arxiv":"2606.12915","title":"Mass Varying Neutrino Oscillation in Teleparallel Gravity","first":"Sadjadi","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1854224]] (coupling 0.04, 5 shared references). Closest network paper: [[1796007]] (coupling 0.05, 10 shared references). Shared topics: neutrino mass.","score":11.6,"rank":15,"section":"replacement","parts":[0.06,0.1,0.14,0.0,0.43],"abstract":"In the Cartan teleparallel formulation of gravity, a scalar field coupled to the torsion tensor can acquire an environment-dependent effective mass. This gives rise to a screening effect: inside dense bodies such as the Sun, the scalar field is suppressed, causing the neutrino mass to vary with local density. We investigate the impact of this torsion-induced screening on solar neutrino oscillations. The mechanism modifies the standard MSW resonance condition distinctly, leading to detectable shifts in the flavor conversion probability. Using data from solar neutrino experiments (Super-Kamiokande, Borexino, SNO), we place constraints on the torsion scalar coupling parameters. Our work provides a concrete test of teleparallel gravity through mass-varying neutrino oscillations.","authors":"H. Mohseni Sadjadi, H. Yazdani Ahmadabadi","nlinked":77,"nref":80,"src":"INSPIRE","html":true},{"id":"3231299","arxiv":"2611.25872","title":"Majorana dark matter from a thick-to-thin brane junction: Modal stability, real-mediator coannihilation, and a dark-radiation imprint","first":"Brito","nauth":1,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1746620]] (coupling 0.04, 4 shared references). Closest network paper: [[2958466]] (coupling 0.10, 6 shared references). Shared topics: majorana mass.","score":11.1,"rank":16,"section":"new","parts":[0.0,0.13,0.29,0.0,0.27],"abstract":"We show that the localized spectrum of a $D=7$ thick-to-thin brane junction can host a thermal Majorana dark-matter candidate. The anisotropy of the wall widths isolates a light junction fermion, which a four-dimensional Majorana mass splits into two nearby states. The factorized transverse profiles impose a modal selection rule on all cubic couplings, and together with the relaxation of the softly deformed background this makes the lighter state stable without an imposed dark parity. Because the localized mediator is a real scalar, identical Majorana particles annihilate in the $s$ wave, and the relic coupling becomes nearly independent of the Majorana mass. The junction sector is a Standard-Model singlet whose light chiral mode is a source of dark radiation. Current CMB data restrict its decoupling temperature and imply $0.05\\lesssim\\dNeff\\lesssim0.076$ for dark-matter masses between $10\\GeV$ and $1.5\\TeV$, a range accessible to next-generation CMB surveys.","authors":"F. A. Brito","nlinked":39,"nref":39,"src":"INSPIRE","html":true},{"id":"3231393","arxiv":"2611.26303","title":"Towards Consistent Thermal Resummation: Improved Partial Dressing for Precise Electroweak Phase Transition Predictions","first":"Qiu","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1402978]] (coupling 0.02, 4 shared references). Closest network paper: [[2862278]] (coupling 0.11, 28 shared references). Shared topics: inert doublet.","score":11.1,"rank":17,"section":"new","parts":[0.0,0.06,0.31,0.0,0.46],"abstract":"Reliable predictions for the electroweak phase transition depend critically on a consistent resummation of thermal fluctuations. However, existing prescriptions often entail sizable uncertainties, motivating the development of a robust and systematically controlled resummation scheme. In this work, we develop an improved partial dressing (IPD) scheme that resolves intrinsic inconsistencies in the original partial dressing prescription, including the overlapping momentum problem and the associated divergences in the gap equations. By consistently incorporating momentum-dependent self-energies and reorganizing the daisy resummation, the IPD scheme provides a more systematic framework for thermal resummation. We perform a comprehensive comparison of 5 different resummation prescriptions in the well-motivated inert doublet model and demonstrate that the choice of resummation scheme can substantially affect the predicted phase transition parameters and the resulting gravitational wave spectra. Notably, the IPD prescription yields a reliable potential and comparatively robust phenomenological predictions, highlighting the importance of a self-consistent treatment of thermal corrections. Our results establish the theoretical consistency of IPD and demonstrate that controlling resummation uncertainties is essential for reliable predictions of cosmological phase transitions and their gravitational wave signatures.","authors":"Dayun Qiu, Fa Peng Huang","nlinked":86,"nref":90,"src":"INSPIRE","html":true},{"id":"3151200","arxiv":"2605.01318","title":"Gravitational waves from CP domain wall collapse and electron EDM in a complex singlet model with dimension-five Yukawa interactions","first":"Pham","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.04, 4 shared references). Closest network paper: [[1847368]] (coupling 0.07, 5 shared references). Shared topics: singlet scalar.","score":11.0,"rank":18,"section":"replacement","parts":[0.06,0.11,0.19,0.0,0.29],"abstract":"We study the interplay between gravitational waves (GWs) from domain wall collapse and the electron electric dipole moment (EDM) in a complex singlet extension of the standard model with dimension-five Yukawa interactions. In this framework, the scalar potential admits CP-related degenerate vacua, leading to the formation of CP domain walls. While the resulting GW signal provides a probe of the vacuum structure of the singlet scalar sector, it does not by itself constitute a CP-violating observable. Once the singlet scalar is coupled to standard model fermions, CP-violating phases become observable through EDMs. We analyze whether current and future EDM experiments can probe the parameter region where the GW signal is detectable by SKA and THEIA. We find that the current electron EDM bound already constrains part of the parameter space, while future sensitivities at the level of $10^{-31}$--$10^{-32}\\,e\\,\\mathrm{cm}$ can probe regions overlapping with the GW-detectable domain. Our results highlight the complementarity between GW and EDM observables in probing the singlet scalar sector, providing a coherent picture of its vacuum structure and CP properties.","authors":"Hieu The Pham, Eibun Senaha","nlinked":72,"nref":78,"src":"INSPIRE","html":true},{"id":"3231421","arxiv":"2611.26417","title":"Thermal Resummation Effects on Electroweak Phase Transitions and Gravitational Waves in Conformal and Non-Conformal 2HDMs","first":"Zhao","nauth":3,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[902365]]. Closest of your papers: [[1402978]] (coupling 0.02, 3 shared references). Closest network paper: [[3219721]] (coupling 0.16, 16 shared references).","score":10.3,"rank":19,"section":"new","parts":[0.06,0.05,0.45,0.0,0.0],"abstract":"We quantify how thermal resummation affects electroweak phase transitions and gravitational-wave predictions in classically conformal and non-conformal two-Higgs-doublet models. We compare multi-field partial dressing (PD), which retains the full thermal functions and determines scalar masses and mixing from gap equations, with the Parwani and Arnold-Espinosa (AE) prescriptions at identical zero-temperature inputs. Completed first-order transitions dominate the conformal scan under all three prescriptions. PD typically gives the strongest and most supercooled transitions, reaching $T_p/T_c \\simeq 0.5$ versus $T_p/T_c \\gtrsim 0.8$ for Parwani and AE. At every conformal point where all three predict completion, PD gives the largest gravitational-wave peak amplitude, followed by Parwani and AE. The non-conformal model has no universal ordering, and the prescription changes the type of thermal history across extended regions of parameter space. For representative benchmarks, PD and AE differ by up to about nine orders of magnitude in peak amplitude and a factor of about fifty in peak frequency. In multi-field PD, the dressed tadpole is not a gradient, so the reconstructed potential depends on the integration path. In benchmark tests, changing the path shifts the transition temperatures by at most about 7% and the peak amplitude by up to a factor of about three. This intrinsic ambiguity is smaller than the largest differences between prescriptions. Thermal resummation is a major source of uncertainty in these phase-transition and gravitational-wave predictions.","authors":"Yu-Bo Zhao, Ji-Wei Li, Zhi-Wei Wang","nlinked":80,"nref":84,"src":"INSPIRE","html":true},{"id":"3070028","arxiv":"2510.13723","title":"Unified Origin of Dirac Neutrino and Asymmetric Dark Matter Masses via a Dirac-Type Leptogenesis","first":"Ishida","nauth":3,"year":2025,"cites":3,"role":"other","note":"","score":null},{"id":"2690106","arxiv":"2308.10946","title":"Effective Interactions for the SM Fermion Mass Hierarchy and their Possible UV Realization","first":"Cárcamo Hernández","nauth":4,"year":2023,"cites":2,"role":"seed","note":"","score":null},{"id":"3193100","arxiv":"","title":"Review of Particle Physics","first":"Takahashi","nauth":259,"year":2026,"cites":542,"role":"other","note":"","score":null},{"id":"3139191","arxiv":"2604.02604","title":"Probing Freeze-In Dark Matter via a Spin-2 Portal at the LHC with Vector Boson Fusion and Machine Learning","first":"Liu","nauth":2,"year":2026,"cites":2,"role":"other","note":"","score":null},{"id":"1501489","arxiv":"1612.00511","title":"Anatomy of the Inert Two Higgs Doublet Model in the light of the LHC and non-LHC Dark Matter Searches","first":"Belyaev","nauth":5,"year":2016,"cites":271,"role":"other","note":"","score":null},{"id":"2817040","arxiv":"","title":"Review of particle physics","first":"Navas","nauth":244,"year":2024,"cites":6732,"role":"other","note":"","score":null},{"id":"3206672","arxiv":"2609.26876","title":"Precise QCD Predictions for the Scotogenic Model at Colliders","first":"Boukidi","nauth":3,"year":2026,"cites":0,"role":"other","note":"","score":null},{"id":"3219721","arxiv":"2610.35444","title":"Probing the singlet-triplet scotogenic model with lepton flavor violation, gravitational waves and dark matter","first":"Li","nauth":4,"year":2026,"cites":0,"role":"other","note":"","score":null},{"id":"1220579","arxiv":"1302 ,"c"],[49,40,"c"],[8,28,"c"],[3,24,"c"],[15,30,"k"],[21,46,"c"],[28,46,"c"],[26,24,"c"],[8,32,"k"],[13,21,"c"],[21,64,"c"],[33,24,"c"],[19,68,"c"],[0,36,"k"],[34,28,"c"],[14,43,"k"],[9,44,"k"],[14,47,"k"],[60,24,"c"],[30,51,"c"],[3,49,"c"],[8,50,"k"],[55,45,"c"],[1,38,"c"],[68,53,"c"],[58,67,"c"],[5,54,"k"],[17,57,"k"],[11,21,"c"],[58,52,"c"],[24,46,"c"],[36,24,"c"],[16,60,"k"],[5,22,"k"],[6,21,"c"],[7,64,"k"],[21,28,"c"],[56,23,"c"],[2,49,"c"],[24,44,"c"],[5,71,"k"],[27,52,"c"],[5,27,"k"],[42,49,"c"],[71,23,"c"],[61,37,"c"],[34,23,"c"],[17,33,"k"],[61,38,"c"],[17,38,"k"],[3,39,"k"],[0,41,"k"],[3,42,"k"],[51,27,"c"],[50,46,"c"],[9,24,"c"],[34,50,"c"],[24,28,"c"],[59,44,"c"],[31,50,"c"],[49,61,"c"],[1,24,"c"],[41,46,"c"],[15,51,"k"],[42,27,"c"],[0,52,"c"],[49,38,"c"],[0,56,"c"],[7,21,"c"],[37,27,"c"],[0,58,"k"],[2,42,"k"],[9,59,"c"],[40,37,"c"],[48,41,"c"],[1,61,"k"],[25,42,"c"],[69,24,"c"],[17,24,"c"],[68,24,"c"],[8,24,"c"],[40,38,"c"],[0,67,"k"],[36,23,"c"],[3,70,"k"],[25,36,"c"],[49,70,"c"]],"next":[{"arxiv":"2604.05041","id":"3140676","title":"Aspects of a Five-Dimensional $U(1)_{L_μ- L_τ}$ Model at Future Muon-Based Colliders","authors":"Dibyendu Chakraborty, Arindam Chatterjee, AseshKrishna Datta, Ayushi Kaushik, Kenji Nishiwaki","score":8.9,"section":"replacement","rank":20,"parts":[0.0,0.05,0.37,0.0,0.18],"note":"Closest of your papers: [[1854224]] (coupling 0.02, 2 shared references). Closest network paper: [[1918090]] (coupling 0.13, 17 shared references). Shared topics: gauge symmetry.","abstract":"We study a five-dimensional (5D) framework based on the $U(1)_{L_μ-L_τ}$ gauge symmetry, where the associated gauge field $V$ propagates in the bulk, giving rise to an infinite tower of Kaluza--Klein (KK) excitations $V^{(n)}$ that couple selectively to the second- and third-generation leptons. Originally motivated by its potential to address the muon $g-2$ anomaly, this framework remains of interest as a minimal, anomaly-free, phenomenologically well-motivated extension of the Standard Model (SM) of particle physics. We focus on high-energy muon-based colliders, which could directly probe the gauge structure without relying on the kinetic mixing between the SM hypercharge gauge boson and the 5D gauge boson $V$. We explore a set of complementary processes: the elastic $μ^+μ^+ \\to μ^+μ^+$ scattering via off-shell exchange of KK (gauge) excitations $V^{(n)}$; the bremsstrahlung production of $V^{(n)}$ followed by their decays into neutrinos and into $μ^-μ^+$ at a future $μ$TRISTAN collider. Further, we study the $μ^-μ^+ \\to μ^-μ^+$ scattering via resonant KK excitation(s) at a future muon collider. Our results show that these future muon-based colliders could offer sensitive and complementary probes into regions in the parameter space of the scenario that are beyond the reach of low-energy experiments. In particular, such experiments would be able to probe both heavier such KK gauge bosons with TeV-scale masses for relatively large gauge couplings, as well as the much lighter ones with masses in the MeV-scale for couplings as weak as $g_D \\sim \\mathcal{O}(10^{-5})$, thereby offering a promising $2σ$ exclusion reach for such KK excitations, over an extensive range of masses, at these facilities."},{"arxiv":"2611.25795","id":"3231298","title":"Parity restoration in a sterile-neutrino scenario: bounds from atomic parity violation to the LHC","authors":"Iman Motie, She-Sheng Xue, Alain Blanchard","score":8.7,"section":"new","rank":21,"parts":[0.06,0.07,0.31,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1708009]] (coupling 0.02, 1 shared references). Closest network paper: [[2917228]] (coupling 0.11, 9 shared references).","abstract":"In a four-fermion-interaction scenario beyond the Standard Model (SM), in which right-handed (sterile) neutrinos take part in TeV-scale composite dynamics, the $Z$ boson acquires an energy-dependent right-handed coupling $\\GR(q^2)$ that is expected to vanish at low energies and to restore parity symmetry at high energies. We derive the contribution of $\\GR$ to neutral-current parity-violating observables. At first order in $\\GR$, every low-energy parity-violating coupling is obtained from its SM value by the replacement $\\sin^2θ_W\\to\\sin^2θ_W(1-\\GR)$; in particular the nuclear weak charge is shifted by $ΔQ_W=4\\sin^2θ_W\\,Z\\,\\GR$, while the $Z$-pole effective mixing angle is shifted by $-\\tfrac12(1-2\\sin^2θ_W)\\GR$. Using atomic parity violation in cesium, parity-violating electron scattering and $Z$-pole determinations of $\\sin^2θ_{\\rm eff}$, we extract $\\GR$ at each momentum transfer. All data are consistent with $\\GR=0$; at the $Z$ pole we find $\\GR(m_Z)<1.1\\times10^{-3}$ (95\\% CL). We then use the CMS measurement of the Drell--Yan forward--backward asymmetry at dilepton masses above 170~GeV to constrain the coupling directly at TeV momentum transfer, finding $\\GR<0.04$ (95\\% CL) for $0.2<\\sqrt{q^2}<2$~TeV. Combining both, the scale of parity restoration in a running $\\GR=q^{2n}/(q^{2n}+Λ^{2n})$ must satisfy $Λ>3.8$, $2.1$ and $1.7$~TeV for $n=1,2,3$. Future MOLLER, P2 and HL-LHC data will improve these bounds."},{"arxiv":"2611.26549","id":"3231449","title":"Refractive Neutrino Mass: Effects of Fluctuations of the Dark Matter Field","authors":"Soham Sahasrabuddhe, Manibrata Sen, Alexei Y. Smirnov","score":8.3,"section":"new","rank":22,"parts":[0.0,0.02,0.17,0.0,0.52],"note":"Closest of your papers: [[1854224]] (coupling 0.01, 1 shared references). Closest network paper: [[2719600]] (coupling 0.06, 4 shared references). Shared topics: neutrino mass. Your watch topics: neutrino background.","abstract":"Observed neutrino oscillations can be reproduced by a refractive neutrino mass-squared arising from interactions with ultralight scalar dark matter (ULDM). The wave behaviour of the scalar field gives rise to a fluctuating interference pattern, inducing spatial and temporal variations in the refractive mass that can distort neutrino oscillation probabilities. We simulate the interference patterns of the scalar field in the presence of self-interactions. Using results of these simulations, the oscillation probabilities for JUNO and T2K experiments are computed. We find that the refractive mass scenario remains viable for the complex scalar field without self-coupling for $m_φ\\lesssim 10^{-16}~\\mathrm{eV}$. For $m_φ\\gtrsim10^{-16}~\\mathrm{eV}$, repulsive self-interactions narrow the density distribution, reducing the deviation of the survival probability at the first minimum to $ΔP \\approx 0.07$ for an appropriate self-interaction coupling. In contrast, for a real scalar field, rapid oscillations with the Compton frequency distort the probabilities for scalar masses $ 10^{-22}~\\mathrm{eV} \\lesssim m_φ\\lesssim 10^{-10} ~\\mathrm{eV}$, and self-interactions do not remove this distortion. This distortion becomes negligible only for $m_φ\\gtrsim10^{-9}~\\mathrm{eV}$. We explore additional effects which could modify the interference pattern and relax the constraints on the required values of $m_φ$. These include scenarios with multiple scalar fields (the axiverse), the gravitational effects of the Sun and Earth on the granule structure, and interactions with the relic neutrino background."},{"arxiv":"2611.25359","id":"3231262","title":"Dark Matter Model Implications of a Candidate Sub-halo Near the Sun, and the Data Needed to Discriminate Among Them","authors":"Stefano Profumo, Sukanya Chakrabarti","score":7.7,"section":"cross","rank":23,"parts":[0.0,0.04,0.18,0.0,0.4],"note":"Closest of your papers: [[677884]] (coupling 0.01, 1 shared references). Closest network paper: [[2719600]] (coupling 0.06, 6 shared references). Shared topics: indirect detection, dark matter model.","abstract":"Pulsar-timing accelerations point to a localized mass concentration near the Sun, consistent with a dark matter sub-halo. We work out what such an object implies for the nature of dark matter, organizing the implications by their observable effect: suppression or enhancement of structure formation, internal structure and survival after formation, and emission or scattering by the constituents. We discuss ultralight wave dark matter, thermal and nonthermal warm dark matter, dark acoustic oscillations and dark matter-baryon scattering, elastic and inelastic self-interactions, invisible decays with recoil, primordial black holes, indirect detection, and a possible connection to the LUX-ZEPLIN high-energy recoil candidate. We then ask what new data would discriminate among these models. The existing accelerations are measured outside the tidal radius, where they are blind to the interior mass distribution, to the object's velocity, and to the sub-halo population. We identify four routes that lift these degeneracies: accelerations measured inside the halo, which separate point-mass, cuspy, and cored profiles; lensing and accretion, which test whether the mass is compact; the morphology of annihilation or decay emission, which probes the inner profile; and a search for a comoving stellar population, which tests whether the object is dark and measures its velocity. We also contrast this program with pulsar-timing-array searches for transiting dark matter substructure, which probe vastly lighter objects through a different observable."},{"arxiv":"2611.26281","id":"3231427","title":"Predictions for Inclusive Production Cross Sections of the Higgs Boson at the LHC and HL-LHC","authors":"Robin Hayes, Alexander Karlberg, Bernhard Mistlberger, Dermot Moran, Hannah Arnold, Gaetano Barone, Christian Biello, Johannes Blümlein, Valeria Botta, Christian Brønnum-Hansen, Alessandro Calandri, Benjamin Campillo, Alessandra Cappati, Andrea Cardini, Suman Chatterjee, Jiayi Chen, Michal Czakon, Valerio Dao, Goutam Das, Felix Eschment, Silvia Ferrario Ravasio, Giancarlo Ferrera, Alessandro Gavardi, Yanping Huang, Alexander Huss, Stephen Jones, Judith Katzy, Sven Yannick Klein, Matthew Lim, Stefano Manzoni, Josh McFayden, Sven-Olaf Moch, Alexander Mück, Marco Niggetiedt, Mathieu Pellen, Christian T. Preuss, Tom Schellenberger, Lukas Simon, Michael Spira, Lourdes Urda Gómez, Davide Valsecchi, Marco Vitti, Marius Wiesemann, Malgorzata Worek, Sebastian Wuchterl, Silvia Zanoli, Marco Zaro, Licheng Zhang","score":7.4,"section":"new","rank":24,"parts":[0.06,0.02,0.32,0.0,0.0],"note":"Also cites widely used network papers: [[1494411]]. Closest of your papers: [[1615477]] (coupling 0.01, 3 shared references). Closest network paper: [[1494411]] (coupling 0.11, 84 shared references).","abstract":"We present updated recommendations of the LHC Higgs Working Group (LHCHWG) for the inclusive production cross sections of a Standard Model Higgs boson in proton--proton collisions at centre-of-mass energies between $7$ and $14$ TeV, including the Run-3 energy of $13.6$ TeV, and for Higgs-boson masses between $120$ and $130$ GeV. All the major production modes are covered. The central values remain consistent with those of Yellow Report 4 (YR4) [arXiv:1610.07922] within the uncertainties quoted there, while the theoretical uncertainties are reduced for most production modes. The improvements rest on specific calculations rather than on a uniform advance: the complete N$^3$LO result in the heavy-top limit together with exact NNLO top-quark mass effects for gluon fusion; the N$^3$LO structure-function calculation supplemented by non-factorisable corrections for vector-boson fusion; the completion of the NLO QCD corrections to the loop-induced $gg\\to ZH$ channel for $VH$; NNLO QCD matched to NNLL soft-gluon resummation and combined with NLO electroweak corrections for $t\\bar{t}H$, and updated predictions for $tH$; and the matched four- and five-flavour-scheme prediction, with its explicit resummation-scale uncertainty, for $b\\bar{b}H$. Since no PDF4LHC recommendation exists beyond NNLO, the mismatch between an N$^3$LO matrix element and NNLO distributions has to be carried as an uncertainty, estimated process by process: it is well determined for vector-boson fusion, whereas for gluon fusion it is doubled relative to YR4. PDFs are now the leading source of uncertainty for the most precisely predicted modes, while residual perturbative uncertainties dominate for the remainder. These results supersede the inclusive cross sections of YR4 and the ad interim recommendations of Ref. [arXiv:2402.09955], and form part of Report 5 of the LHCHWG."},{"arxiv":"2611.25036","id":"3231213","title":"Simulation-based inference for gravitational-wave cosmology: parameter reconstruction of a first-order electroweak phase transition","authors":"Thomas Biekötter, Andrii Dashko, Kateryna Radchenko","score":7.4,"section":"cross","rank":25,"parts":[0.0,0.07,0.35,0.0,0.0],"note":"Closest of your papers: [[2080612]] (coupling 0.03, 3 shared references). Closest network paper: [[3157653]] (coupling 0.12, 25 shared references).","abstract":"The detection of a stochastic gravitational-wave background (SGWB) from a cosmological first- order phase transition would be unambiguous evidence for physics beyond the Standard Model, with a strong electroweak phase transition (EWPT) at LISA as a prime example. Reconstructing the underlying model from such a signal is challenging, since the map from the model parameters to the spectrum is degenerate and strong transitions occupy only small and sparse regions of parameter space. We show that simulation-based inference (SBI), a likelihood-free approach applicable to generic SGWB sources, provides a reliable parameter reconstruction despite these difficulties. We first apply SBI to the thermodynamic parameters characterizing the transition, namely its strength, inverse duration, temperature and bubble wall velocity. As a concrete application, we then consider a strong EWPT in a singlet extension of the Standard Model and reconstruct the model parameters from the resulting SGWB. We find that the SBI posteriors agree with those of a likelihood-based Markov chain Monte Carlo analysis, at negligible cost per data set once the network has been trained. Using the network posterior as the proposal for importance sampling with the exact likelihood further corrects its remaining deviations, at a sampling efficiency several orders of magnitude higher than sampling from the prior. SBI thus offers a fast and flexible framework for the cosmological science case of LISA"},{"arxiv":"2610.38463","id":"3220160","title":"Gauge-parameter cancellation and finite form factors in one-loop quark scattering in the refined Gribov-Zwanziger framework","authors":"Wan Wu","score":7.4,"section":"replacement","rank":26,"parts":[0.0,0.15,0.2,0.0,0.0],"note":"Closest of your papers: [[1746620]] (coupling 0.05, 3 shared references). Closest network paper: [[2940264]] (coupling 0.07, 4 shared references).","abstract":"We calculate the one-loop amplitude for distinct-flavor massless quark scattering in a local BRST-invariant refined Gribov-Zwanziger theory with minimally coupled quarks. The constraint determinant and two dynamical quark flavors are included in the action and loop sum. Retaining the RGZ masses in the free field matrix, we combine the mixed self-energy insertion, complete vertex and box corrections, and external-leg residues. The difference between a general linear covariant gauge and a reference gauge vanishes symbolically after removal of the Stueckelberg regulator in the specified dimensional prescription. We separate ultraviolet and infrared poles, including contributions hidden by scaleless integrals and the order of mass and dimensional limits. Local modified-minimal-subtraction counterterms cancel the ultraviolet poles, and the remaining infrared poles cancel in the stated nonzero-mass domain. The finite result is supplied as eight color-spin form factors over a thirty-entry scalar integral inventory, with all 144 finite-function coefficients provided electronically. Physical-region benchmarks evaluate the scalar functions on a common analytic sheet. Along a specified common-mass scaling path, the four physical color-helicity coefficients approach the QCD finite hard amplitudes numerically at three scattering angles after an explicit infrared conversion. Infrared helicity differences isolate color-dependent mass corrections beyond a universal rescaling of the Born exchange. A low-momentum expansion identifies an effective contact-interaction scale and clarifies the suppression relative to massless exchange. The result defines a partonic amplitude on a specified analytic branch; it does not establish a unitary colored-state S matrix or an inclusive next-to-leading-order cross section."},{"arxiv":"2611.25060","id":"3231241","title":"The BSM Rollercoaster, 1980-2000","authors":"Savas Dimopoulos","score":7.0,"section":"new","rank":27,"parts":[0.0,0.1,0.27,0.0,0.0],"note":"Closest of your papers: [[1394206]] (coupling 0.03, 3 shared references). Closest network paper: [[1410582]] (coupling 0.09, 11 shared references).","abstract":"This contribution is a personal historical retrospective on beyond-the-Standard-Model (BSM) physics from 1978 to the early 2000s, organized around its emotional rollercoaster. I trace two waves of optimism separated by a multiyear contraction of confidence, both ultimately ending in disappointment when decisive experimental confirmation failed to arrive. The story begins in 1978, when the Standard Model emerged as the front-runner. It then moves from the first wave of excitement over naturalness and Technicolor, rumored proton-decay events, and the construction of the Minimal Supersymmetric Standard Model, to the contraction of confidence in the late 1980s. A dramatic revival came in 1991, when the LEP and SLC precision data pointed toward supersymmetric unification, but it eventually gave way to renewed disappointment over the absence of superpartners and the sharpening of the LEP paradox. I also describe how the realization that Newtonian gravity had been tested only down to distances of order centimeters opened the door to large extra dimensions. Finally, I discuss how Weinberg's 1987 anthropic argument for the cosmological constant, the 1998 discovery of cosmic acceleration, and the emergence of the string landscape changed the intellectual status of naturalness itself and led to Split Supersymmetry. I have tried to describe not only what was proposed, but why these ideas felt compelling at the time, why confidence rose and fell, and how later evidence changed our sense of what could count as an explanation."},{"arxiv":"2611.25016","id":"3231212","title":"Automate the geometric SMEFT at dimension eight","authors":"Benoît Assi, Adam Martin","score":6.8,"section":"new","rank":28,"parts":[0.06,0.06,0.2,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2859009]] (coupling 0.02, 2 shared references). Closest network paper: [[2630211]] (coupling 0.07, 8 shared references).","abstract":"We present the first complete dimension-eight implementation of the geometric Standard Model Effective Field Theory (geoSMEFT) as UFO models for event generators such as MadGraph. The models contain all 674 baryon-number-conserving operators, with minimal flavour violation for the fermionic operators, and are also provided in the Murphy basis. We include dimension-six contributions and electroweak input-parameter corrections consistently through order $1/Λ^4$, and provide dimension-eight squared contributions as a diagnostic of EFT truncation. We validate the implementation against independent calculations and Ward identities. To make these models practical for collider studies, we develop a standalone tool that identifies all operators contributing to a given process at tree level, including those entering through input-parameter shifts. It reports their expected energy scaling and generates a restriction card to reduce the computational cost of event generation. The same geometric construction allows us to calculate two- and three-point functions beyond dimension eight, to arbitrary order in $1/Λ^2$. The models and the tool are publicly available."},{"arxiv":"2607.20340","id":"3182562","title":"Monopoles, Strings, Walls and Gravitational waves","authors":"Rinku Maji, Qaisar Shafi","score":6.7,"section":"replacement","rank":29,"parts":[0.0,0.06,0.2,0.0,0.18],"note":"Closest of your papers: [[2690106]] (coupling 0.02, 2 shared references). Closest network paper: [[2828434]] (coupling 0.07, 8 shared references). Shared topics: gauge symmetry.","abstract":"The gauge symmetry breaking $SU(2) \\to U(1) \\to Z_2 \\to 1$ successively produces monopoles, strings and domain walls bounded by strings (WBS), with the elementary monopole carrying a $U(1)$ magnetic flux twice as large as the elementary string. The elementary strings and subsequently WBS emit gravitational waves, and during their decay, the WBS yield a network of composite strings that carry the same $U(1)$ flux as the monopoles. Depending on the cosmological evolution, we provide the gravitational wave spectra generated by the elementary strings and WBS, in combination with the composite strings which are either effectively stable, quasistable, or metastable. These three scenarios are also realized in the symmetry breaking chain $SU(3) \\to SO(3) \\to Z_2 \\to 1$. Both $SU(2)$ and $SU(3)$ have appeared in the literature as flavor gauge symmetries."},{"arxiv":"2611.25846","id":"3231317","title":"Resonant Cavity Searches for Millicharged Dark Matter","authors":"Miguel González Albert, Ariel Arza, Saarik Kalia","score":6.5,"section":"new","rank":30,"parts":[0.0,0.08,0.22,0.0,0.07],"note":"Closest of your papers: [[2855387]] (coupling 0.03, 4 shared references). Closest network paper: [[1955022]] (coupling 0.08, 9 shared references).","abstract":"A plethora of resonant cavity experiments have been designed to search for ultralight dark matter (DM) candidates, such as axion or dark-photon DM. In this work, we show that these same apparatuses can be sensitive to ultralight millicharged dark matter (mDM) with masses $m_φ\\sim1-100\\,μ\\mathrm{eV}$. Similar to axion DM, in the presence of a background magnetic field, mDM acts as an effective current which can excite the modes of a resonant cavity. Importantly, for a cylindrical cavity, axion DM dominantly couples to the transverse magnetic (TM) modes, whereas mDM dominantly couples to the transverse electric (TE) modes. We project the sensitivity to mDM that resonant cavity experiments can achieve if they are able to tune and readout their TE modes. We find that fractional millicharges as small as $ε_m=e_m/e\\sim10^{-19}$ can be probed. If mDM constitutes only a subfraction $f_\\mDM \\lesssim0.2\\%$ of the total DM density, competing astrophysical bounds do not apply. In this case, resonant cavities can be the most sensitive probes of mDM in this mass range."},{"arxiv":"2611.26364","id":"3231402","title":"Quantum Autoencoder on Real Hardware for New Physics Searches at Muon Colliders","authors":"Shuai Zhang, Ji-Chong Yang","score":6.0,"section":"new","rank":31,"parts":[0.0,0.09,0.22,0.0,0.0],"note":"Closest of your papers: [[1615477]] (coupling 0.03, 2 shared references). Closest network paper: [[1866947]] (coupling 0.08, 6 shared references).","abstract":"We apply a quantum autoencoder to search for new physics (NP) in the tri-photon process $μ^+μ^-\\toγγγ$ at muon colliders. Using a six-qubit circuit on the Tianyan176 quantum computer, we measure the reconstruction losses for Standard Model (SM) events and anomalous quartic gauge couplings (aQGCs) events. The results demonstrate that the hardware-implemented quantum autoencoder effectively discriminates NP signals from the SM background. Concurrently, we derive the expected constraints on the aQGCs coefficients and compare them with those obtained from conventional methods."},{"arxiv":"2611.26418","id":"3231416","title":"Future avenues for precision oscillation measurements with compact movable reactors","authors":"Matheus Hostert, Stephan A. Meighen-Berger, Maxim Pospelov","score":5.5,"section":"new","rank":32,"parts":[0.0,0.08,0.2,0.0,0.0],"note":"Closest of your papers: [[1854224]] (coupling 0.03, 5 shared references). Closest network paper: [[3158607]] (coupling 0.07, 9 shared references).","abstract":"No planned neutrino experiment is expected to surpass Daya Bay's precision on $\\thone$. Doing so requires innovative strategies to reduce statistical and systematic uncertainties. In this study, we consider a futuristic program with a movable reactor antineutrino source placed within short distances ($L\\lesssim 3\\,\\km$) from the Jiangmen Underground Neutrino Observatory (JUNO) detector. Due to the large fiducial mass of JUNO, even a relatively small reactor can produce a statistically significant number of events over a few years to probe the $\\lesssim 8.7\\% \\,\\nuebar$ disappearance set by $\\thone$. We consider two possibilities: a $\\mathcal{O}(20\\mwth)$ microreactor in alcoves of the access tunnel to the underground laboratory, and a $\\mathcal{O}(400 \\mwth)$ unit on the surface. In both cases the reactor is observed by a small flux monitor detector near the source, while JUNO measures the antineutrino flux at two baselines, suppressing correlated flux and detector systematics. Using the measured Daya Bay per-isotope spectra and its covariance, we model a high-assay low-enriched uranium (HALEU) core for the microreactor and a low-enriched uranium (LEU) core for the surface unit, and discuss various potential sources of systematic uncertainties and their impact on the precision of $\\thone$. The underground microreactor could improve on JUNO's reach by a factor of three to four, to $\\relsth \\simeq 4\\%$ over a decade, while the surface reactor would reach the present global-fit precision, $\\relsth=2.5\\%$, in about three years, provided the emission rate is monitored across reactor relocations to the sub-percent level."},{"arxiv":"2607.22403","id":"3183164","title":"Non-Markovian heavy-quark equilibration and equilibrium correlation function in a thermal medium","authors":"Monisha Nair, Juan Torres-Rincon, Santosh K. Das","score":5.4,"section":"replacement","rank":33,"parts":[0.0,0.0,0.03,0.5,0.0],"note":"Co-authors of yours: Das. Closest network paper: [[3121930]] (coupling 0.01, 1 shared references).","abstract":"We compute the charm-quark current-current correlation function within the Langevin framework and extract the heavy-quark diffusion coefficient using the Green--Kubo formula. The formalism is further extended to evaluate the correlation function using a generalized Langevin equation that incorporates memory effects via an exponentially decaying memory kernel. We find that while memory effects qualitatively modify the transient structure of the current correlations, the value of the transport coefficient remains unchanged. In addition, we investigate heavy-quark thermalization in the presence of memory and compare the nonequilibrium solution of a generalized Fokker--Planck equation with the one obtained from the generalized Langevin equation in the non-relativistic limit. We also consider the relativistic case with correlated noise and observe that memory effects can give rise to a damped, oscillatory equilibration of the heavy quark momentum distribution in a non-Markovian bath."},{"arxiv":"2611.26170","id":"3231355","title":"Cardinal RG=GR: Phase-Space Cardinality and the Cosmological Constant and Hierarchy Problems","authors":"Laurent Freidel, Jerzy Kowalski-Glikman, Robert G. Leigh, Djordje Minic","score":4.8,"section":"cross","rank":34,"parts":[0.0,0.11,0.1,0.0,0.0],"note":"Closest of your papers: [[2030200]] (coupling 0.05, 4 shared references). Closest network paper: [[2149989]] (coupling 0.03, 3 shared references).","abstract":"The effective field theory approach constructs the low-energy theory by integrating out fluctuations above an ultraviolet scale which raises the cosmological constant and hierarchy problems. We investigate an alternative prescription in which the quantum theory is restricted to a finite accessible region of phase space, characterized by a dimensionless cardinality $\\mathcal N$, rather than by independently prescribed spacetime and momentum scales. At fixed cardinality these scales are related. For Euclidean de Sitter space, the stationarity condition for the gravitational action can then be written as a stationarity condition with respect to the momentum scale, a relation which we call Cardinal RG=GR. We demonstrate the relation between $\\mathcal N$ and the Gibbons-Hawking entropy of de Sitter space, compute the cosmological constant proportional to ${1}/{\\sqrt{\\mathcal N}}$, show that it is radiatively stable and apply the same prescription to demonstrate the radiative stability of the mass parameter for a simple interacting scalar field model, thereby illuminating the resolution of the hierarchy problem. We also establish a precise limit, involving gravitational data, in which the conventional results of Quantum Field Theory and the Renormalization Group are recovered."},{"arxiv":"2611.25581","id":"3231275","title":"A New Gravitational Wave Power Law from Dissipative Sound Waves in Cosmological Phase Transitions","authors":"Huai-Ke Guo, Sihao Xiao, Yang Xiao, Jin Min Yang, Yang Zhang","score":4.7,"section":"new","rank":35,"parts":[0.0,0.04,0.23,0.0,0.0],"note":"Closest of your papers: [[2690106]] (coupling 0.02, 1 shared references). Closest network paper: [[2969254]] (coupling 0.08, 6 shared references).","abstract":"Power-law behavior in cosmological gravitational wave (GW) spectra reveals the physical nature of their sources. For sound waves generated by cosmological first-order phase transitions, we identify a new high-frequency power law arising from the dissipative evolution of the acoustic source. In a dissipative plasma, the GW spectrum acquires an additional $q^{-2}$ suppression relative to the perfect-fluid result in the late-time, strong-damping limit. The exponent is largely insensitive to the source profile, while the turnover and suppression strength probe plasma transport and the source lifetime. In particular, the turnover frequency in weakly coupled hidden sector plasmas is sensitive to the underlying gauge coupling and can lie in the millihertz band targeted by space-based interferometers, opening a way to probe microscopic plasma dynamics through the detailed GW spectrum."},{"arxiv":"2611.26541","id":"3231445","title":"Self-gravity depletes superradiant clouds","authors":"Mateja Bošković, Lucas Gathercole, Thomas F. M. Spieksma, Samuel J. Witte","score":4.5,"section":"new","rank":36,"parts":[0.0,0.07,0.15,0.0,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.02, 3 shared references). Closest network paper: [[1944631]] (coupling 0.05, 12 shared references).","abstract":"Superradiant clouds of ultralight scalars around black holes are often modeled as free fields, whose levels grow independently and decay slowly through gravitational-wave emission. We show that this limit is never realized. The cloud's self-gravity redistributes particles between levels, just as in the case of axion self-interactions, and dominates over self-interactions for decay constants $f_a\\gtrsim6\\times10^{16}\\,{\\rm GeV}\\,(α/0.1)$, with $α$ the gravitational fine-structure constant. Self-gravity depletes the cloud by orders of magnitude and feeds more extended levels, weakening all signals that rely on the existence of a large cloud mass. A binary companion, however, can partly offset the depletion. Any assessment of superradiant signals must therefore account for both self-gravity and the cloud's environment."},{"arxiv":"2611.25044","id":"3231255","title":"Resonance-aware NLOPS matching for off-shell $t\\bar t+tW$ production in association with a Higgs boson","authors":"Patrick E. Hurley, Tomáš Ježo, Jonas M. Lindert","score":4.1,"section":"new","rank":37,"parts":[0.0,0.04,0.19,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.01, 3 shared references). Closest network paper: [[1494411]] (coupling 0.06, 29 shared references).","abstract":"We present a new NLO QCD Monte Carlo generator for the complete off-shell final state encompassing $t\\bar tH$ and $tWH$ production with dileptonic decays, matched to parton showers in the resonance-aware POWHEG-RES framework. At Born level the calculation corresponds to the process $pp\\to b\\bar b\\,e^+ν_e\\,μ^-\\barν_μ\\,H$ in the four-flavour scheme with massive $b$ quarks. The complete matrix elements include all double-resonant, single-resonant and non-resonant topologies, all interferences and spin correlations, with both top quarks and $W$ bosons treated in the complex-mass scheme. This approach provides a unified and consistent treatment of $t\\bar{t} H$ and $tWH$ production modes without the need for a diagram-removal or diagram-subtraction prescription. The generator, dubbed $\\texttt{bb4lH}$, is implemented in the POWHEG-RES framework with OpenLoops amplitudes, and takes advantage of the multiple-radiation scheme ($\\texttt{allrad}$) and of matrix-element-based resonance projectors. Semileptonic events are also supported and can be obtained from dileptonic ones, including QCD radiation in the hadronic $W$-boson decay. In addition, we present two new on-shell POWHEG generators for $t\\bar{t} H$ and $tWH$ production, the latter being the first of its kind. We validate all generators against known fixed-order results and in the narrow-width limit, and present NLO and NLOPS predictions for the LHC in the dileptonic and semileptonic channels. Tuned comparisons with the corresponding on-shell descriptions show good agreement for inclusive observables, while sizeable differences arise in observables sensitive to the reconstructed top-quark line shape and in $tWH$-enriched regions. These findings are of direct relevance for the LHC analysis of $t\\bar{t} H$ events and for the separation of $t\\bar{t} H$ and $tWH$ production."},{"arxiv":"2611.26594","id":"3231438","title":"UV Bounds on Inflationary Parity Violation","authors":"Alexander Cassem, Mark P. Hertzberg","score":4.1,"section":"cross","rank":38,"parts":[0.0,0.05,0.17,0.0,0.0],"note":"Closest of your papers: [[922002]] (coupling 0.02, 1 shared references). Closest network paper: [[2743646]] (coupling 0.06, 5 shared references).","abstract":"A question of fundamental interest is whether parity is violated on large scales in the Universe. This possibility has been motivated by recent analyses of the four-point matter correlation function. It has also been suggested that detectable parity violation could be generated during inflation by the dynamical Chern-Simons operator, a leading effective field theory correction to general relativity. In this work, we examine this possibility in realistic UV completions, including fermionic and string-theoretic examples. We show that existing bounds on the tensor-scalar-scalar (TSS) bispectrum strongly constrain the possibility of generating a detectable parity-odd trispectrum. For tensor-to-scalar ratios near current observational limits, detectability is incompatible with, or pushes against, the regime of validity of these UV completions. A detectable signal can remain possible for a sufficiently small tensor-to-scalar ratio, but only at the cost of an extremely large enhancement of the TSS vertex. Thus, while a future search for large scale parity violation is worth pursuing, generating a detectable signal within a consistent effective theory is highly nontrivial."},{"arxiv":"2611.25812","id":"3231312","title":"Direct simulation Monte Carlo for dark matter production and phase-space evolution","authors":"Felix Kahlhoefer, Ann Cathrin Wesener","score":4.0,"section":"new","rank":39,"parts":[0.0,0.05,0.12,0.0,0.07],"note":"Closest of your papers: [[2855387]] (co
